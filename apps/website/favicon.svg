    <circle cx="672" cy="706" r="176" fill="none" stroke="#0d5143" stroke-width="30"/>
    <circle cx="672" cy="706" r="132" fill="none" stroke="#0d5143" stroke-width="8"/>
    <path d="M598 712 l50 50 l104 -118" fill="none" stroke="#0d5143" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
