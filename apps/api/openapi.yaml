openapi: 3.1.0
info:
  title: Amtlos API
  version: "1"
  description: |
    Schnittstelle für Web-App, Mobile-App und (später) Steuerberatungen.

    - Anmeldung: `Authorization: Bearer <Token>` vom Identity-Provider (OIDC, E-014).
    - Mandant: Routen mit dem Parameter `X-Unternehmen-Id` laufen im Kontext dieses Unternehmens.
      Ohne Mitgliedschaft antwortet die API mit 404 – nie mit einem Hinweis, dass es das Unternehmen gibt.
    - Rollen: `x-rollen` nennt, welche Rollen eine Route aufrufen dürfen. Fehlt das Feld, dürfen alle Mitglieder.
    - Fehler: JSON `{ statusCode, message }`; Eingabefehler (422) zusätzlich `fehler: [{ feld, meldung }]`.
    - Texte kommen in der Sprache des Kontos (de/en).

    Diese Datei wird gegen die Routen der API geprüft (Test `openapi.test.ts`): jede Route muss hier stehen,
    mit denselben Rollen; hier darf nichts stehen, was es nicht gibt.
servers:
  - url: http://localhost:3001
    description: Entwicklung
security:
  - bearer: []

tags:
  - name: Konto
  - name: Profil und Ereignisse
  - name: Pflichten
  - name: Kalender
  - name: Team
  - name: Gründung und ELSTER
  - name: Finanzen
  - name: Personal
  - name: Arbeitsschutz
  - name: Datenschutz
  - name: Online
  - name: Branchen

paths:
  /v1/gesundheit:
    get:
      tags: [Konto]
      summary: Lebenszeichen (prüft die Datenbankverbindung)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }

  /v1/openapi.json:
    get:
      tags: [Konto]
      summary: Diese Beschreibung als JSON
      security: []
      responses:
        "200": { description: OpenAPI-Dokument }

  /v1/ich:
    get:
      tags: [Konto]
      summary: Eigenes Konto und Unternehmen mit Rolle
      description: Legt beim ersten Aufruf das Konto an.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  konto: { $ref: "#/components/schemas/Konto" }
                  unternehmen: { type: array, items: { $ref: "#/components/schemas/UnternehmenMitRolle" } }
        "401": { $ref: "#/components/responses/NichtAngemeldet" }

  /v1/unternehmen:
    post:
      tags: [Konto]
      summary: Unternehmen anlegen (der Anlegende wird Inhaber)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        "201": { description: Angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/UnternehmenMitRolle" } } } }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/profil:
    get:
      tags: [Profil und Ereignisse]
      summary: Aktuelle Profilversion
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProfilVersion" } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }
    put:
      tags: [Profil und Ereignisse]
      summary: Neue Profilversion speichern und Neuberechnung einreihen
      description: Profile werden nie überschrieben (E-018). Aufbau der Daten siehe `apps/api/src/profil-schema.ts`.
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [daten], additionalProperties: false, properties: { daten: { $ref: "#/components/schemas/ProfilDaten" } } } } }
      responses:
        "200": { description: Gespeichert, content: { application/json: { schema: { type: object, properties: { version: { type: integer }, daten: { $ref: "#/components/schemas/ProfilDaten" } } } } } }
        "403": { $ref: "#/components/responses/KeineBerechtigung" }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/ereignisse:
    get:
      tags: [Profil und Ereignisse]
      summary: Gemeldete Ereignisse (neueste zuerst)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Ereignis" } } } } }
    post:
      tags: [Profil und Ereignisse]
      summary: Ereignis melden (idempotent über client_id)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typ, datum]
              additionalProperties: false
              properties:
                typ: { type: string, description: "Ereignistyp aus packages/rules-schema/ereignisse.json" }
                datum: { type: string, format: date }
                payload: { type: object }
                client_id: { type: string, format: uuid, description: Wiederholtes Senden liefert das vorhandene Ereignis mit `wiederholt=true`. }
      responses:
        "201": { description: Gemeldet, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, typ: { type: string }, datum: { type: string }, wiederholt: { type: boolean } } } } } }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/ereignisse/{id}/storno:
    post:
      tags: [Profil und Ereignisse]
      summary: Ereignis zurücknehmen (als Gegenbuchung, nichts wird gelöscht)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Storniert, content: { application/json: { schema: { type: object, properties: { id: { type: string }, storniert: { const: true } } } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/neuberechnung:
    post:
      tags: [Profil und Ereignisse]
      summary: Neuberechnung von Hand einreihen
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: grund, in: query, schema: { type: string, maxLength: 50 } }]
      responses:
        "202": { description: Eingereiht, content: { application/json: { schema: { type: object, properties: { eingereiht: { const: true } } } } } }

  /v1/pflichten:
    get:
      tags: [Pflichten]
      summary: Pflicht-Karten, nach Fälligkeit sortiert
      parameters:
        - { $ref: "#/components/parameters/Unternehmen" }
        - { name: status, in: query, schema: { enum: [offen, faellig_bald, ueberfaellig, angabe_fehlt, erledigt, nicht_zutreffend, alle], default: alle } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PflichtKarte" } } } } }

  /v1/pflichten/{pflichtId}/{periode}:
    get:
      tags: [Pflichten]
      summary: Pflicht im Detail – mit Begründung, Quellen, Prüfstatus und Nachweisen
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { $ref: "#/components/parameters/PflichtId" }, { $ref: "#/components/parameters/Periode" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PflichtDetail" } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/pflichten/{pflichtId}/{periode}/erledigen:
    post:
      tags: [Pflichten]
      summary: Als erledigt markieren (mit optionaler Notiz als Nachweis)
      x-rollen: [inhaber, admin, steuerberater, mitarbeiter]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { $ref: "#/components/parameters/PflichtId" }, { $ref: "#/components/parameters/Periode" }]
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { notiz: { type: string, maxLength: 2000 } } } } }
      responses:
        "201": { description: Erledigt, content: { application/json: { schema: { $ref: "#/components/schemas/StatusAntwort" } } } }
        "404": { description: Keine offene Pflicht mit dieser Periode }

  /v1/pflichten/{pflichtId}/{periode}/wieder-oeffnen:
    post:
      tags: [Pflichten]
      summary: Erledigt zurücknehmen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { $ref: "#/components/parameters/PflichtId" }, { $ref: "#/components/parameters/Periode" }]
      responses:
        "201": { description: Wieder offen, content: { application/json: { schema: { $ref: "#/components/schemas/StatusAntwort" } } } }
        "404": { description: Keine erledigte Pflicht mit dieser Periode }

  /v1/pflichten/vor-start-erledigt:
    post:
      tags: [Pflichten]
      summary: Sammelbestätigung für Fristen vor dem Start bei Amtlos
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "201": { description: OK, content: { application/json: { schema: { type: object, properties: { erledigt: { type: integer } } } } } }

  /v1/heute:
    get:
      tags: [Pflichten]
      summary: Startseite – Ampel je Bereich, höchstens drei nächste Aufgaben, Fristen vor dem Start
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ampel: { type: object, additionalProperties: { enum: [gruen, gelb, rot] }, description: Ampel je Bereich }
                  zaehler: { type: object, properties: { offen: { type: integer }, ueberfaellig: { type: integer }, angabe_fehlt: { type: integer } } }
                  als_naechstes: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PflichtKarte" } }
                  vor_start: { type: object, properties: { anzahl: { type: integer }, seit: { type: [string, "null"], format: date } } }

  /v1/gruendung:
    get:
      tags: [Pflichten]
      summary: Gründungsassistent – Schritte in der Reihenfolge ihrer Voraussetzungen, mit Sperren, Fortschritt und Kennzahlen (UG/GmbH)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  schritte:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/PflichtKarte" }
                        - type: object
                          properties:
                            katalog_nr: { type: string }
                            voraussetzungen: { type: array, items: { type: string } }
                            gesperrt_durch: { type: array, items: { type: object, properties: { pflicht_id: { type: string }, titel: { type: string } } } }
                            stelle: { type: string }
                            kanal: { type: string }
                  fortschritt: { type: object, properties: { erledigt: { type: integer }, gesamt: { type: integer }, fertig: { type: boolean } } }
                  kapitalgesellschaft: { enum: [ug, gmbh, null] }
                  kennzahlen:
                    type: array
                    items: { type: object, properties: { id: { type: string }, bezeichnung: { type: string }, wert: { type: number }, einheit: { type: string }, ungeprueft: { type: boolean } } }

  /v1/gruendung/fragebogen:
    get:
      tags: [Gründung und ELSTER]
      summary: Angaben aus dem Profil für den Fragebogen zur steuerlichen Erfassung (Vorbereitung, kein amtliches Formular)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  abschnitte:
                    type: array
                    items: { type: object, properties: { titel: { type: string }, angaben: { type: array, items: { type: object, properties: { feld: { type: string }, label: { type: string }, wert: { type: [string, "null"] }, schritt: { type: string } } } } } }
                  fehlend: { type: array, items: { type: string } }
                  hinweise: { type: array, items: { enum: [verzicht_bindet] } }
                  uebermittlung: { $ref: "#/components/schemas/ElsterStatus" }

  /v1/elster/status:
    get:
      tags: [Gründung und ELSTER]
      summary: Ist die direkte Übermittlung an ELSTER verfügbar?
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ElsterStatus" } } } }

  /v1/elster/{vorgang}:
    post:
      tags: [Gründung und ELSTER]
      summary: Übermittlung an ELSTER im Auftrag des Nutzers (derzeit nicht verfügbar → 501 mit Begründung)
      x-rollen: [inhaber, admin, steuerberater]
      parameters:
        - { $ref: "#/components/parameters/Unternehmen" }
        - { name: vorgang, in: path, required: true, schema: { enum: [fragebogen_steuerliche_erfassung, ust_voranmeldung, zusammenfassende_meldung, kassenmeldung] } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Übermittelt (Transferticket) }
        "404": { description: Unbekannter Vorgang }
        "501": { description: Übermittlung nicht verfügbar, content: { application/json: { schema: { $ref: "#/components/schemas/ElsterStatus" } } } }

  /v1/rechnungssteller:
    get:
      tags: [Finanzen]
      summary: Eigene Angaben für Rechnungen (Anschrift, Steuernummer/USt-IdNr., Bank)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK (leer, wenn noch nicht erfasst) }
    put:
      tags: [Finanzen]
      summary: Eigene Angaben speichern
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnungssteller" } } } }
      responses:
        "200": { description: Gespeichert }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/kunden:
    get:
      tags: [Finanzen]
      summary: Kunden
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Finanzen]
      summary: Kunden anlegen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KundeEingabe" } } } }
      responses:
        "201": { description: Angelegt }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/rechnungen:
    get:
      tags: [Finanzen]
      summary: Rechnungen (Entwürfe zuerst, dann nach Datum)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Rechnung" } } } } }
    post:
      tags: [Finanzen]
      summary: Rechnungsentwurf anlegen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RechnungEingabe" } } } }
      responses:
        "201": { description: Entwurf, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }

  /v1/rechnungen/{id}:
    get:
      tags: [Finanzen]
      summary: Eine Rechnung
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }
    put:
      tags: [Finanzen]
      summary: Entwurf ändern (gestellte Rechnungen sind unveränderlich → 409)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RechnungEingabe" } } } }
      responses:
        "200": { description: Gespeichert }
        "409": { description: Rechnung ist gestellt }
    delete:
      tags: [Finanzen]
      summary: Entwurf löschen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Gelöscht }
        "404": { description: Kein Entwurf mit dieser ID }

  /v1/rechnungen/{id}/stellen:
    post:
      tags: [Finanzen]
      summary: Rechnung stellen – Nummer, Steuersätze aus Regelwerten, PDF/ZUGFeRD und XRechnung (Geschäftskunden)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Gestellt, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }
        "409": { description: Schon gestellt }
        "422": { description: "Angaben fehlen: { meldung, fehlend: [...] }" }

  /v1/rechnungen/{id}/stornieren:
    post:
      tags: [Finanzen]
      summary: Gestellte Rechnung stornieren (neue Rechnungskorrektur mit eigener Nummer)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Stornorechnung, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }
        "409": { description: Nicht stornierbar }

  /v1/dokumente/{id}/datei:
    get:
      tags: [Finanzen]
      summary: Datei eines Dokuments (PDF, XRechnung, Beleg) mit Prüfsumme im Header X-Content-SHA256
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Datei }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/belege:
    get:
      tags: [Finanzen]
      summary: Belege
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Finanzen]
      summary: Beleg hochladen (PDF, JPG, PNG oder E-Rechnung als XML; höchstens 15 MB). E-Rechnungen werden gelesen.
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [datei], properties: { datei: { type: string, format: binary } } } } }
      responses:
        "201": { description: Erfasst }
        "409": { description: Beleg schon erfasst (gleiche Datei) }
        "422": { description: Dateityp oder Inhalt nicht erlaubt }

  /v1/belege/{id}:
    put:
      tags: [Finanzen]
      summary: Angaben zum Beleg ändern (Datei bleibt unverändert)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BelegEingabe" } } } }
      responses:
        "200": { description: Gespeichert }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/belege/{id}/stornieren:
    post:
      tags: [Finanzen]
      summary: Beleg stornieren (statt löschen)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Storniert }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/finanzen/uebersicht:
    get:
      tags: [Finanzen]
      summary: Umsatz des Jahres aus den Rechnungen, Stand zur Kleinunternehmergrenze, Entwürfe und Belege
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }

  /v1/finanzen/ust-voranmeldung:
    get:
      tags: [Finanzen]
      summary: Vorbereitung der USt-Voranmeldung (Umsätze je Satz, Umsatzsteuer, Vorsteuer, Zahllast) – ohne Formular-Kennzahlen
      parameters:
        - { $ref: "#/components/parameters/Unternehmen" }
        - { name: periode, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2]|Q[1-4])$" } }
      responses:
        "200": { description: OK }
        "400": { description: Periode ungültig }

  /v1/kassen:
    get:
      tags: [Finanzen]
      summary: Elektronische Kassen
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Finanzen]
      summary: Kasse erfassen – meldet „Kasse angeschafft“ und zieht die Profilangaben nach (Meldefrist)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KasseEingabe" } } } }
      responses:
        "201": { description: Erfasst }

  /v1/kassen/{id}/ausser-betrieb:
    post:
      tags: [Finanzen]
      summary: Kasse außer Betrieb nehmen (löst die Meldepflicht aus)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [datum], properties: { datum: { type: string, format: date } } } } } }
      responses:
        "201": { description: Außer Betrieb }
        "404": { description: Keine aktive Kasse }
        "422": { description: Datum vor der Anschaffung }

  /v1/beschaeftigte:
    get:
      tags: [Personal]
      summary: Beschäftigte (aktive zuerst). Datensparsam – nur Name, Art, Eintritt/Austritt, Wochenstunden
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Beschaeftigter" } } } } }
    post:
