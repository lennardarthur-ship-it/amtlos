      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    begriff: { type: string }
                    erklaerung: { type: string }
                    pflichten: { type: array, items: { type: object, properties: { id: { type: string }, titel: { type: string } } } }

  /v1/kalender/abo:
    post:
      tags: [Kalender]
      summary: Kalender-Abo anlegen – die Adresse wird nur jetzt gezeigt
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "201": { description: Angelegt, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } } } } } }

  /v1/kalender/{datei}:
    get:
      tags: [Kalender]
      summary: ICS-Feed (für Kalender-Apps, ohne Login – das Token in der Adresse ist der Schlüssel)
      security: []
      parameters: [{ name: datei, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}\\.ics$" } }]
      responses:
        "200": { description: iCalendar, content: { text/calendar: { schema: { type: string } } } }
        "404": { description: Token unbekannt oder widerrufen }

  /v1/team:
    get:
      tags: [Team]
      summary: Mitglieder; offene Einladungen nur für Inhaber und Admins
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mitglieder:
                    type: array
                    items: { type: object, properties: { konto_id: { type: string, format: uuid }, anzeigename: { type: string }, email: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" }, ich: { type: boolean } } }
                  einladungen: { type: array, items: { $ref: "#/components/schemas/Einladung" } }
                  darf_verwalten: { type: boolean }

  /v1/team/verlassen:
    post:
      tags: [Team]
      summary: Selbst austreten (jede Rolle; der letzte Inhaber kann nicht austreten)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "204": { description: Ausgetreten }
        "409": { description: Das Unternehmen braucht mindestens einen Inhaber }

  /v1/team/{kontoId}:
    put:
      tags: [Team]
      summary: Rolle ändern (Inhaber ernennen oder ändern nur durch Inhaber; der letzte Inhaber bleibt)
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: kontoId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rolle], additionalProperties: false, properties: { rolle: { $ref: "#/components/schemas/Rolle" } } } } }
      responses:
        "200": { description: Geändert, content: { application/json: { schema: { type: object, properties: { konto_id: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" } } } } } }
        "403": { $ref: "#/components/responses/KeineBerechtigung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }
        "409": { description: Das Unternehmen braucht mindestens einen Inhaber }
    delete:
      tags: [Team]
      summary: Mitglied entfernen (Inhaber nur durch Inhaber; der letzte Inhaber bleibt)
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: kontoId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Entfernt }
        "403": { $ref: "#/components/responses/KeineBerechtigung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }
        "409": { description: Das Unternehmen braucht mindestens einen Inhaber }

  /v1/einladungen:
    post:
      tags: [Team]
      summary: Per E-Mail einladen – gilt 7 Tage, nur für diese Adresse
      description: Eine neue Einladung an dieselbe Adresse ersetzt die offene. Der Link wird einmal zurückgegeben und per E-Mail verschickt.
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, rolle]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                rolle: { enum: [mitarbeiter, steuerberater, admin] }
      responses:
        "201":
          description: Eingeladen
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Einladung" }
                  - { type: object, properties: { link: { type: string, format: uri } } }
        "409": { description: Diese Person ist schon im Team }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/einladungen/{id}:
    delete:
      tags: [Team]
      summary: Offene Einladung zurückziehen
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Zurückgezogen }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/einladungen/vorschau:
    post:
      tags: [Team]
      summary: Wohin lädt ein Link ein? (POST, damit das Token nicht in Zugriffslogs steht)
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { unternehmen: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" }, eingeladen_von: { type: [string, "null"] }, laeuft_ab: { type: string, format: date-time } } }
        "404": { description: Einladung ungültig oder abgelaufen }

  /v1/einladungen/annehmen:
    post:
      tags: [Team]
      summary: Einladung annehmen – nur angemeldet mit der eingeladenen E-Mail-Adresse, einmalig
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { description: Beigetreten, content: { application/json: { schema: { type: object, properties: { unternehmen_id: { type: string, format: uuid } } } } } }
        "403": { description: Einladung gilt für eine andere E-Mail-Adresse }
        "404": { description: Einladung ungültig, schon benutzt, zurückgezogen oder abgelaufen }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Unternehmen: { name: X-Unternehmen-Id, in: header, required: true, schema: { type: string, format: uuid } }
    PflichtId: { name: pflichtId, in: path, required: true, schema: { type: string, example: steuern.ust_voranmeldung } }
    Periode: { name: periode, in: path, required: true, schema: { type: string, pattern: "^(einmalig|\\d{4}(-(0[1-9]|1[0-2]|Q[1-4]|H[12]))?|aenderung-\\d+)$", example: 2026-09 } }

  requestBodies:
    Token:
      required: true
      content: { application/json: { schema: { type: object, required: [token], additionalProperties: false, properties: { token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } } } }

  responses:
    NichtAngemeldet: { description: Kein oder ungültiges Token }
    KeineBerechtigung: { description: Rolle reicht für diese Aktion nicht }
    NichtGefunden: { description: Gibt es nicht oder gehört nicht zu diesem Unternehmen }
    Eingabefehler:
      description: Eingabe ungültig
      content:
        application/json:
          schema: { type: object, properties: { meldung: { type: string }, fehler: { type: array, items: { type: object, properties: { feld: { type: string }, meldung: { type: string } } } } } }

  schemas:
    MesspunktEingabe:
      type: object
      required: [bezeichnung]
      properties:
        bezeichnung: { type: string }
        einheit: { type: string, enum: ["°C", "%", pH, sonstige] }
