openapi: 3.1.0
info:
  title: Amtlos API
  version: "1"
  description: |
    Schnittstelle für Web-App, Mobile-App und (später) Steuerberatungen.

    - Anmeldung: `Authorization: Bearer <Token>` vom Identity-Provider (OIDC, E-014).
    - Mandant: Routen mit dem Parameter `X-Unternehmen-Id` laufen im Kontext dieses Unternehmens.
      Ohne Mitgliedschaft antwortet die API mit 404 – nie mit einem Hinweis, dass es das Unternehmen gibt.
    - Rollen: `x-rollen` nennt, welche Rollen eine Route aufrufen dürfen. Fehlt das Feld, dürfen alle Mitglieder.
    - Fehler: JSON `{ statusCode, message }`; Eingabefehler (422) zusätzlich `fehler: [{ feld, meldung }]`.
    - Texte kommen in der Sprache des Kontos (de/en).

    Diese Datei wird gegen die Routen der API geprüft (Test `openapi.test.ts`): jede Route muss hier stehen,
    mit denselben Rollen; hier darf nichts stehen, was es nicht gibt.
servers:
  - url: http://localhost:3001
    description: Entwicklung
security:
  - bearer: []

tags:
  - name: Konto
  - name: Profil und Ereignisse
  - name: Pflichten
  - name: Kalender
  - name: Team
  - name: Gründung und ELSTER
  - name: Finanzen

paths:
  /v1/gesundheit:
    get:
      tags: [Konto]
      summary: Lebenszeichen (prüft die Datenbankverbindung)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }

  /v1/openapi.json:
    get:
      tags: [Konto]
      summary: Diese Beschreibung als JSON
      security: []
      responses:
        "200": { description: OpenAPI-Dokument }

  /v1/ich:
    get:
      tags: [Konto]
      summary: Eigenes Konto und Unternehmen mit Rolle
      description: Legt beim ersten Aufruf das Konto an.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  konto: { $ref: "#/components/schemas/Konto" }
                  unternehmen: { type: array, items: { $ref: "#/components/schemas/UnternehmenMitRolle" } }
        "401": { $ref: "#/components/responses/NichtAngemeldet" }

  /v1/unternehmen:
    post:
      tags: [Konto]
      summary: Unternehmen anlegen (der Anlegende wird Inhaber)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        "201": { description: Angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/UnternehmenMitRolle" } } } }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/profil:
    get:
      tags: [Profil und Ereignisse]
      summary: Aktuelle Profilversion
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProfilVersion" } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }
    put:
      tags: [Profil und Ereignisse]
      summary: Neue Profilversion speichern und Neuberechnung einreihen
      description: Profile werden nie überschrieben (E-018). Aufbau der Daten siehe `apps/api/src/profil-schema.ts`.
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [daten], additionalProperties: false, properties: { daten: { $ref: "#/components/schemas/ProfilDaten" } } } } }
      responses:
        "200": { description: Gespeichert, content: { application/json: { schema: { type: object, properties: { version: { type: integer }, daten: { $ref: "#/components/schemas/ProfilDaten" } } } } } }
        "403": { $ref: "#/components/responses/KeineBerechtigung" }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/ereignisse:
    get:
      tags: [Profil und Ereignisse]
      summary: Gemeldete Ereignisse (neueste zuerst)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Ereignis" } } } } }
    post:
      tags: [Profil und Ereignisse]
      summary: Ereignis melden (idempotent über client_id)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typ, datum]
              additionalProperties: false
              properties:
                typ: { type: string, description: "Ereignistyp aus packages/rules-schema/ereignisse.json" }
                datum: { type: string, format: date }
                payload: { type: object }
                client_id: { type: string, format: uuid, description: Wiederholtes Senden liefert das vorhandene Ereignis mit `wiederholt=true`. }
      responses:
        "201": { description: Gemeldet, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, typ: { type: string }, datum: { type: string }, wiederholt: { type: boolean } } } } } }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/ereignisse/{id}/storno:
    post:
      tags: [Profil und Ereignisse]
      summary: Ereignis zurücknehmen (als Gegenbuchung, nichts wird gelöscht)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Storniert, content: { application/json: { schema: { type: object, properties: { id: { type: string }, storniert: { const: true } } } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/neuberechnung:
    post:
      tags: [Profil und Ereignisse]
      summary: Neuberechnung von Hand einreihen
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: grund, in: query, schema: { type: string, maxLength: 50 } }]
      responses:
        "202": { description: Eingereiht, content: { application/json: { schema: { type: object, properties: { eingereiht: { const: true } } } } } }

  /v1/pflichten:
    get:
      tags: [Pflichten]
      summary: Pflicht-Karten, nach Fälligkeit sortiert
      parameters:
        - { $ref: "#/components/parameters/Unternehmen" }
        - { name: status, in: query, schema: { enum: [offen, faellig_bald, ueberfaellig, angabe_fehlt, erledigt, nicht_zutreffend, alle], default: alle } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PflichtKarte" } } } } }

  /v1/pflichten/{pflichtId}/{periode}:
    get:
      tags: [Pflichten]
      summary: Pflicht im Detail – mit Begründung, Quellen, Prüfstatus und Nachweisen
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { $ref: "#/components/parameters/PflichtId" }, { $ref: "#/components/parameters/Periode" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PflichtDetail" } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/pflichten/{pflichtId}/{periode}/erledigen:
    post:
      tags: [Pflichten]
      summary: Als erledigt markieren (mit optionaler Notiz als Nachweis)
      x-rollen: [inhaber, admin, steuerberater, mitarbeiter]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { $ref: "#/components/parameters/PflichtId" }, { $ref: "#/components/parameters/Periode" }]
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { notiz: { type: string, maxLength: 2000 } } } } }
      responses:
        "201": { description: Erledigt, content: { application/json: { schema: { $ref: "#/components/schemas/StatusAntwort" } } } }
        "404": { description: Keine offene Pflicht mit dieser Periode }

  /v1/pflichten/{pflichtId}/{periode}/wieder-oeffnen:
    post:
      tags: [Pflichten]
      summary: Erledigt zurücknehmen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { $ref: "#/components/parameters/PflichtId" }, { $ref: "#/components/parameters/Periode" }]
      responses:
        "201": { description: Wieder offen, content: { application/json: { schema: { $ref: "#/components/schemas/StatusAntwort" } } } }
        "404": { description: Keine erledigte Pflicht mit dieser Periode }

  /v1/pflichten/vor-start-erledigt:
    post:
      tags: [Pflichten]
      summary: Sammelbestätigung für Fristen vor dem Start bei Amtlos
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "201": { description: OK, content: { application/json: { schema: { type: object, properties: { erledigt: { type: integer } } } } } }

  /v1/heute:
    get:
      tags: [Pflichten]
      summary: Startseite – Ampel je Bereich, höchstens drei nächste Aufgaben, Fristen vor dem Start
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ampel: { type: object, additionalProperties: { enum: [gruen, gelb, rot] }, description: Ampel je Bereich }
                  zaehler: { type: object, properties: { offen: { type: integer }, ueberfaellig: { type: integer }, angabe_fehlt: { type: integer } } }
                  als_naechstes: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PflichtKarte" } }
                  vor_start: { type: object, properties: { anzahl: { type: integer }, seit: { type: [string, "null"], format: date } } }

  /v1/gruendung:
    get:
      tags: [Pflichten]
      summary: Gründungsassistent – Schritte in der Reihenfolge ihrer Voraussetzungen, mit Sperren, Fortschritt und Kennzahlen (UG/GmbH)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  schritte:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/PflichtKarte" }
                        - type: object
                          properties:
                            katalog_nr: { type: string }
                            voraussetzungen: { type: array, items: { type: string } }
                            gesperrt_durch: { type: array, items: { type: object, properties: { pflicht_id: { type: string }, titel: { type: string } } } }
                            stelle: { type: string }
                            kanal: { type: string }
                  fortschritt: { type: object, properties: { erledigt: { type: integer }, gesamt: { type: integer }, fertig: { type: boolean } } }
                  kapitalgesellschaft: { enum: [ug, gmbh, null] }
                  kennzahlen:
                    type: array
                    items: { type: object, properties: { id: { type: string }, bezeichnung: { type: string }, wert: { type: number }, einheit: { type: string }, ungeprueft: { type: boolean } } }

  /v1/gruendung/fragebogen:
    get:
      tags: [Gründung und ELSTER]
      summary: Angaben aus dem Profil für den Fragebogen zur steuerlichen Erfassung (Vorbereitung, kein amtliches Formular)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  abschnitte:
                    type: array
                    items: { type: object, properties: { titel: { type: string }, angaben: { type: array, items: { type: object, properties: { feld: { type: string }, label: { type: string }, wert: { type: [string, "null"] }, schritt: { type: string } } } } } }
                  fehlend: { type: array, items: { type: string } }
                  hinweise: { type: array, items: { enum: [verzicht_bindet] } }
                  uebermittlung: { $ref: "#/components/schemas/ElsterStatus" }

  /v1/elster/status:
    get:
      tags: [Gründung und ELSTER]
      summary: Ist die direkte Übermittlung an ELSTER verfügbar?
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ElsterStatus" } } } }

  /v1/elster/{vorgang}:
    post:
      tags: [Gründung und ELSTER]
      summary: Übermittlung an ELSTER im Auftrag des Nutzers (derzeit nicht verfügbar → 501 mit Begründung)
      x-rollen: [inhaber, admin, steuerberater]
      parameters:
        - { $ref: "#/components/parameters/Unternehmen" }
        - { name: vorgang, in: path, required: true, schema: { enum: [fragebogen_steuerliche_erfassung, ust_voranmeldung, zusammenfassende_meldung, kassenmeldung] } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Übermittelt (Transferticket) }
        "404": { description: Unbekannter Vorgang }
        "501": { description: Übermittlung nicht verfügbar, content: { application/json: { schema: { $ref: "#/components/schemas/ElsterStatus" } } } }

  /v1/rechnungssteller:
    get:
      tags: [Finanzen]
      summary: Eigene Angaben für Rechnungen (Anschrift, Steuernummer/USt-IdNr., Bank)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK (leer, wenn noch nicht erfasst) }
    put:
      tags: [Finanzen]
      summary: Eigene Angaben speichern
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnungssteller" } } } }
      responses:
        "200": { description: Gespeichert }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/kunden:
    get:
      tags: [Finanzen]
      summary: Kunden
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Finanzen]
      summary: Kunden anlegen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KundeEingabe" } } } }
      responses:
        "201": { description: Angelegt }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/rechnungen:
    get:
      tags: [Finanzen]
      summary: Rechnungen (Entwürfe zuerst, dann nach Datum)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Rechnung" } } } } }
    post:
      tags: [Finanzen]
      summary: Rechnungsentwurf anlegen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RechnungEingabe" } } } }
      responses:
        "201": { description: Entwurf, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }

  /v1/rechnungen/{id}:
    get:
      tags: [Finanzen]
      summary: Eine Rechnung
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }
        "404": { $ref: "#/components/responses/NichtGefunden" }
    put:
      tags: [Finanzen]
      summary: Entwurf ändern (gestellte Rechnungen sind unveränderlich → 409)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RechnungEingabe" } } } }
      responses:
        "200": { description: Gespeichert }
        "409": { description: Rechnung ist gestellt }
    delete:
      tags: [Finanzen]
      summary: Entwurf löschen
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Gelöscht }
        "404": { description: Kein Entwurf mit dieser ID }

  /v1/rechnungen/{id}/stellen:
    post:
      tags: [Finanzen]
      summary: Rechnung stellen – Nummer, Steuersätze aus Regelwerten, PDF/ZUGFeRD und XRechnung (Geschäftskunden)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Gestellt, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }
        "409": { description: Schon gestellt }
        "422": { description: "Angaben fehlen: { meldung, fehlend: [...] }" }

  /v1/rechnungen/{id}/stornieren:
    post:
      tags: [Finanzen]
      summary: Gestellte Rechnung stornieren (neue Rechnungskorrektur mit eigener Nummer)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Stornorechnung, content: { application/json: { schema: { $ref: "#/components/schemas/Rechnung" } } } }
        "409": { description: Nicht stornierbar }

  /v1/dokumente/{id}/datei:
    get:
      tags: [Finanzen]
      summary: Datei eines Dokuments (PDF, XRechnung, Beleg) mit Prüfsumme im Header X-Content-SHA256
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Datei }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/belege:
    get:
      tags: [Finanzen]
      summary: Belege
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Finanzen]
      summary: Beleg hochladen (PDF, JPG, PNG oder E-Rechnung als XML; höchstens 15 MB). E-Rechnungen werden gelesen.
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [datei], properties: { datei: { type: string, format: binary } } } } }
      responses:
        "201": { description: Erfasst }
        "409": { description: Beleg schon erfasst (gleiche Datei) }
        "422": { description: Dateityp oder Inhalt nicht erlaubt }

  /v1/belege/{id}:
    put:
      tags: [Finanzen]
      summary: Angaben zum Beleg ändern (Datei bleibt unverändert)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BelegEingabe" } } } }
      responses:
        "200": { description: Gespeichert }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/belege/{id}/stornieren:
    post:
      tags: [Finanzen]
      summary: Beleg stornieren (statt löschen)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Storniert }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/finanzen/uebersicht:
    get:
      tags: [Finanzen]
      summary: Umsatz des Jahres aus den Rechnungen, Stand zur Kleinunternehmergrenze, Entwürfe und Belege
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }

  /v1/finanzen/ust-voranmeldung:
    get:
      tags: [Finanzen]
      summary: Vorbereitung der USt-Voranmeldung (Umsätze je Satz, Umsatzsteuer, Vorsteuer, Zahllast) – ohne Formular-Kennzahlen
      parameters:
        - { $ref: "#/components/parameters/Unternehmen" }
        - { name: periode, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2]|Q[1-4])$" } }
      responses:
        "200": { description: OK }
        "400": { description: Periode ungültig }

  /v1/kassen:
    get:
      tags: [Finanzen]
      summary: Elektronische Kassen
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Finanzen]
      summary: Kasse erfassen – meldet „Kasse angeschafft“ und zieht die Profilangaben nach (Meldefrist)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KasseEingabe" } } } }
      responses:
        "201": { description: Erfasst }

  /v1/kassen/{id}/ausser-betrieb:
    post:
      tags: [Finanzen]
      summary: Kasse außer Betrieb nehmen (löst die Meldepflicht aus)
      x-rollen: [inhaber, admin, steuerberater]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [datum], properties: { datum: { type: string, format: date } } } } } }
      responses:
        "201": { description: Außer Betrieb }
        "404": { description: Keine aktive Kasse }
        "422": { description: Datum vor der Anschaffung }

  /v1/glossar:
    get:
      tags: [Pflichten]
      summary: Fachbegriffe aus dem aktiven Katalog, alphabetisch, ohne Doppelte
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    begriff: { type: string }
                    erklaerung: { type: string }
                    pflichten: { type: array, items: { type: object, properties: { id: { type: string }, titel: { type: string } } } }

  /v1/kalender/abo:
    post:
      tags: [Kalender]
      summary: Kalender-Abo anlegen – die Adresse wird nur jetzt gezeigt
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "201": { description: Angelegt, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } } } } } }

  /v1/kalender/{datei}:
    get:
      tags: [Kalender]
      summary: ICS-Feed (für Kalender-Apps, ohne Login – das Token in der Adresse ist der Schlüssel)
      security: []
      parameters: [{ name: datei, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}\\.ics$" } }]
      responses:
        "200": { description: iCalendar, content: { text/calendar: { schema: { type: string } } } }
        "404": { description: Token unbekannt oder widerrufen }

  /v1/team:
    get:
      tags: [Team]
      summary: Mitglieder; offene Einladungen nur für Inhaber und Admins
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mitglieder:
                    type: array
                    items: { type: object, properties: { konto_id: { type: string, format: uuid }, anzeigename: { type: string }, email: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" }, ich: { type: boolean } } }
                  einladungen: { type: array, items: { $ref: "#/components/schemas/Einladung" } }
                  darf_verwalten: { type: boolean }

  /v1/team/verlassen:
    post:
      tags: [Team]
      summary: Selbst austreten (jede Rolle; der letzte Inhaber kann nicht austreten)
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      responses:
        "204": { description: Ausgetreten }
        "409": { description: Das Unternehmen braucht mindestens einen Inhaber }

  /v1/team/{kontoId}:
    put:
      tags: [Team]
      summary: Rolle ändern (Inhaber ernennen oder ändern nur durch Inhaber; der letzte Inhaber bleibt)
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: kontoId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rolle], additionalProperties: false, properties: { rolle: { $ref: "#/components/schemas/Rolle" } } } } }
      responses:
        "200": { description: Geändert, content: { application/json: { schema: { type: object, properties: { konto_id: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" } } } } } }
        "403": { $ref: "#/components/responses/KeineBerechtigung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }
        "409": { description: Das Unternehmen braucht mindestens einen Inhaber }
    delete:
      tags: [Team]
      summary: Mitglied entfernen (Inhaber nur durch Inhaber; der letzte Inhaber bleibt)
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: kontoId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Entfernt }
        "403": { $ref: "#/components/responses/KeineBerechtigung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }
        "409": { description: Das Unternehmen braucht mindestens einen Inhaber }

  /v1/einladungen:
    post:
      tags: [Team]
      summary: Per E-Mail einladen – gilt 7 Tage, nur für diese Adresse
      description: Eine neue Einladung an dieselbe Adresse ersetzt die offene. Der Link wird einmal zurückgegeben und per E-Mail verschickt.
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, rolle]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                rolle: { enum: [mitarbeiter, steuerberater, admin] }
      responses:
        "201":
          description: Eingeladen
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Einladung" }
                  - { type: object, properties: { link: { type: string, format: uri } } }
        "409": { description: Diese Person ist schon im Team }
        "422": { $ref: "#/components/responses/Eingabefehler" }

  /v1/einladungen/{id}:
    delete:
      tags: [Team]
      summary: Offene Einladung zurückziehen
      x-rollen: [inhaber, admin]
      parameters: [{ $ref: "#/components/parameters/Unternehmen" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Zurückgezogen }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /v1/einladungen/vorschau:
    post:
      tags: [Team]
      summary: Wohin lädt ein Link ein? (POST, damit das Token nicht in Zugriffslogs steht)
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { unternehmen: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" }, eingeladen_von: { type: [string, "null"] }, laeuft_ab: { type: string, format: date-time } } }
        "404": { description: Einladung ungültig oder abgelaufen }

  /v1/einladungen/annehmen:
    post:
      tags: [Team]
      summary: Einladung annehmen – nur angemeldet mit der eingeladenen E-Mail-Adresse, einmalig
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { description: Beigetreten, content: { application/json: { schema: { type: object, properties: { unternehmen_id: { type: string, format: uuid } } } } } }
        "403": { description: Einladung gilt für eine andere E-Mail-Adresse }
        "404": { description: Einladung ungültig, schon benutzt, zurückgezogen oder abgelaufen }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Unternehmen: { name: X-Unternehmen-Id, in: header, required: true, schema: { type: string, format: uuid } }
    PflichtId: { name: pflichtId, in: path, required: true, schema: { type: string, example: steuern.ust_voranmeldung } }
    Periode: { name: periode, in: path, required: true, schema: { type: string, pattern: "^(einmalig|\\d{4}(-(0[1-9]|1[0-2]|Q[1-4]|H[12]))?|aenderung-\\d+)$", example: 2026-09 } }

  requestBodies:
    Token:
      required: true
      content: { application/json: { schema: { type: object, required: [token], additionalProperties: false, properties: { token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } } } }

  responses:
    NichtAngemeldet: { description: Kein oder ungültiges Token }
    KeineBerechtigung: { description: Rolle reicht für diese Aktion nicht }
    NichtGefunden: { description: Gibt es nicht oder gehört nicht zu diesem Unternehmen }
    Eingabefehler:
      description: Eingabe ungültig
      content:
        application/json:
          schema: { type: object, properties: { meldung: { type: string }, fehler: { type: array, items: { type: object, properties: { feld: { type: string }, meldung: { type: string } } } } } }

  schemas:
    Rechnungssteller:
      type: object
      required: [name, strasse, plz, ort, email]
      properties:
        name: { type: string }
        strasse: { type: string }
        plz: { type: string }
        ort: { type: string }
        land: { type: string, default: DE }
        email: { type: string, format: email }
        telefon: { type: [string, "null"] }
        steuernummer: { type: [string, "null"] }
        ust_idnr: { type: [string, "null"] }
        iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
    KundeEingabe:
      type: object
      required: [name]
      properties:
        name: { type: string }
        strasse: { type: [string, "null"] }
        plz: { type: [string, "null"] }
        ort: { type: [string, "null"] }
        land: { type: string, default: DE }
        email: { type: [string, "null"], format: email }
        ust_idnr: { type: [string, "null"] }
        kaeufer_referenz: { type: [string, "null"], description: "z. B. Leitweg-ID oder Bestellnummer (XRechnung BT-10)" }
        geschaeftskunde: { type: boolean, default: true, description: Geschäftskunden erhalten eine E-Rechnung }
    RechnungEingabe:
      type: object
      properties:
        kunde_id: { type: [string, "null"], format: uuid }
        leistungsdatum: { type: [string, "null"], format: date }
        faellig_am: { type: [string, "null"], format: date }
        hinweis: { type: [string, "null"], maxLength: 1000 }
        positionen:
          type: array
          items:
            type: object
            required: [bezeichnung, menge, einheit, preis_cent]
            properties:
              bezeichnung: { type: string }
              menge: { type: number, exclusiveMinimum: 0 }
              einheit: { enum: [stueck, stunde, tag, monat, pauschal, kilogramm] }
              preis_cent: { type: integer, minimum: 0, description: Nettopreis je Einheit in Cent }
              ust_art: { enum: [regel, ermaessigt, null], description: Steuersatz kommt beim Stellen aus den Regelwerten; Kleinunternehmer immer null }
    Rechnung:
      type: object
      properties:
        id: { type: string, format: uuid }
        nummer: { type: [string, "null"] }
        status: { enum: [entwurf, gestellt, storniert] }
        art: { enum: [rechnung, storno] }
        rechnungsdatum: { type: [string, "null"], format: date }
        netto_cent: { type: integer }
        ust_cent: { type: integer }
        brutto_cent: { type: integer }
        kleinunternehmer: { type: boolean }
        pdf_dokument_id: { type: [string, "null"], format: uuid }
        xml_dokument_id: { type: [string, "null"], format: uuid }
    BelegEingabe:
      type: object
      properties:
        belegdatum: { type: [string, "null"], format: date }
        lieferant: { type: [string, "null"] }
        belegnummer: { type: [string, "null"] }
        brutto_cent: { type: [integer, "null"] }
        ust_cent: { type: [integer, "null"], description: Vorsteuer laut Beleg }
        kategorie: { type: [string, "null"] }
        notiz: { type: [string, "null"] }
    KasseEingabe:
      type: object
      required: [bezeichnung, angeschafft_am]
      properties:
        bezeichnung: { type: string }
        art: { type: [string, "null"] }
        hersteller: { type: [string, "null"] }
        modell: { type: [string, "null"] }
        seriennummer: { type: [string, "null"] }
        tse_seriennummer: { type: [string, "null"] }
        betriebsstaette: { type: [string, "null"] }
        angeschafft_am: { type: string, format: date }
    ElsterStatus:
      type: object
      properties:
        verfuegbar: { type: boolean }
        grund: { type: string }
        alternative: { type: object, properties: { titel: { type: string }, url: { type: string, format: uri } } }
    Rolle: { enum: [inhaber, mitarbeiter, steuerberater, admin] }
    Konto:
      type: object
      properties: { id: { type: string, format: uuid }, email: { type: string }, anzeigename: { type: string }, sprache: { enum: [de, en] } }
    UnternehmenMitRolle:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" } }
    ProfilDaten:
      type: object
      description: Unternehmensprofil; maßgeblich ist das Zod-Schema in apps/api/src/profil-schema.ts.
    ProfilVersion:
      type: object
      properties: { version: { type: integer, description: 0 = noch kein Profil }, daten: { $ref: "#/components/schemas/ProfilDaten" }, erstellt_am: { type: [string, "null"], format: date-time } }
    Ereignis:
      type: object
      properties:
        id: { type: string, format: uuid }
        typ: { type: string }
        datum: { type: string, format: date }
        payload: { type: object }
        erfasst_am: { type: string, format: date-time }
        storniert_ereignis_id: { type: [string, "null"], description: Gesetzt bei einer Gegenbuchung }
        storniert: { type: boolean }
    StatusAntwort:
      type: object
      properties: { pflicht_id: { type: string }, periode: { type: string }, status: { enum: [offen, erledigt] } }
    Einladung:
      type: object
      properties: { id: { type: string, format: uuid }, email: { type: string }, rolle: { $ref: "#/components/schemas/Rolle" }, laeuft_ab: { type: string, format: date-time } }
    PflichtKarte:
      type: object
      description: Eine Pflicht für eine Periode, Texte in der Sprache des Kontos.
      properties:
        pflicht_id: { type: string }
        periode: { type: string }
        titel: { type: string }
        kurz: { type: string }
        status: { enum: [offen, faellig_bald, ueberfaellig, angabe_fehlt, erledigt, nicht_zutreffend] }
        ergebnis: { enum: [gilt, gilt_nicht, unbekannt] }
        faellig_am: { type: [string, "null"], format: date }
        verschoben_von: { type: [string, "null"], format: date, description: Ursprüngliches Datum, wenn die Frist wegen Wochenende/Feiertag verschoben wurde }
        kategorie: { type: string }
        bereich: { type: string }
        sanktion: { type: object, properties: { text: { type: string }, schwere: { enum: [niedrig, mittel, hoch] } } }
        rechtsgrundlage: { type: array, items: { type: string } }
        warum: { type: array, items: { type: string }, description: "„Gilt für dich, weil …“" }
        zu_klaeren: { type: array, items: { type: string }, description: Offene Bedingungen, als Fragen anzuzeigen }
        fehlende_fakten: { type: array, items: { type: string } }
        pruefung: { type: object, properties: { status: { type: string }, geprueft_von: { type: [array, "null"] }, geprueft_am: { type: [string, "null"] } } }
        ungeprueft: { type: boolean, description: In dev/staging können ungeprüfte Inhalte erscheinen (E-038). }
        erledigt_am: { type: [string, "null"], format: date-time }
    PflichtDetail:
      allOf:
        - { $ref: "#/components/schemas/PflichtKarte" }
        - type: object
          properties:
            erklaerung: { type: string }
            begriffe: { type: array, items: { type: object, properties: { begriff: { type: string }, erklaerung: { type: string } } } }
            stelle: { type: string }
            kosten: { type: [string, "null"] }
            quellen: { type: array, items: { type: object, properties: { titel: { type: string }, url: { type: string }, abgerufen: { type: [string, "null"] } } } }
            dokumente: { type: array, items: { type: string } }
            pflicht_version: { type: integer }
            regelwerte: { type: array, items: { type: object, properties: { id: { type: string }, version: { type: integer } } } }
            begruendung: { type: object, description: Auswertungsbaum der Regel }
            nachweise: { type: array, items: { type: object } }
