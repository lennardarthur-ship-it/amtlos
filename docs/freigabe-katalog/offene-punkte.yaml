# Offene Prüfpunkte im Katalog (E-196)
#
# Jeder Punkt in `fachlich_zu_pruefen`, der nach seinem Wortlaut eine weitere fachliche Prüfung verlangt (Stichwörter in
# docs/freigabe-katalog/anwenden.py, OFFEN_STICHWORTE), steht hier entweder unter `offen` oder unter `erledigt`.
# `offen`: Die App zeigt für den Eintrag nur „teilweise geprüft“ mit dem Thema; der Punkt steht in der Nachprüfliste der Rolle.
# `erledigt`: kein offener Prüfpunkt; Grund aus `gruende`. Ein neuer Punkt ohne Einordnung lässt `anwenden.py --pruefen` scheitern.
# `punkt`: Anfang des Textes (60 Zeichen) zur Zuordnung.
gruende:
  freigabe: Unser eigener Lese- oder Umsetzungsvermerk von vor der Prüfung; der Prüfer hat das Feld danach in der jeweiligen Fassung freigegeben.
  erledigt: Im Punkt selbst als erledigt bzw. bestätigt vermerkt.
  nicht_angezeigt: Betrifft Angaben, die die App nicht zeigt (Vorbereitungs-Checkliste und Wahrscheinlichkeit des Radars).
  technik: Technische Grenze des Auslösers oder der Abbildung (Technik), kein Prüfpunkt.
  auflage_erfuellt: Auflage der Freigabe, die die angezeigte Fassung schon erfüllt (Beträge bzw. Zusatz entfernt, bis eine Fundstelle vorliegt).
  entwurf: Eintrag im Entwurf (E-195); die Prüfung läuft mit dem Prüfpaket vom 25.10.2026.
  nachgeprueft: Der Prüfer hat den offenen Punkt am 26.10.2026 erneut geprüft und per Mail als erledigt bestätigt (E-201); erneute Vorlage zu den in PRUEFLISTE genannten Terminen.
  beantwortet: Frage zum Entwurf, die der Prüfer mit seiner Freigabe am 26.10.2026 beantwortet hat (E-201).
  bestaetigt_mit_version: Der Prüfer hat die Fassung mit diesem Punkt am 26.10.2026 per Mail bestätigt (E-213).
  neu_geprueft: Neuer Eintrag mit der Bitte um vollständige Prüfung; der Prüfer hat ihn danach freigegeben (Unterschrift siehe Register).
  entwurf_e223: Neuer Eintrag im Entwurf (E-223, Befund des externen Prüfers); die App zeigt „noch nicht fachlich geprüft“, die Prüfung läuft mit dem Prüfpaket für die neuen Einträge (PRUEFLISTE T-313).
  entwurf_e231: Neuer Eintrag im Entwurf auf Anweisung des Steuerberaters (E-231); die App zeigt „noch nicht fachlich geprüft“, die Prüfung läuft mit dem Prüfpaket für diesen Eintrag (PRUEFLISTE T-337).
offen: []
