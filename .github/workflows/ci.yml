name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Lint, Typen, Tests, Katalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Katalogauszug der App aktuell (E-121)
        run: node apps/mobile/werkzeuge/katalog-buendel.mjs && git diff --exit-code apps/mobile/src/unterlagen/katalog.json apps/mobile/src/pflichten/katalog.json
      - name: Erzeugte Bausteine aktuell (E-123, aus docs/recherche)
        run: node packages/fachlogik/werkzeuge/bausteine-erzeugen.mjs && git diff --exit-code packages/fachlogik/src/dokumente/bausteine.ts
      - name: Mobile App bündeln (Metro, Android und iOS)
        run: |
          cd apps/mobile
          CI=1 npx expo export --platform android --output-dir ../../mobile-export/android
          CI=1 npx expo export --platform ios --output-dir ../../mobile-export/ios

  iphone-app:
    name: iPhone-App – Rundgänge und Dokumente (Web-Export)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @amtlos/web exec playwright-core install --with-deps chromium
      - name: Web-Export (ohne und mit Server)
        run: |
          cd apps/mobile
          CI=1 npx expo export --platform web --output-dir /tmp/web
          CI=1 EXPO_PUBLIC_API_URL=http://localhost:3001 npx expo export --platform web --clear --output-dir /tmp/web-sync
          grep -q "localhost:3001" /tmp/web-sync/_expo/static/js/web/*.js
      - name: Rundgang, Dokumente, Synchronisation
        run: |
          set -o pipefail
          cd apps/mobile
          export CHROMIUM_PFAD=$(node -e "const r=require('module').createRequire(require('path').resolve('../web/package.json'));console.log(r('playwright-core').chromium.executablePath())")
          node e2e/rundgang.mjs /tmp/web /tmp/bilder 2>&1 | tee ../../e2e-app.txt
          node werkzeuge/dokumente-pruefen.mjs /tmp/dokumente 2>&1 | tee -a ../../e2e-app.txt
          nohup node e2e/sync-server.mjs > ../../sync-server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null -X POST localhost:3001/v1/dev/token -H 'content-type: application/json' -d '{"kennung":"ci"}' && break; sleep 1; done
          node e2e/sync.mjs /tmp/web-sync /tmp/bilder-sync 2>&1 | tee -a ../../e2e-app.txt
      - if: failure()
        run: for f in e2e-app.txt sync-server.log; do [ -f "$f" ] && tail -n 6 "$f" | sed "s/^/::error title=$f::/" || true; done

  datenbank:
    name: Datenbank- und Integrationstests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: psql-Client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Schema einspielen und testen
        run: |
          set -o pipefail
          db/tests/run.sh | tee ergebnis.txt
          grep -q "ALLE SCHEMA-TESTS BESTANDEN" ergebnis.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Integrationstests (Server-Kern, API, Worker)
        env:
          AMTLOS_DB_TESTS: pflicht
        run: pnpm --filter @amtlos/server --filter @amtlos/api --filter @amtlos/worker test
      - name: Lasttest Neuberechnung (1.000 Unternehmen, Hochrechnung < 30 min für 100.000)
        run: node scripts/lasttest-neuberechnung.mjs 1000 8

  e2e:
    name: End-to-End Web und Studio, Barrierefreiheit (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DEV_JWT_SECRET: ci-entwicklungs-geheimnis-mindestens-32-zeichen
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/dev-datenbank.sh
      - run: pnpm --filter @amtlos/web exec playwright-core install --with-deps chromium
      - name: Dienste starten
        run: |
          UMGEBUNG=dev PORT=3001 AUTH_MODUS=dev WEB_URL=http://localhost:3000 RATE_ANGEMELDET=5000 ONLINECHECK_PRIVATE_NETZE=erlaubt \
            DATABASE_URL=postgresql://api_user:amtlos@localhost:5432/amtlos nohup node apps/api/dist/main.js > api.log 2>&1 &
          UMGEBUNG=dev WORKER_DATABASE_URL=postgresql://worker_user:amtlos@localhost:5432/amtlos nohup node apps/worker/dist/main.js > worker.log 2>&1 &
          UMGEBUNG=dev AUTH_MODUS=dev AMTLOS_UMFANG=alles WEB_URL=http://localhost:3000 API_INTERN_URL=http://localhost:3001 \
            SITZUNG_SCHLUESSEL=ci-sitzung-schluessel-mindestens-32-zeichen-lang nohup pnpm --filter @amtlos/web start > web.log 2>&1 &
          UMGEBUNG=dev AUTH_MODUS=dev WEB_URL=http://localhost:3002 API_INTERN_URL=http://localhost:3001 \
            SITZUNG_SCHLUESSEL=ci-sitzung-schluessel-mindestens-32-zeichen-lang nohup pnpm --filter @amtlos/web exec next start -p 3002 > web-kern.log 2>&1 &
          MIGRATION_DATABASE_URL=postgresql://amtlos_owner:amtlos@localhost:5432/amtlos \
            node packages/server/dist/cli.js plattformrolle redakteurin r@example.org "Rita Redaktion" redaktion
          MIGRATION_DATABASE_URL=postgresql://amtlos_owner:amtlos@localhost:5432/amtlos \
            node packages/server/dist/cli.js plattformrolle plattformadmin a@example.org "Ada Admin" plattform_admin
          UMGEBUNG=dev AUTH_MODUS=dev WEB_URL=http://localhost:3100 COOKIE_PRAEFIX=amtlos_studio \
            SITZUNG_SCHLUESSEL=ci-studio-schluessel-mindestens-32-zeichen-lang \
            STUDIO_DATABASE_URL=postgresql://studio_user:amtlos@localhost:5432/amtlos nohup pnpm --filter @amtlos/studio start > studio.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3001/v1/gesundheit >/dev/null && curl -s -o /dev/null localhost:3000/anmelden && curl -s -o /dev/null localhost:3002/anmelden && curl -s -o /dev/null localhost:3100/anmelden && break; sleep 1; done
      - name: Rundgang Studio-Editor (legt den Marktplatz-Partner für den Web-Rundgang an)
        run: |
          set -o pipefail
          STUDIO_URL=http://localhost:3100 pnpm --filter @amtlos/studio e2e 2>&1 | tee e2e-studio.txt
      - name: Rundgang Web-App (voller Umfang)
        run: |
          set -o pipefail
          E2E_URL=http://localhost:3000 E2E_BILDER=$PWD/e2e-bilder pnpm --filter @amtlos/web e2e 2>&1 | tee e2e-web.txt
      - name: Kern-Umfang (Standard)
        run: |
          set -o pipefail
          E2E_KERN_URL=http://localhost:3002 pnpm --filter @amtlos/web e2e:kern 2>&1 | tee e2e-kern.txt
      # Fehler als Annotationen ausgeben – lesbar auch ohne Log-Download
      - if: failure()
        # Rundgänge: die letzten Zeilen ohne Zugriffsprotokoll (der Befund steht vor dem Node-Stacktrace)
        run: for f in e2e-web.txt e2e-kern.txt e2e-studio.txt api.log web.log web-kern.log; do [ -f "$f" ] && grep -v '"stufe":"info"' "$f" | grep -v "^\s*at " | tail -n 10 | sed "s/^/::error title=$f::/" || true; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ergebnisse
          path: |
            e2e-bilder
            *.log
            e2e-*.txt

  container:
    name: Container-Images bauen und starten (Rauchtest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Images bauen
        run: |
          for ziel in werkzeug api worker web studio; do
            docker buildx build -f docker/Dockerfile --target $ziel -t amtlos-$ziel:ci --load \
              --cache-from type=gha,scope=amtlos --cache-to type=gha,mode=max,scope=amtlos .
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep amtlos
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Datenbank mit dem Werkzeug-Image einrichten
        run: |
          NUR_ROLLEN=1 scripts/dev-datenbank.sh
          docker run --rm --network host -e MIGRATION_DATABASE_URL=postgresql://amtlos_owner:amtlos@localhost:5432/amtlos amtlos-werkzeug:ci migrieren
          docker run --rm --network host -e STUDIO_DATABASE_URL=postgresql://studio_user:amtlos@localhost:5432/amtlos amtlos-werkzeug:ci katalog-importieren
      - name: Dienste starten und prüfen
        run: |
          G=ci-entwicklungs-geheimnis-mindestens-32-zeichen
          docker run -d --name api --network host -e UMGEBUNG=dev -e AUTH_MODUS=dev -e DEV_JWT_SECRET=$G -e WEB_URL=http://localhost:3000 \
            -e DATABASE_URL=postgresql://api_user:amtlos@localhost:5432/amtlos amtlos-api:ci
          docker run -d --name worker --network host -e UMGEBUNG=dev -e WORKER_DATABASE_URL=postgresql://worker_user:amtlos@localhost:5432/amtlos amtlos-worker:ci
          docker run -d --name web --network host -e UMGEBUNG=dev -e AUTH_MODUS=dev -e DEV_JWT_SECRET=$G -e WEB_URL=http://localhost:3000 \
            -e API_INTERN_URL=http://localhost:3001 -e SITZUNG_SCHLUESSEL=ci-sitzung-schluessel-mindestens-32-zeichen-lang amtlos-web:ci
          docker run -d --name studio --network host -e UMGEBUNG=dev -e AUTH_MODUS=dev -e DEV_JWT_SECRET=$G -e WEB_URL=http://localhost:3100 \
            -e COOKIE_PRAEFIX=amtlos_studio -e SITZUNG_SCHLUESSEL=ci-studio-schluessel-mindestens-32-zeichen-lang \
            -e STUDIO_DATABASE_URL=postgresql://studio_user:amtlos@localhost:5432/amtlos amtlos-studio:ci
          warte() { for i in $(seq 1 40); do c=$(curl -s -o antwort.txt -w "%{http_code}" "$1" || true); [ "$c" = "200" ] && echo "$1 200" && return 0; sleep 1; done
                    echo "::error title=Rauchtest::$1 antwortet $c: $(head -c 300 antwort.txt | tr '\n' ' ')"; return 1; }
          warte localhost:3001/v1/gesundheit
          warte localhost:3001/v1/openapi.json
          warte localhost:3000/anmelden
          warte localhost:3100/anmelden
          sleep 3
          for c in api worker web studio; do
            [ "$(docker inspect -f '{{.State.Running}}' $c)" = "true" ] || { echo "::error title=Rauchtest::Container $c läuft nicht: $(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' $c)"; exit 1; }
          done
          # Läuft als Nicht-Root?
          uid=$(docker exec api id -u)
          [ "$uid" != "0" ] || { echo "::error title=Rauchtest::API-Container läuft als root"; exit 1; }
      - if: failure()
        run: for c in api worker web studio; do docker logs $c 2>&1 | tail -n 4 | sed "s/^/::error title=$c::/" || true; done


  e-rechnung:
    name: E-Rechnungen gegen den KoSIT-Validator (XRechnung)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amtlos/server... --filter @amtlos/fachlogik build
      - run: node scripts/e-rechnung-beispiele.mjs e-rechnungen
      - name: KoSIT-Validator und XRechnung-Konfiguration laden (offizielle Releases, feste Versionen)
        env:
          GH_TOKEN: ${{ github.token }}
          # Feste Versionen statt „neueste“ (Reproduzierbarkeit): bewusst anheben, wenn KoSIT neue Regeln veröffentlicht
          KOSIT_VALIDATOR: v1.6.2
          KOSIT_XRECHNUNG: v2026-01-31
        run: |
          mkdir -p kosit && cd kosit
          gh release download "$KOSIT_VALIDATOR" --repo itplr-kosit/validator --pattern '*.zip' --clobber
          gh release download "$KOSIT_XRECHNUNG" --repo itplr-kosit/validator-configuration-xrechnung --pattern '*.zip' --clobber
          for z in *.zip; do unzip -oq "$z"; done
          ls
      - name: Beispielrechnungen prüfen
        run: |
          JAR=$(find kosit -maxdepth 1 -name 'validator-*.jar' | head -1)
          SZ=$(find kosit -name 'scenarios.xml' | head -1)
          echo "Validator: $JAR, Szenarien: $SZ"
          mkdir -p berichte
          echo "::notice title=KoSIT-Dateien::$(find kosit -maxdepth 2 | head -30 | tr '\n' ' ')"
          grep -m3 -E "java .*(-cp|-jar)" kosit/docs/usage.md | sed 's/^/::notice title=Aufruf laut Doku::/' || true
          java -cp "$JAR:kosit/libs/*" de.kosit.validationtool.cmd.CommandLineApplication -s "$SZ" -r "$(dirname "$SZ")" -o berichte e-rechnungen/*.xml > validator.log 2>&1 || true
          tail -n 15 validator.log | sed 's/^/::notice title=Validator::/'
          ls berichte | sed 's/^/::notice title=Bericht::/' || true
          fehler=0
          for f in e-rechnungen/*.xml; do
            b=$(ls berichte/$(basename "${f%.xml}")*report*.xml 2>/dev/null | head -1)
            if [ -z "$b" ] || [ ! -f "$b" ]; then echo "::error title=KoSIT::kein Bericht für $f"; fehler=1; continue; fi
            if grep -q "<rep:accept" "$b"; then echo "✓ $f"; else
              echo "::error title=KoSIT $(basename "$f")::$(grep -o 'id="[^"]*"[^>]*level="error"' "$b" | head -5 | tr '\n' ' ') $(grep -o '<rep:message[^>]*>[^<]*' "$b" | grep -i error | head -3 | sed 's/<[^>]*>//g' | tr '\n' ' ')"
              fehler=1
            fi
          done
          exit $fehler
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-rechnungen
          path: |
            e-rechnungen
            berichte
