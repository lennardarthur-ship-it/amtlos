name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Lint, Typen, Tests, Katalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  datenbank:
    name: Datenbank- und Integrationstests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: psql-Client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Schema einspielen und testen
        run: |
          set -o pipefail
          db/tests/run.sh | tee ergebnis.txt
          grep -q "ALLE SCHEMA-TESTS BESTANDEN" ergebnis.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Integrationstests (Server-Kern, API, Worker)
        env:
          AMTLOS_DB_TESTS: pflicht
        run: pnpm --filter @amtlos/server --filter @amtlos/api --filter @amtlos/worker test
      - name: Lasttest Neuberechnung (1.000 Unternehmen, Hochrechnung < 30 min für 100.000)
        run: node scripts/lasttest-neuberechnung.mjs 1000 8

  e2e:
    name: End-to-End Web und Studio, Barrierefreiheit (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DEV_JWT_SECRET: ci-entwicklungs-geheimnis-mindestens-32-zeichen
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/dev-datenbank.sh
      - run: pnpm --filter @amtlos/web exec playwright-core install --with-deps chromium
      - name: Dienste starten
        run: |
          UMGEBUNG=dev PORT=3001 AUTH_MODUS=dev WEB_URL=http://localhost:3000 \
            DATABASE_URL=postgresql://api_user:amtlos@localhost:5432/amtlos nohup node apps/api/dist/main.js > api.log 2>&1 &
          UMGEBUNG=dev WORKER_DATABASE_URL=postgresql://worker_user:amtlos@localhost:5432/amtlos nohup node apps/worker/dist/main.js > worker.log 2>&1 &
          UMGEBUNG=dev AUTH_MODUS=dev WEB_URL=http://localhost:3000 API_INTERN_URL=http://localhost:3001 \
            SITZUNG_SCHLUESSEL=ci-sitzung-schluessel-mindestens-32-zeichen-lang nohup pnpm --filter @amtlos/web start > web.log 2>&1 &
          MIGRATION_DATABASE_URL=postgresql://amtlos_owner:amtlos@localhost:5432/amtlos \
            node packages/server/dist/cli.js plattformrolle redakteurin r@example.org "Rita Redaktion" redaktion
          UMGEBUNG=dev AUTH_MODUS=dev WEB_URL=http://localhost:3100 COOKIE_PRAEFIX=amtlos_studio \
            SITZUNG_SCHLUESSEL=ci-studio-schluessel-mindestens-32-zeichen-lang \
            STUDIO_DATABASE_URL=postgresql://studio_user:amtlos@localhost:5432/amtlos nohup pnpm --filter @amtlos/studio start > studio.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3001/v1/gesundheit >/dev/null && curl -s -o /dev/null localhost:3000/anmelden && curl -s -o /dev/null localhost:3100/anmelden && break; sleep 1; done
      - name: Rundgang Web-App
        run: |
          set -o pipefail
          E2E_URL=http://localhost:3000 E2E_BILDER=$PWD/e2e-bilder pnpm --filter @amtlos/web e2e 2>&1 | tee e2e-web.txt
      - name: Rundgang Studio-Editor
        run: |
          set -o pipefail
          STUDIO_URL=http://localhost:3100 pnpm --filter @amtlos/studio e2e 2>&1 | tee e2e-studio.txt
      # Fehler als Annotationen ausgeben – lesbar auch ohne Log-Download
      - if: failure()
        run: for f in e2e-web.txt e2e-studio.txt api.log web.log; do [ -f "$f" ] && tail -n 4 "$f" | sed "s/^/::error title=$f::/" || true; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ergebnisse
          path: |
            e2e-bilder
            *.log
            e2e-*.txt

  container:
    name: Container-Images bauen und starten (Rauchtest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Images bauen
        run: |
          for ziel in werkzeug api worker web studio; do
            docker buildx build -f docker/Dockerfile --target $ziel -t amtlos-$ziel:ci --load \
              --cache-from type=gha,scope=amtlos --cache-to type=gha,mode=max,scope=amtlos .
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep amtlos
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Datenbank mit dem Werkzeug-Image einrichten
        run: |
          NUR_ROLLEN=1 scripts/dev-datenbank.sh
          docker run --rm --network host -e MIGRATION_DATABASE_URL=postgresql://amtlos_owner:amtlos@localhost:5432/amtlos amtlos-werkzeug:ci migrieren
          docker run --rm --network host -e STUDIO_DATABASE_URL=postgresql://studio_user:amtlos@localhost:5432/amtlos amtlos-werkzeug:ci katalog-importieren
      - name: Dienste starten und prüfen
        run: |
          G=ci-entwicklungs-geheimnis-mindestens-32-zeichen
          docker run -d --name api --network host -e UMGEBUNG=dev -e AUTH_MODUS=dev -e DEV_JWT_SECRET=$G -e WEB_URL=http://localhost:3000 \
            -e DATABASE_URL=postgresql://api_user:amtlos@localhost:5432/amtlos amtlos-api:ci
          docker run -d --name worker --network host -e UMGEBUNG=dev -e WORKER_DATABASE_URL=postgresql://worker_user:amtlos@localhost:5432/amtlos amtlos-worker:ci
          docker run -d --name web --network host -e UMGEBUNG=dev -e AUTH_MODUS=dev -e DEV_JWT_SECRET=$G -e WEB_URL=http://localhost:3000 \
            -e API_INTERN_URL=http://localhost:3001 -e SITZUNG_SCHLUESSEL=ci-sitzung-schluessel-mindestens-32-zeichen-lang amtlos-web:ci
          docker run -d --name studio --network host -e UMGEBUNG=dev -e AUTH_MODUS=dev -e DEV_JWT_SECRET=$G -e WEB_URL=http://localhost:3100 \
            -e COOKIE_PRAEFIX=amtlos_studio -e SITZUNG_SCHLUESSEL=ci-studio-schluessel-mindestens-32-zeichen-lang \
            -e STUDIO_DATABASE_URL=postgresql://studio_user:amtlos@localhost:5432/amtlos amtlos-studio:ci
          warte() { for i in $(seq 1 40); do c=$(curl -s -o antwort.txt -w "%{http_code}" "$1" || true); [ "$c" = "200" ] && echo "$1 200" && return 0; sleep 1; done
                    echo "::error title=Rauchtest::$1 antwortet $c: $(head -c 300 antwort.txt | tr '\n' ' ')"; return 1; }
          warte localhost:3001/v1/gesundheit
          warte localhost:3001/v1/openapi.json
          warte localhost:3000/anmelden
          warte localhost:3100/anmelden
          sleep 3
          laufend=$(docker ps --format '{{.Names}}' | sort | tr '\n' ' ')
          echo "laufend: $laufend"
          [ "$laufend" = "api studio web worker " ] || { echo "::error title=Rauchtest::Nicht alle Container laufen: $(docker ps -a --format '{{.Names}}={{.Status}}' | tr '\n' ' ')"; exit 1; }
          # Läuft als Nicht-Root?
          uid=$(docker exec api id -u)
          [ "$uid" != "0" ] || { echo "::error title=Rauchtest::API-Container läuft als root"; exit 1; }
      - if: failure()
        run: for c in api worker web studio; do docker logs $c 2>&1 | tail -n 4 | sed "s/^/::error title=$c::/" || true; done

