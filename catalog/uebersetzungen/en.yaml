- de: Ein Jahr nach Aufnahme der ersten Beschäftigung lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen – nach neun Monaten erinnerst du sie daran.
  en: One year after the start of their first employment, you have young people show you the certificate of the first follow-up examination – after nine months you remind them.
- de: Ein Jahr nach Aufnahme der ersten Beschäftigung lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen; die Untersuchung darf höchstens drei Monate zurückliegen (§
    33 Abs. 1 JArbSchG). Neun Monate nach Beginn weist du die jugendliche Person nachdrücklich auf den Termin hin und forderst sie auf, die Nachuntersuchung machen zu lassen (§ 33 Abs. 1 Satz 2 JArbSchG).
    Liegt die Bescheinigung 14 Monate nach Aufnahme der ersten Beschäftigung nicht vor, darfst du die Person nicht weiter beschäftigen (§ 33 Abs. 3 JArbSchG). Amtlos rechnet ab der Einstellung und erinnert
    drei Monate vor dem Termin – hat die Person schon vorher anderswo gearbeitet, zählt der Beginn dieser ersten Beschäftigung. Die Erstuntersuchung vor Beginn ist eine eigene Pflicht. Ein Gesetzesantrag
    (BR-Drs. 735/25) will die Untersuchungen ändern; er ist nicht in Kraft.
  en: One year after the start of their first employment, you have young people show you the certificate of the first follow-up examination; the examination may be no more than three months old (§ 33(1)
    JArbSchG). Nine months after the start, you emphatically point out the deadline to the young person and ask them to have the follow-up examination done (§ 33(1) sentence 2 JArbSchG). If the certificate
    is not available 14 months after the start of the first employment, you may not continue to employ the person (§ 33(3) JArbSchG). Amtlos counts from the hiring and reminds you three months before the
    deadline – if the person already worked elsewhere before, the start of that first employment counts. The initial examination before the start is a separate obligation. A legislative proposal (BR-Drs.
    735/25) wants to change the examinations; it is not in force.
- de: Ein Jahr nach jeder Unterweisung erinnert Amtlos an die Wiederholung. Mit der neuen Unterweisung ist die alte erledigt. Hast du deine letzte Unterweisung noch nicht in Amtlos erfasst, erfasse sie – dann kennt Amtlos den nächsten Termin.
  en: One year after each safety briefing, Amtlos reminds you to repeat it. The new safety briefing completes the old one. If you have not yet recorded your last safety briefing in Amtlos, record it – then Amtlos knows the next date.
- de: Ein Jugendlicher, der in das Berufsleben eintritt, darf nur beschäftigt werden, wenn er innerhalb der letzten 14 Monate vor Beginn von einer Ärztin oder einem Arzt untersucht worden ist und dir die
    Bescheinigung darüber vorliegt (§ 32 Abs. 1 JArbSchG). Die Untersuchung ist für die Jugendlichen kostenlos; den Berechtigungsschein gibt es bei der Gemeinde. Amtlos legt die Aufgabe bei jeder Einstellung
    an, solange du Jugendliche beschäftigst – betrifft die Einstellung eine erwachsene Person oder war die jugendliche Person schon vorher beschäftigt, trifft sie nicht zu. Die erste Nachuntersuchung nach
    einem Jahr ist eine eigene Pflicht.
  en: A young person entering working life may only be employed if they have been examined by a doctor within the last 14 months before the start and you have the certificate (§ 32(1) JArbSchG). The examination
    is free of charge for the young person; the entitlement voucher is available from the municipality. Amtlos creates the task for every hiring while you employ young people – if the hiring concerns an
    adult or the young person was already employed before, it does not apply. The first follow-up examination after one year is a separate obligation.
- de: Ein Prozentsatz, den jede Gemeinde selbst festlegt und der die Höhe der Gewerbesteuer bestimmt.
  en: A percentage that each municipality sets itself and that determines the amount of trade tax.
- de: Ein Vorgang, bei dem du Daten über Menschen nutzt, z. B. Kundenverwaltung oder Lohnabrechnung.
  en: An activity in which you use data about people, e.g. customer management or payroll.
- de: 'Ein eigenes Bußgeld für die verspätete Aufstellung nennt das Gesetz nicht. Wer die Bilanz nicht in der vorgeschriebenen Zeit aufstellt, macht sich strafbar, wenn die Gesellschaft später ihre Zahlungen einstellt oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird: Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe, bei Fahrlässigkeit bis zu einem Jahr (§ 283b Abs. 1 Nr. 3 Buchst. b, Abs. 2, 3 StGB in Verbindung mit § 283 Abs. 6 StGB).'
  en: 'The law provides no separate fine for late preparation. Anyone who does not prepare the balance sheet within the prescribed time commits a criminal offence if the company later stops payments or insolvency proceedings are opened or rejected for lack of assets: imprisonment of up to two years or a fine, in case of negligence up to one year (§ 283b(1) no. 3 letter b, (2), (3) StGB in conjunction with § 283(6) StGB).'
- de: Eine Beschäftigte hat dir ihre Schwangerschaft mitgeteilt.
  en: An employee has told you she is pregnant.
- de: Eine Beschäftigung endet.
  en: An employment ends.
- de: Eine E-Rechnung ist ein strukturierter Datensatz. Eine PDF-Rechnung ist keine E-Rechnung.
  en: An e-invoice is a structured data record. A PDF invoice is not an e-invoice.
- de: Eine Rechnung als strukturierter Datensatz, den Software automatisch lesen kann.
  en: An invoice as a structured data record that software can read automatically.
- de: Eine UG muss jedes Jahr ein Viertel ihres Jahresüberschusses in eine Rücklage stellen.
  en: A UG must put a quarter of its annual net profit into a reserve every year.
- de: Eine achtstellige Nummer, unter der dein Betrieb bei der Sozialversicherung geführt wird.
  en: An eight-digit number under which your business is registered with social security.
- de: Eine ausreichende Zahl von Beschäftigten machst du durch Unterweisung und Übung mit dem Löschen von Entstehungsbränden vertraut (§ 10 Abs. 2 ArbSchG, § 22 Abs. 2 DGUV Vorschrift 1). Nach ASR A2.2
    Abschnitt 7.3 ergibt sich die Zahl aus der Gefährdungsbeurteilung; ein Anteil von 5 Prozent der Beschäftigten reicht in der Regel. Mehr brauchst du bei erhöhter Brandgefährdung, vielen Personen oder
    großen Flächen; Schichtbetrieb, Urlaub und Krankheit planst du ein. Die Ausbildung besteht aus Theorie und einer praktischen Löschübung; empfohlen ist eine Auffrischung alle drei bis fünf Jahre (DGUV
    Information 205-023). In kleinen Betrieben bist oft du selbst die erste Brandschutzhelferin oder der erste Brandschutzhelfer.
  en: You familiarise a sufficient number of employees with fighting incipient fires through instruction and practice (§ 10(2) ArbSchG, § 22(2) DGUV Regulation 1). According to ASR A2.2 Section 7.3, the
    number follows from the risk assessment; a share of 5 per cent of employees is usually enough. You need more with increased fire risk, many people or large areas; you plan for shift work, holidays and
    illness. Training consists of theory and a practical fire-fighting exercise; a refresher every three to five years is recommended (DGUV Information 205-023). In small businesses you yourself are often
    the first fire safety assistant.
- de: Eine betroffene Person hat eine Anfrage gestellt.
  en: A data subject has made a request.
- de: Eine schriftliche Liste, welche Gefahren es bei der Arbeit gibt und wie du sie verringerst.
  en: A written list of the hazards at work and how you reduce them.
- de: Einkommensteuererklärung abgeben
  en: File your income tax return
