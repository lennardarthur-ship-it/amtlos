  en: A service provider processes data on your behalf and according to your instructions.
- de: Ein Gesetzentwurf liegt noch nicht vor. Amtlos beobachtet das Vorhaben und passt den Gründungsassistenten an, sobald es konkret wird.
  en: There is no draft bill yet. Amtlos is following the plan and will update the founding assistant as soon as it becomes concrete.
- de: Ein Jahr nach jeder Unterweisung erinnert Amtlos an die Wiederholung. Mit der neuen Unterweisung ist die alte erledigt.
  en: One year after each safety briefing, Amtlos reminds you to repeat it. The new safety briefing completes the old one.
- de: Ein Prozentsatz, den jede Gemeinde selbst festlegt und der die Höhe der Gewerbesteuer bestimmt.
  en: A percentage that each municipality sets itself and that determines the amount of trade tax.
- de: Ein Vorgang, bei dem du Daten über Menschen nutzt, z. B. Kundenverwaltung oder Lohnabrechnung.
  en: An activity in which you use data about people, e.g. customer management or payroll.
- de: Eine Beschäftigte hat dir ihre Schwangerschaft mitgeteilt.
  en: An employee has told you she is pregnant.
- de: Eine Beschäftigung endet.
  en: An employment ends.
- de: Eine E-Rechnung ist ein strukturierter Datensatz. Eine PDF-Rechnung ist keine E-Rechnung.
  en: An e-invoice is a structured data record. A PDF invoice is not an e-invoice.
- de: Eine Rechnung als strukturierter Datensatz, den Software automatisch lesen kann.
  en: An invoice as a structured data record that software can read automatically.
- de: Eine UG muss jedes Jahr ein Viertel ihres Jahresüberschusses in eine Rücklage stellen.
  en: A UG must put a quarter of its annual net profit into a reserve every year.
- de: Eine achtstellige Nummer, unter der dein Betrieb bei der Sozialversicherung geführt wird.
  en: An eight-digit number under which your business is registered with social security.
- de: Eine betroffene Person hat eine Anfrage gestellt.
  en: A data subject has made a request.
- de: Eine schriftliche Liste, welche Gefahren es bei der Arbeit gibt und wie du sie verringerst.
  en: A written list of the hazards at work and how you reduce them.
- de: Einkommensteuererklärung abgeben
  en: File your income tax return
- de: Einmal im Jahr ermittelst du deinen Gewinn mit der Anlage EÜR und übermittelst sie elektronisch.
  en: Once a year, you calculate your profit with the Anlage EÜR and submit it electronically.
- de: Einmal im Jahr gibst du elektronisch deine Einkommensteuererklärung ab.
  en: Once a year, you file your income tax return electronically.
- de: Einmal im Jahr gibst du elektronisch die Gewerbesteuererklärung ab.
  en: Once a year, you file the trade tax (Gewerbesteuer) return electronically.
- de: Einmal im Jahr gibst du elektronisch die Umsatzsteuer-Jahreserklärung ab.
  en: Once a year, you file the annual VAT return electronically.
- de: Einmal im Jahr gibst du für deine Gesellschaft elektronisch die Körperschaftsteuererklärung ab.
  en: Once a year, you file the corporate income tax (Körperschaftsteuer) return for your company electronically.
- de: Einnahmen-Überschuss-Rechnung (Anlage EÜR) abgeben
  en: Submit the cash-basis profit statement (Anlage EÜR)
- de: Einwilligung für Cookies und Tracking einholen
  en: Get consent for cookies and tracking
- de: Elektrische Betriebsmittel müssen in bestimmten Abständen geprüft werden. Amtlos erinnert an die Prüffristen, sobald sie als Regeldaten hinterlegt sind.
  en: Electrical equipment must be inspected at certain intervals. Amtlos reminds you of the inspection deadlines as soon as they are stored as rule data.
- de: Elektrische Geräte prüfen lassen
  en: Have electrical equipment inspected
- de: Elektrische Geräte und Anlagen lässt du regelmäßig prüfen (DGUV Vorschrift 3).
  en: You have electrical equipment and installations inspected regularly (DGUV Vorschrift 3).
- de: Elektrofachkraft
  en: Qualified electrician
- de: Elektrogeräte bei der stiftung ear registrieren
  en: Register electrical devices with stiftung ear
- de: Elektronische Arbeitsunfähigkeitsbescheinigung, die du bei der Krankenkasse abrufst.
  en: Electronic certificate of incapacity for work (sick note) that you retrieve from the health insurance fund.
- de: Elektronische Arbeitszeiterfassung (geplante Neuregelung)
  en: Electronic time recording (planned new rules)
- de: Elektronische Aufzeichnungssysteme müssen durch eine zertifizierte technische Sicherheitseinrichtung geschützt sein. Zu jedem Geschäftsvorfall ist ein Beleg auszugeben.
  en: Electronic recording systems must be protected by a certified technical security device. A receipt must be issued for every business transaction.
- de: Elektronische Kasse beim Finanzamt melden
  en: Register your electronic cash register with the tax office
- de: Elektronische Kassen müssen dem Finanzamt gemeldet werden, innerhalb eines Monats nach Anschaffung oder Außerbetriebnahme. Bestandskassen waren bis 31.7.2025 zu melden.
  en: Electronic cash registers must be reported to the tax office (Finanzamt) within one month of purchase or decommissioning. Existing cash registers had to be reported by 31.7.2025.
- de: Endet eine Beschäftigung, meldest du die Person bei der Krankenkasse ab.
  en: When an employment ends, you deregister the person with the health insurance fund (Krankenkasse).
- de: Entgeltstruktur nach Geschlecht auswerten (mit Lohnbüro)
  en: Analyse the pay structure by gender (with your payroll office)
- de: Entscheidend ist das Gesamtbild der Tätigkeit. Die Deutsche Rentenversicherung prüft den Status auf Antrag.
  en: What matters is the overall picture of the activity. The German Pension Insurance (Deutsche Rentenversicherung) checks the status on application.
- de: Erhebliche Sicherheitsvorfälle meldest du dem BSI in festen Stufen und Fristen.
  en: You report significant security incidents to the BSI in fixed stages and deadlines.
- de: Erlaubnis für Güter- oder Personenbeförderung
  en: Permit for transporting goods or passengers
- de: Erlaubnis für dein Gewerbe einholen
  en: Get a permit for your trade
- de: Erlaubnispflichtig sind unter anderem Makler, Bewachung, Versicherungs- und Finanzanlagenvermittlung (§§ 30–34i GewO), Gaststätten nach dem Gaststättenrecht der Länder und das Reisegewerbe (Reisegewerbekarte).
    Die Erlaubnis muss vor Aufnahme der Tätigkeit vorliegen.
  en: Trades requiring a permit include brokers, security services, insurance and financial investment brokerage (§§ 30–34i GewO), restaurants and bars under the federal states' hospitality law, and itinerant
    trade (Reisegewerbekarte). You must have the permit before you start the activity.
- de: Erste Hilfe und Brandschutz organisieren
  en: Organise first aid and fire safety
- de: Ersthelfer ab 2 Versicherten, Erste-Hilfe-Material, Verbandbuch und Brandschutzhelfer nach ASR A2.2.
  en: First aiders from 2 insured persons, first-aid supplies, first-aid log and fire safety assistants according to ASR A2.2.
- de: Es gab einen Arbeitsunfall.
  en: There was a workplace accident.
- de: Fachkraft für Arbeitssicherheit und Betriebsarzt
  en: Occupational safety specialist and company doctor
- de: Finanzamt
  en: Tax office (Finanzamt)
- de: Fragebogen zur steuerlichen Erfassung abgeben
  en: Submit the tax registration questionnaire
- de: Fragt jemand nach seinen Daten oder verlangt Löschung, antwortest du innerhalb eines Monats.
  en: If someone asks about their data or requests deletion, you respond within one month.
- de: Freier Beruf
  en: Liberal profession (freier Beruf)
- de: Freistellungsbescheinigung für Bauleistungen beantragen
  en: Apply for an exemption certificate for construction work
- de: Fällig sind die Beiträge am drittletzten Bankarbeitstag des laufenden Monats. Das Lohnprogramm berechnet sie; die Krankenkassen ziehen sie in der Regel ein.
  en: The contributions are due on the third-to-last bank working day of the current month. The payroll software calculates them; the health insurance funds usually collect them by direct debit.
- de: Fällt dein Unternehmen unter NIS2, registrierst du es beim BSI. Die Nachfrist endete am 31.7.2026.
  en: If your company falls under NIS2, you register it with the BSI. The grace period ended on 31.7.2026.
- de: Fördergeber (z. B. BMWK, KfW, Länder)
  en: Funding bodies (e.g. BMWK, KfW, federal states)
- de: Förderprogramme prüfen (Option)
  en: Check funding programmes (optional)
- de: Für Beschäftigte zahlst du Umlagen (U1, U2, U3) und rufst Arbeitsunfähigkeitsbescheinigungen elektronisch ab.
  en: For employees, you pay levies (U1, U2, U3) and retrieve sick notes electronically.
- de: Für Beschäftigtendaten gelten besondere Regeln. Amtlos selbst speichert nur das Nötigste (Name, Beschäftigungsart, Eintritt und Austritt).
  en: Special rules apply to employee data. Amtlos itself stores only what is necessary (name, type of employment, start and end date).
- de: Für Betriebsstätten fällt der Rundfunkbeitrag an. Die Anmeldung machst du beim Beitragsservice.
  en: The broadcasting fee (Rundfunkbeitrag) applies to business premises. You register with the Beitragsservice.
- de: Für Fahrerinnen und Fahrer gelten Lenk- und Ruhezeiten, die mit dem Fahrtenschreiber aufgezeichnet werden.
  en: Drivers must follow driving and rest times, which are recorded with the tachograph.
- de: Für Hochrisiko-KI-Systeme gelten umfangreiche Pflichten – verschoben auf 2.12.2027 bzw. 2.8.2028.
  en: Extensive obligations apply to high-risk AI systems, postponed to 2.12.2027 or 2.8.2028.
- de: Für Jugendliche gelten Erstuntersuchung, Arbeitszeitgrenzen und eine Aushangpflicht.
  en: For young people, an initial medical examination, working time limits and a notice posting obligation apply.
- de: Für Minijobber und in Sofortmeldebranchen musst du Beginn, Ende und Dauer der Arbeitszeit aufzeichnen.
  en: For mini-jobbers and in industries with immediate reporting obligations, you must record the start, end and duration of working time.
- de: Für Mitarbeiterbeteiligungen gibt es steuerliche Sonderregeln (§ 19a EStG) und virtuelle Modelle (VSOP). Amtlos erklärt die Modelle; Vorlagen folgen mit dem Dokumentengenerator.
  en: For employee participation, there are special tax rules (§ 19a EStG) and virtual models (VSOP). Amtlos explains the models; templates will follow with the document generator.
- de: Für Startups gibt es Förderprogramme wie EXIST, INVEST, KfW-Programme und Programme der Länder.
  en: There are funding programmes for startups such as EXIST, INVEST, KfW programmes and programmes of the federal states.
- de: Für Tätigkeiten mit Feuchtarbeit oder hautbelastenden Stoffen legst du in einem Hautschutzplan Schutz, Reinigung und Pflege fest.
  en: For work involving wet work or substances that stress the skin, you set out protection, cleaning and care in a skin protection plan.
- de: Für Verbraucherprodukte brauchst du eine verantwortliche Person in der EU, Herstellerangaben und Sicherheitsinformationen – auch im Onlineshop.
  en: For consumer products, you need a responsible person in the EU, manufacturer information and safety information – in your online shop too.
- de: Für bestimmte Produkte (z. B. Computer, Smartphones, E-Book-Reader) gelten Barrierefreiheitsanforderungen – die Kleinstunternehmen-Ausnahme gilt dafür nicht verlässlich.
  en: Accessibility requirements apply to certain products (e.g. computers, smartphones, e-book readers) – the micro-enterprise exemption does not reliably apply to them.
- de: Für bestimmte erlaubnispflichtige Tätigkeiten gilt eine regelmäßige Weiterbildungspflicht – nur wo sie noch gilt.
  en: For certain activities that require a permit, a regular continuing education obligation applies – only where it still applies.
- de: Für deine Werkleistungen haftest du für Mängel. Dokumentiere Abnahmen und behalte die Fristen im Blick.
  en: You are liable for defects in your work. Document acceptances and keep the deadlines in mind.
- de: Für eine UG oder GmbH lässt du den Gesellschaftsvertrag notariell beurkunden – auch online möglich.
  en: For a UG or GmbH, you have the articles of association (Gesellschaftsvertrag) notarised – this is also possible online.
- de: Für gewerblichen Güterkraftverkehr oder die Beförderung von Personen brauchst du in der Regel eine Erlaubnis oder Lizenz.
  en: For commercial road haulage or passenger transport, you usually need a permit or licence.
- de: Für jede beschäftigte Person geht einmal im Jahr eine Jahresmeldung an die Krankenkasse.
  en: Once a year, an annual notification goes to the health insurance fund (Krankenkasse) for each employee.
- de: Für jede neue beschäftigte Person hältst du die wesentlichen Arbeitsbedingungen schriftlich oder in zulässiger Form fest.
  en: For every new employee, you record the essential working conditions in writing or in another permitted form.
- de: Für manche Gewerbe brauchst du eine Erlaubnis, bevor du anfängst – zum Beispiel als Makler, im Bewachungsgewerbe oder in der Gastronomie.
  en: Some trades need a permit before you start, for example as a broker, in the security business or in hospitality.
- de: Gefahrstoffverzeichnis und Betriebsanweisungen
  en: Hazardous substances register and operating instructions
- de: Gefährdungsbeurteilung
  en: Risk assessment
- de: Gefährdungsbeurteilung erstellen
  en: Create a risk assessment
- de: Gefährdungsbeurteilung je Gewerk
  en: Risk assessment per trade
- de: Gegenüber Verbrauchern gibst du Gesamtpreise an, bei Waren nach Gewicht, Volumen oder Länge auch den Grundpreis.
  en: To consumers, you state total prices, and for goods sold by weight, volume or length also the unit price.
- de: Geldwäschegesetz bei hohen Bargeschäften
  en: Anti-Money Laundering Act for large cash transactions
- de: Geldwäschegesetz für Immobilien- und Finanzbranche
  en: Anti-Money Laundering Act for real estate and finance
- de: Gemeinde (Steueramt)
  en: Municipality (tax office, Steueramt)
- de: Geplant bis Ende 2026, noch kein Gesetz. Die Pflichten nach Art. 37 DSGVO blieben bestehen.
  en: Planned by the end of 2026, no law yet. The obligations under Art. 37 GDPR would remain.
- de: Geplant ist eine Pflicht zur elektronischen Arbeitszeiterfassung, mit Übergangsfristen nach Betriebsgröße.
