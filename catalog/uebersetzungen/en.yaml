- de: Kein eigenes Bußgeld vorgesehen (§ 101 BBiG nennt § 14 Abs. 2 BBiG nicht). Ohne geführten Ausbildungsnachweis fehlt eine Voraussetzung für die Zulassung zur Abschlussprüfung (§ 43 Abs. 1 Nr. 2 BBiG).
  en: No separate fine is provided (§ 101 BBiG does not mention § 14(2) BBiG). Without a kept training record, one requirement for admission to the final examination is missing (§ 43(1) no. 2 BBiG).
- de: 'Kein eigenes Bußgeld vorgesehen.'
  en: 'No separate fine is provided for.'
