- de: Pflichtversichert sind zum Beispiel Lehrende, Pflegepersonen, Handwerker in der Handwerksrolle und Selbstständige mit nur einem Auftraggeber. Die Meldung an die Deutsche Rentenversicherung muss innerhalb
    von drei Monaten erfolgen.
  en: Mandatorily insured are, for example, teachers, carers, craftspeople in the register of craftspeople and self-employed people with only one client. You must register with the German Pension Insurance
    (Deutsche Rentenversicherung) within three months.
- de: Preise richtig angeben
  en: State prices correctly
- de: 'Produktsicherheit (GPSR): Angaben und verantwortliche Person'
  en: 'Product safety (GPSR): information and responsible person'
- de: Prüfe in deinen Verträgen die Haftung und ob eine Berufs- oder Betriebshaftpflicht passt.
  en: Check the liability in your contracts and whether professional or business liability insurance is right for you.
- de: Prüfe, ob der frühere Link zur Online-Streitbeilegungsplattform der EU auf deiner Website noch aktuell ist.
  en: Check whether the former link to the EU online dispute resolution platform on your website is still up to date.
- de: Prüfen, ob NIS2 für dich gilt
  en: Check whether NIS2 applies to you
- de: Prüfen, ob deine Produkte unter das BFSG fallen
  en: Check whether your products fall under the BFSG
- de: Prüfen, ob die Benennungspflicht nach Art. 37 DSGVO unabhängig davon besteht
  en: Check whether the obligation to appoint under Art. 37 GDPR applies regardless
- de: Prüfen, ob eine Datenschutz-Folgenabschätzung nötig ist
  en: Check whether a data protection impact assessment is needed
- de: Prüfen, ob eure KI-Produkte in einen Hochrisiko-Bereich fallen
  en: Check whether your AI products fall into a high-risk area
- de: Prüfen, welche Übergangsfrist für eure Betriebsgröße gelten würde
  en: Check which transition period would apply to your company size
- de: Rechnungen mit allen Pflichtangaben schreiben
  en: Write invoices with all mandatory details
- de: Regeln der Finanzverwaltung, wie Bücher und Belege elektronisch geführt und aufbewahrt werden.
  en: Rules of the tax authorities on how books and receipts are kept and stored electronically.
- de: Registergericht (über den Notar)
  en: Registry court (Registergericht) (via the notary)
- de: Rentenversicherungspflicht melden
  en: Report mandatory pension insurance
- de: Rundfunkbeitrag für die Betriebsstätte anmelden
  en: Register your business premises for the broadcasting fee
- de: Rücklage der UG bilden
  en: Build up the UG reserve
- de: 'Rücklage der UG: Anteil am Jahresüberschuss'
  en: 'UG reserve: share of annual net profit'
- de: SOKA-BAU
  en: SOKA-BAU
- de: Sag deiner Krankenversicherung, dass du selbstständig bist. Hauptberuflich Selbstständige versichern sich selbst.
  en: Tell your health insurance that you are self-employed. If self-employment is your main occupation, you insure yourself.
- de: Scheinselbstständigkeit
  en: Bogus self-employment (Scheinselbstständigkeit)
- de: Scheinselbstständigkeit vermeiden
  en: Avoid false self-employment
- de: Schwangerschaft der Aufsichtsbehörde mitteilen
  en: Notify the supervisory authority of a pregnancy
- de: Seit 19.6.2026 brauchen B2C-Online-Verträge mit Widerrufsrecht einen Widerrufsbutton – zweistufig, ohne Login, mit Eingangsbestätigung auf einem dauerhaften Datenträger.
  en: 'Since 19.6.2026, B2C online contracts with a right of withdrawal need a withdrawal button: two-step, without login, with confirmation of receipt on a durable medium.'
- de: Seit 2025 musst du elektronische Rechnungen (XRechnung, ZUGFeRD) von anderen Unternehmen empfangen können.
  en: Since 2025, you must be able to receive electronic invoices (XRechnung, ZUGFeRD) from other businesses.
- de: Seit 28.6.2025 müssen bestimmte Dienstleistungen wie Onlineshops barrierefrei sein – mit Barrierefreiheitserklärung.
  en: Since 28.6.2025, certain services such as online shops must be accessible, with an accessibility statement.
- de: Setzt deine Website Tracking oder nicht notwendige Cookies ein, holst du vorher die Einwilligung der Besucher ein.
  en: If your website uses tracking or non-essential cookies, you get visitors' consent first.
- de: Sicherheitsvorfälle melden (NIS2)
  en: Report security incidents (NIS2)
- de: Sind in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung von Daten beschäftigt, benennst du einen Datenschutzbeauftragten.
  en: If, as a rule, at least 20 people are constantly involved in the automated processing of data, you appoint a data protection officer.
- de: Sobald du mindestens eine Person beschäftigst, musst du die Gefährdungen an jedem Arbeitsplatz beurteilen, Schutzmaßnahmen festlegen und das dokumentieren. Amtlos erstellt dir dafür eine Vorlage passend
    zu deiner Branche.
  en: As soon as you employ at least one person, you must assess the hazards at every workplace, define protective measures and document this. Amtlos creates a template for you that fits your industry.
- de: Sofortmeldung bei Arbeitsbeginn
  en: Immediate notification when work starts
- de: Sondervorauszahlung zur Umsatzsteuer leisten
  en: Make the special advance VAT payment
- de: Sozialversicherungsbeiträge zahlen
  en: Pay social security contributions
- de: Sozialversicherungsstatus der Geschäftsführung klären
  en: Clarify the social security status of managing directors
- de: Stammkapital
  en: Share capital
- de: Stammkapital einzahlen
  en: Pay in the share capital
- de: Statusfeststellung erwägen (Scheinselbstständigkeit)
  en: Consider a status determination (bogus self-employment)
- de: Stellst du eigene Kosmetikprodukte her oder bringst sie unter deinem Namen in Verkehr, gelten die Pflichten der EU-Kosmetikverordnung.
  en: If you make your own cosmetic products or place them on the market under your name, the obligations of the EU Cosmetics Regulation apply.
- de: TOM
  en: TOM
- de: TSE
  en: TSE
- de: Technische Sicherheitseinrichtung, die Kassendaten gegen Manipulation schützt.
  en: Technical security device that protects cash register data against tampering.
- de: Technische und organisatorische Maßnahmen festlegen
  en: Define technical and organisational measures
- de: Technische und organisatorische Maßnahmen zum Schutz personenbezogener Daten.
  en: Technical and organisational measures to protect personal data.
- de: Teilnahme an SOKA-BAU
  en: Participation in SOKA-BAU
- de: Teilt dir eine Beschäftigte ihre Schwangerschaft mit, informierst du die Aufsichtsbehörde.
  en: If an employee tells you she is pregnant, you inform the supervisory authority.
- de: Transparenzregister (Bundesanzeiger Verlag)
  en: Transparency register (Transparenzregister, Bundesanzeiger Verlag)
- de: 'Tätigkeit einordnen: freier Beruf oder Gewerbe'
  en: 'Classify your activity: liberal profession or trade'
- de: Umlagen U1/U2/U3 und eAU-Abruf
  en: U1/U2/U3 levies and eAU retrieval
- de: Umsatzsteuer-Identifikationsnummer beantragen
  en: Apply for a VAT identification number
- de: Umsatzsteuer-Jahreserklärung abgeben
  en: File the annual VAT return
- de: Umsatzsteuer-Voranmeldung abgeben
  en: Submit the advance VAT return
- de: 'Umsatzsteuer: Regelsteuersatz'
  en: 'VAT: standard rate'
- de: 'Umsatzsteuer: ermäßigter Steuersatz'
  en: 'VAT: reduced rate'
- de: Unabhängig davon, ob jemand schwanger ist, beurteilst du die Arbeitsplätze auch nach dem Mutterschutzgesetz.
  en: Regardless of whether anyone is pregnant, you also assess workplaces under the Maternity Protection Act (Mutterschutzgesetz).
- de: Unterlagen aufbewahren
  en: Keep records
- de: Unternehmensregister
  en: Company register (Unternehmensregister)
- de: Unterweisung jährlich wiederholen
  en: Repeat the safety briefing every year
- de: VSOP
  en: VSOP
- de: Verarbeitest du besonders sensible Daten oder überwachst du mit Video, prüfst du, ob eine Datenschutz-Folgenabschätzung nötig ist.
  en: If you process particularly sensitive data or use video surveillance, you check whether a data protection impact assessment is needed.
- de: Verarbeitungstätigkeit
  en: Processing activity
- de: Verbraucher haben bei Fernabsatzverträgen in der Regel ein Widerrufsrecht, über das du vor Vertragsschluss informieren musst.
  en: Consumers usually have a right of withdrawal for distance contracts, which you must inform them about before the contract is concluded.
- de: Verbraucher müssen den Widerruf online so einfach erklären können wie den Vertragsschluss.
  en: Consumers must be able to declare withdrawal online as easily as concluding the contract.
- de: Verpackungen registrieren und lizenzieren
  en: Register and license packaging
- de: Versicherte, ab denen Ersthelfer nötig sind
  en: Insured persons from which first aiders are required
- de: Verzeichnis der Verarbeitungstätigkeiten führen
  en: Keep a record of processing activities
- de: Videoüberwachung braucht einen berechtigten Zweck, muss erkennbar sein (Hinweisschild) und gehört ins Verzeichnis der Verarbeitungstätigkeiten.
  en: Video surveillance needs a legitimate purpose, must be recognisable (sign) and belongs in the record of processing activities.
- de: Videoüberwachung kennzeichnen und begründen
  en: Label and justify video surveillance
- de: 'Virtuelles Beteiligungsprogramm: Mitarbeitende werden wirtschaftlich beteiligt, ohne echte Anteile zu bekommen.'
  en: 'Virtual stock option plan: employees share in the company financially without receiving real shares.'
- de: Vor Arbeitsbeginn unterweisen
  en: Give a safety briefing before work starts
- de: Vorauszahlungen sind Abschläge auf die Steuer des laufenden Jahres. Die Höhe steht im Vorauszahlungsbescheid.
  en: Prepayments are instalments on the current year's tax. The amount is stated in the prepayment notice (Vorauszahlungsbescheid).
- de: Vorauszahlungen zur Einkommen- oder Körperschaftsteuer zahlen
  en: Pay income tax or corporate income tax prepayments
- de: Vorjahres-Zahllast, ab der die USt-Voranmeldung monatlich abzugeben ist
  en: Previous year's VAT liability from which the advance VAT return must be filed monthly
- de: Vorjahres-Zahllast, bis zu der eine Befreiung von der USt-Voranmeldung möglich ist
  en: Previous year's VAT liability up to which an exemption from the advance VAT return is possible
- de: Wegfall der Schwelle nach § 38 BDSG (geplant)
  en: Removal of the threshold under § 38 BDSG (planned)
- de: Weiterbildungspflicht (Immobilien und Finanzen)
  en: Continuing education obligation (real estate and finance)
- de: Welche Angaben eine Rechnung braucht, regelt § 14 UStG. Für Kleinbetragsrechnungen gelten Erleichterungen. Kleinunternehmer weisen auf die Steuerbefreiung nach § 19 UStG hin.
  en: § 14 UStG sets out which details an invoice needs. Simplified rules apply to small-amount invoices. Small businesses under the small business scheme refer to the tax exemption under § 19 UStG.
- de: Welche Erlaubnis nötig ist, hängt vom Beruf ab (z. B. Heilpraktiker, Pflege, Physiotherapie). Ohne sie darfst du die Tätigkeit nicht ausüben.
  en: Which permit you need depends on the profession (e.g. alternative practitioner (Heilpraktiker), nursing, physiotherapy). Without it, you may not carry out the activity.
- de: Welche Gesetze auszuhängen sind, hängt von der Belegschaft ab. Amtlos stellt die Liste zusammen.
  en: Which laws must be displayed depends on your workforce. Amtlos compiles the list.
- de: Welche Pflichten greifen, hängt von Größe und Dauer der Baustelle und der Zahl der beteiligten Firmen ab; meist trifft sie den Bauherrn.
  en: Which obligations apply depends on the size and duration of the construction site and the number of companies involved; they usually fall on the client (Bauherr).
- de: Wenn ausländische Investoren in ein Unternehmen in einem sensiblen Sektor einsteigen, kann eine Investitionsprüfung nötig sein.
  en: If foreign investors invest in a company in a sensitive sector, an investment screening may be required.
- de: Wenn das Finanzamt Vorauszahlungen festgesetzt hat, zahlst du sie am 10. März, 10. Juni, 10. September und 10. Dezember.
  en: If the tax office (Finanzamt) has set prepayments, you pay them on 10 March, 10 June, 10 September and 10 December.
- de: Wenn die Gemeinde Gewerbesteuer-Vorauszahlungen festgesetzt hat, zahlst du sie am 15. Februar, 15. Mai, 15. August und 15. November.
  en: If the municipality has set trade tax prepayments, you pay them on 15 February, 15 May, 15 August and 15 November.
- de: Wenn du Arbeitslosengeld I bekommst, kannst du einen Gründungszuschuss beantragen – vor dem Start.
  en: If you receive unemployment benefit I (Arbeitslosengeld I), you can apply for a start-up grant (Gründungszuschuss), before you start.
- de: Wenn du Bauleistungen erbringst, beantragst du beim Finanzamt eine Freistellungsbescheinigung, damit deine Auftraggeber keine Bauabzugsteuer einbehalten.
  en: If you provide construction services, you apply to the tax office (Finanzamt) for an exemption certificate (Freistellungsbescheinigung) so that your clients do not withhold construction withholding
    tax (Bauabzugsteuer).
- de: Wenn du Daten erhebst, informierst du die Menschen darüber – etwa in einer Datenschutzerklärung oder einem Informationsblatt.
  en: When you collect data, you inform the people concerned – for example in a privacy policy or an information sheet.
- de: Wenn du Geschäfte mit Kunden in anderen EU-Ländern machst, beantragst du eine USt-IdNr. beim Bundeszentralamt für Steuern.
  en: If you do business with customers in other EU countries, you apply for a VAT ID number (USt-IdNr.) from the Federal Central Tax Office (Bundeszentralamt für Steuern).
- de: Wenn du Leistungen an Unternehmen in anderen EU-Ländern erbringst, meldest du sie in der Zusammenfassenden Meldung.
  en: If you provide services to businesses in other EU countries, you report them in the EC sales list (Zusammenfassende Meldung).
- de: Wenn du Mitarbeitende am Unternehmen beteiligen willst, gibt es dafür besondere Regeln und Modelle wie VSOP.
  en: If you want to give employees a stake in the company, there are special rules and models such as VSOP.
- de: Wenn du Videoüberwachung einsetzt, machst du sie erkennbar und dokumentierst den Zweck.
  en: If you use video surveillance, you make it recognisable and document the purpose.
- de: Wenn du die Voranmeldung monatlich abgibst und eine Dauerfristverlängerung hast, zahlst du einmal im Jahr eine Sondervorauszahlung von einem Elftel.
  en: If you file the advance return monthly and have a permanent deadline extension (Dauerfristverlängerung), you make a special advance payment (Sondervorauszahlung) of one eleventh once a year.
- de: Wenn du ein Handwerk betreibst, musst du dich bei der Handwerkskammer eintragen lassen.
  en: If you run a craft business, you must register with the Chamber of Crafts (Handwerkskammer).
- de: Wenn du eine elektronische Kasse nicht mehr nutzt, meldest du das innerhalb eines Monats über ELSTER.
  en: If you stop using an electronic cash register, you report this via ELSTER within one month.
- de: Wenn du nur einen Auftraggeber hast, kannst du bei der Clearingstelle der Rentenversicherung klären lassen, ob du wirklich selbstständig bist.
  en: If you only have one client, you can ask the clearing office of the pension insurance (Clearingstelle) to determine whether you are really self-employed.
- de: Wenn ihr mit Gefahrstoffen arbeitet, führst du ein Verzeichnis und schreibst Betriebsanweisungen.
  en: If you work with hazardous substances, you keep a register and write operating instructions.
- de: Wenn jemand formal selbstständig ist, tatsächlich aber wie ein Angestellter arbeitet.
  en: When someone is formally self-employed but actually works like an employee.
- de: Wenn sich im Gesellschafterkreis etwas ändert, muss eine neue Gesellschafterliste zum Handelsregister – über den Notar.
  en: If anything changes among the shareholders, a new list of shareholders (Gesellschafterliste) must be submitted to the commercial register (Handelsregister) – via the notary.
- de: Wer Jugendliche beschäftigt, braucht vorab eine ärztliche Erstuntersuchung, muss besondere Arbeitszeitgrenzen einhalten und das Jugendarbeitsschutzgesetz aushängen.
  en: If you employ young people, they need an initial medical examination beforehand, you must comply with special working time limits and you must post the Youth Employment Protection Act (Jugendarbeitsschutzgesetz).
- de: Wer Umsatzsteuer auf Rechnungen ausweist, gibt je nach Höhe der Steuer im Vorjahr monatlich oder vierteljährlich eine Voranmeldung über ELSTER ab. Amtlos bereitet die Zahlen vor; du übermittelst selbst.
  en: If you show VAT on invoices, you file an advance return via ELSTER monthly or quarterly, depending on the amount of tax in the previous year. Amtlos prepares the figures; you submit them yourself.
- de: Wer bei dir mit Lebensmitteln arbeitet, braucht vor dem ersten Arbeitstag die Belehrung nach § 43 IfSG.
  en: Anyone who works with food in your business needs the instruction under § 43 IfSG before their first working day.
- de: Wer im Unternehmen mit KI arbeitet, braucht ausreichende KI-Kompetenz – sorge für Schulung und halte sie fest.
  en: 'Anyone in your company who works with AI needs sufficient AI literacy: provide training and keep a record of it.'
- de: Wer nicht zur doppelten Buchführung verpflichtet ist, ermittelt den Gewinn mit der Einnahmen-Überschuss-Rechnung.
  en: If you are not required to use double-entry bookkeeping, you calculate your profit with the cash-basis profit statement (Einnahmen-Überschuss-Rechnung).
- de: Wer unter NIS2 fällt, muss erhebliche Sicherheitsvorfälle melden und Risikomanagement-Maßnahmen umsetzen. Die Geschäftsleitung haftet für die Umsetzung.
  en: If NIS2 applies to you, you must report significant security incidents and implement risk management measures. Management is liable for implementation.
- de: Wer wenig Umsatz macht, kann ohne Umsatzsteuer abrechnen.
  en: If you have low revenue, you can invoice without VAT.
- de: Widerrufsbutton für Online-Verträge
  en: Withdrawal button for online contracts
- de: Wie lange Mängelansprüche bestehen, hängt von der Art des Werks ab. Amtlos erinnert nach fachlicher Freigabe an das Ende der Fristen.
  en: How long claims for defects last depends on the type of work. After expert approval, Amtlos will remind you when the deadlines end.
- de: Wird eine Grenze überschritten, fällt ab diesem Umsatz Umsatzsteuer an.
  en: If a limit is exceeded, VAT is due from that sale onwards.
- de: Wirtschaftlich Berechtigte
  en: Beneficial owners
- de: Wirtschaftlich Berechtigte ans Transparenzregister melden
  en: Report beneficial owners to the transparency register
- de: Wissen und Fähigkeiten, um KI-Systeme sachkundig einzusetzen und ihre Chancen und Risiken zu kennen.
  en: Knowledge and skills to use AI systems competently and to understand their opportunities and risks.
- de: Zahl das Stammkapital auf das Geschäftskonto ein, bevor die Gesellschaft zum Handelsregister angemeldet wird.
  en: Pay the share capital into the business account before the company is registered with the commercial register (Handelsregister).
- de: Zentrale Stelle Verpackungsregister (LUCID)
  en: Central Agency Packaging Register (Zentrale Stelle Verpackungsregister, LUCID)
- de: Zulassungspflichtige Handwerke (Anlage A der Handwerksordnung) brauchen einen Meisterbrief oder eine Ausnahme. Zulassungsfreie Handwerke (Anlage B) müssen ebenfalls eingetragen werden.
  en: Crafts that require a licence (Annex A of the Handwerksordnung) need a master craftsman's certificate (Meisterbrief) or an exemption. Licence-free crafts (Annex B) must also be registered.
- de: Zum Jahresabschluss gehören Bilanz und Gewinn- und Verlustrechnung. Die Gesellschafter stellen ihn fest. Die Bilanz geht außerdem elektronisch als E-Bilanz ans Finanzamt.
  en: The annual financial statements include the balance sheet and profit and loss statement. The shareholders approve them. The balance sheet is also sent electronically to the tax office (Finanzamt)
    as an E-Bilanz.
- de: Zur Anmeldung gehört die Gesellschafterliste. Spätere Änderungen, etwa im Gesellschaftsvertrag oder bei der Geschäftsführung, werden ebenfalls notariell angemeldet.
  en: The registration includes the list of shareholders. Later changes, for example to the articles of association or the management, are also registered via a notary.
- de: Zusammenfassende Meldung abgeben
  en: Submit the EC sales list
- de: Zuständige Berufsgenossenschaft (nach Branche)
  en: Responsible employers' liability insurance association (by industry)
- de: Zuständige Erlaubnisbehörde (je nach Gewerbe und Land)
  en: Responsible permit authority (depends on trade and federal state)
- de: Zuständige Stelle nach BattDG
  en: Competent body under the BattDG
- de: Zuständige Verkehrsbehörde
  en: Competent transport authority
- de: Zwei Arbeitstage vor Fälligkeit der Beiträge übermittelst du den Beitragsnachweis an die Krankenkassen.
  en: Two working days before the contributions are due, you submit the contribution statement (Beitragsnachweis) to the health insurance funds.
- de: eAU
  en: eAU
- de: stiftung elektro-altgeräte register (ear)
  en: stiftung elektro-altgeräte register (ear)
- de: § 17 MiLoG verlangt Aufzeichnungen für geringfügig Beschäftigte und für Beschäftigte in den Branchen mit Sofortmeldepflicht.
  en: § 17 MiLoG requires records for marginally employed persons and for employees in industries with an immediate reporting obligation (Sofortmeldepflicht).
- de: § 312k BGB verlangt eine einfache Kündigungsmöglichkeit über die Website für Dauerschuldverhältnisse, die online geschlossen werden können.
  en: § 312k BGB requires an easy way to cancel via the website for continuing obligations that can be concluded online.
- de: Änderungen im Gesellschafterkreis werden notariell abgewickelt; die aktualisierte Gesellschafterliste wird beim Handelsregister eingereicht.
  en: Changes among the shareholders are handled by a notary; the updated list of shareholders is filed with the commercial register (Handelsregister).
- de: Über ELSTER übermittelst du Steuererklärungen und Anmeldungen ans Finanzamt, als Erstes den Fragebogen zur steuerlichen Erfassung. Weil die Aktivierungsdaten per Post kommen, solltest du das Konto
    früh beantragen.
  en: You use ELSTER to submit tax returns and filings to the tax office (Finanzamt), starting with the tax registration questionnaire (Fragebogen zur steuerlichen Erfassung). Because the activation data
    comes by post, you should apply for the account early.
- de: Über das Widerrufsrecht belehren
  en: Inform customers about the right of withdrawal
- de: Über die Datenverarbeitung informieren
  en: Inform people about data processing
- de: –
  en: –
