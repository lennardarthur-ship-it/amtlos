- de: 'Du sorgst dafür, dass bei einem Unfall sofort Hilfe geholt werden kann und Erste Hilfe geleistet wird (§ 24 DGUV Vorschrift 1, § 10 ArbSchG): Erste-Hilfe-Material in ausreichender Menge, gut erreichbar
    und gekennzeichnet – Art und Zahl der Verbandkästen richten sich nach der Zahl der Beschäftigten und der Gefährdung (§ 25 DGUV Vorschrift 1, ASR A4.3). Ein Aushang nennt Notruf, Ersthelfer und das Verhalten
    bei Unfällen (§ 24 Abs. 5 DGUV Vorschrift 1). Jede Erste-Hilfe-Leistung wird dokumentiert, zum Beispiel im Verbandbuch, und die Dokumentation fünf Jahre lang vertraulich aufbewahrt (§ 24 Abs. 6 DGUV
    Vorschrift 1). Ersthelfer sind eine eigene Pflicht.'
  en: 'You make sure that help can be called immediately in an accident and that first aid is given (§ 24 DGUV Regulation 1, § 10 ArbSchG): first-aid supplies in sufficient quantity, easy to reach and marked
    – the type and number of first-aid kits depend on the number of employees and the hazard (§ 25 DGUV Regulation 1, ASR A4.3). A notice states the emergency number, first aiders and what to do in an accident
    (§ 24(5) DGUV Regulation 1). All first aid given is documented, for example in the first-aid log, and the documentation is kept confidential for five years (§ 24(6) DGUV Regulation 1). First aiders
    are a separate obligation.'
