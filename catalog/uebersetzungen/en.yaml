- de: Kapitalgesellschaften und die GmbH & Co. KG (§ 264a HGB) müssen ihren Jahresabschluss beim Unternehmensregister offenlegen, binnen zwölf Monaten nach Ende des Geschäftsjahres (§ 325 Abs. 1a HGB).
    Kleinstkapitalgesellschaften können ihn stattdessen hinterlegen (§ 326 Abs. 2 HGB). Nach der Gründung ist der erste Stichtag das Ende des ersten Geschäftsjahres nach der Eintragung, auch wenn es ein
    Rumpfgeschäftsjahr ist.
  en: Corporations and the GmbH & Co. KG (§ 264a HGB) must disclose their annual financial statements in the company register within twelve months after the end of the financial year (§ 325(1a) HGB). Micro
    companies can deposit them instead (§ 326(2) HGB). After founding, the first reporting date is the end of the first financial year after registration, even if it is a short financial year.
- de: Kapitalgesellschaften zahlen Körperschaftsteuer und geben dafür jährlich eine Erklärung ab – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: Corporations pay corporate income tax and file an annual return for it – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
