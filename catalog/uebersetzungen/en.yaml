  en: If you hire young people entering working life, you have them show you the certificate of the initial medical examination before they start.
- de: Stellst du eigene Kosmetikprodukte her oder bringst sie unter deinem Namen in Verkehr, gelten die Pflichten der EU-Kosmetikverordnung.
  en: If you make your own cosmetic products or place them on the market under your name, the obligations of the EU Cosmetics Regulation apply.
- de: Stirbt jemand durch einen Arbeitsunfall oder ist er danach mehr als drei Tage arbeitsunfähig, zeigst du den Unfall binnen drei Tagen der BG an, nachdem du davon erfahren hast.
  en: If someone dies in an accident at work or is unable to work for more than three days afterwards, you report the accident to the BG within three days of learning about it.
