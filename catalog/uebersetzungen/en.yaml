- de: 'GmbH und UG bestehen vor der Eintragung als solche nicht; wer vorher in ihrem Namen handelt, haftet persönlich und solidarisch (§ 11 Abs. 1, 2 GmbHG). Die Erstanmeldung einer GmbH erzwingt das Registergericht nicht (§ 79 Abs. 2 GmbHG). Andere Anmeldepflichten, etwa der GmbH & Co. KG oder der Partnerschaft, kann es mit Zwangsgeld bis 5.000 € durchsetzen (§ 14 HGB, § 5 Abs. 2 PartGG).'
  en: 'A GmbH or UG does not exist as such before registration; anyone who acts in its name beforehand is personally and jointly liable (§ 11(1), (2) GmbHG). The registry court does not enforce the initial registration of a GmbH (§ 79(2) GmbHG). Other registration duties, for example of a GmbH & Co. KG or a partnership, it can enforce with a coercive fine of up to €5,000 (§ 14 HGB, § 5(2) PartGG).'
