  en: In your sector employees come into contact with biological agents, for example with blood, body fluids or germs.
- de: In deiner Branche meldest du neue Beschäftigte spätestens bei Arbeitsbeginn sofort an.
  en: In your industry, you register new employees immediately, at the latest when they start work.
- de: Innerhalb einer Woche nach Gründung meldest du dein Unternehmen bei der zuständigen Berufsgenossenschaft an – auch ohne Mitarbeiter.
  en: Within one week of founding, you register your business with the responsible employers' liability insurance association (Berufsgenossenschaft), even without employees.
- de: In deiner Branche weist du jede neue beschäftigte Person vor Arbeitsbeginn schriftlich darauf hin, dass sie bei der Arbeit einen Ausweis dabeihaben muss.
  en: In your sector you inform every new employee in writing, before they start work, that they must carry ID at work.
- de: 'In den Branchen nach § 28a Abs. 4 SGB IV ist eine Sofortmeldung spätestens bei Arbeitsbeginn Pflicht: Baugewerbe, Gaststätten- und Beherbergungsgewerbe, Personenbeförderung, Speditions-, Transport-
    und damit verbundenes Logistikgewerbe, Schaustellergewerbe, Gebäudereinigung, Auf- und Abbau von Messen und Ausstellungen, Fleischwirtschaft (ohne Fleischerhandwerk), Prostitutionsgewerbe, Wach- und
    Sicherheitsgewerbe sowie seit 30.12.2025 Friseur- und Kosmetikgewerbe (auch Nagelstudios) und plattformbasierte Lieferdienste. Die Forstwirtschaft gehört seitdem nicht mehr dazu. Zum Baugewerbe zählen
    auch Ausbaugewerke wie die Elektroinstallation (§ 101 Abs. 2 SGB III in Verbindung mit der Baubetriebe-Verordnung). Die Anmeldung zur Sozialversicherung mit der ersten Lohnabrechnung kommt dazu.'
  en: 'In the sectors under § 28a(4) SGB IV an immediate report at the latest when work starts is mandatory: construction, restaurants and accommodation, passenger transport, haulage, transport and related
    logistics, fairground and showmen''s trade, building cleaning, setting up and dismantling trade fairs and exhibitions, meat industry (excluding butchers'' trade), prostitution, guarding and security
    services and, since 30.12.2025, hairdressing and beauty trades (including nail studios) and platform-based delivery services. Forestry has no longer been included since then. Construction also includes
    finishing trades such as electrical installation (§ 101(2) SGB III in conjunction with the Construction Businesses Ordinance). The social security registration with the first payroll comes in addition.'
- de: In den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz müssen Beschäftigte bei der Arbeit ihren Personalausweis, Pass oder ein Ersatzpapier mitführen und dem Zoll auf Verlangen vorlegen. Du weist
    jede Person vor Beginn der Dienst- oder Werkleistungen nachweislich und schriftlich auf diese Pflicht hin (§ 2a Abs. 2 SchwarzArbG) – am besten zusammen mit dem Arbeitsvertrag. Den Hinweis bewahrst
    du für die Dauer der Beschäftigung auf und legst ihn bei einer Prüfung durch den Zoll vor. Ein unterschriebener Satz im Arbeitsvertrag reicht, wenn du ihn gesondert vorlegen kannst; sonst nimm ein eigenes
    Blatt mit Unterschrift. Die Mitführungspflicht gilt für alle, die in diesen Branchen Leistungen erbringen – auch für dich als Inhaberin oder Inhaber (§ 2a Abs. 1 SchwarzArbG).
  en: In the sectors under § 2a of the Act to Combat Undeclared Work, employees must carry their ID card, passport or a substitute document at work and show it to customs on request. You inform each person
    of this duty verifiably and in writing before the services or work begin (§ 2a(2) SchwarzArbG) – ideally together with the employment contract. You keep the notice for the duration of employment and
    present it during a customs inspection. A signed sentence in the employment contract is enough if you can present it separately; otherwise use a separate signed sheet. The duty to carry ID applies to
    everyone who provides services in these sectors – including you as the owner (§ 2a(1) SchwarzArbG).
- de: In der Gefährdungsbeurteilung ermittelst du, ob Beschäftigte Lärm ausgesetzt sind – wenn nötig mit Messungen durch eine fachkundige Person (§ 3, § 4 LärmVibrationsArbSchV). Die Auslösewerte liegen
    bei 80 und 85 dB(A) Tages-Lärmexpositionspegel bzw. 135 und 137 dB(C) Spitzenschalldruckpegel (§ 6). Technische Maßnahmen wie leisere Maschinen und Kapselung gehen vor (§ 7 Abs. 1). Ab dem unteren Auslösewert
    stellst du Gehörschutz bereit und unterweist die Beschäftigten, ab dem oberen Auslösewert müssen sie ihn tragen (§ 8, § 11). Bereiche, in denen der obere Auslösewert überschritten werden kann, kennzeichnest
    du als Lärmbereich und stellst ein Lärmminderungsprogramm auf (§ 7 Abs. 4, 5). Arbeitsmedizinische Vorsorge ist ab 80 dB(A) anzubieten und ab 85 dB(A) Pflicht – das steht bei der Vorsorge. Für Vibrationen
    (zum Beispiel Bohrhammer, Rüttelplatte) gilt dieselbe Verordnung.
  en: In the risk assessment you determine whether employees are exposed to noise – if necessary with measurements by a competent person (§ 3, § 4 LärmVibrationsArbSchV). The action values are 80 and 85
    dB(A) daily noise exposure level and 135 and 137 dB(C) peak sound pressure level (§ 6). Technical measures such as quieter machines and enclosures take priority (§ 7(1)). From the lower action value
    you provide hearing protection and instruct employees; from the upper action value they must wear it (§ 8, § 11). Areas where the upper action value may be exceeded are marked as noise areas, and you
    draw up a noise reduction programme (§ 7(4), (5)). Occupational health care must be offered from 80 dB(A) and is mandatory from 85 dB(A) – this is covered under preventive care. The same ordinance applies
    to vibration (for example hammer drill, vibrating plate).
- de: Innerhalb einer Woche nach Beginn deiner Tätigkeit meldest du dein Unternehmen bei der zuständigen Berufsgenossenschaft an – auch ohne Mitarbeiter.
  en: Within one week of starting your activity, you register your business with the responsible employers' liability insurance association (Berufsgenossenschaft), even without employees.
