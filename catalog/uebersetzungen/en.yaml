- de: Getränkeschankanlage und Flüssiggasanlage prüfen lassen
  en: Have beverage dispensing systems and liquefied gas systems inspected
- de: 'Getränkeschankanlagen arbeiten mit Kohlendioxid unter Druck; Gasflasche, Druckminderer und Leitungen sind Arbeitsmittel nach der Betriebssicherheitsverordnung. Art und Abstände der Prüfungen legst
    du in der Gefährdungsbeurteilung fest und lässt sie von einer befähigten Person durchführen (§§ 3, 14 BetrSichV); die DGUV Regel 110-007 beschreibt Bau, Betrieb und Prüfung. Ausströmendes CO2 kann in
    Kellern und engen Räumen zu Erstickung führen – dort gehören eine Gaswarnanlage und gesicherte Flaschen dazu. Für Flüssiggas, etwa am Gasgrill, Wok-Herd oder im Foodtruck, gilt die DGUV Vorschrift 79:
    Prüfung vor der ersten Inbetriebnahme und wiederkehrend durch eine befähigte Person, mit Prüfbescheinigung.'
  en: 'Beverage dispensing systems work with pressurised carbon dioxide; gas cylinder, pressure regulator and lines are work equipment under the Industrial Safety Ordinance. You set the type and intervals
    of the inspections in the risk assessment and have them carried out by a qualified person (§§ 3, 14 BetrSichV); DGUV Rule 110-007 describes construction, operation and inspection. Escaping CO2 can cause
    suffocation in cellars and confined spaces – there, a gas warning system and secured cylinders are needed. For liquefied gas, for example on a gas grill, wok cooker or in a food truck, DGUV Regulation
    79 applies: inspection before first commissioning and regularly by a qualified person, with an inspection certificate.'
