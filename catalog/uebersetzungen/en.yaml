- de: Sind bei der Arbeit mindestens zwei Personen anwesend, sorgst du für ausgebildete Ersthelfer und lässt sie alle zwei Jahre fortbilden.
  en: If at least two people are present at work, you ensure trained first aiders and have them attend refresher training every two years.
