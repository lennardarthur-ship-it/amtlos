- de: Je nach Belegschaft hängst du bestimmte Gesetze im Betrieb aus, zum Beispiel ArbZG, AGG, MuSchG und JArbSchG.
  en: Depending on your workforce, you display certain laws at your workplace, for example ArbZG, AGG, MuSchG and JArbSchG.
- de: 'Jede Erste-Hilfe-Leistung wird dokumentiert, und die Dokumentation wird fünf Jahre lang verfügbar gehalten und vertraulich behandelt (§ 24 Abs. 6 DGUV Vorschrift 1). Halte fest, wann, wo und wie
    es passiert ist, die Art der Verletzung, die Erste-Hilfe-Maßnahme sowie die Namen der verletzten und der helfenden Person. Der Eintrag ist wichtig, wenn sich später Folgen zeigen: Er belegt den Arbeitsunfall
    gegenüber der BG. Eine feste Frist nennt die Vorschrift nicht – Amtlos erinnert am Tag des gemeldeten Unfalls. Ob der Unfall zusätzlich der BG anzuzeigen ist, steht in der Pflicht zur Unfallanzeige.'
  en: 'All first aid given is documented, and the documentation is kept available for five years and treated confidentially (§ 24(6) DGUV Regulation 1). Record when, where and how it happened, the type
    of injury, the first-aid measure and the names of the injured person and the helper. The entry matters if consequences appear later: it proves the accident at work to the BG. The rule sets no fixed
    deadline – Amtlos reminds you on the day of the reported accident. Whether the accident must also be reported to the BG is covered by the obligation on accident reporting.'
- de: Jede neue Person unterweist du vor Aufnahme der Tätigkeit zu den Gefahren und Schutzmaßnahmen – spätestens am ersten Arbeitstag vor Arbeitsbeginn.
