  en: Removal of the threshold under § 38 BDSG (planned)
- de: Weiterbildungspflicht (Immobilien und Finanzen)
  en: Continuing education obligation (real estate and finance)
- de: Welche Erlaubnis nötig ist, hängt vom Beruf ab (z. B. Heilpraktiker, Pflege, Physiotherapie). Ohne sie darfst du die Tätigkeit nicht ausüben.
  en: Which permit you need depends on the profession (e.g. alternative practitioner (Heilpraktiker), nursing, physiotherapy). Without it, you may not carry out the activity.
- de: Welche Angaben eine Rechnung braucht, regelt § 14 UStG. Für Kleinbetragsrechnungen gelten Erleichterungen. Kleinunternehmer weisen auf die Steuerbefreiung nach § 19 UStG hin.
  en: § 14 UStG sets out which details an invoice needs. Simplified rules apply to small-amount invoices. Small businesses under the small business scheme refer to the tax exemption under § 19 UStG.
- de: Welche Gesetze du aushängst, auslegst oder elektronisch zugänglich machst, hängt von der Belegschaft ab. Ab der ersten beschäftigten Person – das Arbeitszeitgesetz mit den geltenden Rechtsverordnungen,
    Tarifverträgen und Betriebsvereinbarungen (§ 16 Abs. 1 ArbZG) und das AGG mit § 61b ArbGG und der Angabe, wo die Beschwerdestelle ist (§ 12 Abs. 5 AGG). Bei regelmäßig mehr als drei beschäftigten Frauen
    das Mutterschutzgesetz (§ 26 MuSchG). Ab einer beschäftigten jugendlichen Person das Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde (§ 47 JArbSchG), ab drei Jugendlichen zusätzlich
    Beginn und Ende der Arbeitszeit und der Pausen (§ 48 JArbSchG). Dazu machst du die Unfallverhütungsvorschriften deiner BG zugänglich (§ 12 DGUV Vorschrift 1) und hängst die Hinweise zur Ersten Hilfe
    mit Notruf und Ersthelfern aus (§ 24 Abs. 5 DGUV Vorschrift 1).
  en: Which laws you post, display or make available electronically depends on your workforce. From the first employee – the Working Hours Act with the applicable ordinances, collective agreements and works
    agreements (§ 16(1) ArbZG) and the AGG with § 61b ArbGG and information on where the complaints office is (§ 12(5) AGG). With a regular more than three women employed, the Maternity Protection Act (§
    26 MuSchG). From one young employee, the Youth Employment Protection Act with the address of the supervisory authority (§ 47 JArbSchG), from three young people additionally the start and end of working
    hours and breaks (§ 48 JArbSchG). You also make your BG's accident prevention regulations accessible (§ 12 DGUV Regulation 1) and post the first-aid information with emergency number and first aiders
    (§ 24(5) DGUV Regulation 1).
- de: Wenn ausländische Investoren in ein Unternehmen in einem sensiblen Sektor einsteigen, kann eine Investitionsprüfung nötig sein.
  en: If foreign investors invest in a company in a sensitive sector, an investment screening may be required.
- de: Wenn das Finanzamt Vorauszahlungen festgesetzt hat, zahlst du sie am 10. März, 10. Juni, 10. September und 10. Dezember.
  en: If the tax office (Finanzamt) has set prepayments, you pay them on 10 March, 10 June, 10 September and 10 December.
- de: Wenn die Gemeinde Gewerbesteuer-Vorauszahlungen festgesetzt hat, zahlst du sie am 15. Februar, 15. Mai, 15. August und 15. November.
  en: If the municipality has set trade tax prepayments, you pay them on 15 February, 15 May, 15 August and 15 November.
- de: Wenn du Arbeitslosengeld I bekommst, kannst du einen Gründungszuschuss beantragen – vor dem Start.
  en: If you receive unemployment benefit I (Arbeitslosengeld I), you can apply for a start-up grant (Gründungszuschuss), before you start.
- de: Wenn du Daten erhebst, informierst du die Menschen darüber – etwa in einer Datenschutzerklärung oder einem Informationsblatt.
  en: When you collect data, you inform the people concerned – for example in a privacy policy or an information sheet.
- de: Wenn du Mitarbeitende am Unternehmen beteiligen willst, gibt es dafür besondere Regeln und Modelle wie VSOP.
  en: If you want to give employees a stake in the company, there are special rules and models such as VSOP.
- de: Wenn du Videoüberwachung einsetzt, machst du sie erkennbar und dokumentierst den Zweck.
  en: If you use video surveillance, you make it recognisable and document the purpose.
- de: Wenn du die Voranmeldung monatlich abgibst und eine Dauerfristverlängerung hast, zahlst du einmal im Jahr eine Sondervorauszahlung von einem Elftel.
  en: If you file the advance return monthly and have a permanent deadline extension (Dauerfristverlängerung), you make a special advance payment (Sondervorauszahlung) of one eleventh once a year.
- de: Wenn du eine elektronische Kasse nicht mehr nutzt, meldest du das innerhalb eines Monats über ELSTER.
  en: If you stop using an electronic cash register, you report this via ELSTER within one month.
- de: Wenn du nur einen Auftraggeber hast, kannst du bei der Clearingstelle der Rentenversicherung klären lassen, ob du wirklich selbstständig bist.
  en: If you only have one client, you can ask the clearing office of the pension insurance (Clearingstelle) to determine whether you are really self-employed.
- de: Wenn ihr mit Gefahrstoffen arbeitet, führst du ein Verzeichnis, schreibst Betriebsanweisungen und unterweist jährlich mündlich mit Unterschrift.
  en: If you work with hazardous substances, you keep a register, write operating instructions and instruct orally every year with signature.
- de: Wenn jemand formal selbstständig ist, tatsächlich aber wie ein Angestellter arbeitet.
  en: When someone is formally self-employed but actually works like an employee.
- de: Wenn sich im Gesellschafterkreis etwas ändert, muss unverzüglich eine neue Gesellschafterliste zum Handelsregister – über den Notar, wenn er an der Änderung mitgewirkt hat, sonst durch die Geschäftsführung.
  en: If anything changes among the shareholders, a new list of shareholders (Gesellschafterliste) must be submitted to the commercial register (Handelsregister) without delay – via the notary if they were
    involved in the change, otherwise by the managing directors.
- de: Wer Jugendliche beschäftigt, braucht vorab eine ärztliche Erstuntersuchung (§ 32 JArbSchG), muss besondere Arbeitszeitgrenzen einhalten und das Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde
    aushängen oder auslegen (§ 47 JArbSchG); ab drei Jugendlichen hängst du außerdem Beginn und Ende ihrer Arbeitszeit und Pausen aus (§ 48 JArbSchG). Jugendliche arbeiten nur zwischen 6 und 20 Uhr (§ 14
    Abs. 1 JArbSchG); in Bäckereien und Konditoreien dürfen Jugendliche über 16 Jahre ab 5 Uhr arbeiten, Jugendliche über 17 Jahre in Bäckereien ab 4 Uhr (§ 14 Abs. 2 Nr. 4, Abs. 3 JArbSchG). Gefährliche
    Arbeiten – etwa an Maschinen mit erhöhter Unfallgefahr oder mit Gefahrstoffen – sind nur eingeschränkt erlaubt (§ 22 JArbSchG); die Gefährdungsbeurteilung berücksichtigt Jugendliche eigens (§ 28a JArbSchG).
    Halbjährliche Unterweisung und Nachuntersuchung nach einem Jahr sind eigene Pflichten.
  en: Anyone employing young people needs an initial medical examination beforehand (§ 32 JArbSchG), must observe special working time limits and post or display the Youth Employment Protection Act with
    the address of the supervisory authority (§ 47 JArbSchG); from three young people you also post the start and end of their working hours and breaks (§ 48 JArbSchG). Young people only work between 6
    and 20 o'clock (§ 14(1) JArbSchG); in bakeries and confectioneries young people over 16 may work from 5 o'clock, young people over 17 in bakeries from 4 o'clock (§ 14(2) no. 4, (3) JArbSchG). Dangerous
    work – for example on machines with an increased risk of accidents or with hazardous substances – is only permitted to a limited extent (§ 22 JArbSchG); the risk assessment takes young people into account
    specifically (§ 28a JArbSchG). Six-monthly instruction and the follow-up examination after one year are separate obligations.
- de: 'Wer als Geschäftsführung ihre Pflichten verletzt, haftet der Gesellschaft für den Schaden (§ 43 Abs. 2 GmbHG) und für Steuern, die deshalb nicht oder nicht rechtzeitig festgesetzt oder gezahlt werden (§ 69 AO). Zahlungen nach Eintritt der Insolvenzreife muss sie der Gesellschaft erstatten (§ 15b Abs. 1, 4 InsO). Wer Sozialversicherungsbeiträge nicht abführt, macht sich strafbar: Freiheitsstrafe bis zu fünf Jahren oder Geldstrafe (§ 266a Abs. 1 StGB). Wer den Verlust der Hälfte des Stammkapitals nicht anzeigt, wird mit Freiheitsstrafe bis zu drei Jahren oder Geldstrafe bestraft, bei Fahrlässigkeit bis zu einem Jahr (§ 84 GmbHG). Für eine nicht eingereichte Gesellschafterliste haftet die Geschäftsführung den Betroffenen und den Gläubigern (§ 40 Abs. 3 GmbHG).'
  en: 'Managing directors who breach their duties are liable to the company for the damage (§ 43(2) GmbHG) and for taxes that are therefore not assessed or paid, or not on time (§ 69 AO). Payments made after insolvency has occurred must be reimbursed to the company (§ 15b(1), (4) InsO). Anyone who does not pay over social security contributions commits a criminal offence: imprisonment of up to five years or a fine (§ 266a(1) StGB). Anyone who does not report the loss of half the share capital faces imprisonment of up to three years or a fine, in case of negligence up to one year (§ 84 GmbHG). Management is liable to those affected and to creditors for a shareholder list that was not filed (§ 40(3) GmbHG).'
- de: Wer bei dir als Nachtarbeitnehmer arbeitet, kann sich vor Beginn und danach alle drei Jahre, ab 50 Jahren jährlich, auf deine Kosten arbeitsmedizinisch untersuchen lassen und bekommt einen Ausgleich
    durch freie Tage oder Zuschlag.
  en: Anyone working for you as a night worker can have an occupational medical examination at your expense before starting and then every three years, from age 50 every year, and receives compensation
    through days off or a bonus.
- de: Wer ein erlaubnispflichtiges Gewerbe ohne Erlaubnis betreibt, riskiert ein Bußgeld bis 5.000 €, bei Finanzanlagenvermittlung und Honorar-Finanzanlagenberatung bis 50.000 € (§ 144 Abs. 1 Nr. 1, Abs.
    4 GewO). Eine Gaststätte ohne die nach § 2 Abs. 1 GastG erforderliche Erlaubnis kostet bis 5.000 € (§ 28 Abs. 1 Nr. 1, Abs. 3 GastG) – soweit in deinem Land das Gaststättengesetz des Bundes gilt. In
    Ländern mit Anzeigepflicht gelten die Bußgelder des Landesgesetzes.
  en: Anyone who operates a trade requiring a licence without one risks a fine of up to €5,000, for financial investment brokerage and fee-based financial investment advice up to €50,000 (§ 144(1) no. 1,
    (4) GewO). A restaurant or bar without the licence required under § 2(1) GastG costs up to €5,000 (§ 28(1) no. 1, (3) GastG) – where the federal Restaurant Act (Gaststättengesetz) applies in your state.
    In states with a notification requirement, the fines of the state law apply.
- de: Wer eine Erlaubnis nach § 34d, § 34f, § 34h oder § 34i GewO hat – als Versicherungsberater auch nach § 34e GewO (§ 34e Abs. 2 GewO) –, lässt sich unverzüglich nach Aufnahme der Tätigkeit in das Vermittlerregister
    eintragen, das die IHK führt (§ 11a GewO). Änderungen meldest du ebenfalls. Versicherungsvermittler bilden sich außerdem jedes Jahr weiter – das steht bei der Weiterbildungspflicht.
  en: Anyone with a permit under § 34d, § 34f, § 34h or § 34i GewO – as an insurance adviser also under § 34e GewO (§ 34e(2) GewO) – registers in the intermediary register kept by the IHK without delay
    after starting the activity (§ 11a GewO). You also report changes. Insurance intermediaries also complete further training every year – see the further training obligation.
- de: Wer einen anderen Unternehmer mit Werk- oder Dienstleistungen beauftragt, haftet wie ein Bürge dafür, dass dieser und alle weiteren Nachunternehmer ihren Beschäftigten den Mindestlohn zahlen (§ 13
    MiLoG i. V. m. § 14 AEntG). Im Baugewerbe haftest du außerdem für die Sozialversicherungsbeiträge der Nachunternehmer, wenn der Gesamtwert der Bauleistungen 275.000 € erreicht (§ 28e Abs. 3a SGB IV),
    bei Paketdiensten für die Zustellung von Paketen bis 32 kg (§ 28e Abs. 3f, 3g SGB IV); Botenfahrten etwa einer Apotheke sind keine Paketzustellung in diesem Sinn. In der Bau-, Fleisch- und Paketbranche
    haftest du auch für die Beiträge zur Unfallversicherung (§ 150 Abs. 3 SGB VII). Ist der Nachunternehmer präqualifiziert, entlastet dich das (§ 28e Abs. 3b SGB IV). Lass dir deshalb vor und während der
    Zusammenarbeit Nachweise geben, etwa Unbedenklichkeitsbescheinigungen der Krankenkasse und der Berufsgenossenschaft, eine Erklärung zum Mindestlohn und die Gewerbeanmeldung, und vereinbare Kontrollrechte
    im Vertrag.
  en: Anyone who commissions another business to carry out work or services is liable like a guarantor for that business and all further subcontractors paying their staff the minimum wage (§ 13 MiLoG in
    conjunction with § 14 AEntG). In construction you are also liable for the subcontractors' social security contributions if the total value of the construction work reaches €275,000 (§ 28e(3a) SGB IV),
    and in parcel services for delivering parcels up to 32 kg (§ 28e(3f), (3g) SGB IV); courier runs, for example for a pharmacy, are not parcel delivery in this sense. In construction, the meat industry
    and parcel services you are also liable for accident insurance contributions (§ 150(3) SGB VII). If the subcontractor is prequalified, this relieves you (§ 28e(3b) SGB IV). So ask for evidence before
    and during the cooperation, such as clearance certificates from the health insurer and the employers' liability insurance association, a minimum wage declaration and the trade registration, and agree
    inspection rights in the contract.
- de: Wer jemanden ohne die erforderliche Erlaubnis beschäftigt, riskiert ein Bußgeld bis 500.000 € (§ 404 Abs. 2 Nr. 3, Abs. 3 SGB III). Endet die Beschäftigung vorzeitig und teilst du das der Ausländerbehörde
    nicht binnen vier Wochen mit, riskierst du bis 30.000 € (§ 98 Abs. 2a Nr. 2, Abs. 5 AufenthG); für eine fehlende Kopie sieht § 98 AufenthG kein eigenes Bußgeld vor.
  en: Anyone who employs someone without the required permit risks a fine of up to €500,000 (§ 404(2) no. 3, (3) SGB III). If the employment ends early and you do not notify the immigration authority within
    four weeks, you risk up to €30,000 (§ 98(2a) no. 2, (5) AufenthG); § 98 AufenthG provides no separate fine for a missing copy.
- de: Wer nicht die Staatsangehörigkeit eines EU- oder EWR-Staats oder der Schweiz hat, darf nur arbeiten, wenn der Aufenthaltstitel das erlaubt. Als Arbeitgeber prüfst du vor Beginn, ob ein solcher Titel
    oder eine Erlaubnis zur Beschäftigung vorliegt, und bewahrst für die Dauer der Beschäftigung eine Kopie auf, auf Papier oder elektronisch (§ 4a Abs. 5 AufenthG). Achte auf das Ablaufdatum des Titels.
    Endet die Beschäftigung vorzeitig, teilst du das der Ausländerbehörde binnen vier Wochen mit (§ 4a Abs. 5 S. 3 Nr. 3 AufenthG).
  en: Anyone who is not a national of an EU or EEA state or Switzerland may only work if their residence permit allows it. As employer you check before they start whether such a permit or a permission to
    work exists and keep a copy for the duration of employment, on paper or electronically (§ 4a(5) AufenthG). Watch the expiry date of the permit. If the employment ends early, you notify the immigration
    authority within four weeks (§ 4a(5) sentence 3 no. 3 AufenthG).
- de: Wer wenig Umsatz macht, kann ohne Umsatzsteuer abrechnen.
  en: If you have low revenue, you can invoice without VAT.
- de: 'Wer öffentliche Straßen, Wege und Plätze über den Gemeingebrauch hinaus nutzt – etwa mit einem Foodtruck oder Verkaufsstand –, braucht eine Sondernutzungserlaubnis nach dem Straßenrecht des Landes;
    zuständig ist meist die Gemeinde als Straßenbaubehörde. Auf privaten Flächen brauchst du die Zustimmung der Eigentümer. Auf Wochenmärkten, Volksfesten und anderen von der Gemeinde festgesetzten Veranstaltungen
    vergibt der Veranstalter die Standplätze (§§ 64 ff., § 70 GewO). Für die Preise gilt die Preisangabenverordnung: Du gibst den Gesamtpreis an (§ 3 PAngV), bei Waren nach Gewicht oder Volumen auch den
    Grundpreis (§ 4 PAngV). Die Regeln für Gaststätten (§ 13 PAngV) gelten nur für Gaststätten mit Sitzplätzen bzw. Bewirtung.'
  en: 'Anyone who uses public roads, paths and squares beyond common use – for example with a food truck or sales stand – needs a special use permit under the state''s road law; usually the municipality
    is responsible as the road authority. On private land you need the owner''s consent. At weekly markets, festivals and other events set by the municipality, the organiser allocates the pitches (§§ 64
    et seq., § 70 GewO). Prices are governed by the Price Indication Ordinance (PAngV): you state the total price (§ 3 PAngV) and, for goods sold by weight or volume, also the unit price (§ 4 PAngV). The
    rules for restaurants (§ 13 PAngV) only apply to restaurants with seating or table service.'
- de: Widerrufsbutton für Online-Verträge
  en: Withdrawal button for online contracts
- de: Wird ein Geschäftsführer zu Unrecht nicht als Beschäftigter geführt, sind Beiträge bis zu vier Jahre nachzuzahlen (§ 25 Abs. 1 SGB IV), bei Vorsatz strafbar (§ 266a StGB).
  en: If a managing director is wrongly not treated as an employee, contributions must be paid retrospectively for up to four years (§ 25(1) SGB IV); if intentional, it is a criminal offence (§ 266a StGB).
- de: Wird eine Grenze überschritten, fällt ab diesem Umsatz Umsatzsteuer an.
  en: If a limit is exceeded, VAT is due from that sale onwards.
- de: Wirtschaftlich Berechtigte
  en: Beneficial owners
- de: Wirtschaftlich Berechtigte ans Transparenzregister melden
  en: Report beneficial owners to the transparency register
- de: Wissen und Fähigkeiten, um KI-Systeme sachkundig einzusetzen und ihre Chancen und Risiken zu kennen.
  en: Knowledge and skills to use AI systems competently and to understand their opportunities and risks.
- de: Zahl das Stammkapital auf das Geschäftskonto ein, bevor die Gesellschaft zum Handelsregister angemeldet wird.
  en: Pay the share capital into the business account before the company is registered with the commercial register (Handelsregister).
- de: 'Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben (§ 240 Abs. 1, 3 AO). Hast du sie nicht oder nicht richtig berechnet, kann das Finanzamt sie festsetzen (§ 48 Abs. 3 UStDV).'
  en: 'If you pay late, a late-payment surcharge (Säumniszuschlag) of 1 % of the overdue amount, rounded down to the nearest €50, accrues for each month or part of a month; for a delay of up to three days it is not charged (§ 240(1), (3) AO). If you did not calculate it or calculated it incorrectly, the tax office can assess it (§ 48(3) UStDV).'
- de: 'Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben (§ 240 Abs. 1, 3 AO). Wer die Vorauszahlung nicht, nicht vollständig oder nicht rechtzeitig zahlt, riskiert außerdem ein Bußgeld bis 30.000 € (§ 26a Abs. 1, 3 UStG in Verbindung mit § 18 Abs. 1 Satz 4 UStG). Für eine verspätete Voranmeldung kann das Finanzamt einen Verspätungszuschlag festsetzen (§ 152 Abs. 1 AO).'
  en: 'If you pay late, a late-payment surcharge (Säumniszuschlag) of 1 % of the overdue amount, rounded down to the nearest €50, accrues for each month or part of a month; for a delay of up to three days it is not charged (§ 240(1), (3) AO). Anyone who does not pay the advance payment, or not in full or on time, also risks a fine of up to €30,000 (§ 26a(1), (3) UStG in conjunction with § 18(1) sentence 4 UStG). For a late advance return the tax office can impose a late-filing surcharge (§ 152(1) AO).'
- de: 'Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben (§ 240 Abs. 1, 3 AO, für die Gewerbesteuer über § 1 Abs. 2 Nr. 5 AO).'
  en: 'If you pay late, a late-payment surcharge (Säumniszuschlag) of 1 % of the overdue amount, rounded down to the nearest €50, accrues for each month or part of a month; for a delay of up to three days it is not charged (§ 240(1), (3) AO, for trade tax via § 1(2) no. 5 AO).'
- de: Zahlungen über 50.000 €, die du von Gebietsfremden erhältst oder an Gebietsfremde leistest – zum Beispiel Investorengeld aus dem Ausland –, meldest du der Bundesbank.
  en: You report payments of more than €50,000 that you receive from or make to non-residents – for example investor money from abroad – to the Bundesbank.
- de: Zentrale Stelle Verpackungsregister (LUCID)
  en: Central Agency Packaging Register (Zentrale Stelle Verpackungsregister, LUCID)
- de: Zusammenfassende Meldung abgeben
  en: Submit the EC sales list
- de: Zuständige Berufsgenossenschaft (nach Branche)
  en: Responsible employers' liability insurance association (by industry)
- de: Zuständige Erlaubnisbehörde (je nach Gewerbe und Land)
  en: Responsible permit authority (depends on trade and federal state)
- de: Zuständige Verkehrsbehörde
  en: Competent transport authority
- de: Zwei Arbeitstage vor Fälligkeit der Beiträge übermittelst du den Beitragsnachweis an die Krankenkassen.
  en: Two working days before the contributions are due, you submit the contribution statement (Beitragsnachweis) to the health insurance funds.
- de: eAU
  en: eAU
- de: stiftung elektro-altgeräte register (ear)
  en: stiftung elektro-altgeräte register (ear)
- de: '§ 12 ArbSchG ist nicht unmittelbar bußgeldbewehrt: Die Aufsicht kann die Unterweisung anordnen, ein Verstoß gegen die Anordnung kostet bis 30.000 € (§ 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG). Bei Gefahrstoffen, Biostoffen und Arbeitsmitteln ist die fehlende Unterweisung direkt bußgeldbewehrt: bei Gefahrstoffen bis 50.000 € (§ 22 Abs. 1 Nr. 25 GefStoffV in Verbindung mit § 26 Abs. 1 Nr. 8 Buchst. b, Abs. 3 ChemG), bei Biostoffen und Arbeitsmitteln bis 5.000 € (§ 20 Abs. 1 Nr. 23 BioStoffV, § 22 Abs. 1 Nr. 26 BetrSichV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG).'
  en: '§ 12 ArbSchG is not directly subject to fines: the authority can order the instruction, and a breach of the order costs up to €30,000 (§ 25(1) no. 2 letter a, (2) ArbSchG). For hazardous substances, biological agents and work equipment, missing instruction is directly subject to fines: for hazardous substances up to €50,000 (§ 22(1) no. 25 GefStoffV in conjunction with § 26(1) no. 8 letter b, (3) ChemG), for biological agents and work equipment up to €5,000 (§ 20(1) no. 23 BioStoffV, § 22(1) no. 26 BetrSichV in conjunction with § 25(1) no. 1, (2) ArbSchG).'
- de: § 146 GewO sieht dafür kein eigenes Bußgeld vor. Die Behörde fordert die Unterlagen an; ergibt die Prüfung Unzuverlässigkeit, kann sie das Gewerbe untersagen (§ 35 GewO).
  en: § 146 GewO provides no separate fine for this. The authority requests the documents; if the check shows you are unreliable, it can prohibit the trade (§ 35 GewO).
- de: '§ 26a UStG nennt kein eigenes Bußgeld dafür, E-Rechnungen nicht empfangen zu können.'
  en: '§ 26a UStG provides no separate fine for not being able to receive e-invoices.'
- de: '§ 26a UStG nennt kein eigenes Bußgeld für fehlende Pflichtangaben; wer eine Rechnung nicht oder nicht rechtzeitig ausstellt, riskiert bis 5.000 € (§ 26a Abs. 2 Nr. 1, Abs. 3 UStG). Weist du mehr Umsatzsteuer aus, als du schuldest, oder Steuer, obwohl du dazu nicht berechtigt bist, schuldest du den ausgewiesenen Betrag (§ 14c Abs. 1, 2 UStG). Dein Kunde braucht eine Rechnung nach § 14 UStG für den Vorsteuerabzug (§ 15 Abs. 1 Satz 1 Nr. 1 Satz 2 UStG).'
  en: '§ 26a UStG provides no separate fine for missing mandatory details; anyone who does not issue an invoice or does not issue it on time risks up to €5,000 (§ 26a(2) no. 1, (3) UStG). If you show more VAT than you owe, or show tax although you are not entitled to, you owe the amount shown (§ 14c(1), (2) UStG). Your customer needs an invoice under § 14 UStG for input tax deduction (§ 15(1) sentence 1 no. 1 sentence 2 UStG).'
- de: '§ 379 AO nennt die Mitteilung nach § 146a Abs. 4 AO nicht – ein eigenes Bußgeld ist dafür nicht vorgesehen. Das Finanzamt kann die Mitteilung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: '§ 379 AO does not cover the notification under § 146a(4) AO – no separate fine is provided for it. The tax office can enforce the notification with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: '§ 379 Abs. 2 Nr. 1 AO erfasst nur Mitteilungen nach § 138 Abs. 2 AO – für die Angaben zur steuerlichen Erfassung ist kein eigenes Bußgeld vorgesehen. Das Finanzamt kann sie mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: '§ 379(2) no. 1 AO only covers notifications under § 138(2) AO – no separate fine is provided for the information for tax registration. The tax office can enforce it with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: '§§ 5, 6 ArbSchG sind nicht unmittelbar bußgeldbewehrt: Die Aufsicht kann die nötigen Maßnahmen anordnen, ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG). Für die Dokumentation gelten außerdem die Bußgelder bei „Gefährdungsbeurteilung erstellen“.'
  en: '§§ 5, 6 ArbSchG are not directly subject to fines: the authority can order the necessary measures, and a breach of the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG). For the documentation, the fines listed under “Create a risk assessment” also apply.'
- de: Ärztliche Erstuntersuchung Jugendlicher vor Beginn
  en: Initial medical examination of young people before they start
- de: Über ELSTER übermittelst du Steuererklärungen und Anmeldungen ans Finanzamt, als Erstes den Fragebogen zur steuerlichen Erfassung, den du elektronisch abgibst (§ 138 Abs. 1b AO). Weil die Aktivierungsdaten
    per Post kommen, solltest du das Konto früh beantragen. Übernimmt eine Steuerberatung die Übermittlung, gibt sie den Fragebogen für dich ab.
  en: You use ELSTER to submit tax returns and filings to the tax office (Finanzamt), starting with the tax registration questionnaire (Fragebogen zur steuerlichen Erfassung), which you submit electronically
    (§ 138(1b) AO). Because the activation data comes by post, you should apply for the account early. If a tax adviser handles the submission, they submit the questionnaire for you.
- de: Über das Widerrufsrecht belehren
  en: Inform customers about the right of withdrawal
- de: Über die Datenverarbeitung informieren
  en: Inform people about data processing
- de: Überwachungsbedürftig sind unter anderem der Handel mit hochwertigen Gebrauchtwaren, Fahrzeugen, Edelmetallen, Schmuck und Altmetall, Auskunfteien und Detekteien, die Vermittlung von Ehen, Partnerschaften,
    Reisen und Unterkünften sowie Schlüsseldienste und der Einbau von Sicherungseinrichtungen (§ 38 Abs. 1 GewO). Beim Handel mit Gebrauchtwaren erfasst das Gesetz den An- und Verkauf hochwertiger Konsumgüter
    (§ 38 Abs. 1 Nr. 1 GewO) – Second-Hand-Kleidung oder gebrauchte Bücher regelmäßig nicht. Nach der Gewerbeanzeige prüft die Behörde deine Zuverlässigkeit. Dafür beantragst du unverzüglich ein Führungszeugnis
    und eine Auskunft aus dem Gewerbezentralregister zur Vorlage bei der Behörde; tust du es nicht, holt die Behörde sie selbst ein.
  en: Trades requiring supervision include dealing in high-value second-hand goods, vehicles, precious metals, jewellery and scrap metal, credit agencies and detective agencies, brokering marriages, partnerships,
    travel and accommodation, as well as locksmith services and installing security devices (§ 38(1) GewO). For second-hand trading the law covers the buying and selling of high-value consumer goods (§
    38(1) no. 1 GewO) – second-hand clothing or used books generally not. After the trade registration the authority checks your reliability. For this you apply without delay for a certificate of good conduct
    and an extract from the central trade register to submit to the authority; if you don't, the authority obtains them itself.
- de: –
  en: –
- de: Elektrische Betriebsmittel müssen in bestimmten Abständen geprüft werden. Ein Prüfprotokoll gilt bis zur nächsten Prüfung, die darin steht (sonst bis zum Richtwert für die gewählten Einsatzbedingungen) – dann erinnert Amtlos wieder.
  en: Electrical equipment must be inspected at certain intervals. An inspection record is valid until the next inspection stated in it (otherwise until the guideline interval for the selected operating conditions) – then Amtlos reminds you again.
- de: Ein Prüfprotokoll erledigt die Pflicht bis zur nächsten Prüfung, die im Protokoll steht – danach ist sie wieder offen.
  en: An inspection record fulfils the obligation until the next inspection stated in the record – after that it is open again.
- de: Du stellst eigene Produkte her, verkaufst sie unter deinem Namen oder importierst sie von außerhalb der EU.
  en: You make your own products, sell them under your own name or import them from outside the EU.
- de: Gilt erst, wenn du eigene Kosmetik herstellst, unter deinem Namen verkaufst oder von außerhalb der EU importierst – nicht beim Weiterverkauf fremder Markenware.
  en: Applies only if you make your own cosmetics, sell them under your own name or import them from outside the EU – not when you resell other brands' goods.
- de: 'Lebensmittelunternehmen müssen ein ständiges Verfahren nach den sieben HACCP-Grundsätzen einrichten (Art. 5 Abs. 2 VO (EG) Nr. 852/2004): Gefahren ermitteln, kritische Kontrollpunkte bestimmen, Grenzwerte festlegen, die Kontrollpunkte überwachen, Korrekturmaßnahmen festlegen, regelmäßig verifizieren und alles dokumentieren. Kleine Betriebe dürfen das einfach halten – Dokumente und Aufzeichnungen müssen der Art und Größe des Betriebs angemessen sein; wo die Gefahrenanalyse keinen kritischen Kontrollpunkt ergibt, genügt die gute Hygienepraxis. Das ist eine laufende Aufgabe, keine einmalige. Amtlos bietet eine Vorlage mit Gefahrenanalyse je Arbeitsschritt, kritischen Kontrollpunkten, Kontrolllisten mit Grenzwerten, die du festlegst, und Messprotokoll – ein Protokoll gilt für seinen Monat. Hilfe für deine Branche geben die nationalen Leitlinien für eine gute Hygienepraxis: für Café, Restaurant und Imbiss die DEHOGA-„Leitlinie für eine Gute Hygienepraxis in der Gastronomie“ (3. Auflage 2022, Bezug über den DEHOGA-Shop), für Bäckerei und Konditorei die „Leitlinie für eine Gute Lebensmittelhygiene-Praxis im Bäcker- und Konditorenhandwerk“ des Zentralverbands des Deutschen Bäckerhandwerks (2012) und für Foodtruck und Marktstand die BGN-„Leitlinie für eine gute Lebensmittelhygienepraxis in ortsveränderlichen Betriebsstätten“ (2018). Bei einer Kontrolle fragt die Lebensmittelüberwachung oft auch nach der Wartung des Fettabscheiders (Gastronomie mit Fritteuse, nach der Abwassersatzung deiner Gemeinde), nach der Wartung der Kühlgeräte und nach der Eichung deiner Waagen – leg diese Nachweise zu deinen Eigenkontrollen.'
  en: 'Food businesses must set up a permanent procedure based on the seven HACCP principles (Art. 5(2) Regulation (EC) No 852/2004): identify hazards, determine critical control points, set critical limits, monitor the control points, define corrective actions, verify regularly and document everything. Small businesses may keep this simple – documents and records must be appropriate to the nature and size of the business; where the hazard analysis shows no critical control point, good hygiene practice is enough. This is an ongoing task, not a one-off. Amtlos offers a template with hazard analysis per work step, critical control points, checklists with limits you set yourself, and a measurement log – one log covers its month. The national guides to good hygiene practice help for your sector: for cafés, restaurants and snack bars the DEHOGA “Leitlinie für eine Gute Hygienepraxis in der Gastronomie” (3rd edition 2022, available from the DEHOGA shop), for bakeries and patisseries the “Leitlinie für eine Gute Lebensmittelhygiene-Praxis im Bäcker- und Konditorenhandwerk” of the German Bakers'' Confederation (Zentralverband des Deutschen Bäckerhandwerks, 2012), and for food trucks and market stalls the BGN “Leitlinie für eine gute Lebensmittelhygienepraxis in ortsveränderlichen Betriebsstätten” (2018). During an inspection, food control often also asks about maintenance of the grease separator (catering with a deep fryer, under your municipality''s wastewater bylaw), maintenance of refrigeration equipment and calibration (Eichung) of your scales – keep these records with your own checks.'
- de: Belehrung nach § 43 IfSG durch den Arbeitgeber
  en: Briefing under § 43 IfSG by the employer
- de: Wer neu bei dir mit Lebensmitteln arbeitet, belehrst du nach Aufnahme der Tätigkeit selbst und dokumentierst das.
  en: Anyone who newly works with food in your business is briefed by you after starting work, and you document it.
- de: Neben der Bescheinigung des Gesundheitsamts vor dem ersten Arbeitstag belehrst du als Arbeitgeber neue Beschäftigte nach Aufnahme der Tätigkeit über die Tätigkeitsverbote und Verpflichtungen nach §§ 42 und 43 IfSG und dokumentierst die Belehrung. Danach wiederholst du sie alle zwei Jahre – siehe „Belehrung nach § 43 IfSG alle zwei Jahre wiederholen“.
  en: In addition to the health office certificate before the first working day, as employer you brief new staff after they start work on the activity bans and obligations under §§ 42 and 43 IfSG and document the briefing. After that you repeat it every two years – see “Repeat the briefing under § 43 IfSG every two years”.
- de: Aufgeteilt in die Bescheinigung des Gesundheitsamts vor dem ersten Arbeitstag, deine Belehrung nach Aufnahme der Tätigkeit und die Wiederholung alle zwei Jahre mit Erinnerung.
  en: Split into the health office certificate before the first working day, your briefing after starting work and the repetition every two years with a reminder.
- de: Bescheinigung des Gesundheitsamts vor dem ersten Arbeitstag (§ 43 IfSG)
  en: Health office certificate before the first working day (§ 43 IfSG)
- de: Gesundheitsamt bzw. beauftragter Arzt
  en: Health office or commissioned doctor
- de: Belehrung nach § 43 IfSG alle zwei Jahre wiederholen
  en: Repeat the briefing under § 43 IfSG every two years
- de: Die Belehrung nach § 43 IfSG wiederholst du für alle, die bei dir mit Lebensmitteln arbeiten, alle zwei Jahre.
  en: You repeat the briefing under § 43 IfSG every two years for everyone who works with food in your business.
- de: Nach der ersten Belehrung belehrst du deine Beschäftigten im Weiteren alle zwei Jahre über die Tätigkeitsverbote und Verpflichtungen nach §§ 42 und 43 IfSG und dokumentierst das. Zwei Jahre nach jeder Belehrung, die du in Amtlos erfasst, erinnert Amtlos an die nächste. Hast du deine letzte Belehrung noch nicht in Amtlos erfasst, erfasse sie – dann kennt Amtlos den Termin.
  en: After the first briefing you brief your staff every two years on the activity bans and obligations under §§ 42 and 43 IfSG and document it. Two years after each briefing you record in Amtlos, Amtlos reminds you of the next one. If you have not yet recorded your last briefing in Amtlos, record it – then Amtlos knows the date.
- de: 'Rechtsgrundlage umgestellt: Art. 6 Abs. 1 lit. b und c DSGVO statt § 26 BDSG (EuGH, Urteil vom 30.03.2023, C-34/21).'
  en: 'Legal basis changed: Art. 6(1)(b) and (c) GDPR instead of § 26 BDSG (CJEU, judgment of 30.03.2023, C-34/21).'
- de: Im Verzeichnis der Handwerkskammer eintragen (Anlage B)
  en: Register in the directory of the chamber of crafts (Annex B)
- de: Ein zulassungsfreies oder handwerksähnliches Gewerbe zeigst du bei Beginn der Handwerkskammer an.
  en: You notify the chamber of crafts of a licence-free or craft-like trade when you start.
- de: Zulassungsfreie Handwerke (Anlage B1) und handwerksähnliche Gewerbe (Anlage B2) kommen nicht in die Handwerksrolle, sondern in das Verzeichnis der Handwerkskammer. Den Beginn des Betriebs zeigst du der Handwerkskammer an, zusammen mit der Gewerbeanmeldung.
  en: Licence-free crafts (Annex B1) and craft-like trades (Annex B2) are not entered in the crafts register but in the directory of the chamber of crafts. You notify the chamber of crafts when you start the business, together with the trade registration.
- de: Verzeichnis nach § 19 HwO
  en: Directory under § 19 HwO
- de: Das Verzeichnis der Handwerkskammer für zulassungsfreie Handwerke und handwerksähnliche Gewerbe (Anlage B).
  en: The directory of the chamber of crafts for licence-free crafts and craft-like trades (Annex B).
- de: Dein Betrieb ist ein zulassungsfreies Handwerk oder handwerksähnliches Gewerbe (Anlage B der Handwerksordnung).
  en: Your business is a licence-free craft or craft-like trade (Annex B of the Crafts Code).
- de: In die Handwerksrolle eintragen (Anlage A)
  en: Register in the crafts register (Annex A)
- de: Ein zulassungspflichtiges Handwerk darfst du erst betreiben, wenn du in die Handwerksrolle eingetragen bist.
  en: You may only run a licensed craft once you are entered in the crafts register.
- de: Zulassungspflichtige Handwerke (Anlage A der Handwerksordnung) brauchen einen Meisterbrief oder eine Ausnahme. Den selbstständigen Betrieb darfst du erst nach der Eintragung in die Handwerksrolle aufnehmen – die Eintragung muss also vor dem Beginn stehen.
  en: Licensed crafts (Annex A of the Crafts Code) need a master craftsman's certificate or an exemption. You may only start the independent business after entry in the crafts register – so the entry must be in place before you start.
- de: Das Verzeichnis der Handwerkskammer für zulassungspflichtige Handwerke (Anlage A).
  en: The register of the chamber of crafts for licensed crafts (Annex A).
- de: Dein Betrieb ist ein zulassungspflichtiges Handwerk nach Anlage A der Handwerksordnung.
  en: Your business is a licensed craft under Annex A of the Crafts Code.
- de: Gilt jetzt nur für zulassungspflichtige Handwerke (Anlage A) und muss vor dem Beginn erledigt sein. Für Anlage B gibt es den eigenen Schritt „Im Verzeichnis der Handwerkskammer eintragen“.
  en: Now applies only to licensed crafts (Annex A) and must be done before you start. Annex B has its own step “Register in the directory of the chamber of crafts”.
- de: Impressum auf Website und Social-Media-Profilen
  en: Legal notice (Impressum) on your website and social media profiles
- de: Auf deiner Website und deinen geschäftlichen Profilen in sozialen Netzwerken stellst du ein Impressum mit den Pflichtangaben bereit – leicht erkennbar und immer erreichbar.
  en: On your website and your business profiles on social networks you provide a legal notice with the mandatory details – easy to find and always accessible.
- de: Du hast ein geschäftliches Profil in sozialen Netzwerken.
  en: You have a business profile on social networks.
- de: Gilt jetzt auch für geschäftliche Profile in sozialen Netzwerken.
  en: Now also applies to business profiles on social networks.
- de: Link zur OS-Plattform entfernen
  en: Remove the link to the ODR platform
- de: Die Verordnung (EU) Nr. 524/2013 über die Online-Streitbeilegung ist durch die Verordnung (EU) 2024/3228 mit Wirkung zum 20.07.2025 aufgehoben, die Plattform eingestellt. Damit ist auch die Pflicht entfallen, auf sie zu verlinken. Ein Link auf die eingestellte Plattform hilft niemandem – entferne ihn aus Impressum, Shop und AGB. Der Online-Check meldet, ob er noch auf deiner Website steht.
  en: Regulation (EU) No 524/2013 on online dispute resolution was repealed by Regulation (EU) 2024/3228 with effect from 20.07.2025, and the platform was shut down. This also ended the obligation to link to it. A link to the closed platform helps nobody – remove it from your legal notice, shop and terms. The online check reports whether it is still on your website.
- de: Die Linkpflicht ist seit 20.07.2025 entfallen (Verordnung (EU) 2024/3228). Entferne den Link.
  en: The link obligation no longer applies since 20.07.2025 (Regulation (EU) 2024/3228). Remove the link.
- de: Für Minijobber und in den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz zeichnest du laufend Beginn, Ende und Dauer der Arbeitszeit auf.
  en: For mini-jobbers and in the sectors under § 2a of the Act to Combat Undeclared Work you continuously record the start, end and duration of working hours.
- de: Dein Betrieb gehört zu einer Branche nach § 2a Schwarzarbeitsbekämpfungsgesetz.
  en: Your business belongs to a sector under § 2a of the Act to Combat Undeclared Work.
- de: Bußgeld bis 2.000 € (§ 4 NachwG).
  en: Fine of up to €2,000 (§ 4 NachwG).
- de: Über das Lohnprogramm gemeldet
  en: Reported via the payroll software
- de: Jede neue beschäftigte Person meldest du mit der ersten Lohnabrechnung bei der Krankenkasse an, spätestens sechs Wochen nach Beginn.
  en: You register each new employee with the health insurer with the first payroll, at the latest six weeks after the start.
- de: Die Anmeldung zur Sozialversicherung (DEÜV) geht an die Krankenkasse der beschäftigten Person, bei Minijobs an die Minijob-Zentrale. Sie ist mit der ersten folgenden Entgeltabrechnung fällig, spätestens sechs Wochen nach Beginn der Beschäftigung. Die Meldung läuft über ein systemgeprüftes Lohnprogramm. In Branchen mit Sofortmeldepflicht kommt am ersten Arbeitstag die Sofortmeldung dazu.
  en: The social security registration (DEÜV) goes to the employee's health insurer, for mini-jobs to the Minijob-Zentrale. It is due with the first following payroll, at the latest six weeks after the employment starts. The report is made via certified payroll software. In sectors with an immediate reporting obligation, the immediate report on the first working day comes in addition.
- de: 'Frist korrigiert: mit der ersten Lohnabrechnung, spätestens sechs Wochen nach Beginn (§ 6 DEÜV). Die Unterlage mit den Meldedaten erledigt die Meldung nicht – erledigt ist sie, wenn du die Meldung bestätigst.'
  en: 'Deadline corrected: with the first payroll, at the latest six weeks after the start (§ 6 DEÜV). The document with the reporting data does not complete the report – it is done once you confirm the report.'
- de: Bringst du Batterien oder Geräte mit Batterien selbst erstmals in Deutschland in Verkehr, registrierst du dich vorher nach dem Batteriegesetz.
  en: If you place batteries or devices with batteries on the German market for the first time yourself, you register under the Battery Act beforehand.
- de: Du bringst Elektrogeräte oder Batterien selbst erstmals in Deutschland in Verkehr (Herstellung, Eigenmarke oder Import).
  en: You place electrical devices or batteries on the German market for the first time yourself (manufacturing, own brand or import).
- de: Gilt erst, wenn du die Geräte oder Batterien selbst erstmals in Deutschland in Verkehr bringst – nicht beim Einkauf im deutschen Großhandel.
  en: Applies only if you place the devices or batteries on the German market for the first time yourself – not when you buy from German wholesalers.
- de: Bringst du Elektrogeräte selbst erstmals in Deutschland in Verkehr, registrierst du dich vorher bei der stiftung ear.
  en: If you place electrical devices on the German market for the first time yourself, you register with stiftung ear beforehand.
- de: Hersteller und Händler, die als Hersteller gelten, müssen sich nach dem ElektroG vor dem Verkauf registrieren. Als Hersteller gilt auch, wer unter eigener Marke verkauft oder Geräte nach Deutschland einführt. Wer bei einem Händler in Deutschland kauft und weiterverkauft oder einbaut, ist in der Regel nicht Hersteller.
  en: Producers and dealers who count as producers must register under the ElektroG before selling. Anyone who sells under their own brand or imports devices into Germany also counts as a producer. Anyone who buys from a dealer in Germany and resells or installs is usually not a producer.
- de: Verbraucherprodukte brauchen Herstellerangaben, Sicherheitsinformationen und eine verantwortliche Person in der EU. Verkaufst du fremde Markenware, prüfst du vor dem Verkauf, ob diese Angaben vorhanden sind.
  en: Consumer products need manufacturer details, safety information and a responsible person in the EU. If you sell other brands' goods, you check before selling that these details are present.
- de: Die Produktsicherheitsverordnung gilt seit 13.12.2024. Für die verantwortliche Person in der EU, die Herstellerangaben und die Sicherheitsinformationen sorgen Hersteller und Importeure. Als Händlerin oder Händler fremder Ware prüfst du vor dem Verkauf, ob Hersteller, gegebenenfalls Importeur und die nötigen Angaben auf dem Produkt oder der Verpackung stehen. Wer Produkte im Fernabsatz anbietet (zum Beispiel im Onlineshop oder auf einem Marktplatz), nennt diese Angaben schon beim Angebot. Lebensmittel fallen nicht unter die Verordnung.
  en: The General Product Safety Regulation has applied since 13.12.2024. Manufacturers and importers take care of the responsible person in the EU, the manufacturer details and the safety information. As a dealer of other brands' goods you check before selling whether the manufacturer, where applicable the importer, and the required details are on the product or packaging. Anyone offering products at a distance (for example in an online shop or on a marketplace) states these details in the offer. Food is not covered by the regulation.
- de: Lebensmittel lösen die Pflicht nicht mehr aus (Art. 2 Abs. 3). Für Händlerinnen und Händler fremder Markenware ist beschrieben, was sie prüfen.
  en: Food no longer triggers the obligation (Art. 2(3)). For dealers of other brands' goods it is described what they check.
- de: 'Buchungsbelege einschließlich Rechnungen: 8 Jahre. Jahresabschlüsse, Bücher und Organisationsunterlagen: 10 Jahre. Handels- und Geschäftsbriefe: 6 Jahre. Die Frist läuft aber nicht ab, solange die Unterlagen für Steuern von Bedeutung sind, deren Festsetzungsfrist noch nicht abgelaufen ist – zum Beispiel bei einer laufenden Betriebsprüfung oder einem offenen Einspruch. Amtlos zeigt dir, ab wann du Unterlagen frühestens löschen darfst; ob noch etwas offen ist, klärst du vorher mit deiner Steuerberatung.'
  en: 'Accounting vouchers including invoices: 8 years. Annual financial statements, books and organisational documents: 10 years. Commercial and business letters: 6 years. However, the period does not expire as long as the documents matter for taxes whose assessment period has not yet expired – for example during an ongoing tax audit or an open objection. Amtlos shows you the earliest date you may delete documents; check with your tax adviser beforehand whether anything is still open.'
- de: 'Ergänzt: Die Aufbewahrungsfrist läuft nicht ab, solange für die Unterlagen eine Festsetzungsfrist noch offen ist (§ 147 Abs. 3 S. 5 AO).'
  en: 'Added: the retention period does not expire as long as an assessment period for the documents is still open (§ 147(3) sentence 5 AO).'
- de: Bücher nach den Regeln der doppelten Buchführung führen Kapitalgesellschaften und die GmbH & Co. KG immer. Eingetragene Kaufleute (e. K.) sind befreit, wenn sie an zwei aufeinanderfolgenden Abschlussstichtagen höchstens 800.000 € Umsatz und 80.000 € Jahresüberschuss haben (§ 241a HGB). Steuerlich wirst du nach § 141 AO erst buchführungspflichtig, wenn das Finanzamt es dir mitteilt – das kann es, wenn dein Umsatz über 800.000 € oder dein Gewinn über 80.000 € liegt. Bis dahin ermittelst du den Gewinn mit der Einnahmen-Überschuss-Rechnung. Die Buchführung ist eine laufende Pflicht; den Jahresabschluss macht in der Regel deine Steuerberatung.
  en: Corporations and the GmbH & Co. KG always keep double-entry books. Registered merchants (e. K.) are exempt if on two consecutive balance sheet dates they have no more than €800,000 turnover and €80,000 annual net profit (§ 241a HGB). For tax purposes you only become obliged to keep books under § 141 AO when the tax office notifies you – it can do so if your turnover exceeds €800,000 or your profit €80,000. Until then you determine profit with the cash-basis accounts (EÜR). Bookkeeping is an ongoing obligation; the annual financial statements are usually prepared by your tax adviser.
- de: Dein Unternehmen ist eine GmbH & Co. KG und damit nach dem Handelsgesetzbuch buchführungspflichtig.
  en: Your business is a GmbH & Co. KG and therefore obliged to keep books under the Commercial Code.
- de: Du bist als Kauffrau oder Kaufmann im Handelsregister eingetragen.
  en: You are registered as a merchant in the commercial register.
- de: Dein Umsatz im Vorjahr lag über 800.000 € – die Befreiung nach § 241a HGB greift nicht.
  en: Your turnover last year exceeded €800,000 – the exemption under § 241a HGB does not apply.
- de: Dein Gewinn im Vorjahr lag über 80.000 € – die Befreiung nach § 241a HGB greift nicht.
  en: Your profit last year exceeded €80,000 – the exemption under § 241a HGB does not apply.
- de: Dein erwarteter Umsatz im ersten Jahr liegt über 800.000 € – die Befreiung nach § 241a HGB greift nicht.
  en: Your expected turnover in the first year exceeds €800,000 – the exemption under § 241a HGB does not apply.
- de: Dein erwarteter Gewinn im ersten Jahr liegt über 80.000 € – die Befreiung nach § 241a HGB greift nicht.
  en: Your expected profit in the first year exceeds €80,000 – the exemption under § 241a HGB does not apply.
- de: Dein Umsatz im Vorjahr lag über der Grenze für die Buchführungspflicht nach § 141 AO.
  en: Your turnover last year exceeded the limit for the bookkeeping obligation under § 141 AO.
- de: Dein Gewinn im Vorjahr lag über der Grenze für die Buchführungspflicht nach § 141 AO.
  en: Your profit last year exceeded the limit for the bookkeeping obligation under § 141 AO.
- de: Das Finanzamt hat dir mitgeteilt, dass du Bücher führen musst.
  en: The tax office has notified you that you must keep books.
- de: Bücher für dieses Jahr laufend geführt
  en: Books kept on an ongoing basis this year
- de: Eingetragene Kaufleute unter den Grenzen des § 241a HGB sind nicht mehr buchführungspflichtig; die Pflicht nach § 141 AO gilt erst nach Mitteilung des Finanzamts. Eine Unterlage erledigt die Buchführung nicht mehr.
  en: Registered merchants below the limits of § 241a HGB are no longer obliged to keep books; the obligation under § 141 AO only applies after notification by the tax office. A document no longer completes bookkeeping.
- de: Wenn du bilanzierst, übermittelst du Bilanz und Gewinn- und Verlustrechnung elektronisch ans Finanzamt.
  en: If you prepare balance sheets, you transmit the balance sheet and profit and loss account electronically to the tax office.
- de: An das Finanzamt übermittelt
  en: Transmitted to the tax office
- de: Du bist als Einzelperson unternehmerisch tätig.
  en: You run your business as an individual.
- de: Bei GbR, Partnerschaftsgesellschaft und GmbH & Co. KG gibt die Gesellschaft jetzt die Feststellungserklärung ab (eigene Pflicht); die Einkommensteuererklärung machen die Gesellschafter persönlich.
  en: For a GbR, partnership company and GmbH & Co. KG, the company now files the declaration of separate determination (separate obligation); the partners file income tax returns personally.
- de: Erklärung zur gesonderten und einheitlichen Feststellung abgeben
  en: File the declaration of separate and uniform determination
- de: Einmal im Jahr gibt eure Gesellschaft elektronisch die Feststellungserklärung ab; die Gesellschafter versteuern ihren Anteil in ihrer eigenen Einkommensteuererklärung.
  en: Once a year your company electronically files the declaration of separate determination; the partners pay tax on their share in their own income tax returns.
- de: Dein Unternehmen ist eine Personengesellschaft.
  en: Your business is a partnership.
- de: In ELSTER gemeldet
  en: Reported in ELSTER
- de: Ab 1. Januar Regelbesteuerung
  en: Standard VAT from 1 January
- de: Dein Umsatz im Vorjahr lag höchstens bei 25.000 €.
  en: Your turnover last year was no more than €25,000.
- de: Dein erwarteter Umsatz in diesem Jahr liegt über 25.000 €.
  en: Your expected turnover this year exceeds €25,000.
- de: Ab 1. Januar fällt Umsatzsteuer an, auch wenn du sie nicht berechnest.
  en: From 1 January VAT is due, even if you do not charge it.
- de: Du gibst die Voranmeldung regelmäßig ab.
  en: You file the advance return regularly.
- de: Dein Umsatz im Vorjahr lag über der Kleinunternehmergrenze.
  en: Your turnover last year exceeded the small business limit.
- de: Dein erwarteter Umsatz in diesem Jahr liegt über der Kleinunternehmergrenze.
  en: Your expected turnover this year exceeds the small business limit.
- de: Befreiung von der Buchführung nach § 241a HGB – Umsatzgrenze
  en: Exemption from bookkeeping under § 241a HGB – turnover limit
- de: Befreiung von der Buchführung nach § 241a HGB – Grenze Jahresüberschuss
  en: Exemption from bookkeeping under § 241a HGB – annual net profit limit
- de: Anzeige beim Gewerbeamt eingereicht
  en: Notification submitted to the trade office
- de: "Arbeitest du selbst zum ersten Mal mit Lebensmitteln, brauchst du vor dem Start die Bescheinigung über die Belehrung durch das Gesundheitsamt; sie darf bei Aufnahme der Tätigkeit nicht älter als drei Monate sein (§ 43 Abs. 1 IfSG)."
  en: "If you work with food yourself for the first time, you need the certificate of the briefing by the public health office (Gesundheitsamt) before you start; it must not be more than three months old when you start the work (§ 43(1) IfSG)."
- de: Arbeitsmittel prüfen lassen
  en: Have work equipment inspected
- de: Auf der Website veröffentlicht
  en: Published on the website
- de: Aufenthaltstitel prüfen und Kopie aufbewahren
  en: Check residence permits and keep a copy
- de: Auszubildenden zahlst du mindestens die Mindestausbildungsvergütung nach dem Berufsbildungsgesetz – der Mindestlohn gilt für sie nicht.
  en: You pay apprentices at least the minimum training allowance under the Vocational Training Act – the minimum wage does not apply to them.
- de: Bei Aufträgen beim Kunden zu Hause über das Widerrufsrecht belehren
  en: Inform customers about the right of withdrawal for orders at their home
- de: Bei der Berufsgenossenschaft angemeldet
  en: Registered with the employers' liability insurance association
- de: Berufsgenossenschaft (über Lohnprogramm)
  en: Employers' liability insurance association (Berufsgenossenschaft, via payroll software)
- de: Bescheinigung liegt vor
  en: Certificate available
- de: Beschäftigst du Menschen ohne EU-, EWR- oder Schweizer Staatsangehörigkeit, prüfst du vor Beginn, ob sie bei dir arbeiten dürfen, und bewahrst eine Kopie des Aufenthaltstitels auf.
  en: If you employ people without EU, EEA or Swiss nationality, you check before they start whether they may work for you and keep a copy of the residence permit.
- de: Beschäftigte arbeiten bei dir mit Lebensmitteln.
  en: Staff work with food at your business.
- de: Beschäftigte unter 18 unterweist du vor Beginn und danach mindestens alle sechs Monate über Unfall- und Gesundheitsgefahren.
  en: You brief staff under 18 before they start and then at least every six months on accident and health hazards.
- de: Bietest du Privatkunden in deinem Laden Leistungen an, hängst du ein Preisverzeichnis deiner wesentlichen Leistungen aus.
  en: If you offer services to private customers in your shop, you display a price list of your main services.
- de: Branchenliste nach dem Gesetz zur Modernisierung der Schwarzarbeitsbekämpfung – neu Friseur, Kosmetik und plattformbasierte Lieferdienste, die Forstwirtschaft entfällt.
  en: 'List of sectors under the Act to Modernise the Fight against Undeclared Work – new: hairdressing, beauty and platform-based delivery services; forestry is no longer included.'
- de: Bußgeld bis 1.000 € (§ 146 Abs. 2 GewO).
  en: Fine of up to €1,000 (§ 146(2) GewO).
- de: Bußgeld bis 15 Mio. € oder 3 % des weltweiten Jahresumsatzes, bei kleinen und mittleren Unternehmen der niedrigere Betrag (Art. 99 KI-VO).
  en: Fine of up to €15 million or 3 % of worldwide annual turnover, for small and medium-sized enterprises whichever is lower (Art. 99 AI Act).
- de: Bußgeld bis 10.000 € (§ 117 HwO); bei erheblichem Umfang auch nach § 8 SchwarzArbG.
  en: Fine of up to €10,000 (§ 117 HwO); in serious cases also under § 8 SchwarzArbG.
- de: Bußgeld bis 20.000 €, wenn keine interne Meldestelle eingerichtet ist (§ 40 Abs. 2 Nr. 2, Abs. 6 HinSchG).
  en: Fine of up to €20,000 if no internal reporting channel has been set up (§ 40(2) no. 2, (6) HinSchG).
- de: Bußgeld bis 25.000 € (§ 73 IfSG).
  en: Fine of up to €25,000 (§ 73 IfSG).
- de: Das Datenblatt aus Amtlos bereitet die Anzeige nur vor. Erledigt ist sie, wenn du die Gewerbeanzeige beim Gewerbeamt eingereicht hast.
  en: The data sheet from Amtlos only prepares the notification. It is done once you have submitted the trade notification to the trade office.
- de: Dein Geschäftsjahr ist das Kalenderjahr (oder du hast nichts anderes angegeben).
  en: Your financial year is the calendar year (or you have not stated otherwise).
- de: Dein Gewinn im Vorjahr lag über dem Freibetrag von 24.500 €.
  en: Your profit last year was above the allowance of €24,500.
- de: Dein erwarteter Gewinn in diesem Jahr liegt über dem Freibetrag von 24.500 €.
  en: Your expected profit this year is above the allowance of €24,500.
- de: Deine Branche (Gebäudereinigung, seit 2026 auch Friseur und Kosmetik) gehört zu den Branchen mit Sofortmeldepflicht.
  en: Your sector (building cleaning, since 2026 also hairdressing and beauty) is one of the sectors requiring an immediate report.
- de: Deine Branche (Gebäudereinigung, seit 2026 auch Friseur und Kosmetik) gehört zu den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz.
  en: Your sector (building cleaning, since 2026 also hairdressing and beauty) is one of the sectors under § 2a of the Act to Combat Undeclared Work.
- de: Deine Umsatzsteuer im Vorjahr lag über der Grenze für die monatliche Voranmeldung.
  en: Your VAT last year was above the limit for monthly advance returns.
- de: Der Anmeldezeitraum folgt aus der Lohnsteuer des Vorjahres (§ 41a Abs. 2 EStG) – über 5.000 € monatlich, über 1.080 € vierteljährlich, sonst jährlich. Im ersten Jahr zählt die aufs Jahr hochgerechnete Lohnsteuer des ersten vollen Monats. Trag den Zeitraum in deinem Profil ein; Amtlos berechnet daraus die Termine.
  en: The filing period follows from last year's wage tax (§ 41a(2) EStG) – over €5,000 monthly, over €1,080 quarterly, otherwise yearly. In the first year the wage tax of the first full month projected to a full year counts. Enter the period in your profile; Amtlos calculates the deadlines from it.
- de: Die Abmeldung geht über das Lohnprogramm an die Krankenkasse bzw. die Minijob-Zentrale. Sie ist mit der ersten folgenden Entgeltabrechnung fällig, spätestens sechs Wochen nach dem Ende der Beschäftigung (§ 8 DEÜV). Amtlos zeigt den spätesten Termin.
  en: The deregistration goes via the payroll software to the health insurer or the Minijob-Zentrale. It is due with the next payroll, at the latest six weeks after the end of employment (§ 8 DEÜV). Amtlos shows the latest deadline.
- de: Die Bescheinigung nach § 43 Abs. 1 IfSG (früher „Gesundheitszeugnis“) brauchst auch du selbst, wenn du gewerbsmäßig mit Lebensmitteln nach § 42 IfSG arbeitest – zum Beispiel beim Kochen, Zubereiten oder Ausgeben. Die Belehrung macht das Gesundheitsamt oder ein beauftragter Arzt; vereinbare den Termin früh. Bei Aufnahme der Tätigkeit darf die Bescheinigung höchstens drei Monate alt sein. Hast du schon eine aus einer früheren Tätigkeit, brauchst du keine neue.
  en: You need the certificate under § 43(1) IfSG (formerly "health certificate") yourself too if you work commercially with food under § 42 IfSG – for example cooking, preparing or serving. The briefing is given by the public health office or an appointed doctor; book the appointment early. When you start the activity, the certificate may be at most three months old. If you already have one from earlier work, you don't need a new one.
- de: Die Erstbelehrung macht das Gesundheitsamt oder ein beauftragter Arzt. Die Bescheinigung darf bei Aufnahme der Tätigkeit höchstens drei Monate alt sein; du bewahrst sie im Betrieb auf. Das gilt nur für die erstmalige Tätigkeit mit Lebensmitteln nach § 42 IfSG. Wer schon eine Bescheinigung aus einer früheren Tätigkeit hat, braucht keine neue – dann reichen diese Bescheinigung und deine Belehrung. Bürokräfte ohne Umgang mit Lebensmitteln brauchen beides nicht. Danach belehrst du deine Beschäftigten selbst – siehe „Belehrung nach § 43 IfSG durch den Arbeitgeber“.
  en: The initial briefing is given by the public health office or an appointed doctor. The certificate may be at most three months old when the activity starts; you keep it at the business. This only applies to the first-time activity with food under § 42 IfSG. Anyone who already has a certificate from earlier work does not need a new one – that certificate and your briefing are then enough. Office staff without contact with food need neither. After that you brief your staff yourself – see "Briefing under § 43 IfSG by the employer".
- de: Du arbeitest selbst zum ersten Mal mit Lebensmitteln.
  en: You work with food yourself for the first time.
- de: Du beschäftigst Menschen ohne EU-, EWR- oder Schweizer Staatsangehörigkeit.
  en: You employ people without EU, EEA or Swiss nationality.
- de: Du betreibst ein Reisegewerbe.
  en: You run an itinerant trade.
- de: Du bietest Dienstleistungen an.
  en: You provide services.
- de: Du bildest aus.
  en: You train apprentices.
- de: Du hast im Vorjahr Umsatzsteuer angemeldet. Bei höchstens 2.000 € kann dich das Finanzamt von der Voranmeldung befreien – nur dann entfällt sie.
  en: You filed VAT returns last year. At €2,000 or less the tax office can exempt you from advance returns – only then do they no longer apply.
- de: Du schenkst alkoholische Getränke aus.
  en: You serve alcoholic drinks.
- de: Du schließt Verträge mit Privatkunden bei ihnen zu Hause oder unterwegs.
  en: You make contracts with private customers at their home or on the go.
- de: Du selbst; Beratung durch IHK oder Handwerkskammer
  en: You yourself; advice from the chamber of commerce (IHK) or chamber of crafts
- de: Du selbst; Kontrolle durch das Ordnungsamt
  en: You yourself; inspection by the public order office (Ordnungsamt)
- de: Du selbst; Kontrolle durch die Abfallbehörde des Landes
  en: You yourself; inspection by the state waste authority
- de: Du selbst; Untersuchung durch eine Ärztin oder einen Arzt
  en: You yourself; examination by a doctor
- de: Du verkaufst Essen oder Getränke zum Mitnehmen in Einwegverpackungen.
  en: You sell food or drinks to take away in single-use packaging.
- de: Du verkaufst im Laden.
  en: You sell in a shop.
- de: Eigene Bescheinigung des Gesundheitsamts vor dem Start (§ 43 IfSG)
  en: Your own certificate from the public health office before you start (§ 43 IfSG)
- de: Einmal im Jahr meldest du der Berufsgenossenschaft die Arbeitsentgelte des Vorjahres – meist über das Lohnprogramm.
  en: Once a year you report the previous year's wages to the employers' liability insurance association – usually via the payroll software.
- de: Endet eine Beschäftigung, meldest du die Person mit der nächsten Lohnabrechnung bei der Krankenkasse ab, spätestens sechs Wochen nach dem Ende.
  en: When employment ends, you deregister the person with the health insurer with the next payroll, at the latest six weeks after the end.
- de: Feuerlöscher bereitstellen und prüfen lassen
  en: Provide fire extinguishers and have them inspected
- de: Für Gründungen gibt es Förderprogramme – etwa den Gründungszuschuss der Arbeitsagentur, Gründungskredite der KfW und der Förderbanken der Länder und geförderte Gründungsberatung; für Startups mit Kapitalgesellschaft auch EXIST und INVEST.
  en: There are funding programmes for start-ups – for example the start-up grant of the employment agency, start-up loans from KfW and the state development banks and subsidised start-up advice; for start-ups with a corporation also EXIST and INVEST.
- de: Für jede beschäftigte Person geht bis zum 15. Februar eine Jahresmeldung für das Vorjahr an die Krankenkasse.
  en: For each employee, an annual report for the previous year goes to the health insurer by 15 February.
- de: Gebäudereinigung ist ein zulassungsfreies Handwerk (Anlage B1 der Handwerksordnung).
  en: Building cleaning is a skilled trade without licence requirement (Annex B1 of the Crafts Code).
- de: Im Streitfall auf die Verbraucherschlichtung hinweisen
  en: Refer consumers to dispute resolution in a dispute
- de: Im Transparenzregister gemeldet
  en: Reported to the transparency register
- de: In ELSTER übermittelt
  en: Submitted in ELSTER
- de: In deiner Gaststätte legst du ein Preisverzeichnis aus und hängst neben dem Eingang die Preise der wichtigsten Speisen und Getränke aus.
  en: In your restaurant you provide a price list and display the prices of the main food and drinks next to the entrance.
- de: Jugendliche halbjährlich unterweisen
  en: Brief young people every six months
- de: Kannst du einen Streit mit einem Verbraucher nicht beilegen, nennst du ihm eine zuständige Schlichtungsstelle und sagst, ob du teilnimmst.
  en: If you cannot settle a dispute with a consumer, you name a competent dispute resolution body and say whether you take part.
- de: Konnte eine Streitigkeit aus einem Vertrag mit einem Verbraucher nicht beigelegt werden, weist du in Textform auf eine für ihn zuständige Verbraucherschlichtungsstelle mit Anschrift und Website hin. Dabei sagst du, ob du an einem Verfahren dort teilnimmst oder teilnehmen musst (§ 37 VSBG). Das gilt unabhängig von der Größe deines Betriebs – auch wenn du auf der Website nichts angeben musst.
  en: If a dispute arising from a contract with a consumer could not be settled, you refer the consumer in text form to a consumer dispute resolution body competent for them, with address and website. You state whether you take part or are obliged to take part in proceedings there (§ 37 VSBG). This applies regardless of the size of your business – even if you don't have to state anything on your website.
- de: Lebensmittelhygiene schulen
  en: Train staff in food hygiene
- de: Lohnnachweis an die Berufsgenossenschaft
  en: Wage statement to the employers' liability insurance association
- de: Lohnnachweis übermittelt
  en: Wage statement submitted
- de: Mehrweg zum Mitnehmen anbieten
  en: Offer reusable packaging for take-away
- de: Mindestens eine beschäftigte Person arbeitet zum ersten Mal mit Lebensmitteln.
  en: At least one employee works with food for the first time.
- de: Mindestvergütung für Auszubildende zahlen
  en: Pay apprentices the minimum allowance
- de: Ohne Bescheinigung nach 14 Monaten darfst du die jugendliche Person nicht weiter beschäftigen (§ 33 Abs. 3 JArbSchG).
  en: Without a certificate after 14 months you may not continue to employ the young person (§ 33(3) JArbSchG).
- de: Ohne Kleinunternehmerregelung gibst du Voranmeldungen ab, solange das Finanzamt dich nicht befreit.
  en: Without the small business scheme you file advance returns unless the tax office exempts you.
- de: Preise deiner Leistungen im Laden aushängen
  en: Display the prices of your services in the shop
- de: Preisverzeichnis für Speisen und Getränke
  en: Price list for food and drinks
- de: Reisegewerbekarte beantragen (§ 55 GewO)
  en: Apply for an itinerant trade card (§ 55 GewO)
- de: Reisegewerbekarte liegt vor
  en: Itinerant trade card available
- de: Sachkundige Person (Feuerlöscher-Wartung)
  en: Competent person (fire extinguisher maintenance)
- de: Schließt du Verträge mit Privatkunden bei ihnen zu Hause oder unterwegs, haben sie 14 Tage Widerrufsrecht – darüber belehrst du vor Vertragsschluss.
  en: If you make contracts with private customers at their home or on the go, they have a 14-day right of withdrawal – you inform them about it before the contract is concluded.
- de: Schriftlich auf die Ausweispflicht hinweisen
  en: Inform staff in writing about carrying ID
- de: Verkaufst du Essen oder Getränke zum Mitnehmen in Einwegverpackungen aus Kunststoff oder Einwegbechern, bietest du auch Mehrweg an.
  en: If you sell food or drinks to take away in single-use plastic packaging or single-use cups, you also offer reusable packaging.
- de: Welche Programme passen, hängt von Rechtsform, Branche, Land und Vorhaben ab. Einen Überblick gibt die Förderdatenbank des Bundes; die IHK oder Handwerkskammer berät kostenlos. Fristen und Antragsunterlagen hängen vom Programm ab – viele Programme musst du vor dem Start beantragen.
  en: Which programmes fit depends on legal form, sector, federal state and project. The federal funding database gives an overview; the chamber of commerce or chamber of crafts advises free of charge. Deadlines and application documents depend on the programme – for many programmes you must apply before you start.
- de: 'Lieferst oder leistest du an Unternehmen in anderen EU-Ländern, gibst du die Zusammenfassende Meldung bis zum 25. nach Ablauf des Meldezeitraums ab: monatlich als Regel, vierteljährlich auf Wunsch,
    wenn deine EU-Lieferungen weder im laufenden noch in einem der vier vorangegangenen Quartale jeweils 50.000 € übersteigen (§ 18a Abs. 1 Satz 2 UStG), und immer vierteljährlich, wenn du nur sonstige
    Leistungen erbringst – Amtlos fragt dich nach deinem Meldezeitraum.'
  en: 'If you supply goods or services to businesses in other EU countries, you file the recapitulative statement by the 25th after the end of the reporting period: monthly as the rule, quarterly if you
    choose and your intra-EU deliveries did not exceed €50,000 in the current quarter or in any of the four preceding quarters (§ 18a(1) sentence 2 UStG), and always quarterly if you only provide other
    services – Amtlos asks you for your reporting period.'
- de: Wer Kosmetik herstellt oder unter eigenem Namen bzw. eigener Marke in Verkehr bringt, gilt als Hersteller (Art. 2 Abs. 1 lit. d Kosmetikverordnung). Vor dem ersten Inverkehrbringen brauchst du eine verantwortliche Person in der EU – das bist du selbst oder jemand, den du schriftlich benennst, zum Beispiel dein Lohnhersteller (Art. 4) –, eine Sicherheitsbewertung und eine Produktinformationsdatei, die Herstellung nach guter Herstellungspraxis (Art. 8) und die Notifizierung im CPNP-Portal der EU (Art. 13). Auf der Verpackung stehen die Pflichtangaben nach Art. 19, etwa Inhaltsstoffe, Mindesthaltbarkeit und Name der verantwortlichen Person. Ernste unerwünschte Wirkungen meldest du der Behörde (Art. 23).
  en: Anyone who produces cosmetics or places them on the market under their own name or brand is the manufacturer (Art. 2(1)(d) Cosmetics Regulation). Before placing a product on the market for the first time you need a responsible person in the EU – yourself or someone you designate in writing, for example your contract manufacturer (Art. 4) –, a safety assessment and a product information file, manufacture under good manufacturing practice (Art. 8) and notification in the EU CPNP portal (Art. 13). The packaging bears the mandatory information under Art. 19, such as ingredients, minimum durability and name of the responsible person. You report serious undesirable effects to the authority (Art. 23).
- de: Wer Verbrauchern Leistungen anbietet, stellt ein Preisverzeichnis mit den Preisen für die wesentlichen Leistungen oder den Verrechnungssätzen auf und bringt es im Geschäftslokal bzw. am Ort des Angebots an, bei Schaufenstern auch dort (§ 12 PAngV). Für Gaststätten gilt eine eigene Regel. Verkaufst du außerdem Waren, gibst du bei Waren nach Gewicht, Volumen oder Länge auch den Grundpreis an (§ 4 PAngV).
  en: Anyone offering services to consumers draws up a price list with the prices for the main services or the hourly rates and displays it in the business premises or at the place of the offer, with shop windows also there (§ 12 PAngV). Restaurants have their own rule. If you also sell goods, you also state the unit price for goods sold by weight, volume or length (§ 4 PAngV).
- de: Wer bei dir mit leicht verderblichen Lebensmitteln arbeitet – auch du selbst –, braucht eine Schulung in Lebensmittelhygiene.
  en: Anyone at your business who works with perishable food – including yourself – needs training in food hygiene.
- de: "Wer bei dir zum ersten Mal mit Lebensmitteln arbeitet, braucht vor dem ersten Arbeitstag die Bescheinigung über die Belehrung durch das Gesundheitsamt; sie darf bei Arbeitsbeginn nicht älter als drei Monate sein (§ 43 Abs. 1 IfSG)."
  en: "Anyone who works with food at your business for the first time needs the certificate of the briefing by the public health office before the first working day; it must not be more than three months old when they start work (§ 43(1) IfSG)."
- de: "Wer gewerbsmäßig leicht verderbliche Lebensmittel herstellt, behandelt oder in Verkehr bringt, braucht dafür Fachkenntnisse aus einer Schulung (§ 4 Lebensmittelhygiene-Verordnung). Als Lebensmittelunternehmer stellst du sicher, dass alle, die mit Lebensmitteln umgehen, ihrer Tätigkeit entsprechend in Hygiene geschult und überwacht werden (Anhang II Kapitel XII VO (EG) Nr. 852/2004). Die Fachkenntnisse musst du der Lebensmittelüberwachung auf Verlangen nachweisen (§ 4 Abs. 1 Satz 2 LMHV) – bei Kontrollen wird der Schulungsnachweis verlangt. Halte jede Schulung deshalb schriftlich fest: Datum, Themen, wer geschult hat und wer teilgenommen hat, mit Unterschrift. Empfohlen ist eine Wiederholung einmal im Jahr (DIN 10514) – eine gesetzliche Frist dafür gibt es nicht. Die Hygieneschulung ist nicht dasselbe wie die Belehrung nach dem Infektionsschutzgesetz: Die IfSG-Belehrung geht um Krankheiten, die Hygieneschulung um Fachwissen zur Lebensmittelhygiene. Du kannst beides am selben Termin machen, brauchst aber für jede eine eigene Unterschriftsliste. Wer eine Berufsausbildung mit Lebensmittelhygiene abgeschlossen hat, zum Beispiel als Bäcker/in oder Koch/Köchin, gilt in der Regel als ausreichend geschult (§ 4 Abs. 2 LMHV)."
  en: "Anyone who commercially produces, handles or places perishable food on the market needs the relevant knowledge from training (§ 4 Food Hygiene Ordinance, LMHV). As a food business operator, you make sure that everyone who handles food is trained and supervised in hygiene according to their work (Annex II Chapter XII Regulation (EC) No 852/2004). You must prove this knowledge to the food control authority on request (§ 4(1) sentence 2 LMHV) – inspectors ask for the training record. So record every training session in writing: date, topics, who gave the training and who took part, with signatures. Repeating it once a year is recommended (DIN 10514) – there is no statutory deadline for this. Hygiene training is not the same as the instruction under the Infection Protection Act: the IfSG instruction is about diseases, hygiene training is about food hygiene know-how. You can do both on the same date, but you need a separate signature list for each. Anyone who has completed vocational training that includes food hygiene, for example as a baker or cook, is generally considered sufficiently trained (§ 4(2) LMHV)."
- de: Zur Prüfung befähigte Person
  en: Person qualified to inspect
- de: § 17 MiLoG verlangt Aufzeichnungen für geringfügig Beschäftigte und für Beschäftigte in den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz (zum Beispiel Bau, Gaststätten und Hotels, Transport und Logistik, Gebäudereinigung, seit 2026 auch Friseur- und Kosmetikbetriebe). Aufzuzeichnen ist spätestens bis zum Ablauf des siebten Tages nach der Arbeitsleistung; die Aufzeichnungen bewahrst du zwei Jahre auf. Das ist eine laufende Pflicht – ein Arbeitszeitnachweis gilt für seinen Monat.
  en: § 17 MiLoG requires records for marginal employees and for employees in the sectors under § 2a of the Act to Combat Undeclared Work (for example construction, restaurants and hotels, transport and logistics, building cleaning, since 2026 also hairdressing and beauty businesses). Records must be made no later than the end of the seventh day after the work is performed; you keep the records for two years. This is an ongoing obligation – a working time record covers its month.
- de: Ärztliche Nachuntersuchung Jugendlicher nach einem Jahr
  en: Medical follow-up examination of young people after one year
- de: Deine Umsatzsteuer im Vorjahr lag über der Grenze für eine Befreiung.
  en: Your VAT in the previous year was above the limit for an exemption.
- de: Alkohol und Tabak nicht an Kinder und Jugendliche abgeben
  en: Do not sell alcohol or tobacco to children and young people
- de: Als Auftraggeber für den Mindestlohn bei Subunternehmern haften
  en: Liability as client for the minimum wage paid by subcontractors
- de: Als Halter machst du dich strafbar, wenn du anordnest oder zulässt, dass jemand dein Fahrzeug ohne die erforderliche Fahrerlaubnis führt (§ 21 Abs. 1 Nr. 2 StVG). Kontrolliere deshalb vor der ersten Fahrt den Führerschein im Original und danach regelmäßig – üblich ist etwa alle sechs Monate; eine feste Frist nennt das Gesetz nicht. Halte Datum, Klassen und Ergebnis fest.
  en: As the vehicle keeper you commit an offence if you order or allow someone to drive your vehicle without the required driving licence (§ 21(1) no. 2 StVG). So check the original driving licence before the first trip and regularly afterwards – about every six months is common practice; the law sets no fixed interval. Record the date, licence classes and result.
- de: Altbatterien zurücknehmen, wenn du Fahrzeugbatterien verkaufst
  en: Accept returned batteries if you sell vehicle batteries
- de: Altöl zurücknehmen, wenn du Motor- oder Getriebeöl verkaufst
  en: Accept returned waste oil if you sell engine or gear oil
- de: Altöl, Ölfilter, Bremsflüssigkeit, ölige Lappen und andere gefährliche Abfälle hältst du getrennt, gibst sie nur an zugelassene Entsorger und bewahrst die Nachweise auf.
  en: You keep waste oil, oil filters, brake fluid, oily rags and other hazardous waste separate, hand it only to licensed disposal companies and keep the records.
- de: Arbeiten Solo-Selbstständige für dich wie Angestellte, droht Scheinselbstständigkeit – ein Statusfeststellungsverfahren schafft Klarheit.
  en: If solo self-employed people work for you like employees, there is a risk of false self-employment (Scheinselbstständigkeit) – a status determination procedure provides clarity.
- de: Arbeiten an Fahrzeug-Klimaanlagen, bei denen Kältemittel zurückgewonnen oder nachgefüllt wird, dürfen nur Personen mit einer Bescheinigung über ihre Sachkunde ausführen. Das regeln die EU-F-Gase-Verordnung (EU) 2024/573 und die Chemikalien-Klimaschutzverordnung. Halte die Bescheinigungen deiner Mitarbeitenden bereit.
  en: Work on vehicle air-conditioning systems in which refrigerant is recovered or refilled may only be carried out by persons with a certificate of competence. This is governed by the EU F-gas Regulation (EU) 2024/573 and the German Chemicals Climate Protection Ordinance (ChemKlimaschutzV). Keep your staff's certificates ready.
- de: Aufenthaltstitel während der Beschäftigung im Blick behalten
  en: Keep an eye on residence permits during employment
- de: Ausbildungsnachweis regelmäßig durchsehen
  en: Review the training record regularly
- de: Ausbildungsvertrag ins Verzeichnis eintragen lassen
  en: Have the training contract entered in the register
- de: Auszubildende führen einen schriftlichen oder elektronischen Ausbildungsnachweis (§ 13 S. 2 Nr. 7 BBiG). Als Ausbildender hältst du sie dazu an, gibst ihnen Gelegenheit, ihn während der Ausbildungszeit zu führen, und siehst ihn regelmäßig durch (§ 14 Abs. 2 BBiG). Der Nachweis ist Voraussetzung für die Zulassung zur Abschlussprüfung.
  en: Apprentices keep a written or electronic training record (§ 13 sentence 2 no. 7 BBiG). As training employer you encourage them to do so, give them the opportunity to keep it during training hours and review it regularly (§ 14(2) BBiG). The record is a requirement for admission to the final examination.
- de: Beauftragst du Subunternehmer, haftest du dafür, dass deren Beschäftigte den Mindestlohn bekommen – lass dir Nachweise geben.
  en: If you hire subcontractors, you are liable for their staff receiving the minimum wage – ask for evidence.
- de: Bei Aufträgen per Telefon, E-Mail oder Messenger über das Widerrufsrecht belehren
  en: Inform about the right of withdrawal for orders by phone, email or messenger
- de: Bei Nutzung ohne Lizenz verlangt die GEMA die Vergütung nachträglich, in der Regel mit Zuschlag.
  en: If you play music without a licence, GEMA charges the fee retrospectively, usually with a surcharge.
- de: Bei der GmbH muss vor der Anmeldung auf jeden Geschäftsanteil mindestens ein Viertel eingezahlt sein, insgesamt mindestens die Hälfte des Mindeststammkapitals von 25.000 €, also 12.500 € (§ 7 Abs. 2 GmbHG). Bei der UG wird das Stammkapital vor der Anmeldung voll und in bar eingezahlt (§ 5a Abs. 2 GmbHG). In der Anmeldung versichert die Geschäftsführung, dass die Einlagen geleistet sind und endgültig zu ihrer freien Verfügung stehen (§ 8 Abs. 2 GmbHG).
  en: For a GmbH, at least a quarter must be paid in on each share before registration, and in total at least half of the minimum share capital of €25,000, i.e. €12,500 (§ 7(2) GmbHG). For a UG the share capital is paid in full and in cash before registration (§ 5a(2) GmbHG). In the application the managing directors confirm that the contributions have been made and are finally at their free disposal (§ 8(2) GmbHG).
- de: Bei dir läuft Musik, Radio oder Fernsehen für Kundschaft oder Gäste.
  en: You play music, radio or TV for customers or guests.
- de: Bei loser Ware und auf der Speisekarte machst du bestimmte Zusatzstoffe kenntlich, etwa „mit Farbstoff“ oder „mit Konservierungsstoff“.
  en: For loose goods and on the menu you indicate certain additives, such as “with colouring” or “with preservative”.
- de: Beim Beitragsservice angemeldet
  en: Registered with the Beitragsservice
- de: Berufshaftpflichtversicherung der PartG mbB unterhalten
  en: Maintain the professional liability insurance of the PartG mbB
- de: Bescheinigungen liegen vor
  en: Certificates are available
- de: 'Bestimmte Selbstständige – etwa Lehrende und Trainer ohne versicherungspflichtige Beschäftigte – sind rentenversicherungspflichtig: Sie melden sich innerhalb von drei Monaten bei der Deutschen Rentenversicherung und zahlen laufend Beiträge.'
  en: 'Certain self-employed people – such as teachers and trainers without employees subject to insurance – must pay into the statutory pension scheme: they register with the Deutsche Rentenversicherung within three months and pay contributions on an ongoing basis.'
- de: Bestimmte Tätigkeiten wie Ärztin, Architekt, Journalistin oder Unterricht, die kein Gewerbe sind.
  en: Certain activities, such as doctor, architect, journalist or teaching, that are not a trade.
- de: Bevor du Lebensmittel herstellst, behandelst oder verkaufst, registrierst du jeden Betrieb bei der Lebensmittelüberwachung – auch jede neue Filiale.
  en: Before you produce, handle or sell food, you register each establishment with the food control authority – including every new branch.
- de: Bier, Wein und Sekt gibst du nicht an unter 16-Jährige ab, Spirituosen, Tabak und E-Zigaretten nicht an unter 18-Jährige – im Zweifel lässt du dir das Alter nachweisen.
  en: You do not sell beer, wine or sparkling wine to anyone under 16, or spirits, tobacco and e-cigarettes to anyone under 18 – if in doubt, ask for proof of age.
- de: Braucht dein Gewerbe nach Art und Umfang einen kaufmännisch eingerichteten Geschäftsbetrieb, bist du Kaufmann – auch ohne Eintragung – und lässt dich ins Handelsregister eintragen.
  en: If your trade requires a commercially organised business by its nature and size, you are a merchant (Kaufmann) – even without registration – and have yourself entered in the commercial register.
- de: Bußgeld bis 50.000 € (§ 28 Abs. 1 Nr. 1, Abs. 5 JuSchG).
  en: Fine of up to €50,000 (§ 28(1) no. 1, (5) JuSchG).
- de: Bußgeld bis 50.000 € (§ 28 Abs. 1 Nr. 10, 12, Abs. 5 JuSchG).
  en: Fine of up to €50,000 (§ 28(1) nos. 10, 12, (5) JuSchG).
- de: Bußgeld bis 500.000 €, wenn der Mindestlohn nicht oder nicht rechtzeitig gezahlt wird (§ 21 Abs. 1 Nr. 9, Abs. 3 MiLoG).
  en: Fine of up to €500,000 if the minimum wage is not paid or not paid on time (§ 21(1) no. 9, (3) MiLoG).
- de: Das Bundesamt für Justiz setzt ein Ordnungsgeld von 2.500 € bis 25.000 € fest (§ 335 Abs. 1 HGB). Wird die Offenlegung erst nach der Androhung nachgeholt, kann es herabgesetzt werden – bei Kleinstkapitalgesellschaften auf 500 €, bei kleinen Gesellschaften auf 1.000 € (§ 335 Abs. 4 HGB).
  en: The Federal Office of Justice imposes an administrative fine of €2,500 to €25,000 (§ 335(1) HGB). If the disclosure is only made after the warning, the fine can be reduced – to €500 for micro companies and €1,000 for small companies (§ 335(4) HGB).
- de: Das Registergericht kann die Anmeldung mit Zwangsgeld durchsetzen (§ 14 HGB).
  en: The registry court can enforce the registration with a coercive fine (§ 14 HGB).
- de: Dein Gewerbe ist überwachungsbedürftig (§ 38 GewO).
  en: Your trade requires supervision (§ 38 GewO).
- de: Dein Unternehmen ist eine GbR.
  en: Your business is a civil-law partnership (GbR).
- de: Dein Unternehmen ist eine PartG mbB.
  en: Your business is a PartG mbB.
- de: Dein Unternehmen ist eine UG, GmbH oder GmbH & Co. KG.
  en: Your business is a UG, GmbH or GmbH & Co. KG.
- de: Deine Gesellschaft ist noch nicht im Register eingetragen.
  en: Your company is not yet entered in the register.
- de: Deine Gesellschaft wird im Handels- oder Partnerschaftsregister eingetragen.
  en: Your company is entered in the commercial or partnership register.
- de: Den Ausbildungsvertrag meldest du gleich nach Abschluss bei deiner Kammer zur Eintragung ins Verzeichnis der Berufsausbildungsverhältnisse an.
  en: Right after concluding it, you submit the training contract to your chamber for entry in the register of vocational training relationships.
- de: Die Gesellschaft wird zum Handelsregister angemeldet, die Partnerschaftsgesellschaft zum Partnerschaftsregister – GmbH und UG entstehen erst mit der Eintragung.
  en: The company is registered with the commercial register, a partnership company with the partnership register – a GmbH or UG only comes into existence on entry.
- de: Die Haftungsbeschränkung der PartG mbB gilt nur, solange die Partnerschaft die vom Berufsrecht vorgeschriebene Berufshaftpflichtversicherung unterhält.
  en: The limitation of liability of a PartG mbB only applies as long as the partnership maintains the professional liability insurance required by professional law.
- de: Die Insolvenzantragspflicht nach § 15a InsO trifft die Geschäftsführung. Der Antrag ist ohne schuldhaftes Zögern zu stellen, spätestens drei Wochen nach Eintritt der Zahlungsunfähigkeit und sechs Wochen nach Eintritt der Überschuldung. Bei der GmbH & Co. KG gilt das ebenso, weil keine natürliche Person unbeschränkt haftet; antragspflichtig ist dann die Geschäftsführung der Komplementär-GmbH (§ 15a Abs. 1 S. 3 InsO).
  en: The duty to file for insolvency under § 15a InsO lies with the managing directors. The application must be filed without culpable delay, at the latest three weeks after insolvency and six weeks after over-indebtedness occurs. The same applies to a GmbH & Co. KG because no natural person has unlimited liability; the duty then lies with the managing directors of the general partner GmbH (§ 15a(1) sentence 3 InsO).
- de: Die Lenk- und Ruhezeiten der Verordnung (EG) Nr. 561/2006 gelten für die Güterbeförderung mit Fahrzeugen über 3,5 t zulässiger Gesamtmasse (mit Anhänger). Seit dem 1.7.2026 gelten sie auch für Fahrzeuge über 2,5 t bis 3,5 t bei grenzüberschreitenden Fahrten und Kabotage; diese Fahrzeuge brauchen einen intelligenten Fahrtenschreiber der neuesten Generation. Die Daten aus Fahrtenschreiber und Fahrerkarte liest du regelmäßig aus und bewahrst sie auf. Für Werkverkehr bis 3,5 t gibt es unter bestimmten Bedingungen Ausnahmen (Art. 3 Buchst. ha VO (EG) Nr. 561/2006).
  en: The driving and rest times of Regulation (EC) No 561/2006 apply to the carriage of goods with vehicles over 3.5 t permissible total mass (including trailer). Since 1.7.2026 they also apply to vehicles over 2.5 t up to 3.5 t on cross-border trips and cabotage; these vehicles need a smart tachograph of the latest generation. You download the data from the tachograph and driver card regularly and keep it. For own-account transport up to 3.5 t there are exemptions under certain conditions (Art. 3(ha) Regulation (EC) No 561/2006).
- de: Die Kopie des Aufenthaltstitels oder der Erlaubnis zur Beschäftigung bewahrst du für die Dauer der Beschäftigung auf, auf Papier oder elektronisch (§ 4a Abs. 5 AufenthG). Läuft der Titel ab, darf die Person nur weiterarbeiten, wenn ein neuer Titel oder eine Bescheinigung der Ausländerbehörde die Beschäftigung erlaubt – lass dir dann die neue Kopie geben. Endet die Beschäftigung vorzeitig, kann eine Mitteilung an die Ausländerbehörde nötig sein.
  en: You keep the copy of the residence permit or work permit for the duration of employment, on paper or electronically (§ 4a(5) AufenthG). If the permit expires, the person may only continue working if a new permit or a certificate from the immigration authority allows the employment – then ask for the new copy. If the employment ends early, a notification to the immigration authority may be required.
- de: Die Mitgliedschaft entsteht automatisch mit dem Gewerbe; du musst dich nicht selbst anmelden. Die Kammer meldet sich bei dir und setzt den Beitrag fest. Kleingewerbetreibende ohne Eintragung im Handelsregister sind bei der IHK beitragsfrei, solange ihr Gewerbeertrag 5.200 € im Jahr nicht übersteigt (§ 3 Abs. 3 IHKG).
  en: Membership arises automatically with the trade; you do not need to register yourself. The chamber will contact you and set the fee. Small traders not entered in the commercial register pay no IHK fee as long as their trade income does not exceed €5,200 a year (§ 3(3) IHKG).
- de: 'Die UG (haftungsbeschränkt) bildet in ihrer Bilanz eine gesetzliche Rücklage: ein Viertel des Jahresüberschusses, gemindert um einen Verlustvortrag aus dem Vorjahr (§ 5a Abs. 3 GmbHG). Die Rücklage darf nur für eine Kapitalerhöhung aus Gesellschaftsmitteln oder zum Ausgleich von Verlusten verwendet werden. Die Pflicht endet erst, wenn das Stammkapital durch eine Kapitalerhöhung mindestens 25.000 € erreicht (§ 5a Abs. 5 GmbHG) – eine Rücklage in dieser Höhe allein reicht nicht.'
  en: 'The UG (haftungsbeschränkt) forms a statutory reserve in its balance sheet: a quarter of the annual surplus, reduced by any loss carried forward from the previous year (§ 5a(3) GmbHG). The reserve may only be used for a capital increase from company funds or to offset losses. The obligation only ends when the share capital reaches at least €25,000 through a capital increase (§ 5a(5) GmbHG) – a reserve of that amount alone is not enough.'
- de: Du beauftragst Subunternehmer.
  en: You hire subcontractors.
- de: Du bietest arbeitsmedizinische Vorsorge an oder veranlasst sie – je nach Tätigkeit, etwa bei Bildschirmarbeit, Lärm, Feuchtarbeit, Mehlstaub oder Schweißrauch.
  en: You offer or arrange occupational health check-ups – depending on the work, for example screen work, noise, wet work, flour dust or welding fumes.
- de: Du bist als Einzelunternehmen oder GbR nicht im Handelsregister eingetragen.
  en: As a sole proprietorship or GbR you are not entered in the commercial register.
- de: Du hast eine Betriebsstätte außerhalb deiner Wohnung, in der gewerbliche Abfälle anfallen.
  en: You have business premises outside your home where commercial waste arises.
- de: Du hast eine Erlaubnis für das Bewachungsgewerbe (§ 34a GewO).
  en: You have a permit for the security trade (§ 34a GewO).
- de: Du hast mindestens eine Betriebsstätte außerhalb deiner Wohnung.
  en: You have at least one business premises outside your home.
- de: Du hältst Auszubildende an, ihren Ausbildungsnachweis zu führen, und siehst ihn regelmäßig durch.
  en: You encourage apprentices to keep their training record and review it regularly.
- de: Du nimmst Aufträge von Privatkunden per Telefon, E-Mail oder Messenger an.
  en: You accept orders from private customers by phone, email or messenger.
- de: Du nutzt Firmenfahrzeuge.
  en: You use company vehicles.
- de: Du ortest Fahrzeuge oder Beschäftigte.
  en: You track vehicles or staff.
- de: Du selbst; Betriebsarzt
  en: You yourself; company doctor
- de: Du selbst; Bewacherregister (Statistisches Bundesamt)
  en: You yourself; security register (Federal Statistical Office)
- de: Du selbst; Gewerbeamt
  en: You yourself; trade office
- de: Du selbst; Kontrolle durch Ordnungsamt bzw. Jugendamt
  en: You yourself; checked by the public order office or youth welfare office
- de: Du selbst; Kontrolle durch Polizei und Gewerbeaufsicht
  en: You yourself; checked by the police and trade supervisory authority
- de: Du selbst; Kontrolle durch die untere Abfallbehörde
  en: You yourself; checked by the lower waste authority
- de: Du selbst; Sachkundelehrgang bei Kammer oder Bildungsträger
  en: You yourself; competence course at a chamber or training provider
- de: Du selbst; Stadtentwässerung bzw. untere Wasserbehörde
  en: You yourself; municipal drainage service or lower water authority
- de: Du selbst; zugelassener Entsorger; untere Abfallbehörde
  en: You yourself; licensed disposal company; lower waste authority
- de: Du und deine Partner; Berufshaftpflichtversicherer
  en: You and your partners; professional liability insurer
- de: Du verkaufst Fahrzeugbatterien (Starterbatterien).
  en: You sell vehicle batteries (starter batteries).
- de: Du verkaufst Motor- oder Getriebeöl an Endverbraucher.
  en: You sell engine or gear oil to end users.
- de: Du verkaufst am Marktstand.
  en: You sell at a market stall.
- de: Du verkaufst oder schenkst Alkohol oder Tabak aus.
  en: You sell or serve alcohol or tobacco.
- de: 'EU-Verpackungsverordnung: mitgebrachte Behälter und Mehrweg (ab 2027)'
  en: 'EU Packaging Regulation: customers'' own containers and reusables (from 2027)'
- de: Ein Verstoß ist eine Ordnungswidrigkeit (§ 7 Abs. 2 Nr. 1 LMZDV).
  en: A breach is an administrative offence (§ 7(2) no. 1 LMZDV).
- de: Eintragung beantragt
  en: Entry applied for
- de: Eintragung ins Handelsregister prüfen (Istkaufmann)
  en: Check entry in the commercial register (merchant by trade)
- de: Erlaubnis oder Lizenz für den Güterkraftverkehr
  en: Licence for road haulage
- de: Fahrerinnen und Fahrer beauftragen, unterweisen und Ladung sichern
  en: Appoint and instruct drivers and secure loads
- de: Fahrzeuge, die deine Beschäftigten fahren, lässt du mindestens einmal im Jahr durch einen Sachkundigen auf ihren betriebssicheren Zustand prüfen und hältst das fest.
  en: You have vehicles driven by your staff checked by a competent person for their safe operating condition at least once a year and record this.
- de: Firmenfahrzeuge jährlich durch einen Sachkundigen prüfen lassen
  en: Have company vehicles checked annually by a competent person
- de: Firmenfahrzeuge lässt du nur von geeigneten, unterwiesenen Personen fahren, die du ausdrücklich beauftragst – und sorgst dafür, dass die Ladung gesichert ist.
  en: You only let suitable, instructed persons whom you expressly appoint drive company vehicles – and make sure loads are secured.
- de: Freiheitsstrafe bis zu einem Jahr oder Geldstrafe für den Halter, der das Fahren ohne Fahrerlaubnis anordnet oder zulässt (§ 21 Abs. 1 Nr. 2 StVG).
  en: Imprisonment of up to one year or a fine for a keeper who orders or allows driving without a licence (§ 21(1) no. 2 StVG).
- de: Führerscheine der Fahrerinnen und Fahrer kontrollieren
  en: Check drivers' licences
- de: Führungszeugnis und Auskunft aus dem Gewerbezentralregister beantragen (§ 38 GewO)
  en: Apply for a certificate of good conduct and an extract from the central trade register (§ 38 GewO)
- de: Führungszeugnis und Auskunft beantragt
  en: Certificate and extract applied for
- de: Für Beschäftigte von außerhalb der EU bewahrst du die Kopie des Aufenthaltstitels für die ganze Dauer der Beschäftigung auf und achtest auf das Ablaufdatum.
  en: For staff from outside the EU you keep the copy of the residence permit for the whole duration of employment and watch the expiry date.
- de: Für Fahrzeuge über 3,5 t – grenzüberschreitend schon über 2,5 t – gelten die EU-Lenk- und Ruhezeiten; aufgezeichnet wird mit dem Fahrtenschreiber.
  en: For vehicles over 3.5 t – across borders already over 2.5 t – the EU driving and rest times apply; they are recorded with the tachograph.
- de: Für jede Betriebsstätte außerhalb deiner Wohnung und für Firmenfahrzeuge zahlst du Rundfunkbeitrag – du meldest sie an und meldest Änderungen.
  en: You pay the broadcasting fee for every business premises outside your home and for company vehicles – you register them and report changes.
- de: Für überwachungsbedürftige Gewerbe wie Gebrauchtwarenhandel oder Schlüsseldienst beantragst du nach der Gewerbeanzeige unverzüglich ein Führungszeugnis und eine Auskunft aus dem Gewerbezentralregister.
  en: For trades requiring supervision, such as second-hand dealing or locksmith services, you apply for a certificate of good conduct and an extract from the central trade register without delay after the trade registration.
- de: GEMA
  en: GEMA
- de: GbR ins Gesellschaftsregister eintragen? (eGbR)
  en: Enter the GbR in the company register? (eGbR)
- de: Gefährdungsbeurteilung je Gewerk und Einsatzort ergänzen
  en: Supplement the risk assessment for each trade and work location
- de: Gefährliche Abfälle getrennt halten, entsorgen und nachweisen
  en: Keep hazardous waste separate, dispose of it and keep records
- de: Gefährliche Abfälle vermischst du nicht mit anderen Abfällen (§ 9a KrWG). Du übergibst sie einem dafür zugelassenen Entsorger und bewahrst die Belege auf, etwa Übernahmescheine oder Entsorgungsnachweise. Als Erzeuger gefährlicher Abfälle führst du ein Register über Art, Menge und Verbleib (§ 49 Abs. 3 KrWG); die Belege nach der Nachweisverordnung gehören dazu. Für kleine Mengen gelten Erleichterungen – frag deinen Entsorger oder die Abfallbehörde.
  en: You do not mix hazardous waste with other waste (§ 9a KrWG). You hand it over to a licensed disposal company and keep the receipts, such as acceptance slips or disposal certificates. As a producer of hazardous waste you keep a register of its type, quantity and whereabouts (§ 49(3) KrWG); the records under the Waste Records Ordinance (NachwV) form part of it. Simplifications apply to small quantities – ask your disposal company or the waste authority.
- de: Gemeinde (Straßenverkehrs- bzw. Ordnungsamt); Marktveranstalter
  en: Municipality (road traffic or public order office); market organiser
- de: Gesellschaft im Register eintragen lassen
  en: Have the company entered in the register
- de: Gewerbeabfälle getrennt sammeln und dokumentieren
  en: Collect commercial waste separately and document it
- de: Gewerbetreibende machen die für ihren Betrieb geltenden Vorschriften des Jugendschutzgesetzes durch einen deutlich sichtbaren und gut lesbaren Aushang bekannt (§ 3 Abs. 1 JuSchG) – in Gaststätten etwa die Regeln zum Aufenthalt von Kindern und Jugendlichen (§ 4 JuSchG), beim Verkauf von Alkohol und Tabak die Abgabeverbote (§§ 9, 10 JuSchG). Fertige Aushänge gibt es bei Kammern und Verbänden.
  en: Traders make the provisions of the Youth Protection Act that apply to their business known by a clearly visible and legible notice (§ 3(1) JuSchG) – in restaurants for example the rules on children and young people being on the premises (§ 4 JuSchG), when selling alcohol and tobacco the sales bans (§§ 9, 10 JuSchG). Ready-made notices are available from chambers and associations.
- de: Handwerkskammer bzw. IHK
  en: Chamber of Crafts or IHK
- de: Hast du dich nicht gemeldet, fordert die Rentenversicherung die Beiträge rückwirkend nach – in der Regel für vier Jahre nach Ablauf des Kalenderjahres, in dem sie fällig wurden, bei Vorsatz für 30 Jahre (§ 25 Abs. 1 SGB IV).
  en: If you have not registered, the pension insurance claims the contributions retrospectively – usually for four years after the end of the calendar year in which they fell due, in case of intent for 30 years (§ 25(1) SGB IV).
- de: Hast du einen Abscheider, etwa am Waschplatz, lässt du ihn regelmäßig warten und prüfen – die Einzelheiten regeln Abwassersatzung und Wasserbehörde.
  en: If you have a separator, for example at the washing bay, you have it serviced and inspected regularly – the details are set by the waste water bylaw and the water authority.
- de: Händler von Starter-, Industrie- und Elektrofahrzeugbatterien nehmen Altbatterien dieser Art vom Endnutzer im Geschäft oder in dessen Nähe unentgeltlich zurück – unabhängig von Marke, Herkunft und Zustand, soweit sie solche Batterien als Neubatterien anbieten oder angeboten haben (§ 18 BattDG). Verkaufst du online, richtest du Rückgabemöglichkeiten in zumutbarer Entfernung ein.
  en: Dealers in starter, industrial and electric vehicle batteries accept returned waste batteries of this kind from end users free of charge at or near the shop – regardless of brand, origin and condition, insofar as they offer or have offered such batteries as new batteries (§ 18 BattDG). If you sell online, you set up return options within a reasonable distance.
- de: IHK (Vermittlerregister)
  en: IHK (intermediary register)
- de: Ihr fahrt mit Waren auch ins Ausland.
  en: You also carry goods abroad.
- de: Ihr habt einen Öl- oder Leichtflüssigkeitsabscheider.
  en: You have an oil or light-liquid separator.
- de: Ihr macht Klimaanlagen-Service an Fahrzeugen.
  en: You service air-conditioning systems in vehicles.
- de: Im Bewacherregister angemeldet
  en: Registered in the security register
- de: Im Bewachungsgewerbe meldest du jede Wachperson über das Bewacherregister an, bevor sie Bewachungsaufgaben übernimmt.
  en: In the security trade you register every security guard via the security register before they take on security tasks.
- de: Im Handwerk ergänzt du die Gefährdungsbeurteilung um die Gefährdungen deines Gewerks – in der Werkstatt und bei Arbeiten beim Kunden.
  en: In the trades you supplement the risk assessment with the hazards of your trade – in the workshop and when working at customers' premises.
- de: Im Inland gelten die Lenk- und Ruhezeiten schon für Fahrzeuge über 2,8 t bis 3,5 t – ohne Fahrtenschreiber zeichnest du sie mit Tageskontrollblättern auf.
  en: Domestically, driving and rest times already apply to vehicles over 2.8 t up to 3.5 t – without a tachograph you record them on daily record sheets.
- de: Im Vermittlerregister eingetragen
  en: Entered in the intermediary register
- de: Immobilienmakler und Wohnimmobilienverwalter bilden sich innerhalb von drei Kalenderjahren 20 Stunden weiter (§ 34c Abs. 2a GewO), Versicherungsvermittler 15 Stunden je Kalenderjahr (§ 34d Abs. 9 GewO). Die Nachweise bewahrst du auf und legst sie der Behörde auf Verlangen vor.
  en: Real estate agents and residential property managers complete 20 hours of further training within three calendar years (§ 34c(2a) GewO), insurance intermediaries 15 hours per calendar year (§ 34d(9) GewO). You keep the records and present them to the authority on request.
- de: In Gaststätten und Verkaufsstellen dürfen Bier, Wein, Sekt und ähnliche Getränke nicht an Kinder und Jugendliche unter 16 Jahren abgegeben werden, Branntwein und branntweinhaltige Getränke, auch Mischgetränke, nicht an unter 18-Jährige; auch den Verzehr darfst du ihnen nicht gestatten (§ 9 Abs. 1 JuSchG). Tabakwaren, E-Zigaretten und Shishas gibst du nicht an Kinder und Jugendliche unter 18 Jahren ab und gestattest ihnen das Rauchen nicht (§ 10 Abs. 1, 4 JuSchG). Lass dir im Zweifel das Alter nachweisen (§ 2 Abs. 2 JuSchG) und weise dein Personal ein.
  en: In restaurants and shops, beer, wine, sparkling wine and similar drinks must not be sold to children and young people under 16, and spirits and drinks containing spirits, including mixed drinks, not to anyone under 18; you must not allow them to consume these either (§ 9(1) JuSchG). You do not sell tobacco products, e-cigarettes or shishas to children and young people under 18 and do not allow them to smoke (§ 10(1), (4) JuSchG). If in doubt, ask for proof of age (§ 2(2) JuSchG) and brief your staff.
- de: 'Im nicht privaten Bereich zahlst du für jede Betriebsstätte einen Rundfunkbeitrag, gestaffelt nach der Zahl der Beschäftigten: mit bis zu acht Beschäftigten ein Drittel des Beitrags, mit neun bis 19 Beschäftigten einen ganzen Beitrag, mit mehr Beschäftigten entsprechend mehr (§ 5 Abs. 1 RBStV). Ein Arbeitsraum in deiner eigenen Wohnung ist frei, wenn für die Wohnung schon Rundfunkbeitrag gezahlt wird (§ 5 Abs. 5 Nr. 3 RBStV). Für betrieblich genutzte Kraftfahrzeuge zahlst du je Fahrzeug ein Drittel des Beitrags; je beitragspflichtiger Betriebsstätte ist ein Fahrzeug frei (§ 5 Abs. 2 Nr. 2 RBStV). Den Beginn, neue Betriebsstätten und Fahrzeuge sowie Änderungen meldest du dem Beitragsservice (§ 8 RBStV).'
  en: 'Outside the private sphere you pay a broadcasting fee for each business premises, graded by the number of employees: with up to eight employees a third of the fee, with nine to 19 employees one full fee, with more employees correspondingly more (§ 5(1) RBStV). A workroom in your own home is exempt if the broadcasting fee is already paid for the home (§ 5(5) no. 3 RBStV). For motor vehicles used for business you pay a third of the fee per vehicle; one vehicle per business premises liable to the fee is exempt (§ 5(2) no. 2 RBStV). You report the start, new premises and vehicles and any changes to the Beitragsservice (§ 8 RBStV).'
- de: In Gaststätten und Verkaufsstellen mit Alkohol oder Tabak hängst du die Jugendschutzvorschriften gut sichtbar aus.
  en: In restaurants and shops with alcohol or tobacco you post the youth protection rules where they are clearly visible.
- de: In deinem Betrieb fallen gefährliche Abfälle an.
  en: Hazardous waste arises in your business.
- de: In der Partnerschaftsgesellschaft mit beschränkter Berufshaftung haftet für Schäden aus fehlerhafter Berufsausübung nur das Gesellschaftsvermögen – aber nur, wenn die Partnerschaft eine zu diesem Zweck durch Gesetz vorgegebene Berufshaftpflichtversicherung unterhält (§ 8 Abs. 4 PartGG). Mindestversicherungssumme und weitere Anforderungen regelt das jeweilige Berufsrecht, etwa für Rechtsanwälte, Steuerberater oder Architekten. Der Name der Partnerschaft enthält den Zusatz „mit beschränkter Berufshaftung“ oder eine Abkürzung wie „mbB“.
  en: In a partnership company with limited professional liability, only the company's assets are liable for damage caused by professional errors – but only if the partnership maintains professional liability insurance prescribed by law for this purpose (§ 8(4) PartGG). The minimum sum insured and other requirements are set by the relevant professional law, for example for lawyers, tax advisers or architects. The name of the partnership contains the addition “mit beschränkter Berufshaftung” or an abbreviation such as “mbB”.
- de: Ins Vermittlerregister eintragen lassen
  en: Register in the intermediary register
- de: Jugendschutzgesetz aushängen
  en: Post the Youth Protection Act
- de: Kaufmann ist, wer ein Handelsgewerbe betreibt. Das ist jedes Gewerbe, das nach Art und Umfang einen in kaufmännischer Weise eingerichteten Geschäftsbetrieb erfordert (§ 1 HGB) – Anzeichen sind etwa hoher Umsatz, mehrere Beschäftigte, ein Lager oder viele Geschäftsbeziehungen. Feste Schwellen nennt das Gesetz nicht. Ein Istkaufmann meldet seine Firma zur Eintragung ins Handelsregister an (§ 29 HGB); das Registergericht kann das mit Zwangsgeld durchsetzen (§ 14 HGB). Das Handelsgesetzbuch gilt schon vor der Eintragung. Eine GbR mit Handelsgewerbe ist kraft Gesetzes eine OHG (§ 105 Abs. 1 HGB). Die Grenzen des § 241a HGB betreffen nur die Buchführung, nicht die Frage, ob du Kaufmann bist.
  en: A merchant (Kaufmann) is anyone who carries on a commercial trade. That is any trade that by its nature and size requires a commercially organised business (§ 1 HGB) – signs include high turnover, several employees, a warehouse or many business relationships. The law sets no fixed thresholds. A merchant by trade applies for entry of their business name in the commercial register (§ 29 HGB); the registry court can enforce this with a coercive fine (§ 14 HGB). The Commercial Code applies even before entry. A GbR carrying on a commercial trade is by law a general partnership (OHG) (§ 105(1) HGB). The thresholds of § 241a HGB only concern bookkeeping, not whether you are a merchant.
- de: Keine eigene Pflicht – Hinweis.
  en: Not an obligation in itself – a note.
- de: Klimaanlagen an Fahrzeugen nur mit Sachkunde warten
  en: Service vehicle air conditioning only with certified competence
- de: Lebensmittelunternehmen müssen jeden Betrieb vor Beginn der Tätigkeit bei der zuständigen Behörde registrieren lassen – meist beim Veterinär- und Lebensmittelüberwachungsamt des Kreises (Art. 6 Abs. 2 VO (EG) Nr. 852/2004). Das gilt für jede Betriebsstätte, also auch für eine neue Filiale; wesentliche Änderungen der Tätigkeit und die Schließung eines Betriebs meldest du ebenfalls. Mit einem Foodtruck oder Verkaufswagen registrierst du dich bei der Behörde an deinem Betriebssitz – dort, wo das Fahrzeug steht bzw. wo du wohnst –, nicht bei der am Verkaufsplatz. Bewahre die Bestätigung der Registrierung auf; bei Kontrollen wird sie verlangt. Stellst du selbst Lebensmittel tierischen Ursprungs her oder verarbeitest sie (zum Beispiel als Metzgerei), kann statt der Registrierung eine Zulassung nötig sein (Art. 4 VO (EG) Nr. 853/2004) – frag die Lebensmittelüberwachung.
  en: Food businesses must have each establishment registered with the competent authority before starting operations – usually the district's veterinary and food control office (Art. 6(2) Regulation (EC) No 852/2004). This applies to every establishment, including a new branch; you also report significant changes in activity and the closure of an establishment. With a food truck or sales vehicle, you register with the authority at your place of business – where the vehicle is kept or where you live – not with the one at the place of sale. Keep the registration confirmation; it is requested during inspections. If you produce or process food of animal origin yourself (for example as a butcher's shop), approval may be needed instead of registration (Art. 4 Regulation (EC) No 853/2004) – ask the food control authority.
- de: Lenk- und Ruhezeiten bei Transportern über 2,8 t
  en: Driving and rest times for vans over 2.8 t
- de: Lenk- und Ruhezeiten einhalten und mit dem Fahrtenschreiber aufzeichnen
  en: Comply with driving and rest times and record them with the tachograph
- de: Lizenz für Musik und Fernsehen im Betrieb
  en: Licence for music and TV on the premises
- de: Lässt du Beschäftigte mit Firmenfahrzeugen fahren, prüfst du vorher und danach regelmäßig, ob sie die nötige Fahrerlaubnis haben, und hältst das fest.
  en: If you let staff drive company vehicles, you check beforehand and regularly afterwards that they hold the required driving licence and record this.
- de: Läuft bei dir Musik, Radio oder Fernsehen für Kundschaft, Gäste oder Kursteilnehmende, brauchst du dafür eine Lizenz – der Rundfunkbeitrag deckt das nicht ab.
  en: If you play music, radio or TV for customers, guests or course participants, you need a licence for it – the broadcasting fee does not cover this.
- de: Melde dein Gewerbe bei der Gemeinde an, wenn du anfängst – und ebenso, wenn du umziehst, die Tätigkeit wechselst oder erweiterst oder aufhörst.
  en: Register your trade with the municipality when you start – and likewise when you move, change or extend your activity or stop.
- de: Mindestens ein Fahrzeug hat mehr als 2,5 t zulässige Gesamtmasse.
  en: At least one vehicle has a permissible total mass of more than 2.5 t.
- de: Mindestens ein Fahrzeug hat mehr als 3,5 t zulässige Gesamtmasse.
  en: At least one vehicle has a permissible total mass of more than 3.5 t.
- de: Mindestens ein Fahrzeug hat über 2,8 bis 3,5 t zulässige Gesamtmasse.
  en: At least one vehicle has a permissible total mass of over 2.8 up to 3.5 t.
- de: Musik, Radio oder Fernsehen, die du in Café, Laden, Salon, Wartebereich oder Kursraum für andere abspielst, sind eine öffentliche Wiedergabe (§§ 15, 19, 21, 22 UrhG). Dafür brauchst du die Erlaubnis der Rechteinhaber, in der Regel über die GEMA, die auch für andere Verwertungsgesellschaften einzieht. Der Rundfunkbeitrag deckt das nicht ab, ein privates Streaming-Abo auch nicht. Welcher Tarif passt – etwa für Kurse im Raum oder im Live-Stream –, klärst du mit der GEMA.
  en: Music, radio or TV that you play for others in a café, shop, salon, waiting area or course room is a public performance (§§ 15, 19, 21, 22 UrhG). For this you need the permission of the rights holders, usually via GEMA, which also collects for other collecting societies. The broadcasting fee does not cover this, nor does a private streaming subscription. You clarify with GEMA which tariff fits – for example for courses in a room or via live stream.
- de: Nach der EU-Verpackungsverordnung befüllen Take-away-Betriebe ab 12.2.2027 mitgebrachte Behälter; ab 12.2.2028 kommt ein Mehrwegangebot dazu, Kleinstunternehmen ausgenommen.
  en: Under the EU Packaging Regulation, take-away businesses fill containers brought by customers from 12.2.2027; from 12.2.2028 a reusable option is added, micro-enterprises excepted.
- de: 'Nachtarbeit: Untersuchung ermöglichen und ausgleichen'
  en: 'Night work: allow medical examinations and provide compensation'
- de: Nachtzeit ist die Zeit von 23 bis 6 Uhr, in Bäckereien und Konditoreien von 22 bis 5 Uhr (§ 2 Abs. 3 ArbZG). Nachtarbeit ist Arbeit, die mehr als zwei Stunden der Nachtzeit umfasst (§ 2 Abs. 4 ArbZG); Nachtarbeitnehmer ist, wer normalerweise in Wechselschicht nachts arbeitet oder an mindestens 48 Tagen im Jahr (§ 2 Abs. 5 ArbZG). Nachtarbeitnehmer dürfen sich vor Beginn der Beschäftigung und danach in Abständen von nicht weniger als drei Jahren arbeitsmedizinisch untersuchen lassen, ab 50 Jahren jährlich; die Kosten trägst du, wenn du die Untersuchung nicht kostenlos durch einen Betriebsarzt anbietest (§ 6 Abs. 3 ArbZG). Für die Nachtarbeit gewährst du eine angemessene Zahl bezahlter freier Tage oder einen angemessenen Zuschlag, soweit kein Tarifvertrag gilt (§ 6 Abs. 5 ArbZG). Die werktägliche Arbeitszeit darf acht Stunden nur überschreiten, bis zu zehn Stunden, wenn innerhalb eines Kalendermonats oder von vier Wochen im Durchschnitt acht Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG).
  en: Night time is the period from 23 to 6 o'clock, in bakeries and confectioneries from 22 to 5 o'clock (§ 2(3) ArbZG). Night work is work covering more than two hours of night time (§ 2(4) ArbZG); a night worker is anyone who normally works nights in shifts or on at least 48 days a year (§ 2(5) ArbZG). Night workers may have an occupational health examination before starting and then at intervals of no less than three years, from age 50 every year; you bear the costs unless you offer the examination free of charge through a company doctor (§ 6(3) ArbZG). For night work you grant a reasonable number of paid days off or a reasonable surcharge, unless a collective agreement applies (§ 6(5) ArbZG). Daily working time may only exceed eight hours, up to ten hours, if eight hours on average are not exceeded within a calendar month or four weeks (§ 6(2) ArbZG).
- de: Nimmst du Aufträge von Privatkunden per Telefon, E-Mail oder Messenger an, haben sie meist 14 Tage Widerrufsrecht – darüber belehrst du vor Vertragsschluss.
  en: If you accept orders from private customers by phone, email or messenger, they usually have a 14-day right of withdrawal – you inform them about it before the contract is concluded.
- de: Ob du freiberuflich oder gewerblich tätig bist, entscheidet über die Gewerbeanzeige, die Gewerbesteuer und die Mitgliedschaft in IHK oder Handwerkskammer. Freiberuflich sind neben Berufen wie Ärztin, Architekt oder Journalistin auch unterrichtende und erzieherische Tätigkeiten (§ 18 Abs. 1 Nr. 1 EStG), etwa Kurse und Unterricht. Personal Training ohne Unterrichtscharakter kann dagegen gewerblich sein – das hängt vom Einzelfall ab. Gewerbesteuer fällt bei Einzelunternehmen und Personengesellschaften erst an, wenn der Gewerbeertrag den Freibetrag von 24.500 € übersteigt (§ 11 Abs. 1 GewStG). Solange die Einordnung offen ist, kann Amtlos diese Pflichten nicht sicher bestimmen.
  en: Whether you work as a freelancer or a trader determines the trade registration, trade tax and membership in the IHK or Chamber of Crafts. Besides professions such as doctor, architect or journalist, teaching and educational activities are also liberal professions (§ 18(1) no. 1 EStG), such as courses and lessons. Personal training without a teaching character can, on the other hand, be a trade – this depends on the individual case. For sole proprietorships and partnerships, trade tax only applies once trade income exceeds the allowance of €24,500 (§ 11(1) GewStG). As long as the classification is open, Amtlos cannot determine these obligations reliably.
- de: Ohne die vorgeschriebene Versicherung entfällt die Haftungsbeschränkung – dann haften die Partner nach den allgemeinen Regeln auch persönlich (§ 8 Abs. 1, 2 PartGG).
  en: Without the required insurance the limitation of liability no longer applies – the partners are then also personally liable under the general rules (§ 8(1), (2) PartGG).
- de: Ortest du Fahrzeuge oder Beschäftigte per GPS oder Telematik, brauchst du eine Rechtsgrundlage, informierst die Betroffenen, legst Zweck und Löschfrist fest und schließt mit dem Anbieter einen Vertrag.
  en: If you track vehicles or staff via GPS or telematics, you need a legal basis, inform the persons concerned, set the purpose and deletion period and conclude a contract with the provider.
- de: Ortung von Fahrzeugen und Beschäftigten datenschutzgerecht gestalten
  en: Track vehicles and staff in compliance with data protection law
- de: Papier, Glas, Kunststoffe, Metalle, Holz, Textilien und Bioabfälle aus deinem Betrieb sammelst du getrennt und hältst fest, wie du sie entsorgst.
  en: You collect paper, glass, plastics, metals, wood, textiles and bio-waste from your business separately and record how you dispose of them.
- de: Registergericht (über den Notar); Beratung bei IHK oder Handwerkskammer
  en: Registry court (via the notary); advice from the IHK or Chamber of Crafts
- de: Rentenversicherungspflicht als Selbstständige prüfen und melden
  en: Check and register compulsory pension insurance as a self-employed person
- de: Rundfunkbeitrag für Betriebsstätten und Firmenfahrzeuge zahlen
  en: Pay the broadcasting fee for business premises and company vehicles
- de: Sachkundiger, z. B. eine Kfz-Werkstatt
  en: Competent person, e.g. a car repair workshop
- de: Scheinselbstständigkeit bei Subunternehmern vermeiden
  en: Avoid false self-employment among subcontractors
- de: Seit 2.8.2026 müssen Menschen erkennen können, dass sie mit einer KI sprechen, etwa bei Chatbots. Täuschend echte KI-Bilder, -Videos und -Töne (Deepfakes) kennzeichnest du.
  en: Since 2.8.2026 people must be able to recognise that they are talking to an AI, for example with chatbots. You label deceptively real AI images, videos and audio (deepfakes).
- de: Seit 2024 kann sich eine GbR ins Gesellschaftsregister eintragen lassen – nötig wird das, wenn sie etwa ein Grundstück erwerben oder sich an einer anderen Gesellschaft beteiligen will.
  en: Since 2024 a GbR can be entered in the company register – this becomes necessary if it wants to acquire land or hold a stake in another company, for example.
- de: Standplatz für Foodtruck oder Verkaufsstand klären
  en: Clarify the pitch for a food truck or sales stand
- de: Stellt sich eine Beschäftigung heraus, zahlst du die Sozialversicherungsbeiträge nach, in der Regel für bis zu vier Jahre (§ 28e, § 25 SGB IV); wer Beiträge vorsätzlich vorenthält, macht sich strafbar (§ 266a StGB).
  en: If it turns out to be employment, you pay the social security contributions retrospectively, usually for up to four years (§ 28e, § 25 SGB IV); anyone who intentionally withholds contributions commits a criminal offence (§ 266a StGB).
- de: Verkaufst du Motor- oder Getriebeöl an Endverbraucher, richtest du vorher eine Annahmestelle für Altöl ein und weist Privatkunden mit einer Schrifttafel darauf hin.
  en: If you sell engine or gear oil to end users, you set up a collection point for waste oil beforehand and point private customers to it with a sign.
- de: Verkaufst du Starterbatterien, nimmst du alte Starterbatterien deiner Kunden kostenlos zurück.
  en: If you sell starter batteries, you accept your customers' old starter batteries free of charge.
- de: Verkaufst du von einem Fahrzeug oder Stand auf öffentlichen Straßen und Plätzen, brauchst du in der Regel eine Sondernutzungserlaubnis; auf Märkten vergibt der Veranstalter die Plätze.
  en: If you sell from a vehicle or stand on public roads and squares, you usually need a special use permit; at markets the organiser allocates the pitches.
- de: Versicherung besteht
  en: Insurance in place
- de: Wachpersonen im Bewacherregister anmelden
  en: Register security guards in the security register
- de: Wer Klimaanlagen in Fahrzeugen befüllt, wartet oder Kältemittel absaugt, braucht eine Bescheinigung über die Sachkunde für fluorierte Treibhausgase.
  en: Anyone who fills or services air-conditioning systems in vehicles or recovers refrigerant needs a certificate of competence for fluorinated greenhouse gases.
- de: 'Wer den Antrag nicht, nicht richtig oder nicht rechtzeitig stellt, macht sich strafbar: Freiheitsstrafe bis zu drei Jahren oder Geldstrafe, bei Fahrlässigkeit bis zu einem Jahr oder Geldstrafe (§ 15a Abs. 4, 5 InsO). Zahlungen nach Eintritt der Insolvenzreife muss die Geschäftsführung der Gesellschaft in der Regel ersetzen (§ 15b InsO).'
  en: 'Anyone who does not file, files incorrectly or files late commits a criminal offence: imprisonment of up to three years or a fine, in case of negligence up to one year or a fine (§ 15a(4), (5) InsO). The managing directors must usually reimburse the company for payments made after insolvency occurred (§ 15b InsO).'
- de: Wer gewerbliche Siedlungsabfälle erzeugt, sammelt Papier, Pappe und Karton, Glas, Kunststoffe, Metalle, Holz, Textilien und Bioabfälle getrennt und gibt sie vorrangig zur Vorbereitung zur Wiederverwendung oder zum Recycling weiter (§ 3 Abs. 1 GewAbfV). Die Getrenntsammlung dokumentierst du, etwa mit Lageplänen, Fotos, Liefer- oder Wiegescheinen und Entsorgungsverträgen (§ 3 Abs. 3 GewAbfV). Ist die Trennung technisch nicht möglich oder wirtschaftlich nicht zumutbar, gelten Ausnahmen, die du ebenfalls dokumentierst. Gefährliche Abfälle haben eigene Pflichten.
  en: Anyone who produces commercial municipal waste collects paper, paperboard and cardboard, glass, plastics, metals, wood, textiles and bio-waste separately and passes them on primarily for preparation for re-use or recycling (§ 3(1) GewAbfV). You document the separate collection, for example with site plans, photos, delivery or weighing slips and disposal contracts (§ 3(3) GewAbfV). If separation is technically impossible or economically unreasonable, exemptions apply, which you also document. Hazardous waste has its own obligations.
- de: Wer gewerbsmäßig Verbrennungsmotoren- oder Getriebeöl an Endverbraucher abgibt, richtet vor der Abgabe eine Annahmestelle für gebrauchte Öle ein oder weist eine solche durch eine vertragliche Vereinbarung nach (§ 8 Abs. 1 AltölV). Bei der Abgabe an private Endverbraucher weist du am Ort des Verkaufs mit leicht erkennbaren und lesbaren Schrifttafeln auf die Annahmestelle hin.
  en: Anyone who commercially supplies combustion engine or gear oil to end users sets up a collection point for used oils before supplying it, or proves one by contractual agreement (§ 8(1) AltölV). When selling to private end users you point to the collection point at the place of sale with easily recognisable and legible signs.
- de: Wie lange Mängelansprüche bestehen, hängt von der Art des Werks ab. Stellst du Waren her und lieferst sie – etwa als Bäckerei oder Konditorei, auch Torten auf Bestellung –, gilt Kaufrecht (§ 650 BGB); die Mängelrechte richten sich dann nach §§ 437, 438 BGB. Amtlos erinnert nach fachlicher Freigabe an das Ende der Fristen.
  en: How long warranty claims last depends on the type of work. If you make and deliver goods – for example as a bakery or confectionery, including cakes made to order – sales law applies (§ 650 BGB); warranty rights then follow §§ 437, 438 BGB. After expert approval, Amtlos will remind you when the periods end.
- de: Wer eine Erlaubnis nach § 34d, § 34f, § 34h oder § 34i GewO hat, lässt sich unverzüglich nach Aufnahme der Tätigkeit in das Vermittlerregister eintragen, das die IHK führt (§ 11a GewO). Änderungen meldest du ebenfalls. Versicherungsvermittler bilden sich außerdem jedes Jahr weiter – das steht bei der Weiterbildungspflicht.
  en: Anyone with a permit under § 34d, § 34f, § 34h or § 34i GewO registers in the intermediary register kept by the IHK without delay after starting the activity (§ 11a GewO). You also report changes. Insurance intermediaries also complete further training every year – see the further training obligation.
- de: Wer einen anderen Unternehmer mit Werk- oder Dienstleistungen beauftragt, haftet wie ein Bürge dafür, dass dieser und alle weiteren Nachunternehmer ihren Beschäftigten den Mindestlohn zahlen (§ 13 MiLoG i. V. m. § 14 AEntG). Im Baugewerbe und bei Paketdiensten haftest du außerdem für die Sozialversicherungsbeiträge der Nachunternehmer (§ 28e SGB IV). Lass dir deshalb vor und während der Zusammenarbeit Nachweise geben, etwa Unbedenklichkeitsbescheinigungen der Krankenkasse und der Berufsgenossenschaft, eine Erklärung zum Mindestlohn und die Gewerbeanmeldung, und vereinbare Kontrollrechte im Vertrag.
  en: Anyone who commissions another business to carry out work or services is liable like a guarantor for that business and all further subcontractors paying their staff the minimum wage (§ 13 MiLoG in conjunction with § 14 AEntG). In construction and parcel services you are also liable for the subcontractors' social security contributions (§ 28e SGB IV). So ask for evidence before and during the cooperation, such as clearance certificates from the health insurer and the employers' liability insurance association, a minimum wage declaration and the trade registration, and agree inspection rights in the contract.
- de: Wer jemanden ohne die erforderliche Erlaubnis beschäftigt, riskiert ein Bußgeld bis 500.000 € (§ 404 Abs. 2 Nr. 3, Abs. 3 SGB III).
  en: Anyone who employs someone without the required permit risks a fine of up to €500,000 (§ 404(2) no. 3, (3) SGB III).
- de: Wer öffentliche Straßen, Wege und Plätze über den Gemeingebrauch hinaus nutzt – etwa mit einem Foodtruck oder Verkaufsstand –, braucht eine Sondernutzungserlaubnis nach dem Straßenrecht des Landes, meist von der Gemeinde. Auf privaten Flächen brauchst du die Zustimmung der Eigentümer. Auf Wochenmärkten, Volksfesten und anderen von der Gemeinde festgesetzten Veranstaltungen vergibt der Veranstalter die Standplätze (§§ 64 ff., § 70 GewO).
  en: Anyone who uses public roads, paths and squares beyond common use – for example with a food truck or sales stand – needs a special use permit under the state's road law, usually from the municipality. On private land you need the owner's consent. At weekly markets, festivals and other events set by the municipality, the organiser allocates the pitches (§§ 64 et seq., § 70 GewO).
- de: Wird die Rücklage nicht gebildet, sind die Feststellung des Jahresabschlusses und der Gewinnverwendungsbeschluss nach herrschender Meinung nichtig (§ 256 AktG entsprechend).
  en: If the reserve is not formed, the approval of the annual financial statements and the resolution on the appropriation of profits are void according to the prevailing opinion (§ 256 AktG by analogy).
- de: Zahlt ein Subunternehmer den Mindestlohn nicht, können dessen Beschäftigte den Lohn direkt von dir verlangen (§ 14 AEntG).
  en: If a subcontractor does not pay the minimum wage, its staff can claim the wage directly from you (§ 14 AEntG).
- de: Zum Jahresabschluss gehören Bilanz und Gewinn- und Verlustrechnung. Das gilt für UG und GmbH und ebenso für die GmbH & Co. KG, bei der keine natürliche Person unbeschränkt haftet (§ 264a HGB). Die Geschäftsführung stellt ihn in den ersten drei Monaten nach Ende des Geschäftsjahres auf, kleine Gesellschaften spätestens nach sechs Monaten (§ 264 Abs. 1 HGB). Bei GmbH und UG stellen die Gesellschafter ihn innerhalb von acht Monaten fest, kleine Gesellschaften innerhalb von elf Monaten (§ 42a Abs. 2 GmbHG). Die Bilanz geht außerdem elektronisch als E-Bilanz ans Finanzamt.
  en: The annual financial statements comprise the balance sheet and profit and loss account. This applies to UG and GmbH and likewise to the GmbH & Co. KG, in which no natural person has unlimited liability (§ 264a HGB). The managing directors prepare them within the first three months after the end of the financial year, small companies at the latest after six months (§ 264(1) HGB). For a GmbH or UG the shareholders approve them within eight months, small companies within eleven months (§ 42a(2) GmbHG). The balance sheet is also sent electronically to the tax office as an e-balance sheet.
- de: Zusatzstoffe bei loser Ware kenntlich machen
  en: Indicate additives for loose goods
- de: Öl- und Leichtflüssigkeitsabscheider warten und prüfen lassen
  en: Have oil and light-liquid separators serviced and inspected
- de: Wer Speisen in Einwegkunststoffverpackungen oder Getränke in Einwegbechern erst beim Verkauf befüllt, muss sie auch in einer Mehrwegverpackung anbieten – nicht teurer und gut sichtbar mit einem Hinweis (§ 60 VerpackDG). Ausgenommen sind kleine Betriebe mit höchstens fünf Beschäftigten und höchstens 80 m² Verkaufsfläche; sie müssen stattdessen auf Wunsch mitgebrachte Behälter der Kundschaft befüllen und darauf hinweisen (§ 61 VerpackDG). Seit 12.8.2026 steht die Pflicht im Verpackungsrecht-Durchführungsgesetz, das das Verpackungsgesetz abgelöst hat.
  en: Anyone who fills food into single-use plastic packaging or drinks into single-use cups only at the point of sale must also offer them in reusable packaging – not more expensive and with a clearly visible notice (§ 60 VerpackDG). Small businesses with no more than five employees and no more than 80 m² of sales area are exempt; instead, they must fill containers brought by customers on request and point this out (§ 61 VerpackDG). Since 12.8.2026, the obligation is set out in the Packaging Law Implementation Act (Verpackungsrecht-Durchführungsgesetz), which replaced the Packaging Act (Verpackungsgesetz).
- de: Überwachungsbedürftig sind unter anderem der Handel mit hochwertigen Gebrauchtwaren, Fahrzeugen, Edelmetallen, Schmuck und Altmetall, Auskunfteien und Detekteien, die Vermittlung von Ehen, Partnerschaften, Reisen und Unterkünften sowie Schlüsseldienste und der Einbau von Sicherungseinrichtungen (§ 38 Abs. 1 GewO). Nach der Gewerbeanzeige prüft die Behörde deine Zuverlässigkeit. Dafür beantragst du unverzüglich ein Führungszeugnis und eine Auskunft aus dem Gewerbezentralregister zur Vorlage bei der Behörde; tust du es nicht, holt die Behörde sie selbst ein.
  en: Trades requiring supervision include dealing in high-value second-hand goods, vehicles, precious metals, jewellery and scrap metal, credit agencies and detective agencies, brokering marriages, partnerships, travel and accommodation, as well as locksmith services and installing security devices (§ 38(1) GewO). After the trade registration the authority checks your reliability. For this you apply without delay for a certificate of good conduct and an extract from the central trade register to submit to the authority; if you don't, the authority obtains them itself.
- de: Die Verordnung (EU) 2025/40 über Verpackungen gilt seit 12.8.2026 und bringt für Speisen und Getränke zum Mitnehmen zwei Stufen. Bis 12.2.2027 müssen Kundinnen und Kunden kalte oder heiße Getränke und verzehrfertige Speisen in selbst mitgebrachte Behälter füllen lassen können – nicht teurer als in Einwegverpackung und mit gut sichtbarem Hinweis (Art. 32). Bis 12.2.2028 bietest du zusätzlich Mehrwegverpackungen aus einem Mehrwegsystem zur Wahl an (Art. 33); Kleinstunternehmen sind davon ausgenommen. Die deutsche Mehrwegangebotspflicht (§§ 60, 61 VerpackDG) gilt daneben weiter.
  en: Regulation (EU) 2025/40 on packaging has applied since 12.8.2026 and brings two stages for takeaway food and drinks. By 12.2.2027, customers must be able to have cold or hot drinks and ready-to-eat food filled into containers they bring themselves – not more expensive than in single-use packaging and with a clearly visible notice (Art. 32). By 12.2.2028, you additionally offer reusable packaging from a reuse system as a choice (Art. 33); micro-enterprises are exempt from this. The German obligation to offer reusable packaging (§§ 60, 61 VerpackDG) continues to apply alongside.
- de: Der Bund will bis Ende 2026 einen Gesetzentwurf einbringen, der die Benennungspflicht ab 20 Personen nach § 38 Abs. 1 BDSG aufhebt.
  en: The federal government intends to introduce a bill by the end of 2026 that abolishes the obligation to appoint a data protection officer from 20 persons under § 38 Abs. 1 BDSG.
- de: 'Bund und Länder haben am 4.12.2025 in der Föderalen Modernisierungsagenda vereinbart, dass der Bund bis 31.12.2026 eine Aufhebung des § 38 Abs. 1 BDSG einbringt. Das betrifft nur das Einbringen, nicht das Inkrafttreten. Stand: Oktober 2026 – noch offen: Ein Gesetzentwurf liegt nicht vor, bis zu einer Änderung gilt die Schwelle von 20 Personen weiter. Die Pflichten nach Art. 37 DSGVO blieben auch danach bestehen.'
  en: 'In the Federal Modernisation Agenda of 4.12.2025, the federal government and the states agreed that the federal government will introduce a repeal of § 38 Abs. 1 BDSG by 31.12.2026. This only concerns introducing the bill, not its entry into force. Status: October 2026 – still open: there is no draft bill yet; until the law changes, the threshold of 20 persons continues to apply. The obligations under Art. 37 GDPR would remain in place even afterwards.'
- de: 'Bund und Länder haben am 4.12.2025 vereinbart, dass ein Gesetzentwurf für eine Gründung binnen 24 Stunden bis 31.12.2026 beschlossen werden soll. Berlin, Nordrhein-Westfalen und Bayern haben im März 2026 Eckpunkte für ein Gründungsbeschleunigungsgesetz vorgelegt; die Rechtsgrundlagen muss der Bund schaffen. Stand: Oktober 2026 – noch offen: Ein Gesetzentwurf des Bundes ist nicht bekannt. Amtlos passt den Gründungsassistenten an, sobald es konkret wird.'
  en: 'On 4.12.2025, the federal government and the states agreed that a draft law enabling a business to be founded within 24 hours should be adopted by 31.12.2026. Berlin, North Rhine-Westphalia and Bavaria presented key points for a Business Formation Acceleration Act (Gründungsbeschleunigungsgesetz) in March 2026; the legal basis has to be created by the federal government. Status: October 2026 – still open: no federal draft bill is known. Amtlos will adapt the founding assistant as soon as it becomes concrete.'
- de: 'Wer unter NIS2 fällt, meldet erhebliche Sicherheitsvorfälle dem BSI in drei Stufen: eine frühe Erstmeldung binnen 24 Stunden, eine Meldung binnen 72 Stunden und eine Abschlussmeldung binnen eines Monats (§ 32 BSIG). Außerdem setzt du Risikomanagement-Maßnahmen um. Die Geschäftsleitung haftet für die Umsetzung.'
  en: 'If you fall under NIS2, you report significant security incidents to the BSI in three stages: an early warning within 24 hours, a notification within 72 hours and a final report within one month (§ 32 BSIG). You also implement risk management measures. Management is liable for the implementation.'
- de: Pflichten für Hochrisiko-KI (ab 2.12.2027)
  en: Obligations for high-risk AI (from 2.12.2027)
- de: Für Hochrisiko-KI-Systeme gelten umfangreiche Pflichten – in den Bereichen nach Anhang III ab 2.12.2027, für KI in Produkten nach Anhang I ab 2.8.2028.
  en: Extensive obligations apply to high-risk AI systems – in the areas listed in Annex III from 2.12.2027, for AI in products under Annex I from 2.8.2028.
- de: Die Digital-Omnibus-Verordnung (EU) 2026/1744 hat die Hochrisiko-Pflichten der KI-Verordnung verschoben; sie ist am 24.7.2026 im Amtsblatt erschienen und seit 27.7.2026 in Kraft. Für Hochrisiko-KI in sensiblen Bereichen nach Anhang III (zum Beispiel Personalauswahl, Kreditwürdigkeit, Bildung) gelten die Pflichten ab 2.12.2027, für KI als Sicherheitsbauteil von Produkten nach Anhang I ab 2.8.2028. Betroffen sind vor allem Anbieter und Betreiber solcher Systeme.
  en: The Digital Omnibus Regulation (EU) 2026/1744 postponed the high-risk obligations of the AI Act; it was published in the Official Journal on 24.7.2026 and has been in force since 27.7.2026. For high-risk AI in sensitive areas under Annex III (for example recruitment, creditworthiness, education), the obligations apply from 2.12.2027; for AI as a safety component of products under Annex I, from 2.8.2028. Mainly providers and deployers of such systems are affected.
- de: 'Nach dem Entwurf des Bundesarbeitsministeriums (Juni 2026) sollen Beginn, Ende und Dauer der Arbeitszeit taggleich und elektronisch erfasst werden, geplant ab 1.1.2027. Für die elektronische Form sind Übergangsfristen nach Betriebsgröße vorgesehen (unter 250 Beschäftigten zwei Jahre, unter 50 Beschäftigten fünf Jahre); Betriebe mit bis zu 10 Beschäftigten müssen aufzeichnen, aber nicht elektronisch. Stand: Oktober 2026 – noch offen: Der Entwurf wird innerhalb der Bundesregierung abgestimmt, ein Kabinettsbeschluss liegt nicht vor. Ob der Termin 1.1.2027 hält, ist unsicher.'
  en: 'Under the draft of the Federal Ministry of Labour (June 2026), the start, end and duration of working time are to be recorded on the same day and electronically, planned from 1.1.2027. Transition periods by company size are planned for the electronic form (below 250 employees two years, below 50 employees five years); businesses with up to 10 employees must record, but not electronically. Status: October 2026 – still open: the draft is being coordinated within the federal government, there is no cabinet decision. Whether the date of 1.1.2027 will hold is uncertain.'
- de: Arbeitgeber mit mindestens 150 Beschäftigten sollen nach der EU-Richtlinie erstmals bis 7.6.2027 über das Entgeltgefälle berichten.
  en: Under the EU directive, employers with at least 150 employees are to report on the gender pay gap for the first time by 7.6.2027.
- de: 'Die EU-Entgelttransparenzrichtlinie war bis 7.6.2026 umzusetzen; Deutschland hat die Frist verpasst. Nach der Richtlinie berichten Arbeitgeber mit 250 oder mehr Beschäftigten ab 7.6.2027 jährlich, mit 150 bis 249 Beschäftigten ab 7.6.2027 alle drei Jahre und mit 100 bis 149 Beschäftigten ab 7.6.2031 alle drei Jahre. Stand: Oktober 2026 – noch offen: Ein deutsches Umsetzungsgesetz ist nicht beschlossen, erst dieses legt die Stichtage für deinen Betrieb fest. Bis dahin gilt das bisherige Entgelttransparenzgesetz weiter.'
  en: 'The EU Pay Transparency Directive had to be transposed by 7.6.2026; Germany missed the deadline. Under the directive, employers with 250 or more employees report annually from 7.6.2027, those with 150 to 249 employees every three years from 7.6.2027 and those with 100 to 149 employees every three years from 7.6.2031. Status: October 2026 – still open: no German implementing act has been adopted; only that act will set the reporting dates for your business. Until then, the existing Pay Transparency Act (Entgelttransparenzgesetz) continues to apply.'
- de: Du beschäftigst mindestens 150 Personen.
  en: You employ at least 150 people.
- de: Die Ausnahme von der monatlichen Voranmeldung für Neugründer gilt nur bis einschließlich 2026 – eine Verlängerung ist bisher nicht beschlossen.
  en: The exception from monthly advance VAT returns for new businesses only applies up to and including 2026 – an extension has not been adopted so far.
- de: Ab dem 1. Januar 2027 sind Rechnungen an Unternehmen als E-Rechnung vorgeschrieben, wenn der Vorjahresumsatz über 800.000 € liegt.
  en: From 1 January 2027, invoices to businesses must be e-invoices if the previous year's revenue is above €800,000.
- de: Art. 4 KI-Verordnung verlangte seit 2.2.2025, ein ausreichendes Maß an KI-Kompetenz sicherzustellen. Seit dem Digital-Omnibus (VO (EU) 2026/1744, in Kraft seit 27.7.2026) verlangt Art. 4 nur noch Maßnahmen, die die KI-Kompetenz der Personen fördern, die in deinem Auftrag mit KI-Systemen arbeiten; ein bestimmtes Kompetenzniveau ist nicht mehr vorgeschrieben. Eine kurze Schulung mit Nachweis bleibt ein einfacher Weg, das zu zeigen; Amtlos bietet Schulungen mit Bestätigung.
  en: Since 2.2.2025, Art. 4 of the AI Act required ensuring a sufficient level of AI literacy. Since the Digital Omnibus (Regulation (EU) 2026/1744, in force since 27.7.2026), Art. 4 only requires measures that promote the AI literacy of the people who work with AI systems on your behalf; a specific level of literacy is no longer prescribed. A short training with proof remains a simple way to show this; Amtlos offers training courses with confirmation.
- de: Bei Barzahlungen ab 10.000 € – beim Handel mit Edelmetallen schon ab 2.000 € – sieht das Geldwäschegesetz Sorgfaltspflichten für Güterhändler vor.
  en: For cash payments of €10,000 or more – €2,000 or more when trading in precious metals – the Anti-Money Laundering Act (Geldwäschegesetz) provides for due diligence obligations for dealers in goods.
- de: Bußgeld bis 10 Mio. € für besonders wichtige und bis 7 Mio. € für wichtige Einrichtungen, wenn eine Meldung fehlt, falsch oder zu spät ist; bei mehr als 500 Mio. € Gesamtumsatz bis 2 % bzw. 1,4 % des weltweiten Umsatzes (§ 65 Abs. 2 Nr. 4, Abs. 5 Satz 1 Nr. 1, Abs. 6, 7 BSIG).
  en: Fine of up to €10 million for particularly important entities and up to €7 million for important entities if a report is missing, incorrect or late; with total revenue above €500 million up to 2% or 1.4% of worldwide revenue (§ 65(2) no. 4, (5) sentence 1 no. 1, (6), (7) BSIG).
- de: Bußgeld bis 10 Mio. € oder bis 2 % des weltweiten Jahresumsatzes, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 4 Buchst. a DSGVO).
  en: Fine of up to €10 million or up to 2% of worldwide annual turnover, whichever is higher (Art. 83(4)(a) GDPR).
- de: Bußgeld bis 100.000 €, wenn die Registrierung fehlt, und bis 200.000 €, wenn Verpackungen nicht an einem System beteiligt sind (§ 66 Abs. 1 Nr. 1, 3, Abs. 3 VerpackDG).
  en: Fine of up to €100,000 if registration is missing, and up to €200,000 if packaging is not participating in a system (§ 66(1) nos. 1, 3, (3) VerpackDG).
- de: Bußgeld bis 150.000 € bei Vorsatz, sonst bis 100.000 €, etwa wenn die Identifizierung fehlt; bei schwerwiegenden, wiederholten oder systematischen Verstößen bis 1 Mio. € oder bis zum Zweifachen des wirtschaftlichen Vorteils (§ 56 Abs. 1 Satz 1 Nr. 15, Abs. 3 GwG).
  en: Fine of up to €150,000 for intent, otherwise up to €100,000, for example if identification is missing; for serious, repeated or systematic violations up to €1 million or up to twice the economic benefit (§ 56(1) sentence 1 no. 15, (3) GwG).
- de: Bußgeld bis 150.000 € bei Vorsatz, sonst bis 100.000 €; bei schwerwiegenden, wiederholten oder systematischen Verstößen bis 1 Mio. € oder bis zum Zweifachen des wirtschaftlichen Vorteils (§ 56 Abs. 1 Satz 1 Nr. 55, Abs. 3 GwG).
  en: Fine of up to €150,000 for intent, otherwise up to €100,000; for serious, repeated or systematic violations up to €1 million or up to twice the economic benefit (§ 56(1) sentence 1 no. 55, (3) GwG).
- de: Bußgeld bis 20 Mio. € oder bis 4 % des weltweiten Jahresumsatzes, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 5 Buchst. b DSGVO).
  en: Fine of up to €20 million or up to 4% of worldwide annual turnover, whichever is higher (Art. 83(5)(b) GDPR).
- de: Bußgeld bis 25.000 € (§ 111 Abs. 1 Nr. 2, Abs. 4 SGB IV).
  en: Fine of up to €25,000 (§ 111(1) no. 2, (4) SGB IV).
- de: Bußgeld bis 25.000 €, wenn die Belehrung nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig durchgeführt wird (§ 73 Abs. 1a Nr. 16b, Abs. 2 IfSG).
  en: Fine of up to €25,000 if the instruction is not carried out, not carried out correctly, completely or on time (§ 73(1a) no. 16b, (2) IfSG).
- de: Bußgeld bis 30.000 € (§ 58 Abs. 1, 4 JArbSchG).
  en: Fine of up to €30,000 (§ 58(1), (4) JArbSchG).
- de: Bußgeld bis 300.000 € (§ 28 Abs. 1 Nr. 13, Abs. 2 TDDDG).
  en: Fine of up to €300,000 (§ 28(1) no. 13, (2) TDDDG).
- de: Bußgeld bis 5.000 € (§ 32 Abs. 1 Nr. 11, Abs. 2 MuSchG).
  en: Fine of up to €5,000 (§ 32(1) no. 11, (2) MuSchG).
- de: Bußgeld bis 5.000 €, wenn ein Arbeitsmittel nicht oder nicht rechtzeitig geprüft wird (§ 22 Abs. 1 Nr. 28 BetrSichV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG).
  en: Fine of up to €5,000 if work equipment is not inspected or not inspected on time (§ 22(1) no. 28 BetrSichV in conjunction with § 25(1) no. 1, (2) ArbSchG).
- de: Bußgeld bis 500.000 €, wenn die Registrierung fehlt, falsch oder verspätet ist (§ 65 Abs. 2 Nr. 6, Abs. 5 Satz 1 Nr. 5 BSIG).
  en: Fine of up to €500,000 if registration is missing, incorrect or late (§ 65(2) no. 6, (5) sentence 1 no. 5 BSIG).
- de: Das Hinweisgeberschutzgesetz verlangt von Beschäftigungsgebern mit in der Regel mindestens 50 Beschäftigten eine interne Meldestelle (§ 12 Abs. 2 HinSchG). Gezählt werden Köpfe, nicht Vollzeitstellen – Beschäftigte sind neben Arbeitnehmern auch Auszubildende (§ 3 Abs. 8 HinSchG).
  en: The Whistleblower Protection Act requires employers with usually at least 50 employees to have an internal reporting channel (§ 12(2) HinSchG). Heads are counted, not full-time positions – employees include apprentices as well as workers (§ 3(8) HinSchG).
- de: Das Nachweisgesetz verlangt, dass die wesentlichen Arbeitsbedingungen dokumentiert und der beschäftigten Person ausgehändigt werden. Name und Anschrift der Vertragsparteien, Arbeitsentgelt und Arbeitszeit müssen spätestens am ersten Arbeitstag vorliegen, Beginn, Befristung, Arbeitsort, Tätigkeit, Probezeit, Arbeit auf Abruf und Überstunden spätestens am siebten Kalendertag, die übrigen Angaben binnen eines Monats (§ 2 Abs. 1 Satz 9 NachwG). Deshalb erscheint die Pflicht schon, sobald eine Einstellung mit Arbeitsbeginn eingetragen ist; der Termin ist der erste Arbeitstag.
  en: The Documentation Act (Nachweisgesetz) requires that the essential working conditions are documented and handed to the employee. Names and addresses of the parties, pay and working hours must be provided by the first working day at the latest; start date, fixed term, place of work, duties, probation, on-call work and overtime by the seventh calendar day; the other details within one month (§ 2(1) sentence 9 NachwG). That is why this obligation appears as soon as a hiring with a start date has been entered; the due date is the first working day.
- de: Dazu gehören unter anderem die Identifizierung der Vertragspartner und ein Risikomanagement. Die Pflichten greifen bei Transaktionen, bei denen du Barzahlungen über mindestens 10.000 € selbst oder durch Dritte annimmst oder leistest (§ 10 Abs. 6a Nr. 1 Buchst. c GwG), bei hochwertigen Gütern wie Edelmetallen schon ab 2.000 € (Buchst. b) und bei Kunstgegenständen ab einem Transaktionswert von 10.000 € (Buchst. a). Als Verpflichteter registrierst du dich außerdem bei der Zentralstelle für Finanztransaktionsuntersuchungen (goAML), auch ohne Verdachtsfall (§ 45 Abs. 1 S. 2 GwG).
  en: These include identifying contracting partners and risk management. The obligations apply to transactions in which you receive or make cash payments of at least €10,000 yourself or through third parties (§ 10(6a) no. 1(c) GwG), for high-value goods such as precious metals from €2,000 (letter b) and for works of art from a transaction value of €10,000 (letter a). As an obliged entity you also register with the Financial Intelligence Unit (goAML), even without a suspicious case (§ 45(1) sentence 2 GwG).
- de: Dein Betrieb ist kein Kleinstbetrieb außerhalb der IT-Branche.
  en: Your business is not a micro business outside the IT sector.
- de: Deine Verarbeitung fällt unter Art. 37 Abs. 1 Buchst. b, c DSGVO oder § 38 Abs. 1 Satz 2 BDSG.
  en: Your processing falls under Art. 37(1)(b), (c) GDPR or § 38(1) sentence 2 BDSG.
- de: Die Hinweispflicht nach § 36 VSBG gilt für Unternehmer, die eine Website unterhalten oder AGB verwenden. Ausgenommen ist, wer am 31. Dezember des Vorjahres zehn oder weniger Personen beschäftigt hat (§ 36 Abs. 3 VSBG) – gezählt werden Personen, nicht Vollzeitstellen.
  en: The information duty under § 36 VSBG applies to traders who run a website or use general terms and conditions. Exempt is anyone who employed ten or fewer people on 31 December of the previous year (§ 36(3) VSBG) – people are counted, not full-time positions.
- de: Die Pflicht zum Link auf die Online-Streitbeilegungsplattform der EU ist seit 20.07.2025 entfallen, die Plattform ist abgeschaltet. Steht der Link noch auf deiner Website, in AGB oder Impressum, entferne ihn.
  en: The obligation to link to the EU online dispute resolution platform has not applied since 20.07.2025, and the platform has been shut down. If the link is still on your website, in your terms and conditions or legal notice, remove it.
- de: Du hast eine Einstellung vereinbart.
  en: You have agreed to hire someone.
- de: Ein Datenschutzbeauftragter ist vorgesehen, wenn in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung personenbezogener Daten beschäftigt sind – unabhängig davon auch bei bestimmten Verarbeitungen, etwa umfangreicher Überwachung oder Gesundheitsdaten als Kerntätigkeit.
  en: A data protection officer is required if usually at least 20 people are constantly engaged in the automated processing of personal data – and regardless of that for certain processing, such as extensive monitoring or health data as a core activity.
- de: Ein Reisegewerbe betreibt, wer außerhalb seiner gewerblichen Niederlassung oder ohne eine solche Waren oder Leistungen anbietet, ohne vorher bestellt worden zu sein. Dafür brauchst du eine Reisegewerbekarte vom Gewerbeamt (§ 55 GewO). Sie muss vor dem Start vorliegen. Plane genug Vorlauf ein – für den Antrag brauchst du in der Regel ein Führungszeugnis und eine Auskunft aus dem Gewerbezentralregister, die du selbst erst beantragen musst. Für Märkte, Messen und Volksfeste, die die Gemeinde festgesetzt hat, gelten Ausnahmen (Titel IV GewO) – ob die Karte trotzdem nötig ist, klärt das Gewerbeamt. Für bestimmte Tätigkeiten ohne Karte gilt stattdessen eine Anzeigepflicht (§ 55c GewO).
  en: An itinerant trade is carried on by anyone who offers goods or services outside their business premises, or without any, without having been ordered beforehand. For this you need an itinerant trade card from the trade office (§ 55 GewO). It must be available before you start. Allow enough lead time – for the application you usually need a certificate of good conduct and an extract from the central trade register, which you must apply for yourself first. Exemptions apply to markets, fairs and festivals set by the municipality (Title IV GewO) – the trade office will clarify whether you still need the card. For certain activities without a card, a notification duty applies instead (§ 55c GewO).
- de: Elektronische Kassen brauchen eine technische Sicherheitseinrichtung (TSE), und zu jedem Verkauf ist ein Beleg auszugeben.
  en: Electronic cash registers need a technical security device (TSE), and a receipt must be issued for every sale.
- de: Erlaubnispflichtig sind unter anderem Makler, Bewachung, Versicherungs- und Finanzanlagenvermittlung (§§ 30–34i GewO). Für Gaststätten kommt es auf das Land an – nach dem Gaststättengesetz des Bundes braucht nur der Ausschank alkoholischer Getränke eine Erlaubnis (§ 2 GastG), manche Länder verlangen statt einer Erlaubnis nur eine Anzeige. Für einzelne Feste gibt es eine vorübergehende Gestattung (§ 12 GastG). Was in deinem Land gilt, klärt das Gewerbeamt. Die Erlaubnis muss vor Aufnahme der Tätigkeit vorliegen. Die Reisegewerbekarte ist eine eigene Pflicht.
  en: Permits are required among others for brokers, security services, insurance and financial investment intermediaries (§§ 30–34i GewO). For restaurants it depends on the federal state – under the federal Restaurants Act only serving alcoholic drinks needs a permit (§ 2 GastG); some states only require a notification instead of a permit. For single events there is a temporary permit (§ 12 GastG). The trade office will clarify what applies in your state. The permit must be available before the activity starts. The itinerant trade card is a separate obligation.
- de: Fehlen Kündigungsbutton oder Bestätigungsseite, können Verbraucher jederzeit und ohne Kündigungsfrist kündigen (§ 312k Abs. 6 BGB).
  en: If the cancellation button or the confirmation page is missing, consumers can cancel at any time without notice (§ 312k(6) BGB).
- de: Für den Verkauf ohne feste Niederlassung oder ohne vorherige Bestellung – etwa auf Märkten oder von Ort zu Ort – ist vor dem Start in der Regel eine Reisegewerbekarte vorgesehen. Ob du sie brauchst, klärt das Gewerbeamt.
  en: For selling without a fixed establishment or without prior order – for example at markets or from place to place – an itinerant trade card is usually required before you start. The trade office will clarify whether you need one.
- de: Für manche Gewerbe ist eine Erlaubnis vorgesehen, bevor du anfängst – zum Beispiel für Makler, das Bewachungsgewerbe oder den Ausschank von Alkohol. Ob sie für dich gilt, klärt das Gewerbeamt.
  en: Some trades require a permit before you start – for example brokers, security services or serving alcohol. The trade office will clarify whether this applies to you.
- de: Für verspätet gezahlte Beiträge fällt je angefangenen Monat ein Säumniszuschlag von 1 % des rückständigen Betrags an (§ 24 Abs. 1 SGB IV); wer Beiträge vorenthält, macht sich strafbar (§ 266a StGB).
  en: For contributions paid late, a late-payment surcharge of 1% of the amount in arrears is due for each month or part of a month (§ 24(1) SGB IV); withholding contributions is a criminal offence (§ 266a StGB).
- de: Ist der Bestellbutton nicht richtig beschriftet, kommt der Vertrag nicht zustande (§ 312j Abs. 4 BGB).
  en: If the order button is not labelled correctly, the contract is not concluded (§ 312j(4) BGB).
- de: KI-Kompetenz der Beschäftigten fördern
  en: Promote AI literacy of employees
- de: 'Keine Pflicht, sondern ein Blick voraus: Geplant ist, Gründungen digital und deutlich schneller zu ermöglichen.'
  en: 'Not an obligation but a look ahead: the plan is to make founding a business digital and much faster.'
- de: Nach deinen Angaben ist deine Kerntätigkeit eine umfangreiche Überwachung oder Verarbeitung besonderer Daten, oder eine Verarbeitung braucht eine Datenschutz-Folgenabschätzung bzw. dient der Übermittlung oder Marktforschung.
  en: According to your answers, your core activity is extensive monitoring or processing of special categories of data, or a processing operation requires a data protection impact assessment or serves transfer or market research.
- de: Nach deinen Angaben kommt die doppelte Buchführung mit Jahresabschluss in Frage – für Kapitalgesellschaften immer, für andere je nach Rechtsform und Größe.
  en: According to your answers, double-entry bookkeeping with annual financial statements may apply – always for corporations, for others depending on legal form and size.
- de: Nach deinen Angaben liegt dein Umsatz in diesem Jahr über 25.000 €. Nach § 19 UStG gilt die Kleinunternehmerregelung dann bis zum Jahresende weiter, ab 1. Januar des nächsten Jahres ist die Regelbesteuerung vorgesehen.
  en: According to your answers, your revenue this year is above €25,000. Under § 19 UStG the small business scheme then continues until the end of the year; from 1 January of the next year standard taxation is provided for.
- de: Ohne Belehrung kann der Kunde bis zu 12 Monate und 14 Tage widerrufen und muss für erbrachte Leistungen in der Regel keinen Wertersatz zahlen (§ 356 Abs. 3, 4, § 357a Abs. 2 BGB).
  en: Without information on the right of withdrawal, the customer can withdraw for up to 12 months and 14 days and as a rule does not have to pay compensation for services already provided (§ 356(3), (4), § 357a(2) BGB).
- de: Ohne ordnungsgemäße Belehrung beginnt die Widerrufsfrist nicht; das Widerrufsrecht erlischt dann erst spätestens 12 Monate und 14 Tage nach Vertragsschluss bzw. Erhalt der Ware (§ 356 Abs. 3, 4 BGB).
  en: Without proper information the withdrawal period does not start; the right of withdrawal then only expires 12 months and 14 days after conclusion of the contract or receipt of the goods at the latest (§ 356(3), (4) BGB).
- de: 'Seit 19.6.2026 brauchen B2C-Online-Verträge mit Widerrufsrecht eine Widerrufsfunktion ohne Login: eine Schaltfläche „Vertrag widerrufen“, danach eine Bestätigung „Widerruf bestätigen“ und eine Eingangsbestätigung auf einem dauerhaften Datenträger, etwa per E-Mail.'
  en: 'Since 19.6.2026, B2C online contracts with a right of withdrawal need a withdrawal function without login: a button "Vertrag widerrufen" (withdraw from contract), then a confirmation "Widerruf bestätigen" (confirm withdrawal) and an acknowledgement of receipt on a durable medium, for example by email.'
- de: Seit 2025 müssen Unternehmen elektronische Rechnungen (XRechnung, ZUGFeRD) von anderen Unternehmen empfangen können.
  en: Since 2025, businesses must be able to receive electronic invoices (XRechnung, ZUGFeRD) from other businesses.
- de: Seit 27.7.2026 verlangt Art. 4 KI-VO nur noch Maßnahmen zur Förderung der KI-Kompetenz (VO (EU) 2026/1744).
  en: Since 27.7.2026, Art. 4 of the AI Act only requires measures to promote AI literacy (Regulation (EU) 2026/1744).
- de: Wer KI-Systeme einsetzt, ergreift Maßnahmen, um die KI-Kompetenz der Beschäftigten zu fördern – zum Beispiel mit einer kurzen Schulung.
  en: Anyone using AI systems takes measures to promote the AI literacy of employees – for example with a short training.
- de: § 26a UStG nennt kein eigenes Bußgeld für die falsche Form. Eine Rechnung, die nicht als vorgeschriebene E-Rechnung ausgestellt wird, erfüllt § 14 UStG nicht – dein Kunde braucht eine solche Rechnung aber für den Vorsteuerabzug (§ 15 Abs. 1 Satz 1 Nr. 1 Satz 2 UStG). Wer eine Rechnung nicht oder nicht rechtzeitig ausstellt, riskiert ein Bußgeld bis 5.000 € (§ 26a Abs. 2 Nr. 1, Abs. 3 UStG).
  en: § 26a UStG provides no separate fine for the wrong format. An invoice that is not issued as a required e-invoice does not meet § 14 UStG – but your customer needs such an invoice for input tax deduction (§ 15(1) sentence 1 no. 1 sentence 2 UStG). Anyone who does not issue an invoice or does not issue it on time risks a fine of up to €5,000 (§ 26a(2) no. 1, (3) UStG).
- de: Du verarbeitest Gesundheitsdaten, überwachst per Video oder ortest Beschäftigte bzw. Fahrzeuge.
  en: You process health data, use video surveillance or locate employees or vehicles.
- de: OSS-Erklärung beim Bundeszentralamt für Steuern abgeben
  en: Submit the OSS return to the Federal Central Tax Office (Bundeszentralamt für Steuern)
- de: Du verkaufst an Privatpersonen.
  en: You sell to private individuals.
- de: Du verkaufst online, über einen Marktplatz, eine App oder im Abo.
  en: You sell online, via a marketplace, an app or by subscription.
- de: Bundeszentralamt für Steuern (BZStOnline-Portal)
  en: Federal Central Tax Office (Bundeszentralamt für Steuern, BZStOnline portal)
- de: Bei verspäteter Erklärung oder Zahlung erinnert das Bundeszentralamt bzw. der Bestimmungsstaat; Zuschläge und Zinsen richten sich nach dem Recht der Bestimmungsländer. Wer wiederholt gegen die Vorschriften des Verfahrens verstößt, kann davon ausgeschlossen werden und muss sich dann in jedem Bestimmungsland registrieren.
  en: If the return or payment is late, the Federal Central Tax Office or the Member State of consumption sends a reminder; surcharges and interest follow the law of the Member States of consumption. Anyone who repeatedly breaches the rules of the scheme can be excluded from it and must then register in each Member State of consumption.
- de: Rückverfolgbarkeit sicherstellen
  en: Ensure traceability
- de: Du kannst jederzeit sagen, von wem du Lebensmittel und Zutaten bekommen hast – und an welche Unternehmen du selbst lieferst. Geordnet aufbewahrte Lieferscheine und Rechnungen sind der einfachste Weg.
  en: You can say at any time from whom you received food and ingredients – and to which businesses you supply yourself. Keeping delivery notes and invoices in order is the simplest way.
- de: 'Lebensmittelunternehmer müssen jede Person feststellen können, von der sie ein Lebensmittel oder einen Stoff erhalten haben, der in ein Lebensmittel verarbeitet werden soll – eine Stufe zurück (Art. 18 Abs. 2 VO (EG) Nr. 178/2002). Ebenso müssen sie die anderen Unternehmen feststellen können, an die sie ihre Erzeugnisse geliefert haben – eine Stufe vor (Art. 18 Abs. 3). Gäste und Laufkundschaft gehören nicht dazu; wohl aber zum Beispiel ein Café, das du mit Kuchen belieferst, oder Firmen, für die du ein Catering machst. Die Angaben teilst du der Lebensmittelüberwachung auf Aufforderung mit. In der Praxis heißt das: Lieferant, Ware, Menge und Datum aus Lieferschein oder Rechnung geordnet aufbewahren, bei Lieferungen an andere Betriebe ebenso Abnehmer, Ware und Datum. Für Lebensmittel tierischen Ursprungs gibt es zusätzliche Vorgaben (Durchführungsverordnung (EU) Nr. 931/2011). Bei Verdacht auf unsichere Ware: Ware sperren, Lebensmittelüberwachung informieren (Art. 19 VO (EG) Nr. 178/2002).'
  en: 'Food business operators must be able to identify any person from whom they have received a food or a substance intended to be incorporated into a food – one step back (Art. 18(2) Regulation (EC) No 178/2002). They must also be able to identify the other businesses to which they have supplied their products – one step forward (Art. 18(3)). Guests and walk-in customers do not count; but, for example, a café you supply with cakes or companies you cater for do. You provide this information to the food control authority on request. In practice: keep supplier, goods, quantity and date from the delivery note or invoice in order, and for deliveries to other businesses likewise the customer, goods and date. Food of animal origin is subject to additional requirements (Implementing Regulation (EU) No 931/2011). If you suspect goods are unsafe: block the goods and inform the food control authority (Art. 19 Regulation (EC) No 178/2002).'
- de: 'Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): gilt jetzt auch für Onlinehändler mit Lebensmitteln; dazu, was du bei Verdacht auf unsichere Ware tust.'
  en: 'After the food hygiene expert review (22.10.2026): now also applies to online retailers selling food; plus what to do if you suspect goods are unsafe.'
- de: Wassertank im Foodtruck beim Gesundheitsamt anzeigen
  en: Notify the public health office of the water tank in your food truck
- de: "Hat dein Foodtruck oder Verkaufsstand einen eigenen Wassertank, zeigst du die Inbetriebnahme spätestens vier Wochen vorher beim Gesundheitsamt an und hältst das Wasser hygienisch einwandfrei. Auch die Wiederinbetriebnahme, z. B. nach der Winterpause, zeigst du vier Wochen vorher an, die Stilllegung innerhalb von drei Tagen danach (§ 11 Abs. 2 TrinkwV)."
  en: "If your food truck or sales stand has its own water tank, you notify the public health office of commissioning at least four weeks in advance and keep the water hygienically safe. You also notify recommissioning, e.g. after the winter break, four weeks in advance, and decommissioning within three days afterwards (§ 11(2) TrinkwV)."
- de: 'Ein Wassertank mit Leitungen in einem Fahrzeug oder Verkaufsstand ist eine mobile Wasserversorgungsanlage (§ 2 Nr. 2 Buchst. d TrinkwV). Wasser, das du in deinem Lebensmittelbetrieb für Lebensmittel oder zur Reinigung verwendest, ist Trinkwasser (§ 2 Nr. 1 Buchst. b TrinkwV) – auch wenn du es nur zum Zubereiten und Händewaschen nimmst. Wer daraus im Rahmen einer gewerblichen Tätigkeit Trinkwasser bereitstellt, zeigt dem Gesundheitsamt die Inbetriebnahme und Wiederinbetriebnahme sowie wesentliche bauliche oder betriebstechnische Veränderungen spätestens vier Wochen vorher an, die Stilllegung innerhalb von drei Tagen (§ 11 Abs. 2 TrinkwV). Schließt du dich am Standplatz nur zeitweise an eine Wasserleitung an (z. B. Standrohr des Veranstalters), gilt das als zeitweilige Wasserversorgungsanlage (§ 2 Nr. 2 Buchst. f TrinkwV) – frag beim Gesundheitsamt bzw. Veranstalter nach den Regeln. Gesundheitsämter verlangen in ihren Merkblättern unter anderem Schläuche und Materialien, die für Trinkwasser geeignet sind, und regelmäßige Reinigung. Untersuchung nach Vorgabe des Gesundheitsamts, üblich einmal jährlich: Umfang und Häufigkeit legt das Gesundheitsamt fest, untersuchen lässt du das Wasser von einer zugelassenen Untersuchungsstelle. Unabhängig davon brauchst du nach dem Lebensmittelhygienerecht genug Trinkwasser für Lebensmittel und zum Händewaschen (Anhang II Kapitel III und VII VO (EG) Nr. 852/2004). Die Frist richtet sich nach dem Tag, an dem du den Tank in Betrieb nimmst.'
  en: 'A water tank with pipes in a vehicle or sales stand is a mobile water supply system (§ 2 No. 2(d) TrinkwV, Drinking Water Ordinance). Water that you use in your food business for food or for cleaning is drinking water (§ 2 No. 1(b) TrinkwV) – even if you only use it for preparing food and washing hands. Anyone who provides drinking water from it as part of a commercial activity notifies the public health office of commissioning and recommissioning as well as significant structural or operational changes at least four weeks in advance, and of decommissioning within three days (§ 11(2) TrinkwV). If you only connect temporarily to a water pipe at your pitch (e.g. the organiser''s standpipe), this counts as a temporary water supply system (§ 2 No. 2(f) TrinkwV) – ask the public health office or the organiser about the rules. In their information sheets, public health offices require among other things hoses and materials suitable for drinking water, and regular cleaning. Testing as specified by the public health office, usually once a year: the public health office decides on scope and frequency, and you have the water tested by an approved testing laboratory. Independently of this, food hygiene law requires enough drinking water for food and for washing hands (Annex II Chapters III and VII Regulation (EC) No 852/2004). The deadline depends on the day you start using the tank.'
- de: Gesundheitsamt des Kreises bzw. der Stadt
  en: Public health office (Gesundheitsamt) of the district or city
- de: 'Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Der Check fragt jetzt, ob du einen eigenen Wassertank hast, und die Frist richtet sich nach dessen Inbetriebnahme statt nach dem Start deines Betriebs.'
  en: 'After the food hygiene expert review (22.10.2026): the check now asks whether you have your own water tank, and the deadline depends on when you start using it instead of when your business starts.'
- de: Acrylamid beim Backen und Frittieren gering halten
  en: Keep acrylamide low when baking and frying
- de: Backst du Brot oder Backwaren oder frittierst du zum Beispiel Pommes frites, hältst du mit einfachen Maßnahmen Acrylamid gering.
  en: If you bake bread or bakery products or fry, for example, French fries, you keep acrylamide low with simple measures.
- de: Dein Fahrzeug oder Stand hat einen eigenen Wassertank.
  en: Your vehicle or stall has its own water tank.
- de: Du handelst online.
  en: You sell online.
- de: Du selbst; Konformitätserklärung vom Lieferanten
  en: You yourself; declaration of conformity from the supplier
- de: Du verkaufst Lebensmittel.
  en: You sell food.
- de: Du verkaufst selbst abgepackte Lebensmittel.
  en: You sell food that you package yourself.
- de: Für Verpackungen, Kunststoffbehälter und andere Materialien, die mit Lebensmitteln in Berührung kommen, forderst du die Konformitätserklärung vom Lieferanten an und legst sie ab.
  en: For packaging, plastic containers and other materials that come into contact with food, you request the declaration of conformity from the supplier and file it.
- de: "Für vorverpackte Lebensmittel schreibt Art. 9 LMIV vor, was auf der Packung stehen muss. Dazu gehören unter anderem die Bezeichnung, das Zutatenverzeichnis, die Allergene – im Zutatenverzeichnis hervorgehoben, zum Beispiel fett –, die Nettofüllmenge, das Mindesthaltbarkeits- oder Verbrauchsdatum, Name und Anschrift deines Betriebs und die Nährwertdeklaration. Handwerklich hergestellte Lebensmittel, die du in kleinen Mengen direkt an Endverbraucher oder an Geschäfte vor Ort abgibst, brauchen keine Nährwertdeklaration (Anhang V Nr. 19 LMIV). Die übrigen Angaben brauchen sie trotzdem. Wichtig ist die Abgrenzung: Ware, die du im eigenen Laden für den Verkauf am selben Tag abpackst (z. B. Brot in Tüten, Kekse in Beuteln an der Theke) oder die du auf Wunsch der Kundschaft verpackst, gilt als lose Ware (Art. 44 Abs. 1 LMIV). Dafür reicht die Allergen- und Zusatzstoffinformation wie bei loser Ware. Legst du solche Ware allerdings zur Selbstbedienung aus, brauchst du die Pflichtangaben bis auf Nettofüllmenge und Nährwertdeklaration (§ 4 Abs. 1 LMIDV) – außer bei Dauerbackwaren und Süßwaren, die du im Laden abpackst, wenn du die Kundschaft auf andere Weise informierst. Die volle Kennzeichnung nach Art. 9 LMIV braucht Ware mit längerer Haltbarkeit (Marmelade, Granola, Kekse im Regal über Tage), Ware für andere Händler und Ware für den Onlineversand."
  en: "For prepacked food, Art. 9 LMIV (Food Information Regulation) specifies what must be on the package. This includes, among other things, the name of the food, the list of ingredients, the allergens – emphasised in the list of ingredients, for example in bold –, the net quantity, the best-before or use-by date, the name and address of your business and the nutrition declaration. Handmade food that you supply in small quantities directly to end consumers or to local shops does not need a nutrition declaration (Annex V No. 19 LMIV). It still needs the other information. The distinction matters: food that you pack in your own shop for sale on the same day (e.g. bread in bags, biscuits in bags at the counter) or that you pack at the customer's request counts as non-prepacked food (Art. 44(1) LMIV). For this, the allergen and additive information as for non-prepacked food is enough. However, if you display such food for self-service, you need the mandatory information except the net quantity and the nutrition declaration (§ 4(1) LMIDV) – except for long-life bakery products and confectionery that you pack in the shop, if you inform customers in another way. Full labelling under Art. 9 LMIV is needed for food with a longer shelf life (jam, granola, biscuits on the shelf for days), food for other retailers and food for online shipping."
- de: Konformitätserklärungen für Verpackungen und Behälter ablegen
  en: File declarations of conformity for packaging and containers
- de: Materialien und Gegenstände, die mit Lebensmitteln in Berührung kommen – zum Beispiel Verpackungen, To-go-Becher, Frischhaltedosen oder Kunststoffbehälter –, müssen dafür geeignet sein (Verordnung (EG) Nr. 1935/2004). Für Kunststoff gelten zusätzlich die Vorgaben der Verordnung (EU) Nr. 10/2011. Dein Lieferant gibt dir dazu eine schriftliche Konformitätserklärung (Art. 16 VO (EG) Nr. 1935/2004, Art. 15 VO (EU) Nr. 10/2011). Fordere sie vom Lieferanten an und lege sie ab – die Lebensmittelüberwachung fragt bei Kontrollen danach.
  en: Materials and articles that come into contact with food – for example packaging, to-go cups, food storage boxes or plastic containers – must be suitable for this (Regulation (EC) No 1935/2004). For plastics, the requirements of Regulation (EU) No 10/2011 also apply. Your supplier gives you a written declaration of conformity for this (Art. 16 Regulation (EC) No 1935/2004, Art. 15 Regulation (EU) No 10/2011). Request it from the supplier and file it – food control asks for it during inspections.
- de: Selbst abgepackte Lebensmittel kennzeichnen
  en: Label food that you package yourself
- de: "Stellst du selbst abgepackte Lebensmittel ins Regal oder verschickst du sie – etwa Kekse, Marmelade oder Granola –, gehören die Pflichtangaben auf die Packung."
  en: "If you put food you have packaged yourself on the shelf or ship it – such as biscuits, jam or granola –, the mandatory information belongs on the package."
- de: 'Bußgeld bis 5.000 €, wenn du eine Pflichtvorsorge nicht oder nicht rechtzeitig veranlasst, eine Tätigkeit ohne die vorgeschriebene Pflichtvorsorge ausüben lässt, die Vorsorgekartei nicht, nicht richtig oder nicht vollständig führst oder eine Angebotsvorsorge nicht oder nicht rechtzeitig anbietest (§ 10 Abs. 1 ArbMedVV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG).'
  en: 'Fine of up to €5,000 if you do not arrange a mandatory check-up (Pflichtvorsorge) or arrange it late, allow an activity without the required mandatory check-up, do not keep the check-up record (Vorsorgekartei) or keep it incorrectly or incompletely, or do not offer an offered check-up (Angebotsvorsorge) or offer it late (§ 10(1) ArbMedVV in conjunction with § 25(1) no. 1, (2) ArbSchG).'
- de: 'Kein eigenes Bußgeld vorgesehen. Die Aufsichtsbehörde kann die Benennung und Ausbildung im Einzelfall anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
  en: 'No separate fine is provided. The supervisory authority can order the appointment and training in the individual case; breaching the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG).'
- de: 'Bußgeld bis 10.000 €, wenn Fahrzeuge nicht wie vorgeschrieben geprüft werden (§ 58 in Verbindung mit § 57 DGUV Vorschrift 70, § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII).'
  en: 'Fine of up to €10,000 if vehicles are not inspected as required (§ 58 in conjunction with § 57 DGUV Vorschrift 70, § 209(1) no. 1, (3) SGB VII).'
- de: 'Für den Plan und die Übungen ist kein eigenes Bußgeld vorgesehen; bußgeldbewehrt ist, Verkehrswege, Fluchtwege und Notausgänge nicht freizuhalten (bis 5.000 €, § 9 Abs. 1 ArbStättV in Verbindung mit § 4 Abs. 4 Satz 1 ArbStättV und § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Die Aufsichtsbehörde kann den Plan im Einzelfall anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
  en: 'No separate fine is provided for the plan and the drills; failing to keep traffic routes, escape routes and emergency exits clear is subject to a fine (up to €5,000, § 9(1) ArbStättV in conjunction with § 4(4) sentence 1 ArbStättV and § 25(1) no. 1, (2) ArbSchG). The supervisory authority can order the plan in the individual case; breaching the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG).'
- de: 'Kein eigenes Bußgeld vorgesehen. Die Aufsichtsbehörde kann die Zusammenarbeit und Abstimmung im Einzelfall anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
  en: 'No separate fine is provided. The supervisory authority can order the cooperation and coordination in the individual case; breaching the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG).'
- de: 'Bußgeld bis 10.000 €, wenn du entgegen § 22 Abs. 1 Satz 1, 3 oder 4 SGB VII keinen Sicherheitsbeauftragten bestellst (§ 209 Abs. 1 Nr. 3a, Abs. 3 SGB VII).'
  en: 'Fine of up to €10,000 if you do not appoint a safety officer contrary to § 22(1) sentence 1, 3 or 4 SGB VII (§ 209(1) no. 3a, (3) SGB VII).'
- de: 'Bußgeld bis 5.000 €, wenn du Jugendliche nicht, nicht richtig oder nicht rechtzeitig über die Gefahren unterweist (§ 59 Abs. 1 Nr. 3, Abs. 3 JArbSchG).'
  en: 'Fine of up to €5,000 if you do not instruct young people about the hazards, or do so incorrectly or late (§ 59(1) no. 3, (3) JArbSchG).'
- de: 'Die Wiederholung nach § 12 ArbSchG und § 4 Abs. 1 DGUV Vorschrift 1 ist nicht unmittelbar bußgeldbewehrt. Die Aufsichtsbehörde kann die Unterweisung im Einzelfall anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG). Für Unterweisungen nach besonderen Verordnungen, etwa bei Gefahrstoffen, gelten eigene Bußgeldvorschriften.'
  en: 'Repeating the instruction under § 12 ArbSchG and § 4(1) DGUV Vorschrift 1 is not directly subject to a fine. The supervisory authority can order the instruction in the individual case; breaching the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG). Instruction under special regulations, for example for hazardous substances, has its own fine provisions.'
- de: 'Bußgeld bis 10 Mio. € oder bei Unternehmen bis 2 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, bei Verstößen gegen die Pflichten nach Art. 28 DSGVO (Art. 83 Abs. 4 Buchst. a DSGVO).'
  en: 'Fine up to €10 million or, for undertakings, up to 2% of the worldwide annual turnover of the preceding year, whichever is higher, for breaches of the obligations under Art. 28 GDPR (Art. 83(4)(a) GDPR).'
- de: 'Bußgeld bis 20 Mio. € oder bei Unternehmen bis 4 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, wenn Daten ohne Rechtsgrundlage oder entgegen den Grundsätzen der Verarbeitung verarbeitet werden (Art. 83 Abs. 5 Buchst. a DSGVO in Verbindung mit Art. 5, 6 DSGVO).'
  en: 'Fine of up to €20 million or, for undertakings, up to 4% of the worldwide annual turnover of the preceding year, whichever is higher, if data are processed without a legal basis or contrary to the principles of processing (Art. 83(5)(a) GDPR in conjunction with Art. 5, 6 GDPR).'
- de: 'Bußgeld bis 20 Mio. € oder bei Unternehmen bis 4 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, bei Verstößen gegen den Grundsatz der Speicherbegrenzung oder gegen das Recht auf Löschung (Art. 83 Abs. 5 Buchst. a, b DSGVO in Verbindung mit Art. 5 Abs. 1 Buchst. e, Art. 17 DSGVO).'
  en: 'Fine of up to €20 million or, for undertakings, up to 4% of the worldwide annual turnover of the preceding year, whichever is higher, for breaches of the storage limitation principle or of the right to erasure (Art. 83(5)(a), (b) GDPR in conjunction with Art. 5(1)(e), Art. 17 GDPR).'
- de: 'Bußgeld bis 20 Mio. € oder bei Unternehmen bis 4 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, bei Verstößen gegen die Grundsätze der Verarbeitung, die Rechtsgrundlage oder die Informationspflicht (Art. 83 Abs. 5 Buchst. a, b DSGVO in Verbindung mit Art. 5, 6, 13 DSGVO); bis 10 Mio. € oder bei Unternehmen bis 2 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, bei Verstößen gegen Art. 28 DSGVO (Art. 83 Abs. 4 Buchst. a DSGVO).'
  en: 'Fine of up to €20 million or, for undertakings, up to 4% of the worldwide annual turnover of the preceding year, whichever is higher, for breaches of the principles of processing, the legal basis or the duty to inform (Art. 83(5)(a), (b) GDPR in conjunction with Art. 5, 6, 13 GDPR); up to €10 million or, for undertakings, up to 2% of the worldwide annual turnover of the preceding year, whichever is higher, for breaches of Art. 28 GDPR (Art. 83(4)(a) GDPR).'
- de: 'Bußgeld bis 20 Mio. € oder bei Unternehmen bis 4 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, wenn ohne Rechtsgrundlage überwacht wird oder die vorgeschriebenen Informationen fehlen (Art. 83 Abs. 5 Buchst. a, b DSGVO in Verbindung mit Art. 6, 13 DSGVO).'
  en: 'Fine of up to €20 million or, for undertakings, up to 4% of the worldwide annual turnover of the preceding year, whichever is higher, if surveillance takes place without a legal basis or the required information is missing (Art. 83(5)(a), (b) GDPR in conjunction with Art. 6, 13 GDPR).'
- de: 'Bußgeld bis 30.000 €, wenn die Aufzeichnungen nach § 16 Abs. 2 ArbZG nicht oder nicht richtig erstellt oder nicht für die vorgeschriebene Dauer aufbewahrt werden (§ 22 Abs. 1 Nr. 9, Abs. 2 ArbZG). Für die allgemeine Erfassungspflicht nach § 3 Abs. 2 Nr. 1 ArbSchG ist kein eigenes Bußgeld vorgesehen.'
  en: 'Fine of up to €30,000 if the records under § 16(2) ArbZG are not kept or not kept correctly, or are not retained for the required period (§ 22(1) no. 9, (2) ArbZG). No separate fine is provided for the general recording obligation under § 3(2) no. 1 ArbSchG.'
- de: 'Bußgeld bis 1.000 €, wenn du den Hinweis nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig gibst, ihn nicht für die vorgeschriebene Dauer aufbewahrst oder nicht vorlegst (§ 8 Abs. 2 Nr. 2, Abs. 5 SchwarzArbG). Wer bei der Arbeit seinen Ausweis nicht mitführt oder nicht vorlegt, riskiert bis 5.000 € (§ 8 Abs. 2 Nr. 1, Abs. 5 SchwarzArbG).'
  en: 'Fine of up to €1,000 if you do not give the notice, or give it incorrectly, incompletely, not in the prescribed manner or late, do not retain it for the required period or do not present it (§ 8(2) no. 2, (5) SchwarzArbG). Anyone who does not carry or present their ID at work risks up to €5,000 (§ 8(2) no. 1, (5) SchwarzArbG).'
- de: 'Bußgeld bis 1.000 €, wenn du die Eintragung nicht, nicht richtig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig beantragst (§ 101 Abs. 1 Nr. 9, Abs. 2 BBiG).'
  en: 'Fine of up to €1,000 if you do not apply for registration, or apply incorrectly, not in the prescribed manner or late (§ 101(1) no. 9, (2) BBiG).'
- de: 'Kein eigenes Bußgeld vorgesehen (§ 111 SGB IV nennt § 28f Abs. 3 nicht). Liegt der Beitragsnachweis nicht zwei Arbeitstage vor Fälligkeit vor, kann die Einzugsstelle das Arbeitsentgelt schätzen, bis der Nachweis ordnungsgemäß übermittelt ist (§ 28f Abs. 3 Satz 2 SGB IV).'
  en: 'No separate fine is provided (§ 111 SGB IV does not mention § 28f(3)). If the contribution statement is not received two working days before the due date, the collecting agency can estimate the earnings until the statement is properly submitted (§ 28f(3) sentence 2 SGB IV).'
- de: 'Für den Antrag selbst ist kein eigenes Bußgeld vorgesehen; bußgeldbewehrt ist, Änderungen oder die Einstellung des Betriebs nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig mitzuteilen (bis 5.000 €, § 111 Abs. 1 Nr. 1a, Abs. 4 SGB IV in Verbindung mit § 18i Abs. 4 SGB IV). Ohne Betriebsnummer kannst du nicht an den Meldeverfahren zur Sozialversicherung teilnehmen (§ 18i Abs. 1 SGB IV).'
  en: 'No separate fine is provided for the application itself; failing to report changes or the closure of the business, or reporting them incorrectly, incompletely, not in the prescribed manner or late, is subject to a fine (up to €5,000, § 111(1) no. 1a, (4) SGB IV in conjunction with § 18i(4) SGB IV). Without an establishment number you cannot take part in the social insurance reporting procedures (§ 18i(1) SGB IV).'
- de: 'Bußgeld bis 3.000 €, wenn du eine Person mit Bewachungsaufgaben betraust, ohne das Anmeldeverfahren über das Bewacherregister einzuhalten und die Mitteilung der Behörde erhalten zu haben (§ 22 Abs. 1 Nr. 1 in Verbindung mit § 16 Abs. 1 BewachV, § 144 Abs. 2 Nr. 1b, Abs. 4 GewO).'
  en: 'Fine of up to €3,000 if you entrust a person with security tasks without following the registration procedure via the security register (Bewacherregister) and receiving the authority''s notification (§ 22(1) no. 1 in conjunction with § 16(1) BewachV, § 144(2) no. 1b, (4) GewO).'
- de: 'Gibst du die Lohnsteuer-Anmeldung nicht oder nicht fristgerecht ab, kann das Finanzamt einen Verspätungszuschlag festsetzen. Er richtet sich nach Dauer und Häufigkeit der Fristüberschreitung und der Höhe der Steuer und beträgt höchstens 25.000 € (§ 152 Abs. 1, 8, 10 AO).'
  en: 'If you do not file the wage tax return (Lohnsteuer-Anmeldung) or file it late, the tax office can impose a late filing surcharge. It depends on the length and frequency of the delay and the amount of tax and is at most €25,000 (§ 152(1), (8), (10) AO).'
- de: 'Übersteigt das Arbeitsentgelt regelmäßig die Geringfügigkeitsgrenze, ist die Beschäftigung nicht mehr geringfügig (§ 8 Abs. 1 Nr. 1 SGB IV); dann gelten die allgemeinen Regeln der Sozialversicherung. Unschädlich ist nur ein unvorhersehbares Überschreiten in höchstens zwei Kalendermonaten innerhalb eines Zeitjahres um höchstens den Betrag der Geringfügigkeitsgrenze (§ 8 Abs. 1b SGB IV).'
  en: 'If earnings regularly exceed the marginal employment threshold, the job is no longer marginal employment (§ 8(1) no. 1 SGB IV); the general social insurance rules then apply. Only an unforeseeable excess in no more than two calendar months within a year, by no more than the amount of the threshold, is harmless (§ 8(1b) SGB IV).'
- de: 'Bußgeld bis 5.000 €, wenn du die Gefährdungsbeurteilung nicht, nicht richtig oder nicht rechtzeitig durchführst oder die erforderlichen Schutzmaßnahmen nicht, nicht richtig oder nicht rechtzeitig festlegst (§ 32 Abs. 1 Nr. 6, 7, Abs. 2 MuSchG); lässt du eine Frau eine nach § 10 Abs. 3 MuSchG unzulässige Tätigkeit ausüben, bis 30.000 € (§ 32 Abs. 1 Nr. 8, Abs. 2 MuSchG).'
  en: 'Fine of up to €5,000 if you do not carry out the risk assessment, or carry it out incorrectly or late, or do not lay down the necessary protective measures, or do so incorrectly or late (§ 32(1) no. 6, 7, (2) MuSchG); if you let a woman carry out an activity that is not permitted under § 10(3) MuSchG, up to €30,000 (§ 32(1) no. 8, (2) MuSchG).'
- de: 'Für Untersuchung und Ausgleich ist kein eigenes Bußgeld vorgesehen (§ 22 ArbZG nennt § 6 Abs. 3 und 5 nicht). Wer über die nach § 6 Abs. 2 ArbZG zulässige Arbeitszeit hinaus beschäftigt, riskiert ein Bußgeld bis 30.000 € (§ 22 Abs. 1 Nr. 1, Abs. 2 ArbZG).'
  en: 'No separate fine is provided for the medical examination and the compensation (§ 22 ArbZG does not mention § 6(3) and (5)). Anyone who employs night workers beyond the working time permitted under § 6(2) ArbZG risks a fine of up to €30,000 (§ 22(1) no. 1, (2) ArbZG).'
- de: 'Bußgeld bis 25.000 €, wenn die Meldung nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig erstattet wird (§ 111 Abs. 1 Nr. 2, Abs. 4 SGB IV).'
  en: 'Fine of up to €25,000 if the report is not made, or is made incorrectly, incompletely, not in the prescribed manner or late (§ 111(1) no. 2, (4) SGB IV).'
- de: "Acrylamid entsteht, wenn stärkehaltige Lebensmittel stark gebräunt werden – etwa Brot, feine Backwaren, Pommes frites und andere frittierte Kartoffelerzeugnisse. Betriebe, die solche Lebensmittel herstellen, wenden die Minimierungsmaßnahmen der Verordnung (EU) 2017/2158 an: Gibst du nur im eigenen Laden oder an örtliche Einzelhändler ab, gelten die Maßnahmen nach Anhang II Teil A (Art. 2 Abs. 2); die Maßnahmen nach Anhang II Teil B kommen nur für zentral gesteuerte Filial- und Franchisebetriebe hinzu (Art. 2 Abs. 3). Teil-A-Betriebe brauchen keine Probenahmen, müssen die Maßnahmen aber anwenden und auf Nachfrage zeigen können, z. B. Farbkarte für Pommes/Toast, Frittiertemperatur höchstens 175 °C, Backwaren goldgelb statt dunkelbraun. Backzeit und -temperatur hältst du nach Rezeptur ein. Die Lebensmittelüberwachung prüft das vor allem bei Bäckereien."
  en: "Acrylamide forms when starchy foods are strongly browned – such as bread, fine bakery wares, French fries and other fried potato products. Businesses that produce such foods apply the mitigation measures of Regulation (EU) 2017/2158: if you only supply your own shop or local retailers, the measures in Annex II Part A apply (Art. 2(2)); the measures in Annex II Part B are added only for centrally controlled branch and franchise businesses (Art. 2(3)). Part A businesses do not need to take samples, but they must apply the measures and be able to show them on request, e.g. a colour chart for fries/toast, frying temperature no higher than 175 °C, bakery products golden yellow instead of dark brown. You follow the baking time and temperature in the recipe. Food control checks this above all in bakeries."
- de: Anzeigen musst du einen Unfall, wenn die verletzte Person stirbt oder mehr als drei Tage arbeitsunfähig ist; den Unfalltag zählst du dabei nicht mit (§ 193 Abs. 1 SGB VII). Das gilt auch für Wegeunfälle
    auf dem Weg zur oder von der Arbeit. Die Anzeige erstattest du binnen drei Tagen, nachdem du vom Unfall erfahren hast (§ 193 Abs. 4 SGB VII), mit dem Formular nach der Unfallversicherungs-Anzeigeverordnung
    (UVAV), meist im Portal deiner BG. Tödliche Unfälle und Massenunfälle meldest du zusätzlich sofort telefonisch oder per E-Mail. Amtlos legt die Aufgabe bei jedem gemeldeten Arbeitsunfall an, weil die
    Dauer der Arbeitsunfähigkeit oft erst später feststeht, und rechnet ab dem Tag, den du beim Unfall einträgst – hast du später davon erfahren, trag diesen Tag ein. Bleibt die Arbeitsunfähigkeit bei höchstens
    drei Tagen, trifft die Anzeige nicht zu; den Eintrag ins Verbandbuch brauchst du trotzdem.
  en: You must report an accident if the injured person dies or is unable to work for more than three days; the day of the accident does not count (§ 193(1) SGB VII). This also applies to commuting accidents
    on the way to or from work. You file the report within three days of learning of the accident (§ 193(4) SGB VII), using the form under the Accident Insurance Notification Ordinance (UVAV), usually in
    your BG's portal. You additionally report fatal accidents and mass accidents immediately by phone or e-mail. Amtlos creates the task for every reported accident at work, because the length of the incapacity
    is often only known later, and counts from the day you enter for the accident – if you learned of it later, enter that day. If the incapacity lasts no more than three days, the report does not apply;
    you still need the entry in the first-aid log.
- de: 'Arbeitsmittel gibt es in fast jedem Betrieb: Leitern und Tritte, Lagerregale, Aufschnitt- und Knetmaschinen, Hebebühnen und Hubgeräte, Kompressoren, Druckluftgeräte und Getränkeschankanlagen. Arbeitsmittel,
    deren Sicherheit von der Montage abhängt, lässt du vor der ersten Verwendung prüfen; Arbeitsmittel, die schädigenden Einflüssen ausgesetzt sind, prüft eine zur Prüfung befähigte Person wiederkehrend
    (§ 14 BetrSichV). Art, Umfang und Abstände der Prüfungen legst du in der Gefährdungsbeurteilung fest (§ 3 Abs. 6 BetrSichV); die Ergebnisse zeichnest du auf und bewahrst sie auf (§ 14 Abs. 7 BetrSichV).
    Für Leitern und Tritte hilft die DGUV Information 208-016, für Lagerregale die DIN EN 15635 (Sichtkontrollen und jährliche Inspektion durch eine fachkundige Person). In Kfz-Werkstätten gehören Hebebühnen
    dazu: Sie werden vor der ersten Inbetriebnahme und danach in der Regel jährlich geprüft (DGUV Grundsatz 308-002). Für Druckbehälter wie den Druckluftbehälter eines Kompressors gelten besondere Prüfpflichten
    (§§ 15, 16 und Anhang 2 Abschnitt 4 BetrSichV): Bei Druckbehältern (z. B. Kompressor) klärst du Prüfpflichten und Prüfer mit einer zugelassenen Überwachungsstelle. Firmenfahrzeuge (DGUV Vorschrift 70)
    und elektrische Geräte (DGUV Vorschrift 3) haben eigene Pflichten.'
  en: 'Work equipment exists in almost every business: ladders and steps, storage racks, slicing and kneading machines, lifting platforms and hoists, compressors, compressed-air tools and beverage dispensing
    systems. Work equipment whose safety depends on its assembly is inspected before first use; work equipment exposed to damaging influences is inspected regularly by a person qualified to carry out inspections
    (§ 14 BetrSichV). You set the type, scope and intervals of the inspections in the risk assessment (§ 3(6) BetrSichV); you record and keep the results (§ 14(7) BetrSichV). For ladders and steps, DGUV
    Information 208-016 helps, for storage racks DIN EN 15635 (visual checks and an annual inspection by a competent person). In car repair shops, vehicle lifts are included: they are inspected before first
    commissioning and then usually every year (DGUV Principle 308-002). Special inspection obligations apply to pressure vessels such as the air receiver of a compressor (§§ 15, 16 and Annex 2 Section 4
    BetrSichV): for pressure vessels (e.g. compressor), you clarify the inspection obligations and the inspector with an approved inspection body. Company vehicles (DGUV Regulation 70) and electrical equipment
    (DGUV Regulation 3) have their own obligations.'
- de: Bei 2 bis 20 anwesenden Versicherten brauchst du mindestens einen Ersthelfer, bei mehr Anwesenden 5 Prozent in Verwaltungs- und Handelsbetrieben und 10 Prozent in sonstigen Betrieben (§ 26 Abs. 1
    DGUV Vorschrift 1). Ersthelfer werden bei einer von der BG ermächtigten Stelle ausgebildet und in der Regel alle zwei Jahre fortgebildet (§ 26 Abs. 2, 3 DGUV Vorschrift 1); die Kosten der Lehrgänge
    trägt meist die BG. Als Inhaberin oder Inhaber zählst du nur mit, wenn du selbst versichert bist – Amtlos zählt vorsichtshalber alle Anwesenden, also schon ab der ersten beschäftigten Person. Plane
    Vertretungen für Urlaub, Krankheit und Schichten ein. Verbandkasten, Notruf-Aushang und Verbandbuch sind eine eigene Pflicht, Brandschutzhelfer ebenfalls.
  en: With 2 to 20 insured persons present you need at least one first aider, with more people present 5 per cent in administrative and retail businesses and 10 per cent in other businesses (§ 26(1) DGUV
    Regulation 1). First aiders are trained at a body authorised by the BG and usually receive refresher training every two years (§ 26(2), (3) DGUV Regulation 1); the BG usually pays for the courses. As
    the owner you only count if you are insured yourself – to be on the safe side, Amtlos counts everyone present, so already from the first employee. Plan substitutes for holidays, illness and shifts.
    First-aid kit, emergency call notice and first-aid log are a separate obligation, as are fire safety assistants.
- de: Biostoffe sind Bakterien, Viren, Pilze und Parasiten – etwa bei der Behandlung von Patientinnen und Patienten, beim Umgang mit Blut, bei Kosmetik, Nagel- und Fußpflege oder bei der Reinigung von Sanitärräumen.
    Vor Aufnahme der Tätigkeit beurteilst du die Gefährdung fachkundig (§ 4 BioStoffV) und dokumentierst sie (§ 7 BioStoffV); überprüft wird mindestens alle zwei Jahre. Für jeden Arbeitsbereich schreibst
    du eine schriftliche Betriebsanweisung (§ 14 Abs. 1 BioStoffV) – nicht nötig nur bei Tätigkeiten ausschließlich mit Biostoffen der Risikogruppe 1 ohne sensibilisierende oder toxische Wirkung. Anhand
    der Betriebsanweisung unterweist du mündlich vor Aufnahme der Beschäftigung und danach mindestens jährlich (§ 14 Abs. 2 BioStoffV); Inhalt und Zeitpunkt hältst du schriftlich fest, die Unterwiesenen
    bestätigen durch Unterschrift (§ 14 Abs. 3 BioStoffV). Für Praxen gilt zusätzlich die TRBA 250; arbeitsmedizinische Vorsorge und Impfangebote sind Teil der Pflicht zur Vorsorge.
  en: Biological agents are bacteria, viruses, fungi and parasites – for example when treating patients, handling blood, in cosmetics, nail care and foot care or when cleaning sanitary rooms. Before the
    work begins, you assess the hazard with expert knowledge (§ 4 BioStoffV) and document it (§ 7 BioStoffV); it is reviewed at least every two years. For each work area you write operating instructions
    (§ 14(1) BioStoffV) – not needed only for work exclusively with biological agents of risk group 1 without sensitising or toxic effects. Based on the operating instructions, you instruct orally before
    employment begins and at least annually afterwards (§ 14(2) BioStoffV); you record the content and date in writing, and those instructed confirm by signature (§ 14(3) BioStoffV). For medical practices,
    TRBA 250 also applies; occupational health care and vaccination offers are part of the obligation on preventive care.
- de: Bußgeld bis 10.000 €, wenn Fahrzeuge von Personen geführt werden, die nicht mindestens 18 Jahre alt, nicht unterwiesen oder nicht vom Unternehmer bestimmt sind (§ 58 in Verbindung mit § 35 Abs. 1
    DGUV Vorschrift 70, § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII). Mangelhafte Ladungssicherung ist eine Ordnungswidrigkeit nach der StVO (§ 22 in Verbindung mit § 49 StVO, Bußgeldkatalog) – für Fahrer, Verlader
    und Halter.
  en: Fine of up to €10,000 if vehicles are driven by persons who are not at least 18 years old, not instructed or not designated by the employer (§ 58 in conjunction with § 35(1) DGUV Regulation 70, §
    209(1) no. 1, (3) SGB VII). Inadequate load securing is an administrative offence under the StVO (§ 22 in conjunction with § 49 StVO, fine catalogue) – for drivers, loaders and vehicle keepers.
- de: Bußgeld bis 5.000 €, wenn Sicherheitseinrichtungen wie Feuerlöscher nicht regelmäßig gewartet und auf ihre Funktionsfähigkeit geprüft werden (§ 9 Abs. 1 ArbStättV in Verbindung mit § 4 Abs. 3 ArbStättV
    und § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Fehlen geeignete Feuerlöscher, kann die Aufsichtsbehörde Maßnahmen anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3, §
    25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).
  en: Fine of up to €5,000 if safety equipment such as fire extinguishers is not regularly maintained and checked for proper functioning (§ 9(1) ArbStättV in conjunction with § 4(3) ArbStättV and § 25(1)
    no. 1, (2) ArbSchG). If suitable fire extinguishers are missing, the supervisory authority can order measures; a breach of the enforceable order costs up to €30,000 (§ 22(3), § 25(1) no. 2 letter a,
    (2) ArbSchG).
- de: Bußgeld bis 5.000 €, wenn die Gefährdung nicht beurteilt oder dokumentiert ist, die Betriebsanweisung fehlt oder nicht unterwiesen wird (§ 20 Abs. 1 Nr. 1 bis 4, 22, 23 BioStoffV in Verbindung mit
    § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Die schriftliche Dokumentation der Unterweisung selbst ist nicht bußgeldbewehrt, nur die fehlende Unterweisung (§ 14 Abs. 2 Satz 1 BioStoffV).
  en: Fine of up to €5,000 if the hazard is not assessed or documented, the operating instructions are missing or no instruction is given (§ 20(1) nos. 1 to 4, 22, 23 BioStoffV in conjunction with § 25(1)
    no. 1, (2) ArbSchG). The written documentation of the instruction itself is not subject to a fine, only the missing instruction (§ 14(2) sentence 1 BioStoffV).
- de: 'Das ist keine zweite Gefährdungsbeurteilung, sondern ein Teil der einen: Du konkretisierst sie je Gewerk und Tätigkeit – etwa für Maschinen, Hebebühnen, Stäube, Abgase, Lärm und Gefahrstoffe in der
    Werkstatt und für Arbeiten auf Baustellen oder in Wohnungen beim Kunden. Die Handlungshilfen deiner Berufsgenossenschaft helfen dabei. Eine eigene Frist gibt es nicht: Wie die Gefährdungsbeurteilung
    muss die Ergänzung vor Aufnahme der Tätigkeit beim Kunden bzw. im Gewerk vorliegen.'
  en: 'This is not a second risk assessment but part of the one you have: you make it specific for each trade and activity – for example for machines, vehicle lifts, dusts, exhaust fumes, noise and hazardous
    substances in the workshop, and for work on construction sites or in customers'' homes. The guidance of your employers'' liability insurance association helps with this. There is no separate deadline:
    like the risk assessment, the addition must be in place before work starts at the customer''s premises or in the trade.'
- de: Du benennst genug Beschäftigte als Brandschutzhelfer und lässt sie im Umgang mit Feuerlöschern ausbilden – in der Regel 5 Prozent der Beschäftigten, in kleinen Betrieben mindestens eine Person, die
    während der Arbeitszeit anwesend ist (ASR A2.2 Nr. 7.3).
  en: You appoint enough employees as fire safety assistants and have them trained in using fire extinguishers – usually 5 per cent of employees, in small businesses at least one person who is present during
    working hours (ASR A2.2 No. 7.3).
- de: Ergibt die Gefährdungsbeurteilung eine Gefährdung durch Tätigkeiten mit krebserzeugenden, keimzellmutagenen oder reproduktionstoxischen Gefahrstoffen der Kategorie 1A oder 1B, führst du ein Verzeichnis
    der betroffenen Beschäftigten mit Art, Dauer, Häufigkeit und Höhe der Exposition (§ 10a Abs. 1 GefStoffV). Typisch sind Hartholzstaub (Eiche, Buche) in der Tischlerei, Dieselmotoremissionen in der Kfz-Werkstatt
    und Quarzstaub oder Asbest auf Baustellen – dort gilt die Pflicht typischerweise; ob sie in deinem Betrieb im Einzelfall entfällt, klärst du in einer Beratung, etwa mit deiner Fachkraft für Arbeitssicherheit.
    Das Verzeichnis bewahrst du nach Ende der Exposition 40 Jahre auf, bei nur reproduktionstoxischen Stoffen 5 Jahre (§ 10a Abs. 2 GefStoffV); scheidet jemand aus, händigst du ihm seinen Auszug aus. Die
    Aufbewahrung kannst du an die Zentrale Expositionsdatenbank (ZED) der DGUV abgeben (§ 10a Abs. 3 GefStoffV). Die Einzelheiten erläutert die TRGS 410.
  en: If the risk assessment shows a hazard from work with carcinogenic, germ-cell mutagenic or reprotoxic hazardous substances of category 1A or 1B, you keep a register of the employees concerned with
    the type, duration, frequency and level of exposure (§ 10a(1) GefStoffV). Typical examples are hardwood dust (oak, beech) in joinery, diesel engine emissions in car repair shops and quartz dust or asbestos
    on construction sites – that is where the obligation typically applies; whether it does not apply to your business in an individual case is something you clarify in a consultation, for example with
    your occupational safety specialist. You keep the register for 40 years after exposure ends, for substances that are only reprotoxic for 5 years (§ 10a(2) GefStoffV); when someone leaves, you hand them
    their extract. You can hand over the retention to the Central Exposure Database (ZED) of the DGUV (§ 10a(3) GefStoffV). The details are explained in TRGS 410.
- de: Fahrzeuge sind bei Bedarf, mindestens aber einmal jährlich, durch einen Sachkundigen auf ihren betriebssicheren Zustand zu prüfen (§ 57 Abs. 1 DGUV Vorschrift 70). Die Ergebnisse hältst du schriftlich
    fest und bewahrst sie mindestens bis zur nächsten Prüfung auf (§ 57 Abs. 2 DGUV Vorschrift 70). Die Hauptuntersuchung ersetzt diese Prüfung nicht automatisch – sie prüft die Verkehrssicherheit, nicht
    den betriebssicheren Zustand für die Arbeit, etwa Aufbauten, Ladebordwand oder Ladungssicherung.
  en: Vehicles must be inspected by an expert for their operational safety as needed, but at least once a year (§ 57(1) DGUV Regulation 70). You record the results in writing and keep them at least until
    the next inspection (§ 57(2) DGUV Regulation 70). The general inspection (Hauptuntersuchung) does not automatically replace this inspection – it checks road safety, not the operational condition for
    work, such as bodywork, tail lift or load securing.
- de: 'Feuchtarbeit und hautbelastende Stoffe gibt es nicht nur im Salon: in Küche und Spülbereich, bei der Gebäudereinigung, in Praxen (häufige Händedesinfektion, Handschuhe), in der Kfz-Werkstatt (Öle,
    Kühlschmierstoffe, Lösemittel), in der Backstube und auf dem Bau (Zement, Epoxidharz). Im Hautschutzplan legst du je Tätigkeit fest, welche Schutzhandschuhe, welcher Hautschutz, welche Reinigung und
    welche Pflege zu verwenden sind, und hängst ihn am Arbeitsplatz aus. Er ergänzt die Gefährdungsbeurteilung und die Unterweisung (TRGS 401 in Verbindung mit §§ 7, 14 GefStoffV). Für das Friseurhandwerk
    konkretisiert die TRGS 530 den Hautschutz. Eine eigene Frist gibt es nicht: Der Plan muss vor Aufnahme der hautbelastenden Tätigkeit vorliegen.'
  en: 'Wet work and substances harmful to the skin are not only found in salons: in the kitchen and dishwashing area, in building cleaning, in medical practices (frequent hand disinfection, gloves), in
    car repair shops (oils, coolants, solvents), in the bakery and on construction sites (cement, epoxy resin). In the skin protection plan you set for each activity which protective gloves, skin protection,
    cleaning and care products are to be used, and post it at the workplace. It supplements the risk assessment and the instruction (TRGS 401 in conjunction with §§ 7, 14 GefStoffV). For the hairdressing
    trade, TRGS 530 specifies skin protection. There is no separate deadline: the plan must be in place before the work that stresses the skin begins.'
- de: Für Jugendliche gilt ein kürzerer Abstand als die jährliche Unterweisung der übrigen Beschäftigten. Vor Beginn der Beschäftigung und bei wesentlichen Änderungen unterweist du sie über die Gefahren
    und die Schutzmaßnahmen; danach wiederholst du die Unterweisung mindestens halbjährlich (§ 29 JArbSchG). Jede jugendliche Person muss einzeln spätestens sechs Monate nach ihrer letzten Unterweisung
    wieder unterwiesen sein. Amtlos erinnert sechs Monate nach der letzten Unterweisung, die du in Amtlos erfasst, und unterscheidet dabei noch nicht nach Personen – unterweist du Jugendliche einzeln, achte
    selbst auf die Frist jeder Person und erfasse jede Unterweisung.
  en: For young people, a shorter interval applies than the annual instruction of other employees. Before employment begins and when there are significant changes, you instruct them about the hazards and
    the protective measures; after that you repeat the instruction at least every six months (§ 29 JArbSchG). Each young person must individually be instructed again no later than six months after their
    last instruction. Amtlos reminds you six months after the last instruction you record in Amtlos and does not yet distinguish between persons – if you instruct young people individually, keep track of
    each person's deadline yourself and record each instruction.
- de: 'Für Lebensmittel, die du lose abgibst – an der Theke, im Restaurant oder im Imbiss –, gibst du bestimmte Zusatzstoffe an (§ 5 LMZDV): „mit Farbstoff“, „mit Konservierungsstoff“ oder „konserviert“,
    „mit Antioxidationsmittel“, „mit Geschmacksverstärker“, „geschwefelt“, „geschwärzt“, „gewachst“, „mit Phosphat“, „mit Süßungsmittel(n)“, „enthält eine Phenylalaninquelle“ und „kann bei übermäßigem Verzehr
    abführend wirken“. Enthält ein Lebensmittel einen der Farbstoffe E 102, E 104, E 110, E 122, E 124 oder E 129 (Azofarbstoffe), steht zum Namen oder zur E-Nummer des Farbstoffs der Warnhinweis „Kann
    Aktivität und Aufmerksamkeit bei Kindern beeinträchtigen“ (Art. 24 in Verbindung mit Anhang V Verordnung (EG) Nr. 1333/2008; nicht bei Getränken über 1,2 % vol). Für Getränke kommen zwei Angaben dazu,
    die nicht aus der LMZDV stammen: „chininhaltig“ bei nicht vorverpackten Getränken mit Chinin bis 1,2 % vol (§ 5 Abs. 1 AromenDV) und bei Erfrischungsgetränken mit mehr als 150 mg Koffein je Liter der
    Hinweis „Erhöhter Koffeingehalt. Für Kinder und schwangere oder stillende Frauen nicht empfohlen“ mit dem Koffeingehalt in mg/100 ml – nicht bei Kaffee und Tee (§ 6 FrSaftErfrischGetrV in Verbindung
    mit Anhang III Nr. 4.1 LMIV). Üblich sind Fußnoten auf der Speisekarte oder ein Schild an der Ware. Stattdessen kannst du die Angaben auch in einem Aushang, einer schriftlichen Aufstellung oder elektronisch
    bereithalten, wenn du deutlich darauf hinweist (§ 5 Abs. 3 LMZDV). Die Allergenkennzeichnung ist eine eigene Pflicht; in der Allergenliste von Amtlos kannst du die Zusatzstoffe gleich mit angeben –
    dann hängt ein Blatt mit beidem aus.'
  en: 'For food you sell loose – at the counter, in the restaurant or at the snack bar – you indicate certain additives (§ 5 LMZDV): “mit Farbstoff” (with colouring), “mit Konservierungsstoff” or “konserviert”
    (with preservative / preserved), “mit Antioxidationsmittel” (with antioxidant), “mit Geschmacksverstärker” (with flavour enhancer), “geschwefelt” (sulphured), “geschwärzt” (blackened), “gewachst” (waxed),
    “mit Phosphat” (with phosphate), “mit Süßungsmittel(n)” (with sweetener(s)), “enthält eine Phenylalaninquelle” (contains a source of phenylalanine) and “kann bei übermäßigem Verzehr abführend wirken”
    (excessive consumption may have a laxative effect). If a food contains one of the colours E 102, E 104, E 110, E 122, E 124 or E 129 (azo dyes), the warning “Kann Aktivität und Aufmerksamkeit bei Kindern
    beeinträchtigen” (may have an adverse effect on activity and attention in children) is given with the name or E number of the colour (Art. 24 in conjunction with Annex V Regulation (EC) No 1333/2008;
    not for drinks above 1.2 % vol). For drinks, two indications are added that do not come from the LMZDV: “chininhaltig” (contains quinine) for non-prepacked drinks containing quinine with up to 1.2 %
    vol (§ 5(1) AromenDV), and for soft drinks with more than 150 mg caffeine per litre the statement “Erhöhter Koffeingehalt. Für Kinder und schwangere oder stillende Frauen nicht empfohlen” (High caffeine
    content. Not recommended for children or pregnant or breast-feeding women) with the caffeine content in mg/100 ml – not for coffee and tea (§ 6 FrSaftErfrischGetrV in conjunction with Annex III No.
    4.1 LMIV (Food Information Regulation)). Footnotes on the menu or a sign on the goods are common. Instead, you can also provide the information in a notice, a written list or electronically if you clearly
    point this out (§ 5(3) LMZDV). Allergen labelling is a separate obligation; in the Amtlos allergen list you can enter the additives as well – then one sheet with both is displayed.'
- de: Für den Hautschutzplan selbst gibt es kein eigenes Bußgeld; er konkretisiert die Schutzmaßnahmen nach TRGS 401. Bußgeldbewehrt sind fehlende Gefährdungsbeurteilung, Betriebsanweisung oder Unterweisung
    bei Gefahrstoffen (bis 50.000 €, siehe ‚Gefahrstoffverzeichnis und Betriebsanweisungen‘); die Aufsicht kann außerdem Maßnahmen anordnen.
  en: There is no separate fine for the skin protection plan itself; it specifies the protective measures under TRGS 401. Fines apply to a missing risk assessment, operating instructions or instruction
    for hazardous substances (up to €50,000, see ‘Hazardous substances register and operating instructions’); the authority can also order measures.
- de: In Handwerk und Bau – etwa in Kfz-Werkstatt und Tischlerei – gibt es oft laute Maschinen und Werkzeuge.
  en: In the trades and construction – for example in car repair shops and joinery – there are often noisy machines and tools.
- de: In der Gefährdungsbeurteilung ermittelst du, ob Beschäftigte Lärm ausgesetzt sind – wenn nötig mit Messungen durch eine fachkundige Person (§ 3, § 4 LärmVibrationsArbSchV). Die Auslösewerte liegen
    bei 80 und 85 dB(A) Tages-Lärmexpositionspegel bzw. 135 und 137 dB(C) Spitzenschalldruckpegel (§ 6). Technische Maßnahmen wie leisere Maschinen und Kapselung gehen vor (§ 7 Abs. 1). Ab dem unteren Auslösewert
    stellst du Gehörschutz bereit und unterweist die Beschäftigten, ab dem oberen Auslösewert müssen sie ihn tragen (§ 8, § 11). Bereiche, in denen der obere Auslösewert überschritten werden kann, kennzeichnest
    du als Lärmbereich und stellst ein Lärmminderungsprogramm auf (§ 7 Abs. 4, 5). Arbeitsmedizinische Vorsorge ist ab 80 dB(A) anzubieten und ab 85 dB(A) Pflicht – das steht bei der Vorsorge. Das betrifft
    ausdrücklich auch die Kfz-Werkstatt und die Holzverarbeitung und Tischlerei. Für Vibrationen (zum Beispiel Bohrhammer, Rüttelplatte) gilt dieselbe Verordnung.
  en: In the risk assessment you determine whether employees are exposed to noise – if necessary with measurements by a competent person (§ 3, § 4 LärmVibrationsArbSchV). The action values are 80 and 85
    dB(A) daily noise exposure level and 135 and 137 dB(C) peak sound pressure level (§ 6). Technical measures such as quieter machines and enclosures take priority (§ 7(1)). From the lower action value
    you provide hearing protection and instruct employees; from the upper action value they must wear it (§ 8, § 11). Areas where the upper action value may be exceeded are marked as noise areas, and you
    draw up a noise reduction programme (§ 7(4), (5)). Occupational health care must be offered from 80 dB(A) and is mandatory from 85 dB(A) – this is covered under preventive care. This expressly also
    applies to car repair shops and to woodworking and joinery. The same ordinance applies to vibration (for example hammer drill, vibrating plate).
- de: Jeden Unfall und jede Erste-Hilfe-Leistung trägst du ins Verbandbuch ein – auch kleine Verletzungen ohne Arbeitsunfähigkeit – und hältst die Aufzeichnungen fünf Jahre lang verfügbar.
  en: You enter every accident and every first aid given in the first-aid log – including minor injuries without incapacity for work – and keep the records available for five years.
- de: Kein unmittelbares Bußgeld. Die Aufsichtsbehörde kann die Bestellung anordnen (§ 12 ASiG); ein Verstoß gegen die vollziehbare Anordnung kostet bis 25.000 € (§ 20 Abs. 1 Nr. 1, Abs. 2 ASiG). Auch die
    Berufsgenossenschaft kann Anordnungen treffen (§ 19 SGB VII).
  en: No direct fine. The supervisory authority can order the appointment (§ 12 ASiG); a breach of the enforceable order costs up to €25,000 (§ 20(1) no. 1, (2) ASiG). The employers' liability insurance
    association (BG) can also issue orders (§ 19 SGB VII).
- de: Mit dem selbstständigen Führen von Fahrzeugen beauftragst du nur Personen, die mindestens 18 Jahre alt, körperlich und geistig geeignet, im Führen des Fahrzeugs unterwiesen sind und ihre Befähigung
    nachgewiesen haben (§ 35 DGUV Vorschrift 70). Die Beauftragung schriftlich festzuhalten ist nicht vorgeschrieben, aber als Nachweis empfehlenswert. Unterweise sie zu Abfahrtkontrolle, Verhalten bei
    Pannen und Ladungssicherung. Die Ladung ist so zu verstauen und zu sichern, dass sie selbst bei Vollbremsung oder plötzlicher Ausweichbewegung nicht verrutscht, umfällt, hin- und herrollt oder herabfällt
    (§ 22 Abs. 1 StVO). Maßgeblich ist die Unfallverhütungsvorschrift „Fahrzeuge“ deiner Berufsgenossenschaft.
  en: You only assign the independent driving of vehicles to people who are at least 18 years old, physically and mentally suitable, instructed in driving the vehicle and have proven their competence (§
    35 DGUV Regulation 70). Recording the assignment in writing is not required but recommended as evidence. Instruct them on departure checks, what to do in case of a breakdown and load securing. The load
    must be stowed and secured so that it does not slip, fall over, roll back and forth or fall off even during emergency braking or a sudden evasive manoeuvre (§ 22(1) StVO). The accident prevention regulation
    “Vehicles” of your BG is decisive.
- de: Sobald du mindestens eine Person beschäftigst, sind die Gefährdungen an jedem Arbeitsplatz zu beurteilen, Schutzmaßnahmen festzulegen und das zu dokumentieren. Amtlos erstellt dir dafür eine Vorlage
    passend zu deiner Branche. Überprüfe die Beurteilung bei Änderungen der Arbeitsstätte oder der Tätigkeiten, bei neuen Arbeitsmitteln oder Arbeitsstoffen, nach Unfällen und Beinaheunfällen, bei Berufskrankheiten
    oder Gesundheitsbeschwerden, nach Ergebnissen der arbeitsmedizinischen Vorsorge, bei neuen Vorschriften oder Erkenntnissen und wenn du Jugendliche beschäftigst oder eine Beschäftigte dir ihre Schwangerschaft
    mitteilt.
  en: As soon as you employ at least one person, the hazards at every workplace must be assessed, protective measures defined and documented. Amtlos creates a template for this suited to your sector. Review
    the assessment when the workplace or activities change, when there are new work equipment or substances, after accidents and near misses, in case of occupational diseases or health complaints, after
    results of occupational health care, when there are new regulations or findings, and when you employ young people or an employee informs you of her pregnancy.
- de: Ab 1.1.2028 gilt die Pflicht zum Versand strukturierter E-Rechnungen für alle Unternehmen im B2B-Geschäft, außer Kleinunternehmern nach § 19 UStG. Ausgenommen sind Kleinbetragsrechnungen bis 250 €
    und Fahrausweise (§§ 33, 34 UStDV).
  en: From 1.1.2028, the obligation to send structured e-invoices applies to all businesses in B2B trade, except small businesses under § 19 UStG. Small-amount invoices up to €250 and travel tickets are
    exempt (§§ 33, 34 UStDV).
- de: 'Der Kurztext nennt jetzt den Meldezeitraum: monatlich als Regel, vierteljährlich auf Wunsch bis 50.000 € je Quartal oder bei nur sonstigen Leistungen. Amtlos fragt danach und nennt weiter den 25.
    als Termin, ohne Verschiebung auf den nächsten Werktag.'
  en: 'The short text now states the reporting period: monthly as the rule, quarterly if you choose up to €50,000 per quarter or if you only provide other services. Amtlos asks for it and still shows the
    25th as the deadline, without moving it to the next working day.'
- de: Auch die Außerbetriebnahme einer elektronischen Kasse muss dem Finanzamt innerhalb eines Monats gemeldet werden. In der Mitteilung erfasst du je Betriebsstätte alle Kassen; die Frist läuft für jede
    Außerbetriebnahme neu.
  en: Taking an electronic cash register out of service must also be reported to the tax office within one month. In the notification you list all registers for each business premises; the deadline runs
    anew for each register taken out of service.
- de: Bei einer Personengesellschaft stellt das Finanzamt den Gewinn der Gesellschaft gesondert und einheitlich fest und verteilt ihn auf die Gesellschafter. Dafür gibt die Gesellschaft jedes Jahr eine
    Feststellungserklärung ab – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres. Jede Gesellschafterin und jeder Gesellschafter gibt zusätzlich
    die eigene Einkommensteuererklärung ab. Die Feststellung entfällt ausnahmsweise, wenn nur eine der beteiligten Personen mit ihren Einkünften im Inland steuerpflichtig ist, oder in Fällen von geringer
    Bedeutung (§ 180 Abs. 3 AO).
  en: For a partnership, the tax office determines the partnership's profit separately and uniformly and allocates it to the partners. For this the partnership files a declaration of separate and uniform
    determination (Feststellungserklärung) every year – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after next. Each partner also files
    their own income tax return. Exceptionally, no determination is made if only one of the persons involved is liable to tax in Germany on their income, or in cases of minor importance (§ 180(3) AO).
- de: Bei monatlicher Abgabe mit Dauerfristverlängerung zahlst du bis zum 10. Februar eine Sondervorauszahlung von einem Elftel der Vorauszahlungen des Vorjahres. Sie wird in der Voranmeldung für Dezember
    angerechnet (Kennzahl 39). Im ersten Jahr zahlst du sie mit dem Antrag auf Dauerfristverlängerung, danach jedes Jahr bis zum 10. Februar. Hast du deine Tätigkeit erst in diesem Jahr begonnen, wird sie
    aus den voraussichtlichen Vorauszahlungen berechnet (§ 47 Abs. 2 UStDV). Erscheint der Steueranspruch gefährdet, kann das Finanzamt die Dauerfristverlängerung widerrufen (§ 46 Satz 2 UStDV).
  en: If you file monthly with a permanent filing extension, you pay a special advance payment of one eleventh of the previous year's advance payments by 10 February. It is credited in the advance return
    for December (box 39). In the first year you pay it together with the application for the permanent extension, after that every year by 10 February. If you only started your business this year, it is
    calculated from the expected advance payments (§ 47(2) UStDV). If the tax claim appears to be at risk, the tax office can revoke the permanent extension (§ 46 sentence 2 UStDV).
- de: 'Buchungsbelege einschließlich Rechnungen: 8 Jahre. Jahresabschlüsse, Bücher und Organisationsunterlagen: 10 Jahre. Handels- und Geschäftsbriefe: 6 Jahre. Die Frist beginnt mit dem Schluss des Kalenderjahres,
    in dem du die letzte Eintragung gemacht, den Brief erhalten oder abgesandt hast oder der Beleg entstanden ist (§ 147 Abs. 4 AO). Lieferscheine, die keine Buchungsbelege sind, musst du seit 2025 nur
    bis zum Erhalt bzw. Versand der Rechnung aufbewahren (§ 147 Abs. 3 Satz 3, 4 AO). Die Frist läuft aber nicht ab, solange die Unterlagen für Steuern von Bedeutung sind, deren Festsetzungsfrist noch nicht
    abgelaufen ist – zum Beispiel bei einer laufenden Betriebsprüfung oder einem offenen Einspruch. Amtlos zeigt dir, ab wann du Unterlagen frühestens löschen darfst; ob noch etwas offen ist, klärst du
    vorher mit deiner Steuerberatung.'
  en: 'Accounting vouchers including invoices: 8 years. Annual accounts, books and organisational documents: 10 years. Commercial and business letters: 6 years. The period starts at the end of the calendar
    year in which you made the last entry, received or sent the letter, or in which the voucher was created (§ 147(4) AO). Since 2025, delivery notes that are not accounting vouchers only need to be kept
    until the invoice is received or sent (§ 147(3) sentences 3, 4 AO). However, the period does not expire as long as the documents matter for taxes whose assessment period has not yet expired – for example
    during an ongoing tax audit or an open objection. Amtlos shows you the earliest date you may delete documents; check beforehand with your tax adviser whether anything is still open.'
- de: Bußgeld bis 25.000 €, wenn die Kasse nicht oder nicht richtig verwendet oder nicht oder nicht richtig durch eine TSE geschützt wird und dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz
    1 Nr. 4, 5, Abs. 6 AO). Für die fehlende Belegausgabe nach § 146a Abs. 2 AO sieht § 379 AO kein Bußgeld vor. Ohne ordnungsgemäße TSE verliert die Kassenführung ihre Beweiskraft; das Finanzamt kann Umsätze
    hinzuschätzen (§ 158, § 162 AO). Die Kasse kann jederzeit ohne Ankündigung geprüft werden (Kassen-Nachschau, § 146b AO).
  en: Fine up to €25,000 if the register is not used or not used correctly, or not protected or not protected correctly by a TSE, and this makes tax evasion possible (§ 379(1) sentence 1 nos. 4, 5, (6)
    AO). § 379 AO provides no fine for failing to issue a receipt under § 146a(2) AO. Without a proper TSE, your cash records lose their evidential value; the tax office can add estimated sales (§ 158,
    § 162 AO). The register can be inspected at any time without notice (cash inspection, Kassen-Nachschau, § 146b AO).
- de: Deine Rechnungen müssen bestimmte Angaben enthalten; bist du zur Rechnung verpflichtet – etwa bei Leistungen an andere Unternehmen –, stellst du sie innerhalb von sechs Monaten nach Ausführung der
    Leistung aus (§ 14 Abs. 2 Satz 2 UStG). Als Kleinunternehmer brauchst du den Hinweis, dass die Steuerbefreiung für Kleinunternehmer gilt (§ 34a UStDV).
  en: Your invoices must contain certain details; if you are obliged to issue an invoice – for example for supplies to other businesses –, you issue it within six months after the supply (§ 14(2) sentence
    2 UStG). As a small business, you need a note that the small business exemption applies (§ 34a UStDV).
- de: Die E-Bilanz ist die elektronische Übermittlung von Bilanz und Gewinn- und Verlustrechnung an das Finanzamt. Sie gilt für alle, die Bücher führen und bilanzieren – nicht nur für Gesellschaften. Eine
    Bilanz als PDF erledigt sie nicht. Du übermittelst sie mit der Körperschaftsteuer- bzw. Einkommensteuer- oder Feststellungserklärung, also in denselben Fristen (§ 149 AO) – ohne Steuerberatung bis 31.
    Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres. Zur Vermeidung unbilliger Härten kann das Finanzamt auf Antrag auf die elektronische Übermittlung verzichten (§ 5b
    Abs. 2 EStG).
  en: The E-Bilanz is the electronic transmission of the balance sheet and profit and loss account to the tax office. It applies to everyone who keeps books and draws up balance sheets – not only to companies.
    A balance sheet as a PDF does not fulfil it. You transmit it with the corporation tax, income tax or separate determination return, i.e. within the same deadlines (§ 149 AO) – without a tax adviser
    by 31 July of the following year, with a tax adviser by the end of February of the year after next. To avoid undue hardship, the tax office can waive electronic transmission on application (§ 5b(2)
    EStG).
- de: Die Einkommensteuererklärung übermittelst du elektronisch – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO). Das Finanzamt
    kann die Erklärung früher anfordern oder die Frist auf Antrag verlängern (§ 149 Abs. 4, § 109 AO).
  en: You file your income tax return electronically – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after next (§ 149 AO). The tax office
    can request the return earlier or extend the deadline on application (§ 149(4), § 109 AO).
- de: Die Folgen einer verspäteten oder fehlenden Voranmeldung stehen bei „Umsatzsteuer-Voranmeldung abgeben“.
  en: The consequences of a late or missing advance return are listed under “File the advance VAT return”.
- de: Die Folgen sind jetzt beschrieben, und die Fundstelle des aktuellen GoBD-Schreibens ist ergänzt.
  en: The consequences are now described, and the reference to the current GoBD letter has been added.
- de: Die Folgen sind jetzt vollständig beschrieben (Schätzung, Strafbarkeit) und als „hoch“ eingestuft.
  en: The consequences are now fully described (estimate, criminal liability) and rated “high”.
- de: Die Gewerbesteuer hängt vom Hebesatz deiner Gemeinde ab. Einzelunternehmen und Personengesellschaften haben einen Freibetrag. Die Erklärung gibst du ohne Steuerberatung bis 31. Juli des Folgejahres
    ab, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO). Das Finanzamt kann die Erklärung früher anfordern oder die Frist auf Antrag verlängern (§ 149 Abs. 4, § 109 AO).
  en: Trade tax depends on your municipality's multiplier. Sole proprietorships and partnerships have an allowance. You file the return without a tax adviser by 31 July of the following year, with a tax
    adviser by the end of February of the year after next (§ 149 AO). The tax office can request the return earlier or extend the deadline on application (§ 149(4), § 109 AO).
- de: Die GoBD regeln, wie Bücher und Belege elektronisch geführt und aufbewahrt werden. Die Verfahrensdokumentation beschreibt deine Abläufe. Maßgeblich ist das BMF-Schreiben vom 28.11.2019, geändert am
    11.03.2024 und am 14.07.2025.
  en: The GoBD set out how books and vouchers are kept and stored electronically. The procedural documentation describes your processes. The governing text is the Federal Ministry of Finance (BMF) letter
    of 28.11.2019, amended on 11.03.2024 and on 14.07.2025.
- de: Die GoBD selbst sehen kein Bußgeld vor. Sind Bücher und Aufzeichnungen nicht ordnungsgemäß, verlieren sie ihre Beweiskraft (§ 158 AO) und das Finanzamt kann schätzen (§ 162 AO). Bußgeld bis 25.000
    €, wenn dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz 1 Nr. 3, Abs. 6 AO). Eine fehlende Verfahrensdokumentation allein führt nicht zur Verwerfung, wenn die Nachvollziehbarkeit gegeben
    ist (GoBD Rz. 155).
  en: The GoBD themselves provide no fine. If books and records are not kept properly, they lose their evidential value (§ 158 AO) and the tax office can estimate (§ 162 AO). Fine up to €25,000 if this
    makes tax evasion possible (§ 379(1) sentence 1 no. 3, (6) AO). Missing procedural documentation alone does not lead to the books being rejected if they can still be traced and verified (GoBD para.
    155).
- de: Die Jahreserklärung fasst die Umsatzsteuer des ganzen Jahres zusammen – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO). Das
    Finanzamt kann die Erklärung früher anfordern oder die Frist auf Antrag verlängern (§ 149 Abs. 4, § 109 AO).
  en: The annual return summarises the VAT for the whole year – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after next (§ 149 AO). The tax
    office can request the return earlier or extend the deadline on application (§ 149(4), § 109 AO).
- de: 'Die Kleinunternehmerregelung gilt, wenn dein Umsatz im Vorjahr höchstens 25.000 € betrug und im laufenden Jahr 100.000 € nicht übersteigt. Die 25.000 € beziehen sich also auf das Vorjahr: Liegt dein
    Umsatz in diesem Jahr über 25.000 €, aber höchstens bei 100.000 €, bleibst du dieses Jahr Kleinunternehmer – ab 1. Januar des nächsten Jahres gilt dann die Regelbesteuerung. Die 100.000 € sind die harte
    Grenze im laufenden Jahr: Ab dem Umsatz, mit dem du sie überschreitest, endet die Regelung sofort. Im Gründungsjahr gilt 25.000 € als harte Grenze für das laufende Jahr. Maßgeblich ist der Umsatz nach
    vereinnahmten Entgelten (netto, nach Zahlungseingang), nicht die Summe der Rechnungen nach Rechnungsdatum. Wer auf die Regelung verzichtet, ist fünf Jahre daran gebunden.'
  en: 'The small business scheme applies if your turnover last year was at most €25,000 and does not exceed €100,000 this year. So the €25,000 refers to last year: if your turnover this year is above €25,000
    but at most €100,000, you remain a small business this year – from 1 January of next year, standard taxation applies. The €100,000 is the hard limit for the current year: from the sale with which you
    exceed it, the scheme ends immediately. In the founding year, €25,000 is the hard limit for the current year. What counts is turnover based on payments received (net, by date of payment), not the total
    of invoices by invoice date. If you opt out of the scheme, you are bound for five years.'
- de: Die Monatsfrist läuft ab dem Beginn deiner Tätigkeit, nicht ab der Gründung der Gesellschaft; fällt das Fristende auf ein Wochenende oder einen Feiertag, verschiebt es sich auf den nächsten Werktag.
  en: The one-month deadline runs from the start of your business activity, not from the founding of the company; if it ends on a weekend or public holiday, it moves to the next working day.
- de: Die Pflicht zum Versand strukturierter E-Rechnungen (XRechnung oder ZUGFeRD) gilt ab 1.1.2027 für Unternehmen mit mehr als 800.000 € Vorjahresumsatz. Kleinunternehmer sind befreit. Eine PDF-Rechnung
    ist keine E-Rechnung. Ausgenommen sind Kleinbetragsrechnungen bis 250 € und Fahrausweise (§§ 33, 34 UStDV).
  en: The obligation to send structured e-invoices (XRechnung or ZUGFeRD) applies from 1.1.2027 to businesses with more than €800,000 turnover in the previous year. Small businesses are exempt. A PDF invoice
    is not an e-invoice. Small-amount invoices up to €250 and travel tickets are exempt (§§ 33, 34 UStDV).
- de: Die Rückkehr zur monatlichen Voranmeldung für Neugründer ist geltendes Recht ab 1. Januar 2027; wer 2026 gegründet hat, meldet 2027 monatlich.
  en: The return to monthly advance returns for new businesses is law in force from 1 January 2027; if you founded in 2026, you file monthly in 2027.
- de: Die Umsatzsteuer-Identifikationsnummer brauchst du für Geschäfte mit Unternehmen in anderen EU-Ländern – wenn du an sie lieferst oder leistest, aber auch, wenn du bei ihnen einkaufst, z. B. Software
    oder Werbung. Eine Frist gibt es nicht; du beantragst sie online beim Bundeszentralamt für Steuern oder gleich im Fragebogen zur steuerlichen Erfassung. Verkaufst du nur an Privatpersonen in anderen
    EU-Ländern (One-Stop-Shop), ist sie nicht erforderlich, für die Registrierung im One-Stop-Shop aber üblich. Auch als Kleinunternehmer kannst du sie beantragen und solltest es bei Einkäufen in anderen
    EU-Ländern tun – die Steuer, die du dabei schuldest (§ 13b UStG), fällt auch für Kleinunternehmer an.
  en: You need the VAT identification number for business with companies in other EU countries – when you supply goods or services to them, but also when you buy from them, e.g. software or advertising.
    There is no deadline; you apply online at the Federal Central Tax Office or directly in the tax registration questionnaire. If you only sell to consumers in other EU countries (One-Stop-Shop), it is
    not required, but it is usual for registering for the One-Stop-Shop. Small businesses can apply for it too and should do so when buying in other EU countries – the tax you owe on such purchases (§ 13b
    UStG) also applies to small businesses.
- de: Die Zusammenfassende Meldung ist bei innergemeinschaftlichen Leistungen an Unternehmen (B2B) abzugeben. Du übermittelst sie bis zum 25. Tag nach Ablauf des Meldezeitraums an das Bundeszentralamt für
    Steuern. Bei Warenlieferungen ist der Kalendermonat die Regel; vierteljährlich darfst du melden, wenn deine innergemeinschaftlichen Lieferungen weder im laufenden noch in einem der vier vorangegangenen
    Quartale jeweils 50.000 € übersteigen (§ 18a Abs. 1 Satz 2 UStG). Erbringst du nur sonstige Leistungen (keine Warenlieferungen), meldest du vierteljährlich (§ 18a Abs. 2 UStG). Amtlos fragt deshalb
    nach deinem Meldezeitraum und berechnet danach die Termine – bei „monatlich“ für jeden Monat, bei „vierteljährlich“ oder nur sonstigen Leistungen für jedes Quartal; „weiß ich nicht“ behandelt Amtlos
    bei Warenlieferungen wie monatlich, weil das die Regel ist. Fällt der 25. auf ein Wochenende oder einen Feiertag, nennt Amtlos trotzdem den 25. – ob sich die Frist verschiebt, ist nicht abschließend
    geklärt. Kleinunternehmer geben keine Zusammenfassende Meldung ab (§ 18a Abs. 4 UStG). Ändert sich die Bemessungsgrundlage später (z. B. Skonto oder Rücksendung), berichtigst du die Meldung für den
    ursprünglichen Zeitraum innerhalb eines Monats (§ 18a Abs. 10 UStG). Amtlos stellt die Beträge je USt-IdNr. aus deinen Rechnungen zusammen (Vorlage „Zusammenfassende Meldung“); du übermittelst selbst.
  en: The recapitulative statement (Zusammenfassende Meldung) must be filed for intra-EU supplies to businesses (B2B). You submit it to the Federal Central Tax Office by the 25th day after the end of the
    reporting period. For deliveries of goods, the calendar month is the rule; you may report quarterly if your intra-EU deliveries do not exceed €50,000 in the current quarter or in any of the four preceding
    quarters (§ 18a(1) sentence 2 UStG). If you only provide other services (no deliveries of goods), you report quarterly (§ 18a(2) UStG). That is why Amtlos asks for your reporting period and calculates
    the dates accordingly – for “monthly” for every month, for “quarterly” or services only for every quarter; Amtlos treats “I don't know” with deliveries of goods as monthly, because that is the rule.
    If the 25th falls on a weekend or public holiday, Amtlos still shows the 25th – whether the deadline moves has not been conclusively settled. Small businesses do not file a recapitulative statement
    (§ 18a(4) UStG). If the taxable amount changes later (e.g. discount or return), you correct the statement for the original period within one month (§ 18a(10) UStG). Amtlos compiles the amounts per VAT
    ID from your invoices (template “Recapitulative statement”); you submit it yourself.
- de: Du bist im Bau oder im Handwerk tätig.
  en: You work in construction or a skilled trade.
- de: Du erbringst Bauleistungen für Unternehmen oder öffentliche Auftraggeber.
  en: You provide construction work for businesses or public-sector clients.
- de: Du kaufst bei Unternehmen in anderen EU-Ländern ein.
  en: You buy from businesses in other EU countries.
- de: Eine E-Rechnung ist ein strukturierter Datensatz. Eine PDF-Rechnung ist keine E-Rechnung. Für den Empfang genügt ein E-Mail-Postfach (BMF-Schreiben vom 15.10.2024). Das gilt für alle Unternehmen,
    auch für Kleinunternehmer.
  en: An e-invoice is a structured data set. A PDF invoice is not an e-invoice. An e-mail inbox is enough for receiving them (BMF letter of 15.10.2024). This applies to all businesses, including small businesses.
- de: Elektronische Aufzeichnungssysteme müssen durch eine zertifizierte technische Sicherheitseinrichtung geschützt sein. Zu jedem Geschäftsvorfall ist ein Beleg auszugeben. Von der Belegausgabepflicht
    befreit das Finanzamt nur auf Antrag (§ 148 AO).
  en: Electronic recording systems must be protected by a certified technical security device. A receipt must be issued for every transaction. The tax office only exempts you from the obligation to issue
    receipts on application (§ 148 AO).
- de: Elektronische Kassen müssen dem Finanzamt gemeldet werden, innerhalb eines Monats nach Anschaffung oder Außerbetriebnahme. Für Bestandskassen ist die Meldefrist 31.7.2025 abgelaufen – noch nicht gemeldete
    Kassen meldest du unverzüglich nach. Die Meldung geht nur über ELSTER (amtlich vorgeschriebener Datensatz); ein ausgedrucktes oder geteiltes Datenblatt erfüllt sie nicht.
  en: Electronic cash registers must be reported to the tax office within one month of purchase or decommissioning. For existing registers, the reporting deadline of 31.7.2025 has passed – report registers
    not yet reported without delay. The report can only be made via ELSTER (officially prescribed data set); a printed or shared data sheet does not fulfil it.
- de: 'Ergänzt: Für die Grenzen zählt der Umsatz nach Zahlungseingang, nicht nach Rechnungsdatum.'
  en: 'Added: For the limits, turnover counts by date of payment, not by invoice date.'
- de: 'Ergänzt: Im ersten Jahr zahlst du mit dem Antrag; bei Neugründung zählen die voraussichtlichen Vorauszahlungen.'
  en: 'Added: In the first year you pay with the application; for a new business the expected advance payments count.'
- de: 'Ergänzt: Noch nicht gemeldete Bestandskassen meldest du unverzüglich nach.'
  en: 'Added: Report existing registers not yet reported without delay.'
- de: 'Ergänzt: Wann die Frist beginnt, und dass Lieferscheine, die keine Buchungsbelege sind, nur bis zur Rechnung aufbewahrt werden müssen.'
  en: 'Added: When the period starts, and that delivery notes that are not accounting vouchers only have to be kept until the invoice.'
- de: 'Fernverkäufe von Waren und bestimmte Leistungen (z. B. digitale Leistungen) an Privatpersonen in anderen EU-Ländern sind im Bestimmungsland steuerbar, sobald sie EU-weit im Vorjahr oder im laufenden
    Jahr zusammen 10.000 € netto übersteigen (§ 3c Abs. 4 UStG) – oder wenn du auf die Schwelle verzichtest. Darunter bleibt der Ort in Deutschland. Das One-Stop-Shop-Verfahren (OSS) ist ein Wahlrecht:
    Nutzt du es, meldest du diese Umsätze je Land und Steuersatz beim Bundeszentralamt für Steuern; nutzt du es nicht, musst du dich in jedem Bestimmungsland registrieren. Die Teilnahme zeigst du vorher
    über das BZStOnline-Portal an. Erklärung und Zahlung sind bis zum letzten Tag des Monats nach Ablauf des Quartals fällig (§ 18j Abs. 4 UStG); die Frist verschiebt sich nicht auf den nächsten Werktag.
    OSS-Umsätze gehören nicht in die deutsche Umsatzsteuer-Voranmeldung. Auch als Kleinunternehmer: § 19 UStG gilt nur für Umsätze im Inland – Fernverkäufe über 10.000 € sind im Bestimmungsland steuerpflichtig.
    Ob du über der Schwelle liegst, ergibt sich aus deinen Umsätzen – Amtlos fragt die Höhe nicht ab. Amtlos stellt die Umsätze aus Rechnungen mit „OSS“ je Land und Steuersatz zusammen; du übermittelst
    selbst.'
  en: 'Distance sales of goods and certain services (e.g. digital services) to consumers in other EU countries are taxable in the country of destination as soon as they exceed €10,000 net in total EU-wide
    in the previous or current year (§ 3c(4) UStG) – or if you waive the threshold. Below that, the place of supply stays in Germany. The One-Stop-Shop procedure (OSS) is optional: if you use it, you report
    these sales per country and tax rate to the Federal Central Tax Office; if you don''t, you must register in each country of destination. You notify your participation in advance via the BZStOnline portal.
    The return and payment are due by the last day of the month after the end of the quarter (§ 18j(4) UStG); the deadline does not move to the next working day. OSS sales do not belong in the German advance
    VAT return. Small businesses too: § 19 UStG only applies to domestic sales – distance sales above €10,000 are taxable in the country of destination. Whether you are above the threshold depends on your
    sales – Amtlos does not ask for the amount. Amtlos compiles the sales from invoices marked “OSS” per country and tax rate; you submit it yourself.'
- de: 'Für die Jahre 2021 bis 2026 richtet sich der Voranmeldungszeitraum im Gründungsjahr und im Folgejahr nach der voraussichtlichen Steuer (§ 18 Abs. 2 Satz 6 UStG). Ab 2027 gilt nach dem Gesetz wieder
    Satz 4: Im Jahr der Gründung und im Folgejahr gibst du die Voranmeldung monatlich ab. Hast du 2026 gegründet, ist 2027 dein Folgejahr – du gibst dann monatliche Voranmeldungen ab; die Aussetzung erfasst
    nur die Jahre bis 2026. Die Voranmeldung ist bis zum 10. Tag nach Ablauf des Monats fällig, mit Dauerfristverlängerung einen Monat später (§ 18 Abs. 1 UStG, §§ 46 ff. UStDV). Stand: Oktober 2026 – eine
    Verlängerung ist nicht beschlossen, kann aber mit dem Jahressteuergesetz noch kommen.'
  en: 'For the years 2021 to 2026, the advance return period in the founding year and the following year depends on the expected tax (§ 18(2) sentence 6 UStG). From 2027, sentence 4 of the law applies again:
    in the year of founding and the following year, you file the advance return monthly. If you founded in 2026, 2027 is your following year – you then file monthly advance returns; the suspension only
    covers the years up to 2026. The advance return is due by the 10th day after the end of the month, with a permanent filing extension one month later (§ 18(1) UStG, §§ 46 et seq. UStDV). As of October
    2026 – an extension has not been passed, but could still come with the annual tax act.'
- de: Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel (§ 152
    Abs. 1 bis 3 AO). Er beträgt für jeden angefangenen Monat 0,25 % der festgesetzten Steuer abzüglich Vorauszahlungen und anzurechnender Steuerabzugsbeträge, mindestens 25 € für jeden angefangenen Monat,
    höchstens 25.000 € (§ 152 Abs. 5 Satz 2, Abs. 10 AO). Das Finanzamt kann die Besteuerungsgrundlagen schätzen (§ 162 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen
    (§§ 328, 329 AO).
  en: If you file the return late, the tax office can impose a late-filing surcharge; if it is not filed within 14 months after the end of the calendar year, it generally must do so (§ 152(1) to (3) AO).
    It amounts to 0.25% of the assessed tax less advance payments and creditable withholding taxes for each month or part of a month, at least €25 for each month or part of a month, at most €25,000 (§ 152(5)
    sentence 2, (10) AO). The tax office can estimate the tax base (§ 162 AO). The tax office can also enforce filing with a coercive fine of up to €25,000 (§§ 328, 329 AO).
- de: Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel (§ 152
    Abs. 2, 6 AO). Für die Feststellung von Einkünften beträgt er für jeden angefangenen Monat 0,0625 % der positiven Summe der festgestellten Einkünfte, mindestens 25 € für jeden angefangenen Monat, höchstens
    25.000 € (§ 152 Abs. 7, 10 AO); die Pauschale von 25 € je angefangenem Monat (§ 152 Abs. 6 AO) gilt nur, soweit Abs. 7 nicht greift. Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000
    € durchsetzen (§§ 328, 329 AO).
  en: If you file the return late, the tax office can impose a late-filing surcharge; if it is not filed within 14 months after the end of the calendar year, it generally must do so (§ 152(2), (6) AO).
    For the determination of income it amounts to 0.0625% of the positive total of the determined income for each month or part of a month, at least €25 for each month or part of a month, at most €25,000
    (§ 152(7), (10) AO); the flat rate of €25 per month or part of a month (§ 152(6) AO) only applies where paragraph 7 does not. The tax office can also enforce filing with a coercive fine of up to €25,000
    (§§ 328, 329 AO).
- de: Gilt jetzt auch, wenn du bei Unternehmen in anderen EU-Ländern einkaufst, und nur noch bei Geschäften mit Unternehmen.
  en: Now also applies if you buy from businesses in other EU countries, and only to business with companies.
- de: Gilt nur noch bei Bauleistungen für Unternehmen oder öffentliche Auftraggeber; ergänzt, dass die Bescheinigung befristet ist.
  en: Now only applies to construction work for businesses or public-sector clients; added that the certificate is time-limited.
- de: Im Fragebogen gibst du unter anderem an, ob du die Kleinunternehmerregelung nutzt, und schätzt Umsatz und Gewinn. Danach bekommst du deine Steuernummer. Die Frist von einem Monat beginnt mit der Eröffnung
    des Betriebs bzw. der Aufnahme der Tätigkeit (§ 138 Abs. 1b Satz 1, Abs. 4 AO) – bei UG und GmbH also nicht schon mit der Beurkundung oder der Eintragung ins Handelsregister. Ohne Steuernummer (oder
    USt-IdNr.) fehlt auf deinen Rechnungen eine Pflichtangabe (§ 14 Abs. 4 Satz 1 Nr. 2 UStG).
  en: In the questionnaire you state, among other things, whether you use the small business scheme and estimate turnover and profit. You then receive your tax number. The one-month deadline starts when
    the business is opened or the activity begins (§ 138(1b) sentence 1, (4) AO) – for a UG or GmbH, not already with the notarisation or the entry in the commercial register. Without a tax number (or VAT
    ID), your invoices lack a mandatory detail (§ 14(4) sentence 1 no. 2 UStG).
- de: Jede Außerbetriebnahme hat jetzt ihre eigene Monatsfrist, nicht nur die erste.
  en: Each decommissioning now has its own one-month deadline, not just the first.
- de: Jetzt mit Termin – die Anlage EÜR übermittelst du in denselben Fristen wie die Einkommensteuer- bzw. Feststellungserklärung.
  en: Now with a deadline – you submit the Anlage EÜR within the same deadlines as the income tax or separate determination return.
- de: Jetzt mit Termin – die E-Bilanz übermittelst du in denselben Fristen wie die Steuererklärung.
  en: Now with a deadline – you transmit the E-Bilanz within the same deadlines as the tax return.
- de: Kapitalgesellschaften zahlen Körperschaftsteuer und geben dafür jährlich eine Erklärung ab – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten
    Jahres (§ 149 AO). Das Finanzamt kann die Erklärung früher anfordern oder die Frist auf Antrag verlängern (§ 149 Abs. 4, § 109 AO).
  en: Corporations pay corporation tax and file an annual return for it – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after next (§ 149
    AO). The tax office can request the return earlier or extend the deadline on application (§ 149(4), § 109 AO).
- de: Keine Pflicht und kein Bußgeld. Ohne USt-IdNr. kannst du keine steuerfreie innergemeinschaftliche Lieferung abrechnen und keine Zusammenfassende Meldung abgeben (§ 14a Abs. 3, § 18a UStG). Lieferanten
    aus anderen EU-Ländern berechnen dir dann in der Regel ihre eigene Umsatzsteuer.
  en: No obligation and no fine. Without a VAT ID you cannot invoice a tax-exempt intra-EU delivery or file a recapitulative statement (§ 14a(3), § 18a UStG). Suppliers from other EU countries will then
    usually charge you their own VAT.
- de: 'Klargestellt: Der One-Stop-Shop ist ein Wahlrecht – ohne ihn registrierst du dich in jedem Land. Gilt jetzt auch für Kleinunternehmer.'
  en: 'Clarified: The One-Stop-Shop is optional – without it you register in each country. Now also applies to small businesses.'
- de: Nach deinen Angaben liegt dein Umsatz über einer Kleinunternehmergrenze. Überschreitest du im laufenden Jahr 100.000 € (im Gründungsjahr 25.000 €), ist schon der Umsatz, mit dem du die Grenze überschreitest,
    steuerpflichtig.
  en: According to your information, your turnover is above a small business limit. If you exceed €100,000 in the current year (€25,000 in the founding year), the very sale with which you exceed the limit
    is already taxable.
- de: Ohne Freistellungsbescheinigung müssen Auftraggeber einen Teil deiner Rechnung als Bauabzugsteuer einbehalten. Das gilt nur für Bauleistungen an Unternehmer oder juristische Personen des öffentlichen
    Rechts; Privatleute als Bauherren behalten nichts ein (§ 48 Abs. 1 EStG). Bauleistungen sind alle Leistungen, die der Herstellung, Instandsetzung, Instandhaltung, Änderung oder Beseitigung von Bauwerken
    dienen – auch im Handwerk, z. B. eine Elektroinstallation. Eine Frist gibt es nicht; beantrage die Bescheinigung vor der ersten Bauleistung. Sie gilt befristet – die Geltungsdauer steht in der Bescheinigung
    (§ 48b Abs. 3 EStG); beantrage rechtzeitig vor Ablauf eine neue.
  en: Without an exemption certificate, clients must withhold part of your invoice as construction withholding tax. This only applies to construction work for businesses or legal entities under public law;
    private individuals as builders withhold nothing (§ 48(1) EStG). Construction work means any work serving the construction, repair, maintenance, alteration or demolition of buildings – including in
    skilled trades, e.g. an electrical installation. There is no deadline; apply for the certificate before your first construction job. It is time-limited – the period of validity is stated in the certificate
    (§ 48b(3) EStG); apply for a new one in good time before it expires.
- de: Verkaufst du an Privatpersonen in anderen EU-Ländern über der Lieferschwelle von 10.000 €, meldest du diese Umsätze vierteljährlich im One-Stop-Shop (oder registrierst dich in jedem Land) – bis zum
    Ende des Monats nach dem Quartal.
  en: If you sell to consumers in other EU countries above the €10,000 delivery threshold, you report these sales quarterly in the One-Stop-Shop (or register in each country) – by the end of the month after
    the quarter.
- de: Welche Angaben eine Rechnung braucht, regelt § 14 UStG. Für Kleinbetragsrechnungen bis 250 € brutto gelten Erleichterungen (§ 33 UStDV). Kleinunternehmer weisen darauf hin, dass die Steuerbefreiung
    für Kleinunternehmer gilt (§ 34a UStDV). Zur Rechnung verpflichtet bist du bei Leistungen an andere Unternehmer für deren Unternehmen, an juristische Personen, die keine Unternehmer sind, und bei steuerpflichtigen
    Werklieferungen oder sonstigen Leistungen im Zusammenhang mit einem Grundstück – dann auch gegenüber Privatkunden; nicht bei Umsätzen, die nach § 4 Nr. 8 bis 29 UStG steuerfrei sind. In diesen Fällen
    stellst du die Rechnung innerhalb von sechs Monaten nach Ausführung der Leistung aus (§ 14 Abs. 2 Satz 2 Nr. 1 bis 3 UStG). Amtlos nennt dafür keinen eigenen Termin, weil es den Tag der Leistung nicht
    kennt.
  en: Which details an invoice needs is set out in § 14 UStG. Small-amount invoices up to €250 gross have simplified requirements (§ 33 UStDV). Small businesses state that the small business exemption applies
    (§ 34a UStDV). You are obliged to issue an invoice for supplies to other businesses for their business, to legal persons that are not businesses, and for taxable work deliveries or other services in
    connection with a property – then also to private customers; not for transactions exempt under § 4 nos. 8 to 29 UStG. In these cases you issue the invoice within six months after the supply (§ 14(2)
    sentence 2 nos. 1 to 3 UStG). Amtlos does not show its own deadline for this because it does not know the day of the supply.
- de: Wenn du Bauleistungen für Unternehmen oder öffentliche Auftraggeber erbringst, beantragst du beim Finanzamt eine Freistellungsbescheinigung, damit deine Auftraggeber keine Bauabzugsteuer einbehalten.
  en: If you provide construction work for businesses or public-sector clients, you apply to the tax office for an exemption certificate so that your clients do not withhold construction withholding tax.
- de: Wenn du mit Unternehmen in anderen EU-Ländern Geschäfte machst – als Kunde oder als Lieferant –, beantragst du eine USt-IdNr. beim Bundeszentralamt für Steuern.
  en: If you do business with companies in other EU countries – as a customer or as a supplier –, you apply for a VAT ID at the Federal Central Tax Office.
- de: 'Wer Umsatzsteuer auf Rechnungen ausweist, gibt je nach Höhe der Steuer im Vorjahr monatlich oder vierteljährlich eine Voranmeldung über ELSTER ab. Liegt dein Umsatz über der Kleinunternehmergrenze,
    gilt die Pflicht sicher – offen ist dann nur, ob monatlich oder vierteljährlich. Den Rhythmus legt das Finanzamt fest – er steht im Schreiben des Finanzamts. Weißt du ihn nicht und kennt Amtlos die
    Steuer des Vorjahres nicht, rechnet Amtlos vorläufig mit monatlich – das ist der frühere Termin; vierteljährlich wäre zu spät, wenn das Finanzamt monatlich verlangt. Hast du 2026 oder später gegründet,
    gibst du ab 2027 im Gründungsjahr und im Folgejahr monatlich ab (§ 18 Abs. 2 Satz 4 UStG). Eine Dauerfristverlängerung bleibt auf Antrag möglich, auch wenn du als Neugründer monatlich abgibst: Die Voranmeldung
    ist dann einen Monat später fällig (§ 18 Abs. 6 UStG, §§ 46 bis 48 UStDV), und du zahlst einmal im Jahr eine Sondervorauszahlung – siehe „Sondervorauszahlung zur Umsatzsteuer leisten“. Amtlos bereitet
    die Zahlen vor; du übermittelst selbst.'
  en: 'Anyone who shows VAT on invoices files an advance return via ELSTER monthly or quarterly, depending on last year''s tax. If your turnover is above the small business limit, the obligation definitely
    applies – the only open question is whether monthly or quarterly. The tax office sets the frequency – it is stated in the tax office''s letter. If you don''t know it and Amtlos does not know last year''s
    tax, Amtlos provisionally assumes monthly – the earlier deadline; quarterly would be too late if the tax office requires monthly returns. If you founded in 2026 or later, from 2027 you file monthly
    in the founding year and the following year (§ 18(2) sentence 4 UStG). A permanent deadline extension (Dauerfristverlängerung) remains possible on application, even if you file monthly as a new business: the advance
    return is then due one month later (§ 18(6) UStG, §§ 46 to 48 UStDV), and you make a special advance payment (Sondervorauszahlung) once a year – see “Make the special advance VAT payment”. Amtlos
    prepares the figures; you submit them yourself.'
- de: Wer nicht zur doppelten Buchführung verpflichtet ist, ermittelt den Gewinn mit der Einnahmen-Überschuss-Rechnung. Das gilt auch für eingetragene Kaufleute unter den Grenzen des § 241a HGB und für
    Gewerbetreibende, denen das Finanzamt keine Buchführungspflicht mitgeteilt hat. Die Anlage EÜR übermittelst du mit der Einkommensteuer- bzw. Feststellungserklärung, also in denselben Fristen (§ 149
    AO) – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres.
  en: Anyone not obliged to keep double-entry books determines their profit with the cash-basis accounts (Einnahmen-Überschuss-Rechnung). This also applies to registered merchants below the limits of §
    241a HGB and to traders whom the tax office has not notified of an obligation to keep books. You submit the Anlage EÜR with the income tax or separate determination return, i.e. within the same deadlines
    (§ 149 AO) – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after next.
- de: Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben
    (§ 240 Abs. 1, 3 AO). Wer die Vorauszahlung nicht, nicht vollständig oder nicht rechtzeitig zahlt, riskiert außerdem ein Bußgeld bis 30.000 € (§ 26a Abs. 1, 3 UStG in Verbindung mit § 18 Abs. 1 Satz
    4 UStG). Für eine verspätete Voranmeldung kann das Finanzamt einen Verspätungszuschlag festsetzen (§ 152 Abs. 1 AO). Gibst du keine Voranmeldung ab, kann das Finanzamt die Steuer schätzen (§ 162 AO);
    die Nichtabgabe kann als Steuerhinterziehung strafbar sein (§ 370 Abs. 1 Nr. 2 AO).
  en: If you don't pay on time, a late-payment surcharge of 1% of the overdue amount rounded down to €50 is charged for each month or part of a month; for a delay of up to three days it is not charged (§
    240(1), (3) AO). Anyone who does not pay the advance payment, does not pay it in full or not on time also risks a fine of up to €30,000 (§ 26a(1), (3) UStG in conjunction with § 18(1) sentence 4 UStG).
    For a late advance return, the tax office can impose a late-filing surcharge (§ 152(1) AO). If you don't file an advance return, the tax office can estimate the tax (§ 162 AO); not filing can be punishable
    as tax evasion (§ 370(1) no. 2 AO).
- de: Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben
    – diese Schonfrist gilt nur bei Überweisung, nicht bei Bar- oder Scheckzahlung (§ 240 Abs. 1, 3 AO).
  en: If you don't pay on time, a late-payment surcharge of 1% of the overdue amount rounded down to €50 is charged for each month or part of a month; for a delay of up to three days it is not charged –
    this grace period only applies to bank transfers, not to cash or cheque payments (§ 240(1), (3) AO).
- de: Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben
    – diese Schonfrist gilt nur bei Überweisung, nicht bei Bar- oder Scheckzahlung (§ 240 Abs. 1, 3 AO, für die Gewerbesteuer über § 1 Abs. 2 Nr. 5 AO).
  en: If you don't pay on time, a late-payment surcharge of 1% of the overdue amount rounded down to €50 is charged for each month or part of a month; for a delay of up to three days it is not charged –
    this grace period only applies to bank transfers, not to cash or cheque payments (§ 240(1), (3) AO, for trade tax via § 1(2) no. 5 AO).
- de: § 5b EStG nennt kein eigenes Bußgeld. Das Finanzamt kann die Übermittlung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO). Die Steuererklärung ist erst mit der E-Bilanz vollständig; bei Verspätung
    droht ein Verspätungszuschlag (§ 152 AO).
  en: § 5b EStG provides no fine of its own. The tax office can enforce transmission with a coercive fine of up to €25,000 (§§ 328, 329 AO). The tax return is only complete with the E-Bilanz; if it is late,
    a late-filing surcharge may be imposed (§ 152 AO).
- de: Abwasser mit Öl oder Kraftstoff, etwa vom Waschplatz oder Werkstattboden, läuft über einen Leichtflüssigkeitsabscheider. Betreiber lassen ihn regelmäßig warten, die Inhalte durch einen Fachbetrieb
    entsorgen und in festen Abständen prüfen. Üblich sind eine monatliche Eigenkontrolle, eine Wartung alle sechs Monate und alle fünf Jahre eine Generalinspektion (DIN 1999-100, DIN EN 858-2, Anhang 49
    AbwV). Welche Abstände und Nachweise für dich gelten, ergibt sich aus der Abwassersatzung deiner Gemeinde und den Vorgaben der Wasserbehörde – frag dort nach. Lagerst du Frisch- oder Altöl, gelten ab
    einem bestimmten Anlagenvolumen die Anforderungen der AwSV; die Schwellen hängen von der Gefährdungsstufe ab.
  en: Waste water containing oil or fuel, for example from a washing bay or workshop floor, runs through a light-liquid separator. Operators have it serviced regularly, have its contents disposed of by
    a specialist company and have it inspected at fixed intervals. Usual are a monthly self-check, servicing every six months and a general inspection every five years (DIN 1999-100, DIN EN 858-2, Annex
    49 AbwV). Which intervals and records apply to you follows from your municipality's waste water bylaw and the requirements of the water authority – ask there. If you store fresh or used oil, the requirements
    of the AwSV (Ordinance on Facilities for Handling Substances Hazardous to Water) apply above a certain facility volume; the thresholds depend on the hazard level.
- de: Als Hersteller – dazu zählt auch, wer unter eigenem Namen oder eigener Marke verkauft – bringst du ein Verbraucherprodukt erst in Verkehr, wenn es eine Typen-, Chargen- oder Seriennummer oder ein
    anderes Element zur Identifizierung trägt (Art. 9 Abs. 5 GPSR), dein Name, deine Handelsmarke, Postanschrift und elektronische Adresse auf dem Produkt, der Verpackung oder einer beigefügten Unterlage
    stehen (Art. 9 Abs. 6) und Anweisungen und Sicherheitsinformationen beiliegen (Art. 9 Abs. 7). Dazu gehören eine interne Risikoanalyse und technische Unterlagen (Art. 9 Abs. 2, 3). Führst du Produkte
    von außerhalb der EU ein, gibst du zusätzlich deine eigenen Angaben an (Art. 11 GPSR). Für Kosmetik geht die Kosmetikverordnung vor, die GPSR gilt ergänzend (Art. 2 Abs. 1). Lebensmittel fallen nicht
    unter die Verordnung.
  en: As a manufacturer – this includes anyone who sells under their own name or brand – you only place a consumer product on the market once it bears a type, batch or serial number or another element allowing
    its identification (Art. 9(5) GPSR), your name, trade mark, postal address and electronic address are on the product, its packaging or an accompanying document (Art. 9(6)) and instructions and safety
    information are enclosed (Art. 9(7)). This also includes an internal risk analysis and technical documentation (Art. 9(2), (3)). If you import products from outside the EU, you additionally state your
    own details (Art. 11 GPSR). For cosmetics the Cosmetics Regulation takes precedence and the GPSR applies in addition (Art. 2(1)). Food is not covered by the Regulation.
- de: Als Immobilienmakler, Wohnimmobilienverwalter, Versicherungs- oder Finanzanlagenvermittler bildest du dich regelmäßig weiter.
  en: As a real estate agent, residential property manager, insurance intermediary or financial investment intermediary, you complete regular further training.
- de: Bei voraussichtlich hohem Risiko für die Betroffenen ist vorab eine Folgenabschätzung durchzuführen und zu dokumentieren. Arbeitest du allein mit den Daten deiner Patientinnen oder Kunden – etwa als
    Ärztin oder Therapeut, ähnlich wohl auch als Trainerin mit Gesundheitsfragebogen –, gilt das in der Regel nicht als umfangreiche Verarbeitung (Erwägungsgrund 91 DSGVO). Dann genügt es meist, kurz festzuhalten,
    warum keine Folgenabschätzung nötig ist. Ziehe außerdem die Liste der Datenschutzkonferenz heran, für welche Verarbeitungen immer eine Folgenabschätzung nötig ist (Muss-Liste) – darauf stehen zum Beispiel
    die umfangreiche Videoüberwachung öffentlich zugänglicher Bereiche und die Ortung von Beschäftigten.
  en: If there is likely to be a high risk for the persons concerned, an impact assessment must be carried out and documented in advance. If you work alone with the data of your patients or clients – for
    example as a doctor or therapist, probably also as a trainer with a health questionnaire – this is usually not considered large-scale processing (recital 91 GDPR). It is then usually enough to note
    briefly why no impact assessment is needed. Also consult the list of the German Data Protection Conference (DSK) of processing operations that always require an impact assessment (mandatory list) –
    it includes, for example, large-scale video surveillance of publicly accessible areas and the location tracking of employees.
- de: Betriebe mit Tätigkeiten am Menschen – Friseur, Kosmetik, Tattoo, Piercing, Fußpflege – brauchen nach den Hygieneverordnungen der Länder einen Hygieneplan. Die Länder erlassen diese Verordnungen auf
    Grundlage von § 17 Abs. 4 IfSG, zum Beispiel die HygieneVO in Baden-Württemberg, die HygV in Bayern und die HygVO in Nordrhein-Westfalen. Den Hygieneplan legst du vor Aufnahme der Tätigkeit fest und
    hältst ihn laufend aktuell. Für Lebensmittelbetriebe gilt stattdessen die Lebensmittelhygiene nach der Verordnung (EG) Nr. 852/2004.
  en: Businesses that work on people – hairdressing, cosmetics, tattooing, piercing, foot care – need a hygiene plan under the hygiene ordinances of the federal states. The states issue these ordinances
    on the basis of § 17(4) IfSG, for example the HygieneVO in Baden-Württemberg, the HygV in Bavaria and the HygVO in North Rhine-Westphalia. You set up the hygiene plan before starting the activity and
    keep it up to date. For food businesses, food hygiene under Regulation (EC) No 852/2004 applies instead.
- de: Betroffen sind Dienstleistungen im elektronischen Geschäftsverkehr (§ 1 Abs. 3 BFSG) – etwa Onlineshops und Buchungstools – sowie unter anderem Bankdienstleistungen, Telekommunikationsdienste, Dienste
    im Personenverkehr und E-Books. Ausgenommen sind Kleinstunternehmen mit weniger als 10 Beschäftigten und höchstens 2 Mio. € Jahresumsatz oder höchstens 2 Mio. € Jahresbilanzsumme (§ 3 Abs. 3 BFSG) –
    diese Ausnahme gilt nur für Dienstleistungen. Amtlos fragt nur den Umsatz ab; liegt deine Bilanzsumme bei höchstens 2 Mio. €, greift die Ausnahme auch bei höherem Umsatz. Der Online-Check macht automatisierte
    Basistests nach WCAG.
  en: This covers services in electronic commerce (§ 1(3) BFSG) – such as online shops and booking tools – as well as, among others, banking services, telecommunications services, passenger transport services
    and e-books. Micro-enterprises with fewer than 10 employees and an annual turnover of no more than €2 million or an annual balance sheet total of no more than €2 million are exempt (§ 3(3) BFSG) – this
    exemption applies only to services. Amtlos only asks for your turnover; if your balance sheet total is no more than €2 million, the exemption also applies with a higher turnover. The online check runs
    automated basic tests based on WCAG.
- de: Betroffene haben unter anderem Rechte auf Auskunft, Berichtigung, Löschung und Widerspruch. Du antwortest innerhalb eines Monats ab Eingang (Art. 12 Abs. 3 DSGVO); fällt das Fristende auf einen Samstag,
    Sonntag oder Feiertag, endet die Frist am nächsten Werktag (Art. 3 Verordnung (EWG, Euratom) Nr. 1182/71). Ist eine Anfrage komplex oder sind es viele, kannst du die Frist um zwei Monate verlängern
    – das teilst du der Person innerhalb des ersten Monats mit. Amtlos zeigt die Frist ab Eingang und führt die Anfrage bis zur Antwort.
  en: Data subjects have, among other things, rights of access, rectification, erasure and objection. You reply within one month of receipt (Art. 12(3) GDPR); if the deadline ends on a Saturday, Sunday
    or public holiday, it ends on the next working day (Art. 3 Regulation (EEC, Euratom) No 1182/71). If a request is complex or there are many requests, you can extend the deadline by two months – you
    inform the person of this within the first month. Amtlos shows the deadline from receipt and tracks the request until it is answered.
- de: Bußgeld bis 10 Mio. € oder bei Unternehmen bis 2 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 4 Buchst. a DSGVO).
  en: Fine of up to €10 million or, for undertakings, up to 2% of the worldwide annual turnover of the preceding year, whichever is higher (Art. 83(4)(a) GDPR).
- de: Bußgeld bis 10.000 €, wenn du ein Produkt bereitstellst, obwohl du es für nicht sicher hältst oder die vorgeschriebenen Angaben fehlen (§ 28 Abs. 2 Nr. 21, Abs. 3 ProdSG in Verbindung mit Art. 12
    Abs. 3 GPSR).
  en: Fine of up to €10,000 if you make a product available although you consider it unsafe or the required information is missing (§ 28(2) no. 21, (3) ProdSG in conjunction with Art. 12(3) GPSR).
- de: Bußgeld bis 10.000 €, wenn ein Produkt im Fernabsatz ohne die Angaben nach Art. 19 GPSR bereitgestellt wird (§ 28 Abs. 2 Nr. 26, Abs. 3 ProdSG).
  en: Fine of up to €10,000 if a product is made available by distance selling without the information under Art. 19 GPSR (§ 28(2) no. 26, (3) ProdSG).
- de: Bußgeld bis 10.000 €, wenn vor dem Inverkehrbringen Pflichtangaben fehlen oder Anweisungen und Sicherheitsinformationen nicht beigefügt sind (§ 28 Abs. 2 Nr. 5, 6, Abs. 3 ProdSG); auch Risikoanalyse,
    technische Unterlagen und Identifizierung sind bußgeldbewehrt (§ 28 Abs. 2 Nr. 1 bis 4 ProdSG).
  en: Fine of up to €10,000 if mandatory information is missing before placing on the market or instructions and safety information are not enclosed (§ 28(2) nos. 5, 6, (3) ProdSG); the risk analysis, technical
    documentation and identification are also subject to fines (§ 28(2) nos. 1 to 4 ProdSG).
- de: Bußgeld bis 15 Mio. € oder 3 % des weltweiten Jahresumsatzes, bei kleinen und mittleren Unternehmen der niedrigere Betrag (Art. 99 Abs. 4, 6 KI-VO).
  en: Fine of up to €15 million or 3 % of worldwide annual turnover, for small and medium-sized enterprises whichever is lower (Art. 99(4), (6) AI Act).
- de: Bußgeld bis 20 Mio. € oder bei Unternehmen bis 4 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 5 Buchst. b DSGVO).
  en: Fine of up to €20 million or, for undertakings, up to 4% of the worldwide annual turnover of the preceding year, whichever is higher (Art. 83(5)(b) GDPR).
- de: Bußgeld bis 25.000 €, soweit die Hygieneverordnung deines Landes für den Verstoß auf § 73 Abs. 1a Nr. 24 IfSG verweist (§ 73 Abs. 1a Nr. 24, Abs. 2 IfSG).
  en: Fine of up to €25,000 where the hygiene ordinance of your federal state refers to § 73(1a) no. 24 IfSG for the infringement (§ 73(1a) no. 24, (2) IfSG).
- de: Bußgeld bis 25.000 €, wenn Gesamt- oder Grundpreis nicht, nicht richtig oder nicht vollständig angegeben sind (§ 20 Nr. 1 PAngV in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954).
  en: Fine of up to €25,000 if the total or unit price is not stated, or not stated correctly or completely (§ 20 no. 1 PAngV in conjunction with § 3(1) sentence 1 no. 2, (2) WiStrG 1954).
- de: Bußgeld bis 25.000 €, wenn Preise nicht in einem Preisverzeichnis angegeben sind oder das Preisverzeichnis nach § 13 Abs. 2 Satz 1 PAngV nicht oder nicht rechtzeitig vorgelegt wird (§ 20 Nr. 1, 4
    PAngV in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954). Das Preisverzeichnis neben dem Eingang (§ 13 Abs. 2 Satz 2 PAngV) ist in § 20 PAngV nicht genannt.
  en: Fine of up to €25,000 if prices are not stated in a price list or the price list under § 13(2) sentence 1 PAngV is not presented or not presented in time (§ 20 nos. 1, 4 PAngV in conjunction with
    § 3(1) sentence 1 no. 2, (2) WiStrG 1954). The price list next to the entrance (§ 13(2) sentence 2 PAngV) is not listed in § 20 PAngV.
- de: Bußgeld bis 25.000 €, wenn das Preisverzeichnis bei unzumutbarem Aushang nicht zur Einsicht bereitgehalten wird (§ 20 Nr. 2 PAngV) oder Gesamt- oder Grundpreise nicht richtig angegeben sind (§ 20
    Nr. 1 PAngV), jeweils in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954. Der Aushang selbst (§ 12 Abs. 2 Satz 1, 2 PAngV) ist in § 20 PAngV nicht genannt.
  en: Fine of up to €25,000 if, where posting is unreasonable, the price list is not kept available for inspection (§ 20 no. 2 PAngV) or total or unit prices are not stated correctly (§ 20 no. 1 PAngV),
    in each case in conjunction with § 3(1) sentence 1 no. 2, (2) WiStrG 1954. Posting the list itself (§ 12(2) sentences 1, 2 PAngV) is not listed in § 20 PAngV.
- de: Bußgeld bis 30.000 € für dich als Unternehmer, wenn du nicht dafür sorgst, dass deine Fahrer Lenkzeiten, Fahrtunterbrechungen und Ruhezeiten einhalten (§ 8a Abs. 1 Nr. 2, Abs. 4 FPersG); für Fahrer
    bis 5.000 € (§ 8a Abs. 2 Nr. 1, Abs. 4 FPersG). Verstöße beim Fahrtenschreiber ahndet § 8 FPersG in Verbindung mit der FPersV.
  en: Fine of up to €30,000 for you as the business owner if you do not ensure that your drivers comply with driving times, breaks and rest periods (§ 8a(1) no. 2, (4) FPersG); for drivers up to €5,000
    (§ 8a(2) no. 1, (4) FPersG). Tachograph infringements are punished under § 8 FPersG in conjunction with the FPersV.
- de: Bußgeld bis 5.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig weiterbildest (§ 144 Abs. 2 Nr. 5a, 7d, Abs. 4 GewO). Für Finanzanlagenvermittler und Honorar-Finanzanlagenberater
    ist ein Verstoß nach § 26 FinVermV bußgeldbewehrt.
  en: Fine of up to €5,000 if you do not complete the required training, or not correctly, completely or in time (§ 144(2) nos. 5a, 7d, (4) GewO). For financial investment intermediaries and fee-based financial
    investment advisers, an infringement is subject to a fine under § 26 FinVermV.
- de: Bußgeld bis 50.000 € (§ 33 Abs. 2 Nr. 1, Abs. 6 DDG), dazu Abmahnungen nach dem Wettbewerbsrecht.
  en: Fine of up to €50,000 (§ 33(2) no. 1, (6) DDG), plus warning letters under competition law.
- de: Das BFSG nennt die betroffenen Produkte abschließend (§ 1 Abs. 2 BFSG). Dazu gehören unter anderem Hardwaresysteme für Verbraucher wie Computer, Zahlungsterminals, Selbstbedienungsterminals, Router
    und E-Book-Reader. Prüfe, ob deine Produkte dazugehören.
  en: The BFSG lists the affected products exhaustively (§ 1(2) BFSG). They include, among others, consumer hardware systems such as computers, payment terminals, self-service terminals, routers and e-book
    readers. Check whether your products are among them.
- de: Das Hinweisgeberschutzgesetz verlangt von Beschäftigungsgebern mit in der Regel mindestens 50 Beschäftigten eine interne Meldestelle (§ 12 Abs. 2 HinSchG). Gezählt werden Köpfe, nicht Vollzeitstellen
    – Teilzeitkräfte zählen voll. Beschäftigte sind neben Arbeitnehmerinnen und Arbeitnehmern unter anderem auch Auszubildende und Beamte (§ 3 Abs. 8 HinSchG).
  en: The Whistleblower Protection Act requires employers with usually at least 50 employees to have an internal reporting channel (§ 12(2) HinSchG). Heads are counted, not full-time positions – part-time
    staff count in full. Besides employees, people employed include, among others, apprentices and civil servants (§ 3(8) HinSchG).
- de: Das Impressum nennt unter anderem Name, Anschrift und Kontakt, bei Gesellschaften auch Vertretung und Register. Auch ein geschäftliches Profil zum Beispiel bei Instagram oder Facebook ist ein digitaler
    Dienst mit Impressumspflicht – verlinke dort dein Impressum. Je nach Rechtsform gehören dazu Rechtsform und Vertretung, Register und Registernummer, Umsatzsteuer- oder Wirtschafts-Identifikationsnummer,
    die zuständige Kammer oder Aufsichtsbehörde und das Kapital nur, wenn du Angaben dazu machst – die Vorlage „Impressum“ führt dich durch die Liste. Erledigt ist es, wenn es auf deiner Website veröffentlicht
    und verlinkt ist.
  en: The legal notice states, among other things, name, address and contact details, for companies also representation and register. A business profile, for example on Instagram or Facebook, is also a
    digital service requiring a legal notice – link your legal notice there. Depending on the legal form, this includes the legal form and representation, register and register number, VAT or business identification
    number, the competent chamber or supervisory authority and the capital only if you give details of it – the "Legal notice" template guides you through the list. It is done once it is published and linked
    on your website.
- de: Das NIS-2-Umsetzungsgesetz gilt seit 6.12.2025. Wichtige und besonders wichtige Einrichtungen registrieren sich spätestens drei Monate, nachdem sie erstmals oder erneut darunter fallen, beim BSI (§
    33 BSIG). Für Unternehmen, die schon bei Inkrafttreten betroffen waren, lief die Frist am 6.3.2026 ab; dass das BSI Nachmeldungen bis 31.7.2026 hingenommen hat, war keine gesetzliche Frist. Amtlos rechnet
    die drei Monate ab dem Tag, den du als Beginn der Betroffenheit angibst. Die Registrierung ist Voraussetzung für die Meldewege bei Sicherheitsvorfällen.
  en: The NIS-2-Umsetzungsgesetz (German implementation act) has applied since 6.12.2025. Important and essential entities register with the BSI no later than three months after they first or again fall
    under it (§ 33 BSIG). For companies already affected when it entered into force, the deadline expired on 6.3.2026; the fact that the BSI accepted late registrations until 31.7.2026 was not a statutory
    deadline. Amtlos counts the three months from the day you state as the start of being covered. Registration is a prerequisite for the reporting channels for security incidents.
- de: Das Verzeichnis beschreibt je Verarbeitung Zweck, betroffene Personen, Datenarten, Empfänger und Löschfristen. Die Ausnahme für Unternehmen mit weniger als 250 Beschäftigten (Art. 30 Abs. 5 DSGVO)
    greift nicht, wenn die Verarbeitung nicht nur gelegentlich erfolgt oder besondere Daten wie Gesundheitsdaten umfasst – nach Auffassung der Aufsichtsbehörden ist das bei Kunden- und Beschäftigtendaten
    praktisch immer so. Amtlos hilft beim Anlegen und erzeugt das Verzeichnis als PDF.
  en: For each processing activity, the record describes the purpose, people affected, types of data, recipients and deletion periods. The exemption for companies with fewer than 250 employees (Art. 30(5)
    GDPR) does not apply if the processing is not only occasional or includes special categories of data such as health data – according to the supervisory authorities this is practically always the case
    for customer and employee data. Amtlos helps you set it up and generates the record as a PDF.
- de: Daten deiner Beschäftigten verarbeitest du, soweit es für die Durchführung des Arbeitsvertrags erforderlich ist oder ein Gesetz es verlangt, zum Beispiel für Lohn, Sozialversicherung und Steuer. Gesundheitsdaten
    wie Krankmeldungen oder die elektronische Arbeitsunfähigkeitsbescheinigung verarbeitest du, soweit du sie für deine Pflichten aus dem Arbeitsrecht und dem Recht der sozialen Sicherheit brauchst (Art.
    9 Abs. 2 Buchst. b DSGVO). Amtlos selbst speichert nur das Nötigste (Name, Beschäftigungsart, Eintritt und Austritt).
  en: You process your staff's data as far as necessary to perform the employment contract or required by law, for example for payroll, social security and tax. You process health data such as sick notes
    or the electronic certificate of incapacity for work as far as you need them for your obligations under employment law and social security law (Art. 9(2)(b) GDPR). Amtlos itself stores only the minimum
    (name, type of employment, start and end date).
- de: Daten dürfen nur so lange gespeichert werden, wie es für den Zweck nötig ist. Gesetzliche Aufbewahrungsfristen, etwa nach § 147 AO und § 257 HGB, gehen vor (Art. 17 Abs. 3 Buchst. b DSGVO); danach
    löschst du.
  en: Data may only be stored as long as necessary for the purpose. Statutory retention periods, for example under § 147 AO and § 257 HGB, take precedence (Art. 17(3)(b) GDPR); after that, you delete.
- de: Dein Betrieb ist groß genug (mindestens 50 Beschäftigte oder mehr als 10 Mio. € Umsatz) oder in einer Branche, in der NIS2 gelten kann.
  en: Your business is large enough (at least 50 employees or more than €10 million turnover) or in a sector in which NIS2 may apply.
- de: Der Vertrag regelt, wie der Dienstleister die Daten nach deinen Weisungen verarbeitet; du schließt ihn vor Beginn der Verarbeitung ab. Einen Auftragsverarbeitungsvertrag brauchst du etwa mit IT-Hoster,
    Cloud-Anbieter, Newsletter-Tool oder Kassen-Cloud. Keinen brauchst du mit Steuerberatung, Rechtsanwälten, Banken, der Post oder einem Lohnbüro mit eigener Fachverantwortung – sie sind selbst Verantwortliche.
    Amtlos führt die Liste deiner Dienstleister und legt die Verträge ab.
  en: The agreement governs how the service provider processes the data on your instructions; you conclude it before the processing starts. You need a data processing agreement with, for example, an IT
    host, cloud provider, newsletter tool or cloud till system. You do not need one with tax advisers, lawyers, banks, the post office or a payroll office with its own professional responsibility – they
    are controllers themselves. Amtlos keeps the list of your service providers and stores the agreements.
- de: Die 72 Stunden laufen stundengenau ab dem Zeitpunkt, an dem du von der Panne erfährst, auch über das Wochenende (Art. 33 Abs. 1 DSGVO). Keine Meldung ist nötig, wenn voraussichtlich kein Risiko für
    die Betroffenen besteht – das entscheidest und dokumentierst du. Zuständig ist die Datenschutz-Aufsichtsbehörde deines Landes, in Baden-Württemberg zum Beispiel der Landesbeauftragte für den Datenschutz
    und die Informationsfreiheit in Stuttgart, in Bayern das Bayerische Landesamt für Datenschutzaufsicht in Ansbach; Amtlos nennt dir die Behörde zu deinem Bundesland. Amtlos zeigt einen Countdown und
    erstellt einen Meldeentwurf.
  en: The 72 hours run to the hour from the moment you become aware of the breach, including over the weekend (Art. 33(1) GDPR). No report is required if there is likely no risk to the people affected –
    you decide and document this. The competent authority is the data protection supervisory authority of your federal state, for example in Baden-Württemberg the State Commissioner for Data Protection
    and Freedom of Information in Stuttgart, in Bavaria the Bavarian Data Protection Authority (BayLDA) in Ansbach; Amtlos names the authority for your federal state. Amtlos shows a countdown and creates
    a draft report.
- de: Die Beiträge zu den Sozialkassen sind Pflicht (VTV, allgemeinverbindlich bzw. SokaSiG); nicht gemeldete Beiträge fordert die SOKA-BAU bis zu vier Jahre nach, mit Verzugszinsen. Ein Bußgeld gibt es
    nicht.
  en: Contributions to the social funds are mandatory (VTV, generally binding or SokaSiG); SOKA-BAU claims unreported contributions retroactively for up to four years, with default interest. There is no
    fine.
- de: Die Datenschutzerklärung muss ab der Live-Schaltung deiner Website bereitstehen und von jeder Seite erreichbar sein. Inhaltlich folgt sie den Informationspflichten der DSGVO. Erledigt ist sie, wenn
    sie auf deiner Website veröffentlicht ist.
  en: The privacy policy must be available from the moment your website goes live and be accessible from every page. Its content follows the information obligations of the GDPR. It is done once it is published
    on your website.
- de: Die Information nennt unter anderem Zweck, Rechtsgrundlage, Empfänger, Speicherdauer und die Rechte der Betroffenen; die Pflichtinhalte nach Art. 13 Abs. 1 und 2 DSGVO findest du als Checkliste in
    der Vorlage „Datenschutzinformation“. Du informierst bei der Erhebung der Daten (Art. 13 DSGVO); erhältst du die Daten nicht von der Person selbst, spätestens innerhalb eines Monats (Art. 14 DSGVO).
  en: The information states, among other things, purpose, legal basis, recipients, storage period and the rights of the people concerned; you find the mandatory content under Art. 13(1) and (2) GDPR as
    a checklist in the "Data protection information" template. You inform people when the data are collected (Art. 13 GDPR); if you do not obtain the data from the person themselves, within one month at
    the latest (Art. 14 GDPR).
- de: Die Lenk- und Ruhezeiten der Verordnung (EG) Nr. 561/2006 gelten für die Güterbeförderung mit Fahrzeugen über 3,5 t zulässiger Gesamtmasse (mit Anhänger). Seit dem 1.7.2026 gelten sie auch für Fahrzeuge
    über 2,5 t bis 3,5 t bei grenzüberschreitenden Fahrten und Kabotage; diese Fahrzeuge brauchen einen intelligenten Fahrtenschreiber der neuesten Generation. Die Daten der Fahrerkarte liest du spätestens
    alle 28 Tage aus, den Massenspeicher des Fahrtenschreibers spätestens alle 90 Tage, und bewahrst sie ein Jahr auf (§ 2a FPersV). Ausnahmen gibt es unter anderem für Werkverkehr bis 3,5 t (Art. 3 Buchst.
    ha VO (EG) Nr. 561/2006) und für Handwerker mit Fahrzeugen bis 7,5 t im Umkreis von 100 km, wenn das Fahren nicht ihre Haupttätigkeit ist (Art. 3 Buchst. aa VO (EG) Nr. 561/2006).
  en: The driving and rest times of Regulation (EC) No 561/2006 apply to the carriage of goods with vehicles over 3.5 t permissible total mass (including trailer). Since 1.7.2026 they also apply to vehicles
    over 2.5 t up to 3.5 t on cross-border trips and cabotage; these vehicles need a smart tachograph of the latest generation. You download the driver card data at least every 28 days and the tachograph's
    mass memory at least every 90 days, and keep the data for one year (§ 2a FPersV). Exemptions exist, among others, for own-account transport up to 3.5 t (Art. 3(ha) Regulation (EC) No 561/2006) and for
    craftspeople with vehicles up to 7.5 t within a radius of 100 km if driving is not their main activity (Art. 3(aa) Regulation (EC) No 561/2006).
- de: Die Preisangabenverordnung regelt, wie Preise gegenüber Verbrauchern anzugeben sind (§§ 3, 4 PAngV). Den Grundpreis gibst du je 1 kg, 1 l, 1 m, 1 m² oder 1 m³ an (§ 5 PAngV); bei Waren bis 10 g oder
    10 ml ist kein Grundpreis nötig.
  en: The Price Indication Ordinance (Preisangabenverordnung) governs how prices must be stated to consumers (§§ 3, 4 PAngV). You state the unit price per 1 kg, 1 l, 1 m, 1 m² or 1 m³ (§ 5 PAngV); for goods
    of up to 10 g or 10 ml no unit price is needed.
- de: Die Produktsicherheitsverordnung gilt seit 13.12.2024. Als Händlerin oder Händler – auch von fremder Markenware – prüfst du vor dem Verkauf mit der gebotenen Sorgfalt, ob Hersteller, gegebenenfalls
    Einführer, die Angaben zur Identifizierung sowie Anweisungen und Sicherheitsinformationen auf dem Produkt, der Verpackung oder einer beigefügten Unterlage stehen (Art. 12 GPSR). Fehlt etwas oder hältst
    du das Produkt für nicht sicher, stellst du es nicht bereit. Stellst du selbst her, verkaufst du unter eigener Marke, führst du von außerhalb der EU ein oder verkaufst du online, gelten zusätzliche
    Pflichten in eigenen Einträgen. Für Kosmetik geht die Kosmetikverordnung vor, die GPSR gilt ergänzend (Art. 2 Abs. 1). Lebensmittel fallen nicht unter die Verordnung.
  en: The Product Safety Regulation has applied since 13.12.2024. As a retailer – including of third-party brand goods – you check with due care before selling whether the manufacturer, where applicable
    the importer, the identification details and instructions and safety information are on the product, its packaging or an accompanying document (Art. 12 GPSR). If something is missing or you consider
    the product unsafe, you do not make it available. If you manufacture yourself, sell under your own brand, import from outside the EU or sell online, additional obligations apply in separate entries.
    For cosmetics the Cosmetics Regulation takes precedence and the GPSR applies in addition (Art. 2(1)). Food is not covered by the Regulation.
- de: Die Sozialkassen regeln unter anderem Urlaub und Berufsbildung in der Bauwirtschaft. Erfasst ist dein Betrieb, wenn er arbeitszeitlich überwiegend bauliche Leistungen nach § 1 Abs. 2 VTV erbringt
    – prüfe das anhand der Arbeitszeit deiner Beschäftigten. Die Beiträge meldest du monatlich bis zum 15. des Folgemonats.
  en: The social funds cover, among other things, holidays and vocational training in the construction industry. Your business is covered if, measured by working time, it mainly provides construction work
    under § 1(2) VTV – check this on the basis of your employees' working time. You report the contributions monthly by the 15th of the following month.
- de: Du bist als Makler oder als Finanzanlagen-, Versicherungs- oder Darlehensvermittler tätig (Erlaubnis nach § 34c, § 34d, § 34f oder § 34i GewO).
  en: You work as an agent or as a financial investment, insurance or loan intermediary (permit under § 34c, § 34d, § 34f or § 34i GewO).
- de: Du führst ein Verzeichnis, welche Daten über Menschen du wofür verarbeitest – auch als Kleinbetrieb.
  en: You keep a record of which data about people you process and for what purpose – also as a small business.
- de: Du hast eine Erlaubnis nach § 34c, § 34d, § 34f oder § 34h GewO.
  en: You have a permit under § 34c, § 34d, § 34f or § 34h GewO.
- de: Du verkaufst über einen Onlineshop, einen Marktplatz oder eine App.
  en: You sell via an online shop, a marketplace or an app.
- de: 'Ein Datenschutzbeauftragter ist in drei Fällen vorgesehen: wenn in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung personenbezogener Daten beschäftigt sind (§ 38 Abs.
    1 Satz 1 BDSG) – gezählt werden Personen, nicht Vollzeitstellen, auch Teilzeitkräfte, Auszubildende und in den Betrieb eingebundene freie Mitarbeitende; wenn die Kerntätigkeit in einer umfangreichen
    regelmäßigen und systematischen Überwachung von Personen oder in der umfangreichen Verarbeitung besonderer Daten wie Gesundheitsdaten besteht (Art. 37 Abs. 1 Buchst. b, c DSGVO) – eine einzelne Ärztin
    oder ein einzelner Therapeut verarbeitet nach Erwägungsgrund 91 DSGVO nicht „umfangreich“; oder unabhängig von der Zahl, wenn eine Verarbeitung einer Datenschutz-Folgenabschätzung unterliegt oder Daten
    geschäftsmäßig zur Übermittlung oder für Markt- und Meinungsforschung verarbeitet werden (§ 38 Abs. 1 Satz 2 BDSG). Den Datenschutzbeauftragten benennst du unverzüglich, sobald einer dieser Fälle eintritt.
    Ob einer dieser Fälle vorliegt, klärt im Zweifel die Datenschutzaufsicht deines Landes. Die Bundesregierung plant, § 38 BDSG bis Ende 2026 zu streichen; ein Gesetz gibt es noch nicht.'
  en: 'A data protection officer is required in three cases: if usually at least 20 people are constantly engaged in the automated processing of personal data (§ 38(1) sentence 1 BDSG) – people are counted,
    not full-time positions, including part-time staff, apprentices and freelancers integrated into the business; if the core activity consists of extensive regular and systematic monitoring of people or
    of extensive processing of special categories of data such as health data (Art. 37(1)(b), (c) GDPR) – a single doctor or therapist does not process "on a large scale" under recital 91 GDPR; or regardless
    of the number, if a processing operation is subject to a data protection impact assessment or data is processed commercially for transfer or for market or opinion research (§ 38(1) sentence 2 BDSG).
    You appoint the data protection officer without delay as soon as one of these cases arises. If in doubt, the data protection authority of your federal state will clarify whether one of these cases applies.
    The federal government plans to abolish § 38 BDSG by the end of 2026; there is no law yet.'
- de: Eine Erlaubnis nach dem Güterkraftverkehrsgesetz oder eine Gemeinschaftslizenz brauchst du für die gewerbliche Beförderung von Gütern mit Fahrzeugen, die einschließlich Anhänger mehr als 3,5 t zulässige
    Gesamtmasse haben (§§ 1, 3 GüKG). Für grenzüberschreitende Fahrten und Kabotage brauchst du eine Gemeinschaftslizenz – seit dem 21.5.2022 auch für Fahrzeuge über 2,5 t bis 3,5 t (Verordnung (EG) Nr.
    1072/2009); seit 2022 wird die Gemeinschaftslizenz auch für den Inlandsverkehr erteilt. Werkverkehr, also die Beförderung eigener Güter mit eigenen Fahrzeugen für eigene Zwecke, ist erlaubnisfrei (§
    1 Abs. 2, 3 GüKG) – das betrifft etwa Handwerksbetriebe, Bäckereien und Händler. Für Taxi- und Mietwagenverkehr brauchst du unabhängig davon eine Genehmigung nach dem Personenbeförderungsgesetz.
  en: You need a licence under the Road Haulage Act or a Community licence for the commercial carriage of goods with vehicles whose permissible total mass including trailer exceeds 3.5 t (§§ 1, 3 GüKG).
    For cross-border trips and cabotage you need a Community licence – since 21.5.2022 also for vehicles over 2.5 t up to 3.5 t (Regulation (EC) No 1072/2009); since 2022 the Community licence has also
    been issued for domestic transport. Own-account transport, i.e. carrying your own goods with your own vehicles for your own purposes, needs no licence (§ 1(2), (3) GüKG) – this concerns, for example,
    craft businesses, bakeries and retailers. For taxi and hire car services you need a permit under the Passenger Transport Act regardless.
- de: Fehlt der Aushang des Arbeitszeitgesetzes, droht ein Bußgeld bis 5.000 € (§ 22 Abs. 1 Nr. 8, Abs. 2 ArbZG), ebenso beim Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde und beim Aushang
    der Arbeitszeit und Pausen der Jugendlichen (§ 59 Abs. 1 Nr. 7, 8, Abs. 3 JArbSchG). Für den Aushang des Mutterschutzgesetzes sieht § 32 MuSchG kein Bußgeld vor. Für die Information nach dem AGG gibt
    es kein Bußgeld; fehlt sie, droht aber ein Entschädigungsrisiko (§ 15 AGG). Für die Unfallverhütungsvorschriften sind die Folgen noch nicht fachlich erfasst.
  en: If the Working Hours Act (Arbeitszeitgesetz) is not displayed, there is a risk of a fine of up to €5,000 (§ 22(1) no. 8, (2) ArbZG); the same applies to the Youth Employment Protection Act with the
    address of the supervisory authority and to the notice of working hours and breaks of young people (§ 59(1) no. 7, 8, (3) JArbSchG). § 32 MuSchG provides no fine for displaying the Maternity Protection
    Act. There is no fine for the information under the AGG; if it is missing, however, there is a risk of compensation claims (§ 15 AGG). The consequences for the accident prevention regulations have not
    yet been professionally recorded.
- de: Fällt dein Unternehmen unter NIS2, registrierst du es spätestens drei Monate danach beim BSI.
  en: If your company falls under NIS2, you register it with the BSI no later than three months afterwards.
- de: Für die Güterbeförderung mit Fahrzeugen über 2,8 t bis 3,5 t zulässiger Gesamtmasse gelten im Inland ebenfalls die Lenk- und Ruhezeiten der Verordnung (EG) Nr. 561/2006; das regelt die Fahrpersonalverordnung.
    Ist kein Fahrtenschreiber eingebaut, führen die Fahrerinnen und Fahrer handschriftliche Tageskontrollblätter; ist einer eingebaut, wird er benutzt. Die Nachweise für den laufenden Tag und die vorangegangenen
    28 Kalendertage führen sie mit (§ 1 Abs. 6 FPersV). Du stellst die Vordrucke bereit, prüfst die Aufzeichnungen zeitnah und bewahrst sie ein Jahr außerhalb des Fahrzeugs auf. Ausgenommen sind unter anderem
    Fahrzeuge, mit denen du im Umkreis von 100 km Material für deine handwerkliche Arbeit beförderst, wenn das Fahren nicht deine Haupttätigkeit ist (§ 1 Abs. 2 Nr. 3 FPersV).
  en: For the carriage of goods with vehicles of more than 2.8 t up to 3.5 t permissible total weight, the driving and rest times of Regulation (EC) No 561/2006 also apply domestically; this is regulated
    by the Driving Personnel Ordinance. If no tachograph is installed, drivers keep handwritten daily record sheets; if one is installed, it is used. Drivers carry the records for the current day and the
    previous 28 calendar days (§ 1(6) FPersV). You provide the forms, check the records promptly and keep them outside the vehicle for one year. Exempt are, among others, vehicles with which you carry material
    for your craft work within a radius of 100 km if driving is not your main activity (§ 1(2) no. 3 FPersV).
- de: Für gewerblichen Güterkraftverkehr mit Fahrzeugen über 3,5 t ist eine Erlaubnis oder Gemeinschaftslizenz vorgesehen, grenzüberschreitend schon über 2,5 t eine Gemeinschaftslizenz; Werkverkehr mit
    eigenen Gütern ist erlaubnisfrei. Ob sie für dich gilt, klärt die Erlaubnisbehörde.
  en: Commercial road haulage with vehicles over 3.5 t requires a licence or Community licence, cross-border haulage a Community licence from 2.5 t; own-account transport of your own goods needs no licence.
    The licensing authority will clarify whether this applies to you.
- de: Gaststätten legen Preisverzeichnisse für Speisen und Getränke auf den Tischen aus oder legen sie jedem Gast vor der Bestellung und auf Verlangen bei der Abrechnung vor; alternativ hängen sie sie gut
    lesbar aus. Zusätzlich hängt neben dem Eingang ein Verzeichnis mit den Preisen der wesentlichen Speisen und Getränke (§ 13 PAngV). Die Preise sind Endpreise einschließlich Umsatzsteuer und Bedienung.
  en: Restaurants place price lists for food and drinks on the tables or present them to every guest before ordering and on request when paying; alternatively they display them legibly. In addition, a list
    with the prices of the main food and drinks is displayed next to the entrance (§ 13 PAngV). Prices are final prices including VAT and service.
- de: Gefährliche Abfälle vermischst du nicht mit anderen Abfällen (§ 9a KrWG). Du übergibst sie einem dafür zugelassenen Entsorger und bewahrst die Belege auf, etwa Übernahmescheine oder Entsorgungsnachweise.
    Als Erzeuger gefährlicher Abfälle führst du ein Register über Art, Menge und Verbleib (§ 49 Abs. 3 KrWG); die Belege nach der Nachweisverordnung gehören dazu. Fallen bei dir im Jahr nicht mehr als 2
    Tonnen gefährliche Abfälle an, entfällt das Nachweisverfahren (§ 2 Abs. 2 NachwV); du verwendest dann Übernahmescheine und bewahrst sie drei Jahre auf (§§ 12, 24 NachwV).
  en: You do not mix hazardous waste with other waste (§ 9a KrWG). You hand it over to a licensed disposal company and keep the receipts, such as acceptance slips or disposal certificates. As a producer
    of hazardous waste you keep a register of its type, quantity and whereabouts (§ 49(3) KrWG); the records under the Waste Records Ordinance (NachwV) form part of it. If you produce no more than 2 tonnes
    of hazardous waste a year, the records procedure does not apply (§ 2(2) NachwV); you then use acceptance slips and keep them for three years (§§ 12, 24 NachwV).
- de: Hersteller und Händler, die als Hersteller gelten, müssen sich nach dem ElektroG vor dem Verkauf registrieren. Als Hersteller gilt auch, wer unter eigener Marke verkauft, Geräte nach Deutschland einführt
    oder sie aus dem Ausland im Fernabsatz an Kunden in Deutschland verkauft (§ 3 Nr. 9 ElektroG). Wer bei einem Händler in Deutschland kauft und weiterverkauft oder einbaut, ist in der Regel nicht Hersteller.
  en: Producers and dealers who count as producers must register under the ElektroG before selling. Anyone who sells under their own brand, imports devices into Germany or sells them from abroad by distance
    selling to customers in Germany also counts as a producer (§ 3 no. 9 ElektroG). Anyone who buys from a dealer in Germany and resells or installs is usually not a producer.
- de: Hersteller von Batterien müssen sich vor dem Inverkehrbringen bei der stiftung ear registrieren. Hersteller ist auch, wer unter eigener Marke verkauft oder Batterien bzw. Geräte mit Batterien nach
    Deutschland einführt. Wer bei einem Händler in Deutschland kauft und weiterverkauft oder einbaut, ist in der Regel nicht Hersteller.
  en: Battery producers must register with stiftung ear before placing batteries on the market. A producer is also anyone who sells under their own brand or imports batteries or devices with batteries into
    Germany. Anyone who buys from a dealer in Germany and resells or installs is usually not a producer.
- de: Hier stehen jetzt nur noch die Prüfpflichten als Händlerin oder Händler. Pflichten als Hersteller oder Einführer und die Angaben im Online-Angebot haben eigene Einträge.
  en: This entry now only covers the checking duties as a retailer. Obligations as a manufacturer or importer and the information in online offers have their own entries.
- de: Immobilienmakler und Wohnimmobilienverwalter bilden sich innerhalb von drei Kalenderjahren 20 Stunden weiter (§ 34c Abs. 2a GewO), Versicherungsvermittler 15 Stunden je Kalenderjahr (§ 34d Abs. 9
    GewO), Finanzanlagenvermittler und Honorar-Finanzanlagenberater (§ 34f, § 34h GewO) ebenfalls 15 Stunden je Kalenderjahr (§ 15b FinVermV). Die Nachweise bewahrst du auf und legst sie der Behörde auf
    Verlangen vor.
  en: Real estate agents and residential property managers complete 20 hours of further training within three calendar years (§ 34c(2a) GewO), insurance intermediaries 15 hours per calendar year (§ 34d(9)
    GewO), financial investment intermediaries and fee-based financial investment advisers (§ 34f, § 34h GewO) also 15 hours per calendar year (§ 15b FinVermV). You keep the records and present them to
    the authority on request.
- de: In Gaststätten und Verkaufsstellen dürfen Bier, Wein, Sekt und ähnliche Getränke nicht an Kinder und Jugendliche unter 16 Jahren abgegeben werden, Branntwein und branntweinhaltige Getränke, auch Mischgetränke,
    nicht an unter 18-Jährige; auch den Verzehr darfst du ihnen nicht gestatten (§ 9 Abs. 1 JuSchG). Tabakwaren, E-Zigaretten und Shishas gibst du nicht an Kinder und Jugendliche unter 18 Jahren ab und
    gestattest ihnen das Rauchen nicht (§ 10 Abs. 1, 4 JuSchG). Lass dir im Zweifel das Alter nachweisen (§ 2 Abs. 2 JuSchG) und weise dein Personal ein. Verkaufst du Tabakwaren, brauchst du als Einzelhändler
    außerdem eine Wirtschaftsteilnehmer-Kennung und eine Kennung für deine Verkaufsstelle für die Rückverfolgbarkeit (Art. 15 Richtlinie 2014/40/EU, Durchführungsverordnung (EU) 2018/574).
  en: In restaurants and shops, beer, wine, sparkling wine and similar drinks must not be sold to children and young people under 16, and spirits and drinks containing spirits, including mixed drinks, not
    to anyone under 18; you must not allow them to consume these either (§ 9(1) JuSchG). You do not sell tobacco products, e-cigarettes or shishas to children and young people under 18 and do not allow
    them to smoke (§ 10(1), (4) JuSchG). If in doubt, ask for proof of age (§ 2(2) JuSchG) and brief your staff. If you sell tobacco products, as a retailer you also need an economic operator identifier
    and a facility identifier for your shop for traceability (Art. 15 Directive 2014/40/EU, Implementing Regulation (EU) 2018/574).
- de: Kein eigenes Bußgeld vorgesehen; fehlt der Hinweis, kann das als Wettbewerbsverstoß abgemahnt werden (§ 3a UWG).
  en: No separate fine; if the notice is missing, this can be challenged by a warning letter as a breach of competition law (§ 3a UWG).
- de: Kein eigenes Bußgeld vorgesehen; fehlt der Hinweis, kann das als Wettbewerbsverstoß abgemahnt werden.
  en: No separate fine; if the notice is missing, this can be challenged by a warning letter as a breach of competition law.
- de: Keine eigene Pflicht mehr – ein Hinweis auf die abgeschaltete Plattform ist überholt. Ein veralteter Link birgt ein geringes, aber nicht ausgeschlossenes Abmahnrisiko wegen Irreführung.
  en: No longer an obligation of its own – a reference to the shut-down platform is outdated. An outdated link carries a small but not negligible risk of a warning letter for being misleading.
- de: Keine eigene Rechtsfolge in § 356a BGB. Das Fehlen ist ein Verstoß gegen eine Verbraucherschutzvorschrift und kann abgemahnt werden (§ 3a UWG, § 2 UKlaG); umstritten ist, ob die Widerrufsfrist ohne
    Button beginnt – verlass dich vorsichtshalber nicht darauf.
  en: § 356a BGB sets out no legal consequence of its own. A missing button is a breach of a consumer protection provision and can be challenged by a warning letter (§ 3a UWG, § 2 UKlaG); whether the withdrawal
    period starts without the button is disputed – to be on the safe side, do not rely on it.
- de: Keine – Art. 4 ist in Art. 99 KI-VO nicht bußgeldbewehrt; ein Nachweis kann aber bei Schadensfällen und gegenüber der Aufsicht wichtig sein.
  en: None – Art. 4 is not subject to fines under Art. 99 AI Act; however, proof can matter in the event of damage and towards the supervisory authority.
- de: Meldungen zur Sozialversicherung erstattest du nur über systemgeprüfte Programme oder maschinelle Ausfüllhilfen wie sv.net (§§ 95 ff. SGB IV). Die Lohnabrechnung selbst macht ein systemgeprüfter Partner;
    Amtlos liefert Stammdaten und Fristen.
  en: You submit social security notifications only via system-certified programs or electronic completion aids such as sv.net (§§ 95 et seq. SGB IV). The payroll itself is done by a system-certified partner;
    Amtlos provides master data and deadlines.
- de: Meldungen zur Sozialversicherung gehen nur über systemgeprüfte Programme oder Ausfüllhilfen wie sv.net – Amtlos arbeitet dafür mit einem Lohnpartner.
  en: Social security notifications can only be made via system-certified programs or completion aids such as sv.net – Amtlos works with a payroll partner for this.
- de: Mit Dienstleistern, die für dich Daten verarbeiten (z. B. Cloud, IT-Hoster, Newsletter-Tool), schließt du einen Auftragsverarbeitungsvertrag.
  en: You conclude a data processing agreement (DPA) with service providers that process data for you (e.g. cloud, IT host, newsletter tool).
- de: NIS2 betrifft Unternehmen bestimmter Sektoren ab einer bestimmten Größe – in der Regel ab 50 Beschäftigten oder mehr als 10 Mio. € Jahresumsatz und Jahresbilanzsumme. Liegt deine Bilanzsumme bei höchstens 10 Mio. €, bist du trotzdem nicht erfasst. Unabhängig von der Größe erfasst
    sind unter anderem Vertrauensdiensteanbieter, Registries von Top-Level-Domains, DNS-Diensteanbieter und Anbieter öffentlicher Telekommunikationsnetze (§ 28 Abs. 3 BSIG). Wer betroffen ist, muss sich
    beim BSI registrieren und Sicherheitsvorfälle melden. Beantworte die Frage im Profil, sobald du es weißt.
  en: NIS2 affects companies in certain sectors above a certain size – usually from 50 employees or more than €10 million in annual turnover and annual balance sheet total. If your balance sheet total is no more than €10 million, you are nevertheless not covered. Regardless of size, it covers,
    among others, trust service providers, top-level domain registries, DNS service providers and providers of public telecommunications networks (§ 28(3) BSIG). Anyone covered must register with the BSI
    and report security incidents. Answer the question in your profile as soon as you know.
- de: Nach Art. 50 KI-Verordnung müssen Menschen erkennen können, dass sie mit einer KI interagieren (Abs. 1, seit 2.8.2026). Anbieter generativer KI-Systeme kennzeichnen deren Ausgaben maschinenlesbar
    (Abs. 2); für Systeme, die schon vor dem 2.8.2026 in Verkehr waren, gilt dafür eine Übergangsfrist bis 2.12.2026. Wer KI nur einsetzt (Betreiber), kennzeichnet Deepfakes – täuschend echte Bilder, Videos
    oder Tonaufnahmen – sowie KI-erzeugte Texte, die die Öffentlichkeit über Angelegenheiten von öffentlichem Interesse informieren sollen, außer sie wurden redaktionell kontrolliert (Abs. 4). Nicht jedes
    KI-Werbebild fällt darunter – entscheidend ist, ob es täuschend echt wirkt. Für kleine Betriebe sind vor allem zwei Fälle wichtig – ein eigener Chatbot auf der Website, wenn du ihn selbst anbietest
    (Abs. 1), und Deepfakes oder täuschend echte KI-Bilder in der Werbung (Abs. 4).
  en: Under Art. 50 of the AI Act, people must be able to recognise that they are interacting with an AI (para. 1, since 2.8.2026). Providers of generative AI systems mark their outputs in a machine-readable
    way (para. 2); for systems already placed on the market before 2.8.2026, a transition period until 2.12.2026 applies. Anyone who only uses AI (deployer) labels deepfakes – deceptively real images, videos
    or audio – and AI-generated texts intended to inform the public on matters of public interest, unless they have undergone editorial control (para. 4). Not every AI advertising image is covered – what
    matters is whether it looks deceptively real. For small businesses two cases matter most – your own chatbot on the website if you provide it yourself (para. 1), and deepfakes or deceptively real AI
    images in advertising (para. 4).
- de: Nach dem Plattformen-Steuertransparenzgesetz (DAC7) melden Plattformen bestimmte Verkäufer – dich, wenn du im Jahr mindestens 30 Verkäufe oder 2.000 € Vergütung über die Plattform hattest (§ 4 Abs.
    5 Nr. 4 PStTG). Amtlos erklärt, was gemeldet wird.
  en: Under the Platform Tax Transparency Act (Plattformen-Steuertransparenzgesetz, DAC7), platforms report certain sellers – you, if you had at least 30 sales or €2,000 in consideration via the platform
    in the year (§ 4(5) no. 4 PStTG). Amtlos explains what is reported.
- de: Nach § 312j BGB kommt ohne eindeutige Beschriftung kein wirksamer Vertrag zustande. Zulässig sind etwa „zahlungspflichtig bestellen“, „kostenpflichtig bestellen“ oder „kaufen“, nicht dagegen „bestellen“,
    „weiter“ oder „anmelden“.
  en: Under § 312j BGB, no valid contract is concluded without clear labelling. Permitted are, for example, "zahlungspflichtig bestellen" (order with obligation to pay), "kostenpflichtig bestellen" (order
    subject to charge) or "kaufen" (buy), but not "bestellen" (order), "weiter" (next) or "anmelden" (register).
- de: Neu nach der rechtlichen Prüfung (22.10.2026) – die Angaben im Online-Angebot stehen jetzt in einem eigenen Eintrag.
  en: New after the legal review (22.10.2026) – the information in online offers now has its own entry.
- de: Neu nach der rechtlichen Prüfung (22.10.2026) – die Pflichten als Hersteller oder Einführer stehen jetzt in einem eigenen Eintrag.
  en: New after the legal review (22.10.2026) – the obligations as a manufacturer or importer now have their own entry.
- de: Ohne systemgeprüftes Programm oder Ausfüllhilfe sind die Meldungen nicht möglich.
  en: Without a system-certified program or completion aid, the notifications are not possible.
- de: Ortungsdaten von Fahrzeugen, die Beschäftigte fahren, sind personenbezogene Daten. Rechtsgrundlage ist in der Regel ein berechtigtes Interesse wie Tourenplanung oder Diebstahlschutz (Art. 6 Abs. 1
    Buchst. f DSGVO); du wägst es gegen die Interessen der Beschäftigten ab. Lege fest, wofür du die Daten nutzt, und verwende sie nur dafür (Art. 5 Abs. 1 Buchst. b DSGVO); eine dauerhafte Leistungs- und
    Verhaltenskontrolle ist in der Regel unzulässig, außerhalb der Arbeitszeit ortest du nicht. Informiere die Beschäftigten vorher (Art. 13 DSGVO), lege eine Löschfrist fest und schließe mit dem Telematik-Anbieter
    einen Vertrag zur Auftragsverarbeitung (Art. 28 DSGVO). Die Ortung von Beschäftigten steht auf der Liste der Datenschutzkonferenz, für die immer eine Datenschutz-Folgenabschätzung nötig ist – führe
    sie vor dem Einsatz durch (Art. 35 DSGVO). Zustelldaten wie die Unterschrift der Empfänger oder ein Foto der Zustellung sind eigene Verarbeitungen, die du gesondert betrachtest.
  en: Location data of vehicles driven by employees are personal data. The legal basis is usually a legitimate interest such as route planning or theft protection (Art. 6(1)(f) GDPR); you weigh it against
    the interests of the employees. Define what you use the data for and use it only for that (Art. 5(1)(b) GDPR); permanent monitoring of performance and behaviour is generally not permitted, and you do
    not track outside working hours. Inform the employees in advance (Art. 13 GDPR), set a deletion period and conclude a data processing agreement with the telematics provider (Art. 28 GDPR). Location
    tracking of employees is on the German Data Protection Conference's list of processing operations that always require a data protection impact assessment – carry it out before use (Art. 35 GDPR). Delivery
    data such as the recipient's signature or a photo of the delivery are separate processing operations that you consider separately.
- de: 'Produktsicherheit (GPSR): Angaben im Online-Angebot'
  en: 'Product safety (GPSR): information in online offers'
- de: 'Produktsicherheit (GPSR): Angaben vor dem Verkauf prüfen'
  en: 'Product safety (GPSR): check information before selling'
- de: 'Produktsicherheit (GPSR): Pflichten als Hersteller oder Einführer'
  en: 'Product safety (GPSR): obligations as a manufacturer or importer'
- de: Schließt du Fernabsatzverträge mit Verbrauchern über eine Online-Benutzeroberfläche – Website oder App –, brauchst du eine Widerrufsfunktion (§ 356a BGB). Sie ist während der Widerrufsfrist ständig
    verfügbar, hervorgehoben und leicht zugänglich, gut lesbar mit „Vertrag widerrufen“ beschriftet und führt zu einer Bestätigungsfunktion „Widerruf bestätigen“. Danach schickst du unverzüglich eine Eingangsbestätigung
    auf einem dauerhaften Datenträger, zum Beispiel per E-Mail, mit Inhalt des Widerrufs sowie Datum und Uhrzeit des Eingangs. Pass auch deine Widerrufsbelehrung an das neue Muster an. Verkaufst du über
    einen Marktplatz, trifft die Pflicht dich als Unternehmer; stellt der Marktplatz die Widerrufsfunktion bereit, genügt das.
  en: If you conclude distance contracts with consumers via an online interface – website or app – you need a withdrawal function (§ 356a BGB). It must be permanently available during the withdrawal period,
    highlighted and easily accessible, legibly labelled "Vertrag widerrufen" (withdraw from contract) and lead to a confirmation function "Widerruf bestätigen" (confirm withdrawal). You then send an acknowledgement
    of receipt without delay on a durable medium, for example by e-mail, with the content of the withdrawal and the date and time of receipt. Also adapt your withdrawal information to the new model. If
    you sell via a marketplace, the obligation lies with you as the trader; if the marketplace provides the withdrawal function, that is sufficient.
- de: Schließt du einen Vertrag mit einem Verbraucher ausschließlich über Fernkommunikationsmittel – Telefon, E-Mail, Brief oder Messenger –, ist das ein Fernabsatzvertrag, wenn dein Betrieb für solche
    Verträge eingerichtet ist (§ 312c BGB) – dafür genügt nach der Rechtsprechung des BGH, dass du regelmäßig Aufträge per Telefon oder E-Mail annimmst. Der Kunde kann ihn 14 Tage lang widerrufen (§ 312g,
    § 355 BGB). Darüber informierst du vor Vertragsschluss und bestätigst den Vertrag mit der Belehrung auf einem dauerhaften Datenträger, etwa per E-Mail. Fehlt die Belehrung, läuft die Widerrufsfrist
    bis zu 12 Monate und 14 Tage (§ 356 Abs. 3, 4 BGB); widerruft der Kunde dann, schuldet er für erbrachte Leistungen keinen Wertersatz (§ 357a Abs. 2 BGB). Bei Dienstleistungen erlischt das Widerrufsrecht,
    wenn du vollständig geleistet hast und der Kunde vorher ausdrücklich zugestimmt und bestätigt hat, dass er sein Widerrufsrecht dann verliert (§ 356 Abs. 5 Nr. 2 BGB). Bei Freizeitkursen und anderen
    Freizeitangeboten mit festem Termin besteht kein Widerrufsrecht, auch wenn sie online stattfinden (§ 312g Abs. 2 Nr. 9 BGB, EuGH C-96/21). Willst du vor Ablauf der Frist anfangen, lass dir das ausdrücklich
    vom Kunden verlangen und halte es fest.
  en: If you conclude a contract with a consumer exclusively by means of distance communication – phone, email, letter or messenger – it is a distance contract if your business is set up for such contracts
    (§ 312c BGB) – according to the Federal Court of Justice (BGH) it is enough that you regularly accept orders by phone or email. The customer can withdraw from it within 14 days (§ 312g, § 355 BGB).
    You inform them about this before the contract is concluded and confirm the contract together with the information on a durable medium, for example by email. If the information is missing, the withdrawal
    period runs for up to 12 months and 14 days (§ 356(3), (4) BGB); if the customer then withdraws, they owe no compensation for services already provided (§ 357a(2) BGB). For services the right of withdrawal
    expires once you have provided the service in full and the customer has expressly agreed beforehand and confirmed that they will then lose the right of withdrawal (§ 356(5) no. 2 BGB). For leisure courses
    and other leisure services on a fixed date there is no right of withdrawal, even if they take place online (§ 312g(2) no. 9 BGB, CJEU C-96/21). If you want to start before the period ends, have the
    customer expressly request it and record this.
- de: Seit 12.8.2026 gelten die EU-Verpackungsverordnung (EU) 2025/40 und das Verpackungsrecht-Durchführungsgesetz (VerpackDG), das das Verpackungsgesetz abgelöst hat. Du registrierst dich weiterhin vor
    dem erstmaligen Bereitstellen bei der Zentralen Stelle Verpackungsregister (LUCID) und beteiligst Verpackungen, die typischerweise bei privaten Endverbrauchern anfallen, vor der Bereitstellung an einem
    System (§§ 6, 7 VerpackDG).
  en: Since 12.8.2026, the EU Packaging Regulation (EU) 2025/40 and the Packaging Law Implementation Act (Verpackungsrecht-Durchführungsgesetz, VerpackDG) apply; the latter replaced the Packaging Act (Verpackungsgesetz).
    You continue to register with the Central Agency Packaging Register (Zentrale Stelle Verpackungsregister, LUCID) before first making packaging available and join a system for packaging that typically
    ends up with private end consumers before making it available (§§ 6, 7 VerpackDG).
- de: Stellst du Verbraucherprodukte selbst her, verkaufst sie unter deinem Namen oder führst sie von außerhalb der EU ein, sorgst du vor dem Inverkehrbringen für Herstellerangaben, Identifizierung und
    Sicherheitsinformationen.
  en: If you manufacture consumer products yourself, sell them under your own name or import them from outside the EU, you ensure manufacturer details, identification and safety information before placing
    them on the market.
- de: Verbraucher haben bei Fernabsatzverträgen in der Regel ein Widerrufsrecht, über das du vor Vertragsschluss informieren musst. Bei Dienstleistungen, etwa Kursen oder Handwerksleistungen, erlischt das
    Widerrufsrecht, wenn du die Leistung vollständig erbracht hast und der Kunde vorher ausdrücklich zugestimmt und bestätigt hat, dass er sein Widerrufsrecht dann verliert (§ 356 Abs. 5 Nr. 2 BGB). Beginnst
    du auf Verlangen des Kunden vor Ablauf der Widerrufsfrist, schuldet er bei einem Widerruf Wertersatz für das bereits Geleistete – aber nur, wenn du ihn ordnungsgemäß belehrt hast (§ 357a Abs. 2 BGB).
    Verwende das Muster nach Anlage 1 zum EGBGB in der Fassung ab 19.6.2026 mit dem Gestaltungshinweis zum Widerrufsbutton. Ausnahmen vom Widerrufsrecht stehen in § 312g Abs. 2 BGB – bei Freizeitkursen
    und anderen Freizeitangeboten mit festem Termin etwa ist es ausgeschlossen, auch online (§ 312g Abs. 2 Nr. 9 BGB).
  en: Consumers usually have a right of withdrawal for distance contracts, which you must inform them about before the contract is concluded. For services, such as courses or craft services, the right of
    withdrawal expires once you have provided the service in full and the customer has expressly agreed beforehand and confirmed that they will then lose the right of withdrawal (§ 356(5) no. 2 BGB). If
    you start at the customer's request before the withdrawal period ends, the customer owes compensation for what has already been provided if they withdraw – but only if you informed them properly (§
    357a(2) BGB). Use the model under Annex 1 to the EGBGB as applicable from 19.6.2026 with the design note on the withdrawal button. Exceptions to the right of withdrawal are set out in § 312g(2) BGB
    – for leisure courses and other leisure services on a fixed date, for example, it is excluded, also online (§ 312g(2) no. 9 BGB).
- de: Verjährung der Mängelansprüche bei Bauwerken
  en: Limitation period for defect claims for buildings
- de: Verjährung der Mängelansprüche bei Werkleistungen an Sachen
  en: Limitation period for defect claims for work on things
- de: Verjährung der Mängelansprüche beim Kauf
  en: Limitation period for defect claims in a sale
- de: Verkaufst du Verbraucherprodukte online oder auf einem Marktplatz, nennst du die Angaben zu Hersteller, Produkt und Sicherheit schon im Angebot.
  en: If you sell consumer products online or on a marketplace, you state the information on the manufacturer, product and safety in the offer itself.
- de: Verkaufst du Verbraucherprodukte, prüfst du vor dem Verkauf, ob Herstellerangaben, Kennzeichnung und Sicherheitsinformationen vorhanden sind.
  en: If you sell consumer products, you check before selling whether manufacturer details, labelling and safety information are present.
- de: Verpflichtet sind unter anderem Immobilienmakler (§ 2 Abs. 1 Nr. 14 GwG), Finanzanlagen- und Darlehensvermittler sowie Versicherungsvermittler, soweit sie Lebensversicherungen vermitteln (§ 2 Abs.
    1 Nr. 6 ff. GwG). Dazu gehören Risikoanalyse, Identifizierung der Vertragspartner und Verdachtsmeldungen.
  en: Obliged entities include, among others, real estate agents (§ 2(1) no. 14 GwG), financial investment and loan intermediaries and insurance intermediaries insofar as they arrange life insurance (§
    2(1) nos. 6 et seq. GwG). The obligations include a risk analysis, identification of contracting parties and suspicious activity reports.
- de: Verstöße gegen die Abwassersatzung oder wasserrechtliche Auflagen sind nach Landesrecht bußgeldbewehrt; wer ohne Erlaubnis Abwasser einleitet, riskiert ein Bußgeld bis 50.000 € (§ 103 Abs. 1 Nr. 1,
    Abs. 2 WHG).
  en: Infringements of the waste water bylaw or water law requirements are subject to fines under state law; anyone who discharges waste water without a permit risks a fine of up to €50,000 (§ 103(1) no.
    1, (2) WHG).
- de: Verträge, die du mit Verbrauchern außerhalb deiner Geschäftsräume schließt – etwa in der Wohnung beim Aufmaß oder unterwegs –, können sie 14 Tage lang widerrufen (§ 312b, § 312g BGB). Darüber informierst
    du vor Vertragsschluss und gibst die Belehrung und eine Abschrift des Vertrags auf Papier oder, wenn der Kunde zustimmt, auf einem anderen dauerhaften Datenträger heraus (Art. 246a § 4 Abs. 2 EGBGB).
    Kein Widerrufsrecht besteht etwa bei dringenden Reparaturen, zu denen dich der Kunde ausdrücklich gerufen hat (§ 312g Abs. 2 Nr. 11 BGB), und bei Leistungen bis 40 €, die sofort erbracht und bezahlt
    werden (§ 312 Abs. 2 Nr. 12 BGB). Fehlt die Belehrung, läuft die Widerrufsfrist bis zu 12 Monate und 14 Tage (§ 356 Abs. 3, 4 BGB). Widerruft der Kunde dann, schuldet er für bereits erbrachte Leistungen
    in der Regel keinen Wertersatz (§ 357a Abs. 2 BGB). Willst du vor Ablauf der Frist anfangen, lass dir das ausdrücklich vom Kunden verlangen und halte es fest.
  en: Consumers can withdraw from contracts you conclude with them outside your business premises – for example at their home when measuring up or on the go – for 14 days (§ 312b, § 312g BGB). You inform
    them about this before the contract is concluded and hand over the information and a copy of the contract on paper or, if the customer agrees, on another durable medium (Art. 246a § 4(2) EGBGB). There
    is no right of withdrawal, for example, for urgent repairs the customer has expressly called you out for (§ 312g(2) no. 11 BGB) and for services of up to €40 that are provided and paid for immediately
    (§ 312(2) no. 12 BGB). Without this information the withdrawal period runs for up to 12 months and 14 days (§ 356(3), (4) BGB). If the customer then withdraws, as a rule they owe no compensation for
    services already provided (§ 357a(2) BGB). If you want to start before the period expires, have the customer expressly request this and keep a record.
- de: Videoüberwachung braucht einen berechtigten Zweck, muss erkennbar sein (Hinweisschild) und gehört ins Verzeichnis der Verarbeitungstätigkeiten. Rechtsgrundlage ist für Unternehmen das berechtigte
    Interesse (Art. 6 Abs. 1 lit. f DSGVO) – du wägst es gegen die Interessen der Gefilmten ab und hältst das fest. Das Hinweisschild nennt nach Art. 13 DSGVO mindestens dich als Verantwortlichen, den Zweck
    und wo die weiteren Informationen stehen. Die Aufnahmen löschst du in der Regel nach 48 bis 72 Stunden (Orientierungshilfe der Datenschutzkonferenz). Deine Beschäftigten informierst du ebenfalls nach
    Art. 13 DSGVO; gibt es einen Betriebsrat, bestimmt er mit (§ 87 Abs. 1 Nr. 6 BetrVG).
  en: Video surveillance needs a legitimate purpose, must be recognisable (sign) and belongs in the record of processing activities. For businesses the legal basis is legitimate interest (Art. 6(1)(f) GDPR)
    – you weigh it against the interests of the people filmed and record this. Under Art. 13 GDPR the sign states at least you as controller, the purpose and where further information can be found. As a
    rule, you delete the recordings after 48 to 72 hours (guidance of the German Data Protection Conference). You also inform your employees under Art. 13 GDPR; if there is a works council, it has a say
    (§ 87(1) no. 6 BetrVG).
- de: Welche Erlaubnis nötig ist, hängt vom Beruf ab – etwa die Approbation für Ärztinnen und Ärzte (BÄO), die Heilpraktikererlaubnis (HeilprG) oder die Erlaubnis für Physiotherapie (MPhG), Ergotherapie,
    Logopädie und Pflege (PflBG). Kosmetik und Massage ohne Heilkunde sind erlaubnisfrei. Ohne die nötige Erlaubnis darfst du die Tätigkeit nicht ausüben.
  en: Which permit is needed depends on the profession – for example the licence to practise medicine for doctors (BÄO), the non-medical practitioner permit (HeilprG) or the permit for physiotherapy (MPhG),
    occupational therapy, speech therapy and nursing (PflBG). Cosmetics and massage without the practice of medicine need no permit. Without the necessary permit you may not carry out the activity.
- de: 'Wer Heilkunde ohne Approbation oder Heilpraktikererlaubnis ausübt, macht sich strafbar (§ 5 HeilprG: Freiheitsstrafe bis zu einem Jahr oder Geldstrafe); das unbefugte Führen geschützter Berufsbezeichnungen
    ist strafbar (§ 132a StGB) bzw. nach den Berufsgesetzen bußgeldbewehrt.'
  en: 'Anyone who practises medicine without a licence to practise medicine or a non-medical practitioner permit commits a criminal offence (§ 5 HeilprG: imprisonment of up to one year or a fine); unauthorised
    use of protected professional titles is a criminal offence (§ 132a StGB) or subject to fines under the professional laws.'
- de: Wer Produkte im Fernabsatz anbietet – zum Beispiel im Onlineshop, in einer App oder auf einem Marktplatz –, nennt im Angebot deutlich und gut sichtbar den Hersteller mit Name, Handelsmarke, Postanschrift
    und elektronischer Adresse, gegebenenfalls die verantwortliche Person in der EU, die Angaben zur Identifizierung des Produkts, etwa ein Bild und den Typ, sowie Warnhinweise und Sicherheitsinformationen
    (Art. 19 GPSR). Das gilt auch für fremde Markenware. Lebensmittel fallen nicht unter die Verordnung.
  en: Anyone offering products by distance selling – for example in an online shop, in an app or on a marketplace – states clearly and visibly in the offer the manufacturer with name, trade mark, postal
    address and electronic address, where applicable the responsible person in the EU, the information identifying the product, such as a picture and the type, and warnings and safety information (Art.
    19 GPSR). This also applies to third-party brand goods. Food is not covered by the Regulation.
- de: Wer Speisen in Einwegkunststoffverpackungen oder Getränke in Einwegbechern erst beim Verkauf befüllt, muss sie auch in einer Mehrwegverpackung anbieten – nicht teurer und gut sichtbar mit einem Hinweis
    (§ 60 VerpackDG). Ausgenommen sind kleine Betriebe mit höchstens fünf Beschäftigten und höchstens 80 m² Verkaufsfläche; sie müssen stattdessen auf Wunsch mitgebrachte Behälter der Kundschaft befüllen
    und darauf hinweisen (§ 61 VerpackDG). Teilzeitkräfte zählen dabei mit 0,5 (bis 20 Wochenstunden) bzw. 0,75 (bis 30 Wochenstunden). Beim Foodtruck ist die Verkaufsfläche die Fläche des Fahrzeugs; lieferst
    du aus, zählen auch Lager- und Versandflächen. Seit 12.8.2026 steht die Pflicht im Verpackungsrecht-Durchführungsgesetz, das das Verpackungsgesetz abgelöst hat.
  en: Anyone who fills food into single-use plastic packaging or drinks into single-use cups only at the point of sale must also offer them in reusable packaging – not more expensive and with a clearly
    visible notice (§ 60 VerpackDG). Small businesses with no more than five employees and no more than 80 m² of sales area are exempt; instead, they must fill containers brought by customers on request
    and point this out (§ 61 VerpackDG). Part-time staff count as 0.5 (up to 20 hours a week) or 0.75 (up to 30 hours a week). For a food truck, the sales area is the area of the vehicle; if you deliver,
    storage and dispatch areas also count. Since 12.8.2026, the obligation is set out in the Packaging Law Implementation Act (Verpackungsrecht-Durchführungsgesetz), which replaced the Packaging Act (Verpackungsgesetz).
- de: Wer gewerbliche Siedlungsabfälle erzeugt, sammelt Papier, Pappe und Karton, Glas, Kunststoffe, Metalle, Holz, Textilien und Bioabfälle getrennt und gibt sie vorrangig zur Vorbereitung zur Wiederverwendung
    oder zum Recycling weiter (§ 3 Abs. 1 GewAbfV). Die Getrenntsammlung dokumentierst du, etwa mit Lageplänen, Fotos, Liefer- oder Wiegescheinen und Entsorgungsverträgen (§ 3 Abs. 3 GewAbfV). Ist die Trennung
    technisch nicht möglich oder wirtschaftlich nicht zumutbar, gelten Ausnahmen, die du ebenfalls dokumentierst (§ 3 Abs. 2 GewAbfV). Das gilt auch für kleine Betriebe, die nur die Behälter der Gemeinde
    nutzen; die Dokumentation kann dann einfach sein. Gefährliche Abfälle haben eigene Pflichten.
  en: Anyone who produces commercial municipal waste collects paper, paperboard and cardboard, glass, plastics, metals, wood, textiles and bio-waste separately and passes them on primarily for preparation
    for re-use or recycling (§ 3(1) GewAbfV). You document the separate collection, for example with site plans, photos, delivery or weighing slips and disposal contracts (§ 3(3) GewAbfV). If separation
    is technically impossible or economically unreasonable, exemptions apply, which you also document (§ 3(2) GewAbfV). This also applies to small businesses that only use the municipality's bins; the documentation
    can then be simple. Hazardous waste has its own obligations.
- de: Wer gewerbsmäßig Verbrennungsmotoren- oder Getriebeöl an Endverbraucher abgibt, richtet vor der Abgabe eine Annahmestelle für gebrauchte Öle ein oder weist eine solche durch eine vertragliche Vereinbarung
    nach (§ 8 Abs. 1 AltölV). Bei der Abgabe an private Endverbraucher weist du am Ort des Verkaufs mit leicht erkennbaren und lesbaren Schrifttafeln auf die Annahmestelle hin. Die Annahmestelle nimmt gebrauchte
    Öle bis zur Menge des bei dir gekauften Öls an (§ 8 Abs. 2 AltölV).
  en: Anyone who commercially supplies combustion engine or gear oil to end users sets up a collection point for used oils before supplying it, or proves one by contractual agreement (§ 8(1) AltölV). When
    selling to private end users you point to the collection point at the place of sale with easily recognisable and legible signs. The collection point accepts used oils up to the quantity of oil bought
    from you (§ 8(2) AltölV).
- de: Wie lange Mängelansprüche bestehen, hängt von der Art des Werks ab – bei Werkleistungen an Sachen in der Regel 2 Jahre (§ 634a Abs. 1 Nr. 1 BGB), bei Bauwerken 5 Jahre (§ 634a Abs. 1 Nr. 2 BGB). Stellst
    du Waren her und lieferst sie – etwa als Bäckerei oder Konditorei, auch Torten auf Bestellung –, gilt Kaufrecht (§ 650 BGB); die Mängelrechte richten sich dann nach §§ 437, 438 BGB und verjähren in
    der Regel nach 2 Jahren (§ 438 Abs. 1 Nr. 3 BGB). Verkaufst du an Verbraucher, wird bei einem Mangel, der sich im ersten Jahr zeigt, vermutet, dass er schon bei Übergabe da war (§ 477 BGB). Amtlos erinnert
    nach fachlicher Freigabe an das Ende der Fristen.
  en: How long warranty claims last depends on the type of work – for work on things usually 2 years (§ 634a(1) no. 1 BGB), for buildings 5 years (§ 634a(1) no. 2 BGB). If you make and deliver goods – for
    example as a bakery or confectionery, including cakes made to order – sales law applies (§ 650 BGB); warranty rights then follow §§ 437, 438 BGB and usually become time-barred after 2 years (§ 438(1)
    no. 3 BGB). If you sell to consumers and a defect appears within the first year, it is presumed to have existed at handover (§ 477 BGB). After expert approval, Amtlos will remind you when the periods
    end.
- de: Wird die Tätigkeit als Beschäftigung eingestuft, schuldet dein Auftraggeber die Beiträge bis zu vier Jahre nach (§ 28e, § 25 SGB IV); du verlierst den Unternehmerstatus, und Rechnungen mit Umsatzsteuer
    sind zu berichtigen.
  en: If the activity is classified as employment, your client owes the contributions retroactively for up to four years (§ 28e, § 25 SGB IV); you lose your status as a business owner, and invoices with
    VAT have to be corrected.
- de: Zeitraum der Beweislastumkehr beim Verbrauchsgüterkauf
  en: Period of reversal of the burden of proof in consumer sales
- de: § 312k BGB verlangt eine einfache Kündigungsmöglichkeit über die Website – nur für Dauerschuldverhältnisse mit Verbrauchern, die im Internet abgeschlossen werden können. Die Schaltfläche ist mit „Verträge
    hier kündigen“ beschriftet und führt zu einer Bestätigungsseite, auf der der Kunde seine Angaben macht, mit einer Bestätigungsschaltfläche „jetzt kündigen“ (§ 312k Abs. 2 BGB). Den Eingang der Kündigung
    bestätigst du dem Kunden (§ 312k Abs. 4 BGB).
  en: § 312k BGB requires a simple way to cancel via the website – only for continuing obligations with consumers that can be concluded online. The button is labelled "Verträge hier kündigen" (cancel contracts
    here) and leads to a confirmation page on which the customer enters their details, with a confirmation button "jetzt kündigen" (cancel now) (§ 312k(2) BGB). You confirm receipt of the cancellation to
    the customer (§ 312k(4) BGB).
- de: Du erfasst Rechnungen oder Kasseneinnahmen in Amtlos.
  en: You record invoices or cash register takings in Amtlos.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen im Gründungsjahr mindestens 20.000 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least €20,000 in the founding year; the limit in the founding year is €25,000.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen im Gründungsjahr mindestens 23.750 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least €23,750 in the founding year; the limit in the founding year is €25,000.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen in diesem Jahr mindestens 80.000 €; die Grenze liegt bei 100.000 €.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least €80,000 this year; the limit is €100,000.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen in diesem Jahr mindestens 95.000 €; die Grenze liegt bei 100.000 €.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least €95,000 this year; the limit is €100,000.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen mindestens 80 % einer Kleinunternehmergrenze – 25.000 € (darüber ist ab 1. Januar des nächsten Jahres die Regelbesteuerung vorgesehen) oder 100.000 € im laufenden Jahr, im Gründungsjahr 25.000 €.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least 80% of a small business limit – €25,000 (above it, standard taxation is intended from 1 January of the following year) or €100,000 in the current year, €25,000 in the founding year.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen in diesem Jahr mindestens 20.000 €; liegt dein Umsatz in diesem Jahr über 25.000 €, ist ab 1. Januar des nächsten Jahres die Regelbesteuerung vorgesehen.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least €20,000 this year; if your turnover this year is above €25,000, standard taxation is intended from 1 January of the following year.
- de: 'Neu: Warnung auch, wenn deine Einnahmen in diesem Jahr 80 % der Grenze von 25.000 € erreichen – darüber ist ab 1. Januar des nächsten Jahres die Regelbesteuerung vorgesehen.'
  en: 'New: a warning also when your income this year reaches 80% of the €25,000 limit – above it, standard taxation is intended from 1 January of the following year.'
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen mindestens 95 % einer Kleinunternehmergrenze – 25.000 € (darüber ist ab 1. Januar des nächsten Jahres die Regelbesteuerung vorgesehen) oder 100.000 € im laufenden Jahr, im Gründungsjahr 25.000 €.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least 95% of a small business limit – €25,000 (above it, standard taxation is intended from 1 January of the following year) or €100,000 in the current year, €25,000 in the founding year.
- de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen in diesem Jahr mindestens 23.750 €; liegt dein Umsatz in diesem Jahr über 25.000 €, ist ab 1. Januar des nächsten Jahres die Regelbesteuerung vorgesehen.
  en: Your income according to Amtlos (payments received and cash register, net) reaches at least €23,750 this year; if your turnover this year is above €25,000, standard taxation is intended from 1 January of the following year.
- de: 'Neu: Warnung auch, wenn deine Einnahmen in diesem Jahr 95 % der Grenze von 25.000 € erreichen – darüber ist ab 1. Januar des nächsten Jahres die Regelbesteuerung vorgesehen.'
  en: 'New: a warning also when your income this year reaches 95% of the €25,000 limit – above it, standard taxation is intended from 1 January of the following year.'
- de: 'Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) lagen im Vorjahr über 25.000 €.'
  en: 'Your income according to Amtlos (payments received and cash register, net, without open invoices) was above €25,000 last year.'
- de: 'Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) liegen im Gründungsjahr über 25.000 €; die Grenze im Gründungsjahr liegt bei 25.000 €.'
  en: 'Your income according to Amtlos (payments received and cash register, net, without open invoices) is above €25,000 in the founding year; the limit in the founding year is €25,000.'
- de: 'Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) liegen in diesem Jahr über 100.000 €; die Grenze liegt bei 100.000 €.'
  en: 'Your income according to Amtlos (payments received and cash register, net, without open invoices) is above €100,000 this year; the limit is €100,000.'
- de: 'Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) liegen in diesem Jahr über 25.000 €; die Grenze liegt bei 25.000 €.'
  en: 'Your income according to Amtlos (payments received and cash register, net, without open invoices) is above €25,000 this year; the limit is €25,000.'
- de: 'Maßgeblich ist der Gesamtumsatz nach vereinnahmten Entgelten – also die Zahlungen, die du netto erhältst, nicht die Summe der gestellten Rechnungen nach Rechnungsdatum. Bis einschließlich 25.000 € bzw. 100.000 € bleibt dein Umsatz steuerfrei. Ab dem Umsatz, mit dem du die Grenze überschreitest, gilt die Regelbesteuerung – du stellst Rechnungen mit Umsatzsteuer und gibst Voranmeldungen ab; eine eigene Frist gibt es dafür nicht. Lag dein Umsatz im Vorjahr über 25.000 €, gilt die Regelung in diesem Jahr von Anfang an nicht. Amtlos zählt dafür nur Geld, das du schon bekommen hast – die Zahlungseingänge auf deine Rechnungen in Amtlos (netto), deine Kasseneinnahmen laut Tagesabschlüssen und deine Sachentnahmen; Leistungen an Unternehmen im Ausland zählen nicht mit. Rechnungen ohne vermerkten Zahlungseingang zählen hier nicht – vermerke deine Zahlungseingänge, sonst ist der Wert zu niedrig. Steuerfreie Umsätze (z. B. Heilbehandlungen) rechnet Amtlos heraus, wenn du sie auf der Rechnung mit „0 % / steuerfrei“ und dem Hinweis auf die Steuerbefreiung erfasst. Verkäufe von Anlagegütern zählen nicht zur Grenze – erfasst du sie als Rechnung, kann der angezeigte Wert zu hoch sein. Einnahmen außerhalb von Amtlos sind nicht enthalten.'
  en: 'What counts is total turnover based on payments received – i.e. the net amounts you are paid, not the total of invoices issued by invoice date. Up to and including €25,000 or €100,000, your turnover remains tax-exempt. From the sale with which you exceed the limit, standard taxation applies – you issue invoices with VAT and file advance returns; there is no separate deadline for this. If your turnover last year was above €25,000, the scheme does not apply at all this year. Amtlos only counts money you have already received – the payments received on your invoices in Amtlos (net), your cash register takings according to the daily closings and your withdrawals of goods for private use; services to businesses abroad are not included. Invoices without a recorded payment do not count here – record your payments received, otherwise the value is too low. Amtlos leaves out tax-exempt sales (e.g. medical treatments) if you record them on the invoice with “0 % / steuerfrei” (tax-exempt) and the note on the tax exemption. Sales of fixed assets do not count towards the limit – if you record them as an invoice, the value shown may be too high. Income outside Amtlos is not included.'
- de: 'Die Kleinunternehmerregelung setzt voraus, dass dein Umsatz im Vorjahr höchstens 25.000 € betrug. Überschreitest du diese Grenze in diesem Jahr, ohne über 100.000 € zu kommen, gilt die Regelung bis zum Jahresende weiter. Ab 1. Januar weist du auf deinen Rechnungen Umsatzsteuer aus, gibst Umsatzsteuer-Voranmeldungen und die Umsatzsteuer-Jahreserklärung ab und kannst die Vorsteuer aus deinen Eingangsrechnungen abziehen. Wie oft du die Voranmeldung abgibst, legt das Finanzamt nach der voraussichtlichen Steuer fest – bei mehr als 9.000 € monatlich, sonst vierteljährlich (§ 18 Abs. 2 UStG); es steht im Schreiben des Finanzamts. Hast du als Kleinunternehmer Wirtschaftsgüter angeschafft, die du weiter nutzt, kann beim Wechsel eine Berichtigung der Vorsteuer in Frage kommen (§ 15a UStG). Maßgeblich für die Grenze ist der Umsatz nach vereinnahmten Entgelten (netto, nach Zahlungseingang), nicht die Summe der Rechnungen nach Rechnungsdatum. Amtlos zählt dafür nur Geld, das du schon bekommen hast – die Zahlungseingänge auf deine Rechnungen in Amtlos (netto), deine Kasseneinnahmen laut Tagesabschlüssen und deine Sachentnahmen; Leistungen an Unternehmen im Ausland zählen nicht mit. Rechnungen ohne vermerkten Zahlungseingang zählen hier nicht – vermerke deine Zahlungseingänge, sonst ist der Wert zu niedrig. Steuerfreie Umsätze (z. B. Heilbehandlungen) rechnet Amtlos heraus, wenn du sie auf der Rechnung mit „0 % / steuerfrei“ und dem Hinweis auf die Steuerbefreiung erfasst. Verkäufe von Anlagegütern zählen nicht zur Grenze – erfasst du sie als Rechnung, kann der angezeigte Wert zu hoch sein. Einnahmen außerhalb von Amtlos sind nicht enthalten. Stelle Rechnungsvorlage, Preise und Buchhaltung rechtzeitig um.'
  en: 'The small business scheme requires that your turnover last year was at most €25,000. If you exceed this limit this year without going above €100,000, the scheme continues until the end of the year. From 1 January you show VAT on your invoices, file advance VAT returns and the annual VAT return, and can deduct input VAT from your purchase invoices. How often you file the advance return is set by the tax office based on the expected tax – monthly above €9,000, otherwise quarterly (§ 18(2) UStG); it is stated in the tax office''s letter. If you bought assets as a small business that you continue to use, an input VAT adjustment may apply when you switch (§ 15a UStG). What counts for the limit is turnover based on payments received (net, by date of payment), not the total of invoices by invoice date. Amtlos only counts money you have already received – the payments received on your invoices in Amtlos (net), your cash register takings according to the daily closings and your withdrawals of goods for private use; services to businesses abroad are not included. Invoices without a recorded payment do not count here – record your payments received, otherwise the value is too low. Amtlos leaves out tax-exempt sales (e.g. medical treatments) if you record them on the invoice with “0 % / steuerfrei” (tax-exempt) and the note on the tax exemption. Sales of fixed assets do not count towards the limit – if you record them as an invoice, the value shown may be too high. Income outside Amtlos is not included. Adjust your invoice template, prices and bookkeeping in good time.'
- de: 'Überschreitest du im laufenden Jahr 100.000 € (im Gründungsjahr 25.000 €), ist schon der Umsatz, mit dem du die Grenze überschreitest, steuerpflichtig. Die Kleinunternehmerregelung setzt außerdem voraus, dass dein Umsatz im Vorjahr höchstens 25.000 € betrug. Überschreitest du diese Grenze in diesem Jahr, ohne über 100.000 € zu kommen, gilt die Regelung bis zum Jahresende weiter, ab 1. Januar des nächsten Jahres ist die Regelbesteuerung vorgesehen. Maßgeblich ist der Umsatz nach vereinnahmten Entgelten – die Zahlungen, die du netto erhältst, nicht die Rechnungen nach Rechnungsdatum. Amtlos zählt dafür die Zahlungseingänge auf deine Rechnungen in Amtlos (netto) und deine Kasseneinnahmen laut Tagesabschlüssen; Leistungen an Unternehmen im Ausland zählen nicht mit. Hast du bei einer Rechnung keinen Zahlungseingang vermerkt, zählt Amtlos sie vorsichtshalber mit dem Rechnungsdatum – vermerke Zahlungseingänge, dann rechnet Amtlos genauer. Steuerfreie Umsätze (z. B. Heilbehandlungen) rechnet Amtlos heraus, wenn du sie auf der Rechnung mit „0 % / steuerfrei“ und dem Hinweis auf die Steuerbefreiung erfasst. Verkäufe von Anlagegütern zählen nicht zur Grenze – erfasst du sie als Rechnung, kann der angezeigte Wert zu hoch sein. Einnahmen außerhalb von Amtlos sind nicht enthalten.'
  en: 'If you exceed €100,000 in the current year (€25,000 in the founding year), the very sale with which you exceed the limit is already taxable. The small business scheme also requires that your turnover in the previous year was at most €25,000. If you exceed this limit this year without going above €100,000, the scheme continues to apply until the end of the year; standard taxation is intended from 1 January of the following year. What counts is turnover based on payments received – the net amounts you are paid, not the invoices by invoice date. Amtlos counts the payments received on your invoices in Amtlos (net) and your cash register takings according to the daily closings; services to businesses abroad are not included. If you have not recorded a payment for an invoice, Amtlos counts it, to be on the safe side, at the invoice date – record payments received and Amtlos calculates more precisely. Amtlos leaves out tax-exempt sales (e.g. medical treatments) if you record them on the invoice with “0 % / steuerfrei” (tax-exempt) and the note on the tax exemption. Sales of fixed assets do not count towards the limit – if you record them as an invoice, the value shown may be too high. Income outside Amtlos is not included.'
- de: Ab 10.7.2027 darfst du für Waren oder Dienstleistungen keine Barzahlungen über 10.000 € mehr annehmen oder leisten – auch nicht in mehreren zusammenhängenden Teilbeträgen.
  en: From 10.7.2027 you may no longer accept or make cash payments above €10,000 for goods or services – not even in several linked partial amounts.
- de: Altbatterien zurücknehmen, wenn du Gerätebatterien verkaufst
  en: Take back waste batteries if you sell portable batteries
- de: Arbeiten an Fahrzeug-Klimaanlagen, bei denen Kältemittel zurückgewonnen oder nachgefüllt wird, dürfen nur Personen mit einer Bescheinigung über ihre Sachkunde ausführen. Das regeln die EU-F-Gase-Verordnung
    (EU) 2024/573 und die Chemikalien-Klimaschutzverordnung. Halte die Bescheinigungen deiner Mitarbeitenden bereit. Bescheinigungen nach der früheren F-Gase-Verordnung (EU) Nr. 517/2014 bleiben unter den
    Bedingungen gültig, unter denen sie ausgestellt wurden; wer eine solche Bescheinigung hat, nimmt aber spätestens am 12.3.2029 erstmals an einem Auffrischungskurs teil oder schließt ein Bewertungsverfahren
    ab (Art. 10 Abs. 9 VO (EU) 2024/573).
  en: Work on vehicle air-conditioning systems in which refrigerant is recovered or refilled may only be carried out by persons with a certificate of their competence. This is governed by the EU F-gas Regulation
    (EU) 2024/573 and the Chemicals Climate Protection Ordinance (ChemKlimaschutzV). Keep your employees' certificates at hand. Certificates under the former F-gas Regulation (EU) No 517/2014 remain valid
    under the conditions under which they were issued; anyone holding such a certificate must, however, attend a refresher course or complete an assessment for the first time by 12.3.2029 at the latest
    (Art. 10(9) Regulation (EU) 2024/573).
- de: Bargeldobergrenze 10.000 € (ab 10.7.2027)
  en: Cash payment limit €10,000 (from 10.7.2027)
- de: Betroffene benachrichtigt oder kein hohes Risiko festgestellt
  en: Affected persons notified or no high risk found
- de: Bei hohem Risiko die Betroffenen benachrichtigen
  en: Notify the persons affected if there is a high risk
- de: Bringt eine Datenpanne voraussichtlich ein hohes Risiko für die betroffenen Menschen, benachrichtigst du sie unverzüglich.
  en: If a data breach is likely to result in a high risk to the people affected, you notify them without undue delay.
- de: Bußgeld bis 100.000 €, wenn du Batterien bereitstellst, ohne deine Rücknahmepflichten zu erfüllen (§ 60 Abs. 1 Nr. 1 Buchst. b, Abs. 3 in Verbindung mit § 4 Abs. 2 BattDG) oder zurückgenommene Altbatterien
    keiner Organisation für Herstellerverantwortung überlässt (§ 60 Abs. 1 Nr. 6, Abs. 3 in Verbindung mit § 14 Abs. 3 Satz 1 BattDG); bis 10.000 €, wenn du eine Altbatterie nicht, nicht richtig oder nicht
    vollständig zurücknimmst (§ 60 Abs. 2 Nr. 26, Abs. 3 BattDG in Verbindung mit Art. 62 Abs. 1 VO (EU) 2023/1542).
  en: Fine of up to €100,000 if you make batteries available without fulfilling your take-back obligations (§ 60(1) no. 1(b), (3) in conjunction with § 4(2) BattDG) or do not hand over waste batteries taken
    back to a producer responsibility organisation (§ 60(1) no. 6, (3) in conjunction with § 14(3) sentence 1 BattDG); up to €10,000 if you do not take back a waste battery, or not correctly or not completely
    (§ 60(2) no. 26, (3) BattDG in conjunction with Art. 62(1) Regulation (EU) 2023/1542).
- de: Bußgeld bis 20.000 €, wenn du Personen mit Kraftfahrzeugen ohne die erforderliche Genehmigung oder einstweilige Erlaubnis beförderst (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG).
  en: Fine of up to €20,000 if you carry passengers with motor vehicles without the required permit or provisional authorisation (§ 61(1) no. 1, (2) PBefG).
- de: Das Personenbeförderungsgesetz gilt für die entgeltliche oder geschäftsmäßige Beförderung von Personen; als Entgelt zählen auch wirtschaftliche Vorteile (§ 1 Abs. 1 PBefG). Wer mit Kraftfahrzeugen
    im Linienverkehr oder im Gelegenheitsverkehr – dazu gehören Taxi- und Mietwagenverkehr – Personen befördert, muss eine Genehmigung haben (§ 2 Abs. 1 Satz 1 PBefG). Ausgenommen sind Fahrten mit Personenkraftwagen,
    die unentgeltlich sind oder deren Gesamtentgelt je Kilometer den Betrag nach § 5 Abs. 2 Satz 1 des Bundesreisekostengesetzes nicht übersteigt (§ 1 Abs. 2 PBefG). Die Genehmigung beantragst du vor dem
    Start bei der zuständigen Genehmigungsbehörde deines Landes.
  en: The Passenger Transport Act (PBefG) applies to carrying passengers for payment or on a business basis; economic advantages also count as payment (§ 1(1) PBefG). Anyone who carries passengers with
    motor vehicles in scheduled services or in occasional services – which include taxi and hire-car services – must hold a permit (§ 2(1) sentence 1 PBefG). Exempt are trips by passenger car that are free
    of charge or whose total payment per kilometre does not exceed the amount under § 5(2) sentence 1 of the Federal Travel Expenses Act (§ 1(2) PBefG). You apply for the permit before you start, at the
    competent permit authority of your federal state.
- de: Die EU-Geldwäscheverordnung (EU) 2024/1624 gilt ab 10.7.2027 (Art. 90). Personen, die mit Gütern handeln oder Dienstleistungen erbringen, dürfen dann Barzahlungen nur bis höchstens 10.000 € oder den
    Gegenwert in anderer Währung entgegennehmen oder vornehmen – egal, ob in einem Vorgang oder in mehreren Vorgängen, zwischen denen eine Verbindung zu bestehen scheint (Art. 80 Abs. 1). Ausgenommen sind
    Zahlungen zwischen Privatpersonen, die nicht beruflich handeln, und Zahlungen oder Einlagen in den Räumen von Banken und Zahlungsdienstleistern (Art. 80 Abs. 4). Die Mitgliedstaaten dürfen niedrigere
    Obergrenzen festlegen (Art. 80 Abs. 2). Bis dahin gelten die Sorgfaltspflichten des Geldwäschegesetzes bei hohen Bargeschäften weiter.
  en: The EU Anti-Money Laundering Regulation (EU) 2024/1624 applies from 10.7.2027 (Art. 90). Persons trading in goods or providing services may then accept or make cash payments only up to €10,000 or
    the equivalent in another currency – whether in a single operation or in several operations which appear to be linked (Art. 80(1)). Exempt are payments between private individuals not acting in a professional
    capacity, and payments or deposits made at the premises of banks and payment service providers (Art. 80(4)). Member States may set lower limits (Art. 80(2)). Until then, the due diligence obligations
    of the Anti-Money Laundering Act (GwG) for large cash transactions continue to apply.
- de: Die betroffenen Personen
  en: The persons affected
- de: Du meldest unverzüglich und möglichst binnen 72 Stunden, nachdem dir die Panne bekannt wurde; eine spätere Meldung musst du begründen (Art. 33 Abs. 1 DSGVO). Die 72 Stunden laufen stundengenau ab
    dem Zeitpunkt, an dem du von der Panne erfährst, auch über das Wochenende. Der Termin im Kalender liegt deshalb zwei Tage nach dem Tag der Entdeckung – der letzte volle Tag innerhalb der 72 Stunden,
    egal zu welcher Uhrzeit du davon erfahren hast. Keine Meldung ist nötig, wenn voraussichtlich kein Risiko für die Betroffenen besteht – das entscheidest und dokumentierst du. Zuständig ist die Datenschutz-Aufsichtsbehörde
    deines Landes, in Baden-Württemberg zum Beispiel der Landesbeauftragte für den Datenschutz und die Informationsfreiheit in Stuttgart, in Bayern das Bayerische Landesamt für Datenschutzaufsicht in Ansbach;
    Amtlos nennt dir die Behörde zu deinem Bundesland. Amtlos zeigt einen Countdown und erstellt einen Meldeentwurf.
  en: You report without undue delay and, where feasible, within 72 hours of becoming aware of the breach; if you report later, you must give reasons for the delay (Art. 33(1) GDPR). The 72 hours run to
    the hour from the moment you learn of the breach, including over the weekend. The deadline in the calendar is therefore two days after the day of discovery – the last full day within the 72 hours, whatever
    time you learned of it. No report is needed if the breach is unlikely to result in a risk to the people affected – you decide this and document it. The competent authority is the data protection supervisory
    authority of your federal state, for example in Baden-Württemberg the State Commissioner for Data Protection and Freedom of Information in Stuttgart, in Bavaria the Bavarian State Office for Data Protection
    Supervision in Ansbach; Amtlos tells you the authority for your federal state. Amtlos shows a countdown and prepares a draft report.
- de: Du selbst; Organisation für Herstellerverantwortung
  en: You yourself; producer responsibility organisation
- de: Du verkaufst Produkte, die das Barrierefreiheitsstärkungsgesetz nennt (§ 1 Abs. 2 BFSG).
  en: You sell products named in the Accessibility Strengthening Act (§ 1(2) BFSG).
- de: Eine Erlaubnis nach dem Güterkraftverkehrsgesetz oder eine Gemeinschaftslizenz brauchst du für die gewerbliche Beförderung von Gütern mit Fahrzeugen, die einschließlich Anhänger mehr als 3,5 t zulässige
    Gesamtmasse haben (§§ 1, 3 GüKG). Für grenzüberschreitende Fahrten und Kabotage brauchst du eine Gemeinschaftslizenz – seit dem 21.5.2022 auch für Fahrzeuge über 2,5 t bis 3,5 t (Verordnung (EG) Nr.
    1072/2009); seit 2022 wird die Gemeinschaftslizenz auch für den Inlandsverkehr erteilt. Werkverkehr, also die Beförderung eigener Güter mit eigenen Fahrzeugen für eigene Zwecke, ist erlaubnisfrei (§
    1 Abs. 2, 3 GüKG) – das betrifft etwa Handwerksbetriebe, Bäckereien und Händler. Für die Beförderung von Personen, etwa im Taxi- und Mietwagenverkehr, brauchst du unabhängig davon eine Genehmigung nach
    dem Personenbeförderungsgesetz – das ist eine eigene Pflicht.
  en: You need a licence under the Road Haulage Act (GüKG) or a Community licence for the commercial carriage of goods with vehicles whose permissible total mass, including trailer, exceeds 3.5 t (§§ 1,
    3 GüKG). For cross-border journeys and cabotage you need a Community licence – since 21.5.2022 also for vehicles over 2.5 t up to 3.5 t (Regulation (EC) No 1072/2009); since 2022 the Community licence
    has also been issued for domestic transport. Own-account transport, i.e. carrying your own goods with your own vehicles for your own purposes, does not require a licence (§ 1(2), (3) GüKG) – this concerns,
    for example, craft businesses, bakeries and retailers. For carrying passengers, for example in taxi and hire-car services, you need a permit under the Passenger Transport Act (PBefG) in any case – this
    is a separate obligation.
- de: Eure GbR steht noch nicht im Gesellschaftsregister.
  en: Your GbR is not yet entered in the register of civil-law partnerships.
- de: Genehmigung für die Personenbeförderung
  en: Permit for passenger transport
- de: Genehmigungsbehörde nach dem Personenbeförderungsgesetz
  en: Permit authority under the Passenger Transport Act
- de: Hat die Verletzung des Schutzes personenbezogener Daten voraussichtlich ein hohes Risiko für die persönlichen Rechte und Freiheiten der Betroffenen zur Folge, benachrichtigst du die betroffenen Personen
    unverzüglich (Art. 34 Abs. 1 DSGVO) – zusätzlich zur Meldung an die Aufsichtsbehörde. Die Benachrichtigung beschreibt in klarer und einfacher Sprache, was passiert ist, und nennt mindestens eine Kontaktstelle
    für weitere Informationen, die wahrscheinlichen Folgen und die Maßnahmen, die du ergriffen hast oder vorschlägst (Art. 34 Abs. 2 in Verbindung mit Art. 33 Abs. 3 Buchst. b bis d DSGVO). Nicht nötig
    ist sie, wenn die betroffenen Daten geschützt waren – etwa durch Verschlüsselung –, wenn du durch spätere Maßnahmen sichergestellt hast, dass das hohe Risiko aller Wahrscheinlichkeit nach nicht mehr
    besteht, oder wenn sie unverhältnismäßigen Aufwand bedeuten würde; dann informierst du stattdessen öffentlich oder auf ähnlich wirksame Weise (Art. 34 Abs. 3 DSGVO). Die Aufsichtsbehörde kann verlangen,
    dass du die Benachrichtigung nachholst (Art. 34 Abs. 4 DSGVO).
  en: If the personal data breach is likely to result in a high risk to the rights and freedoms of the people affected, you notify the persons affected without undue delay (Art. 34(1) GDPR) – in addition
    to reporting to the supervisory authority. The notification describes in clear and plain language what happened and states at least a contact point for further information, the likely consequences and
    the measures you have taken or propose (Art. 34(2) in conjunction with Art. 33(3)(b) to (d) GDPR). It is not required if the data concerned were protected – for example by encryption –, if subsequent
    measures have ensured that the high risk is in all likelihood no longer present, or if it would involve disproportionate effort; in that case you inform the public instead or in a similarly effective
    way (Art. 34(3) GDPR). The supervisory authority can require you to make up for the notification (Art. 34(4) GDPR).
- de: Händler nehmen Geräte-Altbatterien und Altbatterien für leichte Verkehrsmittel (LV-Altbatterien, etwa aus E-Bikes und E-Scootern) vom Endnutzer im Geschäft oder in unmittelbarer Nähe unentgeltlich
    zurück – unabhängig von chemischer Zusammensetzung, Marke, Herkunft, Baugröße und Beschaffenheit und ohne dass ein Neukauf verlangt werden darf (Art. 62 Abs. 1 VO (EU) 2023/1542, § 14 Abs. 1 Satz 1
    BattDG). Die Pflicht gilt für die Batteriekategorien, die du als Neubatterien führst oder geführt hast, und für die Mengen, die Endnutzer üblicherweise abgeben; Geräte mit eingebauten Altbatterien fallen
    nicht darunter – für sie gilt das Elektrogesetz (§ 14 Abs. 1 Satz 2 bis 4 BattDG). Verkaufst du im Fernabsatz, richtest du Rückgabemöglichkeiten in zumutbarer Entfernung zu deinen Kunden ein (§ 14 Abs.
    2 BattDG, Art. 62 Abs. 4, 5 VO (EU) 2023/1542). Die zurückgenommenen Altbatterien überlässt du einer für die Batteriekategorie zugelassenen Organisation für Herstellerverantwortung (§ 14 Abs. 3 BattDG).
    Batterien bereitstellen darfst du nur, wenn Endnutzer Altbatterien bei dir zurückgeben können (§ 4 Abs. 2 BattDG).
  en: Retailers take back waste portable batteries and waste batteries for light means of transport (LMT waste batteries, for example from e-bikes and e-scooters) from end users free of charge in the shop
    or in its immediate vicinity – regardless of chemical composition, brand, origin, size and condition, and without requiring the purchase of a new battery (Art. 62(1) Regulation (EU) 2023/1542, § 14(1)
    sentence 1 BattDG). The obligation applies to the battery categories you stock or have stocked as new batteries, and to the quantities end users usually hand in; devices with built-in waste batteries
    are not covered – the Electrical and Electronic Equipment Act (ElektroG) applies to them (§ 14(1) sentences 2 to 4 BattDG). If you sell at a distance, you set up suitable return options within reasonable
    distance of your customers (§ 14(2) BattDG, Art. 62(4), (5) Regulation (EU) 2023/1542). You hand over the waste batteries taken back to a producer responsibility organisation approved for the battery
    category (§ 14(3) BattDG). You may only make batteries available if end users can return waste batteries to you (§ 4(2) BattDG).
- de: Ihr befördert Güter für andere gegen Entgelt.
  en: You carry goods for others for payment.
- de: Ihr befördert Personen gegen Entgelt.
  en: You carry passengers for payment.
- de: Kundschaft auf Überweisung oder Kartenzahlung umstellen
  en: Switch customers to bank transfer or card payment
- de: Noch keine – die Obergrenze gilt ab 10.7.2027; die Sanktionen legen die Mitgliedstaaten fest (Art. 80 Abs. 5 VO (EU) 2024/1624).
  en: None yet – the limit applies from 10.7.2027; penalties are laid down by the Member States (Art. 80(5) Regulation (EU) 2024/1624).
- de: Prüfen, bei welchen Geschäften Barzahlungen über 10.000 € vorkommen
  en: Check which transactions involve cash payments above €10,000
- de: Verkaufst du Gerätebatterien oder Batterien für leichte Verkehrsmittel, nimmst du Altbatterien dieser Art von Endnutzern kostenlos zurück – auch ohne Neukauf.
  en: If you sell portable batteries or batteries for light means of transport, you take back waste batteries of this kind from end users free of charge – even without a new purchase.
- de: Wer Personen entgeltlich oder geschäftsmäßig mit Kraftfahrzeugen befördert – etwa mit Taxi, Mietwagen oder Bus –, braucht eine Genehmigung nach dem Personenbeförderungsgesetz.
  en: Anyone who carries passengers for payment or on a business basis with motor vehicles – for example by taxi, hire car or bus – needs a permit under the Passenger Transport Act (PBefG).
- de: 'Mit deinen offenen Rechnungen würdest du die Grenze überschreiten'
  en: 'With your open invoices you would exceed the limit'
- de: 'Zählt Amtlos deine Rechnungen ohne vermerkten Zahlungseingang mit, liegt dein Umsatz über einer Kleinunternehmergrenze. Mit den Zahlungen, die du schon bekommen hast, liegt er noch darunter.'
  en: 'If Amtlos includes your invoices without a recorded payment, your turnover is above a small business limit. With the payments you have already received, it is still below.'
- de: 'Für die Kleinunternehmergrenze zählt nur Geld, das du schon bekommen hast (vereinnahmte Entgelte, netto). Die Grenze liegt bei 25.000 € im Vorjahr und im Gründungsjahr und bei 100.000 € im laufenden Jahr; über 25.000 € in diesem Jahr gilt ab 1. Januar die Regelbesteuerung. Amtlos zählt Rechnungen ohne vermerkten Zahlungseingang hier mit dem Rechnungsdatum mit – dann liegt dein Umsatz über einer dieser Grenzen. Mit den erhaltenen Zahlungen allein liegt er noch darunter. Solange das so ist, bleibst du Kleinunternehmer und weist auf deinen Rechnungen keine Umsatzsteuer aus: Wer Umsatzsteuer in einer Rechnung gesondert ausweist, obwohl er dazu nicht berechtigt ist, schuldet den ausgewiesenen Betrag (§ 14c Abs. 2 UStG). Gehen die offenen Beträge ein, kann die Grenze überschritten sein. Vermerke deshalb deine Zahlungseingänge in Amtlos – dann rechnet Amtlos genau und zeigt dir, wenn die Grenze mit deinen Zahlungen tatsächlich überschritten ist. Steuerfreie Umsätze (z. B. Heilbehandlungen) rechnet Amtlos heraus, wenn du sie auf der Rechnung mit „0 % / steuerfrei“ und dem Hinweis auf die Steuerbefreiung erfasst. Verkäufe von Anlagegütern zählen nicht zur Grenze – erfasst du sie als Rechnung, kann der angezeigte Wert zu hoch sein. Einnahmen außerhalb von Amtlos sind nicht enthalten.'
  en: 'For the small business limit, only money you have already received counts (payments received, net). The limit is €25,000 for the previous year and the founding year and €100,000 for the current year; above €25,000 this year, standard taxation applies from 1 January. Here Amtlos also counts invoices without a recorded payment at their invoice date – then your turnover is above one of these limits. With the payments received alone, it is still below. As long as that is the case, you remain a small business and do not show VAT on your invoices: anyone who shows VAT separately on an invoice without being entitled to do so owes the amount shown (§ 14c(2) UStG). Once the open amounts are paid, the limit may be exceeded. So record your payments received in Amtlos – then Amtlos calculates precisely and shows you when your payments actually exceed the limit. Amtlos leaves out tax-exempt sales (e.g. medical treatments) if you record them on the invoice with “0 % / steuerfrei” (tax-exempt) and the note on the tax exemption. Sales of fixed assets do not count towards the limit – if you record them as an invoice, the value shown may be too high. Income outside Amtlos is not included.'
- de: 'Mit deinen offenen Rechnungen liegen deine Einnahmen laut Amtlos im Gründungsjahr über 25.000 €.'
  en: 'With your open invoices, your income according to Amtlos is above €25,000 in the founding year.'
- de: 'Mit deinen offenen Rechnungen liegen deine Einnahmen laut Amtlos in diesem Jahr über 100.000 €.'
  en: 'With your open invoices, your income according to Amtlos is above €100,000 this year.'
- de: 'Mit deinen offenen Rechnungen liegen deine Einnahmen laut Amtlos in diesem Jahr über 25.000 €.'
  en: 'With your open invoices, your income according to Amtlos is above €25,000 this year.'
- de: 'Mit deinen offenen Rechnungen lagen deine Einnahmen laut Amtlos im Vorjahr über 25.000 €.'
  en: 'With your open invoices, your income according to Amtlos was above €25,000 last year.'
- de: 'Mit den erhaltenen Zahlungen allein liegen sie nicht über 25.000 €.'
  en: 'With the payments received alone, it is not above €25,000.'
- de: 'Mit den erhaltenen Zahlungen allein liegen sie nicht über 100.000 €.'
  en: 'With the payments received alone, it is not above €100,000.'
- de: 'Mit den erhaltenen Zahlungen allein lagen sie nicht über 25.000 €.'
  en: 'With the payments received alone, it was not above €25,000.'
- de: 'Weist du Umsatzsteuer aus, obwohl du dazu nicht berechtigt bist, schuldest du den ausgewiesenen Betrag (§ 14c Abs. 2 UStG).'
  en: 'If you show VAT although you are not entitled to do so, you owe the amount shown (§ 14c(2) UStG).'
- de: Als Hersteller – dazu zählt auch, wer unter eigenem Namen oder eigener Marke verkauft – bringst du ein Verbraucherprodukt erst in Verkehr, wenn es eine Typen-, Chargen- oder Seriennummer oder ein
    anderes Element zur Identifizierung trägt (Art. 9 Abs. 5 GPSR), dein Name, deine Handelsmarke, Postanschrift und elektronische Adresse auf dem Produkt, der Verpackung oder einer beigefügten Unterlage
    stehen (Art. 9 Abs. 6) und Anweisungen und Sicherheitsinformationen beiliegen (Art. 9 Abs. 7). Dazu gehören eine interne Risikoanalyse und technische Unterlagen (Art. 9 Abs. 2, 3). Führst du Produkte
    von außerhalb der EU ein, gibst du zusätzlich deine eigenen Angaben an (Art. 11 GPSR). Ein Produkt darf nur in Verkehr gebracht werden, wenn ein in der EU niedergelassener Wirtschaftsakteur dafür verantwortlich
    ist (verantwortliche Person, Art. 16 GPSR) – wichtig vor allem, wenn der Hersteller außerhalb der EU sitzt und du einführst. Hast du als Hersteller Grund zur Annahme, dass ein Produkt gefährlich ist,
    ergreifst du unverzüglich Korrekturmaßnahmen bis hin zu Rücknahme oder Rückruf, informierst die Verbraucher und unterrichtest die Marktüberwachungsbehörden über das Safety-Business-Gateway (Art. 9 Abs.
    8 GPSR). Unfälle, bei denen ein Produkt zum Tod oder zu schweren Gesundheitsschäden geführt hat, meldest du unverzüglich über das Safety-Business-Gateway (Art. 20 Abs. 1, 2 GPSR). Für Kosmetik geht
    die Kosmetikverordnung vor, die GPSR gilt ergänzend (Art. 2 Abs. 1). Lebensmittel fallen nicht unter die Verordnung.
  en: As a manufacturer – this includes anyone who sells under their own name or brand – you only place a consumer product on the market once it bears a type, batch or serial number or another element allowing
    its identification (Art. 9(5) GPSR), your name, trade mark, postal address and electronic address are on the product, its packaging or an accompanying document (Art. 9(6)) and instructions and safety
    information are enclosed (Art. 9(7)). This also includes an internal risk analysis and technical documentation (Art. 9(2), (3)). If you import products from outside the EU, you additionally state your
    own details (Art. 11 GPSR). A product may only be placed on the market if an economic operator established in the EU is responsible for it (responsible person, Art. 16 GPSR) – this matters above all
    if the manufacturer is based outside the EU and you import. If, as a manufacturer, you have reason to believe that a product is dangerous, you take corrective action without delay, up to withdrawal
    or recall, inform consumers and notify the market surveillance authorities via the Safety Business Gateway (Art. 9(8) GPSR). Accidents in which a product has caused death or serious harm to health are
    reported without delay via the Safety Business Gateway (Art. 20(1), (2) GPSR). For cosmetics the Cosmetics Regulation takes precedence and the GPSR applies in addition (Art. 2(1)). Food is not covered
    by the Regulation.
- de: Arbeiten an Fahrzeug-Klimaanlagen, bei denen Kältemittel zurückgewonnen oder nachgefüllt wird, dürfen nur Personen mit einer Bescheinigung über ihre Sachkunde ausführen. Das regeln die EU-F-Gase-Verordnung
    (EU) 2024/573 und die Chemikalien-Klimaschutzverordnung. Halte die Bescheinigungen deiner Mitarbeitenden bereit. Bescheinigungen nach der früheren F-Gase-Verordnung (EU) Nr. 517/2014 – auch die Ausbildungsbescheinigungen
    für Fahrzeug-Klimaanlagen nach der Verordnung (EG) Nr. 307/2008 – bleiben unter den Bedingungen gültig, unter denen sie ausgestellt wurden; wer eine solche Bescheinigung hat, nimmt aber spätestens am
    12.3.2029 erstmals an einem Auffrischungskurs teil oder schließt ein Bewertungsverfahren ab (Art. 10 Abs. 9 VO (EU) 2024/573).
  en: Work on vehicle air-conditioning systems in which refrigerant is recovered or refilled may only be carried out by persons with a certificate of their competence. This is governed by the EU F-gas Regulation
    (EU) 2024/573 and the Chemicals Climate Protection Ordinance (ChemKlimaschutzV). Keep your employees' certificates at hand. Certificates under the former F-gas Regulation (EU) No 517/2014 – including
    training attestations for vehicle air-conditioning systems under Regulation (EC) No 307/2008 – remain valid under the conditions under which they were issued; anyone holding such a certificate must,
    however, attend a refresher course or complete an assessment for the first time by 12.3.2029 at the latest (Art. 10(9) Regulation (EU) 2024/573).
- de: Bußgeld bis 10.000 €, wenn vor dem Inverkehrbringen Pflichtangaben fehlen oder Anweisungen und Sicherheitsinformationen nicht beigefügt sind (§ 28 Abs. 2 Nr. 5, 6, Abs. 3 ProdSG); auch Risikoanalyse,
    technische Unterlagen und Identifizierung sind bußgeldbewehrt (§ 28 Abs. 2 Nr. 1 bis 4 ProdSG). Die Marktüberwachung kann außerdem Maßnahmen bis hin zur Rücknahme oder zum Rückruf anordnen (§ 26 ProdSG).
  en: Fine of up to €10,000 if mandatory information is missing before placing on the market or instructions and safety information are not enclosed (§ 28(2) nos. 5, 6, (3) ProdSG); the risk analysis, technical
    documentation and identification are also subject to fines (§ 28(2) nos. 1 to 4 ProdSG). Market surveillance can also order measures up to withdrawal or recall (§ 26 ProdSG).
- de: Bußgeld bis 25.000 € (§ 111 Abs. 1 Nr. 5 SGB IV i. V. m. § 99 Abs. 1 SGB IV; daneben § 209 Abs. 1 Nr. 5 SGB VII).
  en: Fine of up to €25,000 (§ 111(1) no. 5 SGB IV in conjunction with § 99(1) SGB IV; in addition § 209(1) no. 5 SGB VII).
- de: Bußgeld, wenn kein System zum Befüllen mitgebrachter Behälter vorgesehen oder die Mehrwegmöglichkeit nicht eingeräumt wird oder wenn das Befüllen oder Mehrweg teurer oder zu schlechteren Bedingungen
    angeboten wird oder der Hinweis fehlt (§ 66 Abs. 2 Nr. 29 bis 32 VerpackDG).
  en: Fine if no system for filling containers brought by customers is provided or the reusable option is not offered, or if filling or reusable packaging is offered at a higher price or on worse terms,
    or the notice is missing (§ 66(2) nos. 29 to 32 VerpackDG).
- de: Das Personenbeförderungsgesetz gilt für die entgeltliche oder geschäftsmäßige Beförderung von Personen; als Entgelt zählen auch wirtschaftliche Vorteile (§ 1 Abs. 1 PBefG). Wer mit Kraftfahrzeugen
    im Linienverkehr oder im Gelegenheitsverkehr – dazu gehören Taxi- und Mietwagenverkehr – Personen befördert, muss eine Genehmigung haben (§ 2 Abs. 1 Satz 1 PBefG). Ausgenommen sind Fahrten mit Personenkraftwagen,
    die unentgeltlich sind oder deren Gesamtentgelt je Kilometer den Betrag nach § 5 Abs. 2 Satz 1 des Bundesreisekostengesetzes nicht übersteigt (§ 1 Abs. 2 PBefG). Weitere Fälle stellt die Freistellungs-Verordnung
    frei, zum Beispiel die unentgeltliche Beförderung von Beschäftigten durch den Arbeitgeber zu betrieblichen Zwecken zwischen Arbeitsstätten desselben Betriebs (§ 1 Nr. 4 Buchst. h FrStllgV). Die Genehmigung
    beantragst du vor dem Start bei der Genehmigungsbehörde deines Landes, meist beim Landkreis oder bei der kreisfreien Stadt. Wer Taxi oder Mietwagen fährt, braucht außerdem eine Fahrerlaubnis zur Fahrgastbeförderung
    (§ 48 Abs. 1 FeV); als Halter darfst du die Fahrt ohne sie nicht anordnen oder zulassen (§ 48 Abs. 7 FeV).
  en: The Passenger Transport Act (PBefG) applies to carrying passengers for payment or on a business basis; economic advantages also count as payment (§ 1(1) PBefG). Anyone who carries passengers with
    motor vehicles in scheduled services or in occasional services – which include taxi and hire-car services – must hold a permit (§ 2(1) sentence 1 PBefG). Exempt are trips by passenger car that are free
    of charge or whose total payment per kilometre does not exceed the amount under § 5(2) sentence 1 of the Federal Travel Expenses Act (§ 1(2) PBefG). Further cases are exempted by the Exemption Ordinance
    (Freistellungs-Verordnung), for example the free carriage of employees by the employer for business purposes between workplaces of the same business (§ 1 no. 4(h) FrStllgV). You apply for the permit
    before you start, at the permit authority of your federal state, usually the district (Landkreis) or the independent city. Anyone driving a taxi or hire car also needs a passenger transport licence
    (Fahrerlaubnis zur Fahrgastbeförderung, § 48(1) FeV); as the vehicle keeper you may not order or allow the trip without it (§ 48(7) FeV).
- de: Die Außenwirtschaftsverordnung verlangt Meldungen für Zahlungen, die du von Gebietsfremden erhältst oder an Gebietsfremde leistest (§ 67 AWV). Meldepflichtig sind seit dem 1.1.2025 Zahlungen über
    50.000 € (§ 67 Abs. 2 Nr. 1 AWV) – das gilt für alle solchen Zahlungen, nicht nur für Geld von Investoren. Ausgenommen sind Zahlungen für die Einfuhr, Ausfuhr oder Verbringung von Waren. Die Meldung
    geht elektronisch an die Deutsche Bundesbank, und zwar bis zum siebten Werktag des Monats, der auf die Zahlung folgt (§ 71 Abs. 6 AWV) – für jeden Monat, in dem du eine meldepflichtige Zahlung erhältst
    oder leistest.
  en: The Foreign Trade and Payments Ordinance requires reports for payments you receive from or make to non-residents (§ 67 AWV). Since 1.1.2025, payments of more than €50,000 must be reported (§ 67(2)
    no. 1 AWV) – this applies to all such payments, not only to money from investors. Payments for the import, export or transfer of goods are exempt. The report is submitted electronically to the Deutsche
    Bundesbank by the seventh working day of the month following the payment (§ 71(6) AWV) – for every month in which you receive or make a reportable payment.
- de: Fehlt der Aushang des Arbeitszeitgesetzes, droht ein Bußgeld bis 5.000 € (§ 22 Abs. 1 Nr. 8, Abs. 2 ArbZG), ebenso beim Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde und beim Aushang
    der Arbeitszeit und Pausen der Jugendlichen (§ 59 Abs. 1 Nr. 7, 8, Abs. 3 JArbSchG). Für den Aushang des Mutterschutzgesetzes sieht § 32 MuSchG kein Bußgeld vor. Für die Information nach dem AGG gibt
    es kein Bußgeld; fehlt sie, droht aber ein Entschädigungsrisiko (§ 15 AGG). Für das Zugänglichmachen der Unfallverhütungsvorschriften gibt es kein Bußgeld.
  en: If the Working Hours Act (Arbeitszeitgesetz) is not displayed, there is a risk of a fine of up to €5,000 (§ 22(1) no. 8, (2) ArbZG); the same applies to the Youth Employment Protection Act with the
    address of the supervisory authority and to the notice of working hours and breaks of young people (§ 59(1) no. 7, 8, (3) JArbSchG). § 32 MuSchG provides no fine for displaying the Maternity Protection
    Act. There is no fine for the information under the AGG; if it is missing, however, there is a risk of compensation claims (§ 15 AGG). There is no fine for making the accident prevention regulations
    accessible.
- de: 'Für Auszubildende gilt nicht der gesetzliche Mindestlohn (§ 22 Abs. 3 MiLoG), sondern eine angemessene Vergütung, mindestens die Mindestausbildungsvergütung nach § 17 BBiG. Sie steigt mit jedem Ausbildungsjahr
    und richtet sich nach dem Jahr, in dem die Ausbildung beginnt (§ 17 Abs. 2 BBiG): Beginnt die Ausbildung 2026, sind es monatlich mindestens 724 € im ersten, 854 € im zweiten, 977 € im dritten und 1.014
    € im vierten Ausbildungsjahr; beginnt sie 2027, 764 €, 902 €, 1.031 € und 1.070 € (Bekanntmachung im BGBl. 2026 I Nr. 287). Die Beträge gelten für die gesamte Ausbildung nach dem Jahr des Beginns. Gilt
    für dich ein Tarifvertrag, geht dessen Vergütung vor (§ 17 Abs. 3, 4 BBiG).'
  en: 'Apprentices are not covered by the statutory minimum wage (§ 22(3) MiLoG) but by an appropriate allowance, at least the minimum training allowance under § 17 BBiG. It rises with each year of training
    and depends on the year in which the training starts (§ 17(2) BBiG): if training starts in 2026, it is at least €724 a month in the first, €854 in the second, €977 in the third and €1,014 in the fourth
    year of training; if it starts in 2027, €764, €902, €1,031 and €1,070 (announcement in BGBl. 2026 I No. 287). The amounts apply for the entire training according to the year it started. If a collective
    agreement applies to you, its pay takes precedence (§ 17(3), (4) BBiG).'
- de: Genehmigungsbehörde des Landes (meist Landkreis oder kreisfreie Stadt)
  en: Permit authority of the federal state (usually the district or independent city)
- de: 'Händler nehmen Geräte-Altbatterien und Altbatterien für leichte Verkehrsmittel (LV-Altbatterien, etwa aus E-Bikes und E-Scootern) vom Endnutzer im Geschäft oder in unmittelbarer Nähe unentgeltlich
    zurück – unabhängig von chemischer Zusammensetzung, Marke, Herkunft, Baugröße und Beschaffenheit und ohne dass ein Neukauf verlangt werden darf (Art. 62 Abs. 1 VO (EU) 2023/1542, § 14 Abs. 1 Satz 1
    BattDG). Die Rücknahme ist auf dein eigenes Sortiment und auf haushaltsübliche Mengen beschränkt: Sie gilt für die Batteriekategorien, die du als Neubatterien führst oder geführt hast, und für die Menge,
    derer sich private Endnutzer üblicherweise entledigen (§ 14 Abs. 1 Satz 2 BattDG). Produkte mit eingebauten Altbatterien fallen nicht darunter – für sie gelten das Elektrogesetz und die Altfahrzeug-Verordnung
    (§ 14 Abs. 1 Satz 3 BattDG). Verkaufst du im Fernabsatz, richtest du Rückgabemöglichkeiten in zumutbarer Entfernung zu deinen Kunden ein (§ 14 Abs. 2 BattDG, Art. 62 Abs. 4, 5 VO (EU) 2023/1542). Die
    zurückgenommenen Altbatterien überlässt du einer für die Batteriekategorie zugelassenen Organisation für Herstellerverantwortung (§ 14 Abs. 3 BattDG). Batterien bereitstellen darfst du nur, wenn Endnutzer
    Altbatterien bei dir zurückgeben können (§ 4 Abs. 2 BattDG).'
  en: 'Retailers take back waste portable batteries and waste batteries for light means of transport (LMT waste batteries, for example from e-bikes and e-scooters) from end users free of charge in the shop
    or in its immediate vicinity – regardless of chemical composition, brand, origin, size and condition, and without requiring the purchase of a new battery (Art. 62(1) Regulation (EU) 2023/1542, § 14(1)
    sentence 1 BattDG). The take-back is limited to your own range and to household quantities: it applies to the battery categories you stock or have stocked as new batteries, and to the quantity that
    private end users usually dispose of (§ 14(1) sentence 2 BattDG). Products with built-in waste batteries are not covered – the Electrical and Electronic Equipment Act (ElektroG) and the End-of-Life
    Vehicles Ordinance apply to them (§ 14(1) sentence 3 BattDG). If you sell at a distance, you set up suitable return options within reasonable distance of your customers (§ 14(2) BattDG, Art. 62(4),
    (5) Regulation (EU) 2023/1542). You hand over the waste batteries taken back to a producer responsibility organisation approved for the battery category (§ 14(3) BattDG). You may only make batteries
    available if end users can return waste batteries to you (§ 4(2) BattDG).'
- de: Ohne Bescheinigung darfst du die jugendliche Person nicht beschäftigen (§ 32 Abs. 1 JArbSchG); Verstöße kosten bis 30.000 € (§ 58 Abs. 1 Nr. 22, Abs. 4 JArbSchG).
  en: Without the certificate you may not employ the young person (§ 32(1) JArbSchG); breaches cost up to €30,000 (§ 58(1) no. 22, (4) JArbSchG).
- de: Ohne Bescheinigung nach 14 Monaten darfst du die jugendliche Person nicht weiter beschäftigen (§ 33 Abs. 3 JArbSchG); Verstöße kosten bis 30.000 € (§ 58 Abs. 1 Nr. 23, Abs. 4 JArbSchG).
  en: Without a certificate after 14 months you may not continue to employ the young person (§ 33(3) JArbSchG); breaches cost up to €30,000 (§ 58(1) no. 23, (4) JArbSchG).
- de: 'Seit der Neuregelung von § 22 SGB VII (anzuwenden ab 29.5.2026) bestellen Unternehmen mit regelmäßig 50 oder mehr Beschäftigten Sicherheitsbeauftragte; Zahl und Auswahl richten sich nach den Unfall-
    und Gesundheitsgefahren und der Zahl der Beschäftigten. Bei mehr als 20 und weniger als 50 Beschäftigten ist ein Sicherheitsbeauftragter nur nötig, wenn nach der Gefährdungsbeurteilung eine besondere
    Gefährdung für Leben und Gesundheit besteht; die Berufsgenossenschaft kann die Kriterien festlegen und die Bestellung anordnen. Gezählt wird nach Köpfen: Teilzeitkräfte zählen voll, ebenso Auszubildende
    und Leiharbeitnehmer in dem Betrieb, in dem sie eingesetzt sind – eine anteilige Umrechnung wie beim Kündigungsschutz gibt es hier nicht (DGUV Regel 100-001, Abschnitt 4.2). In Unternehmen mit regelmäßig
    weniger als 250 Beschäftigten und ohne besondere Gefährdung für Leben und Gesundheit genügt ein Sicherheitsbeauftragter (§ 22 Abs. 1 Satz 4 SGB VII). Anlage 2 zur DGUV Vorschrift 1 deiner Berufsgenossenschaft
    nennt Zahlen nach Betriebsgröße und Gefährdung; ob sie schon an die Neuregelung angepasst ist, ist offen (die DGUV Vorschrift 1 wird überarbeitet) – im Zweifel richte dich nach § 22 Abs. 1 Satz 4 SGB
    VII und frag bei deiner BG nach. Sicherheitsbeauftragte unterstützen dich ehrenamtlich bei der Umsetzung des Arbeitsschutzes und nehmen an Lehrgängen der BG teil.'
  en: 'Since the new version of § 22 SGB VII (applicable from 29.5.2026), businesses with a regular 50 or more employees appoint safety officers; their number and selection depend on the accident and health
    hazards and the number of employees. With more than 20 and fewer than 50 employees, a safety officer is only required if the risk assessment shows a particular hazard to life and health; the BG can
    set the criteria and order the appointment. Employees are counted per head: part-time staff count in full, as do apprentices and temporary agency workers in the business where they are deployed – there
    is no pro-rata conversion as under dismissal protection law (DGUV Rule 100-001, section 4.2). In businesses with a regular fewer than 250 employees and no particular hazard to life and health, one safety
    officer is enough (§ 22(1) sentence 4 SGB VII). Annex 2 to your BG''s DGUV Regulation 1 gives numbers by size of business and hazards; whether it has already been adapted to the new rules is open (DGUV
    Regulation 1 is being revised) – if in doubt, follow § 22(1) sentence 4 SGB VII and ask your BG. Safety officers support you on a voluntary basis in implementing occupational safety and attend courses
    of the BG.'
- de: Sobald du mindestens eine Person beschäftigst, sind die Gefährdungen an jedem Arbeitsplatz zu beurteilen, Schutzmaßnahmen festzulegen und das zu dokumentieren (§§ 5, 6 ArbSchG). Amtlos gibt dir dafür
    eine Vorlage mit Gefährdungen und Maßnahmen, die typisch für Betriebe wie deinen sind – welche davon an deinen Arbeitsplätzen zutreffen und was dort zusätzlich nötig ist, beurteilst du selbst. Überprüfe
    die Beurteilung bei Änderungen der Arbeitsstätte oder der Tätigkeiten, bei neuen Arbeitsmitteln oder Arbeitsstoffen, nach Unfällen und Beinaheunfällen, bei Berufskrankheiten oder Gesundheitsbeschwerden,
    nach Ergebnissen der arbeitsmedizinischen Vorsorge, bei neuen Vorschriften oder Erkenntnissen und wenn du Jugendliche beschäftigst oder eine Beschäftigte dir ihre Schwangerschaft mitteilt.
  en: As soon as you employ at least one person, the hazards at every workplace must be assessed, protective measures defined and documented (§§ 5, 6 ArbSchG). Amtlos gives you a template with hazards and
    measures that are typical for businesses like yours – you assess yourself which of them apply to your workplaces and what else is needed there. Review the assessment when the workplace or activities
    change, when there are new work equipment or substances, after accidents and near misses, in case of occupational diseases or health complaints, after results of occupational health care, when there
    are new regulations or findings, and when you employ young people or an employee informs you of her pregnancy.
- de: 'Wer Speisen in Einwegkunststoffverpackungen oder Getränke in Einwegbechern erst beim Verkauf befüllt, muss sie auch in einer Mehrwegverpackung anbieten – nicht teurer und gut sichtbar mit einem Hinweis
    (§ 60 VerpackDG). Ausgenommen sind kleine Betriebe mit höchstens fünf Beschäftigten und höchstens 80 m² Verkaufsfläche; sie müssen stattdessen auf Wunsch mitgebrachte Behälter der Kundschaft befüllen
    und darauf hinweisen (§ 61 VerpackDG). Teilzeitkräfte zählen dabei mit 0,5 (bis 20 Wochenstunden) bzw. 0,75 (bis 30 Wochenstunden). Beim Foodtruck ist die Verkaufsfläche die Fläche des Fahrzeugs; lieferst
    du aus, zählen auch Lager- und Versandflächen. Serviceverpackungen (Becher, Boxen): Die Systembeteiligung kann der Lieferant übernehmen – die Registrierung in LUCID bleibt deine eigene Pflicht (§ 7
    Abs. 2 VerpackDG). Seit 12.8.2026 steht die Pflicht im Verpackungsrecht-Durchführungsgesetz, das das Verpackungsgesetz abgelöst hat.'
  en: 'Anyone who fills food into single-use plastic packaging or drinks into single-use cups only at the point of sale must also offer them in reusable packaging – not more expensive and with a clearly
    visible notice (§ 60 VerpackDG). Small businesses with no more than five employees and no more than 80 m² of sales area are exempt; instead, they must fill containers brought by customers on request
    and point this out (§ 61 VerpackDG). Part-time staff count as 0.5 (up to 20 hours a week) or 0.75 (up to 30 hours a week). For a food truck, the sales area is the area of the vehicle; if you deliver,
    storage and dispatch areas also count. Service packaging (cups, boxes): your supplier can take over the system participation – registration in LUCID remains your own obligation (§ 7(2) VerpackDG). Since
    12.8.2026, the obligation is set out in the Packaging Law Implementation Act (Verpackungsrecht-Durchführungsgesetz), which replaced the Packaging Act (Verpackungsgesetz).'
- de: Die Außenwirtschaftsverordnung verlangt Meldungen für Zahlungen, die du von Gebietsfremden erhältst oder an Gebietsfremde leistest (§ 67 AWV). Meldepflichtig sind seit dem 1.1.2025 Zahlungen über
    50.000 € (§ 67 Abs. 2 Nr. 1 AWV) – das gilt für alle solchen Zahlungen, nicht nur für Geld von Investoren. Ausgenommen sind Zahlungen für die Einfuhr, Ausfuhr oder Verbringung von Waren. Die Meldung
    geht elektronisch an die Deutsche Bundesbank, und zwar bis zum 7. Werktag des Monats, der auf die Zahlung folgt (§ 71 Abs. 6 AWV) – für jeden Monat, in dem du eine meldepflichtige Zahlung erhältst oder
    leistest.
  en: The Foreign Trade and Payments Ordinance requires reports for payments you receive from or make to non-residents (§ 67 AWV). Since 1.1.2025, payments of more than €50,000 must be reported (§ 67(2)
    no. 1 AWV) – this applies to all such payments, not only to money from investors. Payments for the import, export or transfer of goods are exempt. The report is submitted electronically to the Deutsche
    Bundesbank by the 7th working day of the month following the payment (§ 71(6) AWV) – for every month in which you receive or make a reportable payment.
- de: 'Für vorverpackte Lebensmittel schreibt Art. 9 LMIV vor, was auf der Packung stehen muss. Dazu gehören unter anderem die Bezeichnung, das Zutatenverzeichnis, die Allergene – im Zutatenverzeichnis
    hervorgehoben, zum Beispiel fett –, die Nettofüllmenge, das Mindesthaltbarkeits- oder Verbrauchsdatum, Name und Anschrift deines Betriebs und die Nährwertdeklaration. Handwerklich hergestellte Lebensmittel,
    die du in kleinen Mengen direkt an Endverbraucher oder an Geschäfte vor Ort abgibst, brauchen keine Nährwertdeklaration (Anhang V Nr. 19 LMIV). Die übrigen Angaben brauchen sie trotzdem. Wichtig ist
    die Abgrenzung: Ware, die du im eigenen Laden zum unmittelbaren Verkauf abpackst (z. B. Brot in Tüten, Kekse in Beuteln an der Theke) oder die du auf Wunsch der Kundschaft verpackst, gilt als lose Ware
    (Art. 44 Abs. 1 LMIV). Dafür reicht die Allergen- und Zusatzstoffinformation wie bei loser Ware. Legst du solche Ware allerdings zur Selbstbedienung aus, brauchst du die Pflichtangaben bis auf Nettofüllmenge
    und Nährwertdeklaration (§ 4 Abs. 1 LMIDV) – außer bei Dauerbackwaren und Süßwaren, die du im Laden abpackst, wenn du die Kundschaft auf andere Weise informierst. Brot und Brötchen in Tüten im SB-Regal
    sind keine Dauerbackwaren – sie brauchen die Angaben. Kekse oder Lebkuchen, die du im Laden abpackst, sind Dauerbackwaren – dafür reicht eine Information auf andere Weise, z. B. ein Schild. Die volle
    Kennzeichnung nach Art. 9 LMIV braucht Ware mit längerer Haltbarkeit (Marmelade, Granola, Kekse im Regal über Tage), Ware für andere Händler und Ware für den Onlineversand.'
  en: 'For prepacked food, Art. 9 LMIV (Food Information Regulation) specifies what must be on the package. This includes, among other things, the name of the food, the list of ingredients, the allergens
    – emphasised in the list of ingredients, for example in bold –, the net quantity, the best-before or use-by date, the name and address of your business and the nutrition declaration. Handmade food that
    you supply in small quantities directly to end consumers or to local shops does not need a nutrition declaration (Annex V No. 19 LMIV). It still needs the other information. The distinction matters:
    food that you pack in your own shop for immediate sale (e.g. bread in bags, biscuits in bags at the counter) or that you pack at the customer''s request counts as non-prepacked food (Art. 44(1) LMIV).
    For this, the allergen and additive information as for non-prepacked food is enough. However, if you display such food for self-service, you need the mandatory information except the net quantity and
    the nutrition declaration (§ 4(1) LMIDV) – except for long-life bakery products and confectionery that you pack in the shop, if you inform customers in another way. Bread and rolls in bags on the self-service
    shelf are not long-life bakery products – they need the information. Biscuits or gingerbread that you pack in the shop are long-life bakery products – for these, information in another way is enough,
    e.g. a sign. Full labelling under Art. 9 LMIV is needed for food with a longer shelf life (jam, granola, biscuits on the shelf for days), food for other retailers and food for online shipping.'
- de: Bußgeld bis 50.000 €, wenn vorverpackte Lebensmittel ohne die vorgeschriebenen Pflichtangaben in den Verkehr gebracht werden (§ 6 Abs. 4 Nr. 2 in Verbindung mit § 5 Abs. 1 LMIDV, § 60 Abs. 2 Nr. 26
    Buchst. a, Abs. 5 LFGB); einzelne Verstöße (Täuschung) sind Straftaten (§ 6 Abs. 1 LMIDV, § 59 Abs. 1 Nr. 21 Buchst. a LFGB).
  en: Fine of up to €50,000 if prepacked food is placed on the market without the mandatory particulars (§ 6(4) no. 2 in conjunction with § 5(1) LMIDV, § 60(2) no. 26 letter a, (5) LFGB); certain breaches
    (deception) are criminal offences (§ 6(1) LMIDV, § 59(1) no. 21 letter a LFGB).
- de: Keine eigene Bußgeldvorschrift (der Tatbestand fehlt in der LMRStV, die für VO (EG) Nr. 852/2004 nur Art. 4 mit Anhang I/II bewehrt). Die Lebensmittelüberwachung kann die nötigen Maßnahmen anordnen
    (§ 39 LFGB; Art. 138 VO (EU) 2017/625). Hygienemängel nach Anhang II (z. B. Lagerung, Reinigung, Abfall) sind dagegen bußgeldbewehrt – Bußgeld bis 50.000 € (§ 2 LMRStV i. V. m. § 60 Abs. 4 Nr. 2 Buchst.
    a, Abs. 5 LFGB).
  en: No specific fine provision (the offence is not listed in the LMRStV, which for Regulation (EC) No 852/2004 only covers Art. 4 with Annexes I/II). Food control can order the necessary measures (§ 39
    LFGB; Art. 138 Regulation (EU) 2017/625). Hygiene deficiencies under Annex II (e.g. storage, cleaning, waste), on the other hand, are subject to fines – fine of up to €50,000 (§ 2 LMRStV in conjunction
    with § 60(4) No. 2(a), (5) LFGB).
- de: Bußgeld bis 25.000 €, wenn du eine Person ohne diese Bescheinigung beschäftigst (§ 73 Abs. 1a Nr. 20, Abs. 2 IfSG).
  en: Fine of up to €25,000 if you employ a person without this certificate (§ 73(1a) no. 20, (2) IfSG).
- de: 'Wer Speisen in Einwegkunststoffverpackungen oder Getränke in Einwegbechern erst beim Verkauf befüllt, muss sie auch in einer Mehrwegverpackung anbieten – nicht teurer und gut sichtbar mit einem Hinweis
    (§ 60 VerpackDG). Ausgenommen sind kleine Betriebe mit höchstens fünf Beschäftigten und höchstens 80 m² Verkaufsfläche; sie müssen stattdessen auf Wunsch mitgebrachte Behälter der Kundschaft befüllen
    und darauf hinweisen (§ 61 VerpackDG). Teilzeitkräfte zählen dabei mit 0,5 (bis 20 Wochenstunden) bzw. 0,75 (bis 30 Wochenstunden). Beim Foodtruck ist die Verkaufsfläche die Fläche des Fahrzeugs; lieferst
    du aus, zählen auch Lager- und Versandflächen. Serviceverpackungen (Becher, Boxen): Die Systembeteiligung kann der Lieferant übernehmen – die Registrierung in LUCID bleibt deine eigene Pflicht (§ 7
    Abs. 2 VerpackDG). Seit 12.8.2026 steht die Pflicht im Verpackungsrecht-Durchführungsgesetz, das das Verpackungsgesetz abgelöst hat. Für Einwegkunststoff-Serviceverpackungen kommt das Einwegkunststofffondsgesetz
    dazu: Wer sie befüllt, ist Hersteller (§ 3 Nr. 3 EWKFondsG), muss sich beim Umweltbundesamt registrieren (§ 7 EWKFondsG) und zahlt seit 2024 die Einwegkunststoffabgabe (§ 12 EWKFondsG) – siehe „Einwegkunststoff-Serviceverpackungen:
    registrieren und Mengen melden“.'
  en: 'Anyone who fills food into single-use plastic packaging or drinks into single-use cups only at the point of sale must also offer them in reusable packaging – not more expensive and with a clearly
    visible notice (§ 60 VerpackDG). Small businesses with no more than five employees and no more than 80 m² of sales area are exempt; instead, they must fill containers brought by customers on request
    and point this out (§ 61 VerpackDG). Part-time staff count as 0.5 (up to 20 hours a week) or 0.75 (up to 30 hours a week). For a food truck, the sales area is the area of the vehicle; if you deliver,
    storage and dispatch areas also count. Service packaging (cups, boxes): your supplier can take over the system participation – registration in LUCID remains your own obligation (§ 7(2) VerpackDG). Since
    12.8.2026, the obligation is set out in the Packaging Law Implementation Act (Verpackungsrecht-Durchführungsgesetz), which replaced the Packaging Act (Verpackungsgesetz). For single-use plastic service
    packaging, the Single-Use Plastics Fund Act (Einwegkunststofffondsgesetz) also applies: whoever fills it is a producer (§ 3 no. 3 EWKFondsG), must register with the German Environment Agency (§ 7 EWKFondsG)
    and has been paying the single-use plastics levy since 2024 (§ 12 EWKFondsG) – see “Single-use plastic service packaging: register and report quantities”.'
- de: 'Einwegkunststoff-Serviceverpackungen: registrieren und Mengen melden'
  en: 'Single-use plastic service packaging: register and report quantities'
- de: 'Einwegkunststoff-Serviceverpackungen (Becher, Boxen, Tüten): Registrierung im DIVID-Portal des UBA und jährliche Mengenmeldung (§§ 7, 11, 12 EWKFondsG).'
  en: 'Single-use plastic service packaging (cups, boxes, bags): registration on the German Environment Agency’s DIVID portal and annual reporting of quantities (§§ 7, 11, 12 EWKFondsG).'
- de: Füllst du Speisen oder Getränke zum Mitnehmen in Einwegverpackungen aus Kunststoff – Becher, Boxen, Tüten –, bist du nach dem Einwegkunststofffondsgesetz Hersteller; das gilt ausdrücklich auch für
    den, der die Verpackungen erst befüllt (§ 3 Nr. 3 EWKFondsG). Hersteller registrieren sich vor Aufnahme der Tätigkeit beim Umweltbundesamt (§ 7 EWKFondsG), über dessen Portal DIVID. Dort meldest du
    jedes Jahr die Mengen, die du im Vorjahr in Verkehr gebracht hast (§ 11 EWKFondsG); danach richtet sich die Einwegkunststoffabgabe, die du zahlst (§ 12 EWKFondsG). Die Registrierungs- und Abgabepflicht
    gilt seit 2024; die erste Mengenmeldung (für 2024) war bis 15.5.2025 fällig.
  en: If you fill food or drinks to take away into single-use plastic packaging – cups, boxes, bags –, you are a producer under the Single-Use Plastics Fund Act (Einwegkunststofffondsgesetz); this expressly
    also applies to whoever only fills the packaging (§ 3 no. 3 EWKFondsG). Producers register with the German Environment Agency (Umweltbundesamt) before starting their activity (§ 7 EWKFondsG), via its
    DIVID portal. There you report every year the quantities you placed on the market in the previous year (§ 11 EWKFondsG); the single-use plastics levy you pay is based on them (§ 12 EWKFondsG). The registration
    and levy obligation has applied since 2024; the first report of quantities (for 2024) was due by 15.5.2025.
- de: Umweltbundesamt (Portal DIVID)
  en: German Environment Agency (Umweltbundesamt, DIVID portal)
- de: Bußgeld bis 100.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig registrieren lässt (§ 26 Abs. 1 Nr. 1, Abs. 2 EWKFondsG), und bis 10.000 €, wenn du die jährliche
    Meldung nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig machst (§ 26 Abs. 1 Nr. 9, Abs. 2 EWKFondsG).
  en: Fine of up to €100,000 if you do not register, or do not register correctly, completely or on time (§ 26(1) no. 1, (2) EWKFondsG), and up to €10,000 if you do not make the annual report, or do not
    make it correctly, completely or on time (§ 26(1) no. 9, (2) EWKFondsG).
- de: 'Betriebsarzt; Aufsicht: Arbeitsschutzbehörde des Landes'
  en: 'Company doctor; supervision: the state occupational safety authority'
- de: Bußgeld bis 5.000 €, wenn du eine Pflichtvorsorge nicht oder nicht rechtzeitig veranlasst, eine Tätigkeit ohne die vorgeschriebene Pflichtvorsorge ausüben lässt, die Vorsorgekartei nicht, nicht richtig oder nicht vollständig führst oder eine Angebotsvorsorge nicht oder nicht rechtzeitig anbietest (§ 10 Abs. 1 ArbMedVV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Gefährdest du dadurch vorsätzlich Leben oder Gesundheit eines Beschäftigten, ist das eine Straftat (§ 26 Nr. 2 ArbSchG).
  en: Fine of up to €5,000 if you do not arrange a mandatory check-up (Pflichtvorsorge) or arrange it late, allow an activity without the required mandatory check-up, do not keep the check-up record (Vorsorgekartei) or keep it incorrectly or incompletely, or do not offer an offered check-up (Angebotsvorsorge) or offer it late (§ 10(1) ArbMedVV in conjunction with § 25(1) no. 1, (2) ArbSchG). If you thereby intentionally endanger the life or health of an employee, this is a criminal offence (§ 26 no. 2 ArbSchG).
- de: Du selbst (Prüfung durch eine Elektrofachkraft oder elektrotechnisch unterwiesene Person unter deren Leitung)
  en: You yourself (inspection by a qualified electrician or an electrotechnically instructed person under their supervision)
- de: 'Für jedes Lebensmittel, das du lose abgibst – an der Theke, im Restaurant, am Buffet –, informierst du über die 14 Hauptallergene (Art. 44 LMIV, § 4 LMIDV). Schriftlich steht das Wort „Enthält“ davor; bei glutenhaltigem Getreide und Schalenfrüchten nennst du die Art, z. B. Weizen oder Haselnüsse. Die Information muss vor dem Kauf zugänglich sein: auf der Speisekarte, auf einem Schild an der Ware oder in einem Aushang. Mündliche Auskunft genügt nur, wenn eine schriftliche Aufstellung vorliegt, auf die du deutlich hinweist und die Gäste und Lebensmittelüberwachung auf Nachfrage einsehen können. Bei vorverpackter Ware stehen die Allergene hervorgehoben im Zutatenverzeichnis. Amtlos führt eine Allergenliste je Gericht und erstellt daraus eine Übersicht zum Aushängen.'
  en: 'For every food you supply unpackaged – at the counter, in the restaurant, at the buffet – you provide information on the 14 main allergens (Art. 44 LMIV, § 4 LMIDV). In writing, the word “Contains” (“Enthält”) comes first; for cereals containing gluten and nuts you name the type, e.g. wheat or hazelnuts. The information must be accessible before purchase: on the menu, on a sign at the product or in a notice. Oral information is only sufficient if there is a written list that you clearly point out and that guests and food control can see on request. For prepacked food, the allergens are highlighted in the list of ingredients. Amtlos keeps an allergen list per dish and creates an overview to display from it.'
- de: Kein eigenes Bußgeld. Das Gesundheitsamt kann die Tätigkeit untersagen und Maßnahmen anordnen (§ 16 Abs. 1, § 31 IfSG); beschäftigst du Personen ohne Bescheinigung, gilt § 73 Abs. 1a Nr. 20 IfSG (bis 25.000 €).
  en: No separate fine. The health office can prohibit the activity and order measures (§ 16(1), § 31 IfSG); if you employ persons without a certificate, § 73(1a) no. 20 IfSG applies (up to €25,000).
- de: Materialien und Gegenstände, die mit Lebensmitteln in Berührung kommen – zum Beispiel Verpackungen, To-go-Becher, Frischhaltedosen oder Kunststoffbehälter –, müssen dafür geeignet sein (Verordnung (EG) Nr. 1935/2004). Für Kunststoff gelten zusätzlich die Vorgaben der Verordnung (EU) Nr. 10/2011. Für Kunststoff und andere Materialien, für die es EU-Einzelvorschriften gibt, gibt dir dein Lieferant eine schriftliche Konformitätserklärung (Art. 16 VO (EG) Nr. 1935/2004, Art. 15 VO (EU) Nr. 10/2011). Für Papier und Karton ist sie nicht vorgeschrieben, viele Lieferanten stellen sie aber aus. Fordere sie vom Lieferanten an und lege sie ab – die Lebensmittelüberwachung fragt bei Kontrollen danach.
  en: Materials and articles that come into contact with food – for example packaging, to-go cups, food storage boxes or plastic containers – must be suitable for this (Regulation (EC) No 1935/2004). For plastics, the requirements of Regulation (EU) No 10/2011 also apply. For plastics and other materials covered by specific EU measures, your supplier gives you a written declaration of conformity (Art. 16 Regulation (EC) No 1935/2004, Art. 15 Regulation (EU) No 10/2011). For paper and board it is not mandatory, but many suppliers issue one. Request it from the supplier and file it – food control asks for it during inspections.
- de: Betreibst du eine Schankanlage mit CO2-Flasche oder eine Flüssiggasanlage, lässt du sie vor der Inbetriebnahme und danach regelmäßig von einer zur Prüfung befähigten Person prüfen (§ 14 BetrSichV) – Art, Umfang und Fristen der Prüfungen legst du in der Gefährdungsbeurteilung fest.
  en: If you operate a beverage dispensing system with a CO2 cylinder or a liquefied gas system, you have it inspected by a person qualified to carry out inspections (§ 14 BetrSichV) before commissioning and regularly afterwards – you set the type, scope and intervals of the inspections in the risk assessment.
- de: 'Getränkeschankanlagen arbeiten mit Kohlendioxid unter Druck; Gasflasche, Druckminderer und Leitungen sind Arbeitsmittel nach der Betriebssicherheitsverordnung. Art und Umfang der Prüfungen und die Fristen der wiederkehrenden Prüfungen legst du in der Gefährdungsbeurteilung fest (§ 3 Abs. 6 BetrSichV) und lässt die Prüfungen von einer befähigten Person durchführen (§ 14 BetrSichV); Anhaltspunkte für die Fristen geben die DGUV Regel 110-007 (Getränkeschankanlagen) und die DGUV Regel 110-010 (Flüssiggas). Ausströmendes CO2 kann in Kellern und engen Räumen zu Erstickung führen: In Räumen, in denen CO2-Flaschen stehen, siehst du nach der Gefährdungsbeurteilung eine CO2-Warneinrichtung vor und lässt auch sie regelmäßig prüfen; die Flaschen sicherst du gegen Umfallen. Für Flüssiggas, etwa am Gasgrill, Wok-Herd oder im Foodtruck, beschreibt die DGUV Regel 110-010 Prüfung und Betrieb. Die DGUV empfiehlt inzwischen, die DGUV Vorschrift 79 zurückzuziehen, und verweist auf die DGUV Regel 110-010 „Flüssiggas“ – ob die Vorschrift bei deiner Berufsgenossenschaft noch gilt, erfährst du dort.'
  en: 'Beverage dispensing systems work with pressurised carbon dioxide; gas cylinder, pressure regulator and lines are work equipment under the Industrial Safety Ordinance. You set the type and scope of the inspections and the intervals of the recurring inspections in the risk assessment (§ 3(6) BetrSichV) and have the inspections carried out by a qualified person (§ 14 BetrSichV); DGUV Rule 110-007 (beverage dispensing systems) and DGUV Rule 110-010 (liquefied gas) give guidance on the intervals. Escaping CO2 can cause suffocation in cellars and confined spaces: in rooms where CO2 cylinders are kept, you provide a CO2 warning device according to the risk assessment and have it inspected regularly too; you secure the cylinders against falling over. For liquefied gas, for example on a gas grill, wok cooker or in a food truck, DGUV Rule 110-010 describes inspection and operation. The DGUV now recommends withdrawing DGUV Regulation 79 and refers to DGUV Rule 110-010 “Liquefied gas” – your BG can tell you whether the regulation still applies there.'
- de: Die Gründung einer GmbH oder UG beginnt mit dem Gesellschaftsvertrag, den ein Notar beurkundet (§ 2 GmbHG). Die Beurkundung ist auch online per Videokommunikation beim Notar möglich, auch mit dem Musterprotokoll (§ 2 Abs. 3 GmbHG). Für die GmbH beträgt das Stammkapital mindestens 25.000 €; vor der Anmeldung ist auf jeden Geschäftsanteil ein Viertel einzuzahlen, insgesamt mindestens 12.500 € (§ 7 Abs. 2 GmbHG). Eine UG kann ab 1 € gegründet werden.
  en: Founding a GmbH or UG starts with the articles of association, which are notarised by a notary (§ 2 GmbHG). Notarisation is also possible online by video communication with the notary, including with the model protocol (§ 2(3) GmbHG). For a GmbH, the share capital is at least €25,000, before registration, a quarter must be paid in on each share, at least €12,500 in total (§ 7(2) GmbHG). A UG can be founded from €1.
- de: Bücher nach den Regeln der doppelten Buchführung führen Kapitalgesellschaften, die GmbH & Co. KG sowie OHG und KG immer – sie sind als Handelsgesellschaften Kaufleute (§§ 6, 238 HGB). Eingetragene Kaufleute (e. K.) sind befreit, wenn sie an zwei aufeinanderfolgenden Abschlussstichtagen höchstens 800.000 € Umsatz und 80.000 € Jahresüberschuss haben (§ 241a HGB); diese Befreiung gilt nur für Einzelkaufleute. Steuerlich wirst du nach § 141 AO erst buchführungspflichtig, wenn das Finanzamt es dir mitteilt – das kann es, wenn dein Umsatz über 800.000 € oder dein Gewinn über 80.000 € liegt. Bis dahin ermittelst du den Gewinn mit der Einnahmen-Überschuss-Rechnung. Die Buchführung ist eine laufende Pflicht; den Jahresabschluss macht in der Regel deine Steuerberatung.
  en: Corporations, the GmbH & Co. KG as well as the OHG and KG always keep double-entry books – as commercial partnerships they are merchants (§§ 6, 238 HGB). Registered merchants (e. K.) are exempt if on two consecutive balance sheet dates they have no more than €800,000 turnover and €80,000 annual net profit (§ 241a HGB); this exemption only applies to sole merchants. For tax purposes you only become obliged to keep books under § 141 AO when the tax office notifies you – it can do so if your turnover exceeds €800,000 or your profit €80,000. Until then you determine profit with the cash-basis accounts (EÜR). Bookkeeping is an ongoing obligation; the annual financial statements are usually prepared by your tax adviser.
- de: Dein Unternehmen ist eine OHG oder KG und damit als Handelsgesellschaft nach dem Handelsgesetzbuch buchführungspflichtig.
  en: Your business is an OHG or KG and therefore, as a commercial partnership, obliged to keep books under the German Commercial Code (HGB).
- de: 'Fernverkäufe von Waren und bestimmte Leistungen (z. B. digitale Leistungen) an Privatpersonen in anderen EU-Ländern sind im Bestimmungsland steuerbar, sobald sie EU-weit im Vorjahr oder im laufenden Jahr zusammen 10.000 € netto übersteigen (§ 3c Abs. 4 UStG) – oder wenn du auf die Schwelle verzichtest. Darunter bleibt der Ort in Deutschland. Das One-Stop-Shop-Verfahren (OSS) ist ein Wahlrecht: Nutzt du es, meldest du diese Umsätze je Land und Steuersatz beim Bundeszentralamt für Steuern; nutzt du es nicht, musst du dich in jedem Bestimmungsland registrieren. Die Teilnahme zeigst du vorher über das BZStOnline-Portal an. Erklärung und Zahlung sind bis zum letzten Tag des Monats nach Ablauf des Quartals fällig (§ 18j Abs. 4 UStG); die Frist verschiebt sich nicht auf den nächsten Werktag. OSS-Umsätze gehören nicht in die deutsche Umsatzsteuer-Voranmeldung. Auch als Kleinunternehmer: § 19 UStG gilt nur für Umsätze im Inland – Fernverkäufe über 10.000 € sind im Bestimmungsland steuerpflichtig, es sei denn, du nimmst dort die EU-Kleinunternehmerregelung in Anspruch (Unionsumsatz höchstens 100.000 €, Grenze des jeweiligen Landes, Meldeverfahren beim BZSt nach § 19a UStG). Ob du über der Schwelle liegst, ergibt sich aus deinen Umsätzen – Amtlos fragt die Höhe nicht ab. Amtlos stellt die Umsätze aus Rechnungen mit „OSS“ je Land und Steuersatz zusammen; du übermittelst selbst.'
  en: 'Distance sales of goods and certain services (e.g. digital services) to consumers in other EU countries are taxable in the country of destination as soon as they exceed €10,000 net in total EU-wide in the previous or current year (§ 3c(4) UStG) – or if you waive the threshold. Below that, the place of supply stays in Germany. The One-Stop-Shop procedure (OSS) is optional: if you use it, you report these sales per country and tax rate to the Federal Central Tax Office; if you don''t, you must register in each country of destination. You notify your participation in advance via the BZStOnline portal. The return and payment are due by the last day of the month after the end of the quarter (§ 18j(4) UStG); the deadline does not move to the next working day. OSS sales do not belong in the German advance VAT return. Small businesses too: § 19 UStG only applies to domestic sales – distance sales above €10,000 are taxable in the country of destination, unless you use the EU small business scheme there (Union turnover of no more than €100,000, threshold of the respective country, notification procedure with the BZSt under § 19a UStG). Whether you are above the threshold depends on your sales – Amtlos does not ask for the amount. Amtlos compiles the sales from invoices marked “OSS” per country and tax rate; you submit it yourself.'
- de: Jetzt auch für OHG und KG – alle Gesellschafter melden die Gesellschaft an, bei der KG mit den Kommanditisten und ihren Einlagen.
  en: Now also for the OHG and KG – all partners register the company, for a KG with the limited partners (Kommanditisten) and their contributions.
- de: Jetzt auch für OHG und KG, die du im Check als eigene Rechtsform wählen kannst.
  en: Now also for the OHG and KG, which you can choose as a legal form of their own in the check.
- de: OHG und KG kannst du jetzt als eigene Rechtsform wählen – für sie gilt die doppelte Buchführung immer. Die Rechtsform „Andere“ löst die Pflicht nicht mehr aus.
  en: You can now choose the OHG and KG as a legal form of their own – double-entry bookkeeping always applies to them. The legal form “Other” no longer triggers the obligation.
- de: OHG und KG kannst du jetzt als eigene Rechtsform wählen – sie bilanzieren immer und geben keine Anlage EÜR ab.
  en: You can now choose the OHG and KG as a legal form of their own – they always prepare balance sheets and do not file an Anlage EÜR.
- de: OHG und KG kannst du jetzt als eigene Rechtsform wählen – sie übermitteln die E-Bilanz immer. Die Rechtsform „Andere“ löst die Pflicht nicht mehr aus.
  en: You can now choose the OHG and KG as a legal form of their own – they always submit the e-balance sheet (E-Bilanz). The legal form “Other” no longer triggers the obligation.
- de: 'Auf allen Geschäftsbriefen an einen bestimmten Empfänger, gleich in welcher Form, stehen Pflichtangaben. Als eingetragener Kaufmann sind das deine Firma mit der Bezeichnung „eingetragener Kaufmann“
    oder „eingetragene Kauffrau“ oder einer Abkürzung wie „e. K.“, der Ort deiner Handelsniederlassung, das Registergericht und die Registernummer (§ 37a Abs. 1, § 19 Abs. 1 Nr. 1 HGB). Bei OHG und KG sind
    es Firma und Sitz der Gesellschaft, das Registergericht und die Registernummer (§ 125 Abs. 1 Satz 1 HGB, für die KG § 177a Satz 1 HGB). Für die Partnerschaftsgesellschaft gilt das entsprechend: Name
    und Sitz der Partnerschaft, das Registergericht und die Registernummer; bei der Partnerschaft mit beschränkter Berufshaftung kommt der gewählte Namenszusatz dazu, etwa „mbB“ (§ 7 Abs. 3 PartGG, § 8
    Abs. 4 Satz 3 PartGG). Ist keine natürliche Person persönlich haftender Gesellschafter, wie bei der GmbH & Co. KG, kommen die Firma der persönlich haftenden Gesellschafterin und deren Angaben nach §
    35a GmbHG dazu (§ 125 Abs. 1 Satz 2 HGB, § 177a Satz 2 HGB). Bei GmbH und UG sind es Rechtsform und Sitz, Registergericht und Registernummer sowie alle Geschäftsführer mit dem Familiennamen und mindestens
    einem ausgeschriebenen Vornamen, und, wenn es einen Aufsichtsrat mit Vorsitz gibt, dessen Vorsitzender; machst du Angaben zum Kapital, nennst du das Stammkapital und, wenn nicht alle Geldeinlagen eingezahlt
    sind, den Gesamtbetrag der ausstehenden Einlagen (§ 35a Abs. 1 GmbHG). Bestellscheine gelten als Geschäftsbriefe. Mitteilungen in einer bestehenden Geschäftsverbindung, für die üblicherweise Vordrucke
    verwendet werden, brauchen die Angaben nicht (§ 37a Abs. 2, 3 HGB, § 125 Abs. 2 HGB, § 7 Abs. 3 PartGG, § 35a Abs. 2, 3 GmbHG).'
  en: 'All business letters addressed to a specific recipient, in whatever form, must contain mandatory details. As a registered merchant (eingetragener Kaufmann), these are your company name (Firma) with
    the designation “eingetragener Kaufmann” or “eingetragene Kauffrau” or an abbreviation such as “e. K.”, the location of your commercial establishment, the register court and the register number (§ 37a(1),
    § 19(1) no. 1 HGB). For an OHG and KG, they are the company name and registered office of the partnership, the register court and the register number (§ 125(1) sentence 1 HGB, for the KG § 177a sentence
    1 HGB). The same applies accordingly to a partnership company (Partnerschaftsgesellschaft): the name and registered office of the partnership, the register court and the register number; for a partnership
    with limited professional liability (Partnerschaft mit beschränkter Berufshaftung), the chosen name suffix is added, such as “mbB” (§ 7(3) PartGG, § 8(4) sentence 3 PartGG). If no natural person is
    a personally liable partner, as with a GmbH & Co. KG, the company name of the personally liable partner and its details under § 35a GmbHG are added (§ 125(1) sentence 2 HGB, § 177a sentence 2 HGB).
    For a GmbH and UG, they are the legal form and registered office, register court and register number as well as all managing directors with their surname and at least one first name written out in full
    and, if there is a supervisory board with a chair, its chair; if you give details of the capital, you state the share capital (Stammkapital) and, if not all cash contributions have been paid in, the
    total amount of outstanding contributions (§ 35a(1) GmbHG). Order forms count as business letters. Communications within an existing business relationship for which pre-printed forms are usually used
    do not need these details (§ 37a(2), (3) HGB, § 125(2) HGB, § 7(3) PartGG, § 35a(2), (3) GmbHG).'
- de: Auf deinen Geschäftsbriefen und Bestellscheinen nennst du die Pflichtangaben deines Unternehmens, etwa Firma, Sitz, Registergericht und Registernummer.
  en: On your business letters and order forms, you state your business's mandatory details, such as company name, registered office, register court and register number.
- de: 'Bußgeld bis 50.000 € bei fehlender Kenntlichmachung von Zusatzstoffen (§ 7 Abs. 2 Nr. 1 LMZDV i. V. m. § 60 Abs. 2 Nr. 26 lit. a, Abs. 5 LFGB). Wer chininhaltige Lebensmittel ohne den Hinweis „chininhaltig“
    abgibt, macht sich strafbar (§ 6 Abs. 2 AromenDV i. V. m. § 59 Abs. 1 Nr. 21 lit. a LFGB: Freiheitsstrafe bis zu einem Jahr oder Geldstrafe).'
  en: 'Fine of up to €50,000 if additives are not labelled (§ 7(2) no. 1 LMZDV in conjunction with § 60(2) no. 26 letter a, (5) LFGB). Anyone who supplies food containing quinine without the notice “chininhaltig”
    (contains quinine) commits a criminal offence (§ 6(2) AromenDV in conjunction with § 59(1) no. 21 letter a LFGB: imprisonment of up to one year or a fine).'
- de: 'Das Registergericht kann die Angaben mit Zwangsgeld bis 5.000 € durchsetzen: beim eingetragenen Kaufmann nach § 37a Abs. 4 HGB, bei OHG und KG gegen die vertretungsberechtigten Gesellschafter oder
    deren organschaftliche Vertreter nach § 125 Abs. 2 in Verbindung mit § 37a Abs. 4 HGB (§ 14 HGB), bei der Partnerschaftsgesellschaft entsprechend gegen die vertretungsberechtigten Partner (§ 7 Abs.
    3 PartGG), bei GmbH und UG gegen die Geschäftsführer (§ 79 Abs. 1 GmbHG).'
  en: 'The register court can enforce the details with a coercive fine (Zwangsgeld) of up to €5,000: for a registered merchant under § 37a(4) HGB, for an OHG and KG against the partners authorised to represent
    it or their statutory representatives under § 125(2) in conjunction with § 37a(4) HGB (§ 14 HGB), for a partnership company (Partnerschaftsgesellschaft) accordingly against the partners authorised to
    represent it (§ 7(3) PartGG), for a GmbH and UG against the managing directors (§ 79(1) GmbHG).'
- de: Dein Unternehmen ist eine OHG oder KG.
  en: Your business is an OHG or KG.
- de: Dein Unternehmen ist eine OHG, KG, GmbH & Co. KG, UG, GmbH oder Partnerschaftsgesellschaft.
  en: Your business is an OHG, KG, GmbH & Co. KG, UG, GmbH or partnership company (Partnerschaftsgesellschaft).
- de: Deine Gesellschaft ist im Handels- oder Partnerschaftsregister eingetragen.
  en: Your company is entered in the commercial register (Handelsregister) or the partnership register (Partnerschaftsregister).
- de: Deine Gesellschaft ist im Register eingetragen.
  en: Your company is entered in the register.
- de: Den Gesellschaftsvertrag einer OHG oder KG schließt ihr ohne Notar – am besten schriftlich.
  en: You conclude the partnership agreement of an OHG or KG without a notary – preferably in writing.
- de: Der Gesellschaftsvertrag der OHG und der KG ist formfrei, du brauchst dafür keinen Notar. Er sollte aber schriftlich geschlossen werden. Ohne Vertrag gelten die gesetzlichen Regeln (§§ 105 ff., 161
    ff. HGB).
  en: The partnership agreement of an OHG and a KG is not subject to any formal requirements; you do not need a notary for it. It should, however, be concluded in writing. Without an agreement, the statutory
    rules apply (§§ 105 et seq., 161 et seq. HGB).
- de: Du selbst (Prüfung durch eine zur Prüfung befähigte Person, z. B. Schankanlagen- oder Gasfachbetrieb)
  en: You yourself (inspection by a person qualified to carry out inspections, e.g. a beverage dispensing system or gas specialist company)
- de: Du selbst bzw. alle persönlich haftenden Gesellschafter, in der Regel mit deiner Steuerberatung
  en: You yourself or all personally liable partners, usually with your tax adviser
- de: Du selbst; Durchsetzung durch das Registergericht
  en: You yourself; enforcement by the register court
- de: Du und deine Mitgesellschafter
  en: You and your fellow partners
- de: 'Ein eigenes Bußgeld für die verspätete Aufstellung nennt das Gesetz nicht. Wer die Bilanz nicht in der vorgeschriebenen Zeit aufstellt, macht sich strafbar, wenn später die Zahlungen eingestellt
    werden oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird: Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe, bei Fahrlässigkeit bis zu einem Jahr (§ 283b Abs. 1 Nr. 3 Buchst. b,
    Abs. 2, 3 StGB in Verbindung mit § 283 Abs. 6 StGB).'
  en: 'The law provides no separate fine for late preparation. Anyone who does not prepare the balance sheet within the prescribed time commits a criminal offence if payments are later stopped or insolvency
    proceedings are opened or rejected for lack of assets: imprisonment of up to two years or a fine, in case of negligence up to one year (§ 283b(1) no. 3 letter b, (2), (3) StGB in conjunction with §
    283(6) StGB).'
- de: Einen Flucht- und Rettungsplan brauchst du, wenn Lage, Ausdehnung und Art der Benutzung der Arbeitsstätte es erfordern (§ 4 Abs. 4 ArbStättV) – etwa bei unübersichtlichen Fluchtwegen, mehreren Geschossen,
    vielen Kundinnen und Kunden oder erhöhter Brandgefährdung. Ob das so ist, hältst du in der Gefährdungsbeurteilung fest. Der Plan wird an geeigneten Stellen ausgehängt oder ausgelegt; gestaltet wird
    er nach ASR A2.3 (Grundriss, Fluchtwege, Sammelstelle, Verhalten im Brandfall und bei Unfällen). Nach dem Plan übst du in regelmäßigen Abständen, wie die Arbeitsstätte geräumt wird (ASR A2.3 Nr. 11
    Abs. 2); einen festen Rhythmus schreibt die ASR nicht vor, üblich ist etwa einmal im Jahr. Für ein kleines Ladenlokal mit direktem Ausgang ins Freie ist oft kein Plan nötig.
  en: You need an escape and rescue plan if the location, size and type of use of the workplace require it (§ 4(4) ArbStättV) – for example with confusing escape routes, several floors, many customers or
    increased fire risk. You record whether this is the case in the risk assessment. The plan is posted or displayed in suitable places; it is designed according to ASR A2.3 (floor plan, escape routes,
    assembly point, what to do in case of fire and accidents). Following the plan, you practise evacuating the workplace at regular intervals (ASR A2.3 no. 11(2)); the ASR does not prescribe a fixed rhythm,
    about once a year is common. A small shop with a direct exit to the outside often needs no plan.
- de: 'Einen Jahresabschluss aus Bilanz und Gewinn- und Verlustrechnung stellen alle Kaufleute auf (§ 242 HGB), also auch OHG und KG und der eingetragene Kaufmann (e. K.), soweit er nicht nach § 241a HGB
    befreit ist. Eine feste Frist gibt es für OHG, KG und e. K. nicht: Der Jahresabschluss ist „innerhalb der einem ordnungsmäßigen Geschäftsgang entsprechenden Zeit“ aufzustellen (§ 243 Abs. 3 HGB). Die
    Dreimonatsfrist (bei kleinen Gesellschaften bis sechs Monate) gilt nur für Kapitalgesellschaften und die GmbH & Co. KG (§§ 264, 264a HGB). Unterschreiben muss ihn unter Angabe des Datums beim e. K.
    der Kaufmann, bei OHG und KG alle persönlich haftenden Gesellschafter (§ 245 HGB). Die Offenlegung entfällt für OHG, KG und e. K. außerhalb des Publizitätsgesetzes.'
  en: 'All merchants (Kaufleute) prepare annual financial statements consisting of a balance sheet and a profit and loss account (§ 242 HGB) – including the OHG and KG and the registered merchant (e. K.),
    unless exempt under § 241a HGB. There is no fixed deadline for the OHG, KG and e. K.: the annual financial statements must be prepared “within the time corresponding to the proper course of business”
    (§ 243(3) HGB). The three-month deadline (up to six months for small companies) applies only to corporations and the GmbH & Co. KG (§§ 264, 264a HGB). They must be signed, stating the date, by the merchant
    in the case of an e. K., and by all personally liable partners in the case of an OHG and KG (§ 245 HGB). Publication (Offenlegung) does not apply to the OHG, KG and e. K. outside the Disclosure Act
    (Publizitätsgesetz).'
- de: Erscheint jetzt erst, wenn deine Gesellschaft im Register eingetragen ist – vorher besteht die Mitteilungspflicht noch nicht.
  en: Now only appears once your company is entered in the register – before that, the reporting obligation does not yet exist.
- de: 'Folgen bei Verstoß ergänzt: Wer chininhaltige Lebensmittel ohne den Hinweis „chininhaltig“ abgibt, macht sich strafbar.'
  en: 'Consequences of non-compliance added: anyone who supplies food containing quinine without the notice “chininhaltig” (contains quinine) commits a criminal offence.'
- de: Gesellschaftsvertrag der OHG oder KG schließen
  en: Conclude the partnership agreement of the OHG or KG
- de: Jahresabschluss aufstellen (OHG, KG, e. K.)
  en: Prepare annual financial statements (OHG, KG, e. K.)
- de: Kein Bußgeld. Ohne Vertrag gelten die gesetzlichen Regeln (§§ 105 ff., 161 ff. HGB).
  en: No fine. Without an agreement, the statutory rules apply (§§ 105 et seq., 161 et seq. HGB).
- de: Nach jedem Geschäftsjahr stellst du Bilanz und Gewinn- und Verlustrechnung auf – ohne feste Frist, aber in der Zeit, die ein ordnungsmäßiger Geschäftsgang erfordert.
  en: After each financial year, you prepare a balance sheet and a profit and loss account – without a fixed deadline, but within the time that a proper course of business requires.
- de: Pflichtangaben auf Geschäftsbriefen
  en: Mandatory details on business letters
- de: Den Gesellschaftsvertrag einer OHG oder KG schließt ihr in der Regel ohne Notar – am besten schriftlich.
  en: You usually conclude the partnership agreement of an OHG or KG without a notary – preferably in writing.
- de: Der Gesellschaftsvertrag der OHG und der KG ist grundsätzlich formfrei – ein Notar ist nur nötig, wenn zum Beispiel ein Grundstück oder ein GmbH-Anteil eingebracht wird (§ 311b Abs. 1 BGB, § 15 Abs. 3, 4 GmbHG). Er sollte aber schriftlich geschlossen werden. Ohne Vertrag gelten die gesetzlichen Regeln (§§ 105 ff., 161 ff. HGB).
  en: The partnership agreement of an OHG and a KG is in principle not subject to any formal requirements – a notary is only needed if, for example, a property or a GmbH share is contributed (§ 311b(1) BGB, § 15(3), (4) GmbHG). It should, however, be concluded in writing. Without an agreement, the statutory rules apply (§§ 105 et seq., 161 et seq. HGB).
- de: Der Gesellschaftsvertrag der OHG und der KG ist grundsätzlich formfrei – ein Notar ist nur nötig, wenn zum Beispiel ein Grundstück oder ein GmbH-Anteil eingebracht wird (§ 311b Abs. 1 BGB, § 15 Abs. 3, 4 GmbHG). Er sollte aber schriftlich geschlossen werden. Was ihr im Vertrag nicht regelt, bestimmt das Gesetz (§§ 105 ff., 161 ff. HGB).
  en: The partnership agreement of an OHG and a KG is in principle not subject to any formal requirements – a notary is only needed if, for example, a property or a GmbH share is contributed (§ 311b(1) BGB, § 15(3), (4) GmbHG). It should, however, be concluded in writing. What you do not regulate in the agreement is determined by law (§§ 105 et seq., 161 et seq. HGB).
- de: Kein Bußgeld. Was ihr im Vertrag nicht regelt, bestimmt das Gesetz (§§ 105 ff., 161 ff. HGB).
  en: No fine. What you do not regulate in the agreement is determined by law (§§ 105 et seq., 161 et seq. HGB).
- de: Elektronische Lohnsteuerbescheinigung
  en: Electronic payroll tax certificate (Lohnsteuerbescheinigung)
- de: Bis Ende Februar übermittelst du für jede beschäftigte Person mit Lohnsteuerabzug die Lohnsteuerbescheinigung des Vorjahres ans Finanzamt und gibst ihr einen Ausdruck.
  en: By the end of February, you transmit the previous year's payroll tax certificate for every employee with payroll tax deduction to the tax office and give them a printout.
- de: Bei Ende des Dienstverhältnisses oder am Ende des Kalenderjahres schließt du das Lohnkonto ab und übermittelst auf dieser Grundlage elektronisch eine Lohnsteuerbescheinigung, unter anderem mit Dauer
    des Dienstverhältnisses, Arbeitslohn, einbehaltener Lohnsteuer, Solidaritätszuschlag und Kirchensteuer sowie den Sozialversicherungsbeiträgen (§ 41b Abs. 1 Sätze 1 und 2 EStG). Frist ist der letzte
    Tag im Februar des Folgejahres (§ 93c Abs. 1 Nr. 1 AO); fällt er auf ein Wochenende oder einen Feiertag, reicht der nächste Werktag (§ 108 Abs. 3 AO). Die Übermittlung macht in der Regel das Lohnprogramm,
    die Steuerberatung oder das Lohnbüro über ELSTER. Der beschäftigten Person gibst du binnen angemessener Frist einen Ausdruck nach amtlichem Muster oder stellst ihn elektronisch bereit (§ 41b Abs. 1
    Satz 3 EStG). Für Arbeitslohn, der pauschal besteuert wird (§§ 40 bis 40b EStG, z. B. Minijobs mit Pauschsteuer), gibt es keine Lohnsteuerbescheinigung (§ 41b Abs. 6 EStG). Stellst du später fest, dass
    übermittelte Daten falsch waren, korrigierst du sie unverzüglich (§ 93c Abs. 3 AO).
  en: When an employment ends or at the end of the calendar year, you close the payroll account and, on that basis, electronically transmit a payroll tax certificate, including among other things the duration
    of the employment, wages, payroll tax withheld, solidarity surcharge and church tax, and the social security contributions (§ 41b(1) sentences 1 and 2 EStG). The deadline is the last day of February
    of the following year (§ 93c(1) no. 1 AO); if it falls on a weekend or public holiday, the next working day is sufficient (§ 108(3) AO). The transmission is usually done by the payroll software, the
    tax adviser or the payroll office via ELSTER. Within a reasonable period, you give the employee a printout on the official form or make it available electronically (§ 41b(1) sentence 3 EStG). There
    is no payroll tax certificate for wages taxed at a flat rate (§§ 40 to 40b EStG, e.g. mini-jobs with flat-rate tax) (§ 41b(6) EStG). If you later find that transmitted data was wrong, you correct it
    without delay (§ 93c(3) AO).
- de: Finanzamt (über das Lohnprogramm)
  en: Tax office (via the payroll software)
- de: Übermittelst du die Lohnsteuerbescheinigung vorsätzlich oder grob fahrlässig nicht, unrichtig oder unvollständig, haftest du für die dadurch entgangene Steuer (§ 72a Abs. 4 AO). Als Arbeitgeber haftest
    du außerdem für Lohnsteuer, die wegen fehlerhafter Angaben in der Lohnsteuerbescheinigung verkürzt wird (§ 42d Abs. 1 Nr. 3 EStG).
  en: If you intentionally or through gross negligence fail to transmit the payroll tax certificate, or transmit it incorrectly or incompletely, you are liable for the tax lost as a result (§ 72a(4) AO).
    As an employer, you are also liable for payroll tax that is underpaid because of incorrect information in the payroll tax certificate (§ 42d(1) no. 3 EStG).
- de: Künstlersozialabgabe prüfen
  en: Check the artists' social security levy (Künstlersozialabgabe)
- de: Beauftragst du selbstständige Kreative, etwa für Grafik, Fotos oder Texte deiner Werbung, kann Künstlersozialabgabe anfallen – Meldung an die Künstlersozialkasse bis 31. März.
  en: If you commission self-employed creatives, for example for graphics, photos or texts for your advertising, the artists' social security levy may apply – report to the Künstlersozialkasse by 31 March.
- de: Künstlersozialabgabe zahlen typische Verwerter wie Verlage oder Werbeagenturen (§ 24 Abs. 1 KSVG), außerdem Unternehmen, die für ihre eigene Werbung oder Öffentlichkeitsarbeit selbstständige Künstler
    oder Publizisten beauftragen oder deren Werke für ihr Unternehmen nutzen, um damit Einnahmen zu erzielen (§ 24 Abs. 2 KSVG). In diesen Fällen gilt die Pflicht nur, wenn die Entgelte im Kalenderjahr
    zusammen mehr als 1.000 € betragen (§ 24 Abs. 2 KSVG). Bemessungsgrundlage sind alle Entgelte an selbstständige Künstler und Publizisten im Kalenderjahr, auch an solche, die selbst nicht über die Künstlersozialkasse
    versichert sind; nicht dazu zählen die gesondert ausgewiesene Umsatzsteuer, Zahlungen an Verwertungsgesellschaften und steuerfreie Aufwandsentschädigungen (§ 25 KSVG). Den Abgabesatz legt das Bundesarbeitsministerium
    jedes Jahr per Verordnung fest (§ 26 KSVG); 2026 beträgt er 4,9 % (Künstlersozialabgabe-Verordnung 2026). Die Summe der Entgelte des Vorjahres meldest du bis zum 31. März auf dem Vordruck der Künstlersozialkasse
    (§ 27 Abs. 1 KSVG); danach zahlst du monatliche Vorauszahlungen, jeweils innerhalb von zehn Tagen nach Monatsende, sofern sie mehr als 40 € betragen (§ 27 Abs. 2, 3 KSVG). Die Entgelte zeichnest du
    laufend auf und bewahrst die Aufzeichnungen mindestens fünf Jahre nach Ablauf des Jahres auf, in dem sie fällig wurden (§ 28 KSVG). Die Deutsche Rentenversicherung prüft die Abgabe bei ihren Betriebsprüfungen
    mit (§ 28p Abs. 1a SGB IV).
  en: The artists' social security levy is paid by typical users of creative work such as publishers or advertising agencies (§ 24(1) KSVG), and also by businesses that commission self-employed artists
    or publicists for their own advertising or public relations, or use their works for their business in order to generate income (§ 24(2) KSVG). In these cases the obligation only applies if the fees
    in the calendar year total more than €1,000 (§ 24(2) KSVG). The basis of assessment is all fees paid to self-employed artists and publicists in the calendar year, including those who are not themselves
    insured through the Künstlersozialkasse; separately stated VAT, payments to collecting societies and tax-free expense allowances do not count (§ 25 KSVG). The Federal Ministry of Labour sets the levy
    rate each year by regulation (§ 26 KSVG); for 2026 it is 4.9% (Künstlersozialabgabe-Verordnung 2026). You report the total fees of the previous year by 31 March on the Künstlersozialkasse's form (§
    27(1) KSVG); after that you make monthly advance payments, each within ten days after the end of the month, provided they exceed €40 (§ 27(2), (3) KSVG). You record the fees on an ongoing basis and
    keep the records for at least five years after the end of the year in which they became due (§ 28 KSVG). The German Pension Insurance (Deutsche Rentenversicherung) checks the levy as part of its employer
    audits (§ 28p(1a) SGB IV).
- de: Künstlersozialabgabe zahlen typische Verwerter wie Verlage oder Werbeagenturen (§ 24 Abs. 1 KSVG), außerdem Unternehmen, die für ihre eigene Werbung oder Öffentlichkeitsarbeit selbstständige Künstler
    oder Publizisten beauftragen oder deren Werke für ihr Unternehmen nutzen, um damit Einnahmen zu erzielen (§ 24 Abs. 2 KSVG). In diesen Fällen gilt die Pflicht nur, wenn die Entgelte im Kalenderjahr
    zusammen mehr als 1.000 € betragen (§ 24 Abs. 2 KSVG). Bemessungsgrundlage sind alle Entgelte an selbstständige Künstler und Publizisten im Kalenderjahr, auch an solche, die selbst nicht über die Künstlersozialkasse
    versichert sind; nicht dazu zählen die gesondert ausgewiesene Umsatzsteuer, Zahlungen an Verwertungsgesellschaften und steuerfreie Aufwandsentschädigungen (§ 25 KSVG). Zahlungen an eine GmbH, UG, OHG
    oder KG zählen nach Auffassung der Künstlersozialkasse nicht dazu. Den Abgabesatz legt das Bundesarbeitsministerium jedes Jahr per Verordnung fest (§ 26 KSVG). Er gilt jeweils für ein Kalenderjahr;
    den aktuellen Satz veröffentlicht die Künstlersozialkasse. Die Summe der Entgelte des Vorjahres meldest du bis zum 31. März auf dem Vordruck der Künstlersozialkasse (§ 27 Abs. 1 KSVG); danach zahlst
    du monatliche Vorauszahlungen, jeweils innerhalb von zehn Tagen nach Monatsende, sofern sie mehr als 40 € betragen (§ 27 Abs. 2, 3 KSVG). Die Entgelte zeichnest du laufend auf und bewahrst die Aufzeichnungen
    mindestens fünf Jahre nach Ablauf des Jahres auf, in dem sie fällig wurden (§ 28 KSVG). Die Deutsche Rentenversicherung prüft die Abgabe bei ihren Betriebsprüfungen mit (§ 28p Abs. 1a SGB IV).
  en: The artists' social security levy is paid by typical users of creative work such as publishers or advertising agencies (§ 24(1) KSVG), and also by businesses that commission self-employed artists
    or publicists for their own advertising or public relations, or use their works for their business in order to generate income (§ 24(2) KSVG). In these cases the obligation only applies if the fees
    in the calendar year total more than €1,000 (§ 24(2) KSVG). The basis of assessment is all fees paid to self-employed artists and publicists in the calendar year, including those who are not themselves
    insured through the Künstlersozialkasse; separately stated VAT, payments to collecting societies and tax-free expense allowances do not count (§ 25 KSVG). According to the Künstlersozialkasse, payments
    to a GmbH, UG, OHG or KG do not count. The Federal Ministry of Labour sets the levy rate each year by regulation (§ 26 KSVG). It applies for one calendar year at a time; the Künstlersozialkasse publishes
    the current rate. You report the total fees of the previous year by 31 March on the Künstlersozialkasse's form (§ 27(1) KSVG); after that you make monthly advance payments, each within ten days after
    the end of the month, provided they exceed €40 (§ 27(2), (3) KSVG). You record the fees on an ongoing basis and keep the records for at least five years after the end of the year in which they became
    due (§ 28 KSVG). The German Pension Insurance (Deutsche Rentenversicherung) checks the levy as part of its employer audits (§ 28p(1a) SGB IV).
- de: Künstlersozialkasse
  en: Artists' Social Insurance Fund (Künstlersozialkasse)
- de: Wer als Abgabepflichtiger die Entgelte nicht rechtzeitig oder nicht richtig meldet, keine ordnungsgemäßen Aufzeichnungen führt oder Auskünfte und Unterlagen auf Verlangen nicht vorlegt, handelt ordnungswidrig
    – Bußgeld bis 50.000 € (§ 36 Abs. 2, 3 KSVG). Ohne Meldung schätzt die Künstlersozialkasse bzw. die Rentenversicherung die Entgelte (§ 27 Abs. 1 KSVG).
  en: A liable business that fails to report the fees on time or correctly, does not keep proper records, or does not provide information and documents on request commits an administrative offence – fine
    of up to €50,000 (§ 36(2), (3) KSVG). Without a report, the Künstlersozialkasse or the pension insurance estimates the fees (§ 27(1) KSVG).
- de: Du hast eine eigene Website.
  en: You have your own website.
- de: Gilt jetzt für jeden Arbeitgeber, auch bevor du den Anmeldezeitraum angegeben hast – die Termine erscheinen, sobald der Zeitraum feststeht.
  en: Now applies to every employer, even before you have entered the filing period – the deadlines appear as soon as the period is known.
- de: Gilt jetzt für jeden Arbeitgeber, auch bevor du den Anmeldezeitraum der Lohnsteuer angegeben hast.
  en: Now applies to every employer, even before you have entered the wage tax filing period.
- de: Weißt du den Rhythmus nicht, rechnet Amtlos jetzt vorläufig mit monatlichen Terminen – dem früheren Termin – statt vierteljährlich. Hast du 2026 oder später gegründet, zeigt Amtlos ab 2027 im Gründungsjahr und im Folgejahr monatliche Termine.
  en: If you don't know the frequency, Amtlos now provisionally assumes monthly deadlines – the earlier deadline – instead of quarterly. If you founded in 2026 or later, Amtlos shows monthly deadlines from 2027 in the founding year and the following year.
- de: 'Ergänzt: Eine Dauerfristverlängerung bleibt auf Antrag auch bei monatlicher Abgabe als Neugründer möglich (§ 18 Abs. 6 UStG, §§ 46 bis 48 UStDV; mit Sondervorauszahlung).'
  en: 'Added: a permanent deadline extension (Dauerfristverlängerung) remains possible on application even if you file monthly as a new business (§ 18(6) UStG, §§ 46 to 48 UStDV; with a special advance payment).'
- de: Hast du 2026 oder später gegründet, gibst du ab 2027 im Gründungsjahr und im Folgejahr monatlich ab (§ 18 Abs. 2 Satz 4 UStG).
  en: If you founded in 2026 or later, from 2027 you file monthly in the founding year and the following year (§ 18(2) sentence 4 UStG).
- de: Erstes Kalenderjahr, in dem Neugründer im Gründungs- und Folgejahr die USt-Voranmeldung wieder monatlich abgeben (§ 18 Abs. 2 Satz 4 UStG; Satz 6 gilt nur für 2021 bis 2026)
  en: First calendar year in which new businesses again file the advance VAT return monthly in the founding year and the following year (§ 18(2) sentence 4 UStG; sentence 6 applies only for 2021 to 2026)
- de: Du arbeitest in Gesundheit, Pflege oder Kosmetik.
  en: You work in health, care or cosmetics.
- de: In Gesundheit, Pflege und Kosmetik erscheint der Eintrag jetzt als „hängt ab“, solange du nichts zu deiner Datenverarbeitung angegeben hast.
  en: In health, care and cosmetics, this entry now appears as "depends" as long as you have not provided any details about your data processing.
- de: Dein Betrieb hat mindestens 50 Beschäftigte, oder er ist in einer Branche, in der NIS2 gelten kann, und der Umsatz im Vorjahr lag über 10 Mio. €. Liegt deine Bilanzsumme bei höchstens 10 Mio. €, bist du trotzdem nicht erfasst.
  en: Your business has at least 50 employees, or it is in a sector in which NIS2 may apply and your turnover last year was above €10 million. If your balance sheet total is no more than €10 million, you are nevertheless not covered.
- de: Hast du angegeben, dass NIS2 für dich gilt, gilt der Eintrag unabhängig von der Größe. Ohne Angabe erscheint er ab 50 Beschäftigten, darunter in IT, Gesundheit und Pflege, Transport und Logistik, Gastronomie und Lebensmittel sowie „Andere“ nur bei mehr als 10 Mio. € Umsatz – ohne Umsatzangabe als „hängt ab“.
  en: If you have stated that NIS2 applies to you, this entry applies regardless of size. Without that answer it appears from 50 employees; below that, in IT, health and care, transport and logistics, hospitality and food, and "Other" only with more than €10 million turnover – without a turnover figure as "depends".
- de: Auch in Gesundheit und Pflege, Transport und Logistik sowie Gastronomie und Lebensmittel fragt Amtlos jetzt, ob NIS2 für dich gilt, solange du keinen Umsatz angegeben hast.
  en: In health and care, transport and logistics, and hospitality and food, Amtlos now also asks whether NIS2 applies to you as long as you have not entered your turnover.
- de: Bei Preisermäßigungen den niedrigsten Preis der letzten 30 Tage angeben
  en: For price reductions, state the lowest price of the last 30 days
- de: Gibst du Verbrauchern eine Preisermäßigung für eine Ware bekannt, nennst du auch den niedrigsten Gesamtpreis, den du in den 30 Tagen davor verlangt hast.
  en: If you announce a price reduction for goods to consumers, you also state the lowest total price you charged in the 30 days before.
- de: Wer Verbrauchern Gesamtpreise angeben muss, nennt bei jeder Bekanntgabe einer Preisermäßigung für eine Ware den niedrigsten Gesamtpreis, den er innerhalb der letzten 30 Tage vor der Anwendung der Preisermäßigung gegenüber Verbrauchern angewendet hat (§ 11 Abs. 1 PAngV). Eine Ermäßigung in Prozent oder ein durchgestrichener Preis muss sich auf diesen niedrigsten Preis der letzten 30 Tage beziehen (EuGH, Urteil vom 26.9.2024, C-330/23). Bei einer schrittweisen, ohne Unterbrechung ansteigenden Preisermäßigung darf es der niedrigste Gesamtpreis vor Beginn dieser Ermäßigung sein (§ 11 Abs. 2 PAngV). Musst du nur den Grundpreis angeben (§ 4 Abs. 2 PAngV), gilt das entsprechend für den Grundpreis (§ 11 Abs. 3 PAngV). Das gilt nicht für individuelle Preisermäßigungen und nicht für schnell verderbliche Waren oder Waren mit kurzer Haltbarkeit, wenn der Preis wegen drohenden Verderbs oder drohenden Ablaufs der Haltbarkeit gesenkt wird und du das für Verbraucher deutlich machst (§ 11 Abs. 4 PAngV).
  en: Anyone who must state total prices to consumers states, with every announcement of a price reduction for goods, the lowest total price applied to consumers within the last 30 days before the reduction was applied (§ 11 para. 1 PAngV). A reduction stated as a percentage or a struck-through price must refer to this lowest price of the last 30 days (CJEU, judgment of 26.9.2024, C-330/23). For a gradual price reduction that increases without interruption, it may be the lowest total price before this reduction began (§ 11 para. 2 PAngV). If you only have to state the unit price (§ 4 para. 2 PAngV), this applies accordingly to the unit price (§ 11 para. 3 PAngV). This does not apply to individual price reductions, nor to perishable goods or goods with a short shelf life if the price is reduced because of imminent spoilage or expiry and you make this clear to consumers (§ 11 para. 4 PAngV).
- de: Bußgeld bis 25.000 €, wenn der niedrigste Gesamtpreis nicht, nicht richtig oder nicht vollständig angegeben ist (§ 20 Nr. 1 PAngV in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954). Außerdem können Mitbewerber und Verbände abmahnen (§§ 3a, 8 UWG).
  en: Fine of up to €25,000 if the lowest total price is not stated, not stated correctly or not stated completely (§ 20 no. 1 PAngV in conjunction with § 3 para. 1 sentence 1 no. 2, para. 2 WiStrG 1954). In addition, competitors and associations can send a warning letter (Abmahnung) (§§ 3a, 8 UWG).
- de: Werbe-E-Mails nur mit Einwilligung verschicken
  en: Send advertising e-mails only with consent
- de: Werbung per E-Mail, etwa einen Newsletter, schickst du nur an Empfänger, die vorher ausdrücklich eingewilligt haben – ohne Einwilligung nur in den engen Grenzen für eigene Kunden.
  en: You send advertising by e-mail, such as a newsletter, only to recipients who have expressly consented beforehand – without consent only within the narrow limits for your own customers.
- de: 'Werbung mit elektronischer Post ohne vorherige ausdrückliche Einwilligung des Adressaten ist eine unzumutbare Belästigung (§ 7 Abs. 2 Nr. 2 UWG) – gegenüber Verbrauchern wie gegenüber Unternehmen. Ohne Einwilligung darfst du nur werben, wenn alle vier Voraussetzungen des § 7 Abs. 3 UWG erfüllt sind: Du hast die E-Mail-Adresse im Zusammenhang mit dem Verkauf einer Ware oder Dienstleistung vom Kunden erhalten, du wirbst damit für eigene ähnliche Waren oder Dienstleistungen, der Kunde hat nicht widersprochen, und du weist ihn bei der Erhebung der Adresse und bei jeder Verwendung klar und deutlich darauf hin, dass er jederzeit widersprechen kann, ohne dass andere als die Übermittlungskosten nach den Basistarifen entstehen. Jede Werbe-E-Mail braucht außerdem eine gültige Adresse, an die der Empfänger die Aufforderung richten kann, solche Nachrichten einzustellen (§ 7 Abs. 2 Nr. 3 Buchst. c UWG). Die Einwilligung musst du nachweisen können (Art. 7 Abs. 1 DSGVO); üblich ist dafür das Double-Opt-in mit Bestätigungs-E-Mail.'
  en: 'Advertising by electronic mail without the addressee''s prior express consent is an unreasonable nuisance (§ 7 para. 2 no. 2 UWG) – towards consumers as well as towards businesses. Without consent you may only advertise if all four conditions of § 7 para. 3 UWG are met: you received the e-mail address from the customer in connection with the sale of goods or a service, you use it to advertise your own similar goods or services, the customer has not objected, and when collecting the address and with every use you clearly and distinctly inform the customer that they can object at any time without incurring costs other than the transmission costs at basic rates. Every advertising e-mail also needs a valid address to which the recipient can send a request to stop such messages (§ 7 para. 2 no. 3 letter c UWG). You must be able to prove the consent (Art. 7(1) GDPR); the usual way is double opt-in with a confirmation e-mail.'
- de: Nach dem UWG kein Bußgeld (§ 20 UWG erfasst nur Telefonwerbung). Mitbewerber und Verbände können Beseitigung und Unterlassung verlangen (§ 8 Abs. 1, 3 UWG), meist mit einer Abmahnung; der Empfänger selbst kann Unterlassung verlangen. Fehlt die Einwilligung, kann die Datenschutzaufsicht ein Bußgeld verhängen (Art. 83 Abs. 5 DSGVO), und der Empfänger kann Schadensersatz fordern (Art. 82 DSGVO).
  en: No fine under the UWG (§ 20 UWG only covers telephone advertising). Competitors and associations can demand removal and cessation (§ 8 para. 1, 3 UWG), usually with a warning letter (Abmahnung); the recipient can also demand cessation. If consent is missing, the data protection authority can impose a fine (Art. 83(5) GDPR), and the recipient can claim damages (Art. 82 GDPR).
- de: Du verschickst einen Newsletter.
  en: You send a newsletter.
