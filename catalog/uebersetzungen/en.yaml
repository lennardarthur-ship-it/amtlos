- de: Für die Güterbeförderung mit Fahrzeugen über 2,8 t bis 3,5 t zulässiger Gesamtmasse gelten im Inland ebenfalls die Lenk- und Ruhezeiten der Verordnung (EG) Nr. 561/2006; das regelt die Fahrpersonalverordnung.
    Ist kein Fahrtenschreiber eingebaut, führen die Fahrerinnen und Fahrer handschriftliche Tageskontrollblätter; ist einer eingebaut, wird er benutzt. Die Nachweise für den laufenden Tag und die vorangegangenen
    28 Kalendertage führen sie mit (§ 1 Abs. 6 FPersV). Du stellst die Vordrucke bereit, prüfst die Aufzeichnungen zeitnah und bewahrst sie ein Jahr außerhalb des Fahrzeugs auf. Für Werkverkehr gibt es
    unter bestimmten Bedingungen Ausnahmen.
  en: For the carriage of goods with vehicles of more than 2.8 t up to 3.5 t permissible total weight, the driving and rest times of Regulation (EC) No 561/2006 also apply domestically; this is regulated
    by the Driving Personnel Ordinance. If no tachograph is installed, drivers keep handwritten daily record sheets; if one is installed, it is used. Drivers carry the records for the current day and the
    previous 28 calendar days (§ 1(6) FPersV). You provide the forms, check the records promptly and keep them outside the vehicle for one year. There are exceptions for own-account transport under certain
    conditions.
- de: 'Für die Pflichten der ausführenden Firma nach § 5 BaustellV gibt es kein eigenes Bußgeld – § 7 BaustellV erfasst nur Vorankündigung und SiGe-Plan des Bauherrn. Die Aufsicht kann Maßnahmen anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
  en: 'There is no separate fine for the duties of the executing company under § 5 BaustellV – § 7 BaustellV only covers the client''s advance notice and health and safety plan. The authority can order measures; a breach of the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG).'
