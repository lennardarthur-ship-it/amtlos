  en: If you have 20 or more workplaces, you report the employment of severely disabled persons every year by 31.3. and pay the compensatory levy (Ausgleichsabgabe) if applicable.
- de: Ab 50 Beschäftigten richtest du eine interne Meldestelle für Hinweisgeber ein.
  en: If you have 50 or more employees, you set up an internal reporting channel for whistleblowers.
