- de: Deutsche Rentenversicherung, Clearingstelle
  en: German Pension Insurance (Deutsche Rentenversicherung), clearing office (Clearingstelle)
- de: Die Anforderungen ergeben sich aus dem Infektionsschutz und den Hygieneverordnungen der Länder.
  en: The requirements come from infection protection law and the hygiene ordinances of the federal states.
- de: Die Aussetzung der monatlichen Voranmeldung für Neugründer endet am 31.12.2026 – ob sie verlängert wird, ist offen.
  en: The suspension of the monthly advance return for new founders ends on 31.12.2026 – whether it will be extended is open.
- de: Die Beiträge zur Sozialversicherung sind am drittletzten Bankarbeitstag des Monats fällig.
  en: Social security contributions are due on the third-to-last bank working day of the month.
- de: Die Berufsgenossenschaft ist die gesetzliche Unfallversicherung für Betriebe. Welche zuständig ist, hängt von deiner Branche ab. Ob du dich selbst als Unternehmer versichern musst, hängt ebenfalls
    von der Branche ab.
  en: The employers' liability insurance association (Berufsgenossenschaft) is the statutory accident insurance for businesses. Which one is responsible depends on your industry. Whether you must insure
    yourself as a business owner also depends on the industry.
- de: Die Betriebsnummer identifiziert deinen Betrieb in allen Meldungen zur Sozialversicherung. Du beantragst sie beim Betriebsnummern-Service der Bundesagentur für Arbeit, bevor die erste Person bei dir
    anfängt.
  en: The establishment number identifies your business in all social security reports. You apply for it at the establishment number service of the Federal Employment Agency (Bundesagentur für Arbeit) before
    your first person starts working for you.
- de: Die Bilanz in elektronischer Form, die ans Finanzamt übermittelt wird.
  en: The balance sheet in electronic form, submitted to the tax office (Finanzamt).
- de: Die Bundesregierung plant, die Benennungspflicht ab 20 Personen nach § 38 BDSG zu streichen.
  en: The federal government plans to remove the obligation to appoint a data protection officer from 20 people under § 38 BDSG.
- de: Die EU-Entgelttransparenzrichtlinie war bis 7.6.2026 umzusetzen; das deutsche Gesetz steht aus. Bis dahin gilt das bisherige Entgelttransparenzgesetz weiter.
  en: The EU Pay Transparency Directive had to be transposed by 7.6.2026; the German law is still pending. Until then, the existing Pay Transparency Act (Entgelttransparenzgesetz) continues to apply.
- de: Die Einkommensteuererklärung übermittelst du elektronisch – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: You submit your income tax return electronically – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
- de: Die Folgen sind noch nicht fachlich erfasst.
  en: The consequences have not yet been reviewed by experts.
- de: Die Frist beginnt, sobald du von der Panne erfährst. Keine Meldung ist nötig, wenn voraussichtlich kein Risiko für die Betroffenen besteht – das entscheidest und dokumentierst du. Amtlos zeigt einen
    Countdown und erstellt einen Meldeentwurf.
  en: The deadline starts as soon as you become aware of the breach. No report is required if there is likely no risk to the people affected – you decide and document this. Amtlos shows a countdown and
    creates a draft report.
- de: Die Gefahrstoffverordnung verlangt ein Verzeichnis der Gefahrstoffe und Betriebsanweisungen für die Beschäftigten.
  en: The Hazardous Substances Ordinance (Gefahrstoffverordnung) requires a register of hazardous substances and operating instructions for employees.
- de: Die Gemeinde hat Gewerbesteuer-Vorauszahlungen festgesetzt.
  en: The municipality has set trade tax prepayments.
- de: Die Gewerbesteuer hängt vom Hebesatz deiner Gemeinde ab. Einzelunternehmen und Personengesellschaften haben einen Freibetrag. Die Erklärung gibst du ohne Steuerberatung bis 31. Juli des Folgejahres ab, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: Trade tax depends on your municipality's multiplier (Hebesatz). Sole proprietorships and partnerships have a tax-free allowance. You file the return without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
- de: Die GoBD regeln, wie Bücher und Belege elektronisch geführt und aufbewahrt werden. Die Verfahrensdokumentation beschreibt deine Abläufe.
  en: The GoBD set out how books and receipts are kept and stored electronically. The process documentation describes your procedures.
- de: Die Gründung einer GmbH oder UG beginnt mit dem Gesellschaftsvertrag, den ein Notar beurkundet. Die Beurkundung ist auch online möglich. Für die GmbH beträgt das Stammkapital mindestens 25.000 €,
    davon ist mindestens die Hälfte einzuzahlen. Eine UG kann ab 1 € gegründet werden.
  en: Founding a GmbH or UG starts with the articles of association, which are notarised by a notary. Notarisation is also possible online. For a GmbH, the share capital is at least €25,000, of which at
    least half must be paid in. A UG can be founded from €1.
- de: Die Hinweispflicht nach § 36 VSBG gilt für Unternehmer mit mehr als 10 Beschäftigten, die eine Website unterhalten oder AGB verwenden.
  en: The notice obligation under § 36 VSBG applies to businesses with more than 10 employees that run a website or use terms and conditions.
- de: Die Höhe steht im Bescheid deiner Gemeinde.
  en: The amount is stated in your municipality's tax notice.
- de: Die Information nennt unter anderem Zweck, Rechtsgrundlage, Empfänger, Speicherdauer und die Rechte der Betroffenen.
  en: The information includes, among other things, the purpose, legal basis, recipients, storage period and the rights of the people affected.
- de: Die Jahreserklärung fasst die Umsatzsteuer des ganzen Jahres zusammen – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: The annual return summarises the VAT for the whole year – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
- de: Die Kleinunternehmerregelung endet ab dem Umsatz, der die Grenze überschreitet. Amtlos zählt dafür die Rechnungen, die du in Amtlos gestellt hast. Rechnungen außerhalb von Amtlos sind nicht enthalten.
  en: The small business scheme (Kleinunternehmerregelung) ends from the sale that exceeds the limit. For this, Amtlos counts the invoices you issued in Amtlos. Invoices outside Amtlos are not included.
- de: Die Kleinunternehmerregelung endet ab dem Umsatz, der die Grenze überschreitet. Prüfe mit dem Finanzamt oder deiner Steuerberatung, ab wann du Umsatzsteuer ausweisen und anmelden musst.
  en: The small business scheme (Kleinunternehmerregelung) ends from the sale that exceeds the limit. Check with the tax office (Finanzamt) or your tax adviser from when you must show and declare VAT.
- de: Die Lebensmittelinformationsverordnung verlangt Angaben zu Allergenen. Amtlos führt eine Allergenliste je Gericht und erstellt daraus eine Übersicht zum Aushängen.
  en: The Food Information Regulation (LMIV) requires information on allergens. Amtlos keeps an allergen list per dish and creates an overview from it for you to post.
- de: Die Lohnabrechnung selbst macht ein systemgeprüfter Partner; Amtlos liefert Stammdaten und Fristen.
  en: The payroll itself is done by a system-certified partner; Amtlos provides master data and deadlines.
- de: Die Maßnahmen (TOM) müssen dem Risiko angemessen sein. Amtlos gliedert sie nach den Schutzzielen der DSGVO; du trägst ein, was umgesetzt ist.
  en: The measures (TOM) must be appropriate to the risk. Amtlos organises them according to the protection goals of the GDPR; you enter what has been implemented.
- de: Die Menschen, denen eine Gesellschaft letztlich gehört oder die sie kontrollieren.
  en: The people who ultimately own or control a company.
- de: Die Minijob-Grenze ist an den Mindestlohn gekoppelt. Amtlos führt die Werte mit Gültigkeitszeitraum.
  en: The mini-job limit is linked to the minimum wage. Amtlos keeps the values with their validity period.
- de: Die Mitteilung an die zuständige Aufsichtsbehörde ist Pflicht des Arbeitgebers.
  en: Notifying the competent supervisory authority is the employer's obligation.
- de: Die Pflicht folgt aus § 38 BDSG bzw. Art. 37 DSGVO. Die Bundesregierung plant, § 38 BDSG bis Ende 2026 zu streichen; ein Gesetz gibt es noch nicht.
  en: The obligation follows from § 38 BDSG or Art. 37 GDPR. The federal government plans to remove § 38 BDSG by the end of 2026; there is no law yet.
- de: Die Pflicht zum Versand strukturierter E-Rechnungen (XRechnung oder ZUGFeRD) gilt ab 1.1.2027 für Unternehmen mit mehr als 800.000 € Vorjahresumsatz. Kleinunternehmer sind befreit. Eine PDF-Rechnung
    ist keine E-Rechnung.
  en: The obligation to send structured e-invoices (XRechnung or ZUGFeRD) applies from 1.1.2027 to businesses with more than €800,000 in previous year's revenue. Small businesses under the small business
    scheme (Kleinunternehmerregelung) are exempt. A PDF invoice is not an e-invoice.
- de: Die Preisangabenverordnung regelt, wie Preise gegenüber Verbrauchern anzugeben sind.
  en: The Price Indication Ordinance (Preisangabenverordnung) governs how prices must be stated to consumers.
- de: Die Registrierung ist Voraussetzung für die Meldewege bei Sicherheitsvorfällen.
  en: Registration is a prerequisite for the reporting channels for security incidents.
- de: Die Sozialkassen regeln unter anderem Urlaub und Berufsbildung in der Bauwirtschaft. Ob dein Betrieb erfasst ist, hängt von den überwiegenden Tätigkeiten ab.
  en: Among other things, the social funds cover holidays and vocational training in the construction industry. Whether your business is covered depends on its predominant activities.
- de: Die Statusfeststellung ist eine Möglichkeit, keine Pflicht. Sie schafft Sicherheit, wenn das Risiko der Scheinselbstständigkeit besteht.
  en: The status determination is an option, not an obligation. It gives you certainty if there is a risk of bogus self-employment.
- de: Die Umlagen finanzieren die Erstattung von Entgeltfortzahlung, Mutterschaftsleistungen und das Insolvenzgeld. Die eAU rufst du bei der Krankenkasse ab, meist über das Lohnprogramm.
  en: The levies fund reimbursement of continued pay during illness, maternity benefits and insolvency pay. You retrieve the eAU from the health insurance fund (Krankenkasse), usually via the payroll software.
- de: Die Umsatzsteuer-Identifikationsnummer brauchst du für Geschäfte innerhalb der EU.
  en: You need the VAT identification number for business within the EU.
- de: Die Unfallversicherung für Arbeitsunfälle und Berufskrankheiten in deiner Branche.
  en: The accident insurance for workplace accidents and occupational diseases in your industry.
- de: Die Unterweisung erklärt die Gefährdungen am Arbeitsplatz und die Schutzmaßnahmen aus der Gefährdungsbeurteilung. Amtlos protokolliert sie digital mit Unterschrift.
  en: The safety briefing explains the workplace hazards and the protective measures from the risk assessment. Amtlos records it digitally with a signature.
- de: Die anlassunabhängige Gefährdungsbeurteilung nach dem Mutterschutzgesetz ist Teil der allgemeinen Gefährdungsbeurteilung.
  en: The general risk assessment under the Maternity Protection Act, carried out regardless of any specific occasion, is part of the overall risk assessment.
- de: Dokumentation und Risikomanagement der Produkte sichten
  en: Review the documentation and risk management of your products
- de: Doppelte Buchführung
  en: Double-entry bookkeeping
- de: Du arbeitest im IT-, Agentur- oder Freelancer-Bereich.
  en: You work in IT, as an agency or as a freelancer.
- de: Du arbeitest im Wesentlichen für einen Auftraggeber.
  en: You work mainly for one client.
- de: Du arbeitest überwiegend für einen Auftraggeber.
  en: You mainly work for one client.
- de: Du bekommst Arbeitslosengeld I.
  en: You receive unemployment benefit I (Arbeitslosengeld I).
- de: Du beschäftigst Jugendliche.
  en: You employ young people.
- de: Du beschäftigst Minijobber.
  en: You employ mini-jobbers.
- de: Du beschäftigst mehr als 10 Personen.
  en: You employ more than 10 people.
- de: Du beschäftigst mehr als 150 Personen.
  en: You employ more than 150 people.
- de: Du beschäftigst mindestens eine Person.
  en: You employ at least one person.
- de: Du betreibst eine Gaststätte.
  en: You run a restaurant or bar.
- de: Du bietest Abos an.
  en: You offer subscriptions.
- de: Du bist im Gründungsjahr.
  en: You are in your founding year.
- de: Du bist nicht zur doppelten Buchführung verpflichtet.
  en: You are not required to use double-entry bookkeeping.
- de: Du bist unsicher, ob NIS2 für dich gilt.
  en: You are unsure whether NIS2 applies to you.
- de: Du bist unsicher, ob deine Tätigkeit ein Gewerbe oder ein freier Beruf ist.
  en: You are unsure whether your activity is a trade or a liberal profession.
- de: Du brauchst eine sicherheitstechnische und betriebsärztliche Betreuung – für Kleinbetriebe auch im Unternehmermodell.
  en: You need occupational safety and company doctor support – small businesses can also use the employer model (Unternehmermodell).
- de: Du bringst verpackte Waren in Verkehr.
  en: You place packaged goods on the market.
- de: Du erbringst Bauleistungen.
  en: You provide construction services.
- de: Du führst ein Verzeichnis, welche Daten über Menschen du wofür verarbeitest.
  en: You keep a record of which data about people you process and for what purpose.
- de: Du gehörst zu einer Gruppe von Selbstständigen, die rentenversicherungspflichtig sein kann.
  en: You belong to a group of self-employed people who may be subject to mandatory pension insurance.
- de: Du gibst die Voranmeldung monatlich ab.
  en: You file the advance return monthly.
- de: Du gründest gerade.
  en: You are currently founding a company.
- de: Du hast Beschäftigte.
  en: You have employees.
- de: Du hast Investoren aus dem Ausland.
  en: You have investors from abroad.
- de: Du hast Kunden in anderen EU-Ländern.
  en: You have customers in other EU countries.
- de: Du hast dein Unternehmen im Vorjahr gegründet.
  en: You founded your business in the previous year.
- de: Du hast dein Unternehmen in diesem Jahr gegründet.
  en: You founded your business this year.
- de: Du hast deinen Anmeldezeitraum angegeben.
  en: You have entered your filing period.
- de: Du hast die erste Person eingestellt.
  en: You have hired your first person.
- de: Du hast eine Datenpanne entdeckt.
  en: You have discovered a data breach.
- de: Du hast eine Dauerfristverlängerung.
  en: You have a permanent deadline extension (Dauerfristverlängerung).
- de: Du hast eine Erlaubnis nach § 34c, § 34d oder § 34f GewO.
  en: You have a permit under § 34c, § 34d or § 34f GewO.
- de: Du hast eine Kasse außer Betrieb genommen.
  en: You have decommissioned a cash register.
- de: Du erbringst Bauleistungen für andere Unternehmen.
  en: You provide construction work for other businesses.
- de: Du hast eine Website.
  en: You have a website.
- de: Du hast im Vorjahr gegründet.
  en: You founded your business in the previous year.
- de: Du hast mehr als 10 Beschäftigte im Sinne des VSBG.
  en: You have more than 10 employees as defined by the VSBG.
- de: Du hast mindestens 10 Beschäftigte im Sinne des BFSG.
  en: You have at least 10 employees as defined by the BFSG.
- de: Du hast mindestens 2 Versicherte.
  en: You have at least 2 insured persons.
- de: Du hast mindestens 20 Arbeitsplätze im Sinne des SGB IX.
  en: You have at least 20 workplaces within the meaning of SGB IX.
- de: Du hast mindestens 50 Beschäftigte im Sinne des HinSchG.
  en: You have at least 50 employees within the meaning of the HinSchG.
- de: Du hast noch nicht angegeben, ob NIS2 für dich gilt.
  en: You have not yet stated whether NIS2 applies to you.
- de: Du hast noch nicht angegeben, ob deine Tätigkeit ein Gewerbe oder ein freier Beruf ist.
  en: You have not yet stated whether your activity is a trade or a liberal profession.
- de: Du informierst deine Gäste über die 14 Hauptallergene in deinen Speisen und Getränken – auch bei loser Ware.
  en: You inform your guests about the 14 main allergens in your food and drinks – including unpackaged goods.
- de: Du kontrollierst und dokumentierst regelmäßig die kritischen Punkte deiner Lebensmittelhygiene, zum Beispiel Kühltemperaturen.
  en: You regularly check and document the critical points of your food hygiene, for example refrigeration temperatures.
- de: Du legst fest und dokumentierst, wie du die Daten schützt, zum Beispiel mit Verschlüsselung, Zugriffsrechten und Datensicherung.
  en: You define and document how you protect the data, for example with encryption, access rights and backups.
- de: Du legst fest, wann welche Daten gelöscht werden – unter Beachtung der Aufbewahrungsfristen.
  en: You define when which data is deleted – taking the retention periods into account.
- de: Du meldest Lohnsteuer beim Finanzamt an.
  en: You file wage tax returns with the tax office.
- de: Du meldest dem Finanzamt regelmäßig, wie viel Umsatzsteuer du eingenommen und gezahlt hast, und überweist die Differenz.
  en: You regularly report to the tax office (Finanzamt) how much VAT you have collected and paid, and transfer the difference.
- de: Du musst Bücher nach den Regeln der doppelten Buchführung führen und einen Jahresabschluss machen.
  en: You must keep books according to the rules of double-entry bookkeeping and prepare annual financial statements.
- de: Du nimmst hohe Barzahlungen für Waren an.
  en: You accept large cash payments for goods.
- de: Du nutzt Dienstleister, die für dich Daten verarbeiten.
  en: You use service providers that process data for you.
- de: Du nutzt die Kleinunternehmerregelung nicht.
  en: You do not use the small business scheme (Kleinunternehmerregelung).
- de: Du nutzt die Kleinunternehmerregelung.
  en: You use the small business scheme (Kleinunternehmerregelung).
- de: Du nutzt eine elektronische Kasse.
  en: You use an electronic cash register.
- de: Du planst die erste Einstellung.
  en: You are planning your first hire.
- de: Du schließt Verträge online oder per App.
  en: You conclude contracts online or via an app.
- de: Du selbst
  en: You
- de: Du selbst (im Jahresabschluss)
  en: You (in the annual financial statements)
- de: Du selbst bzw. deine Steuerberatung
  en: You or your tax adviser
- de: Du selbst mit dem Dienstleister
  en: You together with the service provider
- de: Du selbst; Aufsicht der Länder
  en: You; supervisory authorities of the federal states
- de: Du selbst; Aufsicht der Länder bzw. BaFin
  en: You; supervision by the federal states or BaFin
- de: Du selbst; Finanzamt
  en: You; tax office (Finanzamt)
- de: Du selbst; Gesundheitsamt
  en: You; public health office (Gesundheitsamt)
- de: Du selbst; Gewerbeaufsicht
  en: You; trade supervisory authority (Gewerbeaufsicht)
- de: Du selbst; Hersteller
  en: You; manufacturer
- de: Du selbst; Hilfe beim BSI
  en: You; help from the BSI
- de: Du selbst; Kontrolle durch BALM und Polizei
  en: You; checked by BALM and the police
- de: Du selbst; Kontrolle durch den Zoll
  en: You; inspections by customs (Zoll)
- de: Du selbst; Kontrolle durch den Zoll (Finanzkontrolle Schwarzarbeit)
  en: You; inspections by customs (Finanzkontrolle Schwarzarbeit)
- de: Du selbst; Kontrolle durch die Lebensmittelüberwachung
  en: You; checked by the food control authority (Lebensmittelüberwachung)
- de: Du selbst; Meldung der Kontaktdaten an die Aufsichtsbehörde
  en: You; report contact details to the supervisory authority
- de: Du selbst; Nachweis gegenüber der Erlaubnisbehörde
  en: You; proof to the permit authority
- de: Du selbst; Steuerberatung
  en: You; tax adviser
- de: Du selbst; ggf. Datenschutzbeauftragter
  en: You; data protection officer if applicable
- de: Du selbst; im Zweifel Finanzamt oder Steuerberatung
  en: You; if in doubt, the tax office (Finanzamt) or a tax adviser
- de: Du selbst; verantwortliche Person
  en: You; responsible person
- de: Du setzt Videoüberwachung ein.
  en: You use video surveillance.
- de: Du stellst Rechnungen mit Amtlos.
  en: You issue invoices with Amtlos.
- de: Du stellst jemanden ein.
  en: You are hiring someone.
- de: Du und deine Mitgesellschafter; Bank
  en: You and your co-shareholders; bank
- de: Du und die Gesellschafter; Finanzamt (E-Bilanz)
  en: You and the shareholders; tax office (Finanzamt) (E-Bilanz)
- de: Du verarbeitest Daten von Beschäftigten.
  en: You process employee data.
- de: Du verarbeitest Daten über Menschen (z. B. Kunden oder Beschäftigte).
  en: You process data about people (e.g. customers or employees).
- de: Du verarbeitest Gesundheitsdaten.
  en: You process health data.
- de: Du verkaufst Batterien oder Geräte mit Batterien.
  en: You sell batteries or devices with batteries.
- de: Du verkaufst Elektrogeräte.
  en: You sell electrical devices.
- de: Du verkaufst Kosmetik.
  en: You sell cosmetics.
- de: Du verkaufst Waren.
  en: You sell goods.
- de: Du verkaufst an Unternehmen.
  en: You sell to businesses.
- de: Du verkaufst an Verbraucher.
  en: You sell to consumers.
- de: Du verkaufst über Online-Marktplätze.
  en: You sell via online marketplaces.
- de: Du verkaufst über einen Onlineshop oder eine App.
  en: You sell via an online shop or an app.
- de: Du zahlst Gewerbesteuer.
  en: You pay trade tax (Gewerbesteuer).
- de: Du zahlst allen Beschäftigten mindestens den gesetzlichen Mindestlohn.
  en: You pay all employees at least the statutory minimum wage.
- de: Du zeichnest die Arbeitszeit deiner Beschäftigten auf.
  en: You record your employees' working hours.
- de: E-Bilanz
  en: E-Bilanz
- de: E-Bilanz ans Finanzamt übermitteln
  en: Submit the E-Bilanz to the tax office
- de: E-Rechnung
  en: E-invoice
- de: E-Rechnungen empfangen können
  en: Be able to receive e-invoices
- de: E-Rechnungen versenden (ab 2027)
  en: Send e-invoices (from 2027)
- de: E-Rechnungen versenden (ab 2028)
  en: Send e-invoices (from 2028)
- de: E-Rechnungs-Versandpflicht ab 2027 – Grenze Vorjahresumsatz
  en: E-invoice sending obligation from 2027 – previous year's revenue limit
- de: ELSTER (Finanzverwaltung)
  en: ELSTER (tax administration)
- de: ELSTER-Konto beantragen
  en: Apply for an ELSTER account
- de: Eigenkontrollen nach HACCP
  en: Self-monitoring (HACCP)
- de: Ein Dienstleister verarbeitet Daten in deinem Auftrag und nach deinen Weisungen.
  en: A service provider processes data on your behalf and according to your instructions.
- de: Ein Gesetzentwurf liegt noch nicht vor. Amtlos beobachtet das Vorhaben und passt den Gründungsassistenten an, sobald es konkret wird.
  en: There is no draft bill yet. Amtlos is following the plan and will update the founding assistant as soon as it becomes concrete.
- de: Ein Jahr nach jeder Unterweisung erinnert Amtlos an die Wiederholung. Mit der neuen Unterweisung ist die alte erledigt. Hast du deine letzte Unterweisung noch nicht in Amtlos erfasst, erfasse sie – dann kennt Amtlos den nächsten Termin.
  en: One year after each safety briefing, Amtlos reminds you to repeat it. The new safety briefing completes the old one. If you have not yet recorded your last safety briefing in Amtlos, record it – then Amtlos knows the next date.
- de: Ein Prozentsatz, den jede Gemeinde selbst festlegt und der die Höhe der Gewerbesteuer bestimmt.
  en: A percentage that each municipality sets itself and that determines the amount of trade tax.
- de: Ein Vorgang, bei dem du Daten über Menschen nutzt, z. B. Kundenverwaltung oder Lohnabrechnung.
  en: An activity in which you use data about people, e.g. customer management or payroll.
- de: Eine Beschäftigte hat dir ihre Schwangerschaft mitgeteilt.
  en: An employee has told you she is pregnant.
- de: Eine Beschäftigung endet.
  en: An employment ends.
- de: Eine E-Rechnung ist ein strukturierter Datensatz. Eine PDF-Rechnung ist keine E-Rechnung.
  en: An e-invoice is a structured data record. A PDF invoice is not an e-invoice.
- de: Eine Rechnung als strukturierter Datensatz, den Software automatisch lesen kann.
  en: An invoice as a structured data record that software can read automatically.
- de: Eine UG muss jedes Jahr ein Viertel ihres Jahresüberschusses in eine Rücklage stellen.
  en: A UG must put a quarter of its annual net profit into a reserve every year.
- de: Eine achtstellige Nummer, unter der dein Betrieb bei der Sozialversicherung geführt wird.
  en: An eight-digit number under which your business is registered with social security.
- de: Eine betroffene Person hat eine Anfrage gestellt.
  en: A data subject has made a request.
- de: Eine schriftliche Liste, welche Gefahren es bei der Arbeit gibt und wie du sie verringerst.
  en: A written list of the hazards at work and how you reduce them.
- de: Einkommensteuererklärung abgeben
  en: File your income tax return
