- de: Du hast eine Erlaubnis als Versicherungsvermittler oder Versicherungsberater, Finanzanlagen- oder Immobiliardarlehensvermittler.
  en: You have a permit as an insurance intermediary or insurance adviser, financial investment or real estate loan intermediary.
