- de: Gewerbetreibende mit Erlaubnis nach § 34a GewO, ihre Wachpersonen und die Betriebsleitung werden im Bewacherregister beim Statistischen Bundesamt geführt (§ 11b GewO). Jede Wachperson meldest du vor
    der Beschäftigung mit Bewachungsaufgaben an; einsetzen darfst du sie erst, wenn die Behörde ihre Zuverlässigkeit geprüft und dir das Ergebnis mitgeteilt hat (§ 16 Abs. 1, 2 BewachV). Endet die Beschäftigung,
    meldest du die Person über das Bewacherregister ab, spätestens sechs Wochen nach dem Ende (§ 11b Abs. 6 GewO, § 16 Abs. 6 BewachV).
  en: Traders with a permit under § 34a GewO, their security staff and management are recorded in the security register at the Federal Statistical Office (§ 11b GewO). You register each security guard before
    employing them on security tasks; you may only deploy them once the authority has checked their reliability and informed you of the result (§ 16(1), (2) BewachV). When the employment ends, you deregister
    the person via the security register, at the latest six weeks after the end (§ 11b(6) GewO, § 16(6) BewachV).
