- de: 'Minijobber dürfen im Monat nicht mehr als die Minijob-Grenze verdienen: 603 € (2026), 633 € (2027).'
  en: 'Mini-jobbers may not earn more per month than the mini-job limit: €603 (2026), €633 (2027).'
- de: Mit Dienstleistern, die für dich Daten verarbeiten (z. B. Cloud, Lohnbüro, Newsletter-Tool), schließt du einen Auftragsverarbeitungsvertrag.
  en: You conclude a data processing agreement (DPA) with service providers that process data for you (e.g. cloud, payroll office, newsletter tool).
- de: Mit der Selbstständigkeit kann sich deine Krankenversicherung ändern. Wer hauptberuflich selbstständig ist, kümmert sich selbst um seine Versicherung und die Beiträge.
  en: Becoming self-employed can change your health insurance. If self-employment is your main occupation, you take care of your own insurance and contributions.
- de: Mit der Steuerberatung klären, welcher Rhythmus ab 2027 gilt
  en: Clarify with your tax adviser which filing frequency applies from 2027
- de: Mit mehr als 10 Beschäftigten informierst du auf Website und in AGB, ob du an Streitbeilegungsverfahren teilnimmst.
  en: With more than 10 employees, you state on your website and in your terms and conditions (AGB) whether you take part in dispute resolution proceedings.
- de: Mitarbeiterbeteiligung prüfen (Option)
  en: Check employee participation (optional)
- de: Mitgliedschaft in IHK oder Handwerkskammer
  en: Membership in the IHK or Chamber of Crafts
- de: Monatliche USt-Voranmeldung für Neugründer ab 2027
  en: Monthly advance VAT return for new founders from 2027
- de: Mutterschutz in der Gefährdungsbeurteilung
  en: Maternity protection in the risk assessment
- de: NIS2 betrifft Unternehmen bestimmter Sektoren ab einer bestimmten Größe. Wer betroffen ist, muss sich beim BSI registrieren und Sicherheitsvorfälle melden. Beantworte die Frage im Profil, sobald du
    es weißt.
  en: NIS2 affects companies in certain sectors above a certain size. If you are affected, you must register with the BSI and report security incidents. Answer the question in your profile as soon as you
    know.
- de: Nach dem Plattformen-Steuertransparenzgesetz (DAC7) melden Plattformen bestimmte Verkäufer. Amtlos erklärt, was gemeldet wird.
  en: Under the Platform Tax Transparency Act (Plattformen-Steuertransparenzgesetz, DAC7), platforms report certain sellers. Amtlos explains what is reported.
- de: Nach der Arbeitsstättenverordnung triffst du Vorkehrungen gegen Brände und lässt Löschgeräte regelmäßig auf ihre Funktionsfähigkeit prüfen (§ 4 Abs. 3 ArbStättV). Wie viele Feuerlöscher du brauchst,
    richtet sich nach Größe und Brandgefährdung der Räume (Technische Regel für Arbeitsstätten ASR A2.2). Die Feuerlöscher lässt du spätestens alle zwei Jahre von einer sachkundigen Person prüfen. Brandschutzhelfer
    unter deinen Beschäftigten sind eine eigene Pflicht.
  en: Under the Workplace Ordinance, you take precautions against fires and have extinguishing equipment checked regularly for functionality (§ 4(3) ArbStättV). How many fire extinguishers you need depends
    on the size and fire risk of the rooms (Technical Rule for Workplaces ASR A2.2). You have the fire extinguishers inspected by a competent person at least every two years. Fire safety assistants among
    your employees are a separate obligation.
- de: Nach jedem Geschäftsjahr erstellst du Bilanz und Gewinn- und Verlustrechnung; die Gesellschafter stellen den Abschluss fest.
  en: After each financial year, you prepare a balance sheet and profit and loss statement; the shareholders approve the financial statements.
- de: Nach § 25 TDDDG ist für das Speichern und Auslesen von Informationen auf dem Endgerät grundsätzlich eine Einwilligung nötig, außer es ist unbedingt erforderlich. Der Consent-Check deiner Website folgt
    mit dem Online-Check (Abschnitt 7).
  en: Under § 25 TDDDG, storing and reading information on a user's device generally requires consent unless it is strictly necessary. The consent check for your website will follow with the online check
    (section 7).
- de: Nach § 312j BGB kommt ohne eindeutige Beschriftung kein wirksamer Vertrag zustande.
  en: Under § 312j BGB, no valid contract is concluded without clear labelling.
- de: Noch keine Folge – eine Warnung, damit du rechtzeitig planen kannst.
  en: No consequence yet – a warning so you can plan in time.
- de: Noch keine – Pflichten gelten später.
  en: None yet; obligations apply later.
- de: Noch keine – geplante Regelung.
  en: None yet; planned rules.
- de: Notarin oder Notar
  en: Notary
- de: Notarin oder Notar; Registergericht
  en: Notary; registry court (Registergericht)
- de: Ob eine Geschäftsführerin oder ein Geschäftsführer sozialversicherungspflichtig beschäftigt ist, hängt vom Einzelfall ab. Sicherheit schafft eine Statusfeststellung bei der Deutschen Rentenversicherung.
  en: Whether a managing director is employed subject to social security depends on the individual case. A status determination by the German Pension Insurance (Deutsche Rentenversicherung) provides certainty.
- de: Offenlegung
  en: Publication
- de: Ohne Anmeldezeitraum kann Amtlos keine Termine berechnen.
  en: Without the filing period, Amtlos cannot calculate any dates.
- de: Ohne Bescheinigung darfst du die jugendliche Person nicht beschäftigen (§ 32 Abs. 1 JArbSchG); Verstöße kosten bis 30.000 € (§ 58 Abs. 1, 4 JArbSchG).
  en: Without the certificate you may not employ the young person (§ 32(1) JArbSchG); breaches cost up to €30,000 (§ 58(1), (4) JArbSchG).
- de: Ohne Freistellungsbescheinigung müssen Auftraggeber einen Teil deiner Rechnung als Bauabzugsteuer einbehalten.
  en: Without an exemption certificate, clients must withhold part of your invoice as construction withholding tax.
- de: Ohne Konto kannst du den Fragebogen zur steuerlichen Erfassung nicht elektronisch übermitteln.
  en: Without an account, you cannot submit the tax registration questionnaire electronically.
- de: Ohne diese Einordnung bleibt offen, welche Anmeldungen du brauchst.
  en: Without this classification, it remains unclear which registrations you need.
- de: Ohne diese Klärung bleibt offen, ob Registrierung und Meldepflichten gelten.
  en: Without this clarification, it remains unclear whether registration and reporting obligations apply.
- de: Ohne geprüfte Software sind die Meldungen nicht möglich.
  en: Without certified software, the notifications are not possible.
- de: 'Ohne gültige Freistellungsbescheinigung muss dein Auftraggeber 15 % der Gegenleistung einbehalten und für dich ans Finanzamt abführen, sofern die Gegenleistungen im Kalenderjahr 5.000 € (bei bestimmten Vermietern 15.000 €) übersteigen (§ 48 Abs. 1 Satz 1, Abs. 2 Satz 1 EStG).'
  en: 'Without a valid exemption certificate your client must withhold 15 % of the payment and pay it to the tax office on your behalf, if the payments in the calendar year exceed €5,000 (€15,000 for certain landlords) (§ 48(1) sentence 1, (2) sentence 1 EStG).'
- de: 'Ohne notarielle Beurkundung ist der Gesellschaftsvertrag nichtig (§ 2 Abs. 1 Satz 1 GmbHG, § 125 Satz 1 BGB). Die GmbH oder UG besteht vor der Eintragung als solche nicht; wer vorher in ihrem Namen handelt, haftet persönlich und solidarisch (§ 11 Abs. 1, 2 GmbHG).'
  en: 'Without notarisation the articles of association are void (§ 2(1) sentence 1 GmbHG, § 125 sentence 1 BGB). Before registration the GmbH or UG does not exist as such; anyone who acts in its name beforehand is personally and jointly liable (§ 11(1), (2) GmbHG).'
- de: 'Ordnungswidrig handelt, wer den Beginn der Beitragspflicht nicht fristgerecht anzeigt oder den Beitrag länger als sechs Monate nicht zahlt; verfolgt wird nur auf Antrag der Landesrundfunkanstalt (§ 12 Abs. 1 Nr. 1, 3, Abs. 3 RBStV). Eine Höhe nennt der Staatsvertrag nicht – dann gilt bis 1.000 € (§ 17 Abs. 1 OWiG).'
  en: 'It is an administrative offence not to report the start of the contribution obligation on time or not to pay the contribution for more than six months; it is only prosecuted at the request of the state broadcaster (§ 12(1) nos. 1, 3, (3) RBStV). The treaty sets no amount – then up to €1,000 applies (§ 17(1) OWiG).'
- de: Personen mit ständiger automatisierter Verarbeitung, ab denen ein Datenschutzbeauftragter zu benennen ist
  en: Persons constantly involved in automated processing from which a data protection officer must be appointed
- de: Pflichten und Haftung der Geschäftsführung kennen
  en: Know the duties and liability of managing directors
- de: Preise richtig angeben
  en: State prices correctly
- de: 'Produktsicherheit (GPSR): Angaben und verantwortliche Person'
  en: 'Product safety (GPSR): information and responsible person'
- de: Prüfe in deinen Verträgen die Haftung und ob eine Berufs- oder Betriebshaftpflicht passt.
  en: Check the liability in your contracts and whether professional or business liability insurance is right for you.
- de: Prüfen, ob NIS2 für dich gilt
  en: Check whether NIS2 applies to you
- de: Prüfen, ob deine Produkte unter das BFSG fallen
  en: Check whether your products fall under the BFSG
- de: Prüfen, ob die Benennungspflicht nach Art. 37 DSGVO unabhängig davon besteht
  en: Check whether the obligation to appoint under Art. 37 GDPR applies regardless
- de: Prüfen, ob eine Datenschutz-Folgenabschätzung nötig ist
  en: Check whether a data protection impact assessment is needed
- de: Prüfen, ob eure KI-Produkte in einen Hochrisiko-Bereich fallen
  en: Check whether your AI products fall into a high-risk area
- de: Prüfen, welche Übergangsfrist für eure Betriebsgröße gelten würde
  en: Check which transition period would apply to your company size
- de: Rechnungen mit allen Pflichtangaben schreiben
  en: Write invoices with all mandatory details
- de: Regeln der Finanzverwaltung, wie Bücher und Belege elektronisch geführt und aufbewahrt werden.
  en: Rules of the tax authorities on how books and receipts are kept and stored electronically.
- de: Registergericht (über den Notar)
  en: Registry court (Registergericht) (via the notary)
- de: Rollen geklärt – Vorankündigung, SiGe-Plan und Koordinator sind Bauherrenpflichten.
  en: Roles clarified – prior notice, SiGe plan and coordinator are obligations of the client (Bauherr).
- de: Rücklage der UG bilden
  en: Build up the UG reserve
- de: 'Rücklage der UG: Anteil am Jahresüberschuss'
  en: 'UG reserve: share of annual net profit'
- de: SOKA-BAU
  en: SOKA-BAU
- de: Sag deiner Krankenversicherung, dass du selbstständig bist. Hauptberuflich Selbstständige versichern sich selbst.
  en: Tell your health insurance that you are self-employed. If self-employment is your main occupation, you insure yourself.
- de: Scheinselbstständigkeit
  en: Bogus self-employment (Scheinselbstständigkeit)
- de: Scheinselbstständigkeit vermeiden
  en: Avoid false self-employment
- de: Schwangerschaft der Aufsichtsbehörde mitteilen
  en: Notify the supervisory authority of a pregnancy
- de: Seit 28.6.2025 müssen bestimmte Dienstleistungen wie Onlineshops barrierefrei sein – mit Barrierefreiheitserklärung.
  en: Since 28.6.2025, certain services such as online shops must be accessible, with an accessibility statement.
- de: Seit der Neuregelung von § 22 SGB VII (anzuwenden ab 29.5.2026) bestellen Unternehmen mit regelmäßig 50 oder mehr Beschäftigten Sicherheitsbeauftragte; Zahl und Auswahl richten sich nach den Unfall-
    und Gesundheitsgefahren und der Zahl der Beschäftigten. Bei mehr als 20 und weniger als 50 Beschäftigten ist ein Sicherheitsbeauftragter nur nötig, wenn nach der Gefährdungsbeurteilung eine besondere
    Gefährdung für Leben und Gesundheit besteht; die Berufsgenossenschaft kann die Kriterien festlegen und die Bestellung anordnen. Sicherheitsbeauftragte unterstützen dich ehrenamtlich bei der Umsetzung
    des Arbeitsschutzes und nehmen an Lehrgängen der BG teil.
  en: Since the new version of § 22 SGB VII (applicable from 29.5.2026), businesses with a regular 50 or more employees appoint safety officers; their number and selection depend on the accident and health
    hazards and the number of employees. With more than 20 and fewer than 50 employees, a safety officer is only required if the risk assessment shows a particular hazard to life and health; the BG can
    set the criteria and order the appointment. Safety officers support you on a voluntary basis in implementing occupational safety and attend courses of the BG.
- de: Setzt deine Website Tracking oder nicht notwendige Cookies ein, holst du vorher die Einwilligung der Besucher ein.
  en: If your website uses tracking or non-essential cookies, you get visitors' consent first.
- de: Sicherheitsbeauftragte bestellen
  en: Appoint safety officers
- de: Sicherheitsvorfälle melden (NIS2)
  en: Report security incidents (NIS2)
- de: Sind bei der Arbeit mindestens zwei Personen anwesend, sorgst du für ausgebildete Ersthelfer und lässt sie alle zwei Jahre fortbilden.
  en: If at least two people are present at work, you ensure trained first aiders and have them attend refresher training every two years.
- de: Sofortmeldung bei Arbeitsbeginn
  en: Immediate notification when work starts
- de: Sondervorauszahlung zur Umsatzsteuer leisten
  en: Make the special advance VAT payment
- de: Sozialversicherungsbeiträge zahlen
  en: Pay social security contributions
- de: Sozialversicherungsstatus der Geschäftsführung klären
  en: Clarify the social security status of managing directors
- de: Stammkapital
  en: Share capital
- de: Stammkapital einzahlen
  en: Pay in the share capital
- de: Statusfeststellung erwägen (Scheinselbstständigkeit)
  en: Consider a status determination (bogus self-employment)
- de: Stellst du Jugendliche ein, die ins Berufsleben eintreten, lässt du dir vor Beginn die Bescheinigung über die ärztliche Erstuntersuchung vorlegen.
  en: If you hire young people entering working life, you have them show you the certificate of the initial medical examination before they start.
- de: Stellst du eigene Kosmetikprodukte her oder bringst sie unter deinem Namen in Verkehr, gelten die Pflichten der EU-Kosmetikverordnung.
  en: If you make your own cosmetic products or place them on the market under your name, the obligations of the EU Cosmetics Regulation apply.
- de: Stirbt jemand durch einen Arbeitsunfall oder ist er danach mehr als drei Tage arbeitsunfähig, zeigst du den Unfall binnen drei Tagen der BG an, nachdem du davon erfahren hast.
  en: If someone dies in an accident at work or is unable to work for more than three days afterwards, you report the accident to the BG within three days of learning about it.
- de: TOM
  en: TOM
- de: TSE
  en: TSE
- de: Technische Sicherheitseinrichtung, die Kassendaten gegen Manipulation schützt.
  en: Technical security device that protects cash register data against tampering.
- de: Technische und organisatorische Maßnahmen festlegen
  en: Define technical and organisational measures
- de: Technische und organisatorische Maßnahmen zum Schutz personenbezogener Daten.
  en: Technical and organisational measures to protect personal data.
- de: Teilnahme an SOKA-BAU
  en: Participation in SOKA-BAU
- de: Teilt dir eine Beschäftigte ihre Schwangerschaft mit, informierst du die Aufsichtsbehörde.
  en: If an employee tells you she is pregnant, you inform the supervisory authority.
- de: Termin ist jetzt der erste Arbeitstag (Erinnerung am Tag davor); Folgen ergänzt.
  en: The deadline is now the first working day (reminder the day before); consequences added.
- de: Transparenzregister (Bundesanzeiger Verlag)
  en: Transparency register (Transparenzregister, Bundesanzeiger Verlag)
- de: 'Tätigkeit einordnen: freier Beruf oder Gewerbe'
  en: 'Classify your activity: liberal profession or trade'
- de: Umlagen U1/U2/U3 und eAU-Abruf
  en: U1/U2/U3 levies and eAU retrieval
- de: Umsatzsteuer-Identifikationsnummer beantragen
  en: Apply for a VAT identification number
- de: Umsatzsteuer-Jahreserklärung abgeben
  en: File the annual VAT return
- de: Umsatzsteuer-Voranmeldung abgeben
  en: Submit the advance VAT return
- de: 'Umsatzsteuer: Regelsteuersatz'
  en: 'VAT: standard rate'
- de: 'Umsatzsteuer: ermäßigter Steuersatz'
  en: 'VAT: reduced rate'
- de: Unabhängig davon, ob jemand schwanger ist, beurteilst du die Arbeitsplätze auch nach dem Mutterschutzgesetz.
  en: Regardless of whether anyone is pregnant, you also assess workplaces under the Maternity Protection Act (Mutterschutzgesetz).
- de: Unfall und Erste Hilfe im Verbandbuch eintragen
  en: Record accidents and first aid in the first-aid log
- de: Unterlagen aufbewahren
  en: Keep records
- de: Unternehmensregister
  en: Company register (Unternehmensregister)
- de: Unterweisung jährlich wiederholen
  en: Repeat the safety briefing every year
- de: Unterweisung mündlich, jährlich und mit Unterschrift; Ausnahme bei geringer Gefährdung; Bußgeld ergänzt.
  en: Instruction orally, annually and with signature; exception for low hazard; fine added.
- de: VSOP
  en: VSOP
- de: Verarbeitest du besonders sensible Daten oder überwachst du mit Video, prüfst du, ob eine Datenschutz-Folgenabschätzung nötig ist.
  en: If you process particularly sensitive data or use video surveillance, you check whether a data protection impact assessment is needed.
- de: Verarbeitungstätigkeit
  en: Processing activity
- de: Verpackungen registrieren und lizenzieren
  en: Register and license packaging
- de: Versicherte, ab denen Ersthelfer nötig sind
  en: Insured persons from which first aiders are required
- de: Verzeichnis der Verarbeitungstätigkeiten führen
  en: Keep a record of processing activities
- de: Videoüberwachung kennzeichnen und begründen
  en: Label and justify video surveillance
- de: 'Virtuelles Beteiligungsprogramm: Mitarbeitende werden wirtschaftlich beteiligt, ohne echte Anteile zu bekommen.'
  en: 'Virtual stock option plan: employees share in the company financially without receiving real shares.'
- de: Vor Arbeitsbeginn unterweisen
  en: Give a safety briefing before work starts
- de: Vor der ersten Verwendung stellst du den Beschäftigten eine schriftliche Betriebsanweisung in verständlicher Form und Sprache zur Verfügung (§ 12 Abs. 2 BetrSichV) – etwa für Aufschnittmaschine, Teigknetmaschine,
    Kreissäge, Hebebühne, Kompressor oder Reinigungsmaschine. Das gilt nicht für Arbeitsmittel, für die der Hersteller keine Gebrauchsanleitung mitliefern muss. Statt einer eigenen Betriebsanweisung darfst
    du die mitgelieferte Gebrauchsanleitung bereitstellen, wenn sie die nötigen Angaben enthält. Außerdem unterweist du die Beschäftigten vor der ersten Verwendung tätigkeitsbezogen und danach mindestens
    einmal jährlich und hältst Datum und Namen schriftlich fest (§ 12 Abs. 1 BetrSichV).
  en: Before first use, you provide employees with written operating instructions in an understandable form and language (§ 12(2) BetrSichV) – for example for slicing machine, dough kneading machine, circular
    saw, vehicle lift, compressor or cleaning machine. This does not apply to work equipment for which the manufacturer does not have to supply instructions for use. Instead of your own operating instructions
    you may provide the supplied instructions for use if they contain the necessary information. In addition, you instruct employees before first use, specific to the activity, and at least once a year
    afterwards, and record date and names in writing (§ 12(1) BetrSichV).
- de: Vorauszahlungen sind Abschläge auf die Steuer des laufenden Jahres. Die Höhe steht im Vorauszahlungsbescheid.
  en: Prepayments are instalments on the current year's tax. The amount is stated in the prepayment notice (Vorauszahlungsbescheid).
- de: Vorauszahlungen zur Einkommen- oder Körperschaftsteuer zahlen
  en: Pay income tax or corporate income tax prepayments
- de: Vorjahres-Zahllast, ab der die USt-Voranmeldung monatlich abzugeben ist
  en: Previous year's VAT liability from which the advance VAT return must be filed monthly
- de: Vorjahres-Zahllast, bis zu der eine Befreiung von der USt-Voranmeldung möglich ist
  en: Previous year's VAT liability up to which an exemption from the advance VAT return is possible
- de: Wegfall der Schwelle nach § 38 BDSG (geplant)
  en: Removal of the threshold under § 38 BDSG (planned)
- de: Weiterbildungspflicht (Immobilien und Finanzen)
  en: Continuing education obligation (real estate and finance)
- de: Welche Angaben eine Rechnung braucht, regelt § 14 UStG. Für Kleinbetragsrechnungen gelten Erleichterungen. Kleinunternehmer weisen auf die Steuerbefreiung nach § 19 UStG hin.
  en: § 14 UStG sets out which details an invoice needs. Simplified rules apply to small-amount invoices. Small businesses under the small business scheme refer to the tax exemption under § 19 UStG.
- de: Welche Erlaubnis nötig ist, hängt vom Beruf ab (z. B. Heilpraktiker, Pflege, Physiotherapie). Ohne sie darfst du die Tätigkeit nicht ausüben.
  en: Which permit you need depends on the profession (e.g. alternative practitioner (Heilpraktiker), nursing, physiotherapy). Without it, you may not carry out the activity.
- de: Welche Gesetze du aushängst, auslegst oder elektronisch zugänglich machst, hängt von der Belegschaft ab. Ab der ersten beschäftigten Person – das Arbeitszeitgesetz mit den geltenden Rechtsverordnungen,
    Tarifverträgen und Betriebsvereinbarungen (§ 16 Abs. 1 ArbZG) und das AGG mit § 61b ArbGG und der Angabe, wo die Beschwerdestelle ist (§ 12 Abs. 5 AGG). Bei regelmäßig mehr als drei beschäftigten Frauen
    das Mutterschutzgesetz (§ 26 MuSchG). Ab einer beschäftigten jugendlichen Person das Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde (§ 47 JArbSchG), ab drei Jugendlichen zusätzlich
    Beginn und Ende der Arbeitszeit und der Pausen (§ 48 JArbSchG). Dazu machst du die Unfallverhütungsvorschriften deiner BG zugänglich (§ 12 DGUV Vorschrift 1) und hängst die Hinweise zur Ersten Hilfe
    mit Notruf und Ersthelfern aus (§ 24 Abs. 5 DGUV Vorschrift 1).
  en: Which laws you post, display or make available electronically depends on your workforce. From the first employee – the Working Hours Act with the applicable ordinances, collective agreements and works
    agreements (§ 16(1) ArbZG) and the AGG with § 61b ArbGG and information on where the complaints office is (§ 12(5) AGG). With a regular more than three women employed, the Maternity Protection Act (§
    26 MuSchG). From one young employee, the Youth Employment Protection Act with the address of the supervisory authority (§ 47 JArbSchG), from three young people additionally the start and end of working
    hours and breaks (§ 48 JArbSchG). You also make your BG's accident prevention regulations accessible (§ 12 DGUV Regulation 1) and post the first-aid information with emergency number and first aiders
    (§ 24(5) DGUV Regulation 1).
- de: Wenn ausländische Investoren in ein Unternehmen in einem sensiblen Sektor einsteigen, kann eine Investitionsprüfung nötig sein.
  en: If foreign investors invest in a company in a sensitive sector, an investment screening may be required.
- de: Wenn das Finanzamt Vorauszahlungen festgesetzt hat, zahlst du sie am 10. März, 10. Juni, 10. September und 10. Dezember.
  en: If the tax office (Finanzamt) has set prepayments, you pay them on 10 March, 10 June, 10 September and 10 December.
- de: Wenn die Gemeinde Gewerbesteuer-Vorauszahlungen festgesetzt hat, zahlst du sie am 15. Februar, 15. Mai, 15. August und 15. November.
  en: If the municipality has set trade tax prepayments, you pay them on 15 February, 15 May, 15 August and 15 November.
- de: Wenn du Arbeitslosengeld I bekommst, kannst du einen Gründungszuschuss beantragen – vor dem Start.
  en: If you receive unemployment benefit I (Arbeitslosengeld I), you can apply for a start-up grant (Gründungszuschuss), before you start.
- de: Wenn du Bauleistungen erbringst, beantragst du beim Finanzamt eine Freistellungsbescheinigung, damit deine Auftraggeber keine Bauabzugsteuer einbehalten.
  en: If you provide construction services, you apply to the tax office (Finanzamt) for an exemption certificate (Freistellungsbescheinigung) so that your clients do not withhold construction withholding
    tax (Bauabzugsteuer).
- de: Wenn du Daten erhebst, informierst du die Menschen darüber – etwa in einer Datenschutzerklärung oder einem Informationsblatt.
  en: When you collect data, you inform the people concerned – for example in a privacy policy or an information sheet.
- de: Wenn du Geschäfte mit Kunden in anderen EU-Ländern machst, beantragst du eine USt-IdNr. beim Bundeszentralamt für Steuern.
  en: If you do business with customers in other EU countries, you apply for a VAT ID number (USt-IdNr.) from the Federal Central Tax Office (Bundeszentralamt für Steuern).
- de: Wenn du Mitarbeitende am Unternehmen beteiligen willst, gibt es dafür besondere Regeln und Modelle wie VSOP.
  en: If you want to give employees a stake in the company, there are special rules and models such as VSOP.
- de: Wenn du Videoüberwachung einsetzt, machst du sie erkennbar und dokumentierst den Zweck.
  en: If you use video surveillance, you make it recognisable and document the purpose.
- de: Wenn du die Voranmeldung monatlich abgibst und eine Dauerfristverlängerung hast, zahlst du einmal im Jahr eine Sondervorauszahlung von einem Elftel.
  en: If you file the advance return monthly and have a permanent deadline extension (Dauerfristverlängerung), you make a special advance payment (Sondervorauszahlung) of one eleventh once a year.
- de: Wenn du eine elektronische Kasse nicht mehr nutzt, meldest du das innerhalb eines Monats über ELSTER.
  en: If you stop using an electronic cash register, you report this via ELSTER within one month.
- de: Wenn du nur einen Auftraggeber hast, kannst du bei der Clearingstelle der Rentenversicherung klären lassen, ob du wirklich selbstständig bist.
  en: If you only have one client, you can ask the clearing office of the pension insurance (Clearingstelle) to determine whether you are really self-employed.
- de: Wenn ihr mit Gefahrstoffen arbeitet, führst du ein Verzeichnis, schreibst Betriebsanweisungen und unterweist jährlich mündlich mit Unterschrift.
  en: If you work with hazardous substances, you keep a register, write operating instructions and instruct orally every year with signature.
- de: Wenn jemand formal selbstständig ist, tatsächlich aber wie ein Angestellter arbeitet.
  en: When someone is formally self-employed but actually works like an employee.
- de: Wenn sich im Gesellschafterkreis etwas ändert, muss eine neue Gesellschafterliste zum Handelsregister – über den Notar.
  en: If anything changes among the shareholders, a new list of shareholders (Gesellschafterliste) must be submitted to the commercial register (Handelsregister) – via the notary.
- de: Wer Jugendliche beschäftigt, braucht vorab eine ärztliche Erstuntersuchung (§ 32 JArbSchG), muss besondere Arbeitszeitgrenzen einhalten und das Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde
    aushängen oder auslegen (§ 47 JArbSchG); ab drei Jugendlichen hängst du außerdem Beginn und Ende ihrer Arbeitszeit und Pausen aus (§ 48 JArbSchG). Jugendliche arbeiten nur zwischen 6 und 20 Uhr (§ 14
    Abs. 1 JArbSchG); in Bäckereien und Konditoreien dürfen Jugendliche über 16 Jahre ab 5 Uhr arbeiten, Jugendliche über 17 Jahre in Bäckereien ab 4 Uhr (§ 14 Abs. 2 Nr. 4, Abs. 3 JArbSchG). Gefährliche
    Arbeiten – etwa an Maschinen mit erhöhter Unfallgefahr oder mit Gefahrstoffen – sind nur eingeschränkt erlaubt (§ 22 JArbSchG); die Gefährdungsbeurteilung berücksichtigt Jugendliche eigens (§ 28a JArbSchG).
    Halbjährliche Unterweisung und Nachuntersuchung nach einem Jahr sind eigene Pflichten.
  en: Anyone employing young people needs an initial medical examination beforehand (§ 32 JArbSchG), must observe special working time limits and post or display the Youth Employment Protection Act with
    the address of the supervisory authority (§ 47 JArbSchG); from three young people you also post the start and end of their working hours and breaks (§ 48 JArbSchG). Young people only work between 6
    and 20 o'clock (§ 14(1) JArbSchG); in bakeries and confectioneries young people over 16 may work from 5 o'clock, young people over 17 in bakeries from 4 o'clock (§ 14(2) no. 4, (3) JArbSchG). Dangerous
    work – for example on machines with an increased risk of accidents or with hazardous substances – is only permitted to a limited extent (§ 22 JArbSchG); the risk assessment takes young people into account
    specifically (§ 28a JArbSchG). Six-monthly instruction and the follow-up examination after one year are separate obligations.
- de: 'Wer als Geschäftsführung ihre Pflichten verletzt, haftet der Gesellschaft für den Schaden (§ 43 Abs. 2 GmbHG) und für Steuern, die deshalb nicht oder nicht rechtzeitig festgesetzt oder gezahlt werden (§ 69 AO). Zahlungen nach Eintritt der Insolvenzreife muss sie der Gesellschaft erstatten (§ 15b Abs. 1, 4 InsO). Wer Sozialversicherungsbeiträge nicht abführt, macht sich strafbar: Freiheitsstrafe bis zu fünf Jahren oder Geldstrafe (§ 266a Abs. 1 StGB). Wer den Verlust der Hälfte des Stammkapitals nicht anzeigt, wird mit Freiheitsstrafe bis zu drei Jahren oder Geldstrafe bestraft, bei Fahrlässigkeit bis zu einem Jahr (§ 84 GmbHG). Für eine nicht eingereichte Gesellschafterliste haftet die Geschäftsführung den Betroffenen und den Gläubigern (§ 40 Abs. 3 GmbHG).'
  en: 'Managing directors who breach their duties are liable to the company for the damage (§ 43(2) GmbHG) and for taxes that are therefore not assessed or paid, or not on time (§ 69 AO). Payments made after insolvency has occurred must be reimbursed to the company (§ 15b(1), (4) InsO). Anyone who does not pay over social security contributions commits a criminal offence: imprisonment of up to five years or a fine (§ 266a(1) StGB). Anyone who does not report the loss of half the share capital faces imprisonment of up to three years or a fine, in case of negligence up to one year (§ 84 GmbHG). Management is liable to those affected and to creditors for a shareholder list that was not filed (§ 40(3) GmbHG).'
- de: Wer bei dir als Nachtarbeitnehmer arbeitet, kann sich vor Beginn und danach alle drei Jahre, ab 50 Jahren jährlich, auf deine Kosten arbeitsmedizinisch untersuchen lassen und bekommt einen Ausgleich
    durch freie Tage oder Zuschlag.
  en: Anyone working for you as a night worker can have an occupational medical examination at your expense before starting and then every three years, from age 50 every year, and receives compensation
    through days off or a bonus.
- de: 'Wer ein erlaubnispflichtiges Gewerbe ohne Erlaubnis betreibt, riskiert ein Bußgeld bis 5.000 €, bei Finanzanlagenvermittlung und Honorar-Finanzanlagenberatung bis 50.000 € (§ 144 Abs. 1 Nr. 1, Abs. 4 GewO). Eine Gaststätte ohne die nach § 2 Abs. 1 GastG erforderliche Erlaubnis kostet bis 5.000 € (§ 28 Abs. 1 Nr. 1, Abs. 3 GastG) – soweit in deinem Land das Gaststättengesetz des Bundes gilt.'
  en: 'Anyone who operates a trade requiring a licence without one risks a fine of up to €5,000, for financial investment brokerage and fee-based financial investment advice up to €50,000 (§ 144(1) no. 1, (4) GewO). A restaurant or bar without the licence required under § 2(1) GastG costs up to €5,000 (§ 28(1) no. 1, (3) GastG) – where the federal Restaurant Act (Gaststättengesetz) applies in your state.'
- de: 'Wer in der Anmeldung falsch versichert, dass die Einlagen geleistet sind, macht sich strafbar: Freiheitsstrafe bis zu drei Jahren oder Geldstrafe (§ 82 Abs. 1 Nr. 1 GmbHG). Vor der Eintragung besteht die Gesellschaft als solche nicht; wer in ihrem Namen handelt, haftet persönlich (§ 11 Abs. 1, 2 GmbHG).'
  en: 'Anyone who falsely declares in the registration that the contributions have been made commits a criminal offence: imprisonment of up to three years or a fine (§ 82(1) no. 1 GmbHG). Before registration the company does not exist as such; anyone who acts in its name is personally liable (§ 11(1), (2) GmbHG).'
- de: Wer wenig Umsatz macht, kann ohne Umsatzsteuer abrechnen.
  en: If you have low revenue, you can invoice without VAT.
- de: Widerrufsbutton für Online-Verträge
  en: Withdrawal button for online contracts
- de: Wird eine Grenze überschritten, fällt ab diesem Umsatz Umsatzsteuer an.
  en: If a limit is exceeded, VAT is due from that sale onwards.
