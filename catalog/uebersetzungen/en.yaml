- de: Du setzt Videoüberwachung ein.
  en: You use video surveillance.
- de: 'Du sorgst dafür, dass bei einem Unfall sofort Hilfe geholt werden kann und Erste Hilfe geleistet wird (§ 24 DGUV Vorschrift 1, § 10 ArbSchG): Erste-Hilfe-Material in ausreichender Menge, gut erreichbar
    und gekennzeichnet – Art und Zahl der Verbandkästen richten sich nach der Zahl der Beschäftigten und der Gefährdung (§ 25 DGUV Vorschrift 1, ASR A4.3). Ein Aushang nennt Notruf, Ersthelfer und das Verhalten
    bei Unfällen (§ 24 Abs. 5 DGUV Vorschrift 1). Jede Erste-Hilfe-Leistung wird dokumentiert, zum Beispiel im Verbandbuch, und die Dokumentation fünf Jahre lang vertraulich aufbewahrt (§ 24 Abs. 6 DGUV
    Vorschrift 1). Ersthelfer sind eine eigene Pflicht.'
  en: 'You make sure that help can be called immediately in an accident and that first aid is given (§ 24 DGUV Regulation 1, § 10 ArbSchG): first-aid supplies in sufficient quantity, easy to reach and marked
    – the type and number of first-aid kits depend on the number of employees and the hazard (§ 25 DGUV Regulation 1, ASR A4.3). A notice states the emergency number, first aiders and what to do in an accident
    (§ 24(5) DGUV Regulation 1). All first aid given is documented, for example in the first-aid log, and the documentation is kept confidential for five years (§ 24(6) DGUV Regulation 1). First aiders
    are a separate obligation.'
- de: Du stellst jemanden ein – maßgeblich ist bei Jugendlichen die Aufnahme der ersten Beschäftigung.
  en: You hire someone – for young people, what counts is the start of their first employment.
- de: Du stellst jemanden ein.
  en: You are hiring someone.
- de: Du und deine Mitgesellschafter; Bank
  en: You and your co-shareholders; bank
- de: Du und die Gesellschafter; Finanzamt (E-Bilanz)
  en: You and the shareholders; tax office (Finanzamt) (E-Bilanz)
- de: Du verarbeitest Daten von Beschäftigten.
  en: You process employee data.
- de: Du verarbeitest Daten über Menschen (z. B. Kunden oder Beschäftigte).
  en: You process data about people (e.g. customers or employees).
- de: Du verarbeitest Gesundheitsdaten.
  en: You process health data.
- de: Du verkaufst Batterien oder Geräte mit Batterien.
  en: You sell batteries or devices with batteries.
- de: Du verkaufst Elektrogeräte.
  en: You sell electrical devices.
- de: Du verkaufst Kosmetik.
  en: You sell cosmetics.
- de: Du verkaufst Waren.
  en: You sell goods.
- de: Du verkaufst an Unternehmen.
  en: You sell to businesses.
- de: Du verkaufst an Verbraucher.
  en: You sell to consumers.
- de: Du verkaufst über Online-Marktplätze.
  en: You sell via online marketplaces.
- de: Du verkaufst über einen Onlineshop oder eine App.
  en: You sell via an online shop or an app.
- de: Du zahlst Gewerbesteuer.
  en: You pay trade tax (Gewerbesteuer).
- de: Du zahlst allen Beschäftigten mindestens den gesetzlichen Mindestlohn.
  en: You pay all employees at least the statutory minimum wage.
- de: Du zeichnest die Arbeitszeit deiner Beschäftigten auf.
  en: You record your employees' working hours.
- de: E-Bilanz
  en: E-Bilanz
- de: E-Bilanz ans Finanzamt übermitteln
  en: Submit the E-Bilanz to the tax office
- de: E-Rechnung
  en: E-invoice
- de: E-Rechnungen empfangen können
  en: Be able to receive e-invoices
- de: E-Rechnungen versenden (ab 2027)
  en: Send e-invoices (from 2027)
- de: E-Rechnungen versenden (ab 2028)
  en: Send e-invoices (from 2028)
- de: E-Rechnungs-Versandpflicht ab 2027 – Grenze Vorjahresumsatz
  en: E-invoice sending obligation from 2027 – previous year's revenue limit
- de: ELSTER (Finanzverwaltung)
  en: ELSTER (tax administration)
- de: ELSTER-Konto beantragen
  en: Apply for an ELSTER account
- de: Eigenkontrollen nach HACCP
  en: Self-monitoring (HACCP)
- de: Ein Dienstleister verarbeitet Daten in deinem Auftrag und nach deinen Weisungen.
  en: A service provider processes data on your behalf and according to your instructions.
- de: Ein Jahr nach Aufnahme der ersten Beschäftigung lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen – nach neun Monaten erinnerst du sie daran.
  en: One year after the start of their first employment, you have young people show you the certificate of the first follow-up examination – after nine months you remind them.
- de: Ein Jahr nach Aufnahme der ersten Beschäftigung lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen; die Untersuchung darf höchstens drei Monate zurückliegen (§
    33 Abs. 1 JArbSchG). Neun Monate nach Beginn weist du die jugendliche Person nachdrücklich auf den Termin hin und forderst sie auf, die Nachuntersuchung machen zu lassen (§ 33 Abs. 1 Satz 2 JArbSchG).
    Liegt die Bescheinigung 14 Monate nach Aufnahme der ersten Beschäftigung nicht vor, darfst du die Person nicht weiter beschäftigen (§ 33 Abs. 3 JArbSchG). Amtlos rechnet ab der Einstellung und erinnert
    drei Monate vor dem Termin – hat die Person schon vorher anderswo gearbeitet, zählt der Beginn dieser ersten Beschäftigung. Wechselt sie aus einem anderen Betrieb zu dir, genügt die dort vorgelegte
    Bescheinigung. Die Erstuntersuchung vor Beginn ist eine eigene Pflicht. Ein Gesetzesantrag (BR-Drs. 735/25) will die Untersuchungen ändern; er ist nicht in Kraft.
  en: One year after the start of their first employment, you have young people show you the certificate of the first follow-up examination; the examination may be no more than three months old (§ 33(1)
    JArbSchG). Nine months after the start, you emphatically point out the deadline to the young person and ask them to have the follow-up examination done (§ 33(1) sentence 2 JArbSchG). If the certificate
    is not available 14 months after the start of the first employment, you may not continue to employ the person (§ 33(3) JArbSchG). Amtlos counts from the hiring and reminds you three months before the
    deadline – if the person already worked elsewhere before, the start of that first employment counts. If they move to you from another business, the certificate presented there is sufficient. The initial
    examination before the start is a separate obligation. A legislative proposal (BR-Drs. 735/25) wants to change the examinations; it is not in force.
- de: Ein Jahr nach jeder Unterweisung erinnert Amtlos an die Wiederholung. Mit der neuen Unterweisung ist die alte erledigt. Hast du deine letzte Unterweisung noch nicht in Amtlos erfasst, erfasse sie – dann kennt Amtlos den nächsten Termin.
  en: One year after each safety briefing, Amtlos reminds you to repeat it. The new safety briefing completes the old one. If you have not yet recorded your last safety briefing in Amtlos, record it – then Amtlos knows the next date.
- de: Ein Jugendlicher, der in das Berufsleben eintritt, darf nur beschäftigt werden, wenn er innerhalb der letzten 14 Monate vor Beginn von einer Ärztin oder einem Arzt untersucht worden ist und dir die
    Bescheinigung darüber vorliegt (§ 32 Abs. 1 JArbSchG). Die Untersuchung ist für die Jugendlichen kostenlos; den Berechtigungsschein gibt es bei der Gemeinde. Amtlos legt die Aufgabe bei jeder Einstellung
    an, solange du Jugendliche beschäftigst – betrifft die Einstellung eine erwachsene Person oder war die jugendliche Person schon vorher beschäftigt, trifft sie nicht zu. Die erste Nachuntersuchung nach
    einem Jahr ist eine eigene Pflicht.
  en: A young person entering working life may only be employed if they have been examined by a doctor within the last 14 months before the start and you have the certificate (§ 32(1) JArbSchG). The examination
    is free of charge for the young person; the entitlement voucher is available from the municipality. Amtlos creates the task for every hiring while you employ young people – if the hiring concerns an
    adult or the young person was already employed before, it does not apply. The first follow-up examination after one year is a separate obligation.
- de: Ein Prozentsatz, den jede Gemeinde selbst festlegt und der die Höhe der Gewerbesteuer bestimmt.
  en: A percentage that each municipality sets itself and that determines the amount of trade tax.
- de: Ein Vorgang, bei dem du Daten über Menschen nutzt, z. B. Kundenverwaltung oder Lohnabrechnung.
  en: An activity in which you use data about people, e.g. customer management or payroll.
- de: 'Ein eigenes Bußgeld für die verspätete Aufstellung nennt das Gesetz nicht. Wer die Bilanz nicht in der vorgeschriebenen Zeit aufstellt, macht sich strafbar, wenn die Gesellschaft später ihre Zahlungen einstellt oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird: Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe, bei Fahrlässigkeit bis zu einem Jahr (§ 283b Abs. 1 Nr. 3 Buchst. b, Abs. 2, 3 StGB in Verbindung mit § 283 Abs. 6 StGB).'
  en: 'The law provides no separate fine for late preparation. Anyone who does not prepare the balance sheet within the prescribed time commits a criminal offence if the company later stops payments or insolvency proceedings are opened or rejected for lack of assets: imprisonment of up to two years or a fine, in case of negligence up to one year (§ 283b(1) no. 3 letter b, (2), (3) StGB in conjunction with § 283(6) StGB).'
- de: Eine Beschäftigte hat dir ihre Schwangerschaft mitgeteilt.
  en: An employee has told you she is pregnant.
- de: Eine Beschäftigung endet.
  en: An employment ends.
- de: Eine Rechnung als strukturierter Datensatz, den Software automatisch lesen kann.
  en: An invoice as a structured data record that software can read automatically.
- de: Eine UG muss jedes Jahr ein Viertel ihres Jahresüberschusses in eine Rücklage stellen.
  en: A UG must put a quarter of its annual net profit into a reserve every year.
- de: Eine Vergütung unter der Mindestausbildungsvergütung ist unwirksam; Auszubildende können die Differenz nachfordern (§ 17 Abs. 1, § 25 BBiG). Kein Bußgeld.
  en: Pay below the minimum training allowance is invalid; apprentices can claim the difference (§ 17(1), § 25 BBiG). No fine.
- de: Eine achtstellige Nummer, unter der dein Betrieb bei der Sozialversicherung geführt wird.
  en: An eight-digit number under which your business is registered with social security.
- de: Eine ausreichende Zahl von Beschäftigten machst du durch Unterweisung und Übung mit dem Löschen von Entstehungsbränden vertraut (§ 10 Abs. 2 ArbSchG, § 22 Abs. 2 DGUV Vorschrift 1). Nach ASR A2.2
    Abschnitt 7.3 ergibt sich die Zahl aus der Gefährdungsbeurteilung; ein Anteil von 5 Prozent der Beschäftigten reicht in der Regel. Mehr brauchst du bei erhöhter Brandgefährdung, vielen Personen oder
    großen Flächen; Schichtbetrieb, Urlaub und Krankheit planst du ein. Die Ausbildung besteht aus Theorie und einer praktischen Löschübung; empfohlen ist eine Auffrischung alle drei bis fünf Jahre (DGUV
    Information 205-023). In kleinen Betrieben bist oft du selbst die erste Brandschutzhelferin oder der erste Brandschutzhelfer.
  en: You familiarise a sufficient number of employees with fighting incipient fires through instruction and practice (§ 10(2) ArbSchG, § 22(2) DGUV Regulation 1). According to ASR A2.2 Section 7.3, the
    number follows from the risk assessment; a share of 5 per cent of employees is usually enough. You need more with increased fire risk, many people or large areas; you plan for shift work, holidays and
    illness. Training consists of theory and a practical fire-fighting exercise; a refresher every three to five years is recommended (DGUV Information 205-023). In small businesses you yourself are often
    the first fire safety assistant.
- de: Eine betroffene Person hat eine Anfrage gestellt.
  en: A data subject has made a request.
- de: Eine schriftliche Liste, welche Gefahren es bei der Arbeit gibt und wie du sie verringerst.
  en: A written list of the hazards at work and how you reduce them.
- de: Einkommensteuererklärung abgeben
  en: File your income tax return
- de: Einmal im Jahr ermittelst du deinen Gewinn mit der Anlage EÜR und übermittelst sie elektronisch.
  en: Once a year, you calculate your profit with the Anlage EÜR and submit it electronically.
- de: Einmal im Jahr gibst du elektronisch deine Einkommensteuererklärung ab.
  en: Once a year, you file your income tax return electronically.
- de: Einmal im Jahr gibst du elektronisch die Gewerbesteuererklärung ab.
  en: Once a year, you file the trade tax (Gewerbesteuer) return electronically.
- de: Einmal im Jahr gibst du elektronisch die Umsatzsteuer-Jahreserklärung ab.
  en: Once a year, you file the annual VAT return electronically.
- de: Einmal im Jahr gibst du für deine Gesellschaft elektronisch die Körperschaftsteuererklärung ab.
  en: Once a year, you file the corporate income tax (Körperschaftsteuer) return for your company electronically.
- de: Einnahmen-Überschuss-Rechnung (Anlage EÜR) abgeben
  en: Submit the cash-basis profit statement (Anlage EÜR)
- de: Einwilligung für Cookies und Tracking einholen
  en: Get consent for cookies and tracking
- de: Elektrische Geräte prüfen lassen
  en: Have electrical equipment inspected
- de: Elektrische Geräte und Anlagen lässt du regelmäßig prüfen (DGUV Vorschrift 3).
  en: You have electrical equipment and installations inspected regularly (DGUV Vorschrift 3).
- de: Elektrofachkraft
  en: Qualified electrician
- de: Elektrogeräte bei der stiftung ear registrieren
  en: Register electrical devices with stiftung ear
- de: Elektronische Arbeitsunfähigkeitsbescheinigung, die du bei der Krankenkasse abrufst.
  en: Electronic certificate of incapacity for work (sick note) that you retrieve from the health insurance fund.
- de: Elektronische Arbeitszeiterfassung (geplante Neuregelung)
  en: Electronic time recording (planned new rules)
- de: Elektronische Kasse beim Finanzamt melden
  en: Register your electronic cash register with the tax office
- de: Entgeltstruktur nach Geschlecht auswerten (mit Lohnbüro)
  en: Analyse the pay structure by gender (with your payroll office)
- de: Entscheidend ist das Gesamtbild der Tätigkeit. Die Deutsche Rentenversicherung prüft den Status auf Antrag.
  en: What matters is the overall picture of the activity. The German Pension Insurance (Deutsche Rentenversicherung) checks the status on application.
- de: Erfordern Lage, Ausdehnung oder Nutzung deiner Arbeitsstätte es, hängst du einen Flucht- und Rettungsplan aus und übst die Räumung.
  en: If the location, size or use of your workplace requires it, you post an escape and rescue plan and practise evacuation.
- de: Erhebliche Sicherheitsvorfälle meldest du dem BSI in festen Stufen und Fristen.
  en: You report significant security incidents to the BSI in fixed stages and deadlines.
- de: Erlaubnis für dein Gewerbe einholen
  en: Get a permit for your trade
- de: Erste Hilfe organisieren
  en: Organise first aid
- de: Ersthelfer bestimmen und fortbilden
  en: Appoint first aiders and keep their training up to date
- de: Ersthelfer zählen jetzt ab zwei anwesenden Personen (du selbst zählst mit); Verbandkasten und Verbandbuch sowie Brandschutzhelfer sind eigene Pflichten.
  en: First aiders now count from two people present (you count too); first-aid kit and first-aid log as well as fire safety assistants are separate obligations.
- de: Erwerbsschwelle für innergemeinschaftliche Erwerbe (Kleinunternehmer, nur steuerfreie Umsätze u. a.)
  en: Acquisition threshold for intra-Community acquisitions (small businesses, only tax-exempt sales, etc.)
- de: Es gab einen Arbeitsunfall – anzuzeigen ist er bei Tod oder mehr als drei Tagen Arbeitsunfähigkeit.
  en: There was an accident at work – it must be reported in case of death or more than three days of incapacity for work.
- de: Es gab einen Arbeitsunfall.
  en: There was a workplace accident.
- de: Expositionsverzeichnis bei krebserzeugenden Stoffen führen
  en: Keep an exposure register for carcinogenic substances
- de: Fachkraft für Arbeitssicherheit und Betriebsarzt
  en: Occupational safety specialist and company doctor
- de: Fehlt die Dokumentation oder ist sie unrichtig, unvollständig oder nicht rechtzeitig erstellt, droht direkt ein Bußgeld bis 5.000 € (§ 9 Abs. 1 Nr. 1 ArbStättV in Verbindung mit § 25 Abs. 1 Nr. 1
    ArbSchG; ebenso § 22 Abs. 1 Nr. 1, 6 BetrSichV); bei Gefahrstoffen bis 50.000 € (§ 22 Abs. 1 Nr. 1a GefStoffV in Verbindung mit § 26 Abs. 1 Nr. 8 Buchst. b, Abs. 3 ChemG). Bei Arbeitsunfällen besteht
    außerdem ein Haftungsrisiko.
  en: If the documentation is missing, incorrect, incomplete or not prepared on time, a fine of up to €5,000 may be imposed directly (§ 9(1) no. 1 ArbStättV in conjunction with § 25(1) no. 1 ArbSchG; likewise
    § 22(1) nos. 1, 6 BetrSichV); for hazardous substances up to €50,000 (§ 22(1) no. 1a GefStoffV in conjunction with § 26(1) no. 8 letter b, (3) ChemG). In the event of accidents at work there is also
    a liability risk.
- de: Finanzamt
  en: Tax office (Finanzamt)
- de: Flucht- und Rettungsplan prüfen
  en: Check the escape and rescue plan
- de: Fragebogen zur steuerlichen Erfassung abgeben
  en: Submit the tax registration questionnaire
- de: Fragt jemand nach seinen Daten oder verlangt Löschung, antwortest du innerhalb eines Monats.
  en: If someone asks about their data or requests deletion, you respond within one month.
- de: Freier Beruf
  en: Liberal profession (freier Beruf)
- de: Freistellungsbescheinigung für Bauleistungen beantragen
  en: Apply for an exemption certificate for construction work
- de: Fällig sind die Beiträge am drittletzten Bankarbeitstag des laufenden Monats. Das Lohnprogramm berechnet sie; die Krankenkassen ziehen sie in der Regel ein. Das gilt auch für die Beiträge an die Minijob-Zentrale.
  en: The contributions are due on the third-to-last bank working day of the current month. The payroll software calculates them; the health insurance funds usually collect them by direct debit. This also
    applies to contributions to the Minijob-Zentrale.
- de: Fördergeber (z. B. BMWE, KfW, Länder)
  en: Funding bodies (e.g. BMWE, KfW, federal states)
- de: Förderprogramme prüfen (Option)
  en: Check funding programmes (optional)
- de: Für Auszubildende gilt nicht der gesetzliche Mindestlohn (§ 22 Abs. 3 MiLoG), sondern eine angemessene Vergütung, mindestens die Mindestausbildungsvergütung nach § 17 BBiG. Sie steigt mit jedem Ausbildungsjahr
    und wird jährlich angepasst. Gilt für dich ein Tarifvertrag, geht dessen Vergütung vor (§ 17 Abs. 3, 4 BBiG). Amtlos kennt die Beträge noch nicht – frag deine Kammer.
  en: Apprentices are not covered by the statutory minimum wage (§ 22(3) MiLoG) but by an appropriate allowance, at least the minimum training allowance under § 17 BBiG. It rises with each year of training
    and is adjusted annually. If a collective agreement applies to you, its pay takes precedence (§ 17(3), (4) BBiG). Amtlos does not know the amounts yet – ask your chamber.
- de: Für Beschäftigte zahlst du Umlagen (U1, U2, U3) und rufst Arbeitsunfähigkeitsbescheinigungen elektronisch ab.
  en: For employees, you pay levies (U1, U2, U3) and retrieve sick notes electronically.
- de: Für Jugendliche gelten Erstuntersuchung, Arbeitszeitgrenzen und eine Aushangpflicht.
  en: For young people, an initial medical examination, working time limits and a notice posting obligation apply.
- de: Für Mitarbeiterbeteiligungen gibt es steuerliche Sonderregeln (§ 19a EStG) und virtuelle Modelle (VSOP). Amtlos erklärt die Modelle; Vorlagen folgen mit dem Dokumentengenerator.
  en: For employee participation, there are special tax rules (§ 19a EStG) and virtual models (VSOP). Amtlos explains the models; templates will follow with the document generator.
- de: Für Jugendliche gilt ein kürzerer Abstand als die jährliche Unterweisung der übrigen Beschäftigten. Vor Beginn der Beschäftigung und bei wesentlichen Änderungen unterweist du sie über die Gefahren
    und die Schutzmaßnahmen; danach wiederholst du die Unterweisung mindestens halbjährlich (§ 29 JArbSchG). Die Frist läuft für jede jugendliche Person ab ihrer letzten Unterweisung. Amtlos erinnert sechs
    Monate nach der letzten Unterweisung, die du in Amtlos erfasst – unterweist du Jugendliche einzeln, erfasse jede Unterweisung.
  en: For young people, a shorter interval applies than the annual instruction of other employees. Before employment begins and when there are significant changes, you instruct them about the hazards and
    the protective measures; after that you repeat the instruction at least every six months (§ 29 JArbSchG). The deadline runs for each young person from their last instruction. Amtlos reminds you six
    months after the last instruction you record in Amtlos – if you instruct young people individually, record each instruction.
- de: 'Für Mitarbeiterbeteiligungen gibt es steuerliche Sonderregeln: Bei Anteilen an jungen Unternehmen kann die Besteuerung des geldwerten Vorteils aufgeschoben werden (§ 19a EStG). Eine schuldrechtliche
    Alternative ohne echte Anteile sind virtuelle Modelle (VSOP). Amtlos erklärt die Modelle; Vorlagen folgen mit dem Dokumentengenerator.'
  en: 'For employee participation, there are special tax rules: for shares in young companies, taxation of the non-cash benefit can be deferred (§ 19a EStG). A contractual alternative without real shares
    are virtual models (VSOP). Amtlos explains the models; templates will follow with the document generator.'
- de: Für Tätigkeiten mit Feuchtarbeit oder hautbelastenden Stoffen legst du in einem Hautschutzplan Schutz, Reinigung und Pflege fest.
  en: For work involving wet work or substances that stress the skin, you set out protection, cleaning and care in a skin protection plan.
- de: Für bestimmte Produkte (z. B. Computer, Smartphones, E-Book-Reader) gelten Barrierefreiheitsanforderungen – die Kleinstunternehmen-Ausnahme gilt dafür nicht verlässlich.
  en: Accessibility requirements apply to certain products (e.g. computers, smartphones, e-book readers) – the micro-enterprise exemption does not reliably apply to them.
- de: Für deine Werkleistungen haftest du für Mängel. Dokumentiere Abnahmen und behalte die Fristen im Blick.
  en: You are liable for defects in your work. Document acceptances and keep the deadlines in mind.
- de: 'Für die Pflichten der ausführenden Firma nach § 5 BaustellV gibt es kein eigenes Bußgeld – § 7 BaustellV erfasst nur Vorankündigung und SiGe-Plan des Bauherrn. Die Aufsicht kann Maßnahmen anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
  en: 'There is no separate fine for the duties of the executing company under § 5 BaustellV – § 7 BaustellV only covers the client''s advance notice and health and safety plan. The authority can order measures; a breach of the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG).'
- de: Für eine UG oder GmbH lässt du den Gesellschaftsvertrag notariell beurkunden – auch online möglich.
  en: For a UG or GmbH, you have the articles of association (Gesellschaftsvertrag) notarised – this is also possible online.
- de: Für jede neue beschäftigte Person hältst du die wesentlichen Arbeitsbedingungen schriftlich oder in Textform fest – in den Branchen nach dem Schwarzarbeitsbekämpfungsgesetz, seit 30.12.2025 auch im
    Friseur- und Kosmetikgewerbe, bleibt es bei der Schriftform.
  en: For every new employee, you record the essential working conditions in writing or in text form – in the sectors under the Act to Combat Undeclared Work, since 30.12.2025 also in hairdressing and beauty,
    the written form remains required.
- de: Gefahrstoffverzeichnis und Betriebsanweisungen
  en: Hazardous substances register and operating instructions
- de: Gefährdungsbeurteilung
  en: Risk assessment
- de: Gefährdungsbeurteilung erstellen
  en: Create a risk assessment
- de: Gegenüber Verbrauchern gibst du Gesamtpreise an, bei Waren nach Gewicht, Volumen oder Länge auch den Grundpreis.
  en: To consumers, you state total prices, and for goods sold by weight, volume or length also the unit price.
- de: Geldwäschegesetz bei hohen Bargeschäften
  en: Anti-Money Laundering Act for large cash transactions
- de: Geldwäschegesetz für Immobilien- und Finanzbranche
  en: Anti-Money Laundering Act for real estate and finance
- de: Gemeinde (Steueramt)
  en: Municipality (tax office, Steueramt)
- de: Gemeinde (als Straßenbaubehörde); auf Märkten der Veranstalter
  en: Municipality (as road authority); at markets the organiser
- de: Geplant ist eine Pflicht zur elektronischen Arbeitszeiterfassung, mit Übergangsfristen nach Betriebsgröße.
  en: An obligation to record working time electronically is planned, with transition periods depending on company size.
- de: 'Geschäftsführer, die die Liste nicht einreichen, haften denjenigen, deren Beteiligung sich geändert hat, und den Gläubigern der Gesellschaft für den daraus entstandenen Schaden als Gesamtschuldner (§ 40 Abs. 3 GmbHG).'
  en: 'Managing directors who do not file the list are jointly and severally liable for the resulting damage to those whose shareholding has changed and to the company''s creditors (§ 40(3) GmbHG).'
- de: Gesellschaften müssen ihre wirtschaftlich Berechtigten dem Transparenzregister mitteilen und die Angaben bei Änderungen aktualisieren. Das gilt für UG und GmbH ebenso wie für eingetragene Personengesellschaften,
    also auch für OHG, KG, GmbH & Co. KG und Partnerschaftsgesellschaft (§ 20 Abs. 1 GwG) – seit 2024 auch für eine GbR, die sich ins Gesellschaftsregister eintragen lässt (eGbR). Die Mitteilung machst
    du unverzüglich nach der Eintragung und nach jeder Änderung (§ 20 Abs. 1 GwG).
  en: Companies must report their beneficial owners to the transparency register and update the details when they change. This applies to UG and GmbH as well as to registered partnerships, including the
    OHG, KG, GmbH & Co. KG and partnership company (§ 20(1) GwG) – since 2024 also to a GbR entered in the company register (eGbR). You make the report without delay after registration and after every change
    (§ 20(1) GwG).
- de: Gesellschafterliste aktualisieren
  en: Update the list of shareholders
- de: Gesellschaftsvertrag beim Notar beurkunden
  en: Have the articles of association notarised
- de: Gesetzlicher Mindestlohn je Stunde
  en: Statutory minimum wage per hour
- de: Gesundheits- und Pflegeberufe brauchen je nach Tätigkeit eine Approbation, Erlaubnis oder Zulassung.
  en: Depending on the activity, health and care professions need a licence to practise (Approbation), a permit or an approval.
- de: Gesundheitsamt bzw. zuständige Kammer oder Behörde
  en: Public health office (Gesundheitsamt) or the competent chamber or authority
- de: Getränkeschankanlage und Flüssiggasanlage prüfen lassen
  en: Have beverage dispensing systems and liquefied gas systems inspected
- de: 'Getränkeschankanlagen arbeiten mit Kohlendioxid unter Druck; Gasflasche, Druckminderer und Leitungen sind Arbeitsmittel nach der Betriebssicherheitsverordnung. Art und Umfang der Prüfungen und die
    Fristen der wiederkehrenden Prüfungen legst du in der Gefährdungsbeurteilung fest (§ 3 Abs. 6 BetrSichV) und lässt die Prüfungen von einer befähigten Person durchführen (§ 14 BetrSichV); Anhaltspunkte
    für die Fristen geben die DGUV Regel 110-007 (Getränkeschankanlagen) und die DGUV Vorschrift 79 (Flüssiggas). Ausströmendes CO2 kann in Kellern und engen Räumen zu Erstickung führen: In Räumen, in denen
    CO2-Flaschen stehen, siehst du nach der Gefährdungsbeurteilung eine CO2-Warneinrichtung vor und lässt auch sie regelmäßig prüfen; die Flaschen sicherst du gegen Umfallen. Für Flüssiggas, etwa am Gasgrill,
    Wok-Herd oder im Foodtruck, gilt die DGUV Vorschrift 79: Prüfung vor der ersten Inbetriebnahme und wiederkehrend durch einen Sachkundigen, mit Prüfbescheinigung. Die DGUV empfiehlt inzwischen, die DGUV
    Vorschrift 79 zurückzuziehen, und verweist auf die DGUV Regel 110-010 „Flüssiggas“ – ob die Vorschrift bei deiner Berufsgenossenschaft noch gilt, erfährst du dort.'
  en: 'Beverage dispensing systems work with pressurised carbon dioxide; gas cylinder, pressure regulator and lines are work equipment under the Industrial Safety Ordinance. You set the type and scope of
    the inspections and the intervals of the recurring inspections in the risk assessment (§ 3(6) BetrSichV) and have the inspections carried out by a qualified person (§ 14 BetrSichV); DGUV Rule 110-007
    (beverage dispensing systems) and DGUV Regulation 79 (liquefied gas) give guidance on the intervals. Escaping CO2 can cause suffocation in cellars and confined spaces: in rooms where CO2 cylinders are
    kept, you provide a CO2 warning device according to the risk assessment and have it inspected regularly too; you secure the cylinders against falling over. For liquefied gas, for example on a gas grill,
    wok cooker or in a food truck, DGUV Regulation 79 applies: inspection before first commissioning and regularly by an expert (Sachkundiger), with an inspection certificate. The DGUV now recommends withdrawing
    DGUV Regulation 79 and refers to DGUV Rule 110-010 “Liquefied gas” – your BG can tell you whether the regulation still applies there.'
