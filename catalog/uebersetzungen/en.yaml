- de: '§ 12 ArbSchG ist nicht unmittelbar bußgeldbewehrt: Die Aufsicht kann die Unterweisung anordnen, ein Verstoß gegen die Anordnung kostet bis 30.000 € (§ 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG). Bei Gefahrstoffen, Biostoffen und Arbeitsmitteln ist die fehlende Unterweisung direkt bußgeldbewehrt: bei Gefahrstoffen bis 50.000 € (§ 22 Abs. 1 Nr. 25 GefStoffV in Verbindung mit § 26 Abs. 1 Nr. 8 Buchst. b, Abs. 3 ChemG), bei Biostoffen und Arbeitsmitteln bis 5.000 € (§ 20 Abs. 1 Nr. 23 BioStoffV, § 22 Abs. 1 Nr. 26 BetrSichV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG).'
  en: '§ 12 ArbSchG is not directly subject to fines: the authority can order the instruction, and a breach of the order costs up to €30,000 (§ 25(1) no. 2 letter a, (2) ArbSchG). For hazardous substances, biological agents and work equipment, missing instruction is directly subject to fines: for hazardous substances up to €50,000 (§ 22(1) no. 25 GefStoffV in conjunction with § 26(1) no. 8 letter b, (3) ChemG), for biological agents and work equipment up to €5,000 (§ 20(1) no. 23 BioStoffV, § 22(1) no. 26 BetrSichV in conjunction with § 25(1) no. 1, (2) ArbSchG).'
- de: '§ 26a UStG nennt kein eigenes Bußgeld dafür, E-Rechnungen nicht empfangen zu können.'
  en: '§ 26a UStG provides no separate fine for not being able to receive e-invoices.'
- de: '§ 26a UStG nennt kein eigenes Bußgeld für fehlende Pflichtangaben; wer eine Rechnung nicht oder nicht rechtzeitig ausstellt, riskiert bis 5.000 € (§ 26a Abs. 2 Nr. 1, Abs. 3 UStG). Weist du mehr Umsatzsteuer aus, als du schuldest, oder Steuer, obwohl du dazu nicht berechtigt bist, schuldest du den ausgewiesenen Betrag (§ 14c Abs. 1, 2 UStG). Dein Kunde braucht eine Rechnung nach § 14 UStG für den Vorsteuerabzug (§ 15 Abs. 1 Satz 1 Nr. 1 Satz 2 UStG).'
  en: '§ 26a UStG provides no separate fine for missing mandatory details; anyone who does not issue an invoice or does not issue it on time risks up to €5,000 (§ 26a(2) no. 1, (3) UStG). If you show more VAT than you owe, or show tax although you are not entitled to, you owe the amount shown (§ 14c(1), (2) UStG). Your customer needs an invoice under § 14 UStG for input tax deduction (§ 15(1) sentence 1 no. 1 sentence 2 UStG).'
- de: § 312k BGB verlangt eine einfache Kündigungsmöglichkeit über die Website für Dauerschuldverhältnisse, die online geschlossen werden können.
  en: § 312k BGB requires an easy way to cancel via the website for continuing obligations that can be concluded online.
- de: '§ 379 AO nennt die Mitteilung nach § 146a Abs. 4 AO nicht – ein eigenes Bußgeld ist dafür nicht vorgesehen. Das Finanzamt kann die Mitteilung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: '§ 379 AO does not cover the notification under § 146a(4) AO – no separate fine is provided for it. The tax office can enforce the notification with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: '§ 379 Abs. 2 Nr. 1 AO erfasst nur Mitteilungen nach § 138 Abs. 2 AO – für die Angaben zur steuerlichen Erfassung ist kein eigenes Bußgeld vorgesehen. Das Finanzamt kann sie mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: '§ 379(2) no. 1 AO only covers notifications under § 138(2) AO – no separate fine is provided for the information for tax registration. The tax office can enforce it with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: '§ 5b EStG nennt kein eigenes Bußgeld. Das Finanzamt kann die Übermittlung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: '§ 5b EStG provides no separate fine. The tax office can enforce the transmission with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: '§§ 5, 6 ArbSchG sind nicht unmittelbar bußgeldbewehrt: Die Aufsicht kann die nötigen Maßnahmen anordnen, ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG). Für die Dokumentation gelten außerdem die Bußgelder bei „Gefährdungsbeurteilung erstellen“.'
  en: '§§ 5, 6 ArbSchG are not directly subject to fines: the authority can order the necessary measures, and a breach of the enforceable order costs up to €30,000 (§ 22(3) sentence 1 no. 1, § 25(1) no. 2 letter a, (2) ArbSchG). For the documentation, the fines listed under “Create a risk assessment” also apply.'
- de: Änderungen im Gesellschafterkreis werden notariell abgewickelt; die aktualisierte Gesellschafterliste wird beim Handelsregister eingereicht.
  en: Changes among the shareholders are handled by a notary; the updated list of shareholders is filed with the commercial register (Handelsregister).
