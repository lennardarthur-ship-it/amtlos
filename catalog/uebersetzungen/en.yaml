- de: 'Im nicht privaten Bereich zahlst du für jede Betriebsstätte einen Rundfunkbeitrag, gestaffelt nach der Zahl der Beschäftigten: mit bis zu acht Beschäftigten ein Drittel des Beitrags, mit neun bis
    19 Beschäftigten einen ganzen Beitrag, mit mehr Beschäftigten entsprechend mehr (§ 5 Abs. 1 RBStV). Ein Arbeitsraum in deiner eigenen Wohnung ist frei, wenn für die Wohnung schon Rundfunkbeitrag gezahlt
    wird (§ 5 Abs. 5 Nr. 3 RBStV). Für betrieblich genutzte Kraftfahrzeuge zahlst du je Fahrzeug ein Drittel des Beitrags; je beitragspflichtiger Betriebsstätte ist ein Fahrzeug frei (§ 5 Abs. 2 Nr. 2 RBStV).
    Den Beginn, neue Betriebsstätten und Fahrzeuge sowie Änderungen meldest du dem Beitragsservice innerhalb eines Monats (§ 8 Abs. 1 RBStV). Vermietest du Hotel- oder Gästezimmer zur vorübergehenden Beherbergung,
    fällt dafür zusätzlich Rundfunkbeitrag an (§ 5 Abs. 2 Nr. 1 RBStV).'
  en: 'Outside the private sphere you pay a broadcasting fee for each business premises, graded by the number of employees: with up to eight employees a third of the fee, with nine to 19 employees one full
    fee, with more employees correspondingly more (§ 5(1) RBStV). A workroom in your own home is exempt if the broadcasting fee is already paid for the home (§ 5(5) no. 3 RBStV). For motor vehicles used
    for business you pay a third of the fee per vehicle; one vehicle per business premises liable to the fee is exempt (§ 5(2) no. 2 RBStV). You report the start, new premises and vehicles and any changes
    to the Beitragsservice within one month (§ 8(1) RBStV). If you let hotel or guest rooms for temporary accommodation, an additional broadcasting fee is due for them (§ 5(2) no. 1 RBStV).'
- de: Immobilienmakler und viele Finanzdienstleister sind Verpflichtete nach dem Geldwäschegesetz.
  en: Real estate agents and many financial service providers are obliged entities under the Anti-Money Laundering Act (Geldwäschegesetz).
- de: In Beauty- und Kosmetikbetrieben legst du in einem Hygieneplan fest, wie Geräte, Flächen und Hände gereinigt und desinfiziert werden.
  en: In beauty and cosmetics businesses, you set out in a hygiene plan how equipment, surfaces and hands are cleaned and disinfected.
- de: In Handwerk und Bau kommen krebserzeugende Stoffe wie Hartholzstaub, Dieselabgase oder Quarzstaub häufig vor.
  en: In the trades and construction, carcinogenic substances such as hardwood dust, diesel exhaust or quartz dust are common.
- de: In IT- und Agenturprojekten können Fehler teuer werden. Haftungsregeln in Verträgen und eine passende Versicherung begrenzen das Risiko.
  en: In IT and agency projects, mistakes can be expensive. Liability clauses in contracts and suitable insurance limit the risk.
- de: In deiner Arbeitsstätte stehen ausreichend Feuerlöscher bereit, die spätestens alle zwei Jahre von einer sachkundigen Person geprüft werden.
  en: Your workplace has enough fire extinguishers, which are inspected by a competent person at least every two years.
- de: In deiner Branche arbeitet ihr mit Maschinen oder Geräten, für die der Hersteller eine Gebrauchsanleitung mitliefert.
  en: In your sector you work with machines or devices for which the manufacturer supplies instructions for use.
- de: In deiner Branche arbeitet ihr oft beim Kunden oder zusammen mit anderen Firmen.
