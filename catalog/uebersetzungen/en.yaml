- de: Nach dem Plattformen-Steuertransparenzgesetz (DAC7) melden Plattformen bestimmte Verkäufer. Amtlos erklärt, was gemeldet wird.
  en: Under the Platform Tax Transparency Act (Plattformen-Steuertransparenzgesetz, DAC7), platforms report certain sellers. Amtlos explains what is reported.
- de: Nach jedem Geschäftsjahr erstellst du Bilanz und Gewinn- und Verlustrechnung; die Gesellschafter stellen den Abschluss fest.
  en: After each financial year, you prepare a balance sheet and profit and loss statement; the shareholders approve the financial statements.
- de: Nach § 25 TDDDG ist für das Speichern und Auslesen von Informationen auf dem Endgerät grundsätzlich eine Einwilligung nötig, außer es ist unbedingt erforderlich. Der Consent-Check deiner Website folgt
    mit dem Online-Check (Abschnitt 7).
  en: Under § 25 TDDDG, storing and reading information on a user's device generally requires consent unless it is strictly necessary. The consent check for your website will follow with the online check
    (section 7).
- de: Nach § 312j BGB kommt ohne eindeutige Beschriftung kein wirksamer Vertrag zustande.
  en: Under § 312j BGB, no valid contract is concluded without clear labelling.
- de: Noch keine Folge – eine Warnung, damit du rechtzeitig planen kannst.
  en: No consequence yet – a warning so you can plan in time.
- de: Noch keine – Pflichten gelten später.
  en: None yet; obligations apply later.
- de: Noch keine – geplante Regelung.
  en: None yet; planned rules.
- de: Noch keine – mögliche Änderung.
  en: None yet – possible change.
- de: Notarin oder Notar
  en: Notary
- de: Notarin oder Notar; Registergericht
  en: Notary; registry court (Registergericht)
- de: Ob eine Geschäftsführerin oder ein Geschäftsführer sozialversicherungspflichtig beschäftigt ist, hängt vom Einzelfall ab. Sicherheit schafft eine Statusfeststellung bei der Deutschen Rentenversicherung.
  en: Whether a managing director is employed subject to social security depends on the individual case. A status determination by the German Pension Insurance (Deutsche Rentenversicherung) provides certainty.
- de: Offenlegung
  en: Publication
- de: Ohne Anmeldezeitraum kann Amtlos keine Termine berechnen.
  en: Without the filing period, Amtlos cannot calculate any dates.
- de: Ohne Freistellungsbescheinigung müssen Auftraggeber einen Teil deiner Rechnung als Bauabzugsteuer einbehalten.
  en: Without an exemption certificate, clients must withhold part of your invoice as construction withholding tax.
- de: Ohne Konto kannst du den Fragebogen zur steuerlichen Erfassung nicht elektronisch übermitteln.
  en: Without an account, you cannot submit the tax registration questionnaire electronically.
- de: Ohne Verlängerung müssten Gründer im Gründungsjahr und im Folgejahr wieder monatlich Voranmeldungen abgeben.
  en: Without an extension, founders would again have to file advance returns monthly in the founding year and the following year.
- de: Ohne diese Einordnung bleibt offen, welche Anmeldungen du brauchst.
  en: Without this classification, it remains unclear which registrations you need.
- de: Ohne diese Klärung bleibt offen, ob Registrierung und Meldepflichten gelten.
  en: Without this clarification, it remains unclear whether registration and reporting obligations apply.
- de: Ohne geprüfte Software sind die Meldungen nicht möglich.
  en: Without certified software, the notifications are not possible.
- de: Personen mit ständiger automatisierter Verarbeitung, ab denen ein Datenschutzbeauftragter zu benennen ist
  en: Persons constantly involved in automated processing from which a data protection officer must be appointed
- de: Pflichten für Hochrisiko-KI (verschoben)
  en: Obligations for high-risk AI (postponed)
- de: Pflichten und Haftung der Geschäftsführung kennen
  en: Know the duties and liability of managing directors
- de: Preise richtig angeben
  en: State prices correctly
- de: 'Produktsicherheit (GPSR): Angaben und verantwortliche Person'
  en: 'Product safety (GPSR): information and responsible person'
- de: Prüfe in deinen Verträgen die Haftung und ob eine Berufs- oder Betriebshaftpflicht passt.
  en: Check the liability in your contracts and whether professional or business liability insurance is right for you.
- de: Prüfen, ob NIS2 für dich gilt
  en: Check whether NIS2 applies to you
- de: Prüfen, ob deine Produkte unter das BFSG fallen
  en: Check whether your products fall under the BFSG
- de: Prüfen, ob die Benennungspflicht nach Art. 37 DSGVO unabhängig davon besteht
  en: Check whether the obligation to appoint under Art. 37 GDPR applies regardless
- de: Prüfen, ob eine Datenschutz-Folgenabschätzung nötig ist
  en: Check whether a data protection impact assessment is needed
- de: Prüfen, ob eure KI-Produkte in einen Hochrisiko-Bereich fallen
  en: Check whether your AI products fall into a high-risk area
- de: Prüfen, welche Übergangsfrist für eure Betriebsgröße gelten würde
  en: Check which transition period would apply to your company size
- de: Rechnungen mit allen Pflichtangaben schreiben
  en: Write invoices with all mandatory details
- de: Regeln der Finanzverwaltung, wie Bücher und Belege elektronisch geführt und aufbewahrt werden.
  en: Rules of the tax authorities on how books and receipts are kept and stored electronically.
- de: Registergericht (über den Notar)
  en: Registry court (Registergericht) (via the notary)
- de: Rücklage der UG bilden
  en: Build up the UG reserve
- de: 'Rücklage der UG: Anteil am Jahresüberschuss'
  en: 'UG reserve: share of annual net profit'
