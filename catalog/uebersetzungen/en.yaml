- de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel (§ 152 Abs. 1 bis 3 AO). Er beträgt für jeden angefangenen Monat 0,25 % der festgesetzten Steuer abzüglich Vorauszahlungen und anzurechnender Steuerabzugsbeträge, mindestens 25 €, höchstens 25.000 € (§ 152 Abs. 5 Satz 2, Abs. 10 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: 'If you file the return late, the tax office can impose a late-filing surcharge (Verspätungszuschlag); if it is not filed within 14 months after the end of the calendar year, it must as a rule do so (§ 152(1) to (3) AO). For each month or part of a month it amounts to 0.25 % of the assessed tax less prepayments and creditable withheld taxes, at least €25, at most €25,000 (§ 152(5) sentence 2, (10) AO). The tax office can also enforce filing with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel. Er beträgt für jeden angefangenen Monat 25 €, höchstens 25.000 € (§ 152 Abs. 6, Abs. 10 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: 'If you file the return late, the tax office can impose a late-filing surcharge (Verspätungszuschlag); if it is not filed within 14 months after the end of the calendar year, it must as a rule do so. It amounts to €25 for each month or part of a month, at most €25,000 (§ 152(6), (10) AO). The tax office can also enforce filing with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: Gilt jetzt auch für Gastronomie, Gebäudereinigung, Praxen sowie Handwerk und Bau mit Gefahrstoffen.
