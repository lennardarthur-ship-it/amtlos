- de: Keine Sanktion für die Information selbst; Änderungen der Verhältnisse sind der Krankenkasse unverzüglich mitzuteilen (§ 206 Abs. 1 SGB V), Verstoß bis 2.500 € (§ 307 Abs. 1, 2 SGB V). Wer hauptberuflich
    selbstständig ist, verliert die Versicherungspflicht als Arbeitnehmer (§ 5 Abs. 5 SGB V) und muss sich freiwillig oder privat versichern.
  en: No sanction for the information itself; changes in your circumstances must be reported to the health insurer without delay (§ 206(1) SGB V), breaches up to €2,500 (§ 307(1), (2) SGB V). Anyone whose
    main occupation is self-employment loses compulsory insurance as an employee (§ 5(5) SGB V) and must take out voluntary or private insurance.
- de: "Keine eigene Bußgeldvorschrift (Art. 6 VO (EG) Nr. 852/2004 fehlt in der LMRStV). Die Lebensmittelüberwachung kann den Betrieb bis zur Registrierung beanstanden und Maßnahmen anordnen (§ 39 LFGB)."
  en: "No specific fine provision (Art. 6 Regulation (EC) No 852/2004 is not listed in the LMRStV). Food control can object to the business until it is registered and order measures (§ 39 LFGB)."
- de: "Keine eigene Bußgeldvorschrift (der Tatbestand fehlt in der LMRStV, die für VO (EG) Nr. 852/2004 nur Art. 4 mit Anhang I/II bewehrt). Die Lebensmittelüberwachung kann die nötigen Maßnahmen anordnen (§ 39 LFGB; Art. 138 VO (EU) 2017/625)."
  en: "No specific fine provision (the offence is not listed in the LMRStV, which for Regulation (EC) No 852/2004 only covers Art. 4 with Annexes I/II). Food control can order the necessary measures (§ 39 LFGB; Art. 138 Regulation (EU) 2017/625)."
- de: "Keine eigene Bußgeldvorschrift (der Tatbestand fehlt in der LMRStV, die für VO (EG) Nr. 852/2004 nur Art. 4 mit Anhang I/II bewehrt). Die Lebensmittelüberwachung kann die nötigen Maßnahmen anordnen (§ 39 LFGB; Art. 138 VO (EU) 2017/625). Hygienemängel nach Anhang II (z. B. Lagerung, Reinigung, Abfall) sind dagegen bußgeldbewehrt (§ 2 LMRStV i. V. m. § 60 Abs. 4 Nr. 2 Buchst. a LFGB)."
  en: "No specific fine provision (the offence is not listed in the LMRStV, which for Regulation (EC) No 852/2004 only covers Art. 4 with Annexes I/II). Food control can order the necessary measures (§ 39 LFGB; Art. 138 Regulation (EU) 2017/625). Hygiene deficiencies under Annex II (e.g. storage, cleaning, waste), on the other hand, are subject to fines (§ 2 LMRStV in conjunction with § 60(4) No. 2(a) LFGB)."
- de: "Keine eigene Bußgeldvorschrift gegenüber dem Betrieb. Die Pflicht zur Konformitätserklärung (Art. 16 VO (EG) Nr. 1935/2004, Art. 15 VO (EU) Nr. 10/2011) trifft den Lieferanten. Die Lebensmittelüberwachung fragt die Erklärungen aber bei Kontrollen ab und kann Maßnahmen anordnen (§ 39 LFGB)."
  en: "No specific fine provision for your business. The obligation to provide the declaration of compliance (Art. 16 Regulation (EC) No 1935/2004, Art. 15 Regulation (EU) No 10/2011) lies with the supplier. However, food control asks for the declarations during inspections and can order measures (§ 39 LFGB)."
