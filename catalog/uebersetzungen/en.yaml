  en: Monthly advance VAT return for new founders from 2027
- de: Mutterschutz in der Gefährdungsbeurteilung
  en: Maternity protection in the risk assessment
- de: Nach der Arbeitsstättenverordnung triffst du Vorkehrungen gegen Brände und lässt Löschgeräte regelmäßig auf ihre Funktionsfähigkeit prüfen (§ 4 Abs. 3 ArbStättV). Wie viele Feuerlöscher du brauchst,
    richtet sich nach Größe und Brandgefährdung der Räume (Technische Regel für Arbeitsstätten ASR A2.2). Die Feuerlöscher lässt du spätestens alle zwei Jahre von einer sachkundigen Person prüfen. Brandschutzhelfer
    unter deinen Beschäftigten sind eine eigene Pflicht.
  en: Under the Workplace Ordinance, you take precautions against fires and have extinguishing equipment checked regularly for functionality (§ 4(3) ArbStättV). How many fire extinguishers you need depends
    on the size and fire risk of the rooms (Technical Rule for Workplaces ASR A2.2). You have the fire extinguishers inspected by a competent person at least every two years. Fire safety assistants among
    your employees are a separate obligation.
- de: Nach der Rechtsprechung des Bundesarbeitsgerichts besteht bereits eine Pflicht zur Arbeitszeiterfassung. Eine bestimmte Form schreibt das BAG nicht vor – auch Papier reicht, wenn die Erfassung objektiv,
    verlässlich und zugänglich ist; die Aufzeichnung darfst du den Beschäftigten übertragen. Unabhängig davon verlangt das Arbeitszeitgesetz, die über acht Stunden hinausgehende Arbeitszeit an Werktagen
    und die Arbeit an Sonn- und Feiertagen aufzuzeichnen und diese Nachweise mindestens zwei Jahre aufzubewahren (§ 16 Abs. 2 ArbZG). Amtlos bietet eine Zeiterfassung, die auf die geplante Neuregelung vorbereitet
    ist.
  en: According to the case law of the Federal Labour Court, there is already an obligation to record working time. The court does not prescribe a particular form – paper is also fine if the recording is
    objective, reliable and accessible; you may delegate the recording to your employees. Independently of this, the Working Hours Act requires you to record working time exceeding eight hours on working
    days and work on Sundays and public holidays and to keep these records for at least two years (§ 16(2) ArbZG). Amtlos offers time recording that is prepared for the planned new rules.
- de: "Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Abgrenzung zu loser Ware erklärt; gilt jetzt auch für Onlinehändler, die selbst abgepackte Lebensmittel verkaufen."
  en: "After the expert review of food hygiene (22.10.2026): the distinction from non-prepacked food is explained; now also applies to online retailers who sell food they have packaged themselves."
- de: "Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Der Check fragt jetzt, ob du selbst backst oder frittierst. Dazu, was kleine Betriebe zeigen können müssen, und die Folgen bei Verstößen."
  en: "After the expert review of food hygiene (22.10.2026): the check now asks whether you bake yourself or deep-fry. Plus what small businesses must be able to show, and the consequences of breaches."
- de: "Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Die Folgen bei Verstößen sind jetzt erfasst. Die Eigenkontrollen bleiben eine laufende Pflicht – ein Kontrollprotokoll erledigt sie nur für seinen Monat."
  en: "After the expert review of food hygiene (22.10.2026): the consequences of breaches are now included. Self-checks remain an ongoing obligation – a check record only completes them for its month."
- de: "Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Die Schulung hältst du schriftlich fest; empfohlen ist eine Wiederholung einmal im Jahr – erledigt gilt sie jeweils für ein Kalenderjahr."
  en: "After the expert review of food hygiene (22.10.2026): you record the training in writing; repeating it once a year is recommended – it counts as done for one calendar year at a time."
- de: "Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Folgen ergänzt – die Pflicht zur Konformitätserklärung trifft den Lieferanten, die Lebensmittelüberwachung fragt sie aber ab."
  en: "After the expert review of food hygiene (22.10.2026): consequences added – the obligation to provide the declaration of compliance lies with the supplier, but food control asks for it."
- de: Nach jedem Geschäftsjahr erstellst du Bilanz und Gewinn- und Verlustrechnung; die Gesellschafter stellen den Abschluss fest.
  en: After each financial year, you prepare a balance sheet and profit and loss statement; the shareholders approve the financial statements.
- de: Nach jeder Veränderung in den Personen der Gesellschafter oder im Umfang ihrer Beteiligung reicht die Geschäftsführung unverzüglich nach Wirksamwerden der Veränderung eine aktualisierte Gesellschafterliste
    beim Handelsregister ein (§ 40 Abs. 1 S. 1 GmbHG). Hat ein Notar an der Veränderung mitgewirkt, reicht er die Liste ein (§ 40 Abs. 2 GmbHG).
  en: After every change in the persons of the shareholders or the extent of their shareholding, the managing directors file an updated list of shareholders with the commercial register without delay once
    the change takes effect (§ 40(1) sentence 1 GmbHG). If a notary was involved in the change, the notary files the list (§ 40(2) GmbHG).
- de: Nach § 25 TDDDG ist für das Speichern und Auslesen von Informationen auf dem Endgerät grundsätzlich eine Einwilligung nötig, außer es ist unbedingt erforderlich. Der Consent-Check deiner Website folgt
    mit dem Online-Check (Abschnitt 7).
  en: Under § 25 TDDDG, storing and reading information on a user's device generally requires consent unless it is strictly necessary. The consent check for your website will follow with the online check
    (section 7).
- de: Noch keine Folge – eine Warnung, damit du rechtzeitig planen kannst.
  en: No consequence yet – a warning so you can plan in time.
- de: Noch keine – Pflichten gelten später.
  en: None yet; obligations apply later.
- de: Noch keine – geplante Regelung.
  en: None yet; planned rules.
- de: Notarin oder Notar
  en: Notary
- de: Notarin oder Notar bzw. Geschäftsführung; Registergericht
  en: Notary or managing directors; registry court (Registergericht)
- de: Ob eine Geschäftsführerin oder ein Geschäftsführer sozialversicherungspflichtig beschäftigt ist, hängt vom Einzelfall ab. Für Selbstständigkeit spricht nach der Rechtsprechung des Bundessozialgerichts
    ein Anteil von mindestens 50 % oder eine Sperrminorität. Kläre den Status vor der ersten Entgeltabrechnung. Meldest du einen Gesellschafter-Geschäftsführer zur Sozialversicherung an, leitet die Einzugsstelle
    das Statusfeststellungsverfahren von Amts wegen ein (§ 7a Abs. 1 S. 2 SGB IV); Sicherheit schafft auch ein eigener Antrag bei der Deutschen Rentenversicherung.
  en: Whether a managing director is employed subject to social security depends on the individual case. According to the case law of the Federal Social Court, a shareholding of at least 50% or a blocking
    minority indicates self-employment. Clarify the status before the first payroll. If you register a shareholder managing director for social security, the collecting agency starts the status determination
    procedure ex officio (§ 7a(1) sentence 2 SGB IV); your own application to the German Pension Insurance (Deutsche Rentenversicherung) also provides certainty.
- de: 'Ob jemand selbstständig oder in Wahrheit beschäftigt ist, richtet sich nach der tatsächlichen Zusammenarbeit: Weisungen zu Zeit, Ort und Art der Arbeit, die Eingliederung in deinen Betrieb und fehlendes
    unternehmerisches Risiko sprechen für eine Beschäftigung (§ 7 Abs. 1 SGB IV). Den Antrag auf Statusfeststellung bei der Deutschen Rentenversicherung können beide Seiten stellen, also auch du als Auftraggeber
    (§ 7a Abs. 1 SGB IV) – seit 2022 auch als Prognoseentscheidung vor Beginn der Zusammenarbeit (§ 7a Abs. 4a SGB IV).'
  en: 'Whether someone is self-employed or in fact employed depends on how you actually work together: instructions on the time, place and type of work, integration into your business and no entrepreneurial
    risk indicate employment (§ 7(1) SGB IV). Either party can apply to the Deutsche Rentenversicherung for a status determination, including you as the client (§ 7a(1) SGB IV) – since 2022 also as a forecast
    decision before the cooperation starts (§ 7a(4a) SGB IV).'
- de: Offenlegung
  en: Publication
- de: Ohne Anmeldezeitraum kann Amtlos keine Termine berechnen.
  en: Without the filing period, Amtlos cannot calculate any dates.
- de: Ohne Bescheinigung darfst du die jugendliche Person nicht beschäftigen (§ 32 Abs. 1 JArbSchG); Verstöße kosten bis 30.000 € (§ 58 Abs. 1, 4 JArbSchG).
  en: Without the certificate you may not employ the young person (§ 32(1) JArbSchG); breaches cost up to €30,000 (§ 58(1), (4) JArbSchG).
- de: Ohne Konto kannst du den Fragebogen zur steuerlichen Erfassung nicht elektronisch übermitteln.
  en: Without an account, you cannot submit the tax registration questionnaire electronically.
- de: 'Ohne Nachweis der Einzahlung lehnt das Registergericht die Eintragung ab (§ 9c Abs. 1 GmbHG). Wer in der Anmeldung falsch versichert, dass die Einlagen geleistet sind, macht sich strafbar: Freiheitsstrafe
    bis zu drei Jahren oder Geldstrafe (§ 82 Abs. 1 Nr. 1 GmbHG). Vor der Eintragung besteht die Gesellschaft als solche nicht; wer in ihrem Namen handelt, haftet persönlich (§ 11 Abs. 1, 2 GmbHG).'
  en: 'Without proof of payment the registry court refuses the registration (§ 9c(1) GmbHG). Anyone who falsely declares in the registration that the contributions have been made commits a criminal offence:
    imprisonment of up to three years or a fine (§ 82(1) no. 1 GmbHG). Before registration the company does not exist as such; anyone who acts in its name is personally liable (§ 11(1), (2) GmbHG).'
- de: Ohne diese Einordnung bleibt offen, welche Anmeldungen du brauchst.
  en: Without this classification, it remains unclear which registrations you need.
- de: Ohne diese Klärung bleibt offen, ob Registrierung und Meldepflichten gelten.
  en: Without this clarification, it remains unclear whether registration and reporting obligations apply.
- de: 'Ohne gültige Freistellungsbescheinigung muss dein Auftraggeber 15 % der Gegenleistung einbehalten und für dich ans Finanzamt abführen, sofern die Gegenleistungen im Kalenderjahr 5.000 € (bei bestimmten Vermietern 15.000 €) übersteigen (§ 48 Abs. 1 Satz 1, Abs. 2 Satz 1 EStG).'
  en: 'Without a valid exemption certificate your client must withhold 15 % of the payment and pay it to the tax office on your behalf, if the payments in the calendar year exceed €5,000 (€15,000 for certain landlords) (§ 48(1) sentence 1, (2) sentence 1 EStG).'
- de: 'Ohne notarielle Beurkundung ist der Gesellschaftsvertrag nichtig (§ 2 Abs. 1 Satz 1 GmbHG, § 125 Satz 1 BGB). Die GmbH oder UG besteht vor der Eintragung als solche nicht; wer vorher in ihrem Namen handelt, haftet persönlich und solidarisch (§ 11 Abs. 1, 2 GmbHG).'
  en: 'Without notarisation the articles of association are void (§ 2(1) sentence 1 GmbHG, § 125 sentence 1 BGB). Before registration the GmbH or UG does not exist as such; anyone who acts in its name beforehand is personally and jointly liable (§ 11(1), (2) GmbHG).'
- de: 'Ordnungswidrig handelt, wer den Beginn der Beitragspflicht nicht fristgerecht anzeigt oder den Beitrag länger als sechs Monate nicht zahlt; verfolgt wird nur auf Antrag der Landesrundfunkanstalt (§ 12 Abs. 1 Nr. 1, 3, Abs. 3 RBStV). Eine Höhe nennt der Staatsvertrag nicht – dann gilt bis 1.000 € (§ 17 Abs. 1 OWiG).'
  en: 'It is an administrative offence not to report the start of the contribution obligation on time or not to pay the contribution for more than six months; it is only prosecuted at the request of the state broadcaster (§ 12(1) nos. 1, 3, (3) RBStV). The treaty sets no amount – then up to €1,000 applies (§ 17(1) OWiG).'
- de: Personen mit ständiger automatisierter Verarbeitung, ab denen ein Datenschutzbeauftragter zu benennen ist
  en: Persons constantly involved in automated processing from which a data protection officer must be appointed
- de: Pflichten und Haftung der Geschäftsführung kennen
  en: Know the duties and liability of managing directors
- de: 'Pflichtversichert sind zum Beispiel selbstständige Lehrerinnen und Erzieher, Pflegepersonen und Selbstständige, die auf Dauer und im Wesentlichen nur für einen Auftraggeber arbeiten – jeweils nur,
    wenn sie im Zusammenhang mit ihrer Tätigkeit regelmäßig keinen versicherungspflichtigen Arbeitnehmer beschäftigen (§ 2 S. 1 Nr. 1, 2 und 9 SGB VI); ein Minijobber zählt dabei mit, wenn er nicht von
    der Rentenversicherungspflicht befreit ist (§ 6 Abs. 1b SGB VI) –, außerdem Handwerker in der Handwerksrolle (§ 2 S. 1 Nr. 8 SGB VI). Yoga-, Fitness- und Personal Trainer gelten bei der Deutschen Rentenversicherung
    in der Regel als Lehrende. Versicherungsfrei bleibt, wessen Arbeitseinkommen regelmäßig höchstens 603 € im Monat beträgt (geringfügige selbstständige Tätigkeit, § 5 Abs. 2 SGB VI, § 8 Abs. 3 SGB IV;
    ab 2027: 633 €). Die Meldung an die Deutsche Rentenversicherung muss innerhalb von drei Monaten nach Aufnahme der Tätigkeit erfolgen (§ 190a SGB VI); danach zahlst du laufend Beiträge.'
  en: 'Compulsorily insured are, for example, self-employed teachers and educators, carers and self-employed people who work permanently and essentially for only one client – in each case only if they regularly
    employ no employee subject to insurance in connection with their activity (§ 2 sentence 1 nos. 1, 2 and 9 SGB VI); a mini-jobber counts if not exempted from compulsory pension insurance (§ 6(1b) SGB
    VI) – as well as craftspeople entered in the crafts register (§ 2 sentence 1 no. 8 SGB VI). Yoga, fitness and personal trainers are usually regarded as teachers by the Deutsche Rentenversicherung. Anyone
    whose earned income regularly does not exceed €603 a month remains exempt (minor self-employment, § 5(2) SGB VI, § 8(3) SGB IV; from 2027: €633). You must register with the Deutsche Rentenversicherung
    within three months of starting the activity (§ 190a SGB VI); after that you pay contributions on an ongoing basis.'
