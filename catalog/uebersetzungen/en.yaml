- de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel. Er beträgt für jeden angefangenen Monat 25 €, höchstens 25.000 € (§ 152 Abs. 6, Abs. 10 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  en: 'If you file the return late, the tax office can impose a late-filing surcharge (Verspätungszuschlag); if it is not filed within 14 months after the end of the calendar year, it must as a rule do so. It amounts to €25 for each month or part of a month, at most €25,000 (§ 152(6), (10) AO). The tax office can also enforce filing with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO).'
- de: Gilt jetzt auch für Gastronomie, Gebäudereinigung, Praxen sowie Handwerk und Bau mit Gefahrstoffen.
  en: Now also applies to hospitality, building cleaning, medical practices and to trades and construction with hazardous substances.
- de: Gilt jetzt für alle Betriebe mit Beschäftigten – auch Leitern, Tritte und Regale sind zu prüfen.
  en: Now applies to all businesses with employees – ladders, steps and racks must also be inspected.
- de: GmbH und UG bestehen vor der Eintragung als solche nicht; wer vorher in ihrem Namen handelt, haftet persönlich und solidarisch (§ 11 Abs. 1, 2 GmbHG). Die Erstanmeldung einer GmbH erzwingt das Registergericht
    nicht (§ 79 Abs. 2 GmbHG). Andere Anmeldepflichten, etwa der OHG, der KG, der GmbH & Co. KG oder der Partnerschaft, kann es mit Zwangsgeld bis 5.000 € durchsetzen (§ 14 HGB, § 5 Abs. 2 PartGG). Beginnt
    eine KG ihre Geschäfte vor der Eintragung, haftet jeder Kommanditist, der dem zugestimmt hat, für die bis zur Eintragung begründeten Verbindlichkeiten wie ein persönlich haftender Gesellschafter, es
    sei denn, dem Gläubiger war seine Beteiligung als Kommanditist bekannt (§ 176 Abs. 1 HGB).
  en: A GmbH or UG does not exist as such before registration; anyone who acts in its name beforehand is personally and jointly liable (§ 11(1), (2) GmbHG). The registry court does not enforce the initial
    registration of a GmbH (§ 79(2) GmbHG). Other registration duties, for example of an OHG, a KG, a GmbH & Co. KG or a partnership, it can enforce with a coercive fine of up to €5,000 (§ 14 HGB, § 5(2)
    PartGG). If a KG starts business before registration, every limited partner (Kommanditist) who agreed to this is liable for the obligations incurred until registration like a general partner, unless
    the creditor knew of their participation as a limited partner (§ 176(1) HGB).
- de: GmbH und UG meldet der Notar zum Handelsregister an. Zur Anmeldung gehört die Gesellschafterliste, und die Geschäftsführung versichert, dass die Einlagen geleistet sind (§§ 7, 8 GmbHG). Die OHG (§
    106 HGB), die KG und die GmbH & Co. KG (§ 106 HGB i. V. m. § 161 Abs. 2 HGB) meldest du ebenfalls über einen Notar zum Handelsregister an, die Partnerschaftsgesellschaft zum Partnerschaftsregister (§
    4 PartGG). Bei OHG, KG und GmbH & Co. KG bewirken sämtliche Gesellschafter die Anmeldung (§ 106 Abs. 7 HGB); bei KG und GmbH & Co. KG nennt sie auch die Kommanditisten und den Betrag der Einlage eines
    jeden von ihnen (§ 162 Abs. 1 HGB). Spätere Änderungen, etwa im Gesellschaftsvertrag oder bei der Geschäftsführung, werden ebenfalls angemeldet. Bis zur Eintragung haftet, wer im Namen der GmbH oder
    UG handelt, persönlich (§ 11 Abs. 2 GmbHG).
  en: The notary registers a GmbH or UG with the commercial register. The application includes the list of shareholders, and the managing directors confirm that the contributions have been made (§§ 7, 8
    GmbHG). You also register an OHG (§ 106 HGB), a KG and a GmbH & Co. KG (§ 106 HGB in conjunction with § 161(2) HGB) with the commercial register via a notary, and a partnership company with the partnership
    register (§ 4 PartGG). For an OHG, KG and GmbH & Co. KG, all partners make the application (§ 106(7) HGB); for a KG and GmbH & Co. KG it also names the limited partners (Kommanditisten) and the amount
    of each one's contribution (§ 162(1) HGB). Later changes, for example to the articles or the management, are registered as well. Until registration, anyone acting in the name of the GmbH or UG is personally
    liable (§ 11(2) GmbHG).
