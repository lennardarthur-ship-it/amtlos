- de: Mit der Selbstständigkeit kann sich deine Krankenversicherung ändern. Wer hauptberuflich selbstständig ist, kümmert sich selbst um seine Versicherung und die Beiträge.
  en: Becoming self-employed can change your health insurance. If self-employment is your main occupation, you take care of your own insurance and contributions.
- de: Mit dem selbstständigen Führen von Fahrzeugen beauftragst du nur Personen, die mindestens 18 Jahre alt, körperlich und geistig geeignet, im Führen des Fahrzeugs unterwiesen sind und ihre Befähigung
    nachgewiesen haben (§ 35 DGUV Vorschrift 70). Die Beauftragung schriftlich festzuhalten ist nicht vorgeschrieben, aber als Nachweis empfehlenswert. Unterweise sie zu Abfahrtkontrolle, Verhalten bei
    Pannen und Ladungssicherung. Die Ladung ist so zu verstauen und zu sichern, dass sie selbst bei Vollbremsung oder plötzlicher Ausweichbewegung nicht verrutscht, umfällt, hin- und herrollt oder herabfällt
    (§ 22 Abs. 1 StVO).
  en: You only assign the independent driving of vehicles to people who are at least 18 years old, physically and mentally suitable, instructed in driving the vehicle and have proven their competence (§
    35 DGUV Regulation 70). Recording the assignment in writing is not required but recommended as evidence. Instruct them on departure checks, what to do in case of a breakdown and load securing. The load
    must be stowed and secured so that it does not slip, fall over, roll back and forth or fall off even during emergency braking or a sudden evasive manoeuvre (§ 22(1) StVO).
- de: Mit der Selbstständigkeit kann sich deine Krankenversicherung ändern. Das betrifft dich als Person – als Einzelunternehmerin, Gesellschafter oder, je nach Status, als Geschäftsführerin einer GmbH.
    Wer hauptberuflich selbstständig ist, kümmert sich selbst um seine Versicherung und die Beiträge. Machst du dich im Nebenerwerb selbstständig, teilst du der Kasse den Umfang mit, damit sie prüfen kann,
    ob die Selbstständigkeit hauptberuflich ist. Änderungen der Verhältnisse teilst du unverzüglich mit (§ 206 Abs. 1 SGB V).
  en: Becoming self-employed can change your health insurance. This concerns you as a person – as a sole trader, partner or, depending on your status, managing director of a GmbH. If self-employment is
    your main occupation, you take care of your own insurance and contributions. If you become self-employed as a sideline, you tell your health insurer how much you work so that it can check whether self-employment
    is your main occupation. You report changes in your circumstances without delay (§ 206(1) SGB V).
- de: Mit der Steuerberatung klären, welcher Rhythmus ab 2027 gilt
  en: Clarify with your tax adviser which filing frequency applies from 2027
- de: Mit mehr als 10 Beschäftigten informierst du auf Website und in AGB, ob du an Streitbeilegungsverfahren teilnimmst.
  en: With more than 10 employees, you state on your website and in your terms and conditions (AGB) whether you take part in dispute resolution proceedings.
