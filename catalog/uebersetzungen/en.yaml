# Englische Übersetzungen der Katalogtexte (E-107).
# Schlüssel ist der deutsche Text: Ändert sich der deutsche Text, gilt die Übersetzung nicht mehr (Anzeige auf Deutsch).
# status: maschinell = mit KI übersetzt, sprachlich und fachlich ungeprüft; verbindlich ist immer der deutsche Text.
# Prüfen: scripts/uebersetzung_abdeckung.py zeigt fehlende und überzählige Einträge.
sprache: en
status: maschinell
eintraege:
- de: ARD ZDF Deutschlandradio Beitragsservice
  en: ARD ZDF Deutschlandradio Beitragsservice
- de: Ab 1.1.2028 gilt die Pflicht zum Versand strukturierter E-Rechnungen für alle Unternehmen im B2B-Geschäft, außer Kleinunternehmern nach § 19 UStG.
  en: From 1.1.2028, the obligation to send structured e-invoices applies to all businesses in B2B trade, except small businesses under § 19 UStG.
- de: Ab 20 Arbeitsplätzen zeigst du jedes Jahr bis 31.3. die Beschäftigung schwerbehinderter Menschen an und zahlst gegebenenfalls die Ausgleichsabgabe.
  en: If you have 20 or more workplaces, you report the employment of severely disabled persons every year by 31.3. and pay the compensatory levy (Ausgleichsabgabe) if applicable.
- de: Ab 50 Beschäftigten richtest du eine interne Meldestelle für Hinweisgeber ein.
  en: If you have 50 or more employees, you set up an internal reporting channel for whistleblowers.
- de: Ab dem 1. Januar 2028 schickst du an Unternehmen nur noch E-Rechnungen – Kleinunternehmer sind befreit.
  en: From 1 January 2028, you send only e-invoices to businesses – small businesses under the small business scheme are exempt.
- de: Ab dem Umsatz über der Grenze fällt Umsatzsteuer an, auch wenn du sie nicht berechnet hast.
  en: VAT is due from the sale above the limit, even if you have not charged it.
- de: Ab der ersten beschäftigten Person brauchst du eine sicherheitstechnische und betriebsärztliche Betreuung – als Regelbetreuung oder, in kleineren Betrieben, im Unternehmermodell deiner BG.
  en: From the first employee, you need occupational safety and occupational health support – as standard support or, in smaller businesses, through your BG's entrepreneur model (Unternehmermodell).
- de: Ab der ersten beschäftigten Person hältst du Verbandkasten, Notruf-Aushang und ein Verbandbuch bereit.
  en: From the first employee, you keep a first-aid kit, an emergency call notice and a first-aid log (Verbandbuch) ready.
- de: 'Ab der ersten beschäftigten Person verlangen das Arbeitssicherheitsgesetz und die DGUV Vorschrift 2 eine Betreuung durch eine Fachkraft für Arbeitssicherheit und einen Betriebsarzt. Du hast die Wahl:
    Regelbetreuung – bei bis zu 10 Beschäftigten nach Anlage 1 der DGUV Vorschrift 2 mit Grundbetreuung und anlassbezogener Betreuung, per Vertrag mit einer Fachkraft für Arbeitssicherheit und einem Betriebsarzt
    oder einem überbetrieblichen Dienst – oder, je nach BG, die alternative bedarfsorientierte Betreuung (Unternehmermodell, meist bis 50 Beschäftigte; die BGN etwa für mehr als 10 bis 50 Beschäftigte,
    darunter ein Kompetenzzentren-Modell). Im Unternehmermodell nimmst du selbst an Schulungen der BG teil und holst dir bei Bedarf anlassbezogen Fachleute dazu. Bist du noch nicht betreut, wähle die Regelbetreuung
    oder melde dich bei deiner BG zum Unternehmermodell an – bis dahin fehlt dir die fachliche Beratung zur Gefährdungsbeurteilung. Ein Gesetzesantrag (BR-Drs. 735/25) zur Schwelle von 50 Beschäftigten
    ist nicht in Kraft.'
  en: 'From the first employee, the Occupational Safety Act (ASiG) and DGUV Regulation 2 require support from an occupational safety specialist (Fachkraft für Arbeitssicherheit) and a company doctor. You
    have a choice: standard support – with up to 10 employees under Annex 1 of DGUV Regulation 2 with basic support and occasion-related support, by contract with an occupational safety specialist and a
    company doctor or an external service – or, depending on the BG, the alternative needs-based support (entrepreneur model, usually up to 50 employees; the BGN for example for more than 10 up to 50 employees,
    below that a competence-centre model). In the entrepreneur model you attend training courses of the BG yourself and call in experts when needed. If you are not yet supported, choose standard support
    or register with your BG for the entrepreneur model – until then you lack expert advice on the risk assessment. A legislative proposal (BR-Drs. 735/25) on a threshold of 50 employees is not in force.'
- de: Ab regelmäßig 50 Beschäftigten bestellst du Sicherheitsbeauftragte – ab 21 Beschäftigten schon dann, wenn die Gefährdungsbeurteilung eine besondere Gefährdung ergibt.
  en: From a regular 50 employees, you appoint safety officers (Sicherheitsbeauftragte) – from 21 employees already if the risk assessment shows a particular hazard.
- de: Agentur für Arbeit
  en: Employment agency (Agentur für Arbeit)
- de: Agentur für Arbeit / Integrationsamt
  en: Federal Employment Agency (Agentur für Arbeit) / Integration Office (Integrationsamt)
- de: Allergene kennzeichnen
  en: Label allergens
- de: Als Geschäftsführerin oder Geschäftsführer hast du besondere Pflichten und kannst persönlich haften.
  en: As a managing director (Geschäftsführer), you have special duties and can be personally liable.
- de: Als Gewerbetreibender bist du automatisch Mitglied der IHK oder Handwerkskammer und zahlst einen Beitrag nach deinem Ertrag.
  en: As a trader, you are automatically a member of the IHK or Chamber of Crafts and pay a fee based on your earnings.
- de: Als Kleinunternehmer darfst du bestimmte Umsatzgrenzen nicht überschreiten – sonst endet die Regelung.
  en: Under the small business scheme, you must not exceed certain revenue limits – otherwise the scheme ends.
- de: Anfrage einer betroffenen Person beantworten
  en: Respond to a request from a data subject
- de: Anlässe mit Fundstellen im Anhang der ArbMedVV, Vorsorgekartei und Fristen nach AMR 2.1 ergänzt.
  en: Occasions with references in the annex of the ArbMedVV, the preventive care file and intervals under AMR 2.1 added.
- de: Anmeldezeitraum der Lohnsteuer angeben
  en: Enter the payroll tax filing period
- de: Anzeige und Ausgleichsabgabe (Schwerbehinderte)
  en: Report and compensatory levy (severely disabled persons)
- de: Anzuzeigen ist ein Arbeitsunfall nur bei Tod oder mehr als drei Tagen Arbeitsunfähigkeit; das Verbandbuch ist jetzt eine eigene Pflicht.
  en: An accident at work only has to be reported in case of death or more than three days of incapacity for work; the first-aid log is now a separate obligation.
- de: Arbeiten Beschäftigte mehrerer Arbeitgeber an einem Arbeitsplatz, arbeiten die Arbeitgeber zusammen, unterrichten sich gegenseitig über die Gefahren und stimmen die Schutzmaßnahmen ab (§ 8 Abs. 1
    ArbSchG, § 6 DGUV Vorschrift 1). Ist es zur Vermeidung gegenseitiger Gefährdungen nötig, bestimmt ihr eine Person, die die Arbeiten aufeinander abstimmt. Arbeiten deine Leute in fremden Betrieben oder
    Wohnungen, lässt du dir die Gefahren vor Ort nennen und unterweist sie dazu (§ 8 Abs. 2 ArbSchG). Vergibst du selbst Aufträge an Fremdfirmen, gibst du ihnen die Sicherheitsanforderungen mit und hilfst
    bei deren Gefährdungsbeurteilung (§ 5 DGUV Vorschrift 1). Auf Baustellen kommen die Pflichten nach der Baustellenverordnung hinzu.
  en: If employees of several employers work at one workplace, the employers cooperate, inform each other about the hazards and coordinate the protective measures (§ 8(1) ArbSchG, § 6 DGUV Regulation 1).
    If necessary to avoid mutual hazards, you appoint a person who coordinates the work. If your staff work in other businesses or in homes, you have the hazards on site explained to you and instruct your
    staff about them (§ 8(2) ArbSchG). If you award contracts to external companies yourself, you pass on the safety requirements and help with their risk assessment (§ 5 DGUV Regulation 1). On construction
    sites, the obligations under the Construction Site Ordinance (BaustellV) apply in addition.
- de: Arbeiten Beschäftigte mit krebserzeugenden, erbgutverändernden oder fortpflanzungsgefährdenden Stoffen der Kategorie 1A oder 1B, führst du ein Expositionsverzeichnis.
  en: If employees work with carcinogenic, mutagenic or reprotoxic substances of category 1A or 1B, you keep an exposure register (Expositionsverzeichnis).
- de: Arbeiten deine Beschäftigten beim Kunden oder zusammen mit anderen Firmen, stimmst du die Schutzmaßnahmen ab und unterweist sie zu den Gefahren vor Ort.
  en: If your employees work at customers' premises or together with other companies, you coordinate the protective measures and instruct them about the hazards on site.
- de: Arbeitest du überwiegend für einen Auftraggeber und eingebunden wie Angestellte, droht Scheinselbstständigkeit. Ein Statusfeststellungsverfahren schafft Klarheit.
  en: If you work mainly for one client and are integrated like an employee, there is a risk of false self-employment (Scheinselbstständigkeit). A status determination procedure provides clarity.
- de: Arbeitgeber selbst; Kontrolle durch Berufsgenossenschaft und Gewerbeaufsicht
  en: The employer; checked by the employers' liability insurance association (Berufsgenossenschaft) and the trade supervisory authority (Gewerbeaufsicht)
- de: Arbeitsbedingungen schriftlich festhalten
  en: Record working conditions in writing
- de: Arbeitsmedizinische Vorsorge anbieten
  en: Offer occupational health check-ups
- de: Arbeitsplätze, ab denen die Beschäftigungsquote gilt
  en: Workplaces from which the employment quota applies
- de: Arbeitsschutz mit Auftraggebern und anderen Firmen abstimmen
  en: Coordinate occupational safety with clients and other companies
- de: Arbeitsunfall der Berufsgenossenschaft anzeigen
  en: Report a workplace accident to the employers' liability insurance association
- de: Arbeitszeit aufzeichnen
  en: Record working hours
- de: Arbeitszeit nach § 17 MiLoG aufzeichnen
  en: Record working hours under § 17 MiLoG
- de: 'Arbeitszeiten jetzt schon elektronisch erfassen (Amtlos: Personal → Arbeitszeiten)'
  en: 'Start recording working hours electronically now (Amtlos: Staff → Working hours)'
- de: Auch die Außerbetriebnahme einer elektronischen Kasse muss dem Finanzamt innerhalb eines Monats gemeldet werden.
  en: The decommissioning of an electronic cash register must also be reported to the tax office (Finanzamt) within one month.
- de: Auf Baustellen beachtest du als ausführende Firma die Hinweise des Koordinators und den Sicherheits- und Gesundheitsschutzplan; Vorankündigung, Plan und Koordinator sind Sache des Bauherrn.
  en: On construction sites, as the contractor you follow the coordinator's instructions and the safety and health protection plan; prior notice, plan and coordinator are matters for the client (Bauherr).
- de: Auf Online-Marktplätzen stellst du deine Händlerangaben vollständig bereit.
  en: On online marketplaces, you provide your full seller information.
- de: Auf deiner Website informierst du in einer Datenschutzerklärung über die Verarbeitung von Daten.
  en: On your website, you provide a privacy policy (Datenschutzerklärung) explaining how data is processed.
- de: Aufbewahrungsfrist für Buchungsbelege einschließlich Rechnungen
  en: Retention period for accounting vouchers including invoices
- de: Aufbewahrungsfrist für Handels- und Geschäftsbriefe
  en: Retention period for commercial and business letters
- de: Aufbewahrungsfrist für Jahresabschlüsse, Bücher und Organisationsunterlagen
  en: Retention period for annual financial statements, books and organisational documents
- de: Aufsichtsbehörde für Mutterschutz (je Land)
  en: Supervisory authority for maternity protection (per federal state)
- de: Auftragsverarbeitung
  en: Processing on behalf
- de: Auftragsverarbeitungsverträge abschließen
  en: Conclude data processing agreements
- de: Ausgenommen sind Kleinstunternehmen mit weniger als 10 Beschäftigten und höchstens 2 Mio. € Umsatz oder Bilanzsumme – diese Ausnahme gilt für Dienstleistungen. Der Online-Check macht automatisierte
    Basistests nach WCAG.
  en: Micro-enterprises with fewer than 10 employees and no more than €2 million in revenue or balance sheet total are exempt; this exemption applies to services. The online check runs automated basic tests
    based on WCAG.
- de: Aushangpflichtige Gesetze aushängen
  en: Post the laws that must be displayed
- de: Auslandszahlungen nach AWV melden
  en: Report foreign payments under the AWV
- de: Außerbetriebnahme einer Kasse melden
  en: Report decommissioning of a cash register
- de: BSI
  en: BSI
- de: Barrierefreiheit von Onlineshop und Buchungstools (BFSG)
  en: Accessibility of online shops and booking tools (BFSG)
- de: Batterien registrieren (BattDG)
  en: Register batteries (BattDG)
- de: Baubetriebe mit gewerblichen Beschäftigten nehmen an den Sozialkassenverfahren der Bauwirtschaft (SOKA-BAU) teil.
  en: Construction businesses with industrial employees take part in the social fund procedures of the construction industry (SOKA-BAU).
- de: Baustellenverordnung beachten
  en: Follow the Construction Site Ordinance (Baustellenverordnung)
- de: Beantrage frühzeitig ein ELSTER-Konto – die Aktivierung kommt per Post und dauert einige Tage.
  en: 'Apply for an ELSTER account early: the activation comes by post and takes a few days.'
- de: Bei Beteiligungen ausländischer Investoren an Unternehmen in sensiblen Sektoren kann der Staat die Investition prüfen. Amtlos gibt hier nur einen allgemeinen Hinweis.
  en: If foreign investors take stakes in companies in sensitive sectors, the state may review the investment. Amtlos only gives a general note here.
- de: Bei Verträgen mit Verbrauchern über Fernabsatz belehrst du über das Widerrufsrecht.
  en: For distance contracts with consumers, you inform them about the right of withdrawal.
- de: Bei Zahlungsunfähigkeit oder Überschuldung muss die Geschäftsführung rechtzeitig Insolvenz beantragen.
  en: In case of insolvency or over-indebtedness, the management must file for insolvency in good time.
- de: Bei der Berufsgenossenschaft anmelden
  en: Register with the employers' liability insurance association (BG)
- de: Bei der Lebensmittelüberwachung registrieren
  en: Register with the food control authority
- de: Bei dir arbeitet jemand regelmäßig nachts – in Wechselschicht oder an mindestens 48 Tagen im Jahr (Nachtarbeitnehmer, § 2 Abs. 5 ArbZG).
  en: Someone works for you regularly at night – in rotating shifts or on at least 48 days a year (night worker, § 2(5) ArbZG).
- de: Bei einem vom Kalenderjahr abweichenden Geschäftsjahr berechnet Amtlos den Termin noch nicht; die Frist beträgt zwölf Monate nach Ende des Geschäftsjahres.
  en: If your financial year differs from the calendar year, Amtlos does not calculate the date yet; the deadline is twelve months after the end of the financial year.
- de: Bei einer Datenpanne meldest du sie binnen 72 Stunden der Datenschutz-Aufsichtsbehörde.
  en: If there is a data breach, you report it to the data protection supervisory authority within 72 hours.
- de: Bei grenzüberschreitenden Zahlungen über der Meldegrenze – zum Beispiel Investorengeld aus dem Ausland – besteht eine Meldepflicht.
  en: For cross-border payments above the reporting threshold – for example investor money from abroad – there is a reporting obligation.
- de: Beim BSI registrieren (NIS2)
  en: Register with the BSI (NIS2)
- de: Beitragsnachweis übermitteln
  en: Submit the contribution statement
- de: Belege und Rechnungen monatlich vollständig halten
  en: Keep receipts and invoices complete every month
- de: Bericht zur Entgelttransparenz (geplant)
  en: Pay transparency report (planned)
- de: Berufserlaubnis und Zulassung
  en: Professional licence and approval
- de: Berufsgenossenschaft
  en: Employers' liability insurance association (Berufsgenossenschaft)
- de: Berufsgenossenschaft; Betreuungsdienst
  en: Employers' liability insurance association (BG); occupational health and safety service
- de: Beschäftigte bei der Sozialversicherung abmelden
  en: Deregister employees from social security
- de: Beschäftigte bei der Sozialversicherung anmelden
  en: Register employees for social security
- de: Beschäftigte über die geplante Pflicht informieren
  en: Inform employees about the planned obligation
- de: Beschäftigte, ab denen die Berichtspflicht zur Entgelttransparenz geplant ist
  en: Employees from which the pay transparency reporting obligation is planned
- de: Beschäftigte, ab denen die Kleinstunternehmen-Ausnahme des BFSG nicht mehr gilt
  en: Employees from which the BFSG micro-enterprise exemption no longer applies
- de: Beschäftigte, ab denen eine interne Meldestelle Pflicht ist
  en: Employees from which an internal reporting channel is an obligation
- de: Beschäftigte, ab deren Überschreiten die Hinweispflicht nach § 36 VSBG gilt
  en: Employees above which the information obligation under § 36 VSBG applies
- de: Beschäftigtendaten schützen
  en: Protect employee data
- de: Bestellbutton eindeutig beschriften (Button-Lösung)
  en: Label the order button clearly (button solution)
- de: Betreibst du eine Schankanlage mit CO2-Flasche oder eine Flüssiggasanlage, lässt du sie vor der Inbetriebnahme und danach regelmäßig von einer befähigten Person prüfen.
  en: If you operate a beverage dispensing system with a CO2 cylinder or a liquefied gas system, you have it inspected by a qualified person before commissioning and regularly afterwards.
- de: Betreuungsformen (Regelbetreuung, Unternehmermodell) erklärt; Folgen ergänzt.
  en: Forms of support (standard support, entrepreneur model) explained; consequences added.
- de: Betriebsanweisungen für Maschinen und Arbeitsmittel
  en: Operating instructions for machines and work equipment
- de: Betriebsarzt
  en: Company doctor
- de: Betriebsnummer
  en: Establishment number (Betriebsnummer)
- de: Betriebsnummer beantragen
  en: Apply for an establishment number
- de: Betroffene haben unter anderem Rechte auf Auskunft, Berichtigung, Löschung und Widerspruch. Amtlos zeigt die Frist ab Eingang und führt die Anfrage bis zur Antwort.
  en: Data subjects have rights including access, rectification, erasure and objection. Amtlos shows the deadline from receipt and tracks the request until it is answered.
- de: Bevor Beschäftigte eine Maschine oder ein anderes Arbeitsmittel zum ersten Mal benutzen, stellst du ihnen eine schriftliche Betriebsanweisung zur Verfügung und unterweist sie.
  en: Before employees use a machine or other work equipment for the first time, you provide them with written operating instructions (Betriebsanweisung) and instruct them.
- de: Bevor du die erste Person einstellst, brauchst du eine Betriebsnummer von der Bundesagentur für Arbeit.
  en: Before you hire your first person, you need an establishment number (Betriebsnummer) from the Federal Employment Agency (Bundesagentur für Arbeit).
- de: Bevor du verpackte Waren erstmals in Verkehr bringst, registrierst du dich im LUCID-Register und beteiligst dich an einem System.
  en: Before you place packaged goods on the market for the first time, you register in the LUCID register and join a system.
- de: Bevor jemand bei dir arbeitet, schreibst du auf, welche Gefahren es an den Arbeitsplätzen gibt und was du dagegen tust.
  en: Before anyone works for you, you write down what hazards exist at the workplaces and what you do about them.
- de: Bewahre Belege nachvollziehbar und unveränderbar auf und beschreibe in einer Verfahrensdokumentation, wie du das machst.
  en: Keep receipts in a traceable and unalterable way and describe in a process documentation (Verfahrensdokumentation) how you do this.
- de: Bewahre Belege und Rechnungen 8 Jahre, Jahresabschlüsse und Bücher 10 Jahre und Geschäftsbriefe 6 Jahre auf.
  en: Keep receipts and invoices for 8 years, annual financial statements and books for 10 years and business letters for 6 years.
- de: 'Biostoffe: Gefährdung beurteilen, Betriebsanweisung und Unterweisung'
  en: 'Biological agents: assess hazards, operating instructions and instruction'
- de: Bis zum 10. nach Ende des Anmeldezeitraums meldest du die Lohnsteuer beim Finanzamt an.
  en: By the 10th after the end of the filing period, you file the wage tax return (Lohnsteuer-Anmeldung) with the tax office (Finanzamt).
- de: Bis zur Änderung gilt § 38 BDSG weiter – Benennung nicht vorschnell aufheben
  en: Until the change, § 38 BDSG continues to apply – do not revoke the appointment prematurely
- de: Brandschutzhelfer benennen und ausbilden
  en: Appoint and train fire safety assistants
- de: Buchführungspflicht nach § 141 AO – Gewinngrenze
  en: Mandatory bookkeeping under § 141 AO – profit limit
- de: Buchführungspflicht nach § 141 AO – Umsatzgrenze
  en: Mandatory bookkeeping under § 141 AO – revenue limit
- de: Bundesagentur für Arbeit, Betriebsnummern-Service
  en: Federal Employment Agency (Bundesagentur für Arbeit), establishment number service
- de: Bundesamt für Sicherheit in der Informationstechnik (BSI)
  en: Federal Office for Information Security (BSI)
- de: Bundesministerium für Wirtschaft und Klimaschutz
  en: Federal Ministry for Economic Affairs and Climate Action
- de: Bundeszentralamt für Steuern
  en: Federal Central Tax Office (Bundeszentralamt für Steuern)
- de: Bundeszentralamt für Steuern (BZSt)
  en: Federal Central Tax Office (BZSt)
- de: 'Bußgeld bis 1.000 €, wenn die Anzeige nach § 18 Abs. 1 HwO nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig erstattet wird (§ 118 Abs. 1 Nr. 1, Abs. 2 HwO).'
  en: 'Fine of up to €1,000 if the notification under § 18(1) HwO is not made, or not made correctly, completely or on time (§ 118(1) no. 1, (2) HwO).'
- de: Bußgeld bis 10.000 €, wenn Erste-Hilfe-Leistungen nicht dokumentiert werden (§ 32 DGUV Vorschrift 1 in Verbindung mit § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII).
  en: Fine of up to €10,000 if first aid given is not documented (§ 32 DGUV Regulation 1 in conjunction with § 209(1) no. 1, (3) SGB VII).
- de: Bußgeld bis 10.000 €, wenn Erste-Hilfe-Material oder Meldeeinrichtungen fehlen oder Erste-Hilfe-Leistungen nicht dokumentiert werden (§ 32 DGUV Vorschrift 1 in Verbindung mit § 209 Abs. 1 Nr. 1, Abs.
    3 SGB VII).
  en: Fine of up to €10,000 if first-aid supplies or alarm facilities are missing or first aid given is not documented (§ 32 DGUV Regulation 1 in conjunction with § 209(1) no. 1, (3) SGB VII).
- de: 'Bußgeld bis 10.000 €, wenn Herstellerangaben oder Sicherheitsinformationen fehlen oder im Fernabsatz die Pflichtangaben nach Art. 19 GPSR fehlen (§ 28 Abs. 2 Nr. 5, 6, 26, Abs. 3 ProdSG).'
  en: 'Fine of up to €10,000 if manufacturer details or safety information are missing or, in distance selling, the mandatory information under Art. 19 GPSR is missing (§ 28(2) nos. 5, 6, 26, (3) ProdSG).'
- de: 'Bußgeld bis 10.000 €, wenn die Ware nicht auch in Mehrwegverpackungen angeboten wird, Mehrweg teurer oder zu schlechteren Bedingungen angeboten wird oder der Hinweis fehlt (§ 66 Abs. 1 Nr. 26, 28, 29, Abs. 3 VerpackDG).'
  en: 'Fine of up to €10,000 if the goods are not also offered in reusable packaging, reusable packaging is offered at a higher price or on worse terms, or the notice is missing (§ 66(1) nos. 26, 28, 29, (3) VerpackDG).'
- de: Bußgeld bis 10.000 €, wenn die erforderlichen Ersthelfer fehlen (§ 32 DGUV Vorschrift 1 in Verbindung mit § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII).
  en: Fine of up to €10,000 if the required first aiders are missing (§ 32 DGUV Regulation 1 in conjunction with § 209(1) no. 1, (3) SGB VII).
- de: Bußgeld bis 10.000 €, wenn elektrische Anlagen und Betriebsmittel nicht geprüft werden (§ 9 DGUV Vorschrift 3 in Verbindung mit § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII).
  en: Fine of up to €10,000 if electrical installations and equipment are not inspected (§ 9 DGUV Regulation 3 in conjunction with § 209(1) no. 1, (3) SGB VII).
- de: 'Bußgeld bis 100.000 €, wenn Abfälle nicht richtig getrennt gesammelt werden (§ 13 Abs. 1 Nr. 1 GewAbfV in Verbindung mit § 69 Abs. 1 Nr. 8, Abs. 3 KrWG), und bis 10.000 €, wenn die Dokumentation fehlt oder nicht rechtzeitig vorgelegt wird (§ 13 Abs. 2 Nr. 1, 2 GewAbfV in Verbindung mit § 69 Abs. 2 Nr. 15, Abs. 3 KrWG).'
  en: 'Fine of up to €100,000 if waste is not collected separately as required (§ 13(1) no. 1 GewAbfV in conjunction with § 69(1) no. 8, (3) KrWG), and up to €10,000 if the documentation is missing or not presented in time (§ 13(2) nos. 1, 2 GewAbfV in conjunction with § 69(2) no. 15, (3) KrWG).'
- de: 'Bußgeld bis 100.000 €, wenn du Batterien bereitstellst, ohne deine Rücknahmepflichten zu erfüllen (§ 60 Abs. 1 Nr. 1, Abs. 3 in Verbindung mit § 4 Abs. 2 und § 18 Abs. 1 Satz 1 BattDG).'
  en: 'Fine of up to €100,000 if you make batteries available without meeting your take-back obligations (§ 60(1) no. 1, (3) in conjunction with § 4(2) and § 18(1) sentence 1 BattDG).'
- de: 'Bußgeld bis 100.000 €, wenn du dich nicht registrieren lässt oder Elektrogeräte ohne Registrierung in Verkehr bringst oder anbietest (§ 45 Abs. 1 Nr. 1, 3, 4, Abs. 2 ElektroG).'
  en: 'Fine of up to €100,000 if you do not register, or place on the market or offer electrical equipment without registration (§ 45(1) nos. 1, 3, 4, (2) ElektroG).'
- de: 'Bußgeld bis 100.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig registrierst oder Batterien ohne Registrierung bereitstellst (§ 60 Abs. 1 Nr. 1, Abs. 2 Nr. 23, Abs. 3 in Verbindung mit § 4 Abs. 1 BattDG).'
  en: 'Fine of up to €100,000 if you do not register, or not correctly, completely or in time, or make batteries available without registration (§ 60(1) no. 1, (2) no. 23, (3) in conjunction with § 4(1) BattDG).'
- de: 'Bußgeld bis 100.000 €, wenn ein Produkt in Verkehr gebracht oder auf dem Markt bereitgestellt wird, das die Barrierefreiheitsanforderungen nicht erfüllt (§ 37 Abs. 1 Nr. 1, 7, Abs. 2 BFSG).'
  en: 'Fine of up to €100,000 if a product is placed or made available on the market that does not meet the accessibility requirements (§ 37(1) nos. 1, 7, (2) BFSG).'
- de: 'Bußgeld bis 100.000 €, wenn eine Dienstleistung angeboten oder erbracht wird, die die Barrierefreiheitsanforderungen nicht erfüllt oder für die die Informationen nach Anlage 3 fehlen (§ 37 Abs. 1 Nr. 8, Abs. 2 in Verbindung mit § 14 Abs. 1 BFSG).'
  en: 'Fine of up to €100,000 if a service is offered or provided that does not meet the accessibility requirements or for which the information under Annex 3 is missing (§ 37(1) no. 8, (2) in conjunction with § 14(1) BFSG).'
- de: 'Bußgeld bis 100.000 €, wenn gefährliche Abfälle vermischt werden (§ 69 Abs. 1 Nr. 1, Abs. 3 KrWG), und bis 10.000 €, wenn Register oder Nachweise nicht richtig geführt, vorgelegt oder aufbewahrt werden (§ 69 Abs. 2 Nr. 8 bis 12, Abs. 3 KrWG).'
  en: 'Fine of up to €100,000 if hazardous waste is mixed (§ 69(1) no. 1, (3) KrWG), and up to €10,000 if registers or records are not kept, presented or retained correctly (§ 69(2) nos. 8 to 12, (3) KrWG).'
- de: 'Bußgeld bis 100.000 €, wenn keine Annahmestelle eingerichtet oder nachgewiesen wird oder der Hinweis fehlt (§ 10 Abs. 1 Nr. 6 AltölV in Verbindung mit § 69 Abs. 1 Nr. 8, Abs. 3 KrWG).'
  en: 'Fine of up to €100,000 if no collection point is set up or proven, or the notice is missing (§ 10(1) no. 6 AltölV in conjunction with § 69(1) no. 8, (3) KrWG).'
- de: 'Bußgeld bis 150.000 € bei Vorsatz, sonst bis 100.000 €, etwa wenn Risikoanalyse, interne Sicherungsmaßnahmen oder die Identifizierung fehlen; bei schwerwiegenden, wiederholten oder systematischen Verstößen bis 1 Mio. € oder bis zum Zweifachen des wirtschaftlichen Vorteils, für Verpflichtete nach § 2 Abs. 1 Nr. 1 bis 3 und 6 bis 9 GwG auch mehr (§ 56 Abs. 1 Satz 1 Nr. 1, 3, 15, Abs. 3 GwG).'
  en: 'Fine of up to €150,000 for intent, otherwise up to €100,000, for example if the risk analysis, internal safeguards or identification are missing; for serious, repeated or systematic violations up to €1 million or up to twice the economic benefit, and more for obliged entities under § 2(1) nos. 1 to 3 and 6 to 9 GwG (§ 56(1) sentence 1 nos. 1, 3, 15, (3) GwG).'
- de: Bußgeld bis 2.500 €, wenn die Anzeige nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig erstattet wird (§ 209 Abs. 1 Nr. 9, Abs. 3 SGB VII).
  en: Fine of up to €2,500 if the report is not filed, not filed correctly, completely or on time (§ 209(1) no. 9, (3) SGB VII).
- de: 'Bußgeld bis 2.500 €, wenn die Mitteilung zum Unternehmensbeginn nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig gemacht wird (§ 209 Abs. 1 Nr. 8, Abs. 3 SGB VII). Eine Gewerbeanzeige in derselben Woche erfüllt die Pflicht (§ 192 Abs. 1 SGB VII).'
  en: 'Fine of up to €2,500 if the notification of the start of the business is not made, or not made correctly, completely or on time (§ 209(1) no. 8, (3) SGB VII). A trade registration within the same week fulfils the obligation (§ 192(1) SGB VII).'
- de: 'Bußgeld bis 25.000 €, wenn Unterlagen nach § 147 Abs. 1 AO nicht oder nicht für die vorgeschriebene Dauer aufbewahrt werden und dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz 1 Nr. 7, Abs. 6 AO); für Rechnungen nach § 14b UStG bis 5.000 € (§ 26a Abs. 2 Nr. 2, Abs. 3 UStG). Werden Handelsbücher vor Ablauf der Fristen beiseitegeschafft oder vernichtet, ist das strafbar, wenn später die Zahlungen eingestellt werden oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird (§ 283b Abs. 1 Nr. 2, Abs. 3 StGB).'
  en: 'Fine of up to €25,000 if records under § 147(1) AO are not kept, or not for the prescribed period, and this makes tax evasion possible (§ 379(1) sentence 1 no. 7, (6) AO); for invoices under § 14b UStG up to €5,000 (§ 26a(2) no. 2, (3) UStG). Removing or destroying commercial books before the end of the retention period is a criminal offence if payments are later stopped or insolvency proceedings are opened or rejected for lack of assets (§ 283b(1) no. 2, (3) StGB).'
- de: 'Bußgeld bis 25.000 €, wenn buchungspflichtige Geschäftsvorfälle nicht oder unrichtig aufgezeichnet werden und dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz 1 Nr. 3, Abs. 6 AO). Wer gesetzlich vorgeschriebene Handelsbücher nicht führt oder die Bilanz nicht rechtzeitig aufstellt, macht sich strafbar, wenn später die Zahlungen eingestellt werden oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird: Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe (§ 283b Abs. 1 Nr. 1, 3, Abs. 3 StGB).'
  en: 'Fine of up to €25,000 if transactions that must be booked are not recorded or recorded incorrectly and this makes tax evasion possible (§ 379(1) sentence 1 no. 3, (6) AO). Anyone who does not keep legally required commercial books or does not prepare the balance sheet on time commits a criminal offence if payments are later stopped or insolvency proceedings are opened or rejected for lack of assets: imprisonment of up to two years or a fine (§ 283b(1) nos. 1, 3, (3) StGB).'
- de: 'Bußgeld bis 25.000 €, wenn die Kasse nicht oder nicht richtig verwendet oder nicht oder nicht richtig durch eine TSE geschützt wird und dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz 1 Nr. 4, 5, Abs. 6 AO). Für die fehlende Belegausgabe nach § 146a Abs. 2 AO sieht § 379 AO kein Bußgeld vor.'
  en: 'Fine of up to €25,000 if the cash register is not used or not used correctly, or not protected or not correctly protected by a TSE, and this makes tax evasion possible (§ 379(1) sentence 1 nos. 4, 5, (6) AO). § 379 AO provides no fine for failing to issue receipts under § 146a(2) AO.'
- de: 'Bußgeld bis 30.000 €, wenn eine meldepflichtige Zahlung nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig gemeldet wird (§ 81 Abs. 2 Nr. 19 AWV in Verbindung mit § 19 Abs. 3 Nr. 1 Buchst. b, Abs. 6 AWG).'
  en: 'Fine of up to €30,000 if a reportable payment is not reported, or not reported correctly, completely or on time (§ 81(2) no. 19 AWV in conjunction with § 19(3) no. 1 letter b, (6) AWG).'
- de: 'Bußgeld bis 20.000 €, wenn gewerblicher Güterkraftverkehr ohne die nach § 3 Abs. 1 GüKG erforderliche Gemeinschaftslizenz durchgeführt wird (§ 19 Abs. 1 Nr. 1b, Abs. 7 GüKG); ebenso grenzüberschreitend ohne Gemeinschaftslizenz nach Art. 3 VO (EG) Nr. 1072/2009 (§ 19 Abs. 2 Nr. 1, Abs. 7 GüKG).'
  en: 'Fine of up to €20,000 if commercial road haulage is carried out without the Community licence required under § 3(1) GüKG (§ 19(1) no. 1b, (7) GüKG); the same applies to cross-border haulage without a Community licence under Art. 3 Regulation (EC) No 1072/2009 (§ 19(2) no. 1, (7) GüKG).'
- de: 'Bußgeld bis 200.000 €, wenn kein System zum Befüllen mitgebrachter Behälter vorgesehen oder die Mehrwegmöglichkeit nicht eingeräumt wird; bis 10.000 €, wenn das Befüllen oder Mehrweg teurer oder zu schlechteren Bedingungen angeboten wird oder der Hinweis fehlt (§ 66 Abs. 2 Nr. 29 bis 32, Abs. 3 VerpackDG).'
  en: 'Fine of up to €200,000 if no system for filling containers brought by customers is provided or the reusable option is not offered; up to €10,000 if filling or reusable packaging is offered at a higher price or on worse terms, or the notice is missing (§ 66(2) nos. 29 to 32, (3) VerpackDG).'
- de: 'Bußgeld bis 25.000 €, wenn Gesamt- oder Grundpreis nicht, nicht richtig oder nicht vollständig angegeben sind (§ 20 Nr. 1 PAngV in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954). Nach dem Gesetz vom 19.10.2026 (BGBl. 2026 I Nr. 314) künftig bis 100.000 € (§ 3 Abs. 1, 3 PAngG).'
  en: 'Fine of up to €25,000 if the total or unit price is not stated, or not stated correctly or completely (§ 20 no. 1 PAngV in conjunction with § 3(1) sentence 1 no. 2, (2) WiStrG 1954). Under the Act of 19.10.2026 (BGBl. 2026 I No. 314), up to €100,000 in future (§ 3(1), (3) PAngG).'
- de: 'Bußgeld bis 25.000 €, wenn Preise nicht in einem Preisverzeichnis angegeben sind oder das Preisverzeichnis nach § 13 Abs. 2 Satz 1 PAngV nicht oder nicht rechtzeitig vorgelegt wird (§ 20 Nr. 1, 4 PAngV in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954). Das Preisverzeichnis neben dem Eingang (§ 13 Abs. 2 Satz 2 PAngV) ist in § 20 PAngV nicht genannt. Nach dem Gesetz vom 19.10.2026 (BGBl. 2026 I Nr. 314) künftig bis 100.000 € (§ 3 Abs. 1, 3 PAngG).'
  en: 'Fine of up to €25,000 if prices are not stated in a price list or the price list under § 13(2) sentence 1 PAngV is not presented or not presented in time (§ 20 nos. 1, 4 PAngV in conjunction with § 3(1) sentence 1 no. 2, (2) WiStrG 1954). The price list next to the entrance (§ 13(2) sentence 2 PAngV) is not listed in § 20 PAngV. Under the Act of 19.10.2026 (BGBl. 2026 I No. 314), up to €100,000 in future (§ 3(1), (3) PAngG).'
- de: 'Bußgeld bis 25.000 €, wenn das Preisverzeichnis bei unzumutbarem Aushang nicht zur Einsicht bereitgehalten wird (§ 20 Nr. 2 PAngV) oder Gesamt- oder Grundpreise nicht richtig angegeben sind (§ 20 Nr. 1 PAngV), jeweils in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954. Der Aushang selbst (§ 12 Abs. 2 Satz 1, 2 PAngV) ist in § 20 PAngV nicht genannt. Nach dem Gesetz vom 19.10.2026 (BGBl. 2026 I Nr. 314) künftig bis 100.000 € (§ 3 Abs. 1, 3 PAngG).'
  en: 'Fine of up to €25,000 if, where posting is unreasonable, the price list is not kept available for inspection (§ 20 no. 2 PAngV) or total or unit prices are not stated correctly (§ 20 no. 1 PAngV), in each case in conjunction with § 3(1) sentence 1 no. 2, (2) WiStrG 1954. Posting the list itself (§ 12(2) sentences 1, 2 PAngV) is not listed in § 20 PAngV. Under the Act of 19.10.2026 (BGBl. 2026 I No. 314), up to €100,000 in future (§ 3(1), (3) PAngG).'
- de: 'Bußgeld bis 25.000 €, wenn die Anzeige nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig erstattet wird (§ 72 Nr. 1 TrinkwV in Verbindung mit § 73 Abs. 1a Nr. 24, Abs. 2 IfSG).'
  en: 'Fine of up to €25,000 if the notification is not made, or not made correctly, completely or in time (§ 72 no. 1 TrinkwV in conjunction with § 73(1a) no. 24, (2) IfSG).'
- de: 'Bußgeld bis 30.000 € für dich als Unternehmer, wenn du nicht dafür sorgst, dass deine Fahrer Lenkzeiten, Fahrtunterbrechungen und Ruhezeiten einhalten (§ 8a Abs. 1 Nr. 2, Abs. 4 FPersG); für Fahrer bis 5.000 € (§ 8a Abs. 2 Nr. 1, Abs. 4 FPersG).'
  en: 'Fine of up to €30,000 for you as the business owner if you do not ensure that your drivers comply with driving times, breaks and rest periods (§ 8a(1) no. 2, (4) FPersG); for drivers up to €5,000 (§ 8a(2) no. 1, (4) FPersG).'
- de: 'Bußgeld bis 30.000 € für dich als Unternehmer, wenn du nicht dafür sorgst, dass die Lenk- und Ruhezeiten eingehalten werden, keine Vordrucke aushändigst oder die Aufzeichnungen nicht prüfst, aufbewahrst oder vorlegst (§ 21 Abs. 1 Nr. 1, 1a, 2 FPersV in Verbindung mit § 8 Abs. 1 Nr. 1 Buchst. a, Abs. 2 FPersG); für Fahrer bis 5.000 € (§ 21 Abs. 2 Nr. 1, 2 FPersV).'
  en: 'Fine of up to €30,000 for you as the business owner if you do not ensure that driving and rest times are observed, do not hand out forms, or do not check, keep or present the records (§ 21(1) nos. 1, 1a, 2 FPersV in conjunction with § 8(1) no. 1 letter a, (2) FPersG); for drivers up to €5,000 (§ 21(2) nos. 1, 2 FPersV).'
- de: Bußgeld bis 5.000 € bei Verstößen gegen die Lärm- und Vibrations-Arbeitsschutzverordnung, etwa ohne Gefährdungsbeurteilung, Gehörschutz oder Unterweisung (§ 16 Abs. 1 LärmVibrationsArbSchV in Verbindung
    mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG).
  en: Fine of up to €5,000 for breaches of the Noise and Vibration Occupational Safety Ordinance, for example without a risk assessment, hearing protection or instruction (§ 16(1) LärmVibrationsArbSchV
    in conjunction with § 25(1) no. 1, (2) ArbSchG).
- de: Bußgeld bis 5.000 €, wenn die Betriebsanweisung oder die Unterweisung fehlt oder zu spät kommt (§ 22 Abs. 1 Nr. 25 bis 27 BetrSichV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG).
  en: Fine of up to €5,000 if the operating instructions or the instruction are missing or come too late (§ 22(1) nos. 25 to 27 BetrSichV in conjunction with § 25(1) no. 1, (2) ArbSchG).
- de: 'Bußgeld bis 5.000 €, wenn die Zusammenfassende Meldung nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig abgegeben oder nicht rechtzeitig berichtigt wird (§ 26a Abs. 2 Nr. 5, Abs. 3 UStG).'
  en: 'Fine of up to €5,000 if the recapitulative statement is not submitted, or not correctly, completely or on time, or not corrected on time (§ 26a(2) no. 5, (3) UStG).'
- de: 'Bußgeld bis 5.000 €, wenn du dich als Versicherungs- oder Finanzanlagenvermittler nicht, nicht richtig oder nicht rechtzeitig eintragen lässt oder Änderungen nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig mitteilst (§ 144 Abs. 2 Nr. 8, 9, Abs. 4 GewO).'
  en: 'Fine of up to €5,000 if, as an insurance or financial investment broker, you do not register, or not correctly or on time, or do not report changes, or not correctly, completely or on time (§ 144(2) nos. 8, 9, (4) GewO).'
- de: 'Bußgeld bis 5.000 €, wenn du ein Reisegewerbe ohne die erforderliche Erlaubnis nach § 55 Abs. 2 GewO betreibst (§ 145 Abs. 1 Nr. 1 Buchst. b, Abs. 4 GewO).'
  en: 'Fine of up to €5,000 if you carry on an itinerant trade without the required permit under § 55(2) GewO (§ 145(1) no. 1 letter b, (4) GewO).'
- de: 'Bußgeld bis 5.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig weiterbildest (§ 144 Abs. 2 Nr. 5a, 7d, Abs. 4 GewO).'
  en: 'Fine of up to €5,000 if you do not complete the required training, or not correctly, completely or in time (§ 144(2) nos. 5a, 7d, (4) GewO).'
- de: Bußgeld bis 5.000 €, wenn ein Arbeitsmittel nicht oder nicht rechtzeitig geprüft wird oder das Ergebnis nicht aufgezeichnet wird (§ 22 Abs. 1 Nr. 28, 30 BetrSichV in Verbindung mit § 25 Abs. 1 Nr.
    1, Abs. 2 ArbSchG).
  en: Fine of up to €5,000 if work equipment is not inspected or not inspected on time, or the result is not recorded (§ 22(1) nos. 28, 30 BetrSichV in conjunction with § 25(1) no. 1, (2) ArbSchG).
- de: 'Bußgeld bis 50.000 €, etwa wenn die Produktinformationsdatei fehlt, das Produkt nicht notifiziert ist, Kennzeichnungsangaben fehlen oder ernste unerwünschte Wirkungen nicht gemeldet werden (§ 9 Abs. 2 Nr. 4, 6, 12, 14 KosmetikV in Verbindung mit § 60 Abs. 4 Nr. 2 Buchst. a, Abs. 5 LFGB).'
  en: 'Fine of up to €50,000, for example if the product information file is missing, the product has not been notified, labelling particulars are missing or serious undesirable effects are not reported (§ 9(2) nos. 4, 6, 12, 14 KosmetikV in conjunction with § 60(4) no. 2 letter a, (5) LFGB).'
- de: 'Bußgeld bis 50.000 €, wenn Lebensmittel ohne die vorgeschriebene Allergeninformation in den Verkehr gebracht oder abgegeben werden (§ 6 Abs. 4 Nr. 1, 2 LMIDV in Verbindung mit § 60 Abs. 2 Nr. 26 Buchst. a, Abs. 5 LFGB).'
  en: 'Fine of up to €50,000 if food is placed on the market or supplied without the required allergen information (§ 6(4) nos. 1, 2 LMIDV in conjunction with § 60(2) no. 26 letter a, (5) LFGB).'
- de: Bußgeld bis 50.000 €, wenn das Expositionsverzeichnis nicht, nicht richtig oder nicht vollständig geführt oder nicht lange genug aufbewahrt wird (§ 22 Abs. 1 Nr. 17a, 17b GefStoffV in Verbindung mit
    § 26 Abs. 1 Nr. 8 Buchst. b, Abs. 3 ChemG).
  en: Fine of up to €50,000 if the exposure register is not kept, not kept correctly or completely, or not retained long enough (§ 22(1) nos. 17a, 17b GefStoffV in conjunction with § 26(1) no. 8 letter
    b, (3) ChemG).
- de: Bußgeld bis 50.000 €, wenn das Gefahrstoffverzeichnis fehlt, die Betriebsanweisung nicht zugänglich ist oder nicht mündlich unterwiesen wird (§ 22 Abs. 1 Nr. 2, 24, 25 GefStoffV in Verbindung mit
    § 26 Abs. 1 Nr. 8 Buchst. b, Abs. 3 ChemG).
  en: Fine of up to €50,000 if the hazardous substances register is missing, the operating instructions are not accessible or no oral instruction is given (§ 22(1) nos. 2, 24, 25 GefStoffV in conjunction
    with § 26(1) no. 8 letter b, (3) ChemG).
- de: 'Bußgeld bis 50.000 €, wenn die Pflichtangaben nach § 5 Abs. 1 DDG nicht, nicht richtig oder nicht vollständig verfügbar sind (§ 33 Abs. 2 Nr. 1, Abs. 6 Nr. 3 DDG). Die Bußgelder zu Art. 30 DSA (§ 33 Abs. 5 Nr. 27 bis 31 DDG) treffen den Betreiber des Marktplatzes.'
  en: 'Fine of up to €50,000 if the mandatory information under § 5(1) DDG is not available, or not correctly or completely available (§ 33(2) no. 1, (6) no. 3 DDG). The fines relating to Art. 30 DSA (§ 33(5) nos. 27 to 31 DDG) apply to the marketplace operator.'
- de: 'Bußgeld bis 50.000 €, wenn jemand ohne die erforderliche Sachkundebescheinigung an der Klimaanlage arbeitet (§ 16 Abs. 2 Nr. 3 in Verbindung mit § 5 Abs. 1 Satz 1 ChemKlimaschutzV, § 26 Abs. 1 Nr. 7 Buchst. a, Abs. 3 ChemG).'
  en: 'Fine of up to €50,000 if someone works on the air-conditioning system without the required certificate of competence (§ 16(2) no. 3 in conjunction with § 5(1) sentence 1 ChemKlimaschutzV, § 26(1) no. 7 letter a, (3) ChemG).'
- de: 'Bußgeld bis 50.000 €, wenn keine Systeme und Verfahren zur Rückverfolgbarkeit eingerichtet sind oder die Informationen der Behörde nicht rechtzeitig zur Verfügung gestellt werden (§ 60 Abs. 3 Nr. 1 Buchst. b, c, Abs. 5 LFGB); ebenso bei Verstößen gegen die Rücknahme- und Unterrichtungspflichten nach Art. 19 VO (EG) Nr. 178/2002 (§ 60 Abs. 3 Nr. 1 Buchst. d bis g LFGB).'
  en: 'Fine of up to €50,000 if no traceability systems and procedures are in place or the information is not made available to the authority in time (§ 60(3) no. 1 letters b, c, (5) LFGB); the same applies to breaches of the withdrawal and notification duties under Art. 19 Regulation (EC) No 178/2002 (§ 60(3) no. 1 letters d to g LFGB).'
- de: 'Bußgeld bis 50.000 €, wenn leicht verderbliche Lebensmittel von Personen ohne die nötige Schulung hergestellt, behandelt oder in den Verkehr gebracht werden (§ 10 Nr. 3 in Verbindung mit § 4 Abs. 1 Satz 1 LMHV, § 60 Abs. 2 Nr. 26 Buchst. a, Abs. 5 LFGB).'
  en: 'Fine of up to €50,000 if perishable food is produced, handled or placed on the market by people without the necessary training (§ 10 no. 3 in conjunction with § 4(1) sentence 1 LMHV, § 60(2) no. 26 letter a, (5) LFGB).'
- de: 'Bußgeld bis 50.000 €, wenn vorverpackte Lebensmittel ohne die vorgeschriebenen Pflichtangaben in den Verkehr gebracht werden (§ 6 Abs. 4 Nr. 2 in Verbindung mit § 5 Abs. 1 LMIDV, § 60 Abs. 2 Nr. 26 Buchst. a, Abs. 5 LFGB); einzelne Verstöße sind Straftaten (§ 6 Abs. 1 LMIDV, § 59 Abs. 1 Nr. 21 Buchst. a LFGB).'
  en: 'Fine of up to €50,000 if prepacked food is placed on the market without the mandatory particulars (§ 6(4) no. 2 in conjunction with § 5(1) LMIDV, § 60(2) no. 26 letter a, (5) LFGB); certain breaches are criminal offences (§ 6(1) LMIDV, § 59(1) no. 21 letter a LFGB).'
- de: Damit Amtlos die Termine der Lohnsteuer-Anmeldung berechnen kann, brauchst du den Anmeldezeitraum.
  en: So that Amtlos can calculate the dates for the payroll tax return (Lohnsteuer-Anmeldung), you need the filing period.
- de: Das BFSG nennt die betroffenen Produkte abschließend. Prüfe, ob deine Produkte dazugehören.
  en: The BFSG lists the affected products exhaustively. Check whether your products are among them.
- de: Das Finanzamt hat Vorauszahlungen festgesetzt.
  en: The tax office has set prepayments.
- de: Das Kapital, das die Gesellschafter bei der Gründung einer GmbH oder UG mindestens aufbringen.
  en: The minimum capital that the shareholders contribute when founding a GmbH or UG.
- de: Das Verzeichnis beschreibt je Verarbeitung Zweck, betroffene Personen, Datenarten, Empfänger und Löschfristen. Amtlos hilft beim Anlegen und erzeugt das Verzeichnis als PDF.
  en: For each processing activity, the record describes the purpose, people affected, types of data, recipients and deletion periods. Amtlos helps you set it up and generates the record as a PDF.
- de: Daten deiner Beschäftigten verarbeitest du nur, soweit es für das Arbeitsverhältnis nötig ist.
  en: You process your employees' data only as far as necessary for the employment relationship.
- de: Daten dürfen nur so lange gespeichert werden, wie es für den Zweck nötig ist. Gesetzliche Aufbewahrungspflichten (z. B. für Rechnungen) gehen vor.
  en: Data may only be stored as long as necessary for the purpose. Statutory retention obligations (e.g. for invoices) take precedence.
- de: Datenpanne der Aufsichtsbehörde melden
  en: Report a data breach to the supervisory authority
- de: Datenschutz-Aufsichtsbehörde des Landes
  en: State data protection supervisory authority
- de: Datenschutzbeauftragten benennen
  en: Appoint a data protection officer
- de: Datenschutzerklärung auf der Website
  en: Privacy policy on your website
- de: Dazu gehören Risikoanalyse, Identifizierung der Vertragspartner und Verdachtsmeldungen.
  en: This includes a risk analysis, identifying contracting parties and reporting suspicious activity.
- de: Dein Betrieb gehört zu Gesundheit und Pflege.
  en: Your business is in health and care.
- de: Dein Betrieb gehört zu Handwerk oder Bau.
  en: Your business belongs to the trades or construction.
- de: Dein Betrieb gehört zu Transport und Logistik.
  en: Your business is in transport and logistics.
- de: Dein Betrieb gehört zu einer Branche mit Sofortmeldepflicht.
  en: Your business belongs to an industry with an immediate reporting obligation.
- de: Dein Betrieb gehört zur Baubranche.
  en: Your business is in the construction industry.
- de: Dein Betrieb gehört zur Beauty- und Kosmetikbranche.
  en: Your business is in the beauty and cosmetics industry.
- de: Dein Betrieb gehört zur Gastronomie oder Lebensmittelbranche.
  en: Your business is in the hospitality or food industry.
- de: Dein Betrieb gehört zur Gastronomie und Lebensmittelbranche.
  en: Your business belongs to the hospitality and food sector.
- de: Dein Betrieb gehört zur Immobilien- oder Finanzbranche.
  en: Your business is in the real estate or finance industry.
- de: Dein Betrieb ist ein Handwerksbetrieb.
  en: Your business is a skilled trade business (Handwerksbetrieb).
- de: Dein Geschäftsjahr weicht vom Kalenderjahr ab.
  en: Your financial year differs from the calendar year.
- de: Dein Umsatz im Vorjahr lag über 800.000 €.
  en: Your revenue in the previous year was above €800,000.
- de: Dein Umsatz im Vorjahr lag über der Grenze.
  en: Your revenue in the previous year was above the limit.
- de: Dein Umsatz lag über 2 Mio. €.
  en: Your revenue was over €2 million.
- de: Dein Unternehmen fällt unter NIS2.
  en: Your company falls under NIS2.
- de: Dein Unternehmen ist eine Kapitalgesellschaft.
  en: Your company is a corporation (Kapitalgesellschaft).
- de: Dein Unternehmen ist eine UG (haftungsbeschränkt).
  en: Your company is a UG (haftungsbeschränkt).
- de: Dein Unternehmen ist eine UG oder GmbH.
  en: Your company is a UG or GmbH.
- de: Dein erwarteter Umsatz im Gründungsjahr liegt über der Grenze für das Gründungsjahr.
  en: Your expected revenue in your founding year is above the limit for the founding year.
- de: Dein erwarteter Umsatz in diesem Jahr liegt über 800.000 €.
  en: Your expected revenue this year is above €800,000.
- de: Dein erwarteter Umsatz in diesem Jahr liegt über der Grenze.
  en: Your expected revenue this year is above the limit.
- de: Deine Gesellschaft ist noch nicht im Handelsregister eingetragen.
  en: Your company is not yet entered in the commercial register (Handelsregister).
- de: Deine Krankenversicherung
  en: Your health insurance
- de: Deine Rechnungen müssen bestimmte Angaben enthalten. Als Kleinunternehmer brauchst du einen Hinweis auf § 19 UStG.
  en: Your invoices must contain certain details. Under the small business scheme, you need a reference to § 19 UStG.
- de: Deine Selbstständigkeit hat noch nicht begonnen.
  en: Your self-employment has not started yet.
- de: Deine Tätigkeit fällt unter eine erlaubnispflichtige Vorschrift der Gewerbeordnung.
  en: Your activity falls under a provision of the Trade Regulation Act (Gewerbeordnung) that requires a permit.
- de: Deine Tätigkeit ist ein Gewerbe.
  en: Your activity is a trade (Gewerbe).
- de: Deine Website nutzt Tracking.
  en: Your website uses tracking.
- de: Den Anmeldezeitraum teilt dir das Finanzamt mit. Du findest ihn in deinen Unterlagen zur Lohnsteuer oder fragst deine Steuerberatung.
  en: The tax office (Finanzamt) tells you the filing period. You can find it in your payroll tax documents or ask your tax adviser.
- de: Den Jahresabschluss reichst du spätestens zwölf Monate nach Ende deines Geschäftsjahres beim Unternehmensregister ein.
  en: You file the annual financial statements with the company register (Unternehmensregister) no later than twelve months after the end of your financial year.
- de: Den Jahresabschluss reichst du spätestens zwölf Monate nach Ende des Geschäftsjahres beim Unternehmensregister ein.
  en: You submit the annual financial statements to the company register (Unternehmensregister) no later than twelve months after the end of the financial year.
- de: Der Anmeldezeitraum fehlt noch.
  en: The filing period is still missing.
- de: Der Beitragsnachweis kündigt der Krankenkasse die Beiträge an. Er muss zwei Arbeitstage vor dem Fälligkeitstag vorliegen und wird vom Lohnprogramm übermittelt.
  en: The contribution statement notifies the health insurance fund of the contributions. It must be received two working days before the due date and is submitted by your payroll software.
- de: Der Button, mit dem Verbraucher kostenpflichtig bestellen, muss eindeutig auf die Zahlungspflicht hinweisen.
  en: The button consumers use to place a paid order must clearly indicate the obligation to pay.
- de: Der Gründungszuschuss ist eine Förderung der Agentur für Arbeit. Er muss vor Beginn der Selbstständigkeit beantragt werden.
  en: The start-up grant (Gründungszuschuss) is funding from the Federal Employment Agency (Agentur für Arbeit). You must apply for it before you start your self-employment.
- de: Der Jahresabschluss wird öffentlich zugänglich beim Unternehmensregister eingereicht.
  en: The annual financial statements are filed with the company register (Unternehmensregister), where they are publicly accessible.
- de: Der Vertrag regelt, wie der Dienstleister die Daten nach deinen Weisungen verarbeitet. Amtlos führt die Liste deiner Dienstleister und legt die Verträge ab.
  en: The agreement sets out how the service provider processes the data according to your instructions. Amtlos keeps the list of your service providers and files the agreements.
- de: Deutsche Bundesbank
  en: Deutsche Bundesbank
- de: Deutsche Rentenversicherung
  en: German Pension Insurance (Deutsche Rentenversicherung)
- de: Deutsche Rentenversicherung (Clearingstelle)
  en: German Pension Insurance (Deutsche Rentenversicherung), clearing office (Clearingstelle)
- de: Deutsche Rentenversicherung (über Lohnprogramm)
  en: German Pension Insurance (Deutsche Rentenversicherung) (via payroll software)
- de: Deutsche Rentenversicherung, Clearingstelle
  en: German Pension Insurance (Deutsche Rentenversicherung), clearing office (Clearingstelle)
- de: Die Anforderungen ergeben sich aus dem Infektionsschutz und den Hygieneverordnungen der Länder.
  en: The requirements come from infection protection law and the hygiene ordinances of the federal states.
- de: Die Baustellenverordnung verteilt die Pflichten nach Rollen. Der Bauherr kündigt größere Baustellen mindestens zwei Wochen vor Einrichtung der Behörde an – bei mehr als 30 Arbeitstagen mit mehr als
    20 gleichzeitig Beschäftigten oder mehr als 500 Personentagen (§ 2 Abs. 2 BaustellV) –, lässt einen Sicherheits- und Gesundheitsschutzplan (SiGe-Plan) erstellen, wenn mehrere Arbeitgeber tätig sind
    und eine Vorankündigung nötig ist oder besonders gefährliche Arbeiten anfallen (§ 2 Abs. 3), und bestellt bei mehreren Arbeitgebern einen Koordinator (§ 3 Abs. 1). Als ausführende Firma triffst du die
    Schutzmaßnahmen für deine Arbeiten, berücksichtigst die Hinweise des Koordinators und den SiGe-Plan und informierst deine Beschäftigten darüber (§ 5 BaustellV). Baust du selbst als Bauherr, etwa die
    eigene Halle, treffen die Pflichten nach §§ 2 und 3 dich.
  en: The Construction Site Ordinance assigns obligations by role. The client (Bauherr) gives the authority prior notice of larger construction sites at least two weeks before they are set up – for more
    than 30 working days with more than 20 workers at the same time or more than 500 person-days (§ 2(2) BaustellV) –, has a safety and health protection plan (SiGe-Plan) drawn up if several employers are
    active and prior notice is required or particularly dangerous work is carried out (§ 2(3)), and appoints a coordinator if there are several employers (§ 3(1)). As the contractor, you take the protective
    measures for your work, take into account the coordinator's instructions and the SiGe plan and inform your employees about them (§ 5 BaustellV). If you build as the client yourself, for example your
    own hall, the obligations under §§ 2 and 3 apply to you.
- de: Die Beiträge zur Sozialversicherung sind am drittletzten Bankarbeitstag des Monats fällig.
  en: Social security contributions are due on the third-to-last bank working day of the month.
- de: Die Berufsgenossenschaft ist die gesetzliche Unfallversicherung für Betriebe. Welche zuständig ist, hängt von deiner Branche ab. Ob du dich selbst als Unternehmer versichern musst, hängt ebenfalls
    von der Branche ab.
  en: The employers' liability insurance association (Berufsgenossenschaft) is the statutory accident insurance for businesses. Which one is responsible depends on your industry. Whether you must insure
    yourself as a business owner also depends on the industry.
- de: Die Betriebsnummer identifiziert deinen Betrieb in allen Meldungen zur Sozialversicherung. Du beantragst sie beim Betriebsnummern-Service der Bundesagentur für Arbeit, bevor die erste Person bei dir
    anfängt.
  en: The establishment number identifies your business in all social security reports. You apply for it at the establishment number service of the Federal Employment Agency (Bundesagentur für Arbeit) before
    your first person starts working for you.
- de: Die Bilanz in elektronischer Form, die ans Finanzamt übermittelt wird.
  en: The balance sheet in electronic form, submitted to the tax office (Finanzamt).
- de: Die Einkommensteuererklärung übermittelst du elektronisch – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: You submit your income tax return electronically – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
- de: 'Die Einnahmenüberschussrechnung übermittelst du nach amtlich vorgeschriebenem Datensatz (§ 60 Abs. 4 EStDV); das Finanzamt kann sie mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO). Wird die Steuererklärung zu spät abgegeben, droht ein Verspätungszuschlag (§ 152 AO).'
  en: 'You transmit the income surplus calculation using the official data record (§ 60(4) EStDV); the tax office can enforce it with a coercive fine (Zwangsgeld) of up to €25,000 (§§ 328, 329 AO). If the tax return is filed late, a late-filing surcharge may be imposed (§ 152 AO).'
- de: Die Folgen sind noch nicht fachlich erfasst.
  en: The consequences have not yet been reviewed by experts.
- de: Die Frist beginnt, sobald du von der Panne erfährst. Keine Meldung ist nötig, wenn voraussichtlich kein Risiko für die Betroffenen besteht – das entscheidest und dokumentierst du. Amtlos zeigt einen
    Countdown und erstellt einen Meldeentwurf.
  en: The deadline starts as soon as you become aware of the breach. No report is required if there is likely no risk to the people affected – you decide and document this. Amtlos shows a countdown and
    creates a draft report.
- de: Die Gefahrstoffverordnung verlangt ein Verzeichnis der Gefahrstoffe mit Bezeichnung, Einstufung, Mengenbereich, Arbeitsbereich und Verweis auf das Sicherheitsdatenblatt (§ 6 Abs. 12 GefStoffV) und
    für die Beschäftigten schriftliche Betriebsanweisungen auf Grundlage der Gefährdungsbeurteilung (§ 14 Abs. 1 GefStoffV). Anhand der Betriebsanweisung unterweist du mündlich und arbeitsplatzbezogen –
    vor Aufnahme der Beschäftigung und danach mindestens jährlich; Inhalt und Zeitpunkt hältst du schriftlich fest, und die Unterwiesenen bestätigen die Unterweisung durch Unterschrift (§ 14 Abs. 2 GefStoffV).
    Ein eingetippter Name genügt dafür nicht. Ergibt die Gefährdungsbeurteilung nur Tätigkeiten mit geringer Gefährdung (§ 6 Abs. 13 GefStoffV), entfällt das Verzeichnis (§ 6 Abs. 12 Satz 3), und die weitergehenden
    Schutzmaßnahmen sind nicht nötig – das begründest du in der Gefährdungsbeurteilung. Bei krebserzeugenden, keimzellmutagenen oder reproduktionstoxischen Stoffen der Kategorie 1A oder 1B kommt das Expositionsverzeichnis
    als eigene Pflicht hinzu.
  en: The Hazardous Substances Ordinance requires a register of hazardous substances with name, classification, quantity range, work area and a reference to the safety data sheet (§ 6(12) GefStoffV) and
    written operating instructions for employees based on the risk assessment (§ 14(1) GefStoffV). Based on the operating instructions, you instruct orally and specific to the workplace – before employment
    begins and at least annually afterwards; you record the content and date in writing, and those instructed confirm the instruction by signature (§ 14(2) GefStoffV). A typed name is not enough for this.
    If the risk assessment shows only activities with low hazard (§ 6(13) GefStoffV), the register is not required (§ 6(12) sentence 3), and the further protective measures are not necessary – you justify
    this in the risk assessment. For carcinogenic, germ-cell mutagenic or reprotoxic substances of category 1A or 1B, the exposure register is added as a separate obligation.
- de: Die Gemeinde hat Gewerbesteuer-Vorauszahlungen festgesetzt.
  en: The municipality has set trade tax prepayments.
- de: Die Gewerbesteuer hängt vom Hebesatz deiner Gemeinde ab. Einzelunternehmen und Personengesellschaften haben einen Freibetrag. Die Erklärung gibst du ohne Steuerberatung bis 31. Juli des Folgejahres ab, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: Trade tax depends on your municipality's multiplier (Hebesatz). Sole proprietorships and partnerships have a tax-free allowance. You file the return without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
- de: Die GoBD regeln, wie Bücher und Belege elektronisch geführt und aufbewahrt werden. Die Verfahrensdokumentation beschreibt deine Abläufe.
  en: The GoBD set out how books and receipts are kept and stored electronically. The process documentation describes your procedures.
- de: Die Gründung einer GmbH oder UG beginnt mit dem Gesellschaftsvertrag, den ein Notar beurkundet. Die Beurkundung ist auch online möglich. Für die GmbH beträgt das Stammkapital mindestens 25.000 €,
    davon ist mindestens die Hälfte einzuzahlen. Eine UG kann ab 1 € gegründet werden.
  en: Founding a GmbH or UG starts with the articles of association, which are notarised by a notary. Notarisation is also possible online. For a GmbH, the share capital is at least €25,000, of which at
    least half must be paid in. A UG can be founded from €1.
- de: Die Höhe steht im Bescheid deiner Gemeinde.
  en: The amount is stated in your municipality's tax notice.
- de: Die Information nennt unter anderem Zweck, Rechtsgrundlage, Empfänger, Speicherdauer und die Rechte der Betroffenen.
  en: The information includes, among other things, the purpose, legal basis, recipients, storage period and the rights of the people affected.
- de: Die Jahreserklärung fasst die Umsatzsteuer des ganzen Jahres zusammen – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
  en: The annual return summarises the VAT for the whole year – without a tax adviser by 31 July of the following year, with a tax adviser by the end of February of the year after that (§ 149 AO).
- de: Die Kleinunternehmerregelung endet ab dem Umsatz, der die Grenze überschreitet. Amtlos zählt dafür die Rechnungen, die du in Amtlos gestellt hast. Rechnungen außerhalb von Amtlos sind nicht enthalten.
  en: The small business scheme (Kleinunternehmerregelung) ends from the sale that exceeds the limit. For this, Amtlos counts the invoices you issued in Amtlos. Invoices outside Amtlos are not included.
- de: Die Lebensmittelinformationsverordnung verlangt Angaben zu Allergenen. Amtlos führt eine Allergenliste je Gericht und erstellt daraus eine Übersicht zum Aushängen.
  en: The Food Information Regulation (LMIV) requires information on allergens. Amtlos keeps an allergen list per dish and creates an overview from it for you to post.
- de: Die Lohnabrechnung selbst macht ein systemgeprüfter Partner; Amtlos liefert Stammdaten und Fristen.
  en: The payroll itself is done by a system-certified partner; Amtlos provides master data and deadlines.
- de: Die Maßnahmen (TOM) müssen dem Risiko angemessen sein. Amtlos gliedert sie nach den Schutzzielen der DSGVO; du trägst ein, was umgesetzt ist.
  en: The measures (TOM) must be appropriate to the risk. Amtlos organises them according to the protection goals of the GDPR; you enter what has been implemented.
- de: Die Menschen, denen eine Gesellschaft letztlich gehört oder die sie kontrollieren.
  en: The people who ultimately own or control a company.
- de: Die Minijob-Grenze ist an den Mindestlohn gekoppelt. Amtlos führt die Werte mit Gültigkeitszeitraum.
  en: The mini-job limit is linked to the minimum wage. Amtlos keeps the values with their validity period.
- de: Die Mitteilung an die zuständige Aufsichtsbehörde ist Pflicht des Arbeitgebers.
  en: Notifying the competent supervisory authority is the employer's obligation.
- de: Die Pflicht zum Versand strukturierter E-Rechnungen (XRechnung oder ZUGFeRD) gilt ab 1.1.2027 für Unternehmen mit mehr als 800.000 € Vorjahresumsatz. Kleinunternehmer sind befreit. Eine PDF-Rechnung
    ist keine E-Rechnung.
  en: The obligation to send structured e-invoices (XRechnung or ZUGFeRD) applies from 1.1.2027 to businesses with more than €800,000 in previous year's revenue. Small businesses under the small business
    scheme (Kleinunternehmerregelung) are exempt. A PDF invoice is not an e-invoice.
- de: Die Preisangabenverordnung regelt, wie Preise gegenüber Verbrauchern anzugeben sind.
  en: The Price Indication Ordinance (Preisangabenverordnung) governs how prices must be stated to consumers.
- de: Die Sozialkassen regeln unter anderem Urlaub und Berufsbildung in der Bauwirtschaft. Ob dein Betrieb erfasst ist, hängt von den überwiegenden Tätigkeiten ab.
  en: Among other things, the social funds cover holidays and vocational training in the construction industry. Whether your business is covered depends on its predominant activities.
- de: Die Statusfeststellung ist eine Möglichkeit, keine Pflicht. Sie schafft Sicherheit, wenn das Risiko der Scheinselbstständigkeit besteht.
  en: The status determination is an option, not an obligation. It gives you certainty if there is a risk of bogus self-employment.
- de: Die Umlagen finanzieren die Erstattung von Entgeltfortzahlung, Mutterschaftsleistungen und das Insolvenzgeld. Die eAU rufst du bei der Krankenkasse ab, meist über das Lohnprogramm.
  en: The levies fund reimbursement of continued pay during illness, maternity benefits and insolvency pay. You retrieve the eAU from the health insurance fund (Krankenkasse), usually via the payroll software.
- de: Die Umsatzsteuer-Identifikationsnummer brauchst du für Geschäfte innerhalb der EU.
  en: You need the VAT identification number for business within the EU.
- de: Die Unfallversicherung für Arbeitsunfälle und Berufskrankheiten in deiner Branche.
  en: The accident insurance for workplace accidents and occupational diseases in your industry.
- de: Die Unterweisung erklärt die Gefährdungen am Arbeitsplatz und die Schutzmaßnahmen aus der Gefährdungsbeurteilung; sie findet während der Arbeitszeit statt, bei der Einstellung vor Aufnahme der Tätigkeit
    (§ 12 Abs. 1 ArbSchG, § 4 Abs. 1 DGUV Vorschrift 1). Rechtlich genügt es, wenn du am ersten Arbeitstag vor Arbeitsbeginn unterweist – Amtlos erinnert dich am Tag davor. Amtlos protokolliert die Unterweisung
    digital; bei Gefahrstoffen und Biostoffen bestätigen die Unterwiesenen sie durch Unterschrift (§ 14 Abs. 2 GefStoffV, § 14 Abs. 3 BioStoffV).
  en: The instruction explains the hazards at the workplace and the protective measures from the risk assessment; it takes place during working hours, on hiring before the work begins (§ 12(1) ArbSchG,
    § 4(1) DGUV Regulation 1). Legally it is enough to instruct on the first working day before work starts – Amtlos reminds you the day before. Amtlos records the instruction digitally; for hazardous substances
    and biological agents, those instructed confirm it by signature (§ 14(2) GefStoffV, § 14(3) BioStoffV).
- de: 'Die Verordnung zur arbeitsmedizinischen Vorsorge unterscheidet Pflichtvorsorge (du veranlasst sie, ohne sie darf die Tätigkeit nicht ausgeübt werden), Angebotsvorsorge (du bietest sie an) und Wunschvorsorge.
    Häufige Anlässe nach dem Anhang der ArbMedVV: Feuchtarbeit von regelmäßig mehr als zwei Stunden je Tag – Angebot, ab vier Stunden – Pflicht (Teil 1 Abs. 2 Nr. 2 Buchst. e, Abs. 1 Nr. 2 Buchst. a); Mehlstaub
    – Angebot bei Einhaltung, Pflicht bei Überschreitung von 4 mg/m³ (Teil 1 Abs. 2 Nr. 2 Buchst. j, Abs. 1 Nr. 2 Buchst. j); Schweißrauch – Angebot bei Einhaltung, Pflicht bei Überschreitung von 3 mg/m³
    (Teil 1 Abs. 2 Nr. 2 Buchst. f, Abs. 1 Nr. 2 Buchst. b); Hartholzstaub (Teil 1 Abs. 1 Nr. 1); Lärm – Angebot ab 80, Pflicht ab 85 dB(A) (Teil 3 Abs. 2 Nr. 1, Abs. 1 Nr. 3); Bildschirmarbeit – Angebot
    (Teil 4 Abs. 2 Nr. 1); Arbeit im Freien mit natürlicher UV-Strahlung von regelmäßig einer Stunde oder mehr je Tag – Angebot (Teil 3 Abs. 2 Nr. 5); Tätigkeiten mit Kontakt zu Blut und Körperflüssigkeiten
    im Gesundheitsdienst, etwa mit Hepatitis-B- und Hepatitis-C-Viren – Pflicht (Teil 2 Abs. 1 Nr. 3). Bei Kosmetik mit Blutkontakt (zum Beispiel Permanent-Make-up, Fußpflege) bewertet der Betriebsarzt
    Vorsorge und Impfangebot. Friseurchemikalien sind außer über die Feuchtarbeit kein eigener Anlass. Über jede Vorsorge führst du eine Vorsorgekartei (§ 3 Abs. 4 ArbMedVV); die Abstände richten sich nach
    der Arbeitsmedizinischen Regel AMR 2.1 – das klärst du mit deinem Betriebsarzt. Die Untersuchung von Nachtarbeitnehmern (§ 6 Abs. 3 ArbZG) und die Untersuchungen Jugendlicher (§§ 32, 33 JArbSchG) sind
    keine Vorsorge nach der ArbMedVV und eigene Pflichten.'
  en: 'The Ordinance on Occupational Health Care distinguishes mandatory preventive care (you arrange it; without it the activity may not be carried out), offered preventive care (you offer it) and requested
    preventive care. Common occasions under the annex of the ArbMedVV: wet work of regularly more than two hours a day – offer, from four hours – mandatory (Part 1(2) no. 2 letter e, (1) no. 2 letter a);
    flour dust – offer if the limit is met, mandatory if 4 mg/m³ is exceeded (Part 1(2) no. 2 letter j, (1) no. 2 letter j); welding fumes – offer if the limit is met, mandatory if 3 mg/m³ is exceeded (Part
    1(2) no. 2 letter f, (1) no. 2 letter b); hardwood dust (Part 1(1) no. 1); noise – offer from 80, mandatory from 85 dB(A) (Part 3(2) no. 1, (1) no. 3); display screen work – offer (Part 4(2) no. 1);
    outdoor work with natural UV radiation of regularly one hour or more a day – offer (Part 3(2) no. 5); work with contact with blood and body fluids in the health service, for example with hepatitis B
    and hepatitis C viruses – mandatory (Part 2(1) no. 3). For cosmetics with blood contact (for example permanent make-up, foot care), the company doctor assesses preventive care and vaccination offers.
    Hairdressing chemicals are not a separate occasion apart from wet work. You keep a preventive care file on every preventive care measure (§ 3(4) ArbMedVV); the intervals follow the Occupational Medicine
    Rule AMR 2.1 – you clarify this with your company doctor. The examination of night workers (§ 6(3) ArbZG) and the examinations of young people (§§ 32, 33 JArbSchG) are not preventive care under the
    ArbMedVV and are separate obligations.'
- de: Die anlassunabhängige Gefährdungsbeurteilung nach dem Mutterschutzgesetz ist Teil der allgemeinen Gefährdungsbeurteilung.
  en: The general risk assessment under the Maternity Protection Act, carried out regardless of any specific occasion, is part of the overall risk assessment.
- de: Dokumentation und Risikomanagement der Produkte sichten
  en: Review the documentation and risk management of your products
- de: Doppelte Buchführung
  en: Double-entry bookkeeping
- de: Du arbeitest im IT-, Agentur- oder Freelancer-Bereich.
  en: You work in IT, as an agency or as a freelancer.
- de: Du arbeitest im Wesentlichen für einen Auftraggeber.
  en: You work mainly for one client.
- de: Du arbeitest überwiegend für einen Auftraggeber.
  en: You mainly work for one client.
- de: Du bekommst Arbeitslosengeld I.
  en: You receive unemployment benefit I (Arbeitslosengeld I).
- de: Du beschäftigst Jugendliche.
  en: You employ young people.
- de: Du beschäftigst Minijobber.
  en: You employ mini-jobbers.
- de: Du beschäftigst mehr als 10 Personen.
  en: You employ more than 10 people.
- de: Du beschäftigst mehr als 20 Personen.
  en: You employ more than 20 people.
- de: Du beschäftigst mindestens eine Person – Leitern, Regale, Maschinen oder andere prüfpflichtige Arbeitsmittel gibt es in fast jedem Betrieb.
  en: You employ at least one person – ladders, racks, machines or other work equipment subject to inspection exist in almost every business.
- de: Du beschäftigst mindestens eine Person – mit dir sind damit in der Regel mindestens zwei Personen anwesend.
  en: You employ at least one person – including you, there are therefore usually at least two people present.
- de: Du beschäftigst mindestens eine Person.
  en: You employ at least one person.
- de: Du betreibst eine Gaststätte.
  en: You run a restaurant or bar.
- de: Du bietest Abos an.
  en: You offer subscriptions.
- de: Du bist im Gründungsjahr.
  en: You are in your founding year.
- de: Du bist nicht zur doppelten Buchführung verpflichtet.
  en: You are not required to use double-entry bookkeeping.
- de: Du bist unsicher, ob NIS2 für dich gilt.
  en: You are unsure whether NIS2 applies to you.
- de: Du bist unsicher, ob deine Tätigkeit ein Gewerbe oder ein freier Beruf ist.
  en: You are unsure whether your activity is a trade or a liberal profession.
- de: Du bringst verpackte Waren in Verkehr.
  en: You place packaged goods on the market.
- de: Du erbringst Bauleistungen.
  en: You provide construction services.
- de: Du führst ein Verzeichnis, welche Daten über Menschen du wofür verarbeitest.
  en: You keep a record of which data about people you process and for what purpose.
- de: Du gehörst zu einer Gruppe von Selbstständigen, die rentenversicherungspflichtig sein kann.
  en: You belong to a group of self-employed people who may be subject to mandatory pension insurance.
- de: Du gibst die Voranmeldung monatlich ab.
  en: You file the advance return monthly.
- de: Du gründest gerade.
  en: You are currently founding a company.
- de: Du hast Beschäftigte.
  en: You have employees.
- de: Du hast Investoren aus dem Ausland.
  en: You have investors from abroad.
- de: Du hast Kunden in anderen EU-Ländern.
  en: You have customers in other EU countries.
- de: Du hast dein Unternehmen im Vorjahr gegründet.
  en: You founded your business in the previous year.
- de: Du hast dein Unternehmen in diesem Jahr gegründet.
  en: You founded your business this year.
- de: Du hast deinen Anmeldezeitraum angegeben.
  en: You have entered your filing period.
- de: Du hast die erste Person eingestellt.
  en: You have hired your first person.
- de: Du hast eine Datenpanne entdeckt.
  en: You have discovered a data breach.
- de: Du hast eine Dauerfristverlängerung.
  en: You have a permanent deadline extension (Dauerfristverlängerung).
- de: Du hast eine Erlaubnis nach § 34c, § 34d oder § 34f GewO.
  en: You have a permit under § 34c, § 34d or § 34f GewO.
- de: Du hast eine Kasse außer Betrieb genommen.
  en: You have decommissioned a cash register.
- de: Du erbringst Bauleistungen für andere Unternehmen.
  en: You provide construction work for other businesses.
- de: Du hast eine Website.
