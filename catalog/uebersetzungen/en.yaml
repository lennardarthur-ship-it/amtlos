  en: Employees above which the information obligation under § 36 VSBG applies
- de: Beschäftigtendaten schützen
  en: Protect employee data
- de: Bestellbutton eindeutig beschriften (Button-Lösung)
  en: Label the order button clearly (button solution)
- de: Bestimmte Selbstständige sind rentenversicherungspflichtig und müssen sich innerhalb von drei Monaten bei der Deutschen Rentenversicherung melden.
  en: Certain self-employed people are subject to mandatory pension insurance and must register with the German Pension Insurance (Deutsche Rentenversicherung) within three months.
- de: Bestimmte Tätigkeiten wie Ärztin, Architekt oder Journalistin, die kein Gewerbe sind.
  en: Certain activities, such as doctor, architect or journalist, that are not a trade.
- de: Betriebe ab 20 Arbeitsplätzen haben eine Beschäftigungsquote. Die Anzeige und die Ausgleichsabgabe sind bis zum 31. März für das Vorjahr fällig.
  en: Businesses with 20 or more workplaces have an employment quota. The report and the compensatory levy are due by 31 March for the previous year.
- de: Betriebsarzt
  en: Company doctor
- de: Betriebsnummer
  en: Establishment number (Betriebsnummer)
- de: Betriebsnummer beantragen
  en: Apply for an establishment number
- de: Betroffen sind etwa Immobilienmakler, Wohnimmobilienverwalter und Versicherungsvermittler. Umfang und Nachweis regelt die jeweilige Vorschrift.
  en: This affects, for example, real estate agents, residential property managers and insurance intermediaries. The scope and proof are set by the relevant regulation.
- de: Betroffene haben unter anderem Rechte auf Auskunft, Berichtigung, Löschung und Widerspruch. Amtlos zeigt die Frist ab Eingang und führt die Anfrage bis zur Antwort.
  en: Data subjects have rights including access, rectification, erasure and objection. Amtlos shows the deadline from receipt and tracks the request until it is answered.
- de: Bevor du Batterien oder Geräte mit Batterien verkaufst, registrierst du dich nach dem Batteriegesetz.
  en: Before you sell batteries or devices with batteries, you register under the Battery Act (BattDG).
- de: Bevor du Elektrogeräte verkaufst, registrierst du dich bei der stiftung ear.
  en: Before you sell electrical devices, you register with stiftung ear.
- de: Bevor du Lebensmittel herstellst, behandelst oder verkaufst, registrierst du deinen Betrieb bei der Lebensmittelüberwachung.
  en: Before you produce, handle or sell food, you register your business with the food control authority (Lebensmittelüberwachung).
- de: Bevor du die erste Person einstellst, brauchst du eine Betriebsnummer von der Bundesagentur für Arbeit.
  en: Before you hire your first person, you need an establishment number (Betriebsnummer) from the Federal Employment Agency (Bundesagentur für Arbeit).
- de: Bevor du verpackte Waren erstmals in Verkehr bringst, registrierst du dich im LUCID-Register und beteiligst dich an einem System.
  en: Before you place packaged goods on the market for the first time, you register in the LUCID register and join a system.
- de: Bevor jemand bei dir arbeitet, schreibst du auf, welche Gefahren es an den Arbeitsplätzen gibt und was du dagegen tust.
  en: Before anyone works for you, you write down what hazards exist at the workplaces and what you do about them.
- de: Bewahre Belege nachvollziehbar und unveränderbar auf und beschreibe in einer Verfahrensdokumentation, wie du das machst.
  en: Keep receipts in a traceable and unalterable way and describe in a process documentation (Verfahrensdokumentation) how you do this.
- de: Bewahre Belege und Rechnungen 8 Jahre, Jahresabschlüsse und Bücher 10 Jahre und Geschäftsbriefe 6 Jahre auf.
  en: Keep receipts and invoices for 8 years, annual financial statements and books for 10 years and business letters for 6 years.
- de: Bis zum 10. nach Ende des Anmeldezeitraums meldest du die Lohnsteuer beim Finanzamt an.
  en: By the 10th after the end of the filing period, you file the wage tax return (Lohnsteuer-Anmeldung) with the tax office (Finanzamt).
- de: Bis zur Änderung gilt § 38 BDSG weiter – Benennung nicht vorschnell aufheben
  en: Until the change, § 38 BDSG continues to apply – do not revoke the appointment prematurely
- de: Buchführungspflicht nach § 141 AO – Gewinngrenze
  en: Mandatory bookkeeping under § 141 AO – profit limit
- de: Buchführungspflicht nach § 141 AO – Umsatzgrenze
  en: Mandatory bookkeeping under § 141 AO – revenue limit
- de: Buchführungspflichtig ist, wer nach dem Handelsgesetzbuch dazu verpflichtet ist oder die Grenzen nach § 141 AO überschreitet (800.000 € Umsatz oder 80.000 € Gewinn). Amtlos erstellt keine Bilanz selbst,
    sondern übergibt an deine Steuerberatung (E-051).
  en: You are required to keep books if the German Commercial Code (HGB) requires it or if you exceed the limits under § 141 AO (€800,000 revenue or €80,000 profit). Amtlos does not prepare a balance sheet
    itself but hands over to your tax adviser (E-051).
- de: 'Buchungsbelege einschließlich Rechnungen: 8 Jahre. Jahresabschlüsse, Bücher und Organisationsunterlagen: 10 Jahre. Handels- und Geschäftsbriefe: 6 Jahre. Amtlos zeigt dir, wann du Unterlagen löschen
    darfst.'
  en: 'Accounting vouchers including invoices: 8 years. Annual financial statements, books and organisational documents: 10 years. Commercial and business letters: 6 years. Amtlos shows you when you may
    delete records.'
- de: Bundesagentur für Arbeit, Betriebsnummern-Service
  en: Federal Employment Agency (Bundesagentur für Arbeit), establishment number service
- de: Bundesamt für Sicherheit in der Informationstechnik (BSI)
  en: Federal Office for Information Security (BSI)
- de: Bundesministerium für Wirtschaft und Klimaschutz
  en: Federal Ministry for Economic Affairs and Climate Action
- de: Bundeszentralamt für Steuern
  en: Federal Central Tax Office (Bundeszentralamt für Steuern)
- de: Bundeszentralamt für Steuern (BZSt)
  en: Federal Central Tax Office (BZSt)
- de: Bußgeld möglich; Haftungsrisiko bei Arbeitsunfällen.
  en: Fine possible; liability risk in case of workplace accidents.
- de: Bußgelder bis 10 Mio. € bzw. 2 % des Umsatzes sind möglich.
  en: Fines of up to €10 million or 2% of revenue are possible.
- de: Damit Amtlos die Termine der Lohnsteuer-Anmeldung berechnen kann, brauchst du den Anmeldezeitraum.
  en: So that Amtlos can calculate the dates for the payroll tax return (Lohnsteuer-Anmeldung), you need the filing period.
- de: Das Arbeitssicherheitsgesetz und die DGUV Vorschrift 2 verlangen eine Betreuung durch eine Fachkraft für Arbeitssicherheit und einen Betriebsarzt. Kleinbetriebe können das Unternehmermodell der Berufsgenossenschaft
    nutzen.
  en: The Occupational Safety Act (Arbeitssicherheitsgesetz) and DGUV Vorschrift 2 require support from an occupational safety specialist and a company doctor. Small businesses can use the employer model
    (Unternehmermodell) of the employers' liability insurance association (Berufsgenossenschaft).
- de: Das BFSG nennt die betroffenen Produkte abschließend. Prüfe, ob deine Produkte dazugehören.
  en: The BFSG lists the affected products exhaustively. Check whether your products are among them.
- de: Das Finanzamt hat Vorauszahlungen festgesetzt.
  en: The tax office has set prepayments.
- de: Das Hinweisgeberschutzgesetz verlangt ab 50 Beschäftigten eine interne Meldestelle.
  en: The Whistleblower Protection Act (HinSchG) requires an internal reporting channel from 50 employees.
- de: Das Impressum nennt unter anderem Name, Anschrift und Kontakt, bei Gesellschaften auch Vertretung und Register. Der Online-Check prüft, ob es verlinkt ist.
  en: The legal notice includes, among other things, name, address and contact details, and for companies also the legal representatives and register details. The online check verifies that it is linked.
- de: Das Kapital, das die Gesellschafter bei der Gründung einer GmbH oder UG mindestens aufbringen.
  en: The minimum capital that the shareholders contribute when founding a GmbH or UG.
- de: Das Nachweisgesetz verlangt, dass die wesentlichen Arbeitsbedingungen dokumentiert und der beschäftigten Person ausgehändigt werden.
  en: The Verification Act (Nachweisgesetz) requires that the essential working conditions are documented and handed to the employee.
- de: Das Verpackungsgesetz verlangt Registrierung bei der Zentralen Stelle Verpackungsregister (LUCID) und Systembeteiligung vor dem ersten Inverkehrbringen.
  en: The Packaging Act (Verpackungsgesetz) requires registration with the Central Agency Packaging Register (Zentrale Stelle Verpackungsregister, LUCID) and system participation before first placing on
    the market.
- de: Das Verzeichnis beschreibt je Verarbeitung Zweck, betroffene Personen, Datenarten, Empfänger und Löschfristen. Amtlos hilft beim Anlegen und erzeugt das Verzeichnis als PDF.
  en: For each processing activity, the record describes the purpose, people affected, types of data, recipients and deletion periods. Amtlos helps you set it up and generates the record as a PDF.
- de: Das Verzeichnis der Handwerkskammer, in dem Handwerksbetriebe eingetragen sind.
  en: The Chamber of Crafts' register in which craft businesses are entered.
- de: Daten deiner Beschäftigten verarbeitest du nur, soweit es für das Arbeitsverhältnis nötig ist.
  en: You process your employees' data only as far as necessary for the employment relationship.
- de: Daten dürfen nur so lange gespeichert werden, wie es für den Zweck nötig ist. Gesetzliche Aufbewahrungspflichten (z. B. für Rechnungen) gehen vor.
  en: Data may only be stored as long as necessary for the purpose. Statutory retention obligations (e.g. for invoices) take precedence.
- de: Datenpanne der Aufsichtsbehörde melden
  en: Report a data breach to the supervisory authority
- de: Datenschutz-Aufsichtsbehörde des Landes
  en: State data protection supervisory authority
- de: Datenschutzbeauftragten benennen
  en: Appoint a data protection officer
- de: Datenschutzerklärung auf der Website
  en: Privacy policy on your website
- de: Dazu gehören Risikoanalyse, Identifizierung der Vertragspartner und Verdachtsmeldungen.
  en: This includes a risk analysis, identifying contracting parties and reporting suspicious activity.
- de: Dazu gehören eine verantwortliche Person, eine Sicherheitsbewertung und eine Produktinformationsdatei.
  en: These include a responsible person, a safety assessment and a product information file.
- de: Dazu gehören unter anderem die Identifizierung der Vertragspartner und ein Risikomanagement. Die Schwelle steht im Gesetz; Amtlos führt sie nach fachlicher Prüfung als Regelwert.
  en: These include, among other things, identifying your contractual partners and risk management. The threshold is set out in the law; Amtlos keeps it as a standard value after expert review.
