titel:
  de: Meldungen der Plattformen an das Finanzamt (DAC7) verstehen
kurz:
  de: Marktplätze melden Verkäufer und Umsätze an das Bundeszentralamt für Steuern – deine Angaben in der Steuererklärung
    sollten dazu passen.
erklaerung:
  de: Nach dem Plattformen-Steuertransparenzgesetz (DAC7) melden Plattformen bestimmte Verkäufer – dich, wenn du im Jahr mindestens 30
    Verkäufe oder 2.000 € Vergütung über die Plattform hattest (§ 4 Abs. 5 Nr. 4 PStTG). Amtlos erklärt, was gemeldet wird.
