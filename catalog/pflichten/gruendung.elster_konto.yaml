# Katalog A.5 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gruendung.elster_konto
version: 2
katalog_nr: A.5
titel:
  de: ELSTER-Konto beantragen
kurz:
  de: 'Beantrage frühzeitig ein ELSTER-Konto, wenn du den Fragebogen selbst abgibst – die Aktivierung kommt per Post und dauert einige Tage.'
erklaerung:
  de: 'Über ELSTER übermittelst du Steuererklärungen und Anmeldungen ans Finanzamt, als Erstes den Fragebogen zur steuerlichen Erfassung, den du elektronisch abgibst (§ 138 Abs. 1b AO). Weil die Aktivierungsdaten per Post kommen, solltest du das Konto früh beantragen. Übernimmt eine Steuerberatung die Übermittlung, gibt sie den Fragebogen für dich ab.'
rechtsgrundlage:
- § 138 Abs. 1b AO (Voraussetzung für die elektronische Übermittlung)
