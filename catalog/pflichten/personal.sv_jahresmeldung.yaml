# Katalog D.38 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.sv_jahresmeldung
version: 4
katalog_nr: D.38
titel:
  de: Jahresmeldung zur Sozialversicherung
kurz:
  de: Für jede beschäftigte Person geht bis zum 15. Februar eine Jahresmeldung für das Vorjahr an die Krankenkasse.
erklaerung:
  de: Die Jahresmeldung übermittelt das Lohnprogramm für alle, die über den Jahreswechsel beschäftigt sind – bis zum 15. Februar
    des Folgejahres (§ 10 DEÜV). Fällt der 15. Februar auf ein Wochenende oder einen Feiertag, reicht der nächste Werktag (§ 26 Abs. 3 SGB X). Die Jahresmeldung zur Unfallversicherung (§ 28a Abs. 2a SGB IV) ist eine eigene Meldung, ebenfalls bis zum 16. Februar.
rechtsgrundlage:
- § 28a SGB IV
- § 10 DEÜV
kategorie: personal
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
