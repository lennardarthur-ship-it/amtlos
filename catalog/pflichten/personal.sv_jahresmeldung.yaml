# Katalog D.38 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.sv_jahresmeldung
version: 3
katalog_nr: D.38
titel:
  de: Jahresmeldung zur Sozialversicherung
kurz:
  de: Für jede beschäftigte Person geht bis zum 15. Februar eine Jahresmeldung für das Vorjahr an die Krankenkasse.
erklaerung:
  de: Die Jahresmeldung übermittelt das Lohnprogramm für alle, die über den Jahreswechsel beschäftigt sind – bis zum 15. Februar
    des Folgejahres (§ 10 DEÜV). Die Jahresmeldung zur Unfallversicherung ist eine eigene Meldung.
rechtsgrundlage:
- § 28a SGB IV
- § 10 DEÜV
kategorie: personal
