    de: 'Bußgeld bis 25.000 €, wenn die Meldung nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig erstattet wird (§ 111 Abs. 1 Nr. 2, Abs. 4 SGB IV).'
