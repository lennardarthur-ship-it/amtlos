katalog_nr: A.13
titel:
  de: Gründungszuschuss beantragen
kurz:
  de: Wenn du Arbeitslosengeld I bekommst, kannst du einen Gründungszuschuss beantragen – vor dem Start.
erklaerung:
  de: 'Der Gründungszuschuss ist eine Förderung der Agentur für Arbeit. Er muss vor Beginn der Selbstständigkeit beantragt werden. Voraussetzung ist unter anderem ein Restanspruch auf Arbeitslosengeld I von mindestens 150 Tagen (§ 93 Abs. 2 Nr. 1 SGB III).'
rechtsgrundlage:
- § 93 SGB III
kategorie: gruendung
