  - feld: profil.alg1_bezug
    op: ==
    wert: true
    label:
      de: Du bekommst Arbeitslosengeld I.
  - feld: abgeleitet.noch_nicht_gestartet
    op: ==
    wert: true
    label:
      de: Deine Selbstständigkeit hat noch nicht begonnen.
