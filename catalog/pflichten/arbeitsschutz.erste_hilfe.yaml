# Katalog E.53 · Startbestand aus Spezifikation Abschnitt 4 (E-054); Prüfergebnis Sifa 22.10.2026 (C Katalog E.53): geteilt in
# Erste-Hilfe-Organisation (arbeitsschutz.erste_hilfe_organisation), Ersthelfer (diese Pflicht) und Brandschutzhelfer (arbeitsschutz.brandschutzhelfer)
schema_version: 1
id: arbeitsschutz.erste_hilfe
version: 3
katalog_nr: E.53
titel:
  de: Ersthelfer bestimmen und fortbilden
kurz:
  de: Sind bei der Arbeit mindestens zwei Personen anwesend, sorgst du für ausgebildete Ersthelfer und lässt sie alle zwei Jahre fortbilden.
erklaerung:
  de: 'Bei 2 bis 20 anwesenden Versicherten brauchst du mindestens einen Ersthelfer, bei mehr Anwesenden 5 Prozent in Verwaltungs- und Handelsbetrieben und 10 Prozent in sonstigen Betrieben (§ 26 Abs. 1 DGUV Vorschrift 1). Ersthelfer werden bei einer von der BG ermächtigten Stelle ausgebildet und in der Regel alle zwei Jahre fortgebildet (§ 26 Abs. 2, 3 DGUV Vorschrift 1); die Kosten der Lehrgänge trägt meist die BG. Als Inhaberin oder Inhaber zählst du nur mit, wenn du selbst versichert bist – Amtlos zählt vorsichtshalber alle Anwesenden, also schon ab der ersten beschäftigten Person. Plane Vertretungen für Urlaub, Krankheit und Schichten ein. Verbandkasten, Notruf-Aushang und Verbandbuch sind eine eigene Pflicht, Brandschutzhelfer ebenfalls.'
rechtsgrundlage:
- § 26 DGUV Vorschrift 1
kategorie: arbeitsschutz
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person – mit dir sind damit in der Regel mindestens zwei Personen anwesend.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
