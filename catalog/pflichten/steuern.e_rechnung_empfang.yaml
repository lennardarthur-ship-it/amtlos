# Katalog C.30 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht 22.10.2026 umgesetzt
schema_version: 1
id: steuern.e_rechnung_empfang
version: 4
katalog_nr: C.30
titel:
  de: E-Rechnungen empfangen können
kurz:
  de: Seit 2025 müssen Unternehmen elektronische Rechnungen (XRechnung, ZUGFeRD) von anderen Unternehmen empfangen können.
erklaerung:
  de: Eine E-Rechnung ist ein strukturierter Datensatz. Eine PDF-Rechnung ist keine E-Rechnung. Für den Empfang genügt ein
    E-Mail-Postfach (BMF-Schreiben vom 15.10.2024). Das gilt für alle Unternehmen, auch für Kleinunternehmer.
begriffe:
- begriff:
    de: E-Rechnung
  erklaerung:
    de: Eine Rechnung als strukturierter Datensatz, den Software automatisch lesen kann.
