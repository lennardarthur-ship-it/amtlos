# Katalog F.62 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.beschaeftigtendaten
version: 4
katalog_nr: F.62
titel:
  de: Beschäftigtendaten schützen
kurz:
  de: Daten deiner Beschäftigten verarbeitest du nur, soweit es für das Arbeitsverhältnis nötig ist.
erklaerung:
  de: 'Daten deiner Beschäftigten verarbeitest du, soweit es für die Durchführung des Arbeitsvertrags erforderlich ist oder ein Gesetz es verlangt, zum Beispiel für Lohn, Sozialversicherung und Steuer. Gesundheitsdaten wie Krankmeldungen oder die elektronische Arbeitsunfähigkeitsbescheinigung verarbeitest du, soweit du sie für deine Pflichten aus dem Arbeitsrecht und dem Recht der sozialen Sicherheit brauchst (Art. 9 Abs. 2 Buchst. b DSGVO). Amtlos selbst speichert nur das Nötigste (Name, Beschäftigungsart, Eintritt und Austritt).'
rechtsgrundlage:
- Art. 6 Abs. 1 lit. b DSGVO
- Art. 6 Abs. 1 lit. c DSGVO
- Art. 9 Abs. 2 lit. b DSGVO
kategorie: datenschutz
ausloeser:
  any:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - feld: profil.datenverarbeitung.arten
    op: enthaelt
    wert: beschaeftigtendaten
    label:
      de: Du verarbeitest Daten von Beschäftigten.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 20 Mio. € oder bei Unternehmen bis 4 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, wenn Daten ohne Rechtsgrundlage oder entgegen den Grundsätzen der Verarbeitung verarbeitet werden (Art. 83 Abs. 5 Buchst. a DSGVO in Verbindung mit Art. 5, 6 DSGVO).'
  schwere: niedrig
automatisierung: hinweis
aenderungsnotiz:
  de: 'Rechtsgrundlage umgestellt: Art. 6 Abs. 1 lit. b und c DSGVO statt § 26 BDSG (EuGH, Urteil vom 30.03.2023, C-34/21).'
