titel:
  de: Gefährdungsbeurteilung je Gewerk und Einsatzort ergänzen
kurz:
  de: Im Handwerk ergänzt du die Gefährdungsbeurteilung um die Gefährdungen deines Gewerks – in der Werkstatt und bei Arbeiten beim Kunden.
erklaerung:
  de: 'Das ist keine zweite Gefährdungsbeurteilung, sondern ein Teil der einen: Du konkretisierst sie je Gewerk und Tätigkeit – etwa für Maschinen, Hebebühnen, Stäube, Abgase, Lärm und Gefahrstoffe in der Werkstatt und für Arbeiten auf Baustellen oder in Wohnungen beim Kunden. Die Handlungshilfen deiner Berufsgenossenschaft helfen dabei. Eine eigene Frist gibt es nicht: Wie die Gefährdungsbeurteilung muss die Ergänzung vor Aufnahme der Tätigkeit beim Kunden bzw. im Gewerk vorliegen.'
