# Prüfvermerk Rechtsanwalt 22.10.2026 (H.5, branche.transport_erlaubnis): „Personenbeförderung (PBefG) eigener Auslöser“
# Wortlaut gelesen am 22.10.2026: § 1 Abs. 1, 2, § 2 Abs. 1 Satz 1, § 61 Abs. 1 Nr. 1, Abs. 2 PBefG (gesetze-im-internet.de)
schema_version: 1
id: branche.personenbefoerderung_genehmigung
version: 2
katalog_nr: H.5
titel:
  de: Genehmigung für die Personenbeförderung
kurz:
  de: Wer Personen entgeltlich oder geschäftsmäßig mit Kraftfahrzeugen befördert – etwa mit Taxi, Mietwagen oder Bus –, braucht eine Genehmigung nach dem Personenbeförderungsgesetz.
erklaerung:
  de: 'Das Personenbeförderungsgesetz gilt für die entgeltliche oder geschäftsmäßige Beförderung von Personen; als Entgelt zählen auch wirtschaftliche Vorteile (§ 1 Abs. 1 PBefG). Wer mit Kraftfahrzeugen im Linienverkehr oder im Gelegenheitsverkehr – dazu gehören Taxi- und Mietwagenverkehr – Personen befördert, muss eine Genehmigung haben (§ 2 Abs. 1 Satz 1 PBefG). Ausgenommen sind Fahrten mit Personenkraftwagen, die unentgeltlich sind oder deren Gesamtentgelt je Kilometer den Betrag nach § 5 Abs. 2 Satz 1 des Bundesreisekostengesetzes nicht übersteigt (§ 1 Abs. 2 PBefG). Weitere Fälle stellt die Freistellungs-Verordnung frei, zum Beispiel die unentgeltliche Beförderung von Beschäftigten durch den Arbeitgeber zu betrieblichen Zwecken zwischen Arbeitsstätten desselben Betriebs (§ 1 Nr. 4 Buchst. h FrStllgV). Die Genehmigung beantragst du vor dem Start bei der Genehmigungsbehörde deines Landes, meist beim Landkreis oder bei der kreisfreien Stadt. Wer Taxi oder Mietwagen fährt, braucht außerdem eine Fahrerlaubnis zur Fahrgastbeförderung (§ 48 Abs. 1 FeV); als Halter darfst du die Fahrt ohne sie nicht anordnen oder zulassen (§ 48 Abs. 7 FeV).'
rechtsgrundlage:
