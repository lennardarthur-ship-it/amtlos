# Prüfvermerk RA Dr. Weber 22.10.2026 (H.5, branche.transport_erlaubnis): „Personenbeförderung (PBefG) eigener Auslöser“
# Wortlaut gelesen am 22.10.2026: § 1 Abs. 1, 2, § 2 Abs. 1 Satz 1, § 61 Abs. 1 Nr. 1, Abs. 2 PBefG (gesetze-im-internet.de)
schema_version: 1
id: branche.personenbefoerderung_genehmigung
version: 1
katalog_nr: H.5
titel:
  de: Genehmigung für die Personenbeförderung
kurz:
  de: Wer Personen entgeltlich oder geschäftsmäßig mit Kraftfahrzeugen befördert – etwa mit Taxi, Mietwagen oder Bus –, braucht eine Genehmigung nach dem Personenbeförderungsgesetz.
erklaerung:
  de: 'Das Personenbeförderungsgesetz gilt für die entgeltliche oder geschäftsmäßige Beförderung von Personen; als Entgelt zählen auch wirtschaftliche Vorteile (§ 1 Abs. 1 PBefG). Wer mit Kraftfahrzeugen im Linienverkehr oder im Gelegenheitsverkehr – dazu gehören Taxi- und Mietwagenverkehr – Personen befördert, muss eine Genehmigung haben (§ 2 Abs. 1 Satz 1 PBefG). Ausgenommen sind Fahrten mit Personenkraftwagen, die unentgeltlich sind oder deren Gesamtentgelt je Kilometer den Betrag nach § 5 Abs. 2 Satz 1 des Bundesreisekostengesetzes nicht übersteigt (§ 1 Abs. 2 PBefG). Die Genehmigung beantragst du vor dem Start bei der zuständigen Genehmigungsbehörde deines Landes.'
