# StB-Prüfung Heckler und Busch (21.10.2026, Abschnitt 5.2, C-9, Frage 14): OSS-Erklärung als Pflicht mit Frist
# StB-Durchsicht Busch 22.10.2026 umgesetzt: OSS ist ein Wahlrecht; Kleinunternehmer nicht ausgeschlossen
schema_version: 1
id: steuern.oss_erklaerung
version: 2
katalog_nr: C.36
titel:
  de: OSS-Erklärung beim Bundeszentralamt für Steuern abgeben
kurz:
  de: Verkaufst du an Privatpersonen in anderen EU-Ländern über der Lieferschwelle von 10.000 €, meldest du diese Umsätze vierteljährlich im One-Stop-Shop (oder registrierst dich in jedem Land) – bis zum Ende des Monats nach dem Quartal.
erklaerung:
  de: >-
    Fernverkäufe von Waren und bestimmte Leistungen (z. B. digitale Leistungen) an Privatpersonen in anderen EU-Ländern
    sind im Bestimmungsland steuerbar, sobald sie EU-weit im Vorjahr oder im laufenden Jahr zusammen 10.000 € netto
    übersteigen (§ 3c Abs. 4 UStG) – oder wenn du auf die Schwelle verzichtest. Darunter bleibt der Ort in Deutschland.
    Das One-Stop-Shop-Verfahren (OSS) ist ein Wahlrecht: Nutzt du es, meldest du diese Umsätze je Land und Steuersatz
    beim Bundeszentralamt für Steuern; nutzt du es nicht, musst du dich in jedem Bestimmungsland registrieren. Die
    Teilnahme zeigst du vorher über das BZStOnline-Portal an. Erklärung und Zahlung sind bis zum letzten Tag des Monats
    nach Ablauf des Quartals fällig (§ 18j Abs. 4 UStG); die Frist verschiebt sich nicht auf den nächsten Werktag.
    OSS-Umsätze gehören nicht in die deutsche Umsatzsteuer-Voranmeldung. Auch als Kleinunternehmer: § 19 UStG gilt nur
    für Umsätze im Inland – Fernverkäufe über 10.000 € sind im Bestimmungsland steuerpflichtig. Ob du über der Schwelle
    liegst, ergibt sich aus deinen Umsätzen – Amtlos fragt die Höhe nicht ab. Amtlos stellt die Umsätze aus Rechnungen
    mit „OSS“ je Land und Steuersatz zusammen; du übermittelst selbst.
rechtsgrundlage:
- § 3c UStG
- § 16 Abs. 1d UStG
- § 18j UStG
kategorie: steuern
