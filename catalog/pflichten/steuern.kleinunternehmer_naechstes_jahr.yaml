# R10: neu (Nutzertest Freiberuf: Vorjahr unter 25.000 €, laufendes Jahr darüber, aber höchstens 100.000 € – ab 1.1. des Folgejahres Regelbesteuerung, § 19 Abs. 1 UStG)
# StB-Durchsicht Busch 22.10.2026 umgesetzt; Auslöser seit v4 nach Zahlungseingängen (vereinnahmte Entgelte)
# v5 (StB Busch, Runde 2): nur tatsächliche Zahlungseingänge ohne offene Rechnungen (finanzen.umsatz.bezahlt_*), steuerfreie Umsätze herausgerechnet
schema_version: 1
id: steuern.kleinunternehmer_naechstes_jahr
version: 6
katalog_nr: C.23
titel:
  de: Ab 1. Januar Regelbesteuerung
kurz:
  de: Nach deinen Angaben liegt dein Umsatz in diesem Jahr über 25.000 €. Nach § 19 UStG gilt die Kleinunternehmerregelung dann bis zum Jahresende weiter, ab 1. Januar des nächsten Jahres ist die Regelbesteuerung vorgesehen.
erklaerung:
  de: 'Die Kleinunternehmerregelung setzt voraus, dass dein Umsatz im Vorjahr höchstens 25.000 € betrug. Überschreitest du diese
    Grenze in diesem Jahr, ohne über 100.000 € zu kommen, gilt die Regelung bis zum Jahresende weiter. Ab 1. Januar weist du auf
    deinen Rechnungen Umsatzsteuer aus, gibst Umsatzsteuer-Voranmeldungen und die Umsatzsteuer-Jahreserklärung ab und kannst die
    Vorsteuer aus deinen Eingangsrechnungen abziehen. Wie oft du die Voranmeldung abgibst, legt das Finanzamt nach der voraussichtlichen
    Steuer fest – bei mehr als 9.000 € monatlich, sonst vierteljährlich (§ 18 Abs. 2 UStG); es steht im Schreiben des Finanzamts.
    Hast du als Kleinunternehmer Wirtschaftsgüter angeschafft, die du weiter nutzt, kann beim Wechsel eine Berichtigung der Vorsteuer
    in Frage kommen (§ 15a UStG). Maßgeblich für die Grenze ist der Umsatz nach vereinnahmten Entgelten (netto, nach Zahlungseingang),
    nicht die Summe der Rechnungen nach Rechnungsdatum. Amtlos zählt dafür nur Geld, das du schon bekommen hast – die Zahlungseingänge
    auf deine Rechnungen in Amtlos (netto), deine Kasseneinnahmen laut Tagesabschlüssen und deine Sachentnahmen; Leistungen an
    Unternehmen im Ausland zählen nicht mit. Rechnungen ohne vermerkten Zahlungseingang zählen hier nicht – vermerke deine
    Zahlungseingänge, sonst ist der Wert zu niedrig. Steuerfreie Umsätze (z. B. Heilbehandlungen) rechnet Amtlos heraus, wenn du sie
    auf der Rechnung mit „0 % / steuerfrei“ und dem Hinweis auf die Steuerbefreiung erfasst. Verkäufe von Anlagegütern zählen nicht
    zur Grenze – erfasst du sie als Rechnung, kann der angezeigte Wert zu hoch sein. Einnahmen außerhalb von Amtlos sind nicht
    enthalten. Stelle Rechnungsvorlage, Preise und Buchhaltung rechtzeitig um.'
rechtsgrundlage:
- § 19 Abs. 1 UStG
- Abschn. 19.2 Abs. 3, 4 UStAE (Fassung vom 18.03.2025)
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: true
    label:
      de: Du nutzt die Kleinunternehmerregelung.
  - feld: abgeleitet.ist_gruendungsjahr
    op: ==
    wert: false
  - feld: abgeleitet.noch_nicht_gestartet
    op: ==
    wert: false
  - feld: profil.umsatz.vorjahr
    op: <=
    wert:
      regelwert: steuern.ustg19.grenze_vorjahr
    label:
      de: Dein Umsatz im Vorjahr lag höchstens bei 25.000 €.
  - not:
      all:
      - feld: finanzen.umsatz.bezahlt_vorjahr
        op: vorhanden
      - feld: finanzen.umsatz.bezahlt_vorjahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_vorjahr
  - any:
    - all:
      - feld: profil.umsatz.prognose_laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_vorjahr
        label:
          de: Dein erwarteter Umsatz in diesem Jahr liegt über 25.000 €.
      - feld: profil.umsatz.prognose_laufendes_jahr
        op: <=
        wert:
          regelwert: steuern.ustg19.grenze_laufendes_jahr
    - all:
      - feld: finanzen.umsatz.bezahlt_laufendes_jahr
        op: vorhanden
      - feld: finanzen.umsatz.bezahlt_laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_vorjahr
        label:
          de: Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) liegen in diesem Jahr über 25.000 €; die Grenze liegt bei 25.000 €.
      - feld: finanzen.umsatz.bezahlt_laufendes_jahr
        op: <=
        wert:
          regelwert: steuern.ustg19.grenze_laufendes_jahr
