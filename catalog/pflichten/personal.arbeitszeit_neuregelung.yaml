# Katalog D.42 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: Referentenentwurf BMAS (Juni 2026) in der Ressortabstimmung, kein Kabinettsbeschluss
# Freigabe RA Dr. Weber 22.10.2026: als Entwurf/Radar korrekt; keine Angaben zu Fristen bestätigbar, solange kein Kabinettsbeschluss vorliegt – vor dem Launch Stand prüfen
# Offen (Produkt, kein Prüfpunkt): Schwelle 10 als Regelwert führen, sobald beschlossen
schema_version: 1
id: personal.arbeitszeit_neuregelung
version: 3
katalog_nr: D.42
titel:
  de: Elektronische Arbeitszeiterfassung (geplante Neuregelung)
kurz:
  de: Geplant ist eine Pflicht zur elektronischen Arbeitszeiterfassung, mit Übergangsfristen nach Betriebsgröße.
erklaerung:
  de: 'Nach dem Entwurf des Bundesarbeitsministeriums (Juni 2026) sollen Beginn, Ende und Dauer der Arbeitszeit taggleich und elektronisch erfasst werden, geplant ab 1.1.2027. Für die elektronische Form sind Übergangsfristen nach Betriebsgröße vorgesehen (unter 250 Beschäftigten zwei Jahre, unter 50 Beschäftigten fünf Jahre); Betriebe mit bis zu 10 Beschäftigten müssen aufzeichnen, aber nicht elektronisch. Stand: Oktober 2026 – noch offen: Der Entwurf wird innerhalb der Bundesregierung abgestimmt, ein Kabinettsbeschluss liegt nicht vor. Ob der Termin 1.1.2027 hält, ist unsicher.'
