# Katalog D.45 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.schwerbehinderte_anzeige
version: 2
katalog_nr: D.45
titel:
  de: Anzeige und Ausgleichsabgabe (Schwerbehinderte)
kurz:
  de: Ab 20 Arbeitsplätzen zeigst du jedes Jahr bis 31.3. die Beschäftigung schwerbehinderter Menschen an und zahlst gegebenenfalls
    die Ausgleichsabgabe.
erklaerung:
  de: Betriebe ab 20 Arbeitsplätzen haben eine Beschäftigungsquote. Die Anzeige und die Ausgleichsabgabe sind bis zum 31. März für das Vorjahr fällig. Als Arbeitsplätze zählen Stellen von Arbeitnehmern und Auszubildenden; Stellen mit weniger als 18 Wochenstunden – oft Minijobs – und Stellen für höchstens acht Wochen zählen nicht (§ 156 Abs. 1, 3 SGB IX). Teilzeitstellen ab 18 Stunden zählen voll, Ausbildungsstellen bleiben bei der Mindestzahl außer Betracht (§ 157 Abs. 1 SGB IX). Wer insgesamt weniger als 20 Personen beschäftigt, liegt sicher unter der Schwelle.
rechtsgrundlage:
- § 154 SGB IX
- §§ 156, 157 SGB IX
- § 163 SGB IX
kategorie: personal
ausloeser:
  all:
  - feld: profil.beschaeftigte.gesamt
    op: '>='
    wert:
      regelwert: personal.schwerbehinderte.schwelle_arbeitsplaetze
  - feld: abgeleitet.beschaeftigte.arbeitsplaetze_sgb9
    op: '>='
    wert:
      regelwert: personal.schwerbehinderte.schwelle_arbeitsplaetze
    label:
      de: Du hast mindestens 20 Arbeitsplätze im Sinne des SGB IX.
