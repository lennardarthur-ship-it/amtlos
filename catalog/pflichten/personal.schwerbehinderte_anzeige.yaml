fachlich_zu_pruefen:
- Quote und Höhe der Abgabe als Regelwerte
- Verschiebung bei 31.3. am Wochenende
- Folgen bei Nichterfüllung nicht in der Spezifikation genannt – Sanktion fachlich ergänzen
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
- 'Vorprüfung 21.10.2026 (G-05/T-16): Zählweise nach § 156 Abs. 1, 3 SGB IX (gelesen) – unter 18 Wochenstunden und bis acht Wochen zählen nicht; Teilzeit ab 18 Std. voll, nicht anteilig (der Prüfbericht nennt „Teilzeit anteilig“ – das gilt für § 23 KSchG, nicht für das SGB IX). Ausbildungsstellen nach § 157 Abs. 1 SGB IX nicht abgerufen. Die App zählt keine Arbeitsplätze (abgeleitet.beschaeftigte.arbeitsplaetze_sgb9 bleibt unbekannt), die Zahl der Beschäftigten dient nur als Obergrenze – bestätigen; Einzelvorschriften §§ 154, 163 SGB IX ohne Abruf zugeordnet'
