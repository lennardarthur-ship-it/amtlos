# Katalog D.45 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Quote und Beträge der Ausgleichsabgabe (jährlich nach der Bezugsgröße) als Regelwerte pflegen
schema_version: 1
id: personal.schwerbehinderte_anzeige
version: 4
katalog_nr: D.45
titel:
  de: Anzeige und Ausgleichsabgabe (Schwerbehinderte)
kurz:
  de: Ab 20 Arbeitsplätzen zeigst du jedes Jahr bis 31.3. die Beschäftigung schwerbehinderter Menschen an und zahlst gegebenenfalls
    die Ausgleichsabgabe.
erklaerung:
  de: Betriebe ab 20 Arbeitsplätzen beschäftigen auf mindestens 5 % der Arbeitsplätze schwerbehinderte Menschen (§ 154 Abs. 1 SGB IX); sonst zahlen sie eine nach der Erfüllung der Quote gestaffelte Ausgleichsabgabe (§ 160 Abs. 2 SGB IX). Die Anzeige und die Ausgleichsabgabe sind bis zum 31. März für das Vorjahr fällig (§ 163 Abs. 2 SGB IX); fällt der Tag auf ein Wochenende oder einen Feiertag, reicht der nächste Werktag (§ 26 Abs. 3 SGB X). Als Arbeitsplätze zählen Stellen von Arbeitnehmern und Auszubildenden; Stellen mit weniger als 18 Wochenstunden – oft Minijobs – und Stellen für höchstens acht Wochen zählen nicht (§ 156 Abs. 1, 3 SGB IX). Teilzeitstellen ab 18 Stunden zählen voll, Ausbildungsstellen bleiben bei der Mindestzahl außer Betracht (§ 157 Abs. 1 SGB IX). Wer insgesamt weniger als 20 Personen beschäftigt, liegt sicher unter der Schwelle.
rechtsgrundlage:
- § 154 SGB IX
- §§ 156, 157 SGB IX
- § 160 SGB IX
- § 163 SGB IX
kategorie: personal
ausloeser:
  all:
  - feld: profil.beschaeftigte.gesamt
    op: '>='
    wert:
      regelwert: personal.schwerbehinderte.schwelle_arbeitsplaetze
  - feld: abgeleitet.beschaeftigte.arbeitsplaetze_sgb9
    op: '>='
    wert:
      regelwert: personal.schwerbehinderte.schwelle_arbeitsplaetze
    label:
      de: Du hast mindestens 20 Arbeitsplätze im Sinne des SGB IX.
frist:
  typ: wiederkehrend
  rhythmus: jaehrlich
  faellig:
    art: feste_termine
    termine:
    - 03-31
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
wiederholung:
  art: periodisch
stelle:
  de: Agentur für Arbeit / Integrationsamt
kanal: portal
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 10.000 €, wenn die Anzeige nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig erstattet wird (§ 238 Abs. 1 Nr. 3, Abs. 2 SGB IX). Für eine nicht rechtzeitig gezahlte Ausgleichsabgabe fällt ein Säumniszuschlag an (§ 160 Abs. 4 S. 2 SGB IX).'
  schwere: hoch
automatisierung: hinweis
