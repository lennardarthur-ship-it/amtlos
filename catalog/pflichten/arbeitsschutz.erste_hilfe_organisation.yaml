# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Erste-Hilfe-Organisation ab 1 Beschäftigtem“): Abspaltung aus E.53
schema_version: 1
id: arbeitsschutz.erste_hilfe_organisation
version: 1
katalog_nr: E.53
titel:
  de: Erste Hilfe organisieren
kurz:
  de: Ab der ersten beschäftigten Person hältst du Verbandkasten, Notruf-Aushang und ein Verbandbuch bereit.
erklaerung:
  de: 'Du sorgst dafür, dass bei einem Unfall sofort Hilfe geholt werden kann und Erste Hilfe geleistet wird (§ 24 DGUV Vorschrift 1, § 10 ArbSchG): Erste-Hilfe-Material in ausreichender Menge, gut erreichbar und gekennzeichnet – Art und Zahl der Verbandkästen richten sich nach der Zahl der Beschäftigten und der Gefährdung (§ 25 DGUV Vorschrift 1, ASR A4.3). Ein Aushang nennt Notruf, Ersthelfer und das Verhalten bei Unfällen (§ 24 Abs. 5 DGUV Vorschrift 1). Jede Erste-Hilfe-Leistung wird dokumentiert, zum Beispiel im Verbandbuch, und die Dokumentation fünf Jahre lang vertraulich aufbewahrt (§ 24 Abs. 6 DGUV Vorschrift 1). Ersthelfer sind eine eigene Pflicht.'
rechtsgrundlage:
- §§ 24, 25 DGUV Vorschrift 1
- ASR A4.3
- § 10 Abs. 1 ArbSchG
