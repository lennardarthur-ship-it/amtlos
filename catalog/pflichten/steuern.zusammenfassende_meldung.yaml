# Katalog C.25 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.zusammenfassende_meldung
version: 5
katalog_nr: C.25
titel:
  de: Zusammenfassende Meldung abgeben
kurz:
  de: Wenn du Lieferungen oder Leistungen an Unternehmen in anderen EU-Ländern erbringst, meldest du sie bis zum 25. nach Ablauf des Meldezeitraums in der Zusammenfassenden Meldung.
erklaerung:
  de: Die Zusammenfassende Meldung ist bei innergemeinschaftlichen Leistungen an Unternehmen (B2B) abzugeben. Du übermittelst sie
    bis zum 25. Tag nach Ablauf jedes Kalendermonats an das Bundeszentralamt für Steuern. Vierteljährlich reicht, wenn deine
    innergemeinschaftlichen Lieferungen je Quartal höchstens 50.000 € betragen; erbringst du nur sonstige Leistungen (keine
    Warenlieferungen), meldest du immer vierteljährlich. Kleinunternehmer geben keine Zusammenfassende Meldung ab (§ 18a Abs. 4 UStG).
    Amtlos rechnet bei Warenlieferungen mit dem monatlichen Termin. Ändert sich die Bemessungsgrundlage später (z. B. Skonto
    oder Rücksendung), berichtigst du die Meldung für den ursprünglichen Zeitraum innerhalb eines Monats (§ 18a Abs. 10 UStG).
    Amtlos stellt die Beträge je USt-IdNr. aus deinen Rechnungen zusammen (Vorlage „Zusammenfassende Meldung“); du übermittelst selbst.
rechtsgrundlage:
- § 18a UStG
kategorie: steuern
ausloeser:
  all:
