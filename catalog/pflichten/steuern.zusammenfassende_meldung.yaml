katalog_nr: C.25
titel:
  de: Zusammenfassende Meldung abgeben
kurz:
  de: Wenn du Leistungen an Unternehmen in anderen EU-Ländern erbringst, meldest du sie in der Zusammenfassenden Meldung.
erklaerung:
  de: Die Zusammenfassende Meldung ist bei innergemeinschaftlichen Leistungen an Unternehmen (B2B) abzugeben. Du übermittelst sie
    bis zum 25. Tag nach Ablauf jedes Kalendermonats an das Bundeszentralamt für Steuern. Vierteljährlich reicht, wenn deine
    innergemeinschaftlichen Lieferungen je Quartal höchstens 50.000 € betragen.
