# Katalog C.25 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.zusammenfassende_meldung
version: 6
katalog_nr: C.25
titel:
  de: Zusammenfassende Meldung abgeben
kurz:
  de: Wenn du Lieferungen oder Leistungen an Unternehmen in anderen EU-Ländern erbringst, meldest du sie bis zum 25. nach Ablauf des Meldezeitraums in der Zusammenfassenden Meldung.
erklaerung:
  de: Die Zusammenfassende Meldung ist bei innergemeinschaftlichen Leistungen an Unternehmen (B2B) abzugeben. Du übermittelst sie
    bis zum 25. Tag nach Ablauf des Meldezeitraums an das Bundeszentralamt für Steuern. Bei Warenlieferungen ist der Kalendermonat
    die Regel; vierteljährlich darfst du melden, wenn deine innergemeinschaftlichen Lieferungen weder im laufenden noch in einem
    der vier vorangegangenen Quartale jeweils 50.000 € übersteigen (§ 18a Abs. 1 Satz 2 UStG). Erbringst du nur sonstige Leistungen
    (keine Warenlieferungen), meldest du vierteljährlich. Amtlos fragt deshalb nach deinem Meldezeitraum. Fällt der 25. auf ein
    Wochenende oder einen Feiertag, nennt Amtlos trotzdem den 25. – ob sich die Frist verschiebt, ist nicht abschließend geklärt.
    Kleinunternehmer geben keine Zusammenfassende Meldung ab (§ 18a Abs. 4 UStG). Ändert sich die Bemessungsgrundlage später
    (z. B. Skonto oder Rücksendung), berichtigst du die Meldung für den ursprünglichen Zeitraum innerhalb eines Monats (§ 18a
    Abs. 10 UStG). Amtlos stellt die Beträge je USt-IdNr. aus deinen Rechnungen zusammen (Vorlage „Zusammenfassende Meldung“);
    du übermittelst selbst.
rechtsgrundlage:
- § 18a UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: false
    label:
      de: Du nutzt die Kleinunternehmerregelung nicht.
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2b
    label:
      de: Du verkaufst an Unternehmen.
  - feld: profil.kunden.regionen
    op: enthaelt
    wert: eu
    label:
      de: Du hast Kunden in anderen EU-Ländern.
frist:
  typ: wiederkehrend
  # StB Busch 22.10.2026: Meldezeitraum abfragen – monatlich als Regel, vierteljährlich wählbar bis 50.000 € je Quartal
  # (§ 18a Abs. 1 Satz 2 UStG), nur sonstige Leistungen vierteljährlich. Mit Warenlieferungen ohne Angabe fragt Amtlos nach.
  rhythmus:
    waehle:
    - wenn:
        all:
        - feld: profil.ust.zm_meldezeitraum
          op: vorhanden
        - feld: profil.ust.zm_meldezeitraum
          op: in
          wert:
          - quartalsweise
          - keine_warenlieferungen
      dann: quartalsweise
    - wenn:
        all:
        - feld: profil.ust.zm_meldezeitraum
          op: vorhanden
        - feld: profil.ust.zm_meldezeitraum
          op: ==
          wert: monatlich
      dann: monatlich
    - wenn:
        all:
        - feld: profil.produkte.arten
          op: enthaelt_eines
          wert:
          - physisch
          - verpackung
          - elektrogeraete
          - batterien
          - lebensmittel
          - kosmetik
        # ohne Angabe zum Meldezeitraum offen (Rückfrage); „weiß ich nicht“ ⇒ monatlich als Regel
        - feld: profil.ust.zm_meldezeitraum
          op: ==
          wert: unklar
      dann: monatlich
    sonst: quartalsweise
  faellig:
    art: tag_nach_periodenende
    monate_nach: 1
    tag: 25
  # StB Busch 22.10.2026: ob das BZSt die Frist nach § 108 Abs. 3 AO verschiebt, ist nicht abschließend geklärt – den 25. nennen
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
wiederholung:
  art: periodisch
stelle:
  de: Bundeszentralamt für Steuern
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 5.000 €, wenn die Zusammenfassende Meldung nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig abgegeben oder nicht rechtzeitig berichtigt wird (§ 26a Abs. 2 Nr. 5, Abs. 3 UStG).'
  schwere: mittel
automatisierung: formular_vorausfuellen
aenderungsnotiz:
  de: 'Amtlos fragt jetzt nach deinem Meldezeitraum (monatlich oder vierteljährlich) und nennt immer den 25. als Termin, ohne Verschiebung auf den nächsten Werktag.'
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
