# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt bis auf den Auslöser (Zahlungseingänge)
schema_version: 1
id: steuern.kleinunternehmer_grenze_ueberschritten
version: 4
katalog_nr: C.23
titel:
  de: 'Kleinunternehmergrenze überschritten: Umsatzsteuer prüfen'
kurz:
  de: Nach deinen Angaben liegt dein Umsatz über einer Kleinunternehmergrenze. Überschreitest du im laufenden Jahr 100.000 € (im Gründungsjahr 25.000 €), ist schon der Umsatz, mit dem du die Grenze überschreitest, steuerpflichtig.
erklaerung:
  de: Maßgeblich ist der Gesamtumsatz nach vereinnahmten Entgelten – also die Zahlungen, die du netto erhältst, nicht die Summe
    der gestellten Rechnungen nach Rechnungsdatum. Bis einschließlich 25.000 € bzw. 100.000 € bleibt dein Umsatz steuerfrei. Ab
    dem Umsatz, mit dem du die Grenze überschreitest, gilt die Regelbesteuerung – du stellst Rechnungen mit Umsatzsteuer und gibst
    Voranmeldungen ab; eine eigene Frist gibt es dafür nicht. Lag dein Umsatz im Vorjahr über 25.000 €, gilt die Regelung in diesem
    Jahr von Anfang an nicht. Amtlos zählt bisher die Rechnungen, die du in Amtlos gestellt hast (netto, nach Rechnungsdatum) –
    ob und wann sie bezahlt wurden, ist darin noch nicht berücksichtigt.
rechtsgrundlage:
- § 19 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: true
    label:
      de: Du nutzt die Kleinunternehmerregelung.
  - any:
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - feld: profil.umsatz.prognose_laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_gruendungsjahr
        label:
          de: Dein erwarteter Umsatz im Gründungsjahr liegt über der Grenze für das Gründungsjahr.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - feld: abgeleitet.noch_nicht_gestartet
        op: ==
        wert: false
      - feld: profil.umsatz.vorjahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_vorjahr
        label:
          de: Dein Umsatz im Vorjahr lag über der Grenze.
    - feld: profil.umsatz.prognose_laufendes_jahr
      op: '>'
      wert:
        regelwert: steuern.ustg19.grenze_laufendes_jahr
      label:
        de: Dein erwarteter Umsatz in diesem Jahr liegt über der Grenze.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - &id001
        feld: finanzen.umsatz.laufendes_jahr
        op: vorhanden
        label:
          de: Du stellst Rechnungen mit Amtlos.
      - feld: finanzen.umsatz.laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_gruendungsjahr
        label:
          de: Deine Rechnungen in Amtlos summieren sich im Gründungsjahr auf mehr als 25.000 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - *id001
      - feld: finanzen.umsatz.laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_laufendes_jahr
        label:
          de: Deine Rechnungen in Amtlos summieren sich in diesem Jahr auf mehr als 100.000 €; die Grenze liegt bei 100.000 €.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Finanzamt
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Ab dem Umsatz über der Grenze fällt Umsatzsteuer an, auch wenn du sie nicht berechnet hast.
  schwere: hoch
automatisierung: hinweis
einordnung: hinweis
aktion:
  art: abhaken
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Umsatzsteuergesetz § 19
  url: https://www.gesetze-im-internet.de/ustg_1980/__19.html
  abgerufen: null
fachlich_zu_pruefen:
- 'StB Busch 22.10.2026: Umsatzbegriff sind die vereinnahmten Entgelte (netto, Zufluss); der Auslöser soll auf Zahlungseingänge in Amtlos umgestellt werden – nicht umgesetzt: finanzen.umsatz.laufendes_jahr zählt gestellte Rechnungen nach Rechnungsdatum, der Server speichert keine Zahlungseingänge und die App liefert den Fakt nicht. Bis dahin nur Hinweis im Text'
pruefung:
  status: entwurf
  geprueft_von: null
  geprueft_am: null
