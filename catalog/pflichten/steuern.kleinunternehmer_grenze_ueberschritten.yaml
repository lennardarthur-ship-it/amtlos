# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt; Auslöser seit v5 nach Zahlungseingängen (vereinnahmte Entgelte)
# v6 (StB Busch, Runde 2): nur tatsächliche Zahlungseingänge ohne offene Rechnungen (finanzen.umsatz.bezahlt_*), steuerfreie Umsätze herausgerechnet
schema_version: 1
id: steuern.kleinunternehmer_grenze_ueberschritten
version: 7
katalog_nr: C.23
titel:
  de: 'Kleinunternehmergrenze überschritten: Umsatzsteuer prüfen'
kurz:
  de: Nach deinen Angaben liegt dein Umsatz über einer Kleinunternehmergrenze. Überschreitest du im laufenden Jahr 100.000 € (im Gründungsjahr 25.000 €), ist schon der Umsatz, mit dem du die Grenze überschreitest, steuerpflichtig.
erklaerung:
  de: Maßgeblich ist der Gesamtumsatz nach vereinnahmten Entgelten – also die Zahlungen, die du netto erhältst, nicht die Summe
    der gestellten Rechnungen nach Rechnungsdatum. Bis einschließlich 25.000 € bzw. 100.000 € bleibt dein Umsatz steuerfrei. Ab
    dem Umsatz, mit dem du die Grenze überschreitest, gilt die Regelbesteuerung – du stellst Rechnungen mit Umsatzsteuer und gibst
    Voranmeldungen ab; eine eigene Frist gibt es dafür nicht. Lag dein Umsatz im Vorjahr über 25.000 €, gilt die Regelung in diesem
    Jahr von Anfang an nicht. Amtlos zählt dafür nur Geld, das du schon bekommen hast – die Zahlungseingänge auf deine Rechnungen
    in Amtlos (netto), deine Kasseneinnahmen laut Tagesabschlüssen und deine Sachentnahmen; Leistungen an Unternehmen im Ausland
    zählen nicht mit. Rechnungen ohne vermerkten Zahlungseingang zählen hier nicht – vermerke deine Zahlungseingänge, sonst ist
    der Wert zu niedrig. Steuerfreie Umsätze (z. B. Heilbehandlungen) rechnet Amtlos heraus, wenn du sie auf der Rechnung mit
    „0 % / steuerfrei“ und dem Hinweis auf die Steuerbefreiung erfasst. Verkäufe von Anlagegütern zählen nicht zur Grenze – erfasst
    du sie als Rechnung, kann der angezeigte Wert zu hoch sein. Einnahmen außerhalb von Amtlos sind nicht enthalten.
rechtsgrundlage:
- § 19 UStG
- Abschn. 19.2 Abs. 3, 4 UStAE (Fassung vom 18.03.2025)
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: true
    label:
      de: Du nutzt die Kleinunternehmerregelung.
  - any:
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - feld: profil.umsatz.prognose_laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_gruendungsjahr
        label:
          de: Dein erwarteter Umsatz im Gründungsjahr liegt über der Grenze für das Gründungsjahr.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - feld: abgeleitet.noch_nicht_gestartet
        op: ==
        wert: false
      - feld: profil.umsatz.vorjahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_vorjahr
        label:
          de: Dein Umsatz im Vorjahr lag über der Grenze.
    - feld: profil.umsatz.prognose_laufendes_jahr
      op: '>'
      wert:
        regelwert: steuern.ustg19.grenze_laufendes_jahr
      label:
        de: Dein erwarteter Umsatz in diesem Jahr liegt über der Grenze.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - &id001
        feld: finanzen.umsatz.bezahlt_laufendes_jahr
        op: vorhanden
        label:
          de: Du erfasst Rechnungen oder Kasseneinnahmen in Amtlos.
      - feld: finanzen.umsatz.bezahlt_laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_gruendungsjahr
        label:
          de: Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) liegen im Gründungsjahr über 25.000 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - *id001
      - feld: finanzen.umsatz.bezahlt_laufendes_jahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_laufendes_jahr
        label:
          de: Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) liegen in diesem Jahr über 100.000 €; die Grenze liegt bei 100.000 €.
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - feld: abgeleitet.noch_nicht_gestartet
        op: ==
        wert: false
      - feld: finanzen.umsatz.bezahlt_vorjahr
        op: vorhanden
      - feld: finanzen.umsatz.bezahlt_vorjahr
        op: '>'
        wert:
          regelwert: steuern.ustg19.grenze_vorjahr
        label:
          de: Deine Einnahmen laut Amtlos (erhaltene Zahlungen und Kasse, netto, ohne offene Rechnungen) lagen im Vorjahr über 25.000 €.
