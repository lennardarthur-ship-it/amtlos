# R11 (Rechtsprüfung T-112): Informationspflicht nach § 37 VSBG nach Entstehen einer Streitigkeit – unabhängig von der Betriebsgröße
schema_version: 1
id: online.vsbg_streitfall
version: 3
katalog_nr: G.69
titel:
  de: Im Streitfall auf die Verbraucherschlichtung hinweisen
kurz:
  de: Kannst du einen Streit mit einem Verbraucher nicht beilegen, nennst du ihm eine zuständige Schlichtungsstelle und sagst, ob du teilnimmst.
erklaerung:
  de: Konnte eine Streitigkeit aus einem Vertrag mit einem Verbraucher nicht beigelegt werden, weist du in Textform auf eine für ihn
    zuständige Verbraucherschlichtungsstelle mit Anschrift und Website hin. Dabei sagst du, ob du an einem Verfahren dort teilnimmst
    oder teilnehmen musst (§ 37 VSBG). Das gilt unabhängig von der Größe deines Betriebs – auch wenn du auf der Website nichts angeben musst.
rechtsgrundlage:
- § 37 VSBG
kategorie: online
