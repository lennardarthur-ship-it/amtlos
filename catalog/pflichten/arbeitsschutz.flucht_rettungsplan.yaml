# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Flucht- und Rettungsplan, Räumungsübung“)
schema_version: 1
id: arbeitsschutz.flucht_rettungsplan
version: 1
katalog_nr: E.54
titel:
  de: Flucht- und Rettungsplan prüfen
kurz:
  de: Erfordern Lage, Ausdehnung oder Nutzung deiner Arbeitsstätte es, hängst du einen Flucht- und Rettungsplan aus und übst die Räumung.
erklaerung:
  de: 'Einen Flucht- und Rettungsplan brauchst du, wenn Lage, Ausdehnung und Art der Benutzung der Arbeitsstätte es erfordern (§ 4 Abs. 4 ArbStättV) – etwa bei unübersichtlichen Fluchtwegen, mehreren Geschossen, vielen Kundinnen und Kunden oder erhöhter Brandgefährdung. Ob das so ist, hältst du in der Gefährdungsbeurteilung fest. Der Plan wird an geeigneten Stellen ausgehängt oder ausgelegt; gestaltet wird er nach ASR A2.3 (Grundriss, Fluchtwege, Sammelstelle, Verhalten im Brandfall und bei Unfällen). Nach dem Plan übst du in angemessenen Zeitabständen, wie die Arbeitsstätte geräumt wird. Für ein kleines Ladenlokal mit direktem Ausgang ins Freie ist oft kein Plan nötig.'
rechtsgrundlage:
- § 4 Abs. 4 ArbStättV
- ASR A2.3
