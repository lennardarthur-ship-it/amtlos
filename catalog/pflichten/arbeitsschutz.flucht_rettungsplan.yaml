# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Flucht- und Rettungsplan, Räumungsübung“)
schema_version: 1
id: arbeitsschutz.flucht_rettungsplan
version: 3
katalog_nr: E.54
titel:
  de: Flucht- und Rettungsplan prüfen
kurz:
  de: Erfordern Lage, Ausdehnung oder Nutzung deiner Arbeitsstätte es, hängst du einen Flucht- und Rettungsplan aus und übst die Räumung.
erklaerung:
  de: 'Einen Flucht- und Rettungsplan brauchst du, wenn Lage, Ausdehnung und Art der Benutzung der Arbeitsstätte es erfordern (§ 4 Abs. 4 ArbStättV) – etwa bei unübersichtlichen Fluchtwegen, mehreren Geschossen, vielen Kundinnen und Kunden oder erhöhter Brandgefährdung. Ob das so ist, hältst du in der Gefährdungsbeurteilung fest. Der Plan wird an geeigneten Stellen ausgehängt oder ausgelegt; gestaltet wird er nach ASR A2.3 (Grundriss, Fluchtwege, Sammelstelle, Verhalten im Brandfall und bei Unfällen). Nach dem Plan übst du in angemessenen Zeitabständen, wie die Arbeitsstätte geräumt wird – empfohlen ist jährlich (ASR A2.3). Für ein kleines Ladenlokal mit direktem Ausgang ins Freie ist oft kein Plan nötig.'
rechtsgrundlage:
- § 4 Abs. 4 ArbStättV
- ASR A2.3
kategorie: arbeitsschutz
einordnung: hinweis
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Für den Plan und die Übungen ist kein eigenes Bußgeld vorgesehen; bußgeldbewehrt ist, Verkehrswege, Fluchtwege und Notausgänge nicht freizuhalten (bis 5.000 €, § 9 Abs. 1 ArbStättV in Verbindung mit § 4 Abs. 4 Satz 1 ArbStättV und § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Die Aufsichtsbehörde kann den Plan im Einzelfall anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
