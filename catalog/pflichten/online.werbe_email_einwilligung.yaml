sanktion:
  text:
    de: 'Nach dem UWG kein Bußgeld (§ 20 UWG erfasst nur Telefonwerbung). Mitbewerber und Verbände können Beseitigung und Unterlassung verlangen (§ 8 Abs. 1, 3 UWG), meist mit einer Abmahnung; der Empfänger selbst kann Unterlassung verlangen. Fehlt die Einwilligung, kann die Datenschutzaufsicht ein Bußgeld verhängen (Art. 83 Abs. 5 DSGVO), und der Empfänger kann Schadensersatz fordern (Art. 82 DSGVO).'
