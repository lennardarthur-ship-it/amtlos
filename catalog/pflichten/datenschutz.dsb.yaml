# Katalog F.61 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.dsb
version: 1
katalog_nr: F.61
titel:
  de: Datenschutzbeauftragten benennen
kurz:
  de: Sind in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung von Daten beschäftigt, benennst
    du einen Datenschutzbeauftragten.
erklaerung:
  de: Die Pflicht folgt aus § 38 BDSG bzw. Art. 37 DSGVO. Die Bundesregierung plant, § 38 BDSG bis Ende 2026 zu streichen;
    ein Gesetz gibt es noch nicht.
rechtsgrundlage:
- § 38 BDSG
- Art. 37 DSGVO
