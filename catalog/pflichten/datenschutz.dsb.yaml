# Katalog F.61 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.dsb
version: 4
katalog_nr: F.61
titel:
  de: Datenschutzbeauftragten benennen
kurz:
  de: Ein Datenschutzbeauftragter ist vorgesehen, wenn in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung personenbezogener Daten beschäftigt sind – unabhängig davon auch bei bestimmten Verarbeitungen, etwa umfangreicher Überwachung oder Gesundheitsdaten als Kerntätigkeit.
erklaerung:
  de: 'Ein Datenschutzbeauftragter ist in drei Fällen vorgesehen: wenn in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung personenbezogener Daten beschäftigt sind (§ 38 Abs. 1 Satz 1 BDSG) – gezählt werden Personen, nicht Vollzeitstellen, auch Teilzeitkräfte, Auszubildende und in den Betrieb eingebundene freie Mitarbeitende; wenn die Kerntätigkeit in einer umfangreichen regelmäßigen und systematischen Überwachung von Personen oder in der umfangreichen Verarbeitung besonderer Daten wie Gesundheitsdaten besteht (Art. 37 Abs. 1 Buchst. b, c DSGVO) – eine einzelne Ärztin oder ein einzelner Therapeut verarbeitet nach Erwägungsgrund 91 DSGVO nicht „umfangreich“; oder unabhängig von der Zahl, wenn eine Verarbeitung einer Datenschutz-Folgenabschätzung unterliegt oder Daten geschäftsmäßig zur Übermittlung oder für Markt- und Meinungsforschung verarbeitet werden (§ 38 Abs. 1 Satz 2 BDSG). Den Datenschutzbeauftragten benennst du unverzüglich, sobald einer dieser Fälle eintritt. Ob einer dieser Fälle vorliegt, klärt im Zweifel die Datenschutzaufsicht deines Landes. Die Bundesregierung plant, § 38 BDSG bis Ende 2026 zu streichen; ein Gesetz gibt es noch nicht.'
rechtsgrundlage:
- § 38 BDSG
- Art. 37 Abs. 1 Buchst. b, c DSGVO
kategorie: datenschutz
ausloeser:
  any:
  - all:
    - feld: profil.beschaeftigte.gesamt
      op: '>='
      wert:
        regelwert: datenschutz.dsb.schwelle_personen
    - feld: abgeleitet.beschaeftigte.zaehlung_bdsg38
      op: '>='
      wert:
        regelwert: datenschutz.dsb.schwelle_personen
      label:
        de: Mindestens 20 Personen sind ständig mit automatisierter Datenverarbeitung beschäftigt.
  # Vorprüfung 21.10.2026 (F.61): Art. 37 Abs. 1 Buchst. b, c DSGVO und § 38 Abs. 1 Satz 2 BDSG unabhängig von der Zahl
  - all:
    - feld: profil.datenschutz.dsb_gruende
      op: vorhanden
    - feld: profil.datenschutz.dsb_gruende
      op: enthaelt_eines
      wert: [kerntaetigkeit_ueberwachung, kerntaetigkeit_besondere_daten, dsfa_pflichtig, uebermittlung_marktforschung]
      label:
        de: Nach deinen Angaben ist deine Kerntätigkeit eine umfangreiche Überwachung oder Verarbeitung besonderer Daten, oder eine Verarbeitung braucht eine Datenschutz-Folgenabschätzung bzw. dient der Übermittlung oder Marktforschung.
  # „Hängt ab“ nur, wo es naheliegt: bei Gesundheitsdaten, Videoüberwachung oder Ortung (wie die DSFA-Prüfung) wird nach diesen Fällen gefragt
  - all:
    - feld: profil.datenverarbeitung.arten
      op: vorhanden
    - feld: profil.datenverarbeitung.arten
      op: enthaelt_eines
      wert: [gesundheitsdaten, videoueberwachung, ortung]
      label:
        de: Du verarbeitest Gesundheitsdaten, überwachst per Video oder ortest Beschäftigte bzw. Fahrzeuge.
    - feld: profil.datenschutz.dsb_gruende
      op: enthaelt_eines
      wert: [kerntaetigkeit_ueberwachung, kerntaetigkeit_besondere_daten, dsfa_pflichtig, uebermittlung_marktforschung]
      label:
        de: Deine Verarbeitung fällt unter Art. 37 Abs. 1 Buchst. b, c DSGVO oder § 38 Abs. 1 Satz 2 BDSG.
  # E-215 (Rechtsanwalt 26.10.2026, T-239): in Branchen, in denen Gesundheitsdaten oder Videoüberwachung typisch sind (Gesundheit,
  # Pflege, Kosmetik mit Anamnese), „hängt ab“, solange die Angaben zur Datenverarbeitung fehlen – § 38 Abs. 1 Satz 2 BDSG gilt
  # unabhängig von der Zahl, wenn eine Datenschutz-Folgenabschätzung nötig ist; sonst bleibt es ohne Angabe bei „nicht betroffen“
  - all:
    - feld: profil.taetigkeit.branchen
      op: vorhanden
    - feld: profil.taetigkeit.branchen
      op: enthaelt_eines
      wert: [gesundheit_pflege, beauty_kosmetik]
      label:
        de: Du arbeitest in Gesundheit, Pflege oder Kosmetik.
    - feld: profil.datenverarbeitung.arten
      op: enthaelt_eines
      wert: [gesundheitsdaten, videoueberwachung, ortung]
      label:
        de: Du verarbeitest Gesundheitsdaten, überwachst per Video oder ortest Beschäftigte bzw. Fahrzeuge.
    - feld: profil.datenschutz.dsb_gruende
      op: enthaelt_eines
      wert: [kerntaetigkeit_ueberwachung, kerntaetigkeit_besondere_daten, dsfa_pflichtig, uebermittlung_marktforschung]
      label:
        de: Deine Verarbeitung fällt unter Art. 37 Abs. 1 Buchst. b, c DSGVO oder § 38 Abs. 1 Satz 2 BDSG.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Meldung der Kontaktdaten an die Aufsichtsbehörde
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Bußgeld bis 10 Mio. € oder bis 2 % des weltweiten Jahresumsatzes, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 4 Buchst. a DSGVO).
  schwere: hoch
automatisierung: hinweis
aenderungsnotiz:
  de: In Gesundheit, Pflege und Kosmetik erscheint der Eintrag jetzt als „hängt ab“, solange du nichts zu deiner Datenverarbeitung angegeben hast.
