# Katalog A.7 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gruendung.ihk_hwk_mitgliedschaft
version: 3
katalog_nr: A.7
titel:
  de: Mitgliedschaft in IHK oder Handwerkskammer
kurz:
  de: Als Gewerbetreibender bist du automatisch Mitglied der IHK oder Handwerkskammer und zahlst einen Beitrag nach deinem
    Ertrag.
erklaerung:
  de: 'Die Mitgliedschaft entsteht automatisch mit dem Gewerbe; du musst dich nicht selbst anmelden. Die Kammer meldet sich bei dir und setzt den Beitrag fest; fällig wird er nach dem Bescheid, einen gesetzlichen Termin gibt es nicht. Kleingewerbetreibende ohne Eintragung im Handelsregister sind bei der IHK beitragsfrei, solange ihr Gewerbeertrag 5.200 € im Jahr nicht übersteigt (§ 3 Abs. 3 S. 3 IHKG). Gründerinnen und Gründer – natürliche Personen, nicht im Handelsregister eingetragen – sind in den ersten zwei Jahren vom Grundbeitrag befreit, wenn ihr Gewerbeertrag 25.000 € nicht übersteigt (§ 3 Abs. 3 S. 4 IHKG). Die Handwerkskammern regeln ihre Beiträge in eigenen Beitragsordnungen.'
