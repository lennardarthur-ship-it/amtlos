titel:
  de: Mitgliedschaft in IHK oder Handwerkskammer
kurz:
  de: Als Gewerbetreibender bist du automatisch Mitglied der IHK oder Handwerkskammer und zahlst einen Beitrag nach deinem
    Ertrag.
erklaerung:
  de: Die Mitgliedschaft entsteht automatisch mit dem Gewerbe; du musst dich nicht selbst anmelden. Die Kammer meldet sich bei dir und setzt den Beitrag fest. Kleingewerbetreibende ohne Eintragung im Handelsregister sind bei der IHK beitragsfrei, solange ihr Gewerbeertrag 5.200 € im Jahr nicht übersteigt (§ 3 Abs. 3 IHKG).
