fachlich_zu_pruefen:
- 'Rechtsstand 21.10.2026: Termine und Inhalt von Art. 32/33 aus der Textwiedergabe (lxgesetze) übernommen – gegen das Amtsblatt (EUR-Lex) lesen; frühere Angabe „Informationspflicht seit 12.8.2026“ (WKO) nicht bestätigt und entfernt. Prüfvermerk Rechtsanwalt 22.10.2026: Termine (12.2.2027/12.2.2028) und Sanktionen vor Freigabe am Amtsblatt belegen – am 22.10.2026 nicht gelungen (EUR-Lex-Seite der VO (EU) 2025/40 nach den Erwägungsgründen abgeschnitten, Art. 32/33 nicht erreicht); Kleinstunternehmen-Ausnahme nur in Art. 33 Abs. 4 bestätigt. Zweiter Versuch 22.10.2026 mit anderen Quellen: EUR-Lex-HTML endet bei 101.794 Zeichen (Erwägungsgrund 56), auch mit Lesestart weiter hinten; die Amtsblatt-Kopie der WKO (PDF, ABl. L 2025/40 vom 22.1.2025) endet in Erwägungsgrund 70; umwelt-online nur mit Abonnement; Bird & Bird nennt keine Termine. Erneut gelesen nur auf lxgesetze.de: Art. 32 Abs. 1 „Bis zum 12. Februar 2027“, Art. 33 Abs. 1 „Bis zum 12. Februar 2028“, Art. 33 Abs. 4 Kleinstunternehmen (Empfehlung 2003/361/EG, Stand 11.2.2025) – am Amtsblatt weiterhin nicht belegt, Eintrag deshalb unverändert'
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 66 Abs. 2 Nr. 29 (Art. 32 Abs. 1), Nr. 30 (Art. 32 Abs. 2 UAbs. 1, Art. 33 Abs. 3), Nr. 31 (Art. 32 Abs. 2 UAbs. 2, Art. 33 Abs. 2), Nr. 32 (Art. 33 Abs. 1) und Abs. 3 VerpackDG gelesen; ab wann Abs. 2 gilt, steht nicht im Paragraphen (laut IHK Karlsruhe ab 12.2.2027); EWKFondsG (Gastronom als Hersteller?) offen – fachlich zu bestätigen'
- 'Freigabe Rechtsanwalt Runde 2 (23.10.2026): als Radar freigegeben, Termine nach Art. 32/33 VO (EU) 2025/40 über Sekundärquelle belegt. Auflage: Vor der Aktivierung des Termins 12.2.2027 das Amtsblatt (ABl. L 2025/40, deutsche PDF-Fassung) gegenlesen; bis dahin Sanktionstext ohne Beträge – Beträge (bis 200.000 € bzw. 10.000 €, § 66 Abs. 3 VerpackDG) entfernt'
