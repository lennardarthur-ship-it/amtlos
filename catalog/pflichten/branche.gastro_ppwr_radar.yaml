# R12 (Rechtsprüfung Befund 11): EU-Verpackungsverordnung (PPWR) – Take-away, Radar
# Rechtsstand 21.10.2026: PPWR gilt seit 12.8.2026; Art. 32 bis 12.2.2027, Art. 33 bis 12.2.2028 (Kleinstunternehmen ausgenommen)
schema_version: 1
id: branche.gastro_ppwr_radar
version: 4
katalog_nr: H.1
titel:
  de: 'EU-Verpackungsverordnung: mitgebrachte Behälter und Mehrweg (ab 2027)'
kurz:
  de: Nach der EU-Verpackungsverordnung befüllen Take-away-Betriebe ab 12.2.2027 mitgebrachte Behälter; ab 12.2.2028 kommt ein Mehrwegangebot dazu, Kleinstunternehmen ausgenommen.
erklaerung:
  de: 'Die Verordnung (EU) 2025/40 über Verpackungen gilt seit 12.8.2026 und bringt für Speisen und Getränke zum Mitnehmen zwei Stufen. Bis 12.2.2027 müssen Kundinnen und Kunden kalte oder heiße Getränke und verzehrfertige Speisen in selbst mitgebrachte Behälter füllen lassen können – nicht teurer als in Einwegverpackung und mit gut sichtbarem Hinweis (Art. 32). Bis 12.2.2028 bietest du zusätzlich Mehrwegverpackungen aus einem Mehrwegsystem zur Wahl an (Art. 33); Kleinstunternehmen sind davon ausgenommen. Die deutsche Mehrwegangebotspflicht (§§ 60, 61 VerpackDG) gilt daneben weiter.'
