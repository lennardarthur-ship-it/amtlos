# R12 (Rechtsprüfung Befund 11): EU-Verpackungsverordnung (PPWR) – Take-away, Radar
schema_version: 1
id: branche.gastro_ppwr_radar
version: 1
katalog_nr: H.1
titel:
  de: 'EU-Verpackungsverordnung: mitgebrachte Behälter und Mehrweg (ab 2027)'
kurz:
  de: Nach der EU-Verpackungsverordnung befüllen Take-away-Betriebe ab 12.2.2027 mitgebrachte Behälter; ab 12.2.2028 kommt ein Mehrwegangebot dazu, Kleinstunternehmen ausgenommen.
erklaerung:
  de: Die Verordnung (EU) 2025/40 über Verpackungen bringt für Speisen und Getränke zum Mitnehmen neue Pflichten. Bietest du an, mitgebrachte Behälter zu befüllen, informierst du seit dem 12.8.2026 über geeignete Behälter, Hygiene und die Verantwortung der Kundschaft. Ab dem 12.2.2027 müssen Kundinnen und Kunden ihre eigenen Behälter für kalte oder heiße Getränke und verzehrfertige Speisen nutzen können, ohne Aufpreis und mit gut sichtbarem Hinweis. Ab dem 12.2.2028 bietest du zusätzlich Mehrwegverpackungen aus einem Mehrwegsystem zur Wahl an; Kleinstunternehmen sind davon ausgenommen.
