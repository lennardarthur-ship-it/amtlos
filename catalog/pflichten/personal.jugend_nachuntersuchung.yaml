# R11 (Nutzertest Tischlerei Befund 7): Nachuntersuchung nach § 33 JArbSchG als eigene Pflicht
schema_version: 1
id: personal.jugend_nachuntersuchung
version: 1
katalog_nr: D.44
titel:
  de: Ärztliche Nachuntersuchung Jugendlicher nach einem Jahr
kurz:
  de: Ein Jahr nach Beginn lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen.
erklaerung:
  de: Vor Beginn brauchen Jugendliche die Bescheinigung über die Erstuntersuchung (§ 32 JArbSchG). Ein Jahr nach Aufnahme der ersten
    Beschäftigung lässt du dir die Bescheinigung über die erste Nachuntersuchung vorlegen (§ 33 JArbSchG). Liegt sie nach 14 Monaten
    nicht vor, darfst du die Person nicht weiter beschäftigen. Amtlos rechnet ab der Einstellung.
rechtsgrundlage:
- § 33 JArbSchG
