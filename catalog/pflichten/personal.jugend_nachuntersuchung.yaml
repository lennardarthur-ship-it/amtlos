# R11 (Nutzertest Tischlerei Befund 7): Nachuntersuchung nach § 33 JArbSchG als eigene Pflicht
schema_version: 1
id: personal.jugend_nachuntersuchung
version: 4
katalog_nr: D.44
titel:
  de: Ärztliche Nachuntersuchung Jugendlicher nach einem Jahr
kurz:
  de: Ein Jahr nach Aufnahme der ersten Beschäftigung lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen – nach neun Monaten erinnerst du sie daran.
erklaerung:
  de: 'Ein Jahr nach Aufnahme der ersten Beschäftigung lässt du dir von Jugendlichen die Bescheinigung über die erste Nachuntersuchung vorlegen; die Untersuchung darf höchstens drei Monate zurückliegen (§ 33 Abs. 1 JArbSchG). Neun Monate nach Beginn weist du die jugendliche Person nachdrücklich auf den Termin hin und forderst sie auf, die Nachuntersuchung machen zu lassen (§ 33 Abs. 1 Satz 2 JArbSchG). Liegt die Bescheinigung 14 Monate nach Aufnahme der ersten Beschäftigung nicht vor, darfst du die Person nicht weiter beschäftigen (§ 33 Abs. 3 JArbSchG). Amtlos rechnet ab der Einstellung und erinnert drei Monate vor dem Termin – hat die Person schon vorher anderswo gearbeitet, zählt der Beginn dieser ersten Beschäftigung. Wechselt sie aus einem anderen Betrieb zu dir, genügt die dort vorgelegte Bescheinigung. Die Erstuntersuchung vor Beginn ist eine eigene Pflicht. Ein Gesetzesantrag (BR-Drs. 735/25) will die Untersuchungen ändern; er ist nicht in Kraft.'
