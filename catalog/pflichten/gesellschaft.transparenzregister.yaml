# Katalog B.16 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.transparenzregister
version: 5
katalog_nr: B.16
titel:
  de: Wirtschaftlich Berechtigte ans Transparenzregister melden
kurz:
  de: 'Melde unverzüglich, wer hinter deiner Gesellschaft steht, und halte die Angaben aktuell.'
erklaerung:
  de: Gesellschaften müssen ihre wirtschaftlich Berechtigten dem Transparenzregister mitteilen und die Angaben bei Änderungen aktualisieren. Das gilt für UG und GmbH ebenso wie für eingetragene Personengesellschaften, also auch für die GmbH & Co. KG und die Partnerschaftsgesellschaft (§ 20 Abs. 1 GwG) – seit 2024 auch für eine GbR, die sich ins Gesellschaftsregister eintragen lässt (eGbR). Die Mitteilung machst du unverzüglich nach der Eintragung und nach jeder Änderung (§ 20 Abs. 1 GwG).
begriffe:
- begriff:
    de: Wirtschaftlich Berechtigte
  erklaerung:
    de: Die Menschen, denen eine Gesellschaft letztlich gehört oder die sie kontrollieren.
rechtsgrundlage:
- § 19 GwG
- § 20 GwG
kategorie: gesellschaft
ausloeser:
  feld: abgeleitet.ist_eingetragene_gesellschaft
  op: ==
  wert: true
  label:
    de: Deine Gesellschaft wird im Handels- oder Partnerschaftsregister eingetragen.
# R11 (Nutzertest Tischlerei #4): keine Gründungs-Phase – Altgesellschaften (vor 1.8.2021) hatten Nachmeldepflichten (§ 59 Abs. 8 GwG), laut Freigabe Weber 22.10.2026 bis 31.12.2022 abgelaufen (nur historisch); Änderungen laufend
# Frist „unverzüglich“ (§ 20 Abs. 1 GwG) nur im Text – das Datum der Eintragung bzw. Änderung kennt die App nicht; Rechtsform eGbR im Fragebogen siehe gesellschaft.egbr_hinweis
