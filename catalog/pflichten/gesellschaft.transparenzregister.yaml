fachlich_zu_pruefen:
- 'R12 (Rechtsprüfung Befund 1, K-205): Auslöser auf GmbH & Co. KG, PartG und PartG mbB erweitert (§ 20 Abs. 1 GwG, eingetragene Personengesellschaften); eGbR nur im Text – eigene Rechtsform „eGbR“ fehlt im Fragebogen'
- Einzelvorschriften §§ 19, 20 GwG zugeordnet (R11); Nachmeldepflicht für Gesellschaften vor 1.8.2021 (§ 59 Abs. 8 GwG) nur im Kommentar – Fristen bestätigen
- Frist nach Gründung und bei Änderung ergänzen
- 'Vorprüfung 21.10.2026: Sanktion ergänzt – § 56 Abs. 1 Nr. 55 (Mitteilung nach § 20 Abs. 1), Beträge Abs. 1 und 3 über gesetze.legal gelesen (gesetze-im-internet für das Werkzeug gesperrt); Staffelung nach dem Bußgeldkatalog des Bundesverwaltungsamts nicht abgebildet'
