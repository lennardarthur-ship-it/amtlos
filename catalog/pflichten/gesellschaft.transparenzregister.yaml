# Katalog B.16 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.transparenzregister
version: 4
katalog_nr: B.16
titel:
  de: Wirtschaftlich Berechtigte ans Transparenzregister melden
kurz:
  de: Melde, wer hinter deiner Gesellschaft steht, und halte die Angaben aktuell.
erklaerung:
  de: Gesellschaften müssen ihre wirtschaftlich Berechtigten dem Transparenzregister mitteilen und die Angaben bei Änderungen aktualisieren. Das gilt für UG und GmbH ebenso wie für eingetragene Personengesellschaften, also auch für die GmbH & Co. KG und die Partnerschaftsgesellschaft (§ 20 Abs. 1 GwG) – seit 2024 auch für eine GbR, die sich ins Gesellschaftsregister eintragen lässt (eGbR).
begriffe:
- begriff:
    de: Wirtschaftlich Berechtigte
  erklaerung:
    de: Die Menschen, denen eine Gesellschaft letztlich gehört oder die sie kontrollieren.
rechtsgrundlage:
- § 19 GwG
- § 20 GwG
kategorie: gesellschaft
ausloeser:
  feld: abgeleitet.ist_eingetragene_gesellschaft
  op: ==
  wert: true
  label:
    de: Deine Gesellschaft wird im Handels- oder Partnerschaftsregister eingetragen.
