# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Betriebsanweisung Arbeitsmittel“, Frage 10, Hinweise Nr. 6): § 12 Abs. 2 BetrSichV
schema_version: 1
id: arbeitsschutz.betriebsanweisung_arbeitsmittel
version: 1
katalog_nr: E.53
titel:
  de: Betriebsanweisungen für Maschinen und Arbeitsmittel
kurz:
  de: Bevor Beschäftigte eine Maschine oder ein anderes Arbeitsmittel zum ersten Mal benutzen, stellst du ihnen eine schriftliche Betriebsanweisung zur Verfügung und unterweist sie.
erklaerung:
  de: 'Vor der ersten Verwendung stellst du den Beschäftigten eine schriftliche Betriebsanweisung in verständlicher Form und Sprache zur Verfügung (§ 12 Abs. 2 BetrSichV) – etwa für Aufschnittmaschine, Teigknetmaschine, Kreissäge, Hebebühne, Kompressor oder Reinigungsmaschine. Das gilt nicht für Arbeitsmittel, für die der Hersteller keine Gebrauchsanleitung mitliefern muss. Statt einer eigenen Betriebsanweisung darfst du die mitgelieferte Gebrauchsanleitung bereitstellen, wenn sie die nötigen Angaben enthält. Außerdem unterweist du die Beschäftigten vor der ersten Verwendung tätigkeitsbezogen und danach mindestens einmal jährlich und hältst Datum und Namen schriftlich fest (§ 12 Abs. 1 BetrSichV).'
