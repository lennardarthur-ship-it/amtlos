# Katalog F.60 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Prüfvermerk Rechtsanwalt 22.10.2026: 72 Stunden stundengenau (PT72H) – Schema und Fristen-Engine rechnen in Tagen ohne Uhrzeit;
# P2D ist der späteste Kalendertag, der bei jeder Uhrzeit der Entdeckung noch innerhalb der 72 Stunden liegt (P3D wäre bis zu 24 h zu spät)
schema_version: 1
id: datenschutz.datenpanne_meldung
version: 4
katalog_nr: F.60
titel:
  de: Datenpanne der Aufsichtsbehörde melden
kurz:
  de: Bei einer Datenpanne meldest du sie binnen 72 Stunden der Datenschutz-Aufsichtsbehörde.
erklaerung:
  de: 'Du meldest unverzüglich und möglichst binnen 72 Stunden, nachdem dir die Panne bekannt wurde; eine spätere Meldung musst du begründen (Art. 33 Abs. 1 DSGVO). Die 72 Stunden laufen stundengenau ab dem Zeitpunkt, an dem du von der Panne erfährst, auch über das Wochenende. Der Termin im Kalender liegt deshalb zwei Tage nach dem Tag der Entdeckung – der letzte volle Tag innerhalb der 72 Stunden, egal zu welcher Uhrzeit du davon erfahren hast. Keine Meldung ist nötig, wenn voraussichtlich kein Risiko für die Betroffenen besteht – das entscheidest und dokumentierst du. Zuständig ist die Datenschutz-Aufsichtsbehörde deines Landes, in Baden-Württemberg zum Beispiel der Landesbeauftragte für den Datenschutz und die Informationsfreiheit in Stuttgart, in Bayern das Bayerische Landesamt für Datenschutzaufsicht in Ansbach; Amtlos nennt dir die Behörde zu deinem Bundesland. Amtlos zeigt einen Countdown und erstellt einen Meldeentwurf.'
