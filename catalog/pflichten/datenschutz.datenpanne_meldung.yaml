# Katalog F.60 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.datenpanne_meldung
version: 3
katalog_nr: F.60
titel:
  de: Datenpanne der Aufsichtsbehörde melden
kurz:
  de: Bei einer Datenpanne meldest du sie binnen 72 Stunden der Datenschutz-Aufsichtsbehörde.
erklaerung:
  de: 'Die 72 Stunden laufen stundengenau ab dem Zeitpunkt, an dem du von der Panne erfährst, auch über das Wochenende (Art. 33 Abs. 1 DSGVO). Keine Meldung ist nötig, wenn voraussichtlich kein Risiko für die Betroffenen besteht – das entscheidest und dokumentierst du. Zuständig ist die Datenschutz-Aufsichtsbehörde deines Landes, in Baden-Württemberg zum Beispiel der Landesbeauftragte für den Datenschutz und die Informationsfreiheit in Stuttgart, in Bayern das Bayerische Landesamt für Datenschutzaufsicht in Ansbach; Amtlos nennt dir die Behörde zu deinem Bundesland. Amtlos zeigt einen Countdown und erstellt einen Meldeentwurf.'
