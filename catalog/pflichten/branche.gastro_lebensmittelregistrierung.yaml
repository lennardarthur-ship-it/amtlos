# Katalog H.1 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.gastro_lebensmittelregistrierung
version: 5
katalog_nr: H.1
titel:
  de: Bei der Lebensmittelüberwachung registrieren
kurz:
  de: Bevor du Lebensmittel herstellst, behandelst oder verkaufst, registrierst du jeden Betrieb bei der Lebensmittelüberwachung – auch jede neue Filiale.
erklaerung:
  de: Lebensmittelunternehmen müssen jeden Betrieb vor Beginn der Tätigkeit bei der zuständigen Behörde registrieren lassen – meist beim Veterinär- und Lebensmittelüberwachungsamt des Kreises (Art. 6 Abs. 2 VO (EG) Nr. 852/2004). Das gilt für jede Betriebsstätte, also auch für eine neue Filiale; wesentliche Änderungen der Tätigkeit und die Schließung eines Betriebs meldest du ebenfalls. Mit einem Foodtruck oder Verkaufswagen registrierst du dich bei der Behörde an deinem Betriebssitz – dort, wo das Fahrzeug steht bzw. wo du wohnst –, nicht bei der am Verkaufsplatz. Bewahre die Bestätigung der Registrierung auf; bei Kontrollen wird sie verlangt. Stellst du selbst Lebensmittel tierischen Ursprungs her oder verarbeitest sie (zum Beispiel als Metzgerei), kann statt der Registrierung eine Zulassung nötig sein (Art. 4 VO (EG) Nr. 853/2004) – frag die Lebensmittelüberwachung.
rechtsgrundlage:
- Art. 6 Abs. 2 Verordnung (EG) Nr. 852/2004
- Art. 4 Verordnung (EG) Nr. 853/2004
