fachlich_zu_pruefen:
- 'R12 (Nutzertest Bäckerei #5): je Betrieb; neue Betriebsstätte über die Zahl der Betriebsstätten (neu_ausloesen_bei) – Filialen als eigene Objekte fehlen in der App'
- Frist „vor Beginn“ nach Rechtsprüfung R11 (Befund 13); laut Nutzertest nennt Art. 6 keinen Zeitpunkt – Termin vor dem Start bestätigen
- 'Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Frage 12, ✔): Auslöser und Text richtig, „vor Beginn“ ist Praxis; Foodtruck: zuständig ist die Behörde am Betriebssitz (Standort des Fahrzeugs bzw. Wohnsitz), nicht am Verkaufsplatz – ergänzt; Zulassung nach Art. 4 VO (EG) Nr. 853/2004 als Hinweis so belassen; Ablage der Registrierungsbestätigung (Frage 15) ergänzt – Bericht noch nicht unterschrieben'
- Zulassung nach Art. 4 VO (EG) Nr. 853/2004 nur als Hinweis (Eigenherstellung tierischer Erzeugnisse)
- Zuständigkeit je Land
- Folgen bei Nichterfüllung nicht in der Spezifikation genannt – Sanktion fachlich ergänzen
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
