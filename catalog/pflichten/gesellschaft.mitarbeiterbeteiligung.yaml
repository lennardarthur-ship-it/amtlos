kurz:
  de: Wenn du Mitarbeitende am Unternehmen beteiligen willst, gibt es dafür besondere Regeln und Modelle wie VSOP.
erklaerung:
  de: 'Für Mitarbeiterbeteiligungen gibt es steuerliche Sonderregeln: Bei Anteilen an jungen Unternehmen kann die Besteuerung des geldwerten Vorteils aufgeschoben werden (§ 19a EStG). Eine schuldrechtliche Alternative ohne echte Anteile sind virtuelle Modelle (VSOP). Amtlos erklärt die Modelle; Vorlagen folgen mit dem Dokumentengenerator.'
