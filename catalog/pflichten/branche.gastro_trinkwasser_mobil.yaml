# E-166 (Prüfmappe Lebensmittelhygiene, Frage 14): Wassertank im Foodtruck – mobile Wasserversorgungsanlage nach TrinkwV
schema_version: 1
id: branche.gastro_trinkwasser_mobil
version: 4
katalog_nr: H.1
titel:
  de: Wassertank im Foodtruck beim Gesundheitsamt anzeigen
kurz:
  de: Hat dein Foodtruck oder Verkaufsstand einen eigenen Wassertank, zeigst du die Inbetriebnahme spätestens vier Wochen vorher beim Gesundheitsamt an und hältst das Wasser hygienisch einwandfrei. Auch die Wiederinbetriebnahme, z. B. nach der Winterpause, zeigst du vier Wochen vorher an, die Stilllegung innerhalb von drei Tagen danach (§ 11 Abs. 2 TrinkwV).
erklaerung:
  de: >-
    Ein Wassertank mit Leitungen in einem Fahrzeug oder Verkaufsstand ist eine mobile Wasserversorgungsanlage (§ 2 Nr. 2
    Buchst. d TrinkwV). Wasser, das du in deinem Lebensmittelbetrieb für Lebensmittel oder zur Reinigung verwendest, ist
    Trinkwasser (§ 2 Nr. 1 Buchst. b TrinkwV) – auch wenn du es nur zum Zubereiten und Händewaschen nimmst. Wer daraus im
    Rahmen einer gewerblichen Tätigkeit Trinkwasser bereitstellt, zeigt dem
    Gesundheitsamt die Inbetriebnahme und Wiederinbetriebnahme sowie wesentliche bauliche oder betriebstechnische
    Veränderungen spätestens vier Wochen vorher an, die Stilllegung innerhalb von drei Tagen (§ 11 Abs. 2 TrinkwV).
    Schließt du dich am Standplatz nur zeitweise an eine Wasserleitung an (z. B. Standrohr des Veranstalters), gilt das
    als zeitweilige Wasserversorgungsanlage (§ 2 Nr. 2 Buchst. f TrinkwV) – frag beim Gesundheitsamt bzw. Veranstalter
    nach den Regeln. Gesundheitsämter verlangen in ihren Merkblättern unter anderem Schläuche und Materialien, die für
    Trinkwasser geeignet sind, und regelmäßige Reinigung. Untersuchung nach Vorgabe des Gesundheitsamts, üblich einmal
    jährlich: Umfang und Häufigkeit legt das Gesundheitsamt fest, untersuchen lässt du das Wasser von einer
    zugelassenen Untersuchungsstelle. Unabhängig davon brauchst du nach dem Lebensmittelhygienerecht genug Trinkwasser
    für Lebensmittel und zum Händewaschen (Anhang II Kapitel III und VII VO (EG) Nr. 852/2004). Die Frist richtet sich
    nach dem Tag, an dem du den Tank in Betrieb nimmst.
rechtsgrundlage:
- § 2 Nr. 1 Buchst. b, Nr. 2 Buchst. d, f TrinkwV
- § 11 Abs. 2 TrinkwV
- Anhang II Kapitel III Nr. 2 Buchst. e, Kapitel VII Verordnung (EG) Nr. 852/2004
