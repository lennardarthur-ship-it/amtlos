# E-166 (Prüfmappe Lebensmittelhygiene, Frage 14): Wassertank im Foodtruck – mobile Wasserversorgungsanlage nach TrinkwV
schema_version: 1
id: branche.gastro_trinkwasser_mobil
version: 1
katalog_nr: H.1
titel:
  de: Wassertank im Foodtruck beim Gesundheitsamt anzeigen
kurz:
  de: Hat dein Foodtruck oder Verkaufsstand einen eigenen Wassertank, zeigst du die Inbetriebnahme spätestens vier Wochen vorher beim Gesundheitsamt an und hältst das Wasser hygienisch einwandfrei.
erklaerung:
  de: >-
    Ein Wassertank mit Leitungen in einem Fahrzeug oder Verkaufsstand ist eine mobile Wasserversorgungsanlage (§ 2 Nr. 2
    Buchst. d TrinkwV). Wer daraus im Rahmen einer gewerblichen Tätigkeit Trinkwasser bereitstellt, zeigt dem
    Gesundheitsamt die Inbetriebnahme und Wiederinbetriebnahme sowie wesentliche bauliche oder betriebstechnische
    Veränderungen spätestens vier Wochen vorher an, die Stilllegung innerhalb von drei Tagen (§ 11 Abs. 2 TrinkwV).
    Schließt du dich am Standplatz nur zeitweise an eine Wasserleitung an (z. B. Standrohr des Veranstalters), gilt das
    als zeitweilige Wasserversorgungsanlage (§ 2 Nr. 2 Buchst. f TrinkwV) – frag beim Gesundheitsamt bzw. Veranstalter
    nach den Regeln. Gesundheitsämter verlangen in ihren Merkblättern unter anderem Schläuche und Materialien, die für
    Trinkwasser geeignet sind, regelmäßige Reinigung und eine Untersuchung des Wassers durch eine zugelassene
    Untersuchungsstelle (in Dortmund zum Beispiel jährlich). Unabhängig davon brauchst du nach dem
    Lebensmittelhygienerecht genug Trinkwasser für Lebensmittel und zum Händewaschen (Anhang II Kapitel III und VII
    VO (EG) Nr. 852/2004). Amtlos fragt nicht ab, ob dein Fahrzeug einen Wassertank hat – ohne Tank entfällt die Anzeige.
rechtsgrundlage:
- § 2 Nr. 2 Buchst. d, f TrinkwV
- § 11 Abs. 2 TrinkwV
- Anhang II Kapitel III Nr. 2 Buchst. e, Kapitel VII Verordnung (EG) Nr. 852/2004
