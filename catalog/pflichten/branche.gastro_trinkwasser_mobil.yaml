fachlich_zu_pruefen:
- 'Neu (E-166): § 2 Nr. 2 Buchst. d, f und § 11 Abs. 2 TrinkwV am Wortlaut geprüft (gesetze-im-internet.de, 22.10.2026)'
- 'Unklar: Stellt ein Foodtruck „im Rahmen einer gewerblichen Tätigkeit Trinkwasser bereit“, wenn er das Tankwasser nur zum Zubereiten und Händewaschen nutzt? Merkblätter der Gesundheitsämter (Dortmund) gehen davon aus – fachlich bzw. rechtlich bestätigen'
- 'Untersuchungspflichten (Umfang, Häufigkeit) und Fundstelle in der TrinkwV nicht geprüft – nur Merkblatt Dortmund (jährlich, zugelassene Untersuchungsstelle)'
- 'Auslöser: Der Check fragt den Wassertank nicht ab – die Pflicht „kommt in Frage“ bei Lebensmitteln mit Reisegewerbe oder Marktstand; Frist vier Wochen vor dem Start bezieht sich auf das Gründungsdatum, nicht auf die Inbetriebnahme des Tanks'
- 'Gültig ab: Inkrafttreten der TrinkwV 2023 (24.6.2023) laut Verordnung gegenlesen'
- Folgen bei Nichterfüllung (Ordnungswidrigkeit nach TrinkwV) nicht geprüft – Sanktion fachlich ergänzen
