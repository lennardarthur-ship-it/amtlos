# Katalog G.71 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: VerpackG seit 12.8.2026 durch VerpackDG (BGBl. 2026 I Nr. 207) abgelöst – Fundstelle am 22.10.2026 belegt
schema_version: 1
id: produkte.verpackung
version: 6
katalog_nr: G.71
titel:
  de: Verpackungen registrieren und lizenzieren
kurz:
  de: Bevor du verpackte Waren erstmals in Verkehr bringst, registrierst du dich im LUCID-Register und beteiligst dich an
    einem System.
erklaerung:
  de: 'Seit 12.8.2026 gelten die EU-Verpackungsverordnung (EU) 2025/40 und das Verpackungsrecht-Durchführungsgesetz (VerpackDG), das das Verpackungsgesetz abgelöst hat. Du registrierst dich weiterhin vor dem erstmaligen Bereitstellen bei der Zentralen Stelle Verpackungsregister (LUCID) und beteiligst Verpackungen, die typischerweise bei privaten Endverbrauchern anfallen, vor der Bereitstellung an einem System (§§ 6, 7 VerpackDG).'
rechtsgrundlage:
- § 6 VerpackDG
- § 7 VerpackDG
- Verordnung (EU) 2025/40
kategorie: produkte
branchen:
- onlinehandel
ausloeser:
  feld: profil.produkte.arten
  op: enthaelt
  wert: verpackung
  label:
    de: Du bringst verpackte Waren in Verkehr.
# Prüfvermerk Rechtsanwalt 22.10.2026: Frist am ersten Inverkehrbringen – Datum nur von Betrieben, die damit noch nicht begonnen haben
# (profil.produkte.verpackung_ab); ohne Datum kein Termin, Bestandsbetriebe bekommen also keine überfällige Frist
frist:
  typ: relativ
  bezug:
    fakt: profil.produkte.verpackung_ab
  versatz: P0D
  zeitpunkt: vor_beginn
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
wiederholung:
  art: einmalig
stelle:
  de: Zentrale Stelle Verpackungsregister (LUCID)
kanal: portal
kosten: null
sanktion:
  text:
    de: Bußgeld bis 100.000 €, wenn die Registrierung fehlt, und bis 200.000 €, wenn Verpackungen nicht an einem System beteiligt sind (§ 66 Abs. 1 Nr. 1, 3, Abs. 3 VerpackDG).
  schwere: hoch
automatisierung: hinweis
status_recht: in_kraft
