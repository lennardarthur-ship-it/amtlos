fachlich_zu_pruefen:
- 'Rechtsstand 21.10.2026: Rechtsgrundlage von VerpackG auf §§ 6, 7 VerpackDG umgestellt (Inhaltsübersicht VerpackDG, IHK Karlsruhe); Wortlaut von §§ 6, 7 nicht abgerufen – Zeitpunkt „vor dem ersten Inverkehrbringen“ und Abgrenzung systembeteiligungspflichtig gegen den Gesetzestext lesen'
- 'Neue Herstellerpflichten aus der PPWR (z. B. Herstellerregister nach Art. 44, Kennzeichnung) und B2B-Verpackungen (§ 68 Abs. 9 VerpackDG, Übergang bis 31.12.2027) nicht abgebildet'
- „Vor dem ersten Inverkehrbringen“ als Frist mit Ereignis abbilden?
- 'Vorprüfung 21.10.2026: Sanktion ergänzt – § 66 Abs. 1 Nr. 1 (Registrierung, § 6) und Nr. 3 (Systembeteiligung, § 7), Abs. 3 gelesen'
