# Katalog G.71 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: VerpackG seit 12.8.2026 durch VerpackDG (BGBl. 2026 I Nr. 207) abgelöst
schema_version: 1
id: produkte.verpackung
version: 4
katalog_nr: G.71
titel:
  de: Verpackungen registrieren und lizenzieren
kurz:
  de: Bevor du verpackte Waren erstmals in Verkehr bringst, registrierst du dich im LUCID-Register und beteiligst dich an
    einem System.
erklaerung:
  de: 'Seit 12.8.2026 gelten die EU-Verpackungsverordnung (EU) 2025/40 und das Verpackungsrecht-Durchführungsgesetz (VerpackDG), das das Verpackungsgesetz abgelöst hat. Du registrierst dich weiterhin bei der Zentralen Stelle Verpackungsregister (LUCID) und beteiligst Verpackungen, die typischerweise bei privaten Endverbrauchern anfallen, an einem System (§§ 6, 7 VerpackDG).'
rechtsgrundlage:
- § 6 VerpackDG
- § 7 VerpackDG
- Verordnung (EU) 2025/40
