# Katalog G.68 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.kuendigungsbutton
version: 4
katalog_nr: G.68
titel:
  de: Kündigungsbutton bei Abos
kurz:
  de: Können Verbraucher auf deiner Website Abos abschließen, brauchst du einen Kündigungsbutton.
erklaerung:
  de: '§ 312k BGB verlangt eine einfache Kündigungsmöglichkeit über die Website – nur für Dauerschuldverhältnisse mit Verbrauchern, die im Internet abgeschlossen werden können. Die Schaltfläche ist mit „Verträge hier kündigen“ beschriftet und führt zu einer Bestätigungsseite, auf der der Kunde seine Angaben macht, mit einer Bestätigungsschaltfläche „jetzt kündigen“ (§ 312k Abs. 2 BGB). Den Eingang der Kündigung bestätigst du dem Kunden (§ 312k Abs. 4 BGB).'
