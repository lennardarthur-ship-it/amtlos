# Katalog G.68 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.widerrufsbelehrung
version: 6
katalog_nr: G.68
titel:
  de: Über das Widerrufsrecht belehren
kurz:
  de: Bei Verträgen mit Verbrauchern über Fernabsatz belehrst du über das Widerrufsrecht.
erklaerung:
  de: Verbraucher haben bei Fernabsatzverträgen in der Regel ein Widerrufsrecht, über das du vor Vertragsschluss informieren musst. Bei Dienstleistungen, etwa Kursen oder Handwerksleistungen, erlischt das Widerrufsrecht, wenn du die Leistung vollständig erbracht hast und der Kunde vorher ausdrücklich zugestimmt und bestätigt hat, dass er sein Widerrufsrecht dann verliert (§ 356 Abs. 5 Nr. 2 BGB). Beginnst du auf Verlangen des Kunden vor Ablauf der Widerrufsfrist, schuldet er bei einem Widerruf Wertersatz für das bereits Geleistete – aber nur, wenn du ihn ordnungsgemäß belehrt hast (§ 357a Abs. 2 BGB). Verwende das Muster nach Anlage 1 zum EGBGB in der Fassung ab 19.6.2026 mit dem Gestaltungshinweis zum Widerrufsbutton. Ausnahmen vom Widerrufsrecht stehen in § 312g Abs. 2 BGB – bei Freizeitkursen und anderen Freizeitangeboten mit festem Termin etwa ist es ausgeschlossen, auch online (§ 312g Abs. 2 Nr. 9 BGB).
rechtsgrundlage:
- § 312d BGB
- § 355 BGB
- § 356 Abs. 3–5 BGB
- § 357a Abs. 2 BGB
- § 312g Abs. 2 BGB
- Art. 246a EGBGB, Anlage 1
