fachlich_zu_pruefen:
- 'R12 (Nutzertest Coach #11): Dienstleistungs-Hinweise (§ 356 Abs. 4, § 357a Abs. 2 BGB) ergänzt; § 312g Abs. 2 Nr. 9 BGB bei Kursen mit festem Termin (auch online) unsicher; Fernabsatz per Telefon, E-Mail oder Messenger als eigene Pflicht (branche.widerruf_fernabsatz)'
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Muster-Widerrufsbelehrung erst nach Prüfung
- Ausnahmen vom Widerrufsrecht als Hinweis
- Muster nach Gestaltungshinweis 3 (Widerrufsbutton, Anlage 1 zu Art. 246a § 1 Abs. 2 S. 2 EGBGB) anpassen (Rechtsprüfung R11 Befund 9)
- Verträge außerhalb von Geschäftsräumen als eigene Pflicht (branche.widerruf_ausserhalb_geschaeftsraeume)
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
- 'Vorprüfung 21.10.2026: Sanktion ergänzt – seit 19.6.2026 steht die Höchstfrist von zwölf Monaten und 14 Tagen in § 356 Abs. 4 Satz 1 BGB (BGBl. 2026 I Nr. 28), der Fristbeginn in Abs. 3'
- 'Vorprüfung 21.10.2026: Erlöschen bei Dienstleistungen seit 19.6.2026 in § 356 Abs. 5 Nr. 2 BGB (vorher Abs. 4, buzer.de) – Zitat angepasst'
