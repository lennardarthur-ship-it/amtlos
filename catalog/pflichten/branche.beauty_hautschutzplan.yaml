# Katalog H.3 · Startbestand aus Spezifikation Abschnitt 4 (E-054); Prüfergebnis Sifa 22.10.2026 (C Katalog H.3): auf weitere Branchen ausgeweitet
schema_version: 1
id: branche.beauty_hautschutzplan
version: 2
katalog_nr: H.3
titel:
  de: Hautschutzplan aushängen
kurz:
  de: Für Tätigkeiten mit Feuchtarbeit oder hautbelastenden Stoffen legst du in einem Hautschutzplan Schutz, Reinigung und
    Pflege fest.
erklaerung:
  de: 'Feuchtarbeit und hautbelastende Stoffe gibt es nicht nur im Salon: in Küche und Spülbereich, bei der Gebäudereinigung, in Praxen (häufige Händedesinfektion, Handschuhe), in der Kfz-Werkstatt (Öle, Kühlschmierstoffe, Lösemittel), in der Backstube und auf dem Bau (Zement, Epoxidharz). Im Hautschutzplan legst du je Tätigkeit fest, welche Schutzhandschuhe, welcher Hautschutz, welche Reinigung und welche Pflege zu verwenden sind, und hängst ihn am Arbeitsplatz aus. Er ergänzt die Gefährdungsbeurteilung und die Unterweisung (TRGS 401 in Verbindung mit §§ 7, 14 GefStoffV). Für das Friseurhandwerk konkretisiert die TRGS 530 den Hautschutz.'
rechtsgrundlage:
- TRGS 401 in Verbindung mit §§ 7, 14 GefStoffV
- TRGS 530
kategorie: branche
branchen:
- beauty_kosmetik
- gastronomie_lebensmittel
- gebaeudereinigung
- gesundheit_pflege
- handwerk
- bau
ausloeser:
  all:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - any:
    - feld: profil.taetigkeit.branchen
      op: enthaelt_eines
      wert:
      - beauty_kosmetik
      - gastronomie_lebensmittel
      - gebaeudereinigung
      - gesundheit_pflege
      label:
        de: In deiner Branche gibt es Feuchtarbeit oder hautbelastende Stoffe.
    - all:
      - feld: profil.taetigkeit.branchen
        op: enthaelt_eines
        wert:
        - handwerk
        - bau
        label:
          de: Dein Betrieb gehört zu Handwerk oder Bau.
      - feld: profil.arbeitsschutz.gefahrstoffe
        op: ==
        wert: true
        label:
          de: Ihr arbeitet mit Gefahrstoffen.
