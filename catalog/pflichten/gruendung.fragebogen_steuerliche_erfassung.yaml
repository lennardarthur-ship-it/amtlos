# Katalog A.5 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: gruendung.fragebogen_steuerliche_erfassung
version: 5
katalog_nr: A.5
titel:
  de: Fragebogen zur steuerlichen Erfassung abgeben
kurz:
  de: Innerhalb eines Monats nach dem Start meldest du dich über ELSTER beim Finanzamt an.
erklaerung:
  de: Im Fragebogen gibst du unter anderem an, ob du die Kleinunternehmerregelung nutzt, und schätzt Umsatz und Gewinn. Danach
    bekommst du deine Steuernummer. Die Frist von einem Monat beginnt mit der Eröffnung des Betriebs bzw. der Aufnahme der
    Tätigkeit (§ 138 Abs. 1b Satz 1, Abs. 4 AO) – bei UG und GmbH also nicht schon mit der Beurkundung oder der Eintragung
    ins Handelsregister. Ohne Steuernummer (oder USt-IdNr.) fehlt auf deinen Rechnungen eine Pflichtangabe (§ 14 Abs. 4 Satz 1
    Nr. 2 UStG).
begriffe:
- begriff:
    de: Kleinunternehmerregelung
  erklaerung:
    de: Wer wenig Umsatz macht, kann ohne Umsatzsteuer abrechnen.
rechtsgrundlage:
- § 138 Abs. 1b, Abs. 4 AO
kategorie: gruendung
ausloeser:
  immer: true
phase: gruendung
voraussetzungen:
- gruendung.elster_konto
frist:
  typ: relativ
  # StB Busch 22.10.2026: Fristbeginn ist die Eröffnung des Betriebs bzw. die Aufnahme der Tätigkeit (§ 138 Abs. 1b Satz 1,
  # Abs. 4 AO), nicht das Gründungsdatum – Beginn der Tätigkeit, ohne eigene Angabe das Startdatum aus dem Profil
  bezug:
    fakt: abgeleitet.taetigkeit_beginn
  versatz: P1M
  zeitpunkt: spaetestens
  # StB Busch 22.10.2026: § 108 Abs. 3 AO gilt
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
wiederholung:
  art: einmalig
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: '§ 379 Abs. 2 Nr. 1 AO erfasst nur Mitteilungen nach § 138 Abs. 2 AO – für die Angaben zur steuerlichen Erfassung ist kein eigenes Bußgeld vorgesehen. Das Finanzamt kann sie mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: formular_vorausfuellen
aktion:
  art: uebermittlung
  ziel: elster.fragebogen
  nachweis_erforderlich: true
erledigung:
  art: bestaetigen
  bestaetigung:
    de: In ELSTER übermittelt
aenderungsnotiz:
  de: Die Monatsfrist läuft ab dem Beginn deiner Tätigkeit, nicht ab der Gründung der Gesellschaft; fällt das Fristende auf ein
    Wochenende oder einen Feiertag, verschiebt es sich auf den nächsten Werktag.
