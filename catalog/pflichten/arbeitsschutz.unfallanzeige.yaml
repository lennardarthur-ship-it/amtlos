fachlich_zu_pruefen:
- Amtlos kennt die AU-Tage beim Melden nicht (Ereignis ohne Payload auswertbar), deshalb Aufgabe bei jedem Unfall mit „trifft
  nicht zu“ (laut Freigabe Sifa 22.10.2026 als Übergang vertretbar, solange der Kurztext die Schwelle nennt); Bedingung auf
  au_tage > 3 oder tödlich umstellen, sobald das Meldeformular die Angaben erfasst und die Engine Payload auswertet (Technik)
