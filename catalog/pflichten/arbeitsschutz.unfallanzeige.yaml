titel:
  de: Arbeitsunfall der Berufsgenossenschaft anzeigen
kurz:
  de: Ist jemand nach einem Arbeitsunfall mehr als drei Tage arbeitsunfähig, zeigst du den Unfall binnen drei Tagen der BG
    an.
erklaerung:
  de: Die Unfallanzeige ist nötig, wenn die Arbeitsunfähigkeit mehr als drei Tage dauert. Amtlos legt die Frist ab dem Unfalltag
    an; ob die Grenze erreicht ist, entscheidest du beim Erledigen.
