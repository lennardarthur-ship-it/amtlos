# Katalog E.57 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: arbeitsschutz.unfallanzeige
version: 2
katalog_nr: E.57
titel:
  de: Arbeitsunfall der Berufsgenossenschaft anzeigen
kurz:
  de: Ist jemand nach einem Arbeitsunfall mehr als drei Tage arbeitsunfähig, zeigst du den Unfall binnen drei Tagen der BG
    an, nachdem du davon erfahren hast.
erklaerung:
  de: Die Unfallanzeige ist nötig, wenn die Arbeitsunfähigkeit mehr als drei Tage dauert. Die drei Tage laufen ab dem Tag, an dem
    du vom Unfall erfahren hast (§ 193 Abs. 4 SGB VII). Amtlos rechnet ab dem Tag, den du beim Unfall einträgst – hast du später
    davon erfahren, trag diesen Tag ein. Tödliche Unfälle und Unfälle mit vielen Verletzten meldest du sofort, zum Beispiel telefonisch.
    Ob die Grenze erreicht ist, entscheidest du beim Erledigen.
rechtsgrundlage:
- § 193 Abs. 4 SGB VII
