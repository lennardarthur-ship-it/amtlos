# Rechtsanwalt Nachprüfung 23.10.2026 (H.1, ändern): Folgen bei Verstoß nach seinem Wortlaut – LMZDV-Bußgeld und „chininhaltig“ als Straftat (§ 6 Abs. 2 AromenDV i. V. m. § 59 Abs. 1 Nr. 21 lit. a LFGB); § 8 Abs. 3 FrSaftErfrischGetrV nicht mehr genannt.
# Sein Satz zu Koffein („über § 6 LMIDV … die Nummer am Wortlaut eintragen“) ist NICHT übernommen: § 6 LMIDV (freirecht.de/g/LMIDV:6, lexmea.de/de/gesetz/lmidv/6, gelesen 23.10.2026) hat vier Absätze; Anhang III Nr. 4 LMIV erfasst nur Abs. 4 Nr. 2 über § 5 Abs. 1 Nr. 14 Buchst. a LMIDV – und § 5 Abs. 1 LMIDV gilt nur für vorverpackte Lebensmittel (freirecht.de/g/LMIDV:5); für nicht vorverpackte erfasst Abs. 4 Nr. 3 (§ 5 Abs. 3 LMIDV) nur die Angaben nach § 4 Abs. 2 LMIDV (Allergene). Rückfrage an Rechtsanwalt.
# R12 (Rechtsprüfung Befund 12): Zusatzstoffe bei loser Ware kenntlich machen
schema_version: 1
id: branche.gastro_zusatzstoffe
version: 5
katalog_nr: H.1
titel:
  de: Zusatzstoffe bei loser Ware kenntlich machen
kurz:
  de: Bei loser Ware und auf der Speisekarte machst du bestimmte Zusatzstoffe kenntlich, etwa „mit Farbstoff“ oder „mit Konservierungsstoff“.
erklaerung:
  de: 'Für Lebensmittel, die du lose abgibst – an der Theke, im Restaurant oder im Imbiss –, gibst du bestimmte Zusatzstoffe an (§ 5 LMZDV): „mit Farbstoff“, „mit Konservierungsstoff“ oder „konserviert“, „mit Antioxidationsmittel“, „mit Geschmacksverstärker“, „geschwefelt“, „geschwärzt“, „gewachst“, „mit Phosphat“, „mit Süßungsmittel(n)“, „enthält eine Phenylalaninquelle“ und „kann bei übermäßigem Verzehr abführend wirken“. Enthält ein Lebensmittel einen der Farbstoffe E 102, E 104, E 110, E 122, E 124 oder E 129 (Azofarbstoffe), steht zum Namen oder zur E-Nummer des Farbstoffs der Warnhinweis „Kann Aktivität und Aufmerksamkeit bei Kindern beeinträchtigen“ (Art. 24 in Verbindung mit Anhang V Verordnung (EG) Nr. 1333/2008; nicht bei Getränken über 1,2 % vol). Für Getränke kommen zwei Angaben dazu, die nicht aus der LMZDV stammen: „chininhaltig“ bei nicht vorverpackten Getränken mit Chinin bis 1,2 % vol (§ 5 Abs. 1 AromenDV) und bei Erfrischungsgetränken mit mehr als 150 mg Koffein je Liter der Hinweis „Erhöhter Koffeingehalt. Für Kinder und schwangere oder stillende Frauen nicht empfohlen“ mit dem Koffeingehalt in mg/100 ml – nicht bei Kaffee und Tee (§ 6 FrSaftErfrischGetrV in Verbindung mit Anhang III Nr. 4.1 LMIV). Üblich sind Fußnoten auf der Speisekarte oder ein Schild an der Ware. Stattdessen kannst du die Angaben auch in einem Aushang, einer schriftlichen Aufstellung oder elektronisch bereithalten, wenn du deutlich darauf hinweist (§ 5 Abs. 3 LMZDV). Die Allergenkennzeichnung ist eine eigene Pflicht; in der Allergenliste von Amtlos kannst du die Zusatzstoffe gleich mit angeben – dann hängt ein Blatt mit beidem aus.'
rechtsgrundlage:
- § 5 LMZDV
- Art. 24 i. V. m. Anhang V Verordnung (EG) Nr. 1333/2008
- § 5 Abs. 1 AromenDV
- § 6 FrSaftErfrischGetrV i. V. m. Anhang III Nr. 4.1 Verordnung (EU) Nr. 1169/2011 (LMIV)
