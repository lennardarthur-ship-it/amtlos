fachlich_zu_pruefen:
- Neu nach Rechtsprüfung R12 (Befund 12) – Fundstelle § 5 LMZDV vom 2.6.2021 (BGBl. I S. 1362) laut Text der LMZDV (Lebensmittelüberwachung Bremen), im BGBl. gegenlesen
- 'Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Fragen 12 und 13, ✔): Rechtsgrundlage § 5 LMZDV stimmt, Liste der Kenntlichmachungen laut Bericht übernommen; „koffeinhaltig“ und „chininhaltig“ nach Anhang III Nr. 4 LMIV i. V. m. § 2 LMIDV (§ 2 LMIDV nicht am Wortlaut gelesen); Zusatzstoffe in die Allergenliste statt eigener Vorlage – Bericht noch nicht unterschrieben'
- 'Azofarbstoffe mit Warnhinweis: Der Bericht nennt „Anhang V LMIV“ – der Warnhinweis steht nach unserem Kenntnisstand in Anhang V VO (EG) Nr. 1333/2008; Fundstelle klären, bevor der Hinweis in den Text kommt'
