# R12 (Rechtsprüfung Befund 12): Zusatzstoffe bei loser Ware kenntlich machen
schema_version: 1
id: branche.gastro_zusatzstoffe
version: 1
katalog_nr: H.1
titel:
  de: Zusatzstoffe bei loser Ware kenntlich machen
kurz:
  de: Bei loser Ware und auf der Speisekarte machst du bestimmte Zusatzstoffe kenntlich, etwa „mit Farbstoff“ oder „mit Konservierungsstoff“.
erklaerung:
  de: 'Für Lebensmittel, die du lose abgibst – an der Theke, im Restaurant oder im Imbiss –, gibst du bestimmte Zusatzstoffe an: zum Beispiel „mit Farbstoff“, „mit Konservierungsstoff“ oder „konserviert“, „mit Antioxidationsmittel“, „mit Geschmacksverstärker“ oder „mit Süßungsmittel“ (§ 5 LMZDV). Üblich sind Fußnoten auf der Speisekarte oder ein Schild an der Ware. Stattdessen kannst du die Angaben auch in einem Aushang, einer schriftlichen Aufstellung oder elektronisch bereithalten, wenn du deutlich darauf hinweist (§ 5 Abs. 3 LMZDV). Die Allergenkennzeichnung ist eine eigene Pflicht.'
rechtsgrundlage:
- § 5 LMZDV
- Verordnung (EG) Nr. 1333/2008
