fachlich_zu_pruefen:
- 'Neu nach Rechtsprüfung R12 (Befund 12) – Fundstelle § 5 LMZDV vom 2.6.2021 (BGBl. I S. 1362) laut Text der LMZDV (Lebensmittelüberwachung Bremen), im BGBl. gegenlesen'
- 'Rückmeldung Lebensmittel (Tim Baum, 22.10.2026, ändern, zu v2): Korrekturen der Fundstellen („chininhaltig“ nach § 5 Abs. 1 AromenDV, Koffeinhinweis nach § 6 FrSaftErfrischGetrV i. V. m. Anhang III Nr. 4.1 LMIV ohne „§ 2 LMIDV“, Azofarbstoff-Warnhinweis nach Art. 24 i. V. m. Anhang V VO (EG) Nr. 1333/2008 im Text) sind in v3 bereits umgesetzt (berichtigter Prüfbericht); § 5 LMZDV und § 7 Abs. 2 Nr. 1 LMZDV bestätigt; Anhang III Nr. 4.1 LMIV nur über Sekundärquelle gelesen'
- 'RA Dr. Weber Runde 3 (23.10.2026), ändern: § 7 Abs. 2 Nr. 1 LMZDV bestätigt, Höhe bis 50.000 € (§ 60 Abs. 2 Nr. 26 lit. a, Abs. 5 LFGB) in seinem Wortlaut übernommen; § 7 Abs. 2 LMZDV (Einleitung „Ordnungswidrig im Sinne des § 60 Absatz 2 Nummer 26 Buchstabe a …“, lxgesetze) und § 60 Abs. 5 LFGB (gesetze-im-internet.de) am 23.10.2026 gelesen'
- 'Hinweis T. Baum (Nachkontrolle der Vorlagen, 23.10.2026, Hinweis 6) – zur Prüfung durch RA Dr. Weber: Die Sanktion nennt nur § 7 LMZDV; für Koffein und Chinin gelten die Straf- und Bußgeldvorschriften der FrSaftErfrischGetrV bzw. der AromenDV – Fundstelle und Höhe nicht geprüft, Text unverändert'
- 'RA Dr. Weber Nachprüfung 23.10.2026 (ändern): Folgen nach seinem Wortlaut (LMZDV, Chinin als Straftat nach § 6 Abs. 2 AromenDV i. V. m. § 59 Abs. 1 Nr. 21 lit. a LFGB) umgesetzt. RÜCKFRAGE Koffein: Er bat, die Nummer in § 6 LMIDV am Wortlaut einzutragen. § 6 LMIDV (freirecht.de, lexmea.de, gelesen 23.10.2026) hat vier Absätze; Anhang III Nr. 4 LMIV ist nur über § 6 Abs. 4 Nr. 2 i. V. m. § 5 Abs. 1 Nr. 14 Buchst. a LMIDV erfasst, und § 5 Abs. 1 LMIDV betrifft nur vorverpackte Lebensmittel; § 6 Abs. 4 Nr. 3 (§ 5 Abs. 3 LMIDV) erfasst bei nicht vorverpackten Lebensmitteln nur die Angaben nach § 4 Abs. 2 LMIDV. Der Koffein-Satz ist deshalb nicht eingetragen – bitte sagen, ob „§ 6 Abs. 4 Nr. 2 LMIDV“ für lose Getränke passt oder eine andere Vorschrift gemeint ist. Quellen nur hier und im Kopfkommentar (Quellenliste unverändert, damit die Freigabe von T. Baum für den Inhalt ohne Folgen nicht entfällt)'
