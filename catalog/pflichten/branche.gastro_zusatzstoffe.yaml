  de: 'Nach dem berichtigten Prüfbericht Lebensmittelhygiene (22.10.2026): Warnhinweis bei Azofarbstoffen ergänzt, „chininhaltig“ nach der Aromen-Durchführungsverordnung, Koffeinhinweis nur für Erfrischungsgetränke über 150 mg/l mit Gehalt; die Zusatzstoffe gibst du in der Allergenliste mit an.'
