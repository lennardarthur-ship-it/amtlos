# R12 (Rechtsprüfung Befund 12): Zusatzstoffe bei loser Ware kenntlich machen
schema_version: 1
id: branche.gastro_zusatzstoffe
version: 2
katalog_nr: H.1
titel:
  de: Zusatzstoffe bei loser Ware kenntlich machen
kurz:
  de: Bei loser Ware und auf der Speisekarte machst du bestimmte Zusatzstoffe kenntlich, etwa „mit Farbstoff“ oder „mit Konservierungsstoff“.
erklaerung:
  de: 'Für Lebensmittel, die du lose abgibst – an der Theke, im Restaurant oder im Imbiss –, gibst du bestimmte Zusatzstoffe an (§ 5 LMZDV): „mit Farbstoff“, „mit Konservierungsstoff“ oder „konserviert“, „mit Antioxidationsmittel“, „mit Geschmacksverstärker“, „geschwefelt“, „geschwärzt“, „gewachst“, „mit Phosphat“, „mit Süßungsmittel(n)“, „enthält eine Phenylalaninquelle“ und „kann bei übermäßigem Verzehr abführend wirken“. Für Getränke kommen „koffeinhaltig“ und „chininhaltig“ dazu – diese Angaben stammen nicht aus der LMZDV, sondern aus Anhang III Nr. 4 LMIV in Verbindung mit § 2 LMIDV. Üblich sind Fußnoten auf der Speisekarte oder ein Schild an der Ware. Stattdessen kannst du die Angaben auch in einem Aushang, einer schriftlichen Aufstellung oder elektronisch bereithalten, wenn du deutlich darauf hinweist (§ 5 Abs. 3 LMZDV). Die Allergenkennzeichnung ist eine eigene Pflicht; in der Allergenliste von Amtlos kannst du die Zusatzstoffe gleich mit angeben – dann hängt ein Blatt mit beidem aus.'
rechtsgrundlage:
- § 5 LMZDV
- Verordnung (EG) Nr. 1333/2008
- Anhang III Nr. 4 Verordnung (EU) Nr. 1169/2011 (LMIV) i. V. m. § 2 LMIDV
