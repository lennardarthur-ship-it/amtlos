# R10: aus branche.gastro_ifsg_belehrung herausgelöst (Rechtsprüfung: Belehrung durch den Arbeitgeber „im Weiteren alle zwei Jahre“, § 43 Abs. 4 IfSG)
schema_version: 1
id: branche.gastro_ifsg_folgebelehrung
version: 3
katalog_nr: H.1
titel:
  de: Belehrung nach § 43 IfSG alle zwei Jahre wiederholen
kurz:
  de: Die Belehrung nach § 43 IfSG wiederholst du für alle, die bei dir mit Lebensmitteln arbeiten, alle zwei Jahre.
erklaerung:
  de: Nach der ersten Belehrung belehrst du deine Beschäftigten im Weiteren alle zwei Jahre über die Tätigkeitsverbote und
    Verpflichtungen nach §§ 42 und 43 IfSG und dokumentierst das. Zwei Jahre nach jeder Belehrung, die du in Amtlos erfasst,
    erinnert Amtlos an die nächste. Hast du deine letzte Belehrung noch nicht in Amtlos erfasst, erfasse sie – dann kennt Amtlos
    den Termin.
rechtsgrundlage:
- § 43 Abs. 4 IfSG
kategorie: branche
branchen:
- gastronomie_lebensmittel
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: gastronomie_lebensmittel
    label:
      de: Dein Betrieb gehört zur Gastronomie oder Lebensmittelbranche.
  # R11 (Rechtsprüfung Befund 7): nur für Beschäftigte, die mit Lebensmitteln nach § 42 IfSG arbeiten – nicht für Bürokräfte
  - feld: profil.ifsg.beschaeftigte
    op: in
    wert:
    - erstmals
    - bescheinigung
    label:
