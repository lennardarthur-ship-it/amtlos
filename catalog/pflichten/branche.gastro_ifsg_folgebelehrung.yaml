fachlich_zu_pruefen:
- 'Rückmeldung Lebensmittel (Tim Baum, 22.10.2026, freigegeben): „Alle zwei Jahre ab der letzten Belehrung“ fachlich richtig umgesetzt'
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 73 Abs. 1a Nr. 16b (§ 43 Abs. 4 Satz 1: „im Weiteren alle zwei Jahre“) und Abs. 2 IfSG gelesen – Bußgeldhöhe laut Prüfvermerk T. Baum durch RA Dr. Weber zu bestätigen'
- 'RA Dr. Weber Runde 3 (23.10.2026): Höhe 25.000 € bestätigt; Nummer am amtlichen Wortlaut geprüft (gesetze-im-internet.de, 23.10.2026): § 73 Abs. 1a Nr. 16b erfasst „entgegen … § 43 Absatz 4 Satz 1 eine Belehrung nicht, nicht richtig, nicht vollständig …“ (§ 43 Abs. 4 Satz 1: „nach Aufnahme ihrer Tätigkeit und im Weiteren alle zwei Jahre“) – „Nr. 16b“ ist richtig, Text unverändert'
