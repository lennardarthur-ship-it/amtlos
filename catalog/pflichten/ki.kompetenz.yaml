# Katalog F.65 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: ki.kompetenz
version: 5
katalog_nr: F.65
titel:
  de: KI-Kompetenz der Beschäftigten fördern
kurz:
  de: Wer KI-Systeme einsetzt, ergreift Maßnahmen, um die KI-Kompetenz der Beschäftigten zu fördern – zum Beispiel mit einer kurzen Schulung.
erklaerung:
  de: Art. 4 KI-Verordnung verlangte seit 2.2.2025, ein ausreichendes Maß an KI-Kompetenz sicherzustellen. Seit dem Digital-Omnibus (VO (EU) 2026/1744, in Kraft seit 27.7.2026) verlangt Art. 4 nur noch Maßnahmen, die die KI-Kompetenz der Personen fördern, die in deinem Auftrag mit KI-Systemen arbeiten; ein bestimmtes Kompetenzniveau ist nicht mehr vorgeschrieben. Eine kurze Schulung mit Nachweis bleibt ein einfacher Weg, das zu zeigen; Amtlos bietet Schulungen mit Bestätigung.
