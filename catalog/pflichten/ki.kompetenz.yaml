katalog_nr: F.65
titel:
  de: KI-Kompetenz der Beschäftigten sicherstellen
kurz:
  de: Wer im Unternehmen mit KI arbeitet, sollte ausreichende KI-Kompetenz haben – fördere sie durch Schulung und halte das fest.
erklaerung:
  de: Art. 4 KI-Verordnung gilt seit 2.2.2025. Nach dem Digital-Omnibus (VO (EU) 2026/1744) musst du die KI-Kompetenz deiner Beschäftigten
    nicht mehr „sicherstellen“, sondern fördern – das ist noch nicht im Amtsblatt gegengelesen. Eine kurze Schulung mit Nachweis bleibt
    der sichere Weg; Amtlos bietet Schulungen mit Bestätigung.
