# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.kleinunternehmer_warnung_80
version: 3
katalog_nr: C.23
titel:
  de: Kleinunternehmergrenze zu 80 % erreicht
kurz:
  de: Deine Rechnungen in Amtlos summieren sich auf mindestens 80 % der Kleinunternehmergrenze; die Grenze liegt bei 100.000 €, im Gründungsjahr bei 25.000 €.
erklaerung:
  de: Die Kleinunternehmerregelung endet ab dem Umsatz, der die Grenze überschreitet. Amtlos zählt dafür die Rechnungen, die
    du in Amtlos gestellt hast. Rechnungen außerhalb von Amtlos sind nicht enthalten.
rechtsgrundlage:
- § 19 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: true
    label:
      de: Du nutzt die Kleinunternehmerregelung.
  - any:
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - all:
        - &id001
          feld: finanzen.umsatz.laufendes_jahr
          op: vorhanden
          label:
            de: Du stellst Rechnungen mit Amtlos.
        - feld: finanzen.umsatz.laufendes_jahr
          op: '>='
          wert:
            regelwert: steuern.ustg19.grenze_gruendungsjahr
            faktor: 0.8
          label:
            de: Deine Rechnungen in Amtlos summieren sich im Gründungsjahr auf mindestens 20.000 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
        - feld: finanzen.umsatz.laufendes_jahr
          op: <
          wert:
            regelwert: steuern.ustg19.grenze_gruendungsjahr
            faktor: 0.95
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - all:
        - *id001
        - feld: finanzen.umsatz.laufendes_jahr
          op: '>='
          wert:
            regelwert: steuern.ustg19.grenze_laufendes_jahr
            faktor: 0.8
          label:
            de: Deine Rechnungen in Amtlos summieren sich in diesem Jahr auf mindestens 80.000 €; die Grenze liegt bei 100.000 €.
        - feld: finanzen.umsatz.laufendes_jahr
          op: <
          wert:
            regelwert: steuern.ustg19.grenze_laufendes_jahr
            faktor: 0.95
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Noch keine Folge – eine Warnung, damit du rechtzeitig planen kannst.
  schwere: mittel
automatisierung: hinweis
einordnung: hinweis
aktion:
  art: abhaken
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Umsatzsteuergesetz § 19
  url: https://www.gesetze-im-internet.de/ustg_1980/__19.html
  abgerufen: null
fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'Umsatzbegriff für die Grenze (G-06): Summe der gestellten Rechnungen (netto, abzüglich Stornos) im Kalenderjahr nach Rechnungsdatum
  – bestätigen'
- Warnstufen 80 % und 95 % aus der Spezifikation
- 'Vorprüfung 21.10.2026 (Abschnitt 7, RDG): Formulierung als Information bzw. Rechenergebnis statt Vorwegnahme des Ergebnisses (Liste in rdg-katalog.md)'
