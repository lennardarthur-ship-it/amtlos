fachlich_zu_pruefen:
- 'E-222 (externer Prüfer 12c, v7): neuer Zweig außerhalb des Gründungsjahrs – Einnahmen laut Amtlos (mit Ersatzregel wie bisher) ab 20.000 € bis unter 23.750 € (steuern.ustg19.grenze_vorjahr × 0.8 … × 0.95), nur wenn Vorjahr laut Profil bzw. App nicht über 25.000 € (sonst gilt „Grenze überschritten“); Kurztext und Erklärung um die Grenze von 25.000 € und die Folge ergänzt, Sätze wörtlich aus steuern.kleinunternehmer_grenze_ueberschritten v7 (kurz) und steuern.kleinunternehmer_naechstes_jahr v6 (Erklärung). Zu prüfen: Auslöser und Text (PRUEFLISTE T-310)'
- 'Steuerberater 22.10.2026, Runde 2 (freigegeben, v5): vorsichtige Zählung für eine Warnung vertretbar – offene Rechnungen ab Rechnungsdatum (Ersatzregel) und Sachentnahmen (§ 3 Abs. 1b UStG) bestätigt. Umgesetzt (v6) nach seiner Empfehlung: Text zu steuerfreien Umsätzen und Anlagenverkäufen; steuerfreie Umsätze (Positionen zu 0 % auf Rechnungen mit Steuerart „befreit“) rechnet die App jetzt heraus. Zu prüfen: nur der neue Textteil (Versionssprung hebt die Freigabe in der App auf). Server: kennt keine Zahlungseingänge und zählt alle Rechnungen nach Rechnungsdatum (wie die Ersatzregel)'
- 'Vorprüfung 21.10.2026 (Abschnitt 7, RDG): Formulierung als Information bzw. Rechenergebnis statt Vorwegnahme des Ergebnisses (Liste in rdg-katalog.md)'
