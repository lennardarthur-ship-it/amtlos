titel:
  de: Gesellschaft im Handelsregister eintragen lassen
kurz:
  de: Der Notar meldet die Gesellschaft zum Handelsregister an; mit der Eintragung entsteht die GmbH oder UG.
erklaerung:
  de: Zur Anmeldung gehört die Gesellschafterliste. Spätere Änderungen, etwa im Gesellschaftsvertrag oder bei der Geschäftsführung,
