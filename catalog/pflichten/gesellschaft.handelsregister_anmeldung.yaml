# Katalog B.15 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.handelsregister_anmeldung
version: 3
katalog_nr: B.15
titel:
  de: Gesellschaft im Register eintragen lassen
kurz:
  de: Die Gesellschaft wird zum Handelsregister angemeldet, die Partnerschaftsgesellschaft zum Partnerschaftsregister – GmbH und UG entstehen erst mit der Eintragung.
erklaerung:
  de: GmbH und UG meldet der Notar zum Handelsregister an. Zur Anmeldung gehört die Gesellschafterliste, und die Geschäftsführung versichert, dass die Einlagen geleistet sind (§§ 7, 8 GmbHG). Die GmbH & Co. KG meldest du ebenfalls über einen Notar zum Handelsregister an (§ 106 HGB i. V. m. § 161 Abs. 2 HGB), die Partnerschaftsgesellschaft zum Partnerschaftsregister (§ 4 PartGG). Spätere Änderungen, etwa im Gesellschaftsvertrag oder bei der Geschäftsführung, werden ebenfalls angemeldet.
rechtsgrundlage:
- §§ 7, 8 GmbHG
- § 106 HGB
- § 161 Abs. 2 HGB
- § 4 PartGG
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_eingetragene_gesellschaft
    op: ==
    wert: true
    label:
      de: Deine Gesellschaft wird im Handels- oder Partnerschaftsregister eingetragen.
  - feld: profil.gesellschaft.handelsregister
    op: '!='
    wert: eingetragen
    label:
      de: Deine Gesellschaft ist noch nicht im Register eingetragen.
phase: gruendung
voraussetzungen:
- gesellschaft.stammkapital_einzahlen
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Registergericht (über den Notar)
kanal: notar
kosten: null
sanktion:
  text:
    de: Die Folgen sind noch nicht fachlich erfasst.
  schwere: mittel
dringend_ohne_termin: true
automatisierung: hinweis
aktion:
  art: formular
  ziel: onboarding.gesellschaft
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
