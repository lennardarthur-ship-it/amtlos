# Katalog D.38 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.sv_anmeldung
version: 3
katalog_nr: D.38
titel:
  de: Beschäftigte bei der Sozialversicherung anmelden
kurz:
  de: Jede neue beschäftigte Person meldest du mit der ersten Lohnabrechnung bei der Krankenkasse an, spätestens sechs Wochen nach Beginn.
erklaerung:
  de: Die Anmeldung zur Sozialversicherung (DEÜV) geht an die Krankenkasse der beschäftigten Person, bei Minijobs an die Minijob-Zentrale.
    Sie ist mit der ersten folgenden Entgeltabrechnung fällig, spätestens sechs Wochen nach Beginn der Beschäftigung. Die Meldung
    läuft über ein systemgeprüftes Lohnprogramm. In Branchen mit Sofortmeldepflicht kommt am ersten Arbeitstag die Sofortmeldung
    dazu.
rechtsgrundlage:
- § 28a SGB IV
- § 6 DEÜV
kategorie: personal
ausloeser:
  ereignis: einstellung
  op: eingetreten
  label:
    de: Du stellst jemanden ein.
