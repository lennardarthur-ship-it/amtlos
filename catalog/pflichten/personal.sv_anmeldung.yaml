aenderungsnotiz:
  de: 'Frist korrigiert: mit der ersten Lohnabrechnung, spätestens sechs Wochen nach Beginn (§ 6 DEÜV). Die Unterlage mit den Meldedaten
    erledigt die Meldung nicht – erledigt ist sie, wenn du die Meldung bestätigst.'
