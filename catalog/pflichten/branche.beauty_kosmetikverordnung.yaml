# Katalog H.3 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.beauty_kosmetikverordnung
version: 6
katalog_nr: H.3
titel:
  de: Kosmetikverordnung bei eigenen Produkten
kurz:
  de: Stellst du eigene Kosmetikprodukte her oder bringst sie unter deinem Namen in Verkehr, gelten die Pflichten der EU-Kosmetikverordnung.
erklaerung:
  de: Wer Kosmetik herstellt oder unter eigenem Namen bzw. eigener Marke in Verkehr bringt, gilt als Hersteller (Art. 2 Abs. 1 lit. d
    Kosmetikverordnung). Vor dem ersten Inverkehrbringen brauchst du eine verantwortliche Person in der EU – das bist du selbst oder
    jemand, den du schriftlich benennst, zum Beispiel dein Lohnhersteller (Art. 4) –, eine Sicherheitsbewertung und eine
    Produktinformationsdatei, die Herstellung nach guter Herstellungspraxis (Art. 8) und die Notifizierung im CPNP-Portal der EU
    (Art. 13). Auf der Verpackung stehen die Pflichtangaben nach Art. 19, etwa Inhaltsstoffe, Mindesthaltbarkeit und Name der
    verantwortlichen Person. Ernste unerwünschte Wirkungen meldest du der Behörde (Art. 23).
rechtsgrundlage:
- Verordnung (EG) Nr. 1223/2009
kategorie: branche
branchen:
- beauty_kosmetik
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: beauty_kosmetik
    label:
      de: Dein Betrieb gehört zur Beauty- und Kosmetikbranche.
  - feld: profil.produkte.arten
    op: enthaelt
    wert: kosmetik
    label:
      de: Du verkaufst Kosmetik.
  - feld: profil.produkte.hersteller
    op: ==
    wert: true
    label:
      de: Du stellst eigene Produkte her, verkaufst sie unter deinem Namen oder importierst sie von außerhalb der EU.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; verantwortliche Person
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 50.000 €, etwa wenn die Produktinformationsdatei fehlt, das Produkt nicht notifiziert ist, Kennzeichnungsangaben fehlen oder ernste unerwünschte Wirkungen nicht gemeldet werden (§ 9 Abs. 2 Nr. 4, 6, 12, 14 KosmetikV in Verbindung mit § 60 Abs. 4 Nr. 2 Buchst. a, Abs. 5 LFGB).'
  schwere: hoch
automatisierung: hinweis
aenderungsnotiz:
  de: Gilt erst, wenn du eigene Kosmetik herstellst, unter deinem Namen verkaufst oder von außerhalb der EU importierst – nicht beim
    Weiterverkauf fremder Markenware.
