fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'CPNP (Art. 13), Kennzeichnung (Art. 19), GMP (Art. 8), ernste unerwünschte Wirkungen (Art. 23), Herstellerbegriff (Art. 2 Abs. 1 lit. d) und verantwortliche Person (Art. 4) im Text (R11, Nutzertest Kosmetik) – Frist „vor dem ersten Inverkehrbringen“ ohne Termin; bestätigen'
- 'Auslöser an die Frage „eigene Produkte, Eigenmarke oder Import von außerhalb der EU“ gekoppelt (R10) – Abgrenzung Herstellung ↔ Weiterverkauf bestätigen'
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 9 Abs. 2 KosmetikV (Nr. 4: Art. 11, Nr. 6: Art. 13, Nr. 12: Art. 19, Nr. 14: Art. 23 VO (EG) Nr. 1223/2009; über gesetze.legal) und § 60 Abs. 4 Nr. 2 Buchst. a, Abs. 5 LFGB gelesen; GMP (Art. 8) und Sicherheitsbewertung (Art. 10) sind in § 9 KosmetikV nicht genannt – fachlich zu bestätigen'
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
