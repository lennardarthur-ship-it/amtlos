# R11 (Nutzertest Tischlerei Befund 6): Feuerlöscher nach ASR A2.2; Prüfergebnis Sifa 22.10.2026 (C Katalog E.54, frei): Prüfabstand bestätigt
schema_version: 1
id: arbeitsschutz.feuerloescher
version: 2
katalog_nr: E.54
titel:
  de: Feuerlöscher bereitstellen und prüfen lassen
kurz:
  de: In deiner Arbeitsstätte stehen ausreichend Feuerlöscher bereit, die spätestens alle zwei Jahre von einer sachkundigen Person geprüft werden.
erklaerung:
  de: Nach der Arbeitsstättenverordnung triffst du Vorkehrungen gegen Brände und lässt Löschgeräte regelmäßig auf ihre Funktionsfähigkeit prüfen
    (§ 4 Abs. 3 ArbStättV). Wie viele Feuerlöscher du brauchst, richtet sich nach Größe und Brandgefährdung der Räume (Technische Regel für
    Arbeitsstätten ASR A2.2). Die Feuerlöscher lässt du spätestens alle zwei Jahre von einer sachkundigen Person prüfen. Brandschutzhelfer
    unter deinen Beschäftigten sind eine eigene Pflicht.
rechtsgrundlage:
- § 4 Abs. 3 ArbStättV
- ASR A2.2
