# R11 (Nutzertest Tischlerei Befund 6): Feuerlöscher nach ASR A2.2
schema_version: 1
id: arbeitsschutz.feuerloescher
version: 1
katalog_nr: E.54
titel:
  de: Feuerlöscher bereitstellen und prüfen lassen
kurz:
  de: In deiner Arbeitsstätte stehen ausreichend Feuerlöscher bereit, die regelmäßig von einer sachkundigen Person geprüft werden.
erklaerung:
  de: Nach der Arbeitsstättenverordnung triffst du Vorkehrungen gegen Brände. Wie viele Feuerlöscher du brauchst, richtet sich nach
    Größe und Brandgefährdung der Räume (Technische Regel für Arbeitsstätten ASR A2.2). Die Feuerlöscher lässt du regelmäßig, in der
    Regel alle zwei Jahre, von einer sachkundigen Person prüfen. Dazu kommen Brandschutzhelfer unter deinen Beschäftigten.
rechtsgrundlage:
- § 4 Abs. 3 ArbStättV
- ASR A2.2
kategorie: arbeitsschutz
ausloeser:
