fachlich_zu_pruefen:
- 'Prüfabstand „spätestens alle zwei Jahre“ laut Prüfergebnis Sifa 22.10.2026 bestätigt – die Erledigung gilt in Amtlos weiter nur für das Kalenderjahr (laufend je Jahr); Abstand aus einem Prüfnachweis übernehmen (laut Freigabe Sifa 22.10.2026 fachlich richtig), sobald es eine Vorlage gibt (Technik)'
