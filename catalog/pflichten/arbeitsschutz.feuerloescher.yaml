# R11 (Nutzertest Tischlerei Befund 6): Feuerlöscher nach ASR A2.2; Prüfergebnis Sifa 22.10.2026 (C Katalog E.54, frei): Prüfabstand bestätigt
schema_version: 1
id: arbeitsschutz.feuerloescher
version: 3
katalog_nr: E.54
titel:
  de: Feuerlöscher bereitstellen und prüfen lassen
kurz:
  de: In deiner Arbeitsstätte stehen ausreichend Feuerlöscher bereit, die spätestens alle zwei Jahre von einer sachkundigen Person geprüft werden.
erklaerung:
  de: Nach der Arbeitsstättenverordnung triffst du Vorkehrungen gegen Brände und lässt Löschgeräte regelmäßig auf ihre Funktionsfähigkeit prüfen
    (§ 4 Abs. 3 ArbStättV). Wie viele Feuerlöscher du brauchst, richtet sich nach Größe und Brandgefährdung der Räume (Technische Regel für
    Arbeitsstätten ASR A2.2). Die Feuerlöscher lässt du spätestens alle zwei Jahre von einer sachkundigen Person prüfen. Brandschutzhelfer
    unter deinen Beschäftigten sind eine eigene Pflicht.
rechtsgrundlage:
- § 4 Abs. 3 ArbStättV
- ASR A2.2
kategorie: arbeitsschutz
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Sachkundige Person (Feuerlöscher-Wartung)
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 5.000 €, wenn Sicherheitseinrichtungen wie Feuerlöscher nicht regelmäßig gewartet und auf ihre Funktionsfähigkeit geprüft werden (§ 9 Abs. 1 ArbStättV in Verbindung mit § 4 Abs. 3 ArbStättV und § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Fehlen geeignete Feuerlöscher, kann die Aufsichtsbehörde Maßnahmen anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
  schwere: mittel
automatisierung: hinweis
erledigung:
  art: laufend
  zeitraum: jahr
status_recht: in_kraft
