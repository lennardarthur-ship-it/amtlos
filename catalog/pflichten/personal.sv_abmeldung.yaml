katalog_nr: D.38
titel:
  de: Beschäftigte bei der Sozialversicherung abmelden
kurz:
  de: Endet eine Beschäftigung, meldest du die Person mit der nächsten Lohnabrechnung bei der Krankenkasse ab, spätestens sechs Wochen nach dem Ende.
erklaerung:
  de: Die Abmeldung geht über das Lohnprogramm an die Krankenkasse bzw. die Minijob-Zentrale. Sie ist mit der ersten folgenden Entgeltabrechnung
    fällig, spätestens sechs Wochen nach dem Ende der Beschäftigung (§ 8 DEÜV). Amtlos zeigt den spätesten Termin.
