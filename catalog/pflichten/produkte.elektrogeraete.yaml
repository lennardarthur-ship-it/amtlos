titel:
  de: Elektrogeräte bei der stiftung ear registrieren
kurz:
  de: Bringst du Elektrogeräte selbst erstmals in Deutschland in Verkehr, registrierst du dich vorher bei der stiftung ear.
erklaerung:
  de: Hersteller und Händler, die als Hersteller gelten, müssen sich nach dem ElektroG vor dem Verkauf registrieren. Als Hersteller
    gilt auch, wer unter eigener Marke verkauft oder Geräte nach Deutschland einführt. Wer bei einem Händler in Deutschland kauft
    und weiterverkauft oder einbaut, ist in der Regel nicht Hersteller.
