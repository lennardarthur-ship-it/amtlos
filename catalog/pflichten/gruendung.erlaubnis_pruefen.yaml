# Katalog A.3 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gruendung.erlaubnis_pruefen
version: 5
katalog_nr: A.3
titel:
  de: Erlaubnis für dein Gewerbe einholen
kurz:
  de: Für manche Gewerbe ist eine Erlaubnis vorgesehen, bevor du anfängst – zum Beispiel für Makler, das Bewachungsgewerbe oder den Ausschank von Alkohol. Ob sie für dich gilt, klärt das Gewerbeamt.
erklaerung:
  de: Erlaubnispflichtig sind unter anderem Makler, Bewachung, Versicherungs- und Finanzanlagenvermittlung (§§ 30–34i GewO). Für
    Gaststätten kommt es auf das Land an – nach dem Gaststättengesetz des Bundes braucht nur der Ausschank alkoholischer Getränke
    eine Erlaubnis (§ 2 GastG), manche Länder verlangen statt einer Erlaubnis nur eine Anzeige. Für einzelne Feste gibt es eine
    vorübergehende Gestattung (§ 12 GastG). Was in deinem Land gilt, klärt das Gewerbeamt. Die Erlaubnis muss vor Aufnahme
    der Tätigkeit vorliegen. Die Reisegewerbekarte ist eine eigene Pflicht.
rechtsgrundlage:
- §§ 30–34i GewO
- § 2 GastG bzw. Gaststättenrecht der Länder
