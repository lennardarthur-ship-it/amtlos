# Katalog A.3 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gruendung.erlaubnis_pruefen
version: 2
katalog_nr: A.3
titel:
  de: Erlaubnis für dein Gewerbe einholen
kurz:
  de: Für manche Gewerbe brauchst du eine Erlaubnis, bevor du anfängst – zum Beispiel als Makler, im Bewachungsgewerbe oder
    in der Gastronomie.
erklaerung:
  de: Erlaubnispflichtig sind unter anderem Makler, Bewachung, Versicherungs- und Finanzanlagenvermittlung (§§ 30–34i GewO),
    Gaststätten nach dem Gaststättenrecht der Länder und das Reisegewerbe (Reisegewerbekarte). Die Erlaubnis muss vor Aufnahme
    der Tätigkeit vorliegen.
rechtsgrundlage:
- §§ 30–34i GewO
- Gaststättenrecht der Länder
