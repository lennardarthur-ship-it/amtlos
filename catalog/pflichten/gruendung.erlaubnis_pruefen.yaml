sanktion:
  text:
    de: 'Wer ein erlaubnispflichtiges Gewerbe ohne Erlaubnis betreibt, riskiert ein Bußgeld bis 5.000 €, bei Finanzanlagenvermittlung und Honorar-Finanzanlagenberatung bis 50.000 € (§ 144 Abs. 1 Nr. 1, Abs. 4 GewO). Eine Gaststätte ohne die nach § 2 Abs. 1 GastG erforderliche Erlaubnis kostet bis 5.000 € (§ 28 Abs. 1 Nr. 1, Abs. 3 GastG) – soweit in deinem Land das Gaststättengesetz des Bundes gilt.'
