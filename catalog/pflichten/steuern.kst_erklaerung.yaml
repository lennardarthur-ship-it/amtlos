# Katalog B.19 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt (bis auf 19 Monate, siehe fachlich_zu_pruefen)
schema_version: 1
id: steuern.kst_erklaerung
version: 4
katalog_nr: B.19
titel:
  de: Körperschaftsteuererklärung abgeben
kurz:
  de: Einmal im Jahr gibst du für deine Gesellschaft elektronisch die Körperschaftsteuererklärung ab.
erklaerung:
  de: Kapitalgesellschaften zahlen Körperschaftsteuer und geben dafür jährlich eine Erklärung ab – ohne Steuerberatung bis 31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO). Das Finanzamt kann die Erklärung früher anfordern oder die Frist auf Antrag verlängern (§ 149 Abs. 4, § 109 AO).
rechtsgrundlage:
- KStG
- § 149 AO
kategorie: steuern
ausloeser:
  feld: abgeleitet.ist_kapitalgesellschaft
  op: ==
  wert: true
  label:
    de: Dein Unternehmen ist eine UG oder GmbH.
frist:
  typ: wiederkehrend
  rhythmus: jaehrlich
  # § 149 Abs. 2 AO: sieben Monate nach Ablauf des Kalenderjahres (31. Juli); beratene Fälle § 149 Abs. 3 AO: letzter
  # Tag im Februar des zweitfolgenden Jahres (31. Juli + 7 Monate, Monatsende-Regel); § 108 Abs. 3 AO: nächster Werktag
  faellig:
    art: tag_nach_periodenende
    monate_nach: 7
    tag: 31
  verlaengerung:
    wenn: { feld: profil.steuerberater, op: "==", wert: true }
    versatz: P7M
  verschiebung: { regel: naechster_werktag, kalender: bundesland }
  erinnerung: [P30D, P7D]
wiederholung:
  art: periodisch
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel (§ 152 Abs. 1 bis 3 AO). Er beträgt für jeden angefangenen Monat 0,25 % der festgesetzten Steuer abzüglich Vorauszahlungen und anzurechnender Steuerabzugsbeträge, mindestens 25 € für jeden angefangenen Monat, höchstens 25.000 € (§ 152 Abs. 5 Satz 2, Abs. 10 AO). Das Finanzamt kann die Besteuerungsgrundlagen schätzen (§ 162 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: hinweis
status_recht: in_kraft
