# Katalog F.59 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.betroffenenanfrage
version: 3
katalog_nr: F.59
titel:
  de: Anfrage einer betroffenen Person beantworten
kurz:
  de: Fragt jemand nach seinen Daten oder verlangt Löschung, antwortest du innerhalb eines Monats.
erklaerung:
  de: 'Betroffene haben unter anderem Rechte auf Auskunft, Berichtigung, Löschung und Widerspruch. Du antwortest innerhalb eines Monats ab Eingang (Art. 12 Abs. 3 DSGVO); fällt das Fristende auf einen Samstag, Sonntag oder Feiertag, endet die Frist am nächsten Werktag (Art. 3 Verordnung (EWG, Euratom) Nr. 1182/71). Ist eine Anfrage komplex oder sind es viele, kannst du die Frist um zwei Monate verlängern – das teilst du der Person innerhalb des ersten Monats mit. Amtlos zeigt die Frist ab Eingang und führt die Anfrage bis zur Antwort.'
rechtsgrundlage:
- Art. 12 Abs. 3 DSGVO
- Art. 15–22 DSGVO
- Art. 3 Verordnung (EWG, Euratom) Nr. 1182/71
kategorie: datenschutz
