# Katalog E.51 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: arbeitsschutz.unterweisung_wiederholen
version: 3
katalog_nr: E.51
titel:
  de: Unterweisung jährlich wiederholen
kurz:
  de: Mindestens einmal im Jahr wiederholst du die Unterweisung.
erklaerung:
  de: Ein Jahr nach jeder Unterweisung erinnert Amtlos an die Wiederholung. Mit der neuen Unterweisung ist die alte erledigt.
    Hast du deine letzte Unterweisung noch nicht in Amtlos erfasst, erfasse sie – dann kennt Amtlos den nächsten Termin.
rechtsgrundlage:
- § 12 ArbSchG
- DGUV Vorschrift 1
kategorie: arbeitsschutz
# gilt mit Beschäftigten auch ohne eine in Amtlos erfasste Unterweisung (z. B. Betrieb mit Beschäftigten seit Jahren);
# den Termin gibt es erst mit dem Ereignis „unterweisung_durchgefuehrt“
