fachlich_zu_pruefen:
- 'E-217 (Rechtsanwalt 27.10.2026, T-278): ohne Angabe zu NIS2 unter 50 Beschäftigten nur in den NIS2-Branchen (IT, Andere,
  Gesundheit und Pflege, Transport und Logistik, Gastronomie und Lebensmittel) bei mehr als 10 Mio. € Umsatz, ohne Umsatzangabe
  „hängt ab“; die Jahresbilanzsumme fragt die App nicht (Technik) – dazu der Satz in der Bedingung'
