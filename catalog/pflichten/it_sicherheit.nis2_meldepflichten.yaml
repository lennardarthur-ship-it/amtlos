# Katalog F.64 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: NIS2UmsuCG seit 6.12.2025 in Kraft, Meldepflichten nach § 32 BSIG
schema_version: 1
id: it_sicherheit.nis2_meldepflichten
version: 6
katalog_nr: F.64
titel:
  de: Sicherheitsvorfälle melden (NIS2)
kurz:
  de: Erhebliche Sicherheitsvorfälle meldest du dem BSI in festen Stufen und Fristen.
erklaerung:
  de: 'Wer unter NIS2 fällt, meldet erhebliche Sicherheitsvorfälle dem BSI in drei Stufen: eine frühe Erstmeldung binnen 24 Stunden, eine Meldung binnen 72 Stunden und eine Abschlussmeldung binnen eines Monats (§ 32 BSIG). Außerdem setzt du Risikomanagement-Maßnahmen um. Die Geschäftsleitung haftet für die Umsetzung.'
rechtsgrundlage:
- § 32 BSIG
kategorie: it_sicherheit
ausloeser:
  all:
  - feld: profil.nis2.betroffen
    op: ==
    wert: ja
    label:
      de: Dein Unternehmen fällt unter NIS2.
  # E-217 (Rechtsanwalt 27.10.2026, T-287): „Für die seltenen Fälle, die unabhängig von der Größe erfasst sind, genügt die Frage
  # NIS2 ja/nein“ – ein ausdrückliches „ja“ gilt unabhängig von Größe, Umsatz und Branche; die Größenregel entscheidet nur,
  # solange die Frage unbeantwortet ist („hängt ab“ bzw. nicht betroffen). Bei „Weiß ich nicht“ steht „NIS2 prüfen“ mit der Frage.
  - any:
    - feld: profil.nis2.betroffen
      op: vorhanden
    # Vorprüfung 21.10.2026 (T-105): kleine Betriebe ausgeblendet – wie die automatische Antwort „nein“ der App
    # E-215 (Rechtsanwalt 26.10.2026, T-239): in den NIS2-Branchen ohne Umsatzangabe „hängt ab“ statt ausgeblendet
    # E-217 (Rechtsanwalt 27.10.2026, T-278): unter 50 statt unter 10 Beschäftigten – darunter nur erfasst, wenn Jahresumsatz
    # und Jahresbilanzsumme je über 10 Mio. € liegen (die Bilanzsumme steht nicht im Profil, daher der Satz in der Bedingung);
    # „IT, Agentur, Freelancer“ wie „Andere“ (erfasst sind vor allem MSP/MSSP, Cloud/Rechenzentrum, Online-Marktplätze,
    # Suchmaschinen, soziale Netzwerke – die Rückfrage entscheidet); weitere NIS2-Branchen Gesundheit und Pflege, Transport und
    # Logistik, Lebensmittel (Gastronomie und Lebensmittel; erfasst nur Großhandel und industrielle Herstellung – die Rückfrage
    # entscheidet). Eine Branche für Industrie/Herstellung hat die Branchenliste nicht. Umsatz bis 10 Mio. € ⇒ nicht erfasst.
    - any:
      - feld: profil.beschaeftigte.gesamt
        op: nicht_vorhanden
      - feld: profil.beschaeftigte.gesamt
        op: '>='
        wert: 50
      - all:
        - feld: profil.taetigkeit.branchen
          op: vorhanden
        - feld: profil.taetigkeit.branchen
          op: enthaelt_eines
          wert:
          - it_agentur_freelancer
          - sonstige
          - gesundheit_pflege
          - transport_logistik
          - gastronomie_lebensmittel
        - not:
            feld: profil.umsatz.vorjahr
            op: '<='
            wert: 10000000
      label:
        de: Dein Betrieb hat mindestens 50 Beschäftigte, oder er ist in einer Branche, in der NIS2 gelten kann, und der Umsatz im Vorjahr lag über 10 Mio. €. Liegt deine Bilanzsumme bei höchstens 10 Mio. €, bist du trotzdem nicht erfasst.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: BSI
kanal: portal
kosten: null
sanktion:
  text:
    de: Bußgeld bis 10 Mio. € für besonders wichtige und bis 7 Mio. € für wichtige Einrichtungen, wenn eine Meldung fehlt, falsch oder zu spät ist; bei mehr als 500 Mio. € Gesamtumsatz bis 2 % bzw. 1,4 % des weltweiten Umsatzes (§ 65 Abs. 2 Nr. 4, Abs. 5 Satz 1 Nr. 1, Abs. 6, 7 BSIG).
  schwere: hoch
automatisierung: hinweis
aenderungsnotiz:
  de: Hast du angegeben, dass NIS2 für dich gilt, gilt der Eintrag unabhängig von der Größe. Ohne Angabe erscheint er ab 50 Beschäftigten, darunter in IT, Gesundheit und Pflege, Transport und Logistik, Gastronomie und Lebensmittel sowie „Andere“ nur bei mehr als 10 Mio. € Umsatz – ohne Umsatzangabe als „hängt ab“.
