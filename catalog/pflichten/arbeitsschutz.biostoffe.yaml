# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Biostoffe: GB, Betriebsanweisung, Unterweisung“, Hinweise Nr. 5, 6): §§ 4, 14 BioStoffV
schema_version: 1
id: arbeitsschutz.biostoffe
version: 2
katalog_nr: E.55
titel:
  de: 'Biostoffe: Gefährdung beurteilen, Betriebsanweisung und Unterweisung'
kurz:
  de: Haben Beschäftigte Kontakt mit Blut, Körperflüssigkeiten, Schimmel oder Keimen, beurteilst du das, schreibst eine Betriebsanweisung und unterweist jährlich mit Unterschrift.
erklaerung:
  de: 'Biostoffe sind Bakterien, Viren, Pilze und Parasiten – etwa bei der Behandlung von Patientinnen und Patienten, beim Umgang mit Blut, bei Kosmetik, Nagel- und Fußpflege oder bei der Reinigung von Sanitärräumen. Vor Aufnahme der Tätigkeit beurteilst du die Gefährdung fachkundig (§ 4 BioStoffV) und dokumentierst sie (§ 7 BioStoffV); überprüft wird mindestens alle zwei Jahre. Für jeden Arbeitsbereich schreibst du eine schriftliche Betriebsanweisung (§ 14 Abs. 1 BioStoffV) – nicht nötig nur bei Tätigkeiten ausschließlich mit Biostoffen der Risikogruppe 1 ohne sensibilisierende oder toxische Wirkung. Anhand der Betriebsanweisung unterweist du mündlich vor Aufnahme der Beschäftigung und danach mindestens jährlich (§ 14 Abs. 2 BioStoffV); Inhalt und Zeitpunkt hältst du schriftlich fest, die Unterwiesenen bestätigen durch Unterschrift (§ 14 Abs. 3 BioStoffV). Für Praxen gilt zusätzlich die TRBA 250; arbeitsmedizinische Vorsorge und Impfangebote sind Teil der Pflicht zur Vorsorge.'
rechtsgrundlage:
- §§ 4, 7 BioStoffV
- § 14 Abs. 1, 2 BioStoffV
- § 14 Abs. 3 BioStoffV (Unterweisung mit Unterschrift)
- TRBA 250
