# Katalog G.70 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: produkte.barrierefreiheit
version: 5
katalog_nr: G.70
titel:
  de: Prüfen, ob deine Produkte unter das BFSG fallen
kurz:
  de: Für bestimmte Produkte (z. B. Computer, Smartphones, E-Book-Reader) gelten Barrierefreiheitsanforderungen – die Kleinstunternehmen-Ausnahme
    gilt dafür nicht verlässlich.
erklaerung:
  de: Das BFSG nennt die betroffenen Produkte abschließend (§ 1 Abs. 2 BFSG). Dazu gehören unter anderem Hardwaresysteme für Verbraucher wie Computer, Zahlungsterminals, Selbstbedienungsterminals, Router und E-Book-Reader. Prüfe, ob deine Produkte dazugehören.
rechtsgrundlage:
- § 1 Abs. 2 BFSG
kategorie: produkte
