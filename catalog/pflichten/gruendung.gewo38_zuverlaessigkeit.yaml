# R12 (Rechtsprüfung Befund 6): überwachungsbedürftige Gewerbe (§ 38 GewO)
schema_version: 1
id: gruendung.gewo38_zuverlaessigkeit
version: 2
katalog_nr: A.3
titel:
  de: Führungszeugnis und Auskunft aus dem Gewerbezentralregister beantragen (§ 38 GewO)
kurz:
  de: Für überwachungsbedürftige Gewerbe wie Gebrauchtwarenhandel oder Schlüsseldienst beantragst du nach der Gewerbeanzeige unverzüglich ein Führungszeugnis und eine Auskunft aus dem Gewerbezentralregister.
erklaerung:
  de: Überwachungsbedürftig sind unter anderem der Handel mit hochwertigen Gebrauchtwaren, Fahrzeugen, Edelmetallen, Schmuck und Altmetall, Auskunfteien und Detekteien, die Vermittlung von Ehen, Partnerschaften, Reisen und Unterkünften sowie Schlüsseldienste und der Einbau von Sicherungseinrichtungen (§ 38 Abs. 1 GewO). Beim Handel mit Gebrauchtwaren erfasst das Gesetz den An- und Verkauf hochwertiger Konsumgüter (§ 38 Abs. 1 Nr. 1 GewO) – Second-Hand-Kleidung oder gebrauchte Bücher regelmäßig nicht. Nach der Gewerbeanzeige prüft die Behörde deine Zuverlässigkeit. Dafür beantragst du unverzüglich ein Führungszeugnis und eine Auskunft aus dem Gewerbezentralregister zur Vorlage bei der Behörde; tust du es nicht, holt die Behörde sie selbst ein.
rechtsgrundlage:
- § 38 Abs. 1 GewO
- § 35 GewO
