# Katalog C.29 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.rechnungen_pflichtangaben
version: 4
katalog_nr: C.29
titel:
  de: Rechnungen mit allen Pflichtangaben schreiben
kurz:
  de: Deine Rechnungen müssen bestimmte Angaben enthalten. Als Kleinunternehmer brauchst du den Hinweis, dass die Steuerbefreiung für Kleinunternehmer gilt (§ 34a UStDV).
erklaerung:
  de: Welche Angaben eine Rechnung braucht, regelt § 14 UStG. Für Kleinbetragsrechnungen bis 250 € brutto gelten Erleichterungen
    (§ 33 UStDV). Kleinunternehmer weisen darauf hin, dass die Steuerbefreiung für Kleinunternehmer gilt (§ 34a UStDV). Bist du
    zur Rechnung verpflichtet, stellst du sie innerhalb von sechs Monaten nach Ausführung der Leistung aus (§ 14 Abs. 2 Satz 1
    Nr. 1 und 2 UStG).
rechtsgrundlage:
- § 14 UStG
- § 19 UStG
- §§ 33, 34a UStDV
