katalog_nr: C.29
titel:
  de: Rechnungen mit allen Pflichtangaben schreiben
kurz:
  de: Deine Rechnungen müssen bestimmte Angaben enthalten; bist du zur Rechnung verpflichtet – etwa bei Leistungen an andere Unternehmen –, stellst du sie innerhalb von sechs Monaten nach Ausführung der Leistung aus (§ 14 Abs. 2 Satz 2 UStG). Als Kleinunternehmer brauchst du den Hinweis, dass die Steuerbefreiung für Kleinunternehmer gilt (§ 34a UStDV).
erklaerung:
  de: Welche Angaben eine Rechnung braucht, regelt § 14 UStG. Für Kleinbetragsrechnungen bis 250 € brutto gelten Erleichterungen
    (§ 33 UStDV). Kleinunternehmer weisen darauf hin, dass die Steuerbefreiung für Kleinunternehmer gilt (§ 34a UStDV). Zur
    Rechnung verpflichtet bist du bei Leistungen an andere Unternehmer für deren Unternehmen, an juristische Personen, die keine
    Unternehmer sind, und bei steuerpflichtigen Werklieferungen oder sonstigen Leistungen im Zusammenhang mit einem Grundstück –
    dann auch gegenüber Privatkunden; nicht bei Umsätzen, die nach § 4 Nr. 8 bis 29 UStG steuerfrei sind. In diesen Fällen
    stellst du die Rechnung innerhalb von sechs Monaten nach Ausführung der Leistung aus (§ 14 Abs. 2 Satz 2 Nr. 1 bis 3 UStG).
    Amtlos nennt dafür keinen eigenen Termin, weil es den Tag der Leistung nicht kennt.
rechtsgrundlage:
