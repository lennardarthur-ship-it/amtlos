# Katalog G.66 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.impressum
version: 5
katalog_nr: G.66
titel:
  de: Impressum auf Website und Social-Media-Profilen
kurz:
  de: Auf deiner Website und deinen geschäftlichen Profilen in sozialen Netzwerken stellst du ein Impressum mit den Pflichtangaben
    bereit – leicht erkennbar und immer erreichbar.
erklaerung:
  de: Das Impressum nennt unter anderem Name, Anschrift und Kontakt, bei Gesellschaften auch Vertretung und Register. Auch ein
    geschäftliches Profil zum Beispiel bei Instagram oder Facebook ist ein digitaler Dienst mit Impressumspflicht – verlinke dort
    dein Impressum. Je nach Rechtsform gehören dazu Rechtsform und Vertretung, Register und Registernummer, Umsatzsteuer- oder
    Wirtschafts-Identifikationsnummer, die zuständige Kammer oder Aufsichtsbehörde und das Kapital nur, wenn du Angaben dazu machst –
    die Vorlage „Impressum“ führt dich durch die Liste. Erledigt ist es, wenn es auf deiner Website veröffentlicht und verlinkt ist.
rechtsgrundlage:
- § 5 DDG
kategorie: online
branchen:
- onlinehandel
ausloeser:
  any:
  - feld: profil.online.website
    op: ==
    wert: true
    label:
      de: Du hast eine Website.
  - feld: profil.vertrieb.kanaele
    op: enthaelt_eines
    wert:
    - onlineshop
    - app
    label:
      de: Du verkaufst über einen Onlineshop oder eine App.
  - feld: profil.online.social_media
    op: ==
    wert: true
    label:
      de: Du hast ein geschäftliches Profil in sozialen Netzwerken.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Bußgeld bis 50.000 € (§ 33 Abs. 2 Nr. 1, Abs. 6 DDG), dazu Abmahnungen nach dem Wettbewerbsrecht.
  schwere: hoch
automatisierung: hinweis
aenderungsnotiz:
