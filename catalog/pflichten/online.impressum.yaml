# Katalog G.66 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.impressum
version: 1
katalog_nr: G.66
titel:
  de: Impressum auf der Website
kurz:
  de: Auf deiner Website stellst du ein Impressum mit den Pflichtangaben bereit – leicht erkennbar und immer erreichbar.
erklaerung:
  de: Das Impressum nennt unter anderem Name, Anschrift und Kontakt, bei Gesellschaften auch Vertretung und Register. Der
    Online-Check prüft, ob es verlinkt ist.
rechtsgrundlage:
- § 5 DDG
kategorie: online
