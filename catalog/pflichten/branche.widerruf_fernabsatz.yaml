# R12 (Rechtsprüfung Befund 2): Fernabsatz per Telefon, E-Mail oder Messenger – Widerrufsbelehrung
schema_version: 1
id: branche.widerruf_fernabsatz
version: 2
katalog_nr: G.68
titel:
  de: Bei Aufträgen per Telefon, E-Mail oder Messenger über das Widerrufsrecht belehren
kurz:
  de: Nimmst du Aufträge von Privatkunden per Telefon, E-Mail oder Messenger an, haben sie meist 14 Tage Widerrufsrecht – darüber belehrst du vor Vertragsschluss.
erklaerung:
  de: Schließt du einen Vertrag mit einem Verbraucher ausschließlich über Fernkommunikationsmittel – Telefon, E-Mail, Brief oder Messenger –, ist das ein Fernabsatzvertrag, wenn dein Betrieb für solche Verträge eingerichtet ist (§ 312c BGB). Der Kunde kann ihn 14 Tage lang widerrufen (§ 312g, § 355 BGB). Darüber informierst du vor Vertragsschluss und bestätigst den Vertrag mit der Belehrung auf einem dauerhaften Datenträger, etwa per E-Mail. Fehlt die Belehrung, läuft die Widerrufsfrist bis zu 12 Monate und 14 Tage (§ 356 Abs. 3, 4 BGB); widerruft der Kunde dann, schuldet er für erbrachte Leistungen keinen Wertersatz (§ 357a Abs. 2 BGB). Bei Dienstleistungen erlischt das Widerrufsrecht, wenn du vollständig geleistet hast und der Kunde vorher ausdrücklich zugestimmt und bestätigt hat, dass er sein Widerrufsrecht dann verliert (§ 356 Abs. 5 Nr. 2 BGB). Willst du vor Ablauf der Frist anfangen, lass dir das ausdrücklich vom Kunden verlangen und halte es fest.
rechtsgrundlage:
- § 312c BGB
- § 312g BGB
- § 356 Abs. 3, 4 BGB
- § 356 Abs. 5 BGB
- § 357a Abs. 2 BGB
