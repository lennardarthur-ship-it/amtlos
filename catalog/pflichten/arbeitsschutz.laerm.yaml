# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Lärm: Gehörschutz, Lärmbereiche“): LärmVibrationsArbSchV
schema_version: 1
id: arbeitsschutz.laerm
version: 2
katalog_nr: E.53
titel:
  de: 'Lärm: messen, Gehörschutz und Lärmbereiche'
kurz:
  de: Ist es an Arbeitsplätzen laut, etwa an Holzbearbeitungsmaschinen, mit Schlagschraubern oder Trennschleifern, ermittelst du die Lärmbelastung und sorgst ab 80 dB(A) für Gehörschutz.
erklaerung:
  de: 'In der Gefährdungsbeurteilung ermittelst du, ob Beschäftigte Lärm ausgesetzt sind – wenn nötig mit Messungen durch eine fachkundige Person (§ 3, § 4 LärmVibrationsArbSchV). Die Auslösewerte liegen bei 80 und 85 dB(A) Tages-Lärmexpositionspegel bzw. 135 und 137 dB(C) Spitzenschalldruckpegel (§ 6). Technische Maßnahmen wie leisere Maschinen und Kapselung gehen vor (§ 7 Abs. 1). Ab dem unteren Auslösewert stellst du Gehörschutz bereit und unterweist die Beschäftigten, ab dem oberen Auslösewert müssen sie ihn tragen (§ 8, § 11). Bereiche, in denen der obere Auslösewert überschritten werden kann, kennzeichnest du als Lärmbereich und stellst ein Lärmminderungsprogramm auf (§ 7 Abs. 4, 5). Arbeitsmedizinische Vorsorge ist ab 80 dB(A) anzubieten und ab 85 dB(A) Pflicht – das steht bei der Vorsorge. Das betrifft ausdrücklich auch die Kfz-Werkstatt und die Holzverarbeitung und Tischlerei. Für Vibrationen (zum Beispiel Bohrhammer, Rüttelplatte) gilt dieselbe Verordnung.'
