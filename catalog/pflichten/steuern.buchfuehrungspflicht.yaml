# Katalog C.28 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.buchfuehrungspflicht
version: 5
katalog_nr: C.28
titel:
  de: Doppelte Buchführung
kurz:
  de: Nach deinen Angaben kommt die doppelte Buchführung mit Jahresabschluss in Frage – für Kapitalgesellschaften immer, für andere je nach Rechtsform und Größe.
erklaerung:
  de: 'Bücher nach den Regeln der doppelten Buchführung führen Kapitalgesellschaften und die GmbH & Co. KG immer. Eingetragene
    Kaufleute (e. K.) sind befreit, wenn sie an zwei aufeinanderfolgenden Abschlussstichtagen höchstens 800.000 € Umsatz und
    80.000 € Jahresüberschuss haben (§ 241a HGB). Steuerlich wirst du nach § 141 AO erst buchführungspflichtig, wenn das Finanzamt
    es dir mitteilt – das kann es, wenn dein Umsatz über 800.000 € oder dein Gewinn über 80.000 € liegt. Bis dahin ermittelst du
    den Gewinn mit der Einnahmen-Überschuss-Rechnung. Die Buchführung ist eine laufende Pflicht; den Jahresabschluss macht in der
    Regel deine Steuerberatung.'
rechtsgrundlage:
- §§ 238, 241a HGB
- § 141 AO
kategorie: steuern
ausloeser:
  any:
  - feld: abgeleitet.ist_kapitalgesellschaft
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine Kapitalgesellschaft.
  - feld: profil.rechtsform
    op: ==
    wert: gmbh_co_kg
    label:
      de: Dein Unternehmen ist eine GmbH & Co. KG und damit nach dem Handelsgesetzbuch buchführungspflichtig.
  # e.K.: nach HGB buchführungspflichtig, außer die Grenzen des § 241a HGB werden eingehalten (zwei aufeinanderfolgende Jahre;
  # vereinfacht über das Vorjahr, im Gründungsjahr über die Schätzung für das erste Jahr)
  - all:
    - feld: profil.rechtsform
      op: ==
      wert: ek
      label:
        de: Du bist als Kauffrau oder Kaufmann im Handelsregister eingetragen.
    - any:
      - all:
        - feld: abgeleitet.ist_gruendungsjahr
          op: ==
          wert: false
        - feld: abgeleitet.noch_nicht_gestartet
          op: ==
          wert: false
        - any:
          - feld: profil.umsatz.vorjahr
            op: '>'
            wert:
              regelwert: steuern.hgb241a.grenze_umsatz
            label:
              de: Dein Umsatz im Vorjahr lag über 800.000 € – die Befreiung nach § 241a HGB greift nicht.
          - feld: profil.gewinn.vorjahr
            op: '>'
            wert:
              regelwert: steuern.hgb241a.grenze_gewinn
            label:
              de: Dein Gewinn im Vorjahr lag über 80.000 € – die Befreiung nach § 241a HGB greift nicht.
      - all:
        - feld: abgeleitet.ist_gruendungsjahr
          op: ==
          wert: true
        - any:
          - feld: profil.umsatz.prognose_laufendes_jahr
            op: '>'
            wert:
              regelwert: steuern.hgb241a.grenze_umsatz
            label:
              de: Dein erwarteter Umsatz im ersten Jahr liegt über 800.000 € – die Befreiung nach § 241a HGB greift nicht.
          - feld: profil.gewinn.prognose_laufendes_jahr
            op: '>'
            wert:
              regelwert: steuern.hgb241a.grenze_gewinn
            label:
              de: Dein erwarteter Gewinn im ersten Jahr liegt über 80.000 € – die Befreiung nach § 241a HGB greift nicht.
  # § 141 AO: Pflicht erst nach Mitteilung des Finanzamts (§ 141 Abs. 2 AO)
  - all:
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - feld: abgeleitet.noch_nicht_gestartet
        op: ==
        wert: false
      # § 141 AO gilt nur für gewerbliche Unternehmer und Land- und Forstwirte, nicht für freie Berufe
      - feld: profil.taetigkeit.einordnung
        op: '!='
        wert: freiberuf
    - any:
      - feld: profil.umsatz.vorjahr
        op: '>'
        wert:
          regelwert: steuern.ao141.grenze_umsatz
        label:
          de: Dein Umsatz im Vorjahr lag über der Grenze für die Buchführungspflicht nach § 141 AO.
      - feld: profil.gewinn.vorjahr
        op: '>'
        wert:
          regelwert: steuern.ao141.grenze_gewinn
        label:
          de: Dein Gewinn im Vorjahr lag über der Grenze für die Buchführungspflicht nach § 141 AO.
    - feld: profil.steuern.buchfuehrung_mitteilung
      op: ==
      wert: true
      label:
        de: Das Finanzamt hat dir mitgeteilt, dass du Bücher führen musst.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst bzw. deine Steuerberatung
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 25.000 €, wenn buchungspflichtige Geschäftsvorfälle nicht oder unrichtig aufgezeichnet werden und dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz 1 Nr. 3, Abs. 6 AO). Wer gesetzlich vorgeschriebene Handelsbücher nicht führt oder die Bilanz nicht rechtzeitig aufstellt, macht sich strafbar, wenn später die Zahlungen eingestellt werden oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird: Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe (§ 283b Abs. 1 Nr. 1, 3, Abs. 3 StGB).'
  schwere: hoch
automatisierung: partner
erledigung:
  art: bestaetigen
  zeitraum: jahr
  bestaetigung:
    de: Bücher für dieses Jahr laufend geführt
aenderungsnotiz:
  de: 'Eingetragene Kaufleute unter den Grenzen des § 241a HGB sind nicht mehr buchführungspflichtig; die Pflicht nach § 141 AO
    gilt erst nach Mitteilung des Finanzamts. Eine Unterlage erledigt die Buchführung nicht mehr.'
