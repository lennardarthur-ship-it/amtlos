fachlich_zu_pruefen:
- 'Neu nach Rechtsprüfung R11 (T-114) – Wortlaut § 7 PAngV (Tisch, Vorlage, Aushang, Eingang) bestätigen'
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 13 und § 20 Nr. 1 (§ 13 Abs. 1 Satz 1), Nr. 4 (§ 13 Abs. 2 Satz 1) PAngV, § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954 gelesen; künftiger Rahmen bis 100.000 € nach § 3 Abs. 1, 3 PAngG aus dem Gesetzentwurf BT-Drs. 21/5873 (laut BR-Drs. 499/26 unverändert beschlossen, laut buzer verkündet am 19.10.2026, BGBl. 2026 I Nr. 314); Inkrafttreten laut Entwurf am ersten Tag des auf die Verkündung folgenden Quartals – Datum im BGBl. prüfen; Rechtsgrundlage und Quelle nennen § 7 PAngV – § 7 ist laut Inhaltsübersicht „Rückerstattbare Sicherheit“, Gaststätten stehen in § 13 PAngV: Rechtsgrundlage korrigieren – fachlich zu bestätigen'
