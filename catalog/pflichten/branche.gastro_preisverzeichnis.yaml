# R11 (Rechtsprüfung T-114): Preisverzeichnis in Gaststätten nach § 7 PAngV
schema_version: 1
id: branche.gastro_preisverzeichnis
version: 2
katalog_nr: G.70
titel:
  de: Preisverzeichnis für Speisen und Getränke
kurz:
  de: In deiner Gaststätte legst du ein Preisverzeichnis aus und hängst neben dem Eingang die Preise der wichtigsten Speisen und Getränke aus.
erklaerung:
  de: Gaststätten legen Preisverzeichnisse für Speisen und Getränke auf den Tischen aus oder legen sie jedem Gast vor der Bestellung
    und auf Verlangen bei der Abrechnung vor; alternativ hängen sie sie gut lesbar aus. Zusätzlich hängt neben dem Eingang ein
    Verzeichnis mit den Preisen der wesentlichen Speisen und Getränke (§ 7 PAngV). Die Preise sind Endpreise einschließlich
    Umsatzsteuer und Bedienung.
rechtsgrundlage:
- § 7 PAngV
kategorie: branche
branchen:
- gastronomie_lebensmittel
ausloeser:
  feld: profil.erlaubnis.gaststaette
  op: ==
  wert: true
  label:
    de: Du betreibst eine Gaststätte.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch das Ordnungsamt
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 25.000 €, wenn Preise nicht in einem Preisverzeichnis angegeben sind oder das Preisverzeichnis nach § 13 Abs. 2 Satz 1 PAngV nicht oder nicht rechtzeitig vorgelegt wird (§ 20 Nr. 1, 4 PAngV in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954). Das Preisverzeichnis neben dem Eingang (§ 13 Abs. 2 Satz 2 PAngV) ist in § 20 PAngV nicht genannt. Nach dem Gesetz vom 19.10.2026 (BGBl. 2026 I Nr. 314) künftig bis 100.000 € (§ 3 Abs. 1, 3 PAngG).'
  schwere: niedrig
automatisierung: hinweis
status_recht: in_kraft
