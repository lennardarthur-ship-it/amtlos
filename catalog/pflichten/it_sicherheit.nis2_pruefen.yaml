# Katalog F.64 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: it_sicherheit.nis2_pruefen
version: 3
katalog_nr: F.64
titel:
  de: Prüfen, ob NIS2 für dich gilt
kurz:
  de: Kläre, ob dein Unternehmen nach Sektor und Größe unter die NIS2-Regeln fällt.
erklaerung:
  de: NIS2 betrifft Unternehmen bestimmter Sektoren ab einer bestimmten Größe. Wer betroffen ist, muss sich beim BSI registrieren
    und Sicherheitsvorfälle melden. Beantworte die Frage im Profil, sobald du es weißt.
rechtsgrundlage:
- NIS2-Richtlinie (EU) 2022/2555
- BSIG
kategorie: it_sicherheit
ausloeser:
  all:
  - any:
    - feld: profil.nis2.betroffen
      op: nicht_vorhanden
      label:
        de: Du hast noch nicht angegeben, ob NIS2 für dich gilt.
    - feld: profil.nis2.betroffen
      op: ==
      wert: unklar
      label:
        de: Du bist unsicher, ob NIS2 für dich gilt.
  # R11 (Nutzertests Gründerin, Kosmetik): Kleinbetriebe unter 50 Beschäftigten fallen nur in wenigen IT-nahen Sektoren
  # größenunabhängig unter NIS2 – sonst nicht fragen
  - not:
      all:
      - feld: profil.beschaeftigte.gesamt
        op: <
        wert: 50
      - any:
        - feld: profil.taetigkeit.branchen
          op: nicht_vorhanden
        - not:
            feld: profil.taetigkeit.branchen
            op: enthaelt_eines
            wert:
            - it_agentur_freelancer
            - sonstige
    label:
      de: Dein Betrieb ist groß genug oder in einer Branche, für die NIS2 auch ohne Größenschwelle gelten kann.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Hilfe beim BSI
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Ohne diese Klärung bleibt offen, ob Registrierung und Meldepflichten gelten.
  schwere: mittel
automatisierung: hinweis
einordnung: hinweis
aktion:
  art: formular
  ziel: onboarding.daten
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: NIS2-Richtlinie
  url: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022L2555
  abgerufen: null
fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Sektoren und Größenschwellen stehen nicht in der Spezifikation – als Betroffenheitscheck fachlich ergänzen
- Vorbereitender Schritt – Darstellung bestätigen
- 'Ausgeblendet bei unter 50 Beschäftigten außer IT/Andere (R11) – Umsatz- und Bilanzschwelle (über 10 Mio. €) und größenunabhängige Sektoren (z. B. DNS, Vertrauensdienste, Telekommunikation) nicht abgebildet; bestätigen'
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
pruefung:
  status: entwurf
  geprueft_von: null
  geprueft_am: null
