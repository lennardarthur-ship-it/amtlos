fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Sektoren und Größenschwellen stehen nicht in der Spezifikation – als Betroffenheitscheck fachlich ergänzen
- Vorbereitender Schritt – Darstellung bestätigen
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
