# Katalog F.64 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: it_sicherheit.nis2_pruefen
version: 5
katalog_nr: F.64
titel:
  de: Prüfen, ob NIS2 für dich gilt
kurz:
  de: Kläre, ob dein Unternehmen nach Sektor und Größe unter die NIS2-Regeln fällt.
erklaerung:
  de: 'NIS2 betrifft Unternehmen bestimmter Sektoren ab einer bestimmten Größe – in der Regel ab 50 Beschäftigten oder mehr als 10 Mio. € Jahresumsatz und Jahresbilanzsumme. Liegt deine Bilanzsumme bei höchstens 10 Mio. €, bist du trotzdem nicht erfasst. Unabhängig von der Größe erfasst sind unter anderem Vertrauensdiensteanbieter, Registries von Top-Level-Domains, DNS-Diensteanbieter und Anbieter öffentlicher Telekommunikationsnetze (§ 28 Abs. 3 BSIG). Wer betroffen ist, muss sich beim BSI registrieren und Sicherheitsvorfälle melden. Beantworte die Frage im Profil, sobald du es weißt.'
rechtsgrundlage:
- NIS2-Richtlinie (EU) 2022/2555
- § 28 BSIG
kategorie: it_sicherheit
ausloeser:
  all:
  - any:
    - feld: profil.nis2.betroffen
      op: nicht_vorhanden
      label:
        de: Du hast noch nicht angegeben, ob NIS2 für dich gilt.
    - feld: profil.nis2.betroffen
      op: ==
      wert: unklar
      label:
        de: Du bist unsicher, ob NIS2 für dich gilt.
  # R11 (Nutzertests Gründerin, Kosmetik): Kleinbetriebe unter 50 Beschäftigten fallen nur in wenigen IT-nahen Sektoren
  # größenunabhängig unter NIS2 – sonst nicht fragen
  - not:
      all:
      - feld: profil.beschaeftigte.gesamt
        op: <
        wert: 50
      # Prüfvermerk Rechtsanwalt 22.10.2026: Umsatzschwelle 10 Mio. € – ohne Angabe wie bisher als klein gewertet (Bilanzsumme nicht im Profil)
      - any:
        - feld: profil.umsatz.vorjahr
          op: nicht_vorhanden
        - feld: profil.umsatz.vorjahr
          op: '<='
          wert: 10000000
      - any:
        - feld: profil.taetigkeit.branchen
          op: nicht_vorhanden
        # E-217 (Rechtsanwalt 27.10.2026, T-278): weitere NIS2-Branchen Gesundheit und Pflege, Transport und Logistik,
        # Lebensmittel (Gastronomie und Lebensmittel) – die Frage NIS2 ja/nein entscheidet
        - not:
            feld: profil.taetigkeit.branchen
            op: enthaelt_eines
            wert:
            - it_agentur_freelancer
            - sonstige
            - gesundheit_pflege
            - transport_logistik
            - gastronomie_lebensmittel
    label:
      de: Dein Betrieb ist groß genug (mindestens 50 Beschäftigte oder mehr als 10 Mio. € Umsatz) oder in einer Branche, in der NIS2 gelten kann.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Hilfe beim BSI
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Ohne diese Klärung bleibt offen, ob Registrierung und Meldepflichten gelten.
  schwere: mittel
automatisierung: hinweis
einordnung: hinweis
aenderungsnotiz:
  de: Auch in Gesundheit und Pflege, Transport und Logistik sowie Gastronomie und Lebensmittel fragt Amtlos jetzt, ob NIS2 für dich gilt, solange du keinen Umsatz angegeben hast.
aktion:
  art: formular
  ziel: onboarding.daten
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
