# Katalog F.58 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.avv
version: 4
katalog_nr: F.58
titel:
  de: Auftragsverarbeitungsverträge abschließen
kurz:
  de: Mit Dienstleistern, die für dich Daten verarbeiten (z. B. Cloud, IT-Hoster, Newsletter-Tool), schließt du einen Auftragsverarbeitungsvertrag.
erklaerung:
  de: 'Der Vertrag regelt, wie der Dienstleister die Daten nach deinen Weisungen verarbeitet; du schließt ihn vor Beginn der Verarbeitung ab. Einen Auftragsverarbeitungsvertrag brauchst du etwa mit IT-Hoster, Cloud-Anbieter, Newsletter-Tool oder Kassen-Cloud. Keinen brauchst du mit Steuerberatung, Rechtsanwälten, Banken, der Post oder einem Lohnbüro mit eigener Fachverantwortung – sie sind selbst Verantwortliche. Amtlos führt die Liste deiner Dienstleister und legt die Verträge ab.'
begriffe:
- begriff:
    de: Auftragsverarbeitung
  erklaerung:
    de: Ein Dienstleister verarbeitet Daten in deinem Auftrag und nach deinen Weisungen.
rechtsgrundlage:
- Art. 28 DSGVO
kategorie: datenschutz
branchen:
- it_agentur_freelancer
ausloeser:
  all:
  - any:
    - feld: profil.datenverarbeitung.arten
      op: enthaelt_eines
      wert:
      - kundendaten
      - beschaeftigtendaten
      - gesundheitsdaten
      - videoueberwachung
      - newsletter
      - tracking
      label:
        de: Du verarbeitest Daten über Menschen (z. B. Kunden oder Beschäftigte).
    - feld: abgeleitet.hat_beschaeftigte
      op: ==
      wert: true
      label:
        de: Du beschäftigst mindestens eine Person.
  - feld: profil.datenschutz.dienstleister
    op: ==
    wert: true
    label:
      de: Du nutzt Dienstleister, die für dich Daten verarbeiten.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst mit dem Dienstleister
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 10 Mio. € oder bei Unternehmen bis 2 % des weltweiten Jahresumsatzes des Vorjahres, je nachdem, welcher Betrag höher ist, bei Verstößen gegen die Pflichten nach Art. 28 DSGVO (Art. 83 Abs. 4 Buchst. a DSGVO).'
  schwere: mittel
automatisierung: hinweis
aktion:
  art: link
  ziel: app.dienstleister
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: DSGVO Art. 28
  url: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  abgerufen: null
- titel: 'DSGVO Art. 83 (gesetze.legal)'
  url: https://gesetze.legal/eu/vo_eu_2016_679/83
  abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- 'Frist „vor Beginn der Verarbeitung“ (Prüfvermerk RA Dr. Weber 22.10.2026) nur im Text – kein Ereignis „Dienstleister beauftragt“'
pruefung:
  status: freigegeben
  geprueft_von:
    - RA Dr. Ulrich Weber
  geprueft_am: '2026-10-23'
  geprueft_version: 4
