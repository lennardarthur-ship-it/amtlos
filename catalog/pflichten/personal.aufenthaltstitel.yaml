sanktion:
  text:
    de: Wer jemanden ohne die erforderliche Erlaubnis beschäftigt, riskiert ein Bußgeld bis 500.000 € (§ 404 Abs. 2 Nr. 3, Abs. 3 SGB III). Endet die Beschäftigung vorzeitig und teilst du das der Ausländerbehörde nicht binnen vier Wochen mit, riskierst du bis 30.000 € (§ 98 Abs. 2a Nr. 2, Abs. 5 AufenthG); für eine fehlende Kopie sieht § 98 AufenthG kein eigenes Bußgeld vor.
