fachlich_zu_pruefen:
- 'Freigabe RA Dr. Weber 22.10.2026: Ergänzung „Bußgeld für fehlende Kopie/Mitteilung – § 98 Abs. 2a Nr. 1, 2, Abs. 5 AufenthG (Höhe am Wortlaut prüfen)“ nur teilweise umgesetzt: Laut Wortlaut (gesetze.legal, anwalt24.de, 22.10.2026) erfasst Abs. 2a Nr. 2 die Mitteilung nach § 4a Abs. 5 Satz 3 Nr. 3 (bis 30.000 €, Abs. 5) – übernommen; Abs. 2a Nr. 1 betrifft die Beauftragung mit Dienst- oder Werkleistungen (§ 4a Abs. 5 Satz 1, bis 500.000 €), für die Kopie (Satz 3 Nr. 2) gibt es keinen Tatbestand – Abweichung vom Prüfer bestätigen lassen'
