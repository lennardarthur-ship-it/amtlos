# R11 (Nutzertest Gebäudereinigung Befund 5): Prüf- und Aufbewahrungspflicht nach § 4a Abs. 5 AufenthG
# Offen (Produkt, kein Prüfpunkt): Erinnerung zum Ablauf des Titels (Feld „gültig bis“ bei Mitarbeitern) – laut Freigabe Weber 22.10.2026 sinnvoll
schema_version: 1
id: personal.aufenthaltstitel
version: 3
katalog_nr: D.38
titel:
  de: Aufenthaltstitel prüfen und Kopie aufbewahren
kurz:
  de: Beschäftigst du Menschen ohne EU-, EWR- oder Schweizer Staatsangehörigkeit, prüfst du vor Beginn, ob sie bei dir arbeiten
    dürfen, und bewahrst eine Kopie des Aufenthaltstitels auf.
erklaerung:
  de: Wer nicht die Staatsangehörigkeit eines EU- oder EWR-Staats oder der Schweiz hat, darf nur arbeiten, wenn der Aufenthaltstitel
    das erlaubt. Als Arbeitgeber prüfst du vor Beginn, ob ein solcher Titel oder eine Erlaubnis zur Beschäftigung vorliegt, und
    bewahrst für die Dauer der Beschäftigung eine Kopie auf, auf Papier oder elektronisch (§ 4a Abs. 5 AufenthG). Achte auf das
    Ablaufdatum des Titels. Endet die Beschäftigung vorzeitig, teilst du das der Ausländerbehörde binnen vier Wochen mit (§ 4a Abs. 5 S. 3 Nr. 3 AufenthG).
rechtsgrundlage:
- § 4a Abs. 5 AufenthG
- § 98 Abs. 2a Nr. 2 AufenthG
