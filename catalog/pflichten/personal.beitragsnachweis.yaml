- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (§ 111 Abs. 1 SGB IV (gelesen) nennt § 28f Abs. 3 nicht; Folgen (Schätzung durch die Einzugsstelle, Säumniszuschläge) fachlich klären) – nach Ergänzung wieder „hoch“'
