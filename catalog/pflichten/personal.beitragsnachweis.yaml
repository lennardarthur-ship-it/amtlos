# Katalog D.40 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.beitragsnachweis
version: 3
katalog_nr: D.40
titel:
  de: Beitragsnachweis übermitteln
kurz:
  de: Zwei Arbeitstage vor Fälligkeit der Beiträge übermittelst du den Beitragsnachweis an die Krankenkassen.
erklaerung:
  de: Der Beitragsnachweis kündigt der Krankenkasse die Beiträge an. Er muss zwei Arbeitstage vor dem Fälligkeitstag vorliegen
    und wird vom Lohnprogramm übermittelt.
rechtsgrundlage:
- § 28f SGB IV
kategorie: personal
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
frist:
  typ: wiederkehrend
  rhythmus: monatlich
  faellig:
    art: n_letzter_bankarbeitstag
    n: 3
    arbeitstage_vorher: 2
  verschiebung:
    regel: keine
    kalender: bankarbeitstage
wiederholung:
  art: periodisch
stelle:
  de: Krankenkassen (über Lohnprogramm)
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Kein eigenes Bußgeld vorgesehen (§ 111 SGB IV nennt § 28f Abs. 3 nicht). Liegt der Beitragsnachweis nicht zwei Arbeitstage vor Fälligkeit vor, kann die Einzugsstelle das Arbeitsentgelt schätzen, bis der Nachweis ordnungsgemäß übermittelt ist (§ 28f Abs. 3 Satz 2 SGB IV).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: partner
status_recht: in_kraft
