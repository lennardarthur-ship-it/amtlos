fachlich_zu_pruefen:
- „Arbeitstage“ als Bankarbeitstage umgesetzt – bestätigen (G-13)
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt (§ 111 SGB IV amtlich gelesen, § 28f Abs. 3 Satz 2 über lxgesetze.de; Säumniszuschläge (§ 24 SGB IV) nicht geprüft; Schwere bleibt bis zur fachlichen Bestätigung „mittel“) – fachlich zu bestätigen'
