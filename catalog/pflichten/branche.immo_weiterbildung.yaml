# Katalog H.8 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.immo_weiterbildung
version: 4
katalog_nr: H.8
titel:
  de: Weiterbildungspflicht (Immobilien und Finanzen)
kurz:
  de: Als Immobilienmakler, Wohnimmobilienverwalter, Versicherungs- oder Finanzanlagenvermittler bildest du dich regelmäßig weiter.
erklaerung:
  de: Immobilienmakler und Wohnimmobilienverwalter bilden sich innerhalb von drei Kalenderjahren 20 Stunden weiter (§ 34c Abs. 2a GewO), Versicherungsvermittler 15 Stunden je Kalenderjahr (§ 34d Abs. 9 GewO), Finanzanlagenvermittler und Honorar-Finanzanlagenberater (§ 34f, § 34h GewO) ebenfalls 15 Stunden je Kalenderjahr (§ 15b FinVermV). Die Nachweise bewahrst du auf und legst sie der Behörde auf Verlangen vor.
rechtsgrundlage:
- § 34c Abs. 2a GewO
- § 34d Abs. 9 GewO
- § 15b FinVermV
kategorie: branche
branchen:
- immobilien_finanzen
