kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 5.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig weiterbildest (§ 144 Abs. 2 Nr. 5a, 7d, Abs. 4 GewO). Für Finanzanlagenvermittler und Honorar-Finanzanlagenberater ist ein Verstoß nach § 26 FinVermV bußgeldbewehrt.'
