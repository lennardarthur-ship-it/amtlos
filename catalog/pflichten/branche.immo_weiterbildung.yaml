katalog_nr: H.8
titel:
  de: Weiterbildungspflicht (Immobilien und Finanzen)
kurz:
  de: Für bestimmte erlaubnispflichtige Tätigkeiten gilt eine regelmäßige Weiterbildungspflicht – nur wo sie noch gilt.
erklaerung:
  de: Immobilienmakler und Wohnimmobilienverwalter bilden sich innerhalb von drei Kalenderjahren 20 Stunden weiter (§ 34c Abs. 2a GewO), Versicherungsvermittler 15 Stunden je Kalenderjahr (§ 34d Abs. 9 GewO). Die Nachweise bewahrst du auf und legst sie der Behörde auf Verlangen vor.
rechtsgrundlage:
- § 34c Abs. 2a GewO
- § 34d Abs. 9 GewO
