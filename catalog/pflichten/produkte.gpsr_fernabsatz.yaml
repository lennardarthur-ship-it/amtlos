# Prüfvermerk RA Dr. Weber 22.10.2026 zu produkte.gpsr (G.73): Fernabsatzangaben (Art. 19) nur beim Online-Verkauf – eigener Auslöser
schema_version: 1
id: produkte.gpsr_fernabsatz
version: 1
katalog_nr: G.73
titel:
  de: 'Produktsicherheit (GPSR): Angaben im Online-Angebot'
kurz:
  de: Verkaufst du Verbraucherprodukte online oder auf einem Marktplatz, nennst du die Angaben zu Hersteller, Produkt und Sicherheit
    schon im Angebot.
erklaerung:
  de: Wer Produkte im Fernabsatz anbietet – zum Beispiel im Onlineshop, in einer App oder auf einem Marktplatz –, nennt im Angebot
    deutlich und gut sichtbar den Hersteller mit Name, Handelsmarke, Postanschrift und elektronischer Adresse, gegebenenfalls die
    verantwortliche Person in der EU, die Angaben zur Identifizierung des Produkts, etwa ein Bild und den Typ, sowie Warnhinweise
    und Sicherheitsinformationen (Art. 19 GPSR). Das gilt auch für fremde Markenware. Lebensmittel fallen nicht unter die Verordnung.
rechtsgrundlage:
- Art. 19 Verordnung (EU) 2023/988 (GPSR)
- Art. 2 Abs. 3 VO (EU) 2023/988 (Lebensmittel ausgenommen)
