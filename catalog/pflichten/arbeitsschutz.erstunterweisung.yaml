titel:
  de: Vor Arbeitsbeginn unterweisen
kurz:
  de: Jede neue Person unterweist du vor Aufnahme der Tätigkeit zu den Gefahren und Schutzmaßnahmen – spätestens am ersten Arbeitstag vor Arbeitsbeginn.
erklaerung:
  de: 'Die Unterweisung erklärt die Gefährdungen am Arbeitsplatz und die Schutzmaßnahmen aus der Gefährdungsbeurteilung; sie findet während der Arbeitszeit statt, bei der Einstellung vor Aufnahme der Tätigkeit (§ 12 Abs. 1 ArbSchG, § 4 Abs. 1 DGUV Vorschrift 1). Rechtlich genügt es, wenn du am ersten Arbeitstag vor Arbeitsbeginn unterweist – Amtlos erinnert dich am Tag davor. Amtlos protokolliert die Unterweisung digital; bei Gefahrstoffen und Biostoffen bestätigen die Unterwiesenen sie durch Unterschrift (§ 14 Abs. 2 GefStoffV, § 14 Abs. 3 BioStoffV).'
