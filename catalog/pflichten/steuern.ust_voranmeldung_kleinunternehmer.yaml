# Katalog C.37 · E-231 (Steuerberater 27.10.2026 zu T-324: Voranmeldung des Kleinunternehmers nach § 18 Abs. 4a UStG als
# Katalogeintrag mit Frist) – neu als Entwurf, noch nicht fachlich geprüft
# E-233: erscheint erst mit der Freigabe (nicht_vor_freigabe) – bis dahin nicht im Bündel der App, kein Startblocker; der
# Hinweis der App am Beleg und bei der Übernahme in die Voranmeldung (§ 18 Abs. 4a UStG) bleibt
schema_version: 1
id: steuern.ust_voranmeldung_kleinunternehmer
version: 1
katalog_nr: C.37
nicht_vor_freigabe: true
titel:
  de: Umsatzsteuer-Voranmeldung als Kleinunternehmer bei § 13b und Erwerben aus dem EU-Ausland
kurz:
  de: Schuldest du als Kleinunternehmer Umsatzsteuer nach § 13b UStG oder auf Erwerbe aus dem EU-Ausland, gibst du für die
    Monate, in denen diese Steuer entsteht, eine Voranmeldung ab – bis zum 10. des Folgemonats.
erklaerung:
  de: 'Auch als Kleinunternehmer schuldest du in zwei Fällen selbst Umsatzsteuer: als Leistungsempfänger nach § 13b UStG – zum
    Beispiel für sonstige Leistungen eines Unternehmers aus dem übrigen Gemeinschaftsgebiet (§ 13b Abs. 1 UStG) – und auf
    innergemeinschaftliche Erwerbe (§ 1 Abs. 1 Nr. 5 UStG), wenn deine Erwerbe die Erwerbsschwelle übersteigen oder du auf sie
    verzichtet hast (§ 1a Abs. 3, 4 UStG). Wer ausschließlich Steuer für solche Umsätze zu entrichten hat, gibt Voranmeldungen
    und eine Steuererklärung ab (§ 18 Abs. 4a Satz 1 UStG). Voranmeldungen sind nur für die Zeiträume abzugeben, in denen die
    Steuer für diese Umsätze zu erklären ist (§ 18 Abs. 4a Satz 2 UStG): Für jeden Monat, in dem eine solche Steuer entsteht,
    übermittelst du die Voranmeldung bis zum 10. des Folgemonats über ELSTER und zahlst die Steuer bis dahin (§ 18 Abs. 1
    UStG). Eine Vorsteuer ziehst du als Kleinunternehmer nicht ab. Für das Jahr, in dem eine solche Steuer entstanden ist,
    gibst du außerdem die Umsatzsteuer-Jahreserklärung ab. Amtlos erinnert jeden Monat, weil es die Steuer nur aus deinen
    Belegen kennt – in Monaten ohne solche Steuer gibst du keine Voranmeldung ab.'
rechtsgrundlage:
- § 18 Abs. 4a UStG
- § 18 Abs. 1 UStG
- § 13b UStG
- § 1 Abs. 1 Nr. 5, § 1a UStG
