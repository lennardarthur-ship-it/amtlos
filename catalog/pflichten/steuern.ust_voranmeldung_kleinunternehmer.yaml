fachlich_zu_pruefen:
- 'E-234: v2 nach der Antwort des Steuerberaters vom 27.10.2026 (S5 und Prüfpaket: „anpassen“): Voranmeldungszeitraum nach
  § 18 Abs. 2 UStG (in der Regel Kalendervierteljahr, Kalendermonat bei mehr als 9.000 € Steuer im Vorjahr), Frist 10. Tag
  nach Ablauf; Auslöser auf Waren und Leistungen von Unternehmen im Ausland erweitert (§ 13b Abs. 1 und Abs. 2 Nr. 1 UStG,
  neue Frage profil.einkauf.ausland_unternehmen); Jahreserklärung bis 31.07. des Folgejahres (§ 149 Abs. 2 AO), nur für Jahre
  mit solcher Steuer – Kurztext und Sätze in seiner Fassung. Offen: Ob die Neugründer-Regel (§ 18 Abs. 2 Satz 4 UStG) hier
  greift, klärt er noch – bis dahin vierteljährlich; danach v2 (bzw. v3 mit Neugründer-Zweig) bitte freigeben (Steuerberater
  alles außer Folgen; die Folgen hat der Rechtsanwalt am 27.10.2026 bestätigt; PRUEFLISTE T-345)'
