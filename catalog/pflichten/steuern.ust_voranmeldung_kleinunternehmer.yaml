fachlich_zu_pruefen:
- 'E-237: Quelle zum Voranmeldungszeitraum (Steuerberater, Nachtrag 28.10.2026): Abschnitt 18.7 Abs. 1 Satz 4 UStAE – die
  monatliche Abgabe im Gründungs- und Folgejahr (§ 18 Abs. 2 Satz 4 UStG) erfasst keine Neugründungen, bei denen aufgrund der
  Tätigkeit keine Umsatzsteuer festzusetzen ist; Kleinunternehmer (§ 19 Abs. 1 UStG) sind dort ausdrücklich genannt. Daher
  Kalendervierteljahr (§ 18 Abs. 4a Satz 2 i. V. m. Abs. 2 Satz 1 UStG), Kalendermonat nur bei mehr als 9.000 € Steuer im
  Vorjahr (§ 18 Abs. 2 Satz 2 UStG), keine freiwillige monatliche Abgabe (§ 18 Abs. 4a Satz 3 UStG).'
