fachlich_zu_pruefen:
- 'E-231: neu als Entwurf auf Anweisung des Steuerberaters (27.10.2026, T-324) – Text nach dem Wortlaut von § 18 Abs. 4a Satz
  1 und 2 UStG (gesetze-im-internet.de, 27.10.2026). (1) § 18 Abs. 4a Satz 2 spricht von „Voranmeldungszeiträumen“ (nach Abs.
  2 grundsätzlich das Kalendervierteljahr); der Steuerberater nannte „Monate“ – Frist so übernommen, bitte bestätigen. (2)
  Auslöser: Kleinunternehmer und „kauft bei Unternehmen in anderen EU-Ländern ein“ (profil.einkauf.eu_unternehmen) – die Engine
  kennt die Belege nicht, daher monatliche Erinnerung mit dem Satz „in Monaten ohne solche Steuer keine Voranmeldung“; ohne
  Angabe zum Einkauf „hängt ab“ (E-206) – dann fragt die App danach; § 13b-Fälle im Inland (z. B. § 13b Abs. 2 Nr. 4 UStG)
  erfasst der Auslöser nicht – dort bleibt der Hinweis der App am Beleg und bei der Voranmeldung. (3) Jahreserklärung: nur
  als Satz im Text – der Eintrag „Umsatzsteuer-Jahreserklärung abgeben“ (C.27) gilt nur ohne Kleinunternehmerregelung. (4)
  Folgen: Wortlaut wie C.24 (Voranmeldung) übernommen, Einstufung „hoch“ wie dort – bitte prüfen (Steuerberater alles außer
  Folgen, Rechtsanwalt Folgen; PRUEFLISTE T-337)'
