  text:
    de: 'Keine eigene Bußgeldvorschrift gegenüber dem Betrieb. Die Pflicht zur Konformitätserklärung (Art. 16 VO (EG) Nr. 1935/2004, Art. 15 VO (EU) Nr. 10/2011) trifft den Lieferanten. Die Lebensmittelüberwachung fragt die Erklärungen aber bei Kontrollen ab und kann Maßnahmen anordnen (§ 39 LFGB).'
