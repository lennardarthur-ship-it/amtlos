# Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Frage 14 (a)): Kennzeichnung vorverpackter Lebensmittel nach Art. 9 LMIV
schema_version: 1
id: branche.gastro_kennzeichnung_vorverpackt
version: 3
katalog_nr: H.1
titel:
  de: Selbst abgepackte Lebensmittel kennzeichnen
kurz:
  de: Stellst du selbst abgepackte Lebensmittel ins Regal oder verschickst du sie – etwa Kekse, Marmelade oder Granola –, gehören die Pflichtangaben auf die Packung.
erklaerung:
  de: >-
    Für vorverpackte Lebensmittel schreibt Art. 9 LMIV vor, was auf der Packung stehen muss. Dazu gehören unter anderem
    die Bezeichnung, das Zutatenverzeichnis, die Allergene – im Zutatenverzeichnis hervorgehoben, zum Beispiel fett –,
    die Nettofüllmenge, das Mindesthaltbarkeits- oder Verbrauchsdatum, Name und Anschrift deines Betriebs und die
    Nährwertdeklaration. Handwerklich hergestellte Lebensmittel, die du in kleinen Mengen direkt an Endverbraucher oder an
    Geschäfte vor Ort abgibst, brauchen keine Nährwertdeklaration (Anhang V Nr. 19 LMIV). Die übrigen Angaben brauchen
    sie trotzdem. Wichtig ist die Abgrenzung: Ware, die du im eigenen Laden für den Verkauf am selben Tag abpackst (z. B.
    Brot in Tüten, Kekse in Beuteln an der Theke) oder die du auf Wunsch der Kundschaft verpackst, gilt als lose Ware
    (Art. 44 Abs. 1 LMIV). Dafür reicht die Allergen- und Zusatzstoffinformation wie bei loser Ware. Legst du solche Ware
    allerdings zur Selbstbedienung aus, brauchst du die Pflichtangaben bis auf Nettofüllmenge und Nährwertdeklaration
    (§ 4 Abs. 1 LMIDV) – außer bei Dauerbackwaren und Süßwaren, die du im Laden abpackst, wenn du die Kundschaft auf
    andere Weise informierst. Die volle Kennzeichnung nach Art. 9 LMIV braucht Ware mit längerer Haltbarkeit (Marmelade,
    Granola, Kekse im Regal über Tage), Ware für andere Händler und Ware für den Onlineversand.
rechtsgrundlage:
- Art. 9 Verordnung (EU) Nr. 1169/2011 (LMIV)
- Anhang V Nr. 19 Verordnung (EU) Nr. 1169/2011 (LMIV)
- Art. 44 Abs. 1 Verordnung (EU) Nr. 1169/2011 (LMIV)
- § 4 LMIDV
