# Prüfbericht Lebensmittelhygiene (Lebensmittelfachbeauftragter, 22.10.2026, Frage 14 (a)): Kennzeichnung vorverpackter Lebensmittel nach Art. 9 LMIV
schema_version: 1
id: branche.gastro_kennzeichnung_vorverpackt
version: 4
katalog_nr: H.1
titel:
  de: Selbst abgepackte Lebensmittel kennzeichnen
kurz:
  de: Stellst du selbst abgepackte Lebensmittel ins Regal oder verschickst du sie – etwa Kekse, Marmelade oder Granola –, gehören die Pflichtangaben auf die Packung.
erklaerung:
  de: >-
    Für vorverpackte Lebensmittel schreibt Art. 9 LMIV vor, was auf der Packung stehen muss. Dazu gehören unter anderem
    die Bezeichnung, das Zutatenverzeichnis, die Allergene – im Zutatenverzeichnis hervorgehoben, zum Beispiel fett –,
    die Nettofüllmenge, das Mindesthaltbarkeits- oder Verbrauchsdatum, Name und Anschrift deines Betriebs und die
    Nährwertdeklaration. Handwerklich hergestellte Lebensmittel, die du in kleinen Mengen direkt an Endverbraucher oder an
    Geschäfte vor Ort abgibst, brauchen keine Nährwertdeklaration (Anhang V Nr. 19 LMIV). Die übrigen Angaben brauchen
    sie trotzdem. Wichtig ist die Abgrenzung: Ware, die du im eigenen Laden zum unmittelbaren Verkauf abpackst (z. B.
    Brot in Tüten, Kekse in Beuteln an der Theke) oder die du auf Wunsch der Kundschaft verpackst, gilt als lose Ware
    (Art. 44 Abs. 1 LMIV). Dafür reicht die Allergen- und Zusatzstoffinformation wie bei loser Ware. Legst du solche Ware
    allerdings zur Selbstbedienung aus, brauchst du die Pflichtangaben bis auf Nettofüllmenge und Nährwertdeklaration
    (§ 4 Abs. 1 LMIDV) – außer bei Dauerbackwaren und Süßwaren, die du im Laden abpackst, wenn du die Kundschaft auf
    andere Weise informierst. Brot und Brötchen in Tüten im SB-Regal sind keine Dauerbackwaren – sie brauchen die
    Angaben. Kekse oder Lebkuchen, die du im Laden abpackst, sind Dauerbackwaren – dafür reicht eine Information auf
    andere Weise, z. B. ein Schild. Die volle Kennzeichnung nach Art. 9 LMIV braucht Ware mit längerer Haltbarkeit (Marmelade,
    Granola, Kekse im Regal über Tage), Ware für andere Händler und Ware für den Onlineversand.
rechtsgrundlage:
- Art. 9 Verordnung (EU) Nr. 1169/2011 (LMIV)
- Anhang V Nr. 19 Verordnung (EU) Nr. 1169/2011 (LMIV)
- Art. 44 Abs. 1 Verordnung (EU) Nr. 1169/2011 (LMIV)
- § 4 LMIDV
kategorie: branche
branchen:
- gastronomie_lebensmittel
- onlinehandel
ausloeser:
  all:
  # Rückmeldung Lebensmittelfachbeauftragter 22.10.2026: auch Onlinehändler mit eigenen Lebensmitteln (wie branche.gastro_rueckverfolgbarkeit)
  - any:
    - feld: profil.taetigkeit.branchen
      op: enthaelt
      wert: gastronomie_lebensmittel
      label:
        de: Dein Betrieb gehört zur Gastronomie oder Lebensmittelbranche.
    - all:
      - feld: profil.taetigkeit.branchen
        op: enthaelt
        wert: onlinehandel
        label:
          de: Du handelst online.
      - feld: profil.produkte.arten
        op: enthaelt
        wert: lebensmittel
        label:
          de: Du verkaufst Lebensmittel.
  - feld: profil.gastro.vorverpackt
    op: ==
    wert: true
    label:
      de: Du verkaufst selbst abgepackte Lebensmittel.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch die Lebensmittelüberwachung
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 50.000 €, wenn vorverpackte Lebensmittel ohne die vorgeschriebenen Pflichtangaben in den Verkehr gebracht werden (§ 6 Abs. 4 Nr. 2 in Verbindung mit § 5 Abs. 1 LMIDV, § 60 Abs. 2 Nr. 26 Buchst. a, Abs. 5 LFGB); einzelne Verstöße (Täuschung) sind Straftaten (§ 6 Abs. 1 LMIDV, § 59 Abs. 1 Nr. 21 Buchst. a LFGB).'
  schwere: mittel
automatisierung: hinweis
aktion:
  art: abhaken
aenderungsnotiz:
  de: 'Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Abgrenzung zu loser Ware erklärt; gilt jetzt auch für Onlinehändler, die selbst abgepackte Lebensmittel verkaufen.'
