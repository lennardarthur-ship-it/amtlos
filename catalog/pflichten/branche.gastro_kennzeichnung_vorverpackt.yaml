fachlich_zu_pruefen:
- 'Rückmeldung Lebensmittel (Tim Baum, 22.10.2026, ändern): Abgrenzung zu loser Ware (Art. 44 Abs. 1 LMIV) wie vorgegeben erklärt, Hinweis Nährwerttabelle (Anhang V Nr. 19 LMIV) war schon im Text; Onlinehändler mit eigenen Lebensmitteln sehen den Eintrag jetzt (Branche Onlinehandel und „Was verkaufst du?“ Lebensmittel, dazu die Frage „Verkaufst du selbst abgepackte Lebensmittel?“); Fundstellen der Folgen plausibel, Straftatbestand und Höhe prüft RA Dr. Weber'
- 'ZUSATZ OHNE PRÜFERVORGABE (bitte von T. Baum bestätigen lassen): Satz zur Selbstbedienung – am 22.10.2026 am Wortlaut gelesen: Art. 44 Abs. 1 LMIV (gesetze.legal) nennt „im Hinblick auf ihren unmittelbaren Verkauf vorverpackt“, § 4 Abs. 1 LMIDV verlangt für solche Ware „zur Selbstbedienung“ die Angaben nach Art. 9 Abs. 1 Buchst. a bis d und f bis k und Art. 10 Abs. 1 LMIV, außer für Dauerbackwaren und Süßwaren, die in der Verkaufsstätte vorverpackt werden, sofern die Unterrichtung auf andere Weise gewährleistet ist (Satz 3 Nr. 1); nur § 4 Abs. 2 LMIDV (nicht zur Selbstbedienung) beschränkt die Pflicht auf das Zutatenverzeichnis. „Am selben Tag“ steht so nicht im Wortlaut (Art. 44: „unmittelbarer Verkauf“) – Formulierung von T. Baum'
- 'Anhang V Nr. 19 LMIV nicht am Wortlaut gelesen'
- 'Vorprüfung 22.10.2026: die Nettofüllmenge (Art. 9 Abs. 1 Buchst. e LMIV) ist in § 5 Abs. 1 LMIDV nicht genannt; Höhe der Strafe nach § 59 LFGB nicht gelesen – Straftatbestand und Höhe prüft RA Dr. Weber'
