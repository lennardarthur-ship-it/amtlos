# R12 (Nutzertest Kurier #4, 3a): Fahrzeuge jährlich prüfen (§ 57 DGUV Vorschrift 70)
schema_version: 1
id: arbeitsschutz.fahrzeuge_pruefen
version: 4
katalog_nr: E.53
titel:
  de: Firmenfahrzeuge jährlich durch einen Sachkundigen prüfen lassen
kurz:
  de: Fahrzeuge, die deine Beschäftigten fahren, lässt du mindestens einmal im Jahr durch einen Sachkundigen auf ihren betriebssicheren Zustand prüfen und hältst das fest.
erklaerung:
  de: Fahrzeuge sind bei Bedarf, mindestens aber einmal jährlich, durch einen Sachkundigen auf ihren betriebssicheren Zustand zu prüfen (§ 57 Abs. 1 DGUV Vorschrift 70). Die Ergebnisse hältst du schriftlich fest und bewahrst sie mindestens bis zur nächsten Prüfung auf (§ 57 Abs. 2 DGUV Vorschrift 70). Die Hauptuntersuchung ersetzt diese Prüfung nicht automatisch – sie prüft die Verkehrssicherheit, nicht den betriebssicheren Zustand für die Arbeit, etwa Aufbauten, Ladebordwand oder Ladungssicherung.
rechtsgrundlage:
- § 57 DGUV Vorschrift 70
kategorie: arbeitsschutz
branchen:
- transport_logistik
- handwerk
- bau
- gebaeudereinigung
ausloeser:
  all:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - feld: profil.fahrzeuge.anzahl
    op: '>='
    wert: 1
    label:
      de: Du nutzt Firmenfahrzeuge.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Sachkundiger, z. B. eine Kfz-Werkstatt
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 10.000 €, wenn Fahrzeuge nicht wie vorgeschrieben geprüft werden (§ 58 in Verbindung mit § 57 DGUV Vorschrift 70, § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII).'
  schwere: mittel
automatisierung: hinweis
erledigung:
