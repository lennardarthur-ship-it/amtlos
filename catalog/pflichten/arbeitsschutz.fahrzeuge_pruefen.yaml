# R12 (Nutzertest Kurier #4, 3a): Fahrzeuge jährlich prüfen (§ 57 DGUV Vorschrift 70)
schema_version: 1
id: arbeitsschutz.fahrzeuge_pruefen
version: 2
katalog_nr: E.53
titel:
  de: Firmenfahrzeuge jährlich durch einen Sachkundigen prüfen lassen
kurz:
  de: Fahrzeuge, die deine Beschäftigten fahren, lässt du mindestens einmal im Jahr durch einen Sachkundigen auf ihren betriebssicheren Zustand prüfen und hältst das fest.
erklaerung:
  de: Fahrzeuge sind bei Bedarf, mindestens aber einmal jährlich, durch einen Sachkundigen auf ihren betriebssicheren Zustand zu prüfen; die Ergebnisse hältst du schriftlich fest (§ 57 DGUV Vorschrift 70). Die Hauptuntersuchung ersetzt diese Prüfung nicht automatisch – sie prüft die Verkehrssicherheit, nicht den betriebssicheren Zustand für die Arbeit, etwa Aufbauten, Ladebordwand oder Ladungssicherung.
rechtsgrundlage:
- § 57 DGUV Vorschrift 70
kategorie: arbeitsschutz
branchen:
