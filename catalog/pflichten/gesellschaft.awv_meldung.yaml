  - feld: profil.gesellschafter.auslaendische_investoren
    op: ==
    wert: true
    label:
      de: Du hast Investoren aus dem Ausland.
  # Freigabe Weber 22.10.2026: Meldepflicht für alle Zahlungen von/an Gebietsfremde über 50.000 € (außer Warenverkehr), nicht nur bei Investoren
  - feld: profil.auslandszahlungen.ueber_meldegrenze
    op: ==
    wert: true
    label:
      de: Du erhältst Zahlungen aus dem Ausland oder leistest Zahlungen ins Ausland über 50.000 €.
