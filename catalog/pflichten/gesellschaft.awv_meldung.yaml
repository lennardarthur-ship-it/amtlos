# Katalog B.21 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.awv_meldung
version: 5
katalog_nr: B.21
titel:
  de: Auslandszahlungen nach AWV melden
kurz:
  de: 'Zahlungen über 50.000 €, die du von Gebietsfremden erhältst oder an Gebietsfremde leistest – zum Beispiel Investorengeld aus dem Ausland –, meldest du der Bundesbank.'
erklaerung:
  de: 'Die Außenwirtschaftsverordnung verlangt Meldungen für Zahlungen, die du von Gebietsfremden erhältst oder an Gebietsfremde leistest (§ 67 AWV). Meldepflichtig sind seit dem 1.1.2025 Zahlungen über 50.000 € (§ 67 Abs. 2 Nr. 1 AWV) – das gilt für alle solchen Zahlungen, nicht nur für Geld von Investoren. Ausgenommen sind Zahlungen für die Einfuhr, Ausfuhr oder Verbringung von Waren. Die Meldung geht elektronisch an die Deutsche Bundesbank, und zwar bis zum siebten Werktag des Monats, der auf die Zahlung folgt (§ 71 Abs. 6 AWV) – für jeden Monat, in dem du eine meldepflichtige Zahlung erhältst oder leistest.'
