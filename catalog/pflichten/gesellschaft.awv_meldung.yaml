titel:
  de: Auslandszahlungen nach AWV melden
kurz:
  de: Bei grenzüberschreitenden Zahlungen über der Meldegrenze – zum Beispiel Investorengeld aus dem Ausland – besteht eine
    Meldepflicht.
erklaerung:
  de: Die Außenwirtschaftsverordnung verlangt Meldungen bei grenzüberschreitenden Zahlungen über einer Meldegrenze. Frag bei
    deiner Bank oder der Bundesbank nach der aktuellen Grenze.
