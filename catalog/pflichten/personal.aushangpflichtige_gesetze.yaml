# Katalog D.48 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.aushangpflichtige_gesetze
version: 4
katalog_nr: D.48
titel:
  de: Aushangpflichtige Gesetze aushängen
kurz:
  de: Je nach Belegschaft hängst du bestimmte Gesetze im Betrieb aus, zum Beispiel ArbZG, AGG, MuSchG und JArbSchG.
erklaerung:
  de: 'Welche Gesetze du aushängst, auslegst oder elektronisch zugänglich machst, hängt von der Belegschaft ab. Ab der ersten beschäftigten Person – das Arbeitszeitgesetz mit den geltenden Rechtsverordnungen, Tarifverträgen und Betriebsvereinbarungen (§ 16 Abs. 1 ArbZG) und das AGG mit § 61b ArbGG und der Angabe, wo die Beschwerdestelle ist (§ 12 Abs. 5 AGG). Bei regelmäßig mehr als drei beschäftigten Frauen das Mutterschutzgesetz (§ 26 MuSchG). Ab einer beschäftigten jugendlichen Person das Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde (§ 47 JArbSchG), ab drei Jugendlichen zusätzlich Beginn und Ende der Arbeitszeit und der Pausen (§ 48 JArbSchG). Dazu machst du die Unfallverhütungsvorschriften deiner BG zugänglich (§ 12 DGUV Vorschrift 1) und hängst die Hinweise zur Ersten Hilfe mit Notruf und Ersthelfern aus (§ 24 Abs. 5 DGUV Vorschrift 1).'
rechtsgrundlage:
- § 16 Abs. 1 ArbZG
- § 12 Abs. 5 AGG
- § 26 MuSchG
- §§ 47, 48 JArbSchG
- §§ 12, 24 Abs. 5 DGUV Vorschrift 1
