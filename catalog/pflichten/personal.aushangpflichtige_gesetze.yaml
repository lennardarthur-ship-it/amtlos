sanktion:
  text:
    de: 'Fehlt der Aushang des Arbeitszeitgesetzes, droht ein Bußgeld bis 5.000 € (§ 22 Abs. 1 Nr. 8, Abs. 2 ArbZG), ebenso beim Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde und beim Aushang der Arbeitszeit und Pausen der Jugendlichen (§ 59 Abs. 1 Nr. 7, 8, Abs. 3 JArbSchG). Für den Aushang des Mutterschutzgesetzes sieht § 32 MuSchG kein Bußgeld vor. Für die Information nach dem AGG gibt es kein Bußgeld; fehlt sie, droht aber ein Entschädigungsrisiko (§ 15 AGG). Für das Zugänglichmachen der Unfallverhütungsvorschriften gibt es kein Bußgeld.'
