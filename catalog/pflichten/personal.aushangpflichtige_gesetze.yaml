fachlich_zu_pruefen:
- 'Prüfergebnis Sifa 22.10.2026 umgesetzt (Liste je Belegschaft); abweichend vom Prüfergebnis gilt § 48 JArbSchG erst ab drei Jugendlichen (Wortlaut geprüft); Liste für alle anzuzeigen laut Prüfvermerk RA Dr. Weber 22.10.2026 vertretbar'
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'Prüfvermerk RA Dr. Weber 22.10.2026: ArbZG, JArbSchG, MuSchG bestätigt; AGG-Folge (§ 15 AGG) übernommen. Nicht übernommen: „DGUV Vorschrift 1 § 12 – Verstoß bußgeldbewehrt nach § 209 Abs. 1 Nr. 1 SGB VII (bis 10.000 €)“ – § 32 DGUV Vorschrift 1 (Fassung BGN, am 22.10.2026 gelesen) nennt nur § 12 Abs. 2 (Vorschriften den mit Maßnahmen betrauten Personen zur Verfügung stellen), nicht § 12 Abs. 1 (den Versicherten zugänglich machen); Rückfrage an den Prüfer'
