katalog_nr: H.3
titel:
  de: Hygieneplan führen
kurz:
  de: In Beauty- und Kosmetikbetrieben legst du in einem Hygieneplan fest, wie Geräte, Flächen und Hände gereinigt und desinfiziert
    werden.
erklaerung:
  de: 'Betriebe mit Tätigkeiten am Menschen – Friseur, Kosmetik, Tattoo, Piercing, Fußpflege – brauchen nach den Hygieneverordnungen der Länder einen Hygieneplan. Die Länder erlassen diese Verordnungen auf Grundlage von § 17 Abs. 4 IfSG, zum Beispiel die HygieneVO in Baden-Württemberg, die HygV in Bayern und die HygVO in Nordrhein-Westfalen. Den Hygieneplan legst du vor Aufnahme der Tätigkeit fest und hältst ihn laufend aktuell. Für Lebensmittelbetriebe gilt stattdessen die Lebensmittelhygiene nach der Verordnung (EG) Nr. 852/2004.'
rechtsgrundlage:
- § 17 Abs. 4 IfSG
- Hygieneverordnungen der Länder (z. B. BW HygieneVO, BY HygV, NRW HygVO)
- § 73 Abs. 1a Nr. 24, Abs. 2 IfSG
