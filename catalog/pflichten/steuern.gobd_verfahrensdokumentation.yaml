sanktion:
  text:
    de: Die GoBD selbst sehen kein Bußgeld vor. Sind Bücher und Aufzeichnungen nicht ordnungsgemäß, verlieren sie ihre Beweiskraft
      (§ 158 AO) und das Finanzamt kann schätzen (§ 162 AO). Bußgeld bis 25.000 €, wenn dadurch Steuerverkürzungen ermöglicht werden
      (§ 379 Abs. 1 Satz 1 Nr. 3, Abs. 6 AO). Eine fehlende Verfahrensdokumentation allein führt nicht zur Verwerfung, wenn die
      Nachvollziehbarkeit gegeben ist (GoBD Rz. 155).
