titel:
  de: GoBD einhalten und Verfahrensdokumentation führen
kurz:
  de: Bewahre Belege nachvollziehbar und unveränderbar auf und beschreibe in einer Verfahrensdokumentation, wie du das machst.
erklaerung:
  de: Die GoBD regeln, wie Bücher und Belege elektronisch geführt und aufbewahrt werden. Die Verfahrensdokumentation beschreibt
    deine Abläufe. Maßgeblich ist das BMF-Schreiben vom 28.11.2019, geändert am 11.03.2024 und am 14.07.2025.
