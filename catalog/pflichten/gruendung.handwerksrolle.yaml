# Katalog A.4 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft · R10: nur noch Anlage A; Anlage B1/B2 in gruendung.handwerk_verzeichnis (§ 19 HwO)
schema_version: 1
