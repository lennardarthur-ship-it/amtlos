titel:
  de: In die Handwerksrolle eintragen (Anlage A)
kurz:
  de: Ein zulassungspflichtiges Handwerk darfst du erst betreiben, wenn du in die Handwerksrolle eingetragen bist.
erklaerung:
  de: Zulassungspflichtige Handwerke (Anlage A der Handwerksordnung) brauchen einen Meisterbrief oder eine Ausnahme. Den selbstständigen
    Betrieb darfst du erst nach der Eintragung in die Handwerksrolle aufnehmen – die Eintragung muss also vor dem Beginn stehen.
