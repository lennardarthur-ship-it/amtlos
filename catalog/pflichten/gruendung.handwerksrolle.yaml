    de: 'Bußgeld bis 10.000 €, wenn du ein zulassungspflichtiges Handwerk ohne Eintragung in die Handwerksrolle betreibst (§ 117 Abs. 1 Nr. 1, Abs. 2 HwO); erbringst du dabei Dienst- oder Werkleistungen in erheblichem Umfang, bis 50.000 € (§ 8 Abs. 1 Nr. 1 Buchst. e, Abs. 5 SchwarzArbG).'
