# Katalog B.14 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Plausibilitätsprüfung im Handelsregister-Datenblatt (Mindestkapital, volle Euro)
schema_version: 1
id: gesellschaft.stammkapital_einzahlen
version: 5
katalog_nr: B.14
titel:
  de: Stammkapital einzahlen
kurz:
  de: Zahl das Stammkapital auf das Geschäftskonto ein, bevor die Gesellschaft zum Handelsregister angemeldet wird.
erklaerung:
  de: Bei der GmbH muss vor der Anmeldung auf jeden Geschäftsanteil mindestens ein Viertel eingezahlt sein, insgesamt mindestens die Hälfte des Mindeststammkapitals von 25.000 €, also 12.500 € (§ 7 Abs. 2 GmbHG). Bei der UG wird das Stammkapital vor der Anmeldung voll und in bar eingezahlt (§ 5a Abs. 2 GmbHG). In der Anmeldung versichert die Geschäftsführung, dass die Einlagen geleistet sind und endgültig zu ihrer freien Verfügung stehen (§ 8 Abs. 2 GmbHG).
rechtsgrundlage:
- § 7 Abs. 2 GmbHG
- § 5a Abs. 2 GmbHG
- § 8 Abs. 2 GmbHG
- § 9c Abs. 1 GmbHG
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_kapitalgesellschaft
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine UG oder GmbH.
  - feld: profil.gesellschaft.handelsregister
    op: '!='
    wert: eingetragen
    label:
      de: Deine Gesellschaft ist noch nicht im Handelsregister eingetragen.
phase: gruendung
voraussetzungen:
- gesellschaft.gesellschaftsvertrag_notar
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du und deine Mitgesellschafter; Bank
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Ohne Nachweis der Einzahlung lehnt das Registergericht die Eintragung ab (§ 9c Abs. 1 GmbHG). Wer in der Anmeldung falsch versichert, dass die Einlagen geleistet sind, macht sich strafbar: Freiheitsstrafe bis zu drei Jahren oder Geldstrafe (§ 82 Abs. 1 Nr. 1 GmbHG). Vor der Eintragung besteht die Gesellschaft als solche nicht; wer in ihrem Namen handelt, haftet persönlich (§ 11 Abs. 1, 2 GmbHG).'
  schwere: hoch
automatisierung: hinweis
aktion:
  art: abhaken
  nachweis_erforderlich: true
