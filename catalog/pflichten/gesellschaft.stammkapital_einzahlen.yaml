fachlich_zu_pruefen:
- 'R12 (Rechtsprüfung Befund 16): ein Viertel je Geschäftsanteil, insgesamt mindestens 12.500 € (§ 7 Abs. 2 GmbHG), UG voll und bar (§ 5a Abs. 2), Versicherung in der Anmeldung (§ 8 Abs. 2) – Plausibilitätsprüfung im Handelsregister-Datenblatt (Mindestkapital, volle Euro) offen'
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (Folge der Nichteinzahlung selbst (Ablehnung der Eintragung, § 9c GmbHG) nicht gelesen; Strafnorm betrifft die falsche Versicherung); Schwere nach Vorprüfung wieder „hoch“, dringend_ohne_termin entfernt'
