# Katalog G.69 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.vsbg_hinweis
version: 5
katalog_nr: G.69
titel:
  de: Hinweis zur Verbraucherstreitbeilegung
kurz:
  de: Mit mehr als 10 Beschäftigten informierst du auf Website und in AGB, ob du an Streitbeilegungsverfahren teilnimmst.
erklaerung:
  de: Die Hinweispflicht nach § 36 VSBG gilt für Unternehmer, die eine Website unterhalten oder AGB verwenden. Ausgenommen ist, wer am 31. Dezember des Vorjahres zehn oder weniger Personen beschäftigt hat (§ 36 Abs. 3 VSBG) – gezählt werden Personen, nicht Vollzeitstellen.
rechtsgrundlage:
- § 36 VSBG
kategorie: online
branchen:
- onlinehandel
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2c
    label:
      de: Du verkaufst an Verbraucher.
  # Prüfvermerk Rechtsanwalt 22.10.2026: Auslöser „AGB“ kann entfallen, Website genügt
  - any:
    - feld: profil.online.website
      op: ==
      wert: true
      label:
        de: Du hast eine Website.
    - feld: profil.vertrieb.kanaele
      op: enthaelt_eines
      wert:
      - onlineshop
      - app
      label:
        de: Du verkaufst über einen Onlineshop oder eine App.
  - feld: profil.beschaeftigte.gesamt
    op: '>'
    wert:
      regelwert: online.vsbg.schwelle_beschaeftigte
  - feld: abgeleitet.beschaeftigte.zaehlung_vsbg
    op: '>'
    wert:
      regelwert: online.vsbg.schwelle_beschaeftigte
    label:
      de: Du hast mehr als 10 Beschäftigte im Sinne des VSBG.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Kein eigenes Bußgeld vorgesehen; fehlt der Hinweis, kann das als Wettbewerbsverstoß abgemahnt werden (§ 3a UWG).'
  schwere: mittel
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
