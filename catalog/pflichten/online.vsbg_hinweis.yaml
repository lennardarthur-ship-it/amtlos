- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 41 VSBG (einzige Bußgeldvorschrift laut Inhaltsübersicht; erfasst nur § 2 Abs. 2 – unberechtigte Bezeichnung als Verbraucherschlichtungsstelle; über lxgesetze) gelesen; wettbewerbsrechtliche Folgen (UWG) nicht geprüft – fachlich zu bestätigen'
