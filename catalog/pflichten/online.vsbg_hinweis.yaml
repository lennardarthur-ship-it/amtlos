# Katalog G.69 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.vsbg_hinweis
version: 4
katalog_nr: G.69
titel:
  de: Hinweis zur Verbraucherstreitbeilegung
kurz:
  de: Mit mehr als 10 Beschäftigten informierst du auf Website und in AGB, ob du an Streitbeilegungsverfahren teilnimmst.
erklaerung:
  de: Die Hinweispflicht nach § 36 VSBG gilt für Unternehmer, die eine Website unterhalten oder AGB verwenden. Ausgenommen ist, wer am 31. Dezember des Vorjahres zehn oder weniger Personen beschäftigt hat (§ 36 Abs. 3 VSBG) – gezählt werden Personen, nicht Vollzeitstellen.
rechtsgrundlage:
- § 36 VSBG
