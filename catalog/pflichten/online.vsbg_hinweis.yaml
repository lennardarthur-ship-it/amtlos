fachlich_zu_pruefen:
- 'Prüfvermerk Rechtsanwalt 22.10.2026: § 36 Abs. 1, 3 VSBG und Zählweise nach Köpfen bestätigt, Folge UWG-Abmahnung (§ 3a UWG) eingetragen, Auslöser Website (oder Onlineshop/App) statt AGB. Offen: Stichtag 31.12. des Vorjahres ist im Auslöser nicht abgebildet'
