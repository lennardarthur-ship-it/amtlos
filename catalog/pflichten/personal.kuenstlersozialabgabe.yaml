kanal: post
kosten: null
sanktion:
  text:
    de: Wer als Abgabepflichtiger die Entgelte nicht rechtzeitig oder nicht richtig meldet, keine ordnungsgemäßen Aufzeichnungen führt oder Auskünfte und Unterlagen auf Verlangen nicht vorlegt, handelt ordnungswidrig – Bußgeld bis 50.000 € (§ 36 Abs. 2, 3 KSVG). Ohne Meldung schätzt die Künstlersozialkasse bzw. die Rentenversicherung die Entgelte (§ 27 Abs. 1 KSVG).
  schwere: mittel
