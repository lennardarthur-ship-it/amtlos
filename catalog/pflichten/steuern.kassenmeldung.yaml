# Katalog C.33 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.kassenmeldung
version: 2
katalog_nr: C.33
titel:
  de: Elektronische Kasse beim Finanzamt melden
kurz:
  de: Melde jede elektronische Kasse innerhalb eines Monats nach der Anschaffung über ELSTER – je Betriebsstätte.
erklaerung:
  de: Elektronische Kassen müssen dem Finanzamt gemeldet werden, innerhalb eines Monats nach Anschaffung oder Außerbetriebnahme.
    Bestandskassen waren bis 31.7.2025 zu melden. Die Meldung geht nur über ELSTER (amtlich vorgeschriebener Datensatz); ein ausgedrucktes
    oder geteiltes Datenblatt erfüllt sie nicht.
rechtsgrundlage:
- § 146a AO
