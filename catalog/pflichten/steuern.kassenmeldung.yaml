# Katalog C.33 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.kassenmeldung
version: 5
katalog_nr: C.33
titel:
  de: Elektronische Kasse beim Finanzamt melden
kurz:
  de: Melde jede elektronische Kasse innerhalb eines Monats nach der Anschaffung über ELSTER – je Betriebsstätte.
erklaerung:
  de: Elektronische Kassen müssen dem Finanzamt gemeldet werden, innerhalb eines Monats nach Anschaffung oder Außerbetriebnahme.
    Bestandskassen waren bis 31.7.2025 zu melden. Die Meldung geht nur über ELSTER (amtlich vorgeschriebener Datensatz); ein ausgedrucktes
    oder geteiltes Datenblatt erfüllt sie nicht.
rechtsgrundlage:
- § 146a AO
kategorie: steuern
ausloeser:
  feld: profil.kasse.elektronisch
  op: ==
  wert: true
  label:
    de: Du nutzt eine elektronische Kasse.
frist:
  typ: relativ
  bezug:
    ereignis: kasse_angeschafft
  versatz: P1M
  zeitpunkt: spaetestens
  # R11 (Steuerprüfung 19): Fristende am Wochenende oder Feiertag nach § 108 Abs. 3 AO – laut Prüferin unsicher
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
wiederholung:
  art: bei_aenderung
  neu_ausloesen_bei:
  - ereignis: kasse_angeschafft
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: '§ 379 AO nennt die Mitteilung nach § 146a Abs. 4 AO nicht – ein eigenes Bußgeld ist dafür nicht vorgesehen. Das Finanzamt kann die Mitteilung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: formular_vorausfuellen
erledigung:
  art: bestaetigen
  bestaetigung:
    de: In ELSTER gemeldet
aenderungsnotiz:
  de: Das Datenblatt aus Amtlos bereitet die Meldung nur vor. Erledigt ist sie, wenn du bestätigst, dass du sie in ELSTER übermittelt hast.
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
