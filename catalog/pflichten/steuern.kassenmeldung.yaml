fachlich_zu_pruefen:
- 'Verschiebung auf den nächsten Werktag nach § 108 Abs. 3 AO (Steuerprüfung R11 Befund 19, „dürfte greifen“, unsicher) – bestätigen'
- 'Bestandskassen (Meldefrist 31.7.2025): Pflicht für Kassen ohne gemeldetes Anschaffungsdatum abbilden'
- Verschiebung bei Fristende am Wochenende festlegen
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (Schwere „mittel“ mit dringend_ohne_termin belassen: Wortlaut ergibt kein Bußgeld, „hoch“ fachlich entscheiden)'
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (§ 379 Abs. 1 Satz 1 AO (gelesen auf gesetze-im-internet) nennt § 146a nur mit Abs. 1 (Nr. 4–6: Verwendung, Schutz, Vertrieb); Nr. 7 betrifft die Aufbewahrung nach § 147 AO. Eine Bußgeldnorm für die Mitteilung nach § 146a Abs. 4 AO wurde nicht gefunden – der Vorschlag „§ 379 Abs. 1 Nr. 7 AO, bis 25.000 €“ aus dem Prüfbericht trifft nicht zu) – nach Ergänzung wieder „hoch“'
