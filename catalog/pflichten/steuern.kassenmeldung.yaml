  bezug:
    ereignis: kasse_angeschafft
  versatz: P1M
  zeitpunkt: spaetestens
  # Fristende am Wochenende oder Feiertag: § 108 Abs. 3 AO ist anzuwenden (StB Busch 22.10.2026)
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
wiederholung:
  art: bei_aenderung
  neu_ausloesen_bei:
  - ereignis: kasse_angeschafft
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: '§ 379 AO nennt die Mitteilung nach § 146a Abs. 4 AO nicht – ein eigenes Bußgeld ist dafür nicht vorgesehen. Das Finanzamt kann die Mitteilung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: formular_vorausfuellen
erledigung:
  art: bestaetigen
  bestaetigung:
    de: In ELSTER gemeldet
aenderungsnotiz:
  de: 'Ergänzt: Noch nicht gemeldete Bestandskassen meldest du unverzüglich nach.'
