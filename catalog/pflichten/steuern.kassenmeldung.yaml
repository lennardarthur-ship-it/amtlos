# Katalog C.33 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.kassenmeldung
version: 6
katalog_nr: C.33
titel:
  de: Elektronische Kasse beim Finanzamt melden
kurz:
  de: Melde jede elektronische Kasse innerhalb eines Monats nach der Anschaffung über ELSTER – je Betriebsstätte.
erklaerung:
  de: Elektronische Kassen müssen dem Finanzamt gemeldet werden, innerhalb eines Monats nach Anschaffung oder Außerbetriebnahme.
    Für Bestandskassen ist die Meldefrist 31.7.2025 abgelaufen – noch nicht gemeldete Kassen meldest du unverzüglich nach. Die Meldung geht nur über ELSTER (amtlich vorgeschriebener Datensatz); ein ausgedrucktes
    oder geteiltes Datenblatt erfüllt sie nicht.
rechtsgrundlage:
- § 146a AO
kategorie: steuern
ausloeser:
  feld: profil.kasse.elektronisch
  op: ==
  wert: true
  label:
    de: Du nutzt eine elektronische Kasse.
