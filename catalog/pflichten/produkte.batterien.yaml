# Katalog G.72 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: produkte.batterien
version: 6
katalog_nr: G.72
titel:
  de: Batterien registrieren (BattDG)
kurz:
  de: Bringst du Batterien oder Geräte mit Batterien selbst erstmals in Deutschland in Verkehr, registrierst du dich vorher nach dem
    Batteriegesetz.
erklaerung:
  de: Hersteller von Batterien müssen sich vor dem Inverkehrbringen bei der stiftung ear registrieren. Hersteller ist auch, wer unter eigener Marke verkauft
    oder Batterien bzw. Geräte mit Batterien nach Deutschland einführt. Wer bei einem Händler in Deutschland kauft und weiterverkauft
    oder einbaut, ist in der Regel nicht Hersteller.
rechtsgrundlage:
- BattDG
kategorie: produkte
branchen:
- onlinehandel
ausloeser:
  all:
  - feld: profil.produkte.arten
    op: enthaelt
    wert: batterien
    label:
      de: Du verkaufst Batterien oder Geräte mit Batterien.
  - feld: profil.produkte.erstinverkehrbringer
    op: ==
    wert: true
    label:
      de: Du bringst Elektrogeräte oder Batterien selbst erstmals in Deutschland in Verkehr (Herstellung, Eigenmarke oder Import).
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: stiftung elektro-altgeräte register (ear)
kanal: portal
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig registrierst oder Batterien ohne Registrierung bereitstellst (§ 60 Abs. 1 Nr. 1, Abs. 2 Nr. 23, Abs. 3 in Verbindung mit § 4 Abs. 1 BattDG).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: hinweis
aenderungsnotiz:
  de: Gilt erst, wenn du die Geräte oder Batterien selbst erstmals in Deutschland in Verkehr bringst – nicht beim Einkauf im deutschen
    Großhandel.
