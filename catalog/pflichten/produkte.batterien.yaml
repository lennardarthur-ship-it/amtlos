# Katalog G.72 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: produkte.batterien
version: 5
katalog_nr: G.72
titel:
  de: Batterien registrieren (BattDG)
kurz:
  de: Bringst du Batterien oder Geräte mit Batterien selbst erstmals in Deutschland in Verkehr, registrierst du dich vorher nach dem
    Batteriegesetz.
erklaerung:
  de: Hersteller von Batterien müssen sich vor dem Inverkehrbringen registrieren. Hersteller ist auch, wer unter eigener Marke verkauft
    oder Batterien bzw. Geräte mit Batterien nach Deutschland einführt. Wer bei einem Händler in Deutschland kauft und weiterverkauft
    oder einbaut, ist in der Regel nicht Hersteller.
rechtsgrundlage:
- BattDG
kategorie: produkte
branchen:
- onlinehandel
