fachlich_zu_pruefen:
- 'Rückfrage „selbst erstmals in Deutschland in Verkehr (Herstellung, Eigenmarke, Import)“ vor dem Auslösen (R10, K-430) – Installateur mit Einkauf im inländischen Großhandel als Nicht-Hersteller bestätigen; Pflichten als Vertreiber (Rücknahme) nicht abgebildet'
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Zuständige Stelle und Registrierungsweg ergänzen
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 4 Abs. 1, 3 und § 60 Abs. 1 Nr. 1, Abs. 2 Nr. 23 (Art. 55 Abs. 2 UAbs. 1 Satz 1 VO (EU) 2023/1542 in Verbindung mit § 5 Abs. 1), Abs. 3 BattDG gelesen – fachlich zu bestätigen'
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
