# R12 (Nutzertest Kfz #1): Altölverordnung – Rücknahme beim Ölverkauf
schema_version: 1
id: umwelt.altoel_ruecknahme
version: 3
katalog_nr: U.3
titel:
  de: Altöl zurücknehmen, wenn du Motor- oder Getriebeöl verkaufst
kurz:
  de: Verkaufst du Motor- oder Getriebeöl an Endverbraucher, richtest du vorher eine Annahmestelle für Altöl ein und weist Privatkunden mit einer Schrifttafel darauf hin.
erklaerung:
  de: Wer gewerbsmäßig Verbrennungsmotoren- oder Getriebeöl an Endverbraucher abgibt, richtet vor der Abgabe eine Annahmestelle für gebrauchte Öle ein oder weist eine solche durch eine vertragliche Vereinbarung nach (§ 8 Abs. 1 AltölV). Bei der Abgabe an private Endverbraucher weist du am Ort des Verkaufs mit leicht erkennbaren und lesbaren Schrifttafeln auf die Annahmestelle hin. Die Annahmestelle nimmt gebrauchte Öle bis zur Menge des bei dir gekauften Öls an (§ 8 Abs. 2 AltölV).
rechtsgrundlage:
- § 8 AltölV
kategorie: umwelt
branchen:
- handwerk
ausloeser:
  feld: profil.umwelt.taetigkeiten
  op: enthaelt
  wert: oelverkauf
  label:
    de: Du verkaufst Motor- oder Getriebeöl an Endverbraucher.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn keine Annahmestelle eingerichtet oder nachgewiesen wird oder der Hinweis fehlt (§ 10 Abs. 1 Nr. 6 AltölV in Verbindung mit § 69 Abs. 1 Nr. 8, Abs. 3 KrWG).'
