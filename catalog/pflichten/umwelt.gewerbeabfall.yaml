# R12 (Nutzertest Kfz #1): Gewerbeabfallverordnung – Getrenntsammlung und Dokumentation
schema_version: 1
id: umwelt.gewerbeabfall
version: 3
katalog_nr: U.1
titel:
  de: Gewerbeabfälle getrennt sammeln und dokumentieren
kurz:
  de: Papier, Glas, Kunststoffe, Metalle, Holz, Textilien und Bioabfälle aus deinem Betrieb sammelst du getrennt und hältst fest, wie du sie entsorgst.
erklaerung:
  de: Wer gewerbliche Siedlungsabfälle erzeugt, sammelt Papier, Pappe und Karton, Glas, Kunststoffe, Metalle, Holz, Textilien und Bioabfälle getrennt und gibt sie vorrangig zur Vorbereitung zur Wiederverwendung oder zum Recycling weiter (§ 3 Abs. 1 GewAbfV). Die Getrenntsammlung dokumentierst du, etwa mit Lageplänen, Fotos, Liefer- oder Wiegescheinen und Entsorgungsverträgen (§ 3 Abs. 3 GewAbfV). Ist die Trennung technisch nicht möglich oder wirtschaftlich nicht zumutbar, gelten Ausnahmen, die du ebenfalls dokumentierst (§ 3 Abs. 2 GewAbfV). Das gilt auch für kleine Betriebe, die nur die Behälter der Gemeinde nutzen; die Dokumentation kann dann einfach sein. Gefährliche Abfälle haben eigene Pflichten.
rechtsgrundlage:
- § 3 GewAbfV
kategorie: umwelt
ausloeser:
  feld: profil.betriebsstaetten.anzahl
  op: '>='
  wert: 1
  label:
    de: Du hast eine Betriebsstätte außerhalb deiner Wohnung, in der gewerbliche Abfälle anfallen.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch die untere Abfallbehörde
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn Abfälle nicht richtig getrennt gesammelt werden (§ 13 Abs. 1 Nr. 1 GewAbfV in Verbindung mit § 69 Abs. 1 Nr. 8, Abs. 3 KrWG), und bis 10.000 €, wenn die Dokumentation fehlt oder nicht rechtzeitig vorgelegt wird (§ 13 Abs. 2 Nr. 1, 2 GewAbfV in Verbindung mit § 69 Abs. 2 Nr. 15, Abs. 3 KrWG).'
  schwere: mittel
automatisierung: hinweis
aktion:
  art: abhaken
