# Katalog A.6 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: gruendung.ust_idnr
version: 2
katalog_nr: A.6
titel:
  de: Umsatzsteuer-Identifikationsnummer beantragen
kurz:
  de: Wenn du mit Unternehmen in anderen EU-Ländern Geschäfte machst – als Kunde oder als Lieferant –, beantragst du eine USt-IdNr.
    beim Bundeszentralamt für Steuern.
erklaerung:
  de: Die Umsatzsteuer-Identifikationsnummer brauchst du für Geschäfte mit Unternehmen in anderen EU-Ländern – wenn du an sie
    lieferst oder leistest, aber auch, wenn du bei ihnen einkaufst, z. B. Software oder Werbung. Eine Frist gibt es nicht; du
    beantragst sie online beim Bundeszentralamt für Steuern oder gleich im Fragebogen zur steuerlichen Erfassung. Verkaufst du
    nur an Privatpersonen in anderen EU-Ländern (One-Stop-Shop), ist sie nicht erforderlich, für die Registrierung im One-Stop-Shop
    aber üblich. Auch als Kleinunternehmer kannst du sie beantragen und solltest es bei Einkäufen in anderen EU-Ländern tun –
    die Steuer, die du dabei schuldest (§ 13b UStG), fällt auch für Kleinunternehmer an.
rechtsgrundlage:
- § 27a UStG
kategorie: gruendung
ausloeser:
  # StB Busch 22.10.2026: nur bei Geschäften mit Unternehmen (B2B) – als Kunde oder als Lieferant
  any:
  - all:
    - feld: profil.kunden.regionen
      op: enthaelt
      wert: eu
      label:
        de: Du hast Kunden in anderen EU-Ländern.
    - feld: profil.kunden.segmente
      op: enthaelt
      wert: b2b
      label:
        de: Du verkaufst an Unternehmen.
  - feld: profil.einkauf.eu_unternehmen
    op: ==
    wert: true
    label:
      de: Du kaufst bei Unternehmen in anderen EU-Ländern ein.
phase: gruendung
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Bundeszentralamt für Steuern (BZSt)
kanal: portal
kosten: null
sanktion:
  text:
    de: Keine Pflicht und kein Bußgeld. Ohne USt-IdNr. kannst du keine steuerfreie innergemeinschaftliche Lieferung abrechnen und
      keine Zusammenfassende Meldung abgeben (§ 14a Abs. 3, § 18a UStG). Lieferanten aus anderen EU-Ländern berechnen dir dann
      in der Regel ihre eigene Umsatzsteuer.
  schwere: mittel
automatisierung: hinweis
aenderungsnotiz:
  de: Gilt jetzt auch, wenn du bei Unternehmen in anderen EU-Ländern einkaufst, und nur noch bei Geschäften mit Unternehmen.
