# Katalog G.70 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.barrierefreiheit
version: 5
katalog_nr: G.70
titel:
  de: Barrierefreiheit von Onlineshop und Buchungstools (BFSG)
kurz:
  de: Seit 28.6.2025 müssen bestimmte Dienstleistungen wie Onlineshops barrierefrei sein – mit Barrierefreiheitserklärung.
erklaerung:
  de: 'Betroffen sind Dienstleistungen im elektronischen Geschäftsverkehr (§ 1 Abs. 3 BFSG) – etwa Onlineshops und Buchungstools – sowie unter anderem Bankdienstleistungen, Telekommunikationsdienste, Dienste im Personenverkehr und E-Books. Ausgenommen sind Kleinstunternehmen mit weniger als 10 Beschäftigten und höchstens 2 Mio. € Jahresumsatz oder höchstens 2 Mio. € Jahresbilanzsumme (§ 3 Abs. 3 BFSG) – diese Ausnahme gilt nur für Dienstleistungen. Amtlos fragt nur den Umsatz ab; liegt deine Bilanzsumme bei höchstens 2 Mio. €, greift die Ausnahme auch bei höherem Umsatz. Der Online-Check macht automatisierte Basistests nach WCAG.'
rechtsgrundlage:
- § 1 Abs. 3 BFSG
- § 3 Abs. 3 BFSG
kategorie: online
branchen:
- onlinehandel
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2c
    label:
      de: Du verkaufst an Verbraucher.
  - feld: profil.vertrieb.kanaele
    op: enthaelt_eines
    wert:
    - onlineshop
    - app
    label:
      de: Du verkaufst über einen Onlineshop oder eine App.
  - any:
    - all:
      - feld: profil.beschaeftigte.gesamt
        op: '>='
        wert:
          regelwert: online.bfsg.kleinst_beschaeftigte
      - feld: abgeleitet.beschaeftigte.zaehlung_bfsg
        op: '>='
        wert:
          regelwert: online.bfsg.kleinst_beschaeftigte
        label:
          de: Du hast mindestens 10 Beschäftigte im Sinne des BFSG.
    - feld: profil.umsatz.vorjahr
      op: '>'
      wert:
        regelwert: online.bfsg.kleinst_umsatz
      label:
        de: Dein Umsatz lag über 2 Mio. €.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Marktüberwachung der Länder
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn eine Dienstleistung angeboten oder erbracht wird, die die Barrierefreiheitsanforderungen nicht erfüllt oder für die die Informationen nach Anlage 3 fehlen (§ 37 Abs. 1 Nr. 8, Abs. 2 in Verbindung mit § 14 Abs. 1 BFSG).'
  schwere: hoch
automatisierung: hinweis
aktion:
  art: link
  ziel: app.onlinecheck
status_recht: in_kraft
gueltig_ab: '2025-06-28'
gueltig_bis: null
quellen:
- titel: Barrierefreiheitsstärkungsgesetz
  url: https://www.gesetze-im-internet.de/bfsg/
  abgerufen: null
- titel: Barrierefreiheitsstärkungsgesetz § 37 (Bußgeldvorschriften)
  url: https://www.gesetze-im-internet.de/bfsg/__37.html
  abgerufen: '2026-10-22'
- titel: Barrierefreiheitsstärkungsgesetz § 14
  url: https://www.gesetze-im-internet.de/bfsg/__14.html
  abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'Prüfvermerk RA Dr. Weber 22.10.2026: „Bilanzsumme als Alternative ergänzen“ – nur im Text umgesetzt; der Auslöser kennt nur den Vorjahresumsatz (keine Frage nach der Bilanzsumme, bei Einnahmenüberschussrechnung gibt es keine Bilanz – Abbildung offen)'
- Zählweise (G-05)
- 'Prüfvermerk RA Dr. Weber 22.10.2026: § 1 Abs. 3, § 3 Abs. 3 BFSG, Sanktion § 37 Abs. 1 Nr. 8, Abs. 2 (100.000 €) bestätigt, Schwere „hoch“, Liste der Dienstleistungen im Text'
pruefung:
  status: freigegeben
  geprueft_von:
    - RA Dr. Ulrich Weber
  geprueft_am: '2026-10-22'
  geprueft_version: 5
