# Katalog G.76 · E-223 (Befund des externen Prüfers: Pflicht fehlte) – neu als Entwurf, noch nicht fachlich geprüft
schema_version: 1
id: online.preisermaessigung
version: 1
katalog_nr: G.76
titel:
  de: Bei Preisermäßigungen den niedrigsten Preis der letzten 30 Tage angeben
kurz:
  de: Gibst du Verbrauchern eine Preisermäßigung für eine Ware bekannt, nennst du auch den niedrigsten Gesamtpreis, den du in den
    30 Tagen davor verlangt hast.
erklaerung:
  de: 'Wer Verbrauchern Gesamtpreise angeben muss, nennt bei jeder Bekanntgabe einer Preisermäßigung für eine Ware den niedrigsten
    Gesamtpreis, den er innerhalb der letzten 30 Tage vor der Anwendung der Preisermäßigung gegenüber Verbrauchern angewendet hat
    (§ 11 Abs. 1 PAngV). Bei einer schrittweisen, ohne Unterbrechung ansteigenden Preisermäßigung darf es der niedrigste
    Gesamtpreis vor Beginn dieser Ermäßigung sein (§ 11 Abs. 2 PAngV). Das gilt nicht für individuelle Preisermäßigungen und
    nicht für schnell verderbliche Waren oder Waren mit kurzer Haltbarkeit, wenn der Preis wegen drohenden Verderbs oder
    drohenden Ablaufs der Haltbarkeit gesenkt wird und du das für Verbraucher deutlich machst (§ 11 Abs. 4 PAngV).'
