# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Sicherheitsbeauftragte“): § 22 SGB VII n. F. (anzuwenden ab 29.5.2026)
schema_version: 1
id: arbeitsschutz.sicherheitsbeauftragte
version: 2
katalog_nr: E.52
titel:
  de: Sicherheitsbeauftragte bestellen
kurz:
  de: Ab regelmäßig 50 Beschäftigten bestellst du Sicherheitsbeauftragte – ab 21 Beschäftigten schon dann, wenn die Gefährdungsbeurteilung eine besondere Gefährdung ergibt.
erklaerung:
  de: 'Seit der Neuregelung von § 22 SGB VII (anzuwenden ab 29.5.2026) bestellen Unternehmen mit regelmäßig 50 oder mehr Beschäftigten Sicherheitsbeauftragte; Zahl und Auswahl richten sich nach den Unfall- und Gesundheitsgefahren und der Zahl der Beschäftigten. Bei mehr als 20 und weniger als 50 Beschäftigten ist ein Sicherheitsbeauftragter nur nötig, wenn nach der Gefährdungsbeurteilung eine besondere Gefährdung für Leben und Gesundheit besteht; die Berufsgenossenschaft kann die Kriterien festlegen und die Bestellung anordnen. Sicherheitsbeauftragte unterstützen dich ehrenamtlich bei der Umsetzung des Arbeitsschutzes und nehmen an Lehrgängen der BG teil.'
rechtsgrundlage:
- § 22 Abs. 1 SGB VII
