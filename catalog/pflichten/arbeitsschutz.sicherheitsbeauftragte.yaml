fachlich_zu_pruefen:
- 'Zählweise (G-05) laut RA Dr. Weber (Antwort auf die Rechtsfrage aus der Sifa-Prüfung, Rückmeldung Runde 2): Schwelle „regelmäßig mehr als 20 Beschäftigte“ (§ 22 SGB VII, § 20 DGUV Vorschrift 1) nach Köpfen – Teilzeit voll, Auszubildende und Leiharbeitnehmer beim Entleiher, keine anteilige Umrechnung wie in § 23 KSchG (DGUV Regel 100-001, Abschnitt 4.2); Zahl der Sicherheitsbeauftragten nach Anlage 2 DGUV Vorschrift 1 – im Text. Der Auslöser zählt so: profil.beschaeftigte.gesamt ist die Kopfzahl aus der Frage „Wie viele Menschen arbeiten für dich?“ (Hilfe: Vollzeit, Teilzeit, Minijob, Azubis), ohne Umrechnung; die Engine leitet daraus keine eigene Zählung ab (packages/rules-engine/src/fakten.ts). Leiharbeitnehmer nennt die Hilfe nicht ausdrücklich – die Angabe gilt für alle Personal-Pflichten (z. B. Sozialversicherung), deshalb nicht erweitert'
