# Katalog B.18 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.offenlegung
version: 3
katalog_nr: B.18
titel:
  de: Jahresabschluss offenlegen
kurz:
  de: Den Jahresabschluss reichst du spätestens zwölf Monate nach Ende des Geschäftsjahres beim Unternehmensregister ein.
erklaerung:
  de: Kapitalgesellschaften und die GmbH & Co. KG (§ 264a HGB) müssen ihren Jahresabschluss beim Unternehmensregister offenlegen, binnen zwölf Monaten nach Ende des Geschäftsjahres. Kleinstkapitalgesellschaften können ihn stattdessen hinterlegen.
begriffe:
- begriff:
    de: Offenlegung
  erklaerung:
    de: Der Jahresabschluss wird öffentlich zugänglich beim Unternehmensregister eingereicht.
rechtsgrundlage:
- § 325 HGB
- § 264a HGB
- § 335 HGB
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_kapitalgesellschaft_oder_co_kg
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine UG, GmbH oder GmbH & Co. KG.
  # R11 (Nutzertest Tischlerei #1): die Pflicht gilt jeder UG/GmbH – ohne Angabe zum Geschäftsjahr wie meist mit dem Kalenderjahr
  - not:
      all:
      - feld: profil.gesellschaft.geschaeftsjahr
        op: vorhanden
      - feld: profil.gesellschaft.geschaeftsjahr
        op: ==
        wert: abweichend
    label:
      de: Dein Geschäftsjahr ist das Kalenderjahr (oder du hast nichts anderes angegeben).
frist:
  typ: wiederkehrend
  rhythmus: jaehrlich
  faellig:
    art: tag_nach_periodenende
    monate_nach: 12
    tag: 31
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
wiederholung:
  art: periodisch
stelle:
  de: Unternehmensregister
kanal: portal
kosten: null
sanktion:
  text:
    de: Das Bundesamt für Justiz setzt ein Ordnungsgeld von 2.500 € bis 25.000 € fest (§ 335 Abs. 1 HGB). Wird die Offenlegung erst nach der Androhung nachgeholt, kann es herabgesetzt werden – bei Kleinstkapitalgesellschaften auf 500 €, bei kleinen Gesellschaften auf 1.000 € (§ 335 Abs. 4 HGB).
  schwere: hoch
automatisierung: hinweis
aktion:
  art: link
  ziel: portal.unternehmensregister
  nachweis_erforderlich: true
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Handelsgesetzbuch § 325
  url: https://www.gesetze-im-internet.de/hgb/__325.html
  abgerufen: null
- titel: Unternehmensregister
  url: https://www.unternehmensregister.de/
  abgerufen: null
fachlich_zu_pruefen:
- 'R12 (Rechtsprüfung Befunde 1 und 9): GmbH & Co. KG (§ 264a HGB); Sanktion § 335 Abs. 1 und 4 HGB – Beträge bestätigen'
- Ohne Angabe zum Geschäftsjahr gilt die Pflicht mit Terminen nach dem Kalenderjahr (R11, Nutzertest Tischlerei) – Rückfrage zum Geschäftsjahr bleibt in der App
- Frist „binnen 12 Monaten“ als 31.12. des Folgejahres umgesetzt (Kalenderjahr) – bestätigen
- Verschiebung bei Fristende am Wochenende/Feiertag festlegen
- 'Kleinstkapitalgesellschaft: Merkmale nicht in der Spezifikation – nur Hinweis auf Hinterlegung'
- 'Erstes Rumpfgeschäftsjahr nach Gründung: Periodenbeginn prüfen'
