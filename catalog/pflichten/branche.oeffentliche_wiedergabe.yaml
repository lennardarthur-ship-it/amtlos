# R12 (Rechtsprüfung Befund 4, Nutzertest Coach #12): Musik und Fernsehen für Kundschaft – öffentliche Wiedergabe
schema_version: 1
id: branche.oeffentliche_wiedergabe
version: 1
katalog_nr: H.10
titel:
  de: Lizenz für Musik und Fernsehen im Betrieb
kurz:
  de: Läuft bei dir Musik, Radio oder Fernsehen für Kundschaft, Gäste oder Kursteilnehmende, brauchst du dafür eine Lizenz – der Rundfunkbeitrag deckt das nicht ab.
erklaerung:
  de: Musik, Radio oder Fernsehen, die du in Café, Laden, Salon, Wartebereich oder Kursraum für andere abspielst, sind eine öffentliche Wiedergabe (§§ 15, 19, 21, 22 UrhG). Dafür brauchst du die Erlaubnis der Rechteinhaber, in der Regel über die GEMA, die auch für andere Verwertungsgesellschaften einzieht. Der Rundfunkbeitrag deckt das nicht ab, ein privates Streaming-Abo auch nicht. Welcher Tarif passt – etwa für Kurse im Raum oder im Live-Stream –, klärst du mit der GEMA.
