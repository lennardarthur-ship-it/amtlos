# R11 (Rechtsprüfung T-114): Hygieneschulung nach § 4 LMHV und Anhang II Kapitel XII VO (EG) Nr. 852/2004
schema_version: 1
id: branche.gastro_hygieneschulung
version: 1
katalog_nr: H.1
titel:
  de: Lebensmittelhygiene schulen
kurz:
  de: Wer bei dir mit leicht verderblichen Lebensmitteln arbeitet – auch du selbst –, braucht eine Schulung in Lebensmittelhygiene.
erklaerung:
  de: Wer gewerbsmäßig leicht verderbliche Lebensmittel herstellt, behandelt oder in Verkehr bringt, braucht dafür Fachkenntnisse aus
    einer Schulung (§ 4 Lebensmittelhygiene-Verordnung). Als Lebensmittelunternehmer stellst du sicher, dass alle, die mit Lebensmitteln
    umgehen, ihrer Tätigkeit entsprechend in Hygiene geschult und überwacht werden (Anhang II Kapitel XII VO (EG) Nr. 852/2004). Halte
    die Schulungen mit Datum und Teilnehmenden fest.
