# R11 (Rechtsprüfung T-114): Hygieneschulung nach § 4 LMHV und Anhang II Kapitel XII VO (EG) Nr. 852/2004
# Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Frage 12): Nachweis, jährliche Wiederholung, Abgrenzung zur IfSG-Belehrung
schema_version: 1
