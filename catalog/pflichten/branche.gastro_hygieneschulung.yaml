# R11 (Rechtsprüfung T-114): Hygieneschulung nach § 4 LMHV und Anhang II Kapitel XII VO (EG) Nr. 852/2004
# Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Frage 12): Nachweis, jährliche Wiederholung, Abgrenzung zur IfSG-Belehrung
schema_version: 1
id: branche.gastro_hygieneschulung
version: 4
katalog_nr: H.1
titel:
  de: Lebensmittelhygiene schulen
kurz:
  de: Wer bei dir mit leicht verderblichen Lebensmitteln arbeitet – auch du selbst –, braucht eine Schulung in Lebensmittelhygiene.
erklaerung:
  de: >-
    Wer gewerbsmäßig leicht verderbliche Lebensmittel herstellt, behandelt oder in Verkehr bringt, braucht dafür
    Fachkenntnisse aus einer Schulung (§ 4 Lebensmittelhygiene-Verordnung). Als Lebensmittelunternehmer stellst du sicher,
    dass alle, die mit Lebensmitteln umgehen, ihrer Tätigkeit entsprechend in Hygiene geschult und überwacht werden
    (Anhang II Kapitel XII VO (EG) Nr. 852/2004). Die Fachkenntnisse musst du der Lebensmittelüberwachung auf Verlangen
    nachweisen (§ 4 Abs. 1 Satz 2 LMHV) – bei Kontrollen wird der Schulungsnachweis verlangt. Halte jede Schulung deshalb
    schriftlich fest: Datum, Themen, wer geschult hat und wer teilgenommen hat, mit Unterschrift. Empfohlen ist eine
    Wiederholung einmal im Jahr (DIN 10514) – eine gesetzliche Frist dafür gibt es nicht. Die Hygieneschulung ist nicht dasselbe wie die Belehrung nach dem
    Infektionsschutzgesetz: Die IfSG-Belehrung geht um Krankheiten, die Hygieneschulung um Fachwissen zur
    Lebensmittelhygiene. Du kannst beides am selben Termin machen, brauchst aber für jede eine eigene Unterschriftsliste.
    Wer eine Berufsausbildung mit Lebensmittelhygiene abgeschlossen hat, zum Beispiel als Bäcker/in oder Koch/Köchin,
    gilt in der Regel als ausreichend geschult (§ 4 Abs. 2 LMHV).
rechtsgrundlage:
