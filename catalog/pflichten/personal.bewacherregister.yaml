# R12 (Rechtsprüfung Befund 6): Bewachungsgewerbe – Wachpersonen vor dem Einsatz anmelden
schema_version: 1
id: personal.bewacherregister
version: 4
katalog_nr: A.3
titel:
  de: Wachpersonen im Bewacherregister anmelden
kurz:
  de: Im Bewachungsgewerbe meldest du jede Wachperson über das Bewacherregister an, bevor sie Bewachungsaufgaben übernimmt.
erklaerung:
  de: Gewerbetreibende mit Erlaubnis nach § 34a GewO, ihre Wachpersonen und die Betriebsleitung werden im Bewacherregister beim Statistischen Bundesamt geführt (§ 11b GewO). Jede Wachperson meldest du vor der Beschäftigung mit Bewachungsaufgaben an; einsetzen darfst du sie erst, wenn die Behörde ihre Zuverlässigkeit geprüft und dir das Ergebnis mitgeteilt hat (§ 16 Abs. 1, 2 BewachV). Endet die Beschäftigung, meldest du die Person über das Bewacherregister ab, spätestens sechs Wochen nach dem Ende (§ 11b Abs. 6 GewO, § 16 Abs. 6 BewachV).
rechtsgrundlage:
- § 11b GewO
- § 16 BewachV
