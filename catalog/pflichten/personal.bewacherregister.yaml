fachlich_zu_pruefen:
- 'Freigabe RA Dr. Weber 22.10.2026: Schwere „hoch“ umgesetzt. Seine Änderung „Ausscheiden einer Wachperson unverzüglich melden (§ 11b Abs. 3 GewO i. V. m. § 16 Abs. 3 BewachV)“ nicht umgesetzt: Laut Wortlaut (lxgesetze.de, gesetze-im-internet.de, 22.10.2026) regelt § 11b Abs. 3 GewO Speicherbefugnisse der Registerbehörde und § 16 Abs. 3 BewachV die Anmeldung mit vorhandener Registernummer; die Abmeldung richtet sich nach § 11b Abs. 6 GewO (Verweis in § 16 Abs. 6 BewachV) – „sechs Wochen nach Beendigung des Beschäftigungsverhältnisses über das Bewacherregister“; „unverzüglich, spätestens 14 Tage“ gilt dort nur für Änderungsmeldungen (Satz 2, 3). Text nennt die sechs Wochen – mit dem Prüfer klären'
