# Katalog G.69 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.os_link
version: 3
katalog_nr: G.69
titel:
  de: Link zur OS-Plattform entfernen
kurz:
  de: Die Pflicht zum Link auf die Online-Streitbeilegungsplattform der EU ist seit 20.07.2025 entfallen. Steht der Link noch auf
    deiner Website, entferne ihn.
erklaerung:
  de: Die Verordnung (EU) Nr. 524/2013 über die Online-Streitbeilegung ist durch die Verordnung (EU) 2024/3228 mit Wirkung zum
    20.07.2025 aufgehoben, die Plattform eingestellt. Damit ist auch die Pflicht entfallen, auf sie zu verlinken. Ein Link auf
    die eingestellte Plattform hilft niemandem – entferne ihn aus Impressum, Shop und AGB. Der Online-Check meldet, ob er noch
    auf deiner Website steht.
