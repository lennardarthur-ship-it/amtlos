# Katalog C.33 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht 22.10.2026 umgesetzt
schema_version: 1
id: steuern.kassenmeldung_ausserbetriebnahme
version: 5
katalog_nr: C.33
titel:
  de: Außerbetriebnahme einer Kasse melden
kurz:
  de: Wenn du eine elektronische Kasse nicht mehr nutzt, meldest du das innerhalb eines Monats über ELSTER.
erklaerung:
  de: Auch die Außerbetriebnahme einer elektronischen Kasse muss dem Finanzamt innerhalb eines Monats gemeldet werden. In der
    Mitteilung erfasst du je Betriebsstätte alle Kassen; die Frist läuft für jede Außerbetriebnahme neu.
rechtsgrundlage:
- § 146a AO
kategorie: steuern
ausloeser:
  ereignis: kasse_ausser_betrieb
  op: eingetreten
  label:
    de: Du hast eine Kasse außer Betrieb genommen.
frist:
  typ: relativ
  bezug:
    ereignis: kasse_ausser_betrieb
  versatz: P1M
  zeitpunkt: spaetestens
  # Steuerberater 22.10.2026: Bezug auf jedes Ereignis, nicht nur das erste
  je_ereignis: true
  # Fristende am Wochenende oder Feiertag: § 108 Abs. 3 AO ist anzuwenden (Steuerberater 22.10.2026)
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
wiederholung:
  art: bei_aenderung
  neu_ausloesen_bei:
  - ereignis: kasse_ausser_betrieb
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: '§ 379 AO nennt die Mitteilung nach § 146a Abs. 4 AO nicht – ein eigenes Bußgeld ist dafür nicht vorgesehen. Das Finanzamt kann die Mitteilung mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
automatisierung: formular_vorausfuellen
erledigung:
  art: bestaetigen
  bestaetigung:
    de: In ELSTER gemeldet
aenderungsnotiz:
  de: Jede Außerbetriebnahme hat jetzt ihre eigene Monatsfrist, nicht nur die erste.
status_recht: in_kraft
