# Katalog F.64 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: NIS2UmsuCG seit 6.12.2025 in Kraft, Registrierung nach § 33 BSIG
schema_version: 1
id: it_sicherheit.nis2_registrierung
