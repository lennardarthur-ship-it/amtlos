fachlich_zu_pruefen:
- 'Prüfvermerk RA Dr. Weber 22.10.2026: Frist als „drei Monate ab Betroffenheit“ über die neue Angabe profil.nis2.betroffen_seit (Check-Frage nur bei NIS2 „ja“); BSI-Kulanz bis 31.7.2026 aus dem Kurztext gestrichen; Sanktion § 65 Abs. 2 Nr. 6, Abs. 5 Satz 1 Nr. 5 BSIG bestätigt'
- 'Offen: für Kleinstbetriebe (unter 10 Beschäftigte, nicht IT) ausgeblendet (T-105) – Umsatz- und Bilanzschwelle nicht abgebildet'
