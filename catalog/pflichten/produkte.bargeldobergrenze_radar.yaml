# Prüfvermerk Rechtsanwalt 22.10.2026 (G.75): Bargeldobergrenze 10.000 € ab 10.7.2027 nach Art. 80 AMLR – „als Radar richtig“
# Wortlaut gelesen am 22.10.2026: Art. 80 Abs. 1, 4 und Art. 90 VO (EU) 2024/1624 (Haufe-Normtext, Springlex)
schema_version: 1
