version: 1
katalog_nr: G.75
titel:
  de: 'Bargeldobergrenze 10.000 € (ab 10.7.2027)'
kurz:
  de: Ab 10.7.2027 darfst du für Waren oder Dienstleistungen keine Barzahlungen über 10.000 € mehr annehmen oder leisten – auch nicht in mehreren zusammenhängenden Teilbeträgen.
erklaerung:
  de: 'Die EU-Geldwäscheverordnung (EU) 2024/1624 gilt ab 10.7.2027 (Art. 90). Personen, die mit Gütern handeln oder Dienstleistungen erbringen, dürfen dann Barzahlungen nur bis höchstens 10.000 € oder den Gegenwert in anderer Währung entgegennehmen oder vornehmen – egal, ob in einem Vorgang oder in mehreren Vorgängen, zwischen denen eine Verbindung zu bestehen scheint (Art. 80 Abs. 1). Ausgenommen sind Zahlungen zwischen Privatpersonen, die nicht beruflich handeln, und Zahlungen oder Einlagen in den Räumen von Banken und Zahlungsdienstleistern (Art. 80 Abs. 4). Die Mitgliedstaaten dürfen niedrigere Obergrenzen festlegen (Art. 80 Abs. 2). Bis dahin gelten die Sorgfaltspflichten des Geldwäschegesetzes bei hohen Bargeschäften weiter.'
