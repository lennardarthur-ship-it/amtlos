# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Getränkeschankanlagen / Flüssiggas prüfen“, Fragen 1)
schema_version: 1
id: branche.gastro_schankanlage_fluessiggas
version: 1
katalog_nr: H.1
titel:
  de: Getränkeschankanlage und Flüssiggasanlage prüfen lassen
kurz:
  de: Betreibst du eine Schankanlage mit CO2-Flasche oder eine Flüssiggasanlage, lässt du sie vor der Inbetriebnahme und danach regelmäßig von einer befähigten Person prüfen.
erklaerung:
  de: 'Getränkeschankanlagen arbeiten mit Kohlendioxid unter Druck; Gasflasche, Druckminderer und Leitungen sind Arbeitsmittel nach der Betriebssicherheitsverordnung. Art und Abstände der Prüfungen legst du in der Gefährdungsbeurteilung fest und lässt sie von einer befähigten Person durchführen (§§ 3, 14 BetrSichV); die DGUV Regel 110-007 beschreibt Bau, Betrieb und Prüfung. Ausströmendes CO2 kann in Kellern und engen Räumen zu Erstickung führen – dort gehören eine Gaswarnanlage und gesicherte Flaschen dazu. Für Flüssiggas, etwa am Gasgrill, Wok-Herd oder im Foodtruck, gilt die DGUV Vorschrift 79: Prüfung vor der ersten Inbetriebnahme und wiederkehrend durch eine befähigte Person, mit Prüfbescheinigung.'
rechtsgrundlage:
- §§ 3, 14 BetrSichV
- DGUV Regel 110-007
- DGUV Vorschrift 79
