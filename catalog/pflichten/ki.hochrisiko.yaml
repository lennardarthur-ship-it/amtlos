katalog_nr: F.65
titel:
  de: Pflichten für Hochrisiko-KI (ab 2.12.2027)
kurz:
  de: Für Hochrisiko-KI-Systeme gelten umfangreiche Pflichten – in den Bereichen nach Anhang III ab 2.12.2027, für KI in Produkten nach Anhang I ab 2.8.2028.
erklaerung:
  de: 'Die Digital-Omnibus-Verordnung (EU) 2026/1744 hat die Hochrisiko-Pflichten der KI-Verordnung verschoben; sie ist am 24.7.2026 im Amtsblatt erschienen und seit 27.7.2026 in Kraft. Für Hochrisiko-KI in sensiblen Bereichen nach Anhang III (zum Beispiel Personalauswahl, Kreditwürdigkeit, Bildung) gelten die Pflichten ab 2.12.2027, für KI als Sicherheitsbauteil von Produkten nach Anhang I ab 2.8.2028. Betroffen sind vor allem Anbieter und Betreiber solcher Systeme.'
