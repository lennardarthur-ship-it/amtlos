sanktion:
  text:
    de: 'Bußgeld bis 10.000 €, wenn Fahrzeuge von Personen geführt werden, die nicht mindestens 18 Jahre alt, nicht unterwiesen oder nicht vom Unternehmer bestimmt sind (§ 58 in Verbindung mit § 35 Abs. 1 DGUV Vorschrift 70, § 209 Abs. 1 Nr. 1, Abs. 3 SGB VII). Mangelhafte Ladungssicherung ist eine Ordnungswidrigkeit nach der StVO (§ 22 in Verbindung mit § 49 StVO, Bußgeldkatalog) – für Fahrer, Verlader und Halter.'
