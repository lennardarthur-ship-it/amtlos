# R11 (Nutzertest Kosmetik #13): Preisverzeichnis für Leistungen im Geschäftslokal nach § 12 PAngV
schema_version: 1
id: branche.preisverzeichnis_dienstleistung
version: 2
katalog_nr: G.70
titel:
  de: Preise deiner Leistungen im Laden aushängen
kurz:
  de: Bietest du Privatkunden in deinem Laden Leistungen an, hängst du ein Preisverzeichnis deiner wesentlichen Leistungen aus.
erklaerung:
  de: Wer Verbrauchern Leistungen anbietet, stellt ein Preisverzeichnis mit den Preisen für die wesentlichen Leistungen oder den
    Verrechnungssätzen auf und bringt es im Geschäftslokal bzw. am Ort des Angebots an, bei Schaufenstern auch dort (§ 12 PAngV).
    Für Gaststätten gilt eine eigene Regel. Verkaufst du außerdem Waren, gibst du bei Waren nach Gewicht, Volumen oder Länge auch den
    Grundpreis an (§ 4 PAngV).
rechtsgrundlage:
- § 12 PAngV
- § 4 PAngV
kategorie: branche
branchen:
- beauty_kosmetik
- handwerk
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2c
    label:
      de: Du verkaufst an Verbraucher.
  - feld: profil.vertrieb.kanaele
    op: enthaelt
    wert: ladengeschaeft
    label:
      de: Du verkaufst im Laden.
  - feld: profil.produkte.arten
    op: enthaelt
    wert: dienstleistung
