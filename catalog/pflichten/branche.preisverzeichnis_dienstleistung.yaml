- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 12 und § 20 Nr. 1 (§ 3 Abs. 1, § 4 Abs. 1 Satz 1, Abs. 2), Nr. 2 (§ 12 Abs. 2 Satz 4) PAngV, § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954 gelesen; künftiger Rahmen bis 100.000 € nach § 3 Abs. 1, 3 PAngG aus dem Gesetzentwurf BT-Drs. 21/5873 (laut BR-Drs. 499/26 unverändert beschlossen, laut buzer verkündet am 19.10.2026, BGBl. 2026 I Nr. 314); Inkrafttreten laut Entwurf am ersten Tag des auf die Verkündung folgenden Quartals – Datum im BGBl. prüfen – fachlich zu bestätigen'
