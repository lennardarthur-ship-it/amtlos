# R11 (Nutzertest Kosmetik #13): Preisverzeichnis für Leistungen im Geschäftslokal nach § 12 PAngV
schema_version: 1
id: branche.preisverzeichnis_dienstleistung
version: 3
katalog_nr: G.70
titel:
  de: Preise deiner Leistungen im Laden aushängen
kurz:
  de: Bietest du Privatkunden in deinem Laden Leistungen an, hängst du ein Preisverzeichnis deiner wesentlichen Leistungen aus.
erklaerung:
  de: Wer Verbrauchern Leistungen anbietet, stellt ein Preisverzeichnis mit den Preisen für die wesentlichen Leistungen oder den
    Verrechnungssätzen auf und bringt es im Geschäftslokal bzw. am Ort des Angebots an, bei Schaufenstern auch dort (§ 12 PAngV).
    Für Gaststätten gilt eine eigene Regel. Verkaufst du außerdem Waren, gibst du bei Waren nach Gewicht, Volumen oder Länge auch den
    Grundpreis an (§ 4 PAngV).
rechtsgrundlage:
- § 12 PAngV
- § 4 PAngV
kategorie: branche
branchen:
- beauty_kosmetik
- handwerk
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2c
    label:
      de: Du verkaufst an Verbraucher.
  - feld: profil.vertrieb.kanaele
    op: enthaelt
    wert: ladengeschaeft
    label:
      de: Du verkaufst im Laden.
  - feld: profil.produkte.arten
    op: enthaelt
    wert: dienstleistung
    label:
      de: Du bietest Dienstleistungen an.
  - not:
      feld: profil.erlaubnis.gaststaette
      op: ==
      wert: true
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch das Ordnungsamt
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 25.000 €, wenn das Preisverzeichnis bei unzumutbarem Aushang nicht zur Einsicht bereitgehalten wird (§ 20 Nr. 2 PAngV) oder Gesamt- oder Grundpreise nicht richtig angegeben sind (§ 20 Nr. 1 PAngV), jeweils in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954. Der Aushang selbst (§ 12 Abs. 2 Satz 1, 2 PAngV) ist in § 20 PAngV nicht genannt.'
  schwere: niedrig
automatisierung: hinweis
