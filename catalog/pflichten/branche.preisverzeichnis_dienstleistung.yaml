wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch das Ordnungsamt
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 25.000 €, wenn das Preisverzeichnis bei unzumutbarem Aushang nicht zur Einsicht bereitgehalten wird (§ 20 Nr. 2 PAngV) oder Gesamt- oder Grundpreise nicht richtig angegeben sind (§ 20 Nr. 1 PAngV), jeweils in Verbindung mit § 3 Abs. 1 Satz 1 Nr. 2, Abs. 2 WiStrG 1954. Der Aushang selbst (§ 12 Abs. 2 Satz 1, 2 PAngV) ist in § 20 PAngV nicht genannt. Nach dem Gesetz vom 19.10.2026 (BGBl. 2026 I Nr. 314) künftig bis 100.000 € (§ 3 Abs. 1, 3 PAngG).'
  schwere: niedrig
automatisierung: hinweis
status_recht: in_kraft
