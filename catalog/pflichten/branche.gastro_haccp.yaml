titel:
  de: Eigenkontrollen nach HACCP
kurz:
  de: Du kontrollierst und dokumentierst regelmäßig die kritischen Punkte deiner Lebensmittelhygiene, zum Beispiel Kühltemperaturen.
erklaerung:
  de: Lebensmittelunternehmen müssen ein Verfahren nach den HACCP-Grundsätzen einrichten und die Kontrollen dokumentieren.
    Das ist ein ständiges Verfahren mit laufender Dokumentation, keine einmalige Aufgabe. Amtlos bietet Kontrolllisten mit Grenzwerten,
    die du festlegst – ein Protokoll gilt für seinen Monat.
