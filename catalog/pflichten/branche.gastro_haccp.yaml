sanktion:
  text:
    de: 'Keine eigene Bußgeldvorschrift (der Tatbestand fehlt in der LMRStV, die für VO (EG) Nr. 852/2004 nur Art. 4 mit Anhang I/II bewehrt). Die Lebensmittelüberwachung kann die nötigen Maßnahmen anordnen (§ 39 LFGB; Art. 138 VO (EU) 2017/625). Hygienemängel nach Anhang II (z. B. Lagerung, Reinigung, Abfall) sind dagegen bußgeldbewehrt – Bußgeld bis 50.000 € (§ 2 LMRStV i. V. m. § 60 Abs. 4 Nr. 2 Buchst. a, Abs. 5 LFGB).'
  schwere: hoch
