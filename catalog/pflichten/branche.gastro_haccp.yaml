aenderungsnotiz:
  de: 'Nach der fachlichen Prüfung Lebensmittelhygiene (22.10.2026): Die Folgen bei Verstößen sind jetzt erfasst. Die Eigenkontrollen bleiben eine laufende Pflicht – ein Kontrollprotokoll erledigt sie nur für seinen Monat.'
