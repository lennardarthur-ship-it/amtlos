fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Grenzwerte (z. B. Kühltemperaturen) und Kontrollhäufigkeit nicht in der Spezifikation – Betrieb legt sie fest; Vorschläge
  fachlich ergänzen
- 'Leitlinien je Branchengruppe (Prüfbericht Lebensmittelhygiene, Tim Baum, 22.10.2026, Frage 1): Liste des Lebensmittelverbands (Stand 7/2026) und BGN-Leitlinie verlinkt; DEHOGA- und Bäckerhandwerk-Leitlinie nur mit Titel – kein frei abrufbarer Link geprüft (laut Liste Bezug über DEHOGA-Shop bzw. Zentralverband)'
- 'Fettabscheider, Wartung Kühlgeräte, Eichung Waagen nur als Hinweis (Prüfbericht Frage 15: „Hinweis genügt“); Fundstellen (Abwassersatzung, Eichrecht) nicht geprüft'
- 'E-166: Vorlage um Gefahrenanalyse, CCP-Entscheidung (Entscheidungsbaum nach Codex CXC 1-1969, Fassung 2023), Verifizierung und Dokumentation ergänzt – Umfang für kleine Betriebe im Rahmen der Flexibilität (Bekanntmachung 2022/C 355/01, Anhang II nur auszugsweise gelesen) fachlich bestätigen'
- Folgen bei Nichterfüllung nicht in der Spezifikation genannt – Sanktion fachlich ergänzen
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
