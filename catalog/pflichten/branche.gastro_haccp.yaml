katalog_nr: H.1
titel:
  de: Eigenkontrollen nach HACCP
kurz:
  de: Du kontrollierst und dokumentierst regelmäßig die kritischen Punkte deiner Lebensmittelhygiene, zum Beispiel Kühltemperaturen.
erklaerung:
  de: >-
    Lebensmittelunternehmen müssen ein ständiges Verfahren nach den sieben HACCP-Grundsätzen einrichten (Art. 5 Abs. 2
    VO (EG) Nr. 852/2004): Gefahren ermitteln, kritische Kontrollpunkte bestimmen, Grenzwerte festlegen, die
    Kontrollpunkte überwachen, Korrekturmaßnahmen festlegen, regelmäßig verifizieren und alles dokumentieren. Kleine
    Betriebe dürfen das einfach halten – Dokumente und Aufzeichnungen müssen der Art und Größe des Betriebs angemessen
    sein; wo die Gefahrenanalyse keinen kritischen Kontrollpunkt ergibt, genügt die gute Hygienepraxis. Das ist eine
    laufende Aufgabe, keine einmalige. Amtlos bietet eine Vorlage mit Gefahrenanalyse je Arbeitsschritt, kritischen
    Kontrollpunkten, Kontrolllisten mit Grenzwerten, die du festlegst, und Messprotokoll – ein Protokoll gilt für seinen
    Monat. Hilfe für deine Branche geben die nationalen Leitlinien für eine gute Hygienepraxis: für Café, Restaurant und
    Imbiss die DEHOGA-„Leitlinie für eine Gute Hygienepraxis in der Gastronomie“ (3. Auflage 2022, Bezug über den
    DEHOGA-Shop), für Bäckerei und Konditorei die „Leitlinie für eine Gute Lebensmittelhygiene-Praxis im Bäcker- und
    Konditorenhandwerk“ des Zentralverbands des Deutschen Bäckerhandwerks (2012) und für Foodtruck und Marktstand die
    BGN-„Leitlinie für eine gute Lebensmittelhygienepraxis in ortsveränderlichen Betriebsstätten“ (2018). Bei einer
    Kontrolle fragt die Lebensmittelüberwachung oft auch nach der Wartung des Fettabscheiders (Gastronomie mit Fritteuse,
    nach der Abwassersatzung deiner Gemeinde), nach der Wartung der Kühlgeräte und nach der Eichung deiner Waagen – leg
    diese Nachweise zu deinen Eigenkontrollen.
rechtsgrundlage:
