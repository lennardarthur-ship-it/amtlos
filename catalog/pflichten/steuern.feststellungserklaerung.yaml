stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel (§ 152 Abs. 2, 6 AO). Für die Feststellung von Einkünften beträgt er für jeden angefangenen Monat 0,0625 % der positiven Summe der festgestellten Einkünfte, mindestens 25 € für jeden angefangenen Monat, höchstens 25.000 € (§ 152 Abs. 7, 10 AO); die Pauschale von 25 € je angefangenem Monat (§ 152 Abs. 6 AO) gilt nur, soweit Abs. 7 nicht greift. Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
automatisierung: formular_vorausfuellen
aenderungsnotiz:
  de: Jetzt auch für OHG und KG, die du im Check als eigene Rechtsform wählen kannst.
