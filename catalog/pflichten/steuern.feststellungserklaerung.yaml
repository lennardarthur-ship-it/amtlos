# R10: neu (Steuerprüfung: bei Personengesellschaften gibt die Gesellschaft die Feststellungserklärung ab, § 180 AO; die Gesellschafter die ESt)
schema_version: 1
id: steuern.feststellungserklaerung
version: 2
katalog_nr: C.27
titel:
  de: Erklärung zur gesonderten und einheitlichen Feststellung abgeben
kurz:
  de: Einmal im Jahr gibt eure Gesellschaft elektronisch die Feststellungserklärung ab; die Gesellschafter versteuern ihren Anteil
    in ihrer eigenen Einkommensteuererklärung.
erklaerung:
  de: Bei einer Personengesellschaft stellt das Finanzamt den Gewinn der Gesellschaft gesondert und einheitlich fest und verteilt
    ihn auf die Gesellschafter. Dafür gibt die Gesellschaft jedes Jahr eine Feststellungserklärung ab – ohne Steuerberatung bis
    31. Juli des Folgejahres, mit Steuerberatung bis Ende Februar des übernächsten Jahres. Jede Gesellschafterin und jeder Gesellschafter
    gibt zusätzlich die eigene Einkommensteuererklärung ab.
rechtsgrundlage:
- § 180 Abs. 1 Nr. 2 Buchst. a AO
- § 181 AO
- § 149 AO
kategorie: steuern
ausloeser:
  feld: profil.rechtsform
  op: in
  wert:
  - gbr
  - partg
  - partg_mbb
  - gmbh_co_kg
  label:
    de: Dein Unternehmen ist eine Personengesellschaft.
frist:
  typ: wiederkehrend
  rhythmus: jaehrlich
  # § 149 Abs. 2 AO: sieben Monate nach Ablauf des Kalenderjahres (31. Juli); beratene Fälle § 149 Abs. 3 AO: letzter
  # Tag im Februar des zweitfolgenden Jahres (31. Juli + 7 Monate, Monatsende-Regel); § 108 Abs. 3 AO: nächster Werktag
  faellig:
    art: tag_nach_periodenende
    monate_nach: 7
    tag: 31
  verlaengerung:
    wenn: { feld: profil.steuerberater, op: "==", wert: true }
    versatz: P7M
  verschiebung: { regel: naechster_werktag, kalender: bundesland }
  erinnerung: [P30D, P7D]
wiederholung:
  art: periodisch
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel. Er beträgt für jeden angefangenen Monat 25 €, höchstens 25.000 € (§ 152 Abs. 6, Abs. 10 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
automatisierung: formular_vorausfuellen
status_recht: in_kraft
