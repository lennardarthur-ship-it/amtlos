# Katalog F.62 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.dsfa
version: 4
katalog_nr: F.62
titel:
  de: Prüfen, ob eine Datenschutz-Folgenabschätzung nötig ist
kurz:
  de: Verarbeitest du besonders sensible Daten oder überwachst du mit Video, prüfst du, ob eine Datenschutz-Folgenabschätzung
    nötig ist.
erklaerung:
  de: Bei voraussichtlich hohem Risiko für die Betroffenen ist vorab eine Folgenabschätzung durchzuführen und zu dokumentieren. Arbeitest du allein mit den Daten deiner Patientinnen oder Kunden – etwa als Ärztin oder Therapeut, ähnlich wohl auch als Trainerin mit Gesundheitsfragebogen –, gilt das in der Regel nicht als umfangreiche Verarbeitung (Erwägungsgrund 91 DSGVO). Dann genügt es meist, kurz festzuhalten, warum keine Folgenabschätzung nötig ist.
rechtsgrundlage:
- Art. 35 DSGVO
- Erwägungsgrund 91 DSGVO
kategorie: datenschutz
branchen:
- gesundheit_pflege
ausloeser:
  any:
  - feld: profil.datenverarbeitung.arten
    op: enthaelt
    wert: gesundheitsdaten
    label:
      de: Du verarbeitest Gesundheitsdaten.
  - feld: profil.datenverarbeitung.arten
    op: enthaelt
    wert: videoueberwachung
    label:
      de: Du setzt Videoüberwachung ein.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; ggf. Datenschutzbeauftragter
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Bußgeld bis 10 Mio. € oder bis 2 % des weltweiten Jahresumsatzes, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 4 Buchst. a DSGVO).
  schwere: hoch
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: DSGVO Art. 35
  url: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  abgerufen: null
- titel: Art. 83 DSGVO, Wortlaut (gdpr-text.com)
  url: https://gdpr-text.com/es/read/article-83
  abgerufen: '2026-10-21'
fachlich_zu_pruefen:
- 'R12 (Nutzertest Coach #13): Hinweis für einzelne Selbstständige nach Erwägungsgrund 91 S. 4 (dort: Ärzte, Gesundheitsberufe, Rechtsanwälte) – Übertragung auf Trainer und Coaches unsicher'
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Auslöser (Gesundheitsdaten, Video) sind eine Vorauswahl – Liste der Aufsichtsbehörden (Muss-Liste) einbeziehen
- 'Vorprüfung 21.10.2026: Sanktion ergänzt – Art. 83 Abs. 4 Buchst. a nennt Art. 25 bis 39 (Art. 35); Wortlaut über gdpr-text.com gelesen, EUR-Lex für das Werkzeug gesperrt'
