# Katalog F.62 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.dsfa
version: 5
katalog_nr: F.62
titel:
  de: Prüfen, ob eine Datenschutz-Folgenabschätzung nötig ist
kurz:
  de: Verarbeitest du besonders sensible Daten oder überwachst du mit Video, prüfst du, ob eine Datenschutz-Folgenabschätzung
    nötig ist.
erklaerung:
  de: Bei voraussichtlich hohem Risiko für die Betroffenen ist vorab eine Folgenabschätzung durchzuführen und zu dokumentieren. Arbeitest du allein mit den Daten deiner Patientinnen oder Kunden – etwa als Ärztin oder Therapeut, ähnlich wohl auch als Trainerin mit Gesundheitsfragebogen –, gilt das in der Regel nicht als umfangreiche Verarbeitung (Erwägungsgrund 91 DSGVO). Dann genügt es meist, kurz festzuhalten, warum keine Folgenabschätzung nötig ist. Ziehe außerdem die Liste der Datenschutzkonferenz heran, für welche Verarbeitungen immer eine Folgenabschätzung nötig ist (Muss-Liste) – darauf stehen zum Beispiel die umfangreiche Videoüberwachung öffentlich zugänglicher Bereiche und die Ortung von Beschäftigten.
rechtsgrundlage:
- Art. 35 DSGVO
- Erwägungsgrund 91 DSGVO
kategorie: datenschutz
branchen:
- gesundheit_pflege
