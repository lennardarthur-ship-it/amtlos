# Prüfvermerk Rechtsanwalt 22.10.2026 zu produkte.gpsr (G.73): Herstellerpflichten (Art. 9) nur bei Herstellung, Eigenmarke oder Import – eigener Auslöser
schema_version: 1
id: produkte.gpsr_hersteller
version: 2
katalog_nr: G.73
titel:
  de: 'Produktsicherheit (GPSR): Pflichten als Hersteller oder Einführer'
kurz:
  de: Stellst du Verbraucherprodukte selbst her, verkaufst sie unter deinem Namen oder führst sie von außerhalb der EU ein, sorgst du
    vor dem Inverkehrbringen für Herstellerangaben, Identifizierung und Sicherheitsinformationen.
erklaerung:
  de: Als Hersteller – dazu zählt auch, wer unter eigenem Namen oder eigener Marke verkauft – bringst du ein Verbraucherprodukt erst
    in Verkehr, wenn es eine Typen-, Chargen- oder Seriennummer oder ein anderes Element zur Identifizierung trägt (Art. 9 Abs. 5
    GPSR), dein Name, deine Handelsmarke, Postanschrift und elektronische Adresse auf dem Produkt, der Verpackung oder einer
    beigefügten Unterlage stehen (Art. 9 Abs. 6) und Anweisungen und Sicherheitsinformationen beiliegen (Art. 9 Abs. 7). Dazu
    gehören eine interne Risikoanalyse und technische Unterlagen (Art. 9 Abs. 2, 3). Führst du Produkte von außerhalb der EU ein,
    gibst du zusätzlich deine eigenen Angaben an (Art. 11 GPSR). Ein Produkt darf nur in Verkehr gebracht werden, wenn ein in der
    EU niedergelassener Wirtschaftsakteur dafür verantwortlich ist (verantwortliche Person, Art. 16 GPSR) – wichtig vor allem, wenn
    der Hersteller außerhalb der EU sitzt und du einführst. Hast du als Hersteller Grund zur Annahme, dass ein Produkt gefährlich
    ist, ergreifst du unverzüglich Korrekturmaßnahmen bis hin zu Rücknahme oder Rückruf, informierst die Verbraucher und
    unterrichtest die Marktüberwachungsbehörden über das Safety-Business-Gateway (Art. 9 Abs. 8 GPSR). Unfälle, bei denen ein
    Produkt zum Tod oder zu schweren Gesundheitsschäden geführt hat, meldest du unverzüglich über das Safety-Business-Gateway
    (Art. 20 Abs. 1, 2 GPSR). Für Kosmetik geht die Kosmetikverordnung vor, die GPSR gilt ergänzend (Art. 2 Abs. 1). Lebensmittel
    fallen nicht unter die Verordnung.
rechtsgrundlage:
- Art. 9 Verordnung (EU) 2023/988 (GPSR)
- Art. 11 Verordnung (EU) 2023/988 (GPSR)
- Art. 16 Verordnung (EU) 2023/988 (GPSR)
- Art. 20 Verordnung (EU) 2023/988 (GPSR)
- Art. 2 Abs. 1, 3 VO (EU) 2023/988 (Kosmetik ergänzend, Lebensmittel ausgenommen)
