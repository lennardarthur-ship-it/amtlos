fachlich_zu_pruefen:
- 'Neu nach Prüfvermerk Rechtsanwalt 22.10.2026 zu produkte.gpsr („Auslöser trennen“). Freigabe Rechtsanwalt Runde 2 (23.10.2026) (ändern): Sanktionen § 28 Abs. 2 Nr. 1–6 ProdSG bestätigt; ergänzt: verantwortliche Person in der EU (Art. 16 GPSR), Rückruf- und Meldepflichten (Art. 9 Abs. 8, Art. 20 Safety-Business-Gateway) als Hinweis, Schwere „hoch“ (Marktüberwachung, Rücknahmeanordnungen nach § 26 ProdSG). Art. 9, 16, 20 GPSR am 22.10.2026 gelesen (gesetze.legal), § 26 ProdSG über freirecht.de (Abs. 2 Nr. 7, Abs. 4: Rücknahme/Rückruf)'
