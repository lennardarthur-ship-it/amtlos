sanktion:
  text:
    de: 'Bußgeld bis 10.000 €, wenn vor dem Inverkehrbringen Pflichtangaben fehlen oder Anweisungen und Sicherheitsinformationen nicht beigefügt sind (§ 28 Abs. 2 Nr. 5, 6, Abs. 3 ProdSG); auch Risikoanalyse, technische Unterlagen und Identifizierung sind bußgeldbewehrt (§ 28 Abs. 2 Nr. 1 bis 4 ProdSG). Die Marktüberwachung kann außerdem Maßnahmen bis hin zur Rücknahme oder zum Rückruf anordnen (§ 26 ProdSG).'
