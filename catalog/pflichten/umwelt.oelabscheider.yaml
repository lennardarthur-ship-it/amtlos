# R12 (Nutzertest Kfz #1): Öl- und Leichtflüssigkeitsabscheider – nur als Hinweis
schema_version: 1
id: umwelt.oelabscheider
version: 2
katalog_nr: U.4
titel:
  de: Öl- und Leichtflüssigkeitsabscheider warten und prüfen lassen
kurz:
  de: Hast du einen Abscheider, etwa am Waschplatz, lässt du ihn regelmäßig warten und prüfen – die Einzelheiten regeln Abwassersatzung und Wasserbehörde.
erklaerung:
  de: Abwasser mit Öl oder Kraftstoff, etwa vom Waschplatz oder Werkstattboden, läuft über einen Leichtflüssigkeitsabscheider. Betreiber lassen ihn regelmäßig warten, die Inhalte durch einen Fachbetrieb entsorgen und in festen Abständen prüfen. Üblich sind eine monatliche Eigenkontrolle, eine Wartung alle sechs Monate und alle fünf Jahre eine Generalinspektion (DIN 1999-100, DIN EN 858-2, Anhang 49 AbwV). Welche Abstände und Nachweise für dich gelten, ergibt sich aus der Abwassersatzung deiner Gemeinde und den Vorgaben der Wasserbehörde – frag dort nach. Lagerst du Frisch- oder Altöl, gelten ab einem bestimmten Anlagenvolumen die Anforderungen der AwSV; die Schwellen hängen von der Gefährdungsstufe ab.
rechtsgrundlage:
- Abwassersatzung der Gemeinde
- Wasserrecht des Landes
- § 103 Abs. 1 Nr. 1, Abs. 2 WHG
- Anhang 49 AbwV
- AwSV
