titel:
  de: Öl- und Leichtflüssigkeitsabscheider warten und prüfen lassen
kurz:
  de: Hast du einen Abscheider, etwa am Waschplatz, lässt du ihn regelmäßig warten und prüfen – die Einzelheiten regeln Abwassersatzung und Wasserbehörde.
erklaerung:
  de: Abwasser mit Öl oder Kraftstoff, etwa vom Waschplatz oder Werkstattboden, läuft über einen Leichtflüssigkeitsabscheider. Betreiber lassen ihn regelmäßig warten, die Inhalte durch einen Fachbetrieb entsorgen und in festen Abständen prüfen. Welche Abstände und Nachweise gelten, ergibt sich aus der Abwassersatzung deiner Gemeinde und den Vorgaben der Wasserbehörde – frag dort nach.
