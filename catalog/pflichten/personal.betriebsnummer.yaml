# Katalog D.37 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.betriebsnummer
version: 4
katalog_nr: D.37
titel:
  de: Betriebsnummer beantragen
kurz:
  de: Bevor du die erste Person einstellst, brauchst du eine Betriebsnummer von der Bundesagentur für Arbeit.
erklaerung:
  de: Die Betriebsnummer identifiziert deinen Betrieb in allen Meldungen zur Sozialversicherung. Du beantragst sie beim Betriebsnummern-Service
    der Bundesagentur für Arbeit, bevor die erste Person bei dir anfängt.
begriffe:
- begriff:
    de: Betriebsnummer
  erklaerung:
    de: Eine achtstellige Nummer, unter der dein Betrieb bei der Sozialversicherung geführt wird.
rechtsgrundlage:
- § 18i SGB IV
kategorie: personal
ausloeser:
  any:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - ereignis: erste_einstellung
    op: geplant
    label:
      de: Du planst die erste Einstellung.
  - ereignis: erste_einstellung
    op: eingetreten
    label:
      de: Du hast die erste Person eingestellt.
phase: gruendung
frist:
  typ: relativ
  bezug:
    ereignis: erste_einstellung
  versatz: P0D
  zeitpunkt: vor_beginn
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
wiederholung:
  art: einmalig
stelle:
  de: Bundesagentur für Arbeit, Betriebsnummern-Service
kanal: portal
kosten: null
sanktion:
  text:
    de: 'Für den Antrag selbst ist kein eigenes Bußgeld vorgesehen; bußgeldbewehrt ist, Änderungen oder die Einstellung des Betriebs nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig mitzuteilen (bis 5.000 €, § 111 Abs. 1 Nr. 1a, Abs. 4 SGB IV in Verbindung mit § 18i Abs. 4 SGB IV). Ohne Betriebsnummer kannst du nicht an den Meldeverfahren zur Sozialversicherung teilnehmen (§ 18i Abs. 1 SGB IV).'
  schwere: hoch
automatisierung: hinweis
status_recht: in_kraft
