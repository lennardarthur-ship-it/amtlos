# R10: aus branche.gastro_ifsg_belehrung herausgelöst (Rechtsprüfung: Bescheinigung nach § 43 Abs. 1 IfSG vor Beginn, nicht älter als drei Monate)
schema_version: 1
id: branche.gastro_ifsg_bescheinigung
version: 3
katalog_nr: H.1
titel:
  de: Bescheinigung des Gesundheitsamts vor dem ersten Arbeitstag (§ 43 IfSG)
kurz:
  de: Wer bei dir zum ersten Mal mit Lebensmitteln arbeitet, braucht vor dem ersten Arbeitstag die Bescheinigung über die Belehrung durch
    das Gesundheitsamt; sie darf bei Arbeitsbeginn nicht älter als drei Monate sein (§ 43 Abs. 1 IfSG).
erklaerung:
  de: Die Erstbelehrung macht das Gesundheitsamt oder ein beauftragter Arzt. Die Bescheinigung darf bei Aufnahme der Tätigkeit
    höchstens drei Monate alt sein; du bewahrst sie im Betrieb auf. Das gilt nur für die erstmalige Tätigkeit mit Lebensmitteln nach
    § 42 IfSG. Wer schon eine Bescheinigung aus einer früheren Tätigkeit hat, braucht keine neue – dann reichen diese Bescheinigung
    und deine Belehrung. Bürokräfte ohne Umgang mit Lebensmitteln brauchen beides nicht. Danach belehrst du deine Beschäftigten
    selbst – siehe „Belehrung nach § 43 IfSG durch den Arbeitgeber“.
rechtsgrundlage:
- § 43 Abs. 1 IfSG
