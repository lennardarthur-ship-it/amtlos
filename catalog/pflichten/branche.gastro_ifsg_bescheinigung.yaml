# R10: aus branche.gastro_ifsg_belehrung herausgelöst (Rechtsprüfung: Bescheinigung nach § 43 Abs. 1 IfSG vor Beginn, nicht älter als drei Monate)
schema_version: 1
id: branche.gastro_ifsg_bescheinigung
version: 1
katalog_nr: H.1
titel:
  de: Bescheinigung des Gesundheitsamts vor dem ersten Arbeitstag (§ 43 IfSG)
kurz:
  de: Wer bei dir erstmals mit Lebensmitteln arbeitet, braucht vor dem ersten Arbeitstag die Bescheinigung über die Belehrung durch
    das Gesundheitsamt.
erklaerung:
  de: Die Erstbelehrung macht das Gesundheitsamt oder ein beauftragter Arzt. Die Bescheinigung darf bei Aufnahme der Tätigkeit
    höchstens drei Monate alt sein; du bewahrst sie im Betrieb auf. Das gilt auch für dich selbst, wenn du mit Lebensmitteln
    arbeitest. Danach belehrst du deine Beschäftigten selbst – siehe „Belehrung nach § 43 IfSG durch den Arbeitgeber“.
