# Katalog A.0 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: Eckpunkte der Länder (März 2026), Gesetzentwurf des Bundes noch nicht bekannt
# Freigabe Rechtsanwalt 22.10.2026: als Radar/Hinweis freigegeben – vor dem Launch Stand des Gesetzentwurfs prüfen; ohne Bundesentwurf bleibt es beim Hinweis
