fachlich_zu_pruefen:
- 'Sanktion nach Zoll-Prüfung R12 (Befund 17): § 21 Abs. 1 Nr. 9, Abs. 3 MiLoG'
- Branchenmindestlöhne (AEntG, allgemeinverbindliche Tarifverträge) nur als Hinweis ohne Beträge (R11, Nutzertest Gebäudereinigung) – Branchen, Lohngruppen und Beträge 2026/2027 sowie Aufzeichnungspflicht nach § 19 AEntG fachlich ergänzen
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Ausnahmen (z. B. Azubis, Praktika) als Hinweis ergänzen?
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
