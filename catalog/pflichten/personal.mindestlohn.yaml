# Katalog D.39 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.mindestlohn
version: 5
katalog_nr: D.39
titel:
  de: Mindestlohn zahlen
kurz:
  de: Du zahlst allen Beschäftigten mindestens den gesetzlichen Mindestlohn.
erklaerung:
  de: Der Mindestlohn beträgt 13,90 € je Stunde ab 1.1.2026 und 14,60 € ab 1.1.2027. Amtlos führt die Werte mit Gültigkeitszeitraum.
    In manchen Branchen gelten höhere Branchenmindestlöhne aus allgemeinverbindlichen Tarifverträgen oder Verordnungen nach dem
    Arbeitnehmer-Entsendegesetz, zum Beispiel in der Gebäudereinigung, in Teilen des Bau- und Ausbaugewerbes und in der Pflege.
    Prüfe, ob einer für deinen Betrieb gilt – Amtlos kennt die Beträge noch nicht. Ausgenommen vom gesetzlichen Mindestlohn sind unter
    anderem Auszubildende, Pflichtpraktika, freiwillige Praktika bis zu drei Monaten, Jugendliche unter 18 ohne abgeschlossene
    Berufsausbildung und Langzeitarbeitslose in den ersten sechs Monaten der Beschäftigung (§ 22 MiLoG).
rechtsgrundlage:
- MiLoG
- § 22 MiLoG
