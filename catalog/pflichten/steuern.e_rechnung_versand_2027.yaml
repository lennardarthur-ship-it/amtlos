# Katalog C.30 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.e_rechnung_versand_2027
version: 1
katalog_nr: C.30
titel:
  de: E-Rechnungen versenden (ab 2027)
kurz:
  de: Ab dem 1. Januar 2027 musst du an Unternehmen E-Rechnungen schicken, wenn dein Vorjahresumsatz über 800.000 € liegt.
erklaerung:
  de: Die Pflicht zum Versand strukturierter E-Rechnungen (XRechnung oder ZUGFeRD) gilt ab 1.1.2027 für Unternehmen mit mehr
    als 800.000 € Vorjahresumsatz. Kleinunternehmer sind befreit. Eine PDF-Rechnung ist keine E-Rechnung.
rechtsgrundlage:
- § 14 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2b
    label:
      de: Du verkaufst an Unternehmen.
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: false
    label:
      de: Du nutzt die Kleinunternehmerregelung nicht.
  - any:
    - feld: profil.umsatz.vorjahr
      op: '>'
      wert:
        regelwert: steuern.e_rechnung.grenze_vorjahresumsatz_2027
      label:
        de: Dein Umsatz im Vorjahr lag über 800.000 €.
    - feld: profil.umsatz.prognose_laufendes_jahr
      op: '>'
      wert:
        regelwert: steuern.e_rechnung.grenze_vorjahresumsatz_2027
      label:
        de: Dein erwarteter Umsatz in diesem Jahr liegt über 800.000 €.
