# Katalog C.30 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.e_rechnung_versand_2027
version: 3
katalog_nr: C.30
titel:
  de: E-Rechnungen versenden (ab 2027)
kurz:
  de: Ab dem 1. Januar 2027 sind Rechnungen an Unternehmen als E-Rechnung vorgeschrieben, wenn der Vorjahresumsatz über 800.000 € liegt.
erklaerung:
  de: Die Pflicht zum Versand strukturierter E-Rechnungen (XRechnung oder ZUGFeRD) gilt ab 1.1.2027 für Unternehmen mit mehr
    als 800.000 € Vorjahresumsatz. Kleinunternehmer sind befreit. Eine PDF-Rechnung ist keine E-Rechnung. Ausgenommen sind
    Kleinbetragsrechnungen bis 250 € und Fahrausweise (§§ 33, 34 UStDV).
rechtsgrundlage:
- § 14 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2b
    label:
      de: Du verkaufst an Unternehmen.
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: false
    label:
      de: Du nutzt die Kleinunternehmerregelung nicht.
  - any:
    - feld: profil.umsatz.vorjahr
      op: '>'
      wert:
        regelwert: steuern.e_rechnung.grenze_vorjahresumsatz_2027
      label:
        de: Dein Umsatz im Vorjahr lag über 800.000 €.
    - feld: profil.umsatz.prognose_laufendes_jahr
      op: '>'
      wert:
        regelwert: steuern.e_rechnung.grenze_vorjahresumsatz_2027
      label:
        de: Dein erwarteter Umsatz in diesem Jahr liegt über 800.000 €.
frist:
  typ: absolut
  datum: '2027-01-01'
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
  erinnerung:
  - P90D
  - P30D
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: § 26a UStG nennt kein eigenes Bußgeld für die falsche Form. Eine Rechnung, die nicht als vorgeschriebene E-Rechnung ausgestellt wird, erfüllt § 14 UStG nicht – dein Kunde braucht eine solche Rechnung aber für den Vorsteuerabzug (§ 15 Abs. 1 Satz 1 Nr. 1 Satz 2 UStG). Wer eine Rechnung nicht oder nicht rechtzeitig ausstellt, riskiert ein Bußgeld bis 5.000 € (§ 26a Abs. 2 Nr. 1, Abs. 3 UStG).
  schwere: hoch
automatisierung: hinweis
aktion:
  art: abhaken
status_recht: in_kraft
