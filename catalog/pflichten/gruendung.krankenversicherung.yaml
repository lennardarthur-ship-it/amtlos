# Katalog A.10 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gruendung.krankenversicherung
version: 2
katalog_nr: A.10
titel:
  de: Krankenversicherung über die Selbstständigkeit informieren
kurz:
  de: 'Sag deiner Krankenversicherung unverzüglich, dass du selbstständig bist. Hauptberuflich Selbstständige versichern sich selbst.'
erklaerung:
  de: 'Mit der Selbstständigkeit kann sich deine Krankenversicherung ändern. Das betrifft dich als Person – als Einzelunternehmerin, Gesellschafter oder, je nach Status, als Geschäftsführerin einer GmbH. Wer hauptberuflich selbstständig ist, kümmert sich selbst um seine Versicherung und die Beiträge. Machst du dich im Nebenerwerb selbstständig, teilst du der Kasse den Umfang mit, damit sie prüfen kann, ob die Selbstständigkeit hauptberuflich ist. Änderungen der Verhältnisse teilst du unverzüglich mit (§ 206 Abs. 1 SGB V).'
rechtsgrundlage:
- § 206 Abs. 1 SGB V
- § 5 Abs. 5 SGB V
kategorie: gruendung
ausloeser:
  immer: true
phase: gruendung
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Deine Krankenversicherung
kanal: post
kosten: null
sanktion:
  text:
    de: 'Keine Sanktion für die Information selbst; Änderungen der Verhältnisse sind der Krankenkasse unverzüglich mitzuteilen (§ 206 Abs. 1 SGB V), Verstoß bis 2.500 € (§ 307 Abs. 1, 2 SGB V). Wer hauptberuflich selbstständig ist, verliert die Versicherungspflicht als Arbeitnehmer (§ 5 Abs. 5 SGB V) und muss sich freiwillig oder privat versichern.'
