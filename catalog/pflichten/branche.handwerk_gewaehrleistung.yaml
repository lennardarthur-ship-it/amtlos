katalog_nr: H.2
titel:
  de: Gewährleistung im Blick behalten
kurz:
  de: Für deine Werkleistungen haftest du für Mängel. Dokumentiere Abnahmen und behalte die Fristen im Blick.
erklaerung:
  de: Wie lange Mängelansprüche bestehen, hängt von der Art des Werks ab – bei Werkleistungen an Sachen in der Regel 2 Jahre (§ 634a Abs. 1 Nr. 1 BGB), bei Bauwerken 5 Jahre (§ 634a Abs. 1 Nr. 2 BGB). Stellst du Waren her und lieferst sie – etwa als Bäckerei oder Konditorei, auch Torten auf Bestellung –, gilt Kaufrecht (§ 650 BGB); die Mängelrechte richten sich dann nach §§ 437, 438 BGB und verjähren in der Regel nach 2 Jahren (§ 438 Abs. 1 Nr. 3 BGB). Verkaufst du an Verbraucher, wird bei einem Mangel, der sich im ersten Jahr zeigt, vermutet, dass er schon bei Übergabe da war (§ 477 BGB). Amtlos erinnert nach fachlicher Freigabe an das Ende der Fristen.
