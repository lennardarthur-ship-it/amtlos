version: 3
katalog_nr: E.56
titel:
  de: Arbeitsmedizinische Vorsorge anbieten
kurz:
  de: Du bietest arbeitsmedizinische Vorsorge an oder veranlasst sie – je nach Tätigkeit, etwa bei Bildschirmarbeit, Lärm, Feuchtarbeit, Mehlstaub oder Schweißrauch.
erklaerung:
  de: Die Verordnung zur arbeitsmedizinischen Vorsorge regelt Pflicht-, Angebots- und Wunschvorsorge. Bei Bildschirmarbeit ist Vorsorge anzubieten. Bei Lärm ist Vorsorge ab 80 dB(A) anzubieten und ab 85 dB(A) Pflicht (Anhang Teil 3 ArbMedVV). Im Handwerk kommen oft Feuchtarbeit (zum Beispiel Reinigung, Friseur, Küche), Schweißrauch und Holzstaub hinzu, in Bäckereien Mehlstaub, in Pflege und Reinigung biologische Arbeitsstoffe. Je nach Dauer und Belastung ist dafür Angebots- oder Pflichtvorsorge nötig – prüfe das mit deinem Betriebsarzt.
