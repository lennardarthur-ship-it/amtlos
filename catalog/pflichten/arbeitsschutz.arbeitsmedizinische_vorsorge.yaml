katalog_nr: E.56
titel:
  de: Arbeitsmedizinische Vorsorge anbieten
kurz:
  de: Du bietest arbeitsmedizinische Vorsorge an, zum Beispiel die Angebotsvorsorge bei Bildschirmarbeit.
erklaerung:
  de: Die Verordnung zur arbeitsmedizinischen Vorsorge regelt Pflicht-, Angebots- und Wunschvorsorge. Bei Bildschirmarbeit
    ist Vorsorge anzubieten. Bei Feuchtarbeit (zum Beispiel Reinigung, Friseur, Küche) und bei Tätigkeiten mit biologischen Arbeitsstoffen
    kann Angebots- oder Pflichtvorsorge nötig sein – prüfe das mit deinem Betriebsarzt. Bei Lärm ist Vorsorge ab 80 dB(A) anzubieten
    und ab 85 dB(A) Pflicht (Anhang Teil 3 ArbMedVV).
