fachlich_zu_pruefen:
- 'R12 (Nutzertests Kfz #15, Bäckerei #6): Beispiele je Branche ohne Grenzwerte – Mehlstaub (laut Nutzertest Pflichtvorsorge über 4 mg/m³, Nummer im Anhang Teil 1 unsicher), Schweißrauch, Feuchtarbeit (Stundengrenzen) fachlich ergänzen'
- Lärm (80/85 dB(A), Anhang Teil 3) nach Nutzertest Tischlerei R11 ergänzt; Pflichtvorsorge bei Hartholzstaub (Anhang Teil 1) unsicher, nicht aufgenommen
- Feuchtarbeit und Biostoffe nur als Prüfhinweis (R11, Nutzertest Gebäudereinigung) – Stundengrenzen und Nummern im Anhang der ArbMedVV fachlich ergänzen
- Anlässe und Fristen je Vorsorgeart fachlich ergänzen
- Folgen bei Nichterfüllung nicht in der Spezifikation genannt – Sanktion fachlich ergänzen
