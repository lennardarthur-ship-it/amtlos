    de: 'Bußgeld bis 5.000 €, wenn du eine Pflichtvorsorge nicht oder nicht rechtzeitig veranlasst, eine Tätigkeit ohne die vorgeschriebene Pflichtvorsorge ausüben lässt, die Vorsorgekartei nicht, nicht richtig oder nicht vollständig führst oder eine Angebotsvorsorge nicht oder nicht rechtzeitig anbietest (§ 10 Abs. 1 ArbMedVV in Verbindung mit § 25 Abs. 1 Nr. 1, Abs. 2 ArbSchG). Gefährdest du dadurch vorsätzlich Leben oder Gesundheit eines Beschäftigten, ist das eine Straftat (§ 26 Nr. 2 ArbSchG).'
