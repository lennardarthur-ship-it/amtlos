# Rechtsanwalt Abgleich 23.10.2026: § 26 Nr. 2 ArbSchG und Aufsichtsbehörde ergänzt (beharrliche Wiederholung nach § 26 Nr. 1 betrifft nur § 25 Abs. 1 Nr. 2 Buchst. a – nicht übernommen)
# Katalog E.56 · Startbestand aus Spezifikation Abschnitt 4 (E-054); Prüfergebnis Sifa 22.10.2026 (C Katalog E.56, Frage 15, bestätigt) eingearbeitet
schema_version: 1
id: arbeitsschutz.arbeitsmedizinische_vorsorge
version: 6
katalog_nr: E.56
titel:
  de: Arbeitsmedizinische Vorsorge anbieten
kurz:
  de: Du bietest arbeitsmedizinische Vorsorge an oder veranlasst sie – je nach Tätigkeit, etwa bei Bildschirmarbeit, Lärm, Feuchtarbeit, Mehlstaub oder Schweißrauch.
erklaerung:
  de: 'Die Verordnung zur arbeitsmedizinischen Vorsorge unterscheidet Pflichtvorsorge (du veranlasst sie, ohne sie darf die Tätigkeit nicht ausgeübt werden), Angebotsvorsorge (du bietest sie an) und Wunschvorsorge. Häufige Anlässe nach dem Anhang der ArbMedVV: Feuchtarbeit von regelmäßig mehr als zwei Stunden je Tag – Angebot, ab vier Stunden – Pflicht (Teil 1 Abs. 2 Nr. 2 Buchst. e, Abs. 1 Nr. 2 Buchst. a); Mehlstaub – Angebot bei Einhaltung, Pflicht bei Überschreitung von 4 mg/m³ (Teil 1 Abs. 2 Nr. 2 Buchst. j, Abs. 1 Nr. 2 Buchst. j); Schweißrauch – Angebot bei Einhaltung, Pflicht bei Überschreitung von 3 mg/m³ (Teil 1 Abs. 2 Nr. 2 Buchst. f, Abs. 1 Nr. 2 Buchst. b); Hartholzstaub (Teil 1 Abs. 1 Nr. 1); Lärm – Angebot ab 80, Pflicht ab 85 dB(A) (Teil 3 Abs. 2 Nr. 1, Abs. 1 Nr. 3); Bildschirmarbeit – Angebot (Teil 4 Abs. 2 Nr. 1); Arbeit im Freien mit natürlicher UV-Strahlung von regelmäßig einer Stunde oder mehr je Tag – Angebot (Teil 3 Abs. 2 Nr. 5); Tätigkeiten mit Kontakt zu Blut und Körperflüssigkeiten im Gesundheitsdienst, etwa mit Hepatitis-B- und Hepatitis-C-Viren – Pflicht (Teil 2 Abs. 1 Nr. 3). Bei Kosmetik mit Blutkontakt (zum Beispiel Permanent-Make-up, Fußpflege) bewertet der Betriebsarzt Vorsorge und Impfangebot. Friseurchemikalien sind außer über die Feuchtarbeit kein eigener Anlass. Über jede Vorsorge führst du eine Vorsorgekartei (§ 3 Abs. 4 ArbMedVV); die Abstände richten sich nach der Arbeitsmedizinischen Regel AMR 2.1 – das klärst du mit deinem Betriebsarzt. Die Untersuchung von Nachtarbeitnehmern (§ 6 Abs. 3 ArbZG) und die Untersuchungen Jugendlicher (§§ 32, 33 JArbSchG) sind keine Vorsorge nach der ArbMedVV und eigene Pflichten.'
