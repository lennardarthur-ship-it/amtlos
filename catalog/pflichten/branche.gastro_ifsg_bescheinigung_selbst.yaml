# Rechtsanwalt Abgleich 23.10.2026: Folgen wörtlich nach seinem Vorschlag, Schwere hoch bleibt
# R11 (Nutzertest Gründerin Foodtruck, K-062): Bescheinigung nach § 43 Abs. 1 IfSG auch für die Inhaberin bzw. den Inhaber – als Gründungsschritt vor dem Start
schema_version: 1
id: branche.gastro_ifsg_bescheinigung_selbst
version: 3
katalog_nr: H.1
titel:
  de: Eigene Bescheinigung des Gesundheitsamts vor dem Start (§ 43 IfSG)
kurz:
  de: Arbeitest du selbst zum ersten Mal mit Lebensmitteln, brauchst du vor dem Start die Bescheinigung über die Belehrung durch
    das Gesundheitsamt; sie darf bei Aufnahme der Tätigkeit nicht älter als drei Monate sein (§ 43 Abs. 1 IfSG).
erklaerung:
  de: Die Bescheinigung nach § 43 Abs. 1 IfSG (früher „Gesundheitszeugnis“) brauchst auch du selbst, wenn du gewerbsmäßig mit
    Lebensmitteln nach § 42 IfSG arbeitest – zum Beispiel beim Kochen, Zubereiten oder Ausgeben. Die Belehrung macht das Gesundheitsamt
    oder ein beauftragter Arzt; vereinbare den Termin früh. Bei Aufnahme der Tätigkeit darf die Bescheinigung höchstens drei Monate
    alt sein. Hast du schon eine aus einer früheren Tätigkeit, brauchst du keine neue.
