fachlich_zu_pruefen:
- 'Rückmeldung Lebensmittel (Lebensmittelfachbeauftragter, 22.10.2026, freigegeben): bestätigt, dass § 43 Abs. 1 IfSG für jede Person gilt, die erstmals gewerbsmäßig mit Lebensmitteln nach § 42 Abs. 2 arbeitet, auch für Inhaberinnen und Inhaber; Zusatz „nicht älter als drei Monate“ im Kurztext ergänzt'
- 'Sanktion § 73 Abs. 1a IfSG, bis 25.000 € laut Rechtsprüfung R11 (Befund 20) „wahrscheinlich“ – Nummer und Höhe bestätigen (Bußgeldhöhen laut Prüfvermerk Lebensmittelfachbeauftragter durch Rechtsanwalt)'
- 'Rechtsanwalt Runde 3 (23.10.2026) (ändern): Höhe bestätigt, Nummer in § 73 Abs. 1a IfSG eintragen; für die Inhaberin greife der Tatbestand „tätig ist“. NICHT umgesetzt – am amtlichen Wortlaut nicht belegt: § 73 Abs. 1a IfSG (gesetze-im-internet.de, 23.10.2026) nennt § 43 nur in Nr. 16a (Mitteilung, Abs. 2), Nr. 16b (Belehrung, Abs. 4 Satz 1), Nr. 20 („entgegen § 43 Abs. 1 Satz 1 … eine Person beschäftigt“) und Nr. 21 (Vorlage, Abs. 5 Satz 2); eine Nummer für das eigene Tätigsein ohne Bescheinigung gibt es nicht, Nr. 20 erfasst nur das Beschäftigen. Text unverändert („§ 73 IfSG“) – Fundstelle für die eigene Tätigkeit mit Rechtsanwalt klären'
