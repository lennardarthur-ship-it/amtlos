sanktion:
  text:
    de: 'Keine eigene Rechtsfolge in § 356a BGB. Das Fehlen ist ein Verstoß gegen eine Verbraucherschutzvorschrift und kann abgemahnt werden (§ 3a UWG, § 2 UKlaG); umstritten ist, ob die Widerrufsfrist ohne Button beginnt – verlass dich vorsichtshalber nicht darauf.'
