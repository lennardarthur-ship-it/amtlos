# Katalog G.68 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.widerrufsbutton
version: 3
katalog_nr: G.68
titel:
  de: Widerrufsbutton für Online-Verträge
kurz:
  de: Seit 19.6.2026 brauchen B2C-Online-Verträge mit Widerrufsrecht einen Widerrufsbutton – zweistufig, ohne Login, mit Eingangsbestätigung
    auf einem dauerhaften Datenträger.
erklaerung:
  de: Schließt du Fernabsatzverträge mit Verbrauchern über eine Online-Benutzeroberfläche – Website oder App –, brauchst du eine
    Widerrufsfunktion (§ 356a BGB). Sie ist während der Widerrufsfrist ständig verfügbar, hervorgehoben und leicht zugänglich, gut
    lesbar mit „Vertrag widerrufen“ beschriftet und führt zu einer Bestätigungsfunktion „Widerruf bestätigen“. Danach schickst du
    unverzüglich eine Eingangsbestätigung auf einem dauerhaften Datenträger, zum Beispiel per E-Mail, mit Inhalt des Widerrufs sowie
    Datum und Uhrzeit des Eingangs. Pass auch deine Widerrufsbelehrung an das neue Muster an.
