# Katalog C.21 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Rechtsstand 21.10.2026: § 18 Abs. 2 Satz 6 UStG gilt nur für 2021 bis 2026, keine Verlängerung beschlossen → ab 2027 wieder Satz 4
schema_version: 1
id: steuern.ust_va_neugruender_radar
version: 2
katalog_nr: C.21
titel:
  de: Monatliche USt-Voranmeldung für Neugründer ab 2027
kurz:
  de: Die Ausnahme von der monatlichen Voranmeldung für Neugründer gilt nur bis einschließlich 2026 – eine Verlängerung ist bisher nicht beschlossen.
erklaerung:
  de: 'Für die Jahre 2021 bis 2026 richtet sich der Voranmeldungszeitraum im Gründungsjahr und im Folgejahr nach der voraussichtlichen Steuer (§ 18 Abs. 2 Satz 6 UStG). Ab 2027 gilt nach dem Gesetz wieder Satz 4: Im Jahr der Gründung und im Folgejahr gibst du die Voranmeldung monatlich ab. Stand: Oktober 2026 – eine Verlängerung ist nicht beschlossen, kann aber noch kommen. Hast du 2026 gegründet, klärst du mit dem Finanzamt oder der Steuerberatung, welcher Rhythmus 2027 für dich gilt.'
