# Katalog C.21 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
# Rechtsstand 22.10.2026 (StB Busch): § 18 Abs. 2 Satz 6 UStG gilt nur für 2021 bis 2026, keine Verlängerung bekannt → ab 2027
# wieder Satz 4 (geltendes Recht, daher in_kraft ab 01.01.2027 statt Radar)
schema_version: 1
id: steuern.ust_va_neugruender_radar
version: 3
katalog_nr: C.21
titel:
  de: Monatliche USt-Voranmeldung für Neugründer ab 2027
kurz:
  de: Die Ausnahme von der monatlichen Voranmeldung für Neugründer gilt nur bis einschließlich 2026 – eine Verlängerung ist bisher nicht beschlossen.
erklaerung:
  de: 'Für die Jahre 2021 bis 2026 richtet sich der Voranmeldungszeitraum im Gründungsjahr und im Folgejahr nach der voraussichtlichen Steuer (§ 18 Abs. 2 Satz 6 UStG). Ab 2027 gilt nach dem Gesetz wieder Satz 4: Im Jahr der Gründung und im Folgejahr gibst du die Voranmeldung monatlich ab. Hast du 2026 gegründet, ist 2027 dein Folgejahr – du gibst dann monatliche Voranmeldungen ab; die Aussetzung erfasst nur die Jahre bis 2026. Die Voranmeldung ist bis zum 10. Tag nach Ablauf des Monats fällig, mit Dauerfristverlängerung einen Monat später (§ 18 Abs. 1 UStG, §§ 46 ff. UStDV). Stand: Oktober 2026 – eine Verlängerung ist nicht beschlossen, kann aber mit dem Jahressteuergesetz noch kommen.'
rechtsgrundlage:
