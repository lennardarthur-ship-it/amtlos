stelle:
  de: Umweltbundesamt (Portal DIVID)
kanal: portal
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn du dich nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig registrieren lässt (§ 26 Abs. 1 Nr. 1, Abs. 2 EWKFondsG), und bis 10.000 €, wenn du die jährliche Meldung nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig machst (§ 26 Abs. 1 Nr. 9, Abs. 2 EWKFondsG).'
  schwere: mittel
