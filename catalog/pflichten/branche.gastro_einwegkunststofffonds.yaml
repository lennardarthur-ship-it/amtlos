# Rechtsanwalt Runde 3 (23.10.2026, zu branche.gastro_mehrweg): eigener Hinweis-Eintrag Einwegkunststofffonds (EWKFondsG)
schema_version: 1
id: branche.gastro_einwegkunststofffonds
version: 1
katalog_nr: G.73
titel:
  de: 'Einwegkunststoff-Serviceverpackungen: registrieren und Mengen melden'
kurz:
  de: 'Einwegkunststoff-Serviceverpackungen (Becher, Boxen, Tüten): Registrierung im DIVID-Portal des UBA und jährliche Mengenmeldung (§§ 7, 11, 12 EWKFondsG).'
erklaerung:
  de: 'Füllst du Speisen oder Getränke zum Mitnehmen in Einwegverpackungen aus Kunststoff – Becher, Boxen, Tüten –, bist du nach dem Einwegkunststofffondsgesetz Hersteller; das gilt ausdrücklich auch für den, der die Verpackungen erst befüllt (§ 3 Nr. 3 EWKFondsG). Hersteller registrieren sich vor Aufnahme der Tätigkeit beim Umweltbundesamt (§ 7 EWKFondsG), über dessen Portal DIVID. Dort meldest du jedes Jahr die Mengen, die du im Vorjahr in Verkehr gebracht hast (§ 11 EWKFondsG); danach richtet sich die Einwegkunststoffabgabe, die du zahlst (§ 12 EWKFondsG). Die Registrierungs- und Abgabepflicht gilt seit 2024; die erste Mengenmeldung (für 2024) war bis 15.5.2025 fällig.'
rechtsgrundlage:
- § 3 Nr. 3 EWKFondsG
- § 7 EWKFondsG
- § 11 EWKFondsG
- § 12 EWKFondsG
kategorie: branche
branchen:
- gastronomie_lebensmittel
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: gastronomie_lebensmittel
    label:
      de: Dein Betrieb gehört zur Gastronomie oder Lebensmittelbranche.
  - feld: profil.gastro.to_go
    op: ==
    wert: true
    label:
      de: Du verkaufst Essen oder Getränke zum Mitnehmen in Einwegverpackungen.
frist:
