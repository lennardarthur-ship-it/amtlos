# R11 (Nutzertest Gründerin Foodtruck): Reisegewerbekarte als eigene Pflicht, aus gruendung.erlaubnis_pruefen herausgelöst
schema_version: 1
id: gruendung.reisegewerbekarte
version: 4
katalog_nr: A.3
titel:
  de: Reisegewerbekarte beantragen (§ 55 GewO)
kurz:
  de: Für den Verkauf ohne feste Niederlassung oder ohne vorherige Bestellung – etwa auf Märkten oder von Ort zu Ort – ist vor dem Start in der Regel eine Reisegewerbekarte vorgesehen. Ob du sie brauchst, klärt das Gewerbeamt.
erklaerung:
  de: Ein Reisegewerbe betreibt, wer außerhalb seiner gewerblichen Niederlassung oder ohne eine solche Waren oder Leistungen anbietet, ohne vorher bestellt worden zu sein. Dafür brauchst du eine Reisegewerbekarte vom Gewerbeamt (§ 55 GewO). Sie muss vor dem Start vorliegen. Plane genug Vorlauf ein – für den Antrag brauchst du in der Regel ein Führungszeugnis und eine Auskunft aus dem Gewerbezentralregister, die du selbst erst beantragen musst. Für Märkte, Messen und Volksfeste, die die Gemeinde festgesetzt hat, gelten Ausnahmen (Titel IV GewO) – ob die Karte trotzdem nötig ist, klärt das Gewerbeamt. Für bestimmte Tätigkeiten ohne Karte gilt stattdessen eine Anzeigepflicht (§ 55c GewO).
