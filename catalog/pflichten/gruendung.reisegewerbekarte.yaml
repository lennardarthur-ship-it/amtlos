fachlich_zu_pruefen:
- 'R12 (Rechtsprüfung Befund 15): Anzeigepflicht nach § 55c GewO für reisegewerbekartenfreie Tätigkeiten – welche Fälle, bestätigen'
- 'Dauer des Verfahrens (Nutzertest R11: 4–6 Wochen, je Behörde verschieden) – Erinnerung sechs und zwei Wochen vorher als Vorlauf, bestätigen'
- Ausnahmen für festgesetzte Märkte, Messen und Volksfeste (Titel IV GewO, § 55a) nur als Prüfhinweis – wann die Karte trotzdem nötig ist; Reisegewerbe neben stehendem Gewerbe (Gewerbeanzeige und Karte)
- Unterlagen (Führungszeugnis, Auskunft aus dem Gewerbezentralregister) je Behörde bestätigen
- Folgen bei Nichterfüllung – Sanktion fachlich ergänzen
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
- 'Vorprüfung 21.10.2026 (Abschnitt 7, RDG): Formulierung als Information bzw. Rechenergebnis statt Vorwegnahme des Ergebnisses (Liste in rdg-katalog.md)'
