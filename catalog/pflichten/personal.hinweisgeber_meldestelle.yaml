# Katalog D.46 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.hinweisgeber_meldestelle
version: 3
katalog_nr: D.46
titel:
  de: Interne Meldestelle einrichten (Hinweisgeberschutz)
kurz:
  de: Ab 50 Beschäftigten richtest du eine interne Meldestelle für Hinweisgeber ein.
erklaerung:
  de: Das Hinweisgeberschutzgesetz verlangt von Beschäftigungsgebern mit in der Regel mindestens 50 Beschäftigten eine interne Meldestelle (§ 12 Abs. 2 HinSchG). Gezählt werden Köpfe, nicht Vollzeitstellen – Beschäftigte sind neben Arbeitnehmern auch Auszubildende (§ 3 Abs. 8 HinSchG).
rechtsgrundlage:
- HinSchG
kategorie: personal
ausloeser:
  all:
  - feld: profil.beschaeftigte.gesamt
    op: '>='
    wert:
      regelwert: personal.hinschg.schwelle
  - feld: abgeleitet.beschaeftigte.zaehlung_hinschg
    op: '>='
    wert:
      regelwert: personal.hinschg.schwelle
    label:
      de: Du hast mindestens 50 Beschäftigte im Sinne des HinSchG.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Bußgeld bis 20.000 €, wenn keine interne Meldestelle eingerichtet ist (§ 40 Abs. 2 Nr. 2, Abs. 6 HinSchG).
  schwere: hoch
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
