# R11 (Rechtsprüfung Befund 2): Hinweispflicht nach § 2a Abs. 2 SchwarzArbG für die Branchen nach § 2a Abs. 1 (SchwarzArbMoDiG)
# Freigabe Rechtsanwalt 22.10.2026: Termin „vor Beginn“ (Vortag) statt „spätestens bei Arbeitsbeginn“; eigener Auslöser für Inhaber ohne Beschäftigte empfohlen – bräuchte einen eigenen Eintrag ohne Einstellungsbezug, hier nur als Satz in der Erklärung
schema_version: 1
id: personal.ausweis_hinweis
version: 4
katalog_nr: D.38
titel:
  de: Schriftlich auf die Ausweispflicht hinweisen
kurz:
  de: 'In deiner Branche weist du jede neue beschäftigte Person vor Arbeitsbeginn schriftlich darauf hin, dass sie bei der Arbeit einen Ausweis dabeihaben muss.'
erklaerung:
  de: In den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz müssen Beschäftigte bei der Arbeit ihren Personalausweis, Pass oder ein Ersatzpapier mitführen und dem Zoll auf Verlangen vorlegen. Du weist jede Person vor Beginn der Dienst- oder Werkleistungen nachweislich und schriftlich auf diese Pflicht hin (§ 2a Abs. 2 SchwarzArbG) – am besten zusammen mit dem Arbeitsvertrag. Den Hinweis bewahrst du für die Dauer der Beschäftigung auf und legst ihn bei einer Prüfung durch den Zoll vor. Ein unterschriebener Satz im Arbeitsvertrag reicht, wenn du ihn gesondert vorlegen kannst; sonst nimm ein eigenes Blatt mit Unterschrift. Die Mitführungspflicht gilt für alle, die in diesen Branchen Leistungen erbringen – auch für dich als Inhaberin oder Inhaber (§ 2a Abs. 1 SchwarzArbG).
rechtsgrundlage:
- § 2a Abs. 2 SchwarzArbG
- § 2a Abs. 1 SchwarzArbG
