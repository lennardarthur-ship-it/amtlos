# R11 (Rechtsprüfung Befund 2): Hinweispflicht nach § 2a Abs. 2 SchwarzArbG für die Branchen nach § 2a Abs. 1 (SchwarzArbMoDiG)
schema_version: 1
id: personal.ausweis_hinweis
version: 1
katalog_nr: D.38
titel:
  de: Schriftlich auf die Ausweispflicht hinweisen
kurz:
  de: In deiner Branche weist du jede neue beschäftigte Person vor Arbeitsbeginn schriftlich darauf hin, dass sie bei der Arbeit
    einen Ausweis dabeihaben muss.
erklaerung:
  de: In den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz müssen Beschäftigte bei der Arbeit ihren Personalausweis, Pass
    oder ein Ersatzpapier mitführen und dem Zoll auf Verlangen vorlegen. Du weist jede Person nachweislich und schriftlich auf
    diese Pflicht hin, und zwar vor Beginn der Arbeit. Den Hinweis bewahrst du für die Dauer der Beschäftigung auf und legst ihn
    bei einer Prüfung durch den Zoll vor. Ein Satz im Arbeitsvertrag oder ein eigenes Blatt mit Unterschrift reicht.
rechtsgrundlage:
- § 2a Abs. 2 SchwarzArbG
kategorie: personal
