fachlich_zu_pruefen:
- 'Neu nach Nutzertest R12 (Kfz #2) – genaue Artikel der VO (EU) 2024/573 und § 5 ChemKlimaschutzV unsicher. Prüfvermerk RA Dr. Weber 22.10.2026: Art. 10 VO (EU) 2024/573 i. V. m. ChemKlimaschutzV und Sanktion § 26 ChemG bestätigt; Zusatz „alte Bescheinigungen bleiben gültig, müssen aber nach der neuen VO aktualisiert werden (Art. 10 Abs. 7 – Frist prüfen)“: am 22.10.2026 am Wortlaut gelesen (gesetze.legal) – die Regel steht in Art. 10 Abs. 9, nicht in Abs. 7 (Abs. 7: Zertifikate nur nach bestandenem Bewertungsverfahren); Abs. 9 Satz 1: Zertifikate und Ausbildungsbescheinigungen nach VO (EU) Nr. 517/2014 bleiben gültig, Satz 3: erste Auffrischung oder Bewertung spätestens am 12.3.2029 – so in die Erklärung übernommen (Fundstelle Abs. 9); § 17 Abs. 2 ChemKlimaschutzV 2026 (gelesen) lässt alte Sachkundebescheinigungen bis 12.3.2029 weitergelten (Nr. 1), ob das die Kfz-Bescheinigungen nach VO (EG) Nr. 307/2008 erfasst, ist offen'
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 5 Abs. 1 und § 16 Abs. 2 Nr. 3 ChemKlimaschutzV 2026, § 26 Abs. 1 Nr. 7 Buchst. a, Abs. 3 ChemG; Zuordnung der Kfz-Klimaanlagen zu Art. 10 Abs. 1 UAbs. 2 VO (EU) 2024/573 laut UBA-Übersicht gelesen; Rechtsgrundlage auf ChemKlimaschutzV 2026 (§§ 5, 6) präzisieren – fachlich zu bestätigen'
