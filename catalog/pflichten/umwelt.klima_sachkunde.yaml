# R12 (Nutzertest Kfz #2): Klimaanlagen-Service an Fahrzeugen – Sachkunde für F-Gase
schema_version: 1
id: umwelt.klima_sachkunde
version: 3
katalog_nr: U.5
titel:
  de: Klimaanlagen an Fahrzeugen nur mit Sachkunde warten
kurz:
  de: Wer Klimaanlagen in Fahrzeugen befüllt, wartet oder Kältemittel absaugt, braucht eine Bescheinigung über die Sachkunde für fluorierte Treibhausgase.
erklaerung:
  de: Arbeiten an Fahrzeug-Klimaanlagen, bei denen Kältemittel zurückgewonnen oder nachgefüllt wird, dürfen nur Personen mit einer Bescheinigung über ihre Sachkunde ausführen. Das regeln die EU-F-Gase-Verordnung (EU) 2024/573 und die Chemikalien-Klimaschutzverordnung. Halte die Bescheinigungen deiner Mitarbeitenden bereit. Bescheinigungen nach der früheren F-Gase-Verordnung (EU) Nr. 517/2014 bleiben unter den Bedingungen gültig, unter denen sie ausgestellt wurden; wer eine solche Bescheinigung hat, nimmt aber spätestens am 12.3.2029 erstmals an einem Auffrischungskurs teil oder schließt ein Bewertungsverfahren ab (Art. 10 Abs. 9 VO (EU) 2024/573).
rechtsgrundlage:
- Verordnung (EU) 2024/573
- ChemKlimaschutzV
