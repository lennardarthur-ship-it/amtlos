# R12 (Nutzertest Kfz #2): Klimaanlagen-Service an Fahrzeugen – Sachkunde für F-Gase
schema_version: 1
id: umwelt.klima_sachkunde
version: 1
katalog_nr: U.5
titel:
  de: Klimaanlagen an Fahrzeugen nur mit Sachkunde warten
kurz:
  de: Wer Klimaanlagen in Fahrzeugen befüllt, wartet oder Kältemittel absaugt, braucht eine Bescheinigung über die Sachkunde für fluorierte Treibhausgase.
erklaerung:
  de: Arbeiten an Fahrzeug-Klimaanlagen, bei denen Kältemittel zurückgewonnen oder nachgefüllt wird, dürfen nur Personen mit einer Bescheinigung über ihre Sachkunde ausführen. Das regeln die EU-F-Gase-Verordnung (EU) 2024/573 und die Chemikalien-Klimaschutzverordnung. Halte die Bescheinigungen deiner Mitarbeitenden bereit.
