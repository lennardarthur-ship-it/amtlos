fachlich_zu_pruefen:
- 'R12 (Nutzertest Coach #1, #2): laufende Pflicht statt Gründungsschritt; Sanktion § 25 Abs. 1 SGB IV, Geringfügigkeitsgrenze 603 € (2027: 633 €) und Bedingung „kein versicherungspflichtiger Arbeitnehmer“ ergänzt – bestätigen'
- Gelten Yoga-, Fitness- und Personal Trainer generell als Lehrende (auch reines 1:1-Training)? „In der Regel“ laut Nutzertest – unsicher
- Merkmal „keine versicherungspflichtigen Beschäftigten“ nur über die Frage im Check (Einzelperson ohne Beschäftigte oder nur mit Minijobs) – ob Minijobs als versicherungspflichtige Arbeitnehmer zählen, bestätigen
- Liste der Gruppen vollständig (§ 2 SGB VI)?
- 'Fristbeginn: Aufnahme der Tätigkeit = Gründungsdatum?'
