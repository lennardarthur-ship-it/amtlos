titel:
  de: Freistellungsbescheinigung für Bauleistungen beantragen
kurz:
  de: Wenn du Bauleistungen erbringst, beantragst du beim Finanzamt eine Freistellungsbescheinigung, damit deine Auftraggeber
    keine Bauabzugsteuer einbehalten.
erklaerung:
  de: Ohne Freistellungsbescheinigung müssen Auftraggeber einen Teil deiner Rechnung als Bauabzugsteuer einbehalten.
