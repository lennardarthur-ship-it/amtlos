# Katalog C.35 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht 22.10.2026 umgesetzt (Höchstdauer drei Jahre nicht, siehe fachlich_zu_pruefen)
schema_version: 1
id: steuern.bauabzugsteuer_freistellung
version: 4
katalog_nr: C.35
titel:
  de: Freistellungsbescheinigung für Bauleistungen beantragen
kurz:
  de: Wenn du Bauleistungen für Unternehmen oder öffentliche Auftraggeber erbringst, beantragst du beim Finanzamt eine Freistellungsbescheinigung,
    damit deine Auftraggeber keine Bauabzugsteuer einbehalten.
erklaerung:
  de: Ohne Freistellungsbescheinigung müssen Auftraggeber einen Teil deiner Rechnung als Bauabzugsteuer einbehalten. Das gilt
    nur für Bauleistungen an Unternehmer oder juristische Personen des öffentlichen Rechts; Privatleute als Bauherren behalten
    nichts ein (§ 48 Abs. 1 EStG). Bauleistungen sind alle Leistungen, die der Herstellung, Instandsetzung, Instandhaltung, Änderung
    oder Beseitigung von Bauwerken dienen – auch im Handwerk, z. B. eine Elektroinstallation. Eine Frist gibt es nicht; beantrage
    die Bescheinigung vor der ersten Bauleistung. Sie gilt befristet – die Geltungsdauer steht in der Bescheinigung (§ 48b Abs. 3
    EStG); beantrage rechtzeitig vor Ablauf eine neue.
rechtsgrundlage:
- § 48 Abs. 1 EStG
- § 48b EStG
kategorie: steuern
branchen:
- bau
- handwerk
# Steuerberater 22.10.2026: nur bei Bauleistungen an Unternehmer oder juristische Personen des öffentlichen Rechts (§ 48 Abs. 1 EStG);
# Bau und Handwerk über die Angabe, solche Bauleistungen zu erbringen
