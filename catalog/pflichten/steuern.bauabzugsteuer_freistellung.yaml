# Katalog C.35 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.bauabzugsteuer_freistellung
version: 3
katalog_nr: C.35
titel:
  de: Freistellungsbescheinigung für Bauleistungen beantragen
kurz:
  de: Wenn du Bauleistungen erbringst, beantragst du beim Finanzamt eine Freistellungsbescheinigung, damit deine Auftraggeber
    keine Bauabzugsteuer einbehalten.
erklaerung:
  de: Ohne Freistellungsbescheinigung müssen Auftraggeber einen Teil deiner Rechnung als Bauabzugsteuer einbehalten.
rechtsgrundlage:
- § 48b EStG
kategorie: steuern
branchen:
- bau
- handwerk
# Branche „Bau“ oder – im Handwerk – die Angabe, Bauleistungen für andere Unternehmen zu erbringen (z. B. Elektro, Sanitär)
ausloeser:
  any:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: bau
    label:
      de: Du erbringst Bauleistungen.
  - all:
    - feld: profil.taetigkeit.branchen
      op: enthaelt
      wert: handwerk
    - feld: profil.bauleistungen.fuer_unternehmen
      op: ==
      wert: true
      label:
        de: Du erbringst Bauleistungen für andere Unternehmen.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Finanzamt
kanal: post
kosten: null
sanktion:
  text:
    de: 'Ohne gültige Freistellungsbescheinigung muss dein Auftraggeber 15 % der Gegenleistung einbehalten und für dich ans Finanzamt abführen, sofern die Gegenleistungen im Kalenderjahr 5.000 € (bei bestimmten Vermietern 15.000 €) übersteigen (§ 48 Abs. 1 Satz 1, Abs. 2 Satz 1 EStG).'
  schwere: mittel
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Einkommensteuergesetz § 48b
  url: https://www.gesetze-im-internet.de/estg/__48b.html
  abgerufen: null
- titel: Einkommensteuergesetz § 48
  url: https://www.gesetze-im-internet.de/estg/__48.html
  abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Auch Handwerksbetriebe mit Bauleistungen erfassen (Branche handwerk)?
- Gültigkeitsdauer der Bescheinigung und Erneuerung ergänzen
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (Grenze 15.000 € gilt für Leistungsempfänger mit ausschließlich steuerfreien Umsätzen nach § 4 Nr. 12 UStG)'
pruefung:
  status: entwurf
  geprueft_von: null
  geprueft_am: null
