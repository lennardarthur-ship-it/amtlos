titel:
  de: Berufserlaubnis und Zulassung
kurz:
  de: Gesundheits- und Pflegeberufe brauchen je nach Tätigkeit eine Approbation, Erlaubnis oder Zulassung.
erklaerung:
  de: 'Welche Erlaubnis nötig ist, hängt vom Beruf ab – etwa die Approbation für Ärztinnen und Ärzte (BÄO), die Heilpraktikererlaubnis (HeilprG) oder die Erlaubnis für Physiotherapie (MPhG), Ergotherapie, Logopädie und Pflege (PflBG). Kosmetik und Massage ohne Heilkunde sind erlaubnisfrei. Ohne die nötige Erlaubnis darfst du die Tätigkeit nicht ausüben.'
