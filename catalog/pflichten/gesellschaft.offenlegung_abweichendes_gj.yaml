# Katalog B.18 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Termin = Ende des Geschäftsjahres + 12 Monate berechnen (Angabe des Geschäftsjahresendes im Profil nötig)
schema_version: 1
id: gesellschaft.offenlegung_abweichendes_gj
version: 4
katalog_nr: B.18
titel:
  de: Jahresabschluss offenlegen (abweichendes Geschäftsjahr)
kurz:
  de: Den Jahresabschluss reichst du spätestens zwölf Monate nach Ende deines Geschäftsjahres beim Unternehmensregister ein.
erklaerung:
  de: Bei einem vom Kalenderjahr abweichenden Geschäftsjahr berechnet Amtlos den Termin noch nicht; die Frist beträgt zwölf
    Monate nach Ende des Geschäftsjahres.
rechtsgrundlage:
- § 325 HGB
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_kapitalgesellschaft_oder_co_kg
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine UG, GmbH oder GmbH & Co. KG.
  - feld: profil.gesellschaft.geschaeftsjahr
    op: ==
    wert: abweichend
    label:
      de: Dein Geschäftsjahr weicht vom Kalenderjahr ab.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Unternehmensregister
kanal: portal
kosten: null
sanktion:
  text:
    de: 'Das Bundesamt für Justiz setzt ein Ordnungsgeld von 2.500 € bis 25.000 € fest (§ 335 Abs. 1 HGB). Wird die Offenlegung erst nach der Androhung nachgeholt, kann es herabgesetzt werden – bei Kleinstkapitalgesellschaften auf 500 €, bei kleinen Gesellschaften auf 1.000 € (§ 335 Abs. 4 HGB).'
  schwere: hoch
