# Katalog C.30 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.e_rechnung_versand_2028
version: 3
katalog_nr: C.30
titel:
  de: E-Rechnungen versenden (ab 2028)
kurz:
  de: Ab dem 1. Januar 2028 schickst du an Unternehmen nur noch E-Rechnungen – Kleinunternehmer sind befreit.
erklaerung:
  de: Ab 1.1.2028 gilt die Pflicht zum Versand strukturierter E-Rechnungen für alle Unternehmen im B2B-Geschäft, außer Kleinunternehmern
    nach § 19 UStG. Ausgenommen sind Kleinbetragsrechnungen bis 250 € und Fahrausweise (§§ 33, 34 UStDV).
rechtsgrundlage:
- § 14 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.kunden.segmente
    op: enthaelt
    wert: b2b
    label:
      de: Du verkaufst an Unternehmen.
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: false
    label:
      de: Du nutzt die Kleinunternehmerregelung nicht.
frist:
  typ: absolut
  datum: '2028-01-01'
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
  erinnerung:
  - P180D
  - P60D
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: '§ 26a UStG nennt kein eigenes Bußgeld für die falsche Form. Eine Rechnung, die nicht als vorgeschriebene E-Rechnung ausgestellt wird, erfüllt § 14 UStG nicht – dein Kunde braucht eine solche Rechnung aber für den Vorsteuerabzug (§ 15 Abs. 1 Satz 1 Nr. 1 Satz 2 UStG). Wer eine Rechnung nicht oder nicht rechtzeitig ausstellt, riskiert ein Bußgeld bis 5.000 € (§ 26a Abs. 2 Nr. 1, Abs. 3 UStG).'
  schwere: mittel
automatisierung: hinweis
aktion:
  art: abhaken
status_recht: in_kraft
