# Katalog F.65 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: ki.transparenz
version: 6
katalog_nr: F.65
titel:
  de: KI-Inhalte und KI-Interaktion kennzeichnen
kurz:
  de: Seit 2.8.2026 müssen Menschen erkennen können, dass sie mit einer KI sprechen, etwa bei Chatbots. Täuschend echte KI-Bilder, -Videos und -Töne (Deepfakes) kennzeichnest du.
erklaerung:
  de: Nach Art. 50 KI-Verordnung müssen Menschen erkennen können, dass sie mit einer KI interagieren (Abs. 1, seit 2.8.2026). Anbieter generativer KI-Systeme kennzeichnen deren Ausgaben maschinenlesbar (Abs. 2); für Systeme, die schon vor dem 2.8.2026 in Verkehr waren, gilt dafür eine Übergangsfrist bis 2.12.2026. Wer KI nur einsetzt (Betreiber), kennzeichnet Deepfakes – täuschend echte Bilder, Videos oder Tonaufnahmen – sowie KI-erzeugte Texte, die die Öffentlichkeit über Angelegenheiten von öffentlichem Interesse informieren sollen, außer sie wurden redaktionell kontrolliert (Abs. 4). Nicht jedes KI-Werbebild fällt darunter – entscheidend ist, ob es täuschend echt wirkt. Für kleine Betriebe sind vor allem zwei Fälle wichtig – ein eigener Chatbot auf der Website, wenn du ihn selbst anbietest (Abs. 1), und Deepfakes oder täuschend echte KI-Bilder in der Werbung (Abs. 4).
