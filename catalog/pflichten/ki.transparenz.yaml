titel:
  de: KI-Inhalte und KI-Interaktion kennzeichnen
kurz:
  de: Seit 2.8.2026 müssen Menschen erkennen können, dass sie mit einer KI sprechen, etwa bei Chatbots; KI-erzeugte Inhalte kennzeichnest du.
erklaerung:
  de: Nach Art. 50 KI-Verordnung müssen Menschen erkennen können, dass sie mit einer KI interagieren (Abs. 1, seit 2.8.2026) oder
    dass Inhalte KI-erzeugt sind (Abs. 2). Für generative KI-Systeme, die schon vor dem 2.8.2026 in Verkehr waren, gilt für die
    maschinenlesbare Kennzeichnung eine Übergangsfrist bis 2.12.2026.
