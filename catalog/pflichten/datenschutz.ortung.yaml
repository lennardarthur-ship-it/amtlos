# R12 (Nutzertest Kurier #8): GPS- und Telematik-Ortung
schema_version: 1
id: datenschutz.ortung
version: 3
katalog_nr: F.63
titel:
  de: Ortung von Fahrzeugen und Beschäftigten datenschutzgerecht gestalten
kurz:
  de: Ortest du Fahrzeuge oder Beschäftigte per GPS oder Telematik, brauchst du eine Rechtsgrundlage, informierst die Betroffenen, legst Zweck und Löschfrist fest und schließt mit dem Anbieter einen Vertrag.
erklaerung:
  de: Ortungsdaten von Fahrzeugen, die Beschäftigte fahren, sind personenbezogene Daten. Rechtsgrundlage ist in der Regel ein berechtigtes Interesse wie Tourenplanung oder Diebstahlschutz (Art. 6 Abs. 1 Buchst. f DSGVO); du wägst es gegen die Interessen der Beschäftigten ab. Lege fest, wofür du die Daten nutzt, und verwende sie nur dafür (Art. 5 Abs. 1 Buchst. b DSGVO); eine dauerhafte Leistungs- und Verhaltenskontrolle ist in der Regel unzulässig, außerhalb der Arbeitszeit ortest du nicht. Informiere die Beschäftigten vorher (Art. 13 DSGVO), lege eine Löschfrist fest und schließe mit dem Telematik-Anbieter einen Vertrag zur Auftragsverarbeitung (Art. 28 DSGVO). Die Ortung von Beschäftigten steht auf der Liste der Datenschutzkonferenz, für die immer eine Datenschutz-Folgenabschätzung nötig ist – führe sie vor dem Einsatz durch (Art. 35 DSGVO). Zustelldaten wie die Unterschrift der Empfänger oder ein Foto der Zustellung sind eigene Verarbeitungen, die du gesondert betrachtest.
rechtsgrundlage:
- Art. 6 Abs. 1 Buchst. f DSGVO
- Art. 5 Abs. 1 DSGVO
- Art. 13 DSGVO
- Art. 28 DSGVO
- Art. 35 DSGVO
