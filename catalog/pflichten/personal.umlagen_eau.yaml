# Katalog D.40 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.umlagen_eau
version: 2
katalog_nr: D.40
titel:
  de: Umlagen U1/U2/U3 und eAU-Abruf
kurz:
  de: Für Beschäftigte zahlst du Umlagen (U1, U2, U3) und rufst Arbeitsunfähigkeitsbescheinigungen elektronisch ab.
erklaerung:
  de: 'Die Umlagen finanzieren die Erstattung von Entgeltfortzahlung (U1), Mutterschaftsleistungen (U2) und das Insolvenzgeld (U3). Die U1 zahlen nur Betriebe mit in der Regel höchstens 30 Beschäftigten (§ 1 Abs. 1 AAG), die U2 alle Arbeitgeber, die U3 ebenfalls alle (§ 358 SGB III). Du zahlst sie mit den Beiträgen und meldest sie mit dem Beitragsnachweis. Die eAU rufst du bei der Krankenkasse ab, meist über das Lohnprogramm.'
begriffe:
- begriff:
    de: eAU
  erklaerung:
    de: Elektronische Arbeitsunfähigkeitsbescheinigung, die du bei der Krankenkasse abrufst.
rechtsgrundlage:
- AAG
- § 358 SGB III
- § 109 SGB IV
kategorie: personal
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Krankenkassen
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Die Umlagen sind Teil des Gesamtsozialversicherungsbeitrags: bei Verspätung Säumniszuschlag 1 % je Monat (§ 24 SGB IV). Für den eAU-Abruf ist keine Sanktion vorgesehen; ohne Abruf fehlt der Nachweis der Arbeitsunfähigkeit.'
