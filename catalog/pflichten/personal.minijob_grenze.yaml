# Katalog D.39 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Bekanntmachung des BMAS zur Geringfügigkeitsgrenze 2027 nach Veröffentlichung als Quelle ergänzen
schema_version: 1
id: personal.minijob_grenze
version: 3
katalog_nr: D.39
titel:
  de: Minijob-Grenze beachten
kurz:
  de: 'Minijobber dürfen im Monat nicht mehr als die Minijob-Grenze verdienen: 603 € (2026), 633 € (2027).'
erklaerung:
  de: Die Minijob-Grenze ist an den Mindestlohn gekoppelt. Amtlos führt die Werte mit Gültigkeitszeitraum.
rechtsgrundlage:
- § 8 SGB IV
kategorie: personal
