wiederholung:
  art: einmalig
stelle:
  de: Minijob-Zentrale
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Übersteigt das Arbeitsentgelt regelmäßig die Geringfügigkeitsgrenze, ist die Beschäftigung nicht mehr geringfügig (§ 8 Abs. 1 Nr. 1 SGB IV); dann gelten die allgemeinen Regeln der Sozialversicherung. Unschädlich ist nur ein unvorhersehbares Überschreiten in höchstens zwei Kalendermonaten innerhalb eines Zeitjahres um höchstens den Betrag der Geringfügigkeitsgrenze (§ 8 Abs. 1b SGB IV).'
