# Katalog B.22 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Programme, Matching-Kriterien und Fristen je Land als Daten pflegen (Freigabe Weber 22.10.2026: keine rechtliche Anmerkung)
schema_version: 1
id: gesellschaft.foerderprogramme
version: 3
katalog_nr: B.22
titel:
  de: Förderprogramme prüfen (Option)
kurz:
  de: Für Gründungen gibt es Förderprogramme – etwa den Gründungszuschuss der Arbeitsagentur, Gründungskredite der KfW und der Förderbanken
    der Länder und geförderte Gründungsberatung; für Startups mit Kapitalgesellschaft auch EXIST und INVEST.
erklaerung:
  de: Welche Programme passen, hängt von Rechtsform, Branche, Land und Vorhaben ab. Einen Überblick gibt die Förderdatenbank des
    Bundes; die IHK oder Handwerkskammer berät kostenlos. Fristen und Antragsunterlagen hängen vom Programm ab – viele Programme
    musst du vor dem Start beantragen.
rechtsgrundlage:
- Förderrichtlinien des Bundes und der Länder
kategorie: gesellschaft
ausloeser:
  # R11 (Nutzertest Tischlerei #20): für bestehende Betriebe nicht mehr – nur bei Gründung, im Gründungsjahr und im Jahr danach
  any:
  - feld: abgeleitet.ist_gruendungsjahr
    op: ==
    wert: true
    label:
      de: Du hast dein Unternehmen in diesem Jahr gegründet.
  - feld: abgeleitet.ist_vorjahr_gruendungsjahr
    op: ==
    wert: true
    label:
      de: Du hast dein Unternehmen im Vorjahr gegründet.
  - feld: abgeleitet.noch_nicht_gestartet
    op: ==
    wert: true
    label:
      de: Du gründest gerade.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Fördergeber (z. B. BMWE, KfW, Länder)
kanal: portal
kosten: null
sanktion:
  text:
    de: Keine Pflicht.
  schwere: niedrig
automatisierung: hinweis
einordnung: option
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
