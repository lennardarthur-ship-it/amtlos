# Beispiel aus Spezifikation 3.2 / Katalog E.50, in das Schema v1 überführt.
schema_version: 1
id: arbeitsschutz.gefaehrdungsbeurteilung
version: 8
katalog_nr: E.50
titel:
  de: Gefährdungsbeurteilung erstellen
kurz:
  de: Bevor jemand bei dir arbeitet, schreibst du auf, welche Gefahren es an den Arbeitsplätzen gibt und was du dagegen tust.
erklaerung:
  de: >-
    Sobald du mindestens eine Person beschäftigst, sind die Gefährdungen an jedem
    Arbeitsplatz zu beurteilen, Schutzmaßnahmen festzulegen und das zu dokumentieren (§§ 5, 6 ArbSchG).
    Amtlos gibt dir dafür eine Vorlage mit Gefährdungen und Maßnahmen, die typisch für Betriebe wie deinen sind –
    welche davon an deinen Arbeitsplätzen zutreffen und was dort zusätzlich nötig ist, beurteilst du selbst. Überprüfe die Beurteilung bei Änderungen der
    Arbeitsstätte oder der Tätigkeiten, bei neuen Arbeitsmitteln oder Arbeitsstoffen, nach Unfällen und Beinaheunfällen, bei
    Berufskrankheiten oder Gesundheitsbeschwerden, nach Ergebnissen der arbeitsmedizinischen Vorsorge, bei neuen
    Vorschriften oder Erkenntnissen und wenn du Jugendliche beschäftigst oder eine Beschäftigte dir ihre
    Schwangerschaft mitteilt.
begriffe:
  - begriff: { de: Gefährdungsbeurteilung }
    erklaerung: { de: "Eine schriftliche Liste, welche Gefahren es bei der Arbeit gibt und wie du sie verringerst." }
rechtsgrundlage: ["§ 5 ArbSchG", "§ 6 ArbSchG"]
kategorie: arbeitsschutz
branchen: [handwerk, bau, beauty_kosmetik, gastronomie_lebensmittel]
ausloeser:
  all:
    - feld: profil.beschaeftigte.gesamt
      op: ">="
      wert: 1
      label: { de: Du beschäftigst mindestens eine Person. }
frist:
  typ: relativ
  bezug: { ereignis: erste_einstellung }
  versatz: P0D
  zeitpunkt: vor_beginn
  verschiebung: { regel: keine, kalender: bundeseinheitlich }
  erinnerung: [P14D, P3D]
wiederholung:
  art: bei_aenderung
  neu_ausloesen_bei:
    - ereignis: neuer_arbeitsplatz
    - ereignis: neue_taetigkeit
    - ereignis: arbeitsunfall
    - ereignis: schwangerschaft_mitgeteilt
stelle:
  de: Arbeitgeber selbst; Kontrolle durch Berufsgenossenschaft und Gewerbeaufsicht
kanal: intern_dokumentieren
kosten: null
sanktion:
  text: { de: "Fehlt die Dokumentation oder ist sie unrichtig, unvollständig oder nicht rechtzeitig erstellt, droht direkt ein Bußgeld bis 5.000 € (§ 9 Abs. 1 Nr. 1 ArbStättV in Verbindung mit § 25 Abs. 1 Nr. 1 ArbSchG; ebenso § 22 Abs. 1 Nr. 1, 6 BetrSichV); bei Gefahrstoffen bis 50.000 € (§ 22 Abs. 1 Nr. 1a GefStoffV in Verbindung mit § 26 Abs. 1 Nr. 8 Buchst. b, Abs. 3 ChemG). Bei Arbeitsunfällen besteht außerdem ein Haftungsrisiko." }
  schwere: hoch
automatisierung: dokument_generator
dokumente: [vorlage.gefaehrdungsbeurteilung.<branche>]
aktion: { art: dokument, ziel: vorlage.gefaehrdungsbeurteilung, nachweis_erforderlich: true }
status_recht: in_kraft
gueltig_ab: "1996-08-21"
gueltig_bis: null
quellen:
  - titel: Arbeitsschutzgesetz § 5
    url: https://www.gesetze-im-internet.de/arbschg/__5.html
    abgerufen: null
  - titel: Arbeitsschutzgesetz § 6
    url: https://www.gesetze-im-internet.de/arbschg/__6.html
    abgerufen: null
  - titel: Betriebssicherheitsverordnung (§ 22)
    url: https://www.gesetze-im-internet.de/betrsichv_2015/BJNR004910015.html
    abgerufen: '2026-10-22'
  - titel: Gefahrstoffverordnung § 22
    url: https://www.gesetze-im-internet.de/gefstoffv_2010/__22.html
    abgerufen: '2026-10-22'
  - titel: Chemikaliengesetz § 26
    url: https://www.gesetze-im-internet.de/chemg/__26.html
    abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- 'RDG-Prüfpunkt (Vorprüfung 21.10.2026, Abschnitt 7) erledigt – RA Dr. Weber (Antwort auf die Rechtsfrage aus der Sifa-Prüfung, Rückmeldung Runde 2): Formulierung als Information statt Vorwegnahme in Ordnung; die Pflicht (§§ 5, 6 ArbSchG) darf als geltendes Recht benannt werden, nur die konkreten Gefährdungen und Maßnahmen für den einzelnen Betrieb bleiben Vorschlag („typisch für Betriebe wie deinen“); arbeitsschutzfachliche Hinweise sind keine Rechtsdienstleistung (§ 2 RDG). Erklärung entsprechend gefasst (Vorlage als Vorschlag statt „passend zu deiner Branche“)'
pruefung: { status: entwurf, geprueft_von: null, geprueft_am: null }
