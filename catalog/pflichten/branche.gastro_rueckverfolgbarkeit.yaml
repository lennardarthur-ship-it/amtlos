fachlich_zu_pruefen:
- 'Neu (E-166): Art. 18 Abs. 2 und 3 am Wortlaut geprüft (gesetze.legal); Geltung ab 1.1.2005 (Art. 65 VO (EG) Nr. 178/2002) an EUR-Lex gegenlesen'
- 'Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Frage 14, ✔): Text und Auslöser richtig; DVO (EU) Nr. 931/2011 als Hinweis so belassen; auch bei Onlinehändlern mit Lebensmitteln auslösen (Branche Onlinehandel und „Was verkaufst du?“ Lebensmittel) und Rückruf-Satz nach Art. 19 VO (EG) Nr. 178/2002 ergänzt – umgesetzt, Bericht noch nicht unterschrieben'
- 'Lebensmittel ohne Branche Gastronomie oder Onlinehandel (z. B. Kiosk mit „Sonstige“) lösen den Eintrag weiter nicht aus'
- Folgen bei Nichterfüllung (Bußgeld nach LFGB bzw. Lebensmittelrechtlicher Straf- und Bußgeldverordnung) nicht geprüft – Sanktion fachlich ergänzen
