fachlich_zu_pruefen:
- 'Neu (E-166): Art. 18 Abs. 2 und 3 am Wortlaut geprüft (gesetze.legal); Geltung ab 1.1.2005 (Art. 65 VO (EG) Nr. 178/2002) an EUR-Lex gegenlesen'
- 'Rückmeldung Lebensmittel (Tim Baum, 22.10.2026, freigegeben): fachlich richtig; Fundstellen der Folgen plausibel'
- 'Lebensmittel ohne Branche Gastronomie oder Onlinehandel (z. B. Kiosk mit „Sonstige“) lösen den Eintrag weiter nicht aus – laut T. Baum hinnehmbar; besser wäre ein Auslöser „Was verkaufst du? Lebensmittel“ unabhängig von der Branche (die Frage wird nicht im Kern-Check gestellt, als alleiniger Auslöser stünde der Eintrag bei allen Betrieben ohne diese Angabe offen – nicht umgesetzt)'
- 'DVO (EU) Nr. 931/2011 zusätzlich nach § 9 LMRStV bußgeldbewehrt (Tatbestände nicht gelesen)'
- 'RA Dr. Weber Runde 3 (23.10.2026), Folgen freigegeben: § 60 Abs. 3 Nr. 1 Buchst. b, c (Art. 18) und Buchst. d–g (Art. 19) i. V. m. Abs. 5 LFGB, bis 50.000 € – bestätigt'
