# E-166 (Prüfmappe Lebensmittelhygiene, Frage 14): Rückverfolgbarkeit nach Art. 18 VO (EG) Nr. 178/2002
schema_version: 1
id: branche.gastro_rueckverfolgbarkeit
version: 2
katalog_nr: H.1
titel:
  de: Rückverfolgbarkeit sicherstellen
kurz:
  de: Du kannst jederzeit sagen, von wem du Lebensmittel und Zutaten bekommen hast – und an welche Unternehmen du selbst lieferst. Geordnet aufbewahrte Lieferscheine und Rechnungen sind der einfachste Weg.
erklaerung:
  de: >-
    Lebensmittelunternehmer müssen jede Person feststellen können, von der sie ein Lebensmittel oder einen Stoff erhalten
    haben, der in ein Lebensmittel verarbeitet werden soll – eine Stufe zurück (Art. 18 Abs. 2 VO (EG) Nr. 178/2002).
    Ebenso müssen sie die anderen Unternehmen feststellen können, an die sie ihre Erzeugnisse geliefert haben – eine
    Stufe vor (Art. 18 Abs. 3). Gäste und Laufkundschaft gehören nicht dazu; wohl aber zum Beispiel ein Café, das du
    mit Kuchen belieferst, oder Firmen, für die du ein Catering machst. Die Angaben teilst du der Lebensmittelüberwachung
    auf Aufforderung mit. In der Praxis heißt das: Lieferant, Ware, Menge und Datum aus Lieferschein oder Rechnung
    geordnet aufbewahren, bei Lieferungen an andere Betriebe ebenso Abnehmer, Ware und Datum. Für Lebensmittel
    tierischen Ursprungs gibt es zusätzliche Vorgaben (Durchführungsverordnung (EU) Nr. 931/2011). Bei Verdacht auf
    unsichere Ware: Ware sperren, Lebensmittelüberwachung informieren (Art. 19 VO (EG) Nr. 178/2002).
rechtsgrundlage:
- Art. 18 Verordnung (EG) Nr. 178/2002
- Art. 19 Verordnung (EG) Nr. 178/2002
- Durchführungsverordnung (EU) Nr. 931/2011
