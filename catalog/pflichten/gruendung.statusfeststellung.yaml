# Katalog A.12 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gruendung.statusfeststellung
version: 3
katalog_nr: A.12
titel:
  de: Statusfeststellung erwägen (Scheinselbstständigkeit)
kurz:
  de: Wenn du nur einen Auftraggeber hast, kannst du bei der Clearingstelle der Rentenversicherung klären lassen, ob du wirklich
    selbstständig bist.
erklaerung:
  de: 'Die Statusfeststellung ist eine Möglichkeit, keine Pflicht. Sie schafft Sicherheit, wenn das Risiko der Scheinselbstständigkeit besteht. Für eine Beschäftigung sprechen vor allem Weisungsgebundenheit, die Eingliederung in die Arbeitsorganisation des Auftraggebers, fehlendes Unternehmerrisiko und nur ein Auftraggeber (§ 7 Abs. 1 S. 2 SGB IV und Rechtsprechung des Bundessozialgerichts).'
begriffe:
- begriff:
    de: Scheinselbstständigkeit
  erklaerung:
    de: Wenn jemand formal selbstständig ist, tatsächlich aber wie ein Angestellter arbeitet.
rechtsgrundlage:
- § 7a SGB IV
- § 7 Abs. 1 SGB IV
kategorie: gruendung
ausloeser:
  feld: profil.rentenversicherung.pflichtgruppe
  op: enthaelt
  wert: ein_auftraggeber
  label:
    de: Du arbeitest überwiegend für einen Auftraggeber.
phase: gruendung
frist:
