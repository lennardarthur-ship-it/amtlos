# Katalog F.62 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.videoueberwachung
version: 4
katalog_nr: F.62
titel:
  de: Videoüberwachung kennzeichnen und begründen
kurz:
  de: Wenn du Videoüberwachung einsetzt, machst du sie erkennbar und dokumentierst den Zweck.
erklaerung:
  de: Videoüberwachung braucht einen berechtigten Zweck, muss erkennbar sein (Hinweisschild) und gehört ins Verzeichnis der
    Verarbeitungstätigkeiten. Rechtsgrundlage ist für Unternehmen das berechtigte Interesse (Art. 6 Abs. 1 lit. f DSGVO) – du wägst es
    gegen die Interessen der Gefilmten ab und hältst das fest. Das Hinweisschild nennt nach Art. 13 DSGVO mindestens dich als Verantwortlichen,
    den Zweck und wo die weiteren Informationen stehen. Die Aufnahmen löschst du in der Regel nach 48 bis 72 Stunden (Orientierungshilfe
    der Datenschutzkonferenz). Deine Beschäftigten informierst du ebenfalls nach Art. 13 DSGVO; gibt es einen Betriebsrat, bestimmt er
    mit (§ 87 Abs. 1 Nr. 6 BetrVG).
rechtsgrundlage:
- Art. 6 Abs. 1 lit. f DSGVO
- Art. 13 DSGVO
- § 87 Abs. 1 Nr. 6 BetrVG
kategorie: datenschutz
ausloeser:
