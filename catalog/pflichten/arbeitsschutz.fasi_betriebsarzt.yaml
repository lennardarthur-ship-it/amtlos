# Katalog E.52 · Startbestand aus Spezifikation Abschnitt 4 (E-054); Prüfergebnis Sifa 22.10.2026 (C Katalog E.52, Frage 13) eingearbeitet
schema_version: 1
id: arbeitsschutz.fasi_betriebsarzt
version: 3
katalog_nr: E.52
titel:
  de: Fachkraft für Arbeitssicherheit und Betriebsarzt
kurz:
  de: Ab der ersten beschäftigten Person brauchst du eine sicherheitstechnische und betriebsärztliche Betreuung – als Regelbetreuung oder, in kleineren Betrieben, im Unternehmermodell deiner BG.
erklaerung:
  de: 'Ab der ersten beschäftigten Person verlangen das Arbeitssicherheitsgesetz und die DGUV Vorschrift 2 eine Betreuung durch eine Fachkraft für Arbeitssicherheit und einen Betriebsarzt. Du hast die Wahl: Regelbetreuung – bei bis zu 10 Beschäftigten nach Anlage 1 der DGUV Vorschrift 2 mit Grundbetreuung und anlassbezogener Betreuung, per Vertrag mit einer Fachkraft für Arbeitssicherheit und einem Betriebsarzt oder einem überbetrieblichen Dienst – oder, je nach BG, die alternative bedarfsorientierte Betreuung (Unternehmermodell, meist bis 50 Beschäftigte; die BGN etwa für mehr als 10 bis 50 Beschäftigte, darunter ein Kompetenzzentren-Modell). Im Unternehmermodell nimmst du selbst an Schulungen der BG teil und holst dir bei Bedarf anlassbezogen Fachleute dazu. Bist du noch nicht betreut, wähle die Regelbetreuung oder melde dich bei deiner BG zum Unternehmermodell an – bis dahin fehlt dir die fachliche Beratung zur Gefährdungsbeurteilung. Ein Gesetzesantrag (BR-Drs. 735/25) zur Schwelle von 50 Beschäftigten ist nicht in Kraft.'
