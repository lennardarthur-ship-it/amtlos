katalog_nr: B.21
titel:
  de: Investitionsprüfung in sensiblen Sektoren beachten
kurz:
  de: Wenn ausländische Investoren in ein Unternehmen in einem sensiblen Sektor einsteigen, kann eine Investitionsprüfung
    nötig sein.
erklaerung:
  de: 'Bei Beteiligungen ausländischer Investoren an Unternehmen in sensiblen Sektoren kann der Staat die Investition prüfen. Welche Sektoren sensibel sind und ab welchem Anteil an den Stimmrechten (je nach Sektor 10 %, 20 % oder 25 %) geprüft wird, regelt die Außenwirtschaftsverordnung (§ 55a AWV). Amtlos gibt hier nur einen allgemeinen Hinweis.'
