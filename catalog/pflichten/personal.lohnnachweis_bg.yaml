katalog_nr: D.40
titel:
  de: Lohnnachweis an die Berufsgenossenschaft
kurz:
  de: Einmal im Jahr meldest du der Berufsgenossenschaft die Arbeitsentgelte des Vorjahres – meist über das Lohnprogramm.
erklaerung:
  de: Die Berufsgenossenschaft berechnet ihren Beitrag aus den Arbeitsentgelten. Dafür übermittelst du nach Ablauf jedes Kalenderjahres
    den digitalen Lohnnachweis (§ 99 SGB VII), in der Regel über das Lohnprogramm oder deine Steuerberatung.
