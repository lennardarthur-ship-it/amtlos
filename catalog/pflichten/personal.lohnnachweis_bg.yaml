fachlich_zu_pruefen:
- 'Neu nach Nutzertest R11 (Tischlerei; der Bericht nennt § 99 SGB IV, richtig SGB VII) – Termin 16.02. des Folgejahres aus dem DGUV-Verfahren, bestätigen; Abgrenzung zur UV-Jahresmeldung (§ 28a Abs. 2a SGB IV)'
