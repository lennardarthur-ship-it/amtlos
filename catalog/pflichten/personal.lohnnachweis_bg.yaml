# R11 (Nutzertest Tischlerei Befund 16): digitaler Lohnnachweis an die Unfallversicherung (§ 165 Abs. 1 SGB VII i. V. m. § 99 SGB IV)
schema_version: 1
id: personal.lohnnachweis_bg
version: 4
katalog_nr: D.40
titel:
  de: Lohnnachweis an die Berufsgenossenschaft
kurz:
  de: Einmal im Jahr meldest du der Berufsgenossenschaft die Arbeitsentgelte des Vorjahres – meist über das Lohnprogramm.
erklaerung:
  de: Die Berufsgenossenschaft berechnet ihren Beitrag aus den Arbeitsentgelten. Dafür übermittelst du nach Ablauf jedes Kalenderjahres
    bis zum 16. Februar des Folgejahres den digitalen Lohnnachweis (§ 165 Abs. 1 SGB VII in Verbindung mit § 99 SGB IV), in der Regel über das Lohnprogramm oder deine Steuerberatung. Die Jahresmeldung zur Unfallversicherung je beschäftigter Person ist eine eigene Meldung.
rechtsgrundlage:
- § 165 Abs. 1 SGB VII
- § 99 SGB IV
