# Katalog C.24. Zeigt: Rhythmus abhängig von Fakten, Regelwerte, Dauerfristverlängerung. StB-Durchsicht Busch 22.10.2026 umgesetzt.
schema_version: 1
id: steuern.ust_voranmeldung
version: 6
katalog_nr: C.24
titel:
  de: Umsatzsteuer-Voranmeldung abgeben
kurz:
  de: Du meldest dem Finanzamt regelmäßig, wie viel Umsatzsteuer du eingenommen und gezahlt hast, und überweist die Differenz.
erklaerung:
  de: >-
    Wer Umsatzsteuer auf Rechnungen ausweist, gibt je nach Höhe der Steuer im Vorjahr
    monatlich oder vierteljährlich eine Voranmeldung über ELSTER ab. Liegt dein Umsatz über
    der Kleinunternehmergrenze, gilt die Pflicht sicher – offen ist dann nur, ob monatlich
    oder vierteljährlich. Den Rhythmus legt das Finanzamt fest – er steht im Schreiben des Finanzamts.
    Weißt du ihn nicht und kennt Amtlos die Steuer des Vorjahres nicht, rechnet Amtlos
    vorläufig mit vierteljährlich. Hast du 2026 oder später gegründet, gibst du ab 2027 im
    Gründungsjahr und im Folgejahr monatlich ab (§ 18 Abs. 2 Satz 4 UStG). Amtlos bereitet
    die Zahlen vor; du übermittelst selbst.
rechtsgrundlage: ["§ 18 UStG"]
kategorie: steuern
ausloeser:
  all:
    - feld: profil.ust.kleinunternehmer
      op: "=="
      wert: false
      label: { de: Du nutzt die Kleinunternehmerregelung nicht. }
    # R10: „keine“ = das Finanzamt hat von der Voranmeldung befreit; ohne Angabe gilt die Bedingung
    - not:
        all:
          - { feld: profil.ust.voranmeldung_rhythmus, op: vorhanden }
          - { feld: profil.ust.voranmeldung_rhythmus, op: "==", wert: keine }
    - any:
        - all:
            - { feld: profil.ust.voranmeldung_rhythmus, op: vorhanden }
            - feld: profil.ust.voranmeldung_rhythmus
              op: in
              wert: [monatlich, quartalsweise]
              label: { de: Du gibst die Voranmeldung regelmäßig ab. }
        # R10: ohne bekannte Steuer des Vorjahres gilt die Pflicht über der Kleinunternehmergrenze sicher, nur der Rhythmus ist offen
        - all:
            - { feld: profil.ust.zahllast_vorjahr, op: nicht_vorhanden }
            - any:
                - feld: profil.umsatz.vorjahr
                  op: ">"
                  wert: { regelwert: steuern.ustg19.grenze_vorjahr }
                  label: { de: Dein Umsatz im Vorjahr lag über der Kleinunternehmergrenze. }
                - feld: profil.umsatz.prognose_laufendes_jahr
                  op: ">"
                  wert: { regelwert: steuern.ustg19.grenze_laufendes_jahr }
                  label: { de: Dein erwarteter Umsatz in diesem Jahr liegt über der Kleinunternehmergrenze. }
        - feld: profil.ust.zahllast_vorjahr
          op: ">"
          wert: { regelwert: steuern.ust_va.grenze_befreiung }
          label: { de: Deine Umsatzsteuer im Vorjahr lag über der Grenze für eine Befreiung. }
        # R11 (Nutzertest Kosmetik #1): bis 2.000 € Vorjahressteuer kann das Finanzamt befreien (§ 18 Abs. 2 S. 3 UStG) – ohne
        # Befreiung (Rhythmus „keine“) bleibt die Pflicht; der Rhythmus folgt dann aus der Zahllast
        - feld: profil.ust.zahllast_vorjahr
          op: vorhanden
          label: { de: "Du hast im Vorjahr Umsatzsteuer angemeldet. Bei höchstens 2.000 € kann dich das Finanzamt von der Voranmeldung befreien – nur dann entfällt sie." }
        - feld: abgeleitet.ist_gruendungsjahr
          op: "=="
          wert: true
          label: { de: Du hast dein Unternehmen in diesem Jahr gegründet. }
        - feld: abgeleitet.ist_vorjahr_gruendungsjahr
          op: "=="
          wert: true
          label: { de: Du hast dein Unternehmen im Vorjahr gegründet. }
        # R11 (Nutzertest Tischlerei #1): ohne Kleinunternehmerregelung und ohne Befreiung gilt die Pflicht sicher (§ 18 Abs. 1 UStG) –
        # offen ist dann nur der Rhythmus
        - feld: profil.ust.kleinunternehmer
          op: "=="
          wert: false
          label: { de: "Ohne Kleinunternehmerregelung gibst du Voranmeldungen ab, solange das Finanzamt dich nicht befreit." }
frist:
  typ: wiederkehrend
  # R10: zuerst der angegebene Rhythmus; ohne Angabe (oder „weiß nicht“) nach der Zahllast des Vorjahres
  rhythmus:
    waehle:
      - wenn:
          any:
            - all:
                - { feld: profil.ust.voranmeldung_rhythmus, op: vorhanden }
                - { feld: profil.ust.voranmeldung_rhythmus, op: "==", wert: monatlich }
            - all:
                - any:
                    - { feld: profil.ust.voranmeldung_rhythmus, op: nicht_vorhanden }
                    - { feld: profil.ust.voranmeldung_rhythmus, op: "==", wert: unklar }
                - { feld: profil.ust.zahllast_vorjahr, op: vorhanden }
                - feld: profil.ust.zahllast_vorjahr
                  op: ">"
                  wert: { regelwert: steuern.ust_va.grenze_monatlich }
        dann: monatlich
      - wenn:
          any:
            - all:
                - { feld: profil.ust.voranmeldung_rhythmus, op: vorhanden }
                - { feld: profil.ust.voranmeldung_rhythmus, op: "==", wert: quartalsweise }
            - all:
                - any:
                    - { feld: profil.ust.voranmeldung_rhythmus, op: nicht_vorhanden }
                    - { feld: profil.ust.voranmeldung_rhythmus, op: "==", wert: unklar }
                - { feld: profil.ust.zahllast_vorjahr, op: vorhanden }
                - feld: profil.ust.zahllast_vorjahr
                  op: "<="
                  wert: { regelwert: steuern.ust_va.grenze_monatlich }
            # R12 (UX #3): „Weiß ich nicht“ ohne Steuer des Vorjahres ⇒ vorläufig vierteljährlich (mit Hinweis im Text)
            - all:
                - { feld: profil.ust.voranmeldung_rhythmus, op: vorhanden }
                - { feld: profil.ust.voranmeldung_rhythmus, op: "==", wert: unklar }
                - { feld: profil.ust.zahllast_vorjahr, op: nicht_vorhanden }
        dann: quartalsweise
      # ohne Angabe zum Rhythmus und ohne Steuer des Vorjahres bleibt der Rhythmus offen (Rückfrage)
      - wenn:
          feld: profil.ust.zahllast_vorjahr
          op: ">"
          wert: { regelwert: steuern.ust_va.grenze_monatlich }
        dann: monatlich
    sonst: quartalsweise
  faellig: { art: tag_nach_periodenende, monate_nach: 1, tag: 10 }
  verlaengerung:
    wenn: { feld: profil.ust.dauerfristverlaengerung, op: "==", wert: true }
    versatz: P1M
  verschiebung: { regel: naechster_werktag, kalender: bundesland }
  erinnerung: [P7D, P2D]
wiederholung: { art: periodisch }
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text: { de: 'Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben (§ 240 Abs. 1, 3 AO). Wer die Vorauszahlung nicht, nicht vollständig oder nicht rechtzeitig zahlt, riskiert außerdem ein Bußgeld bis 30.000 € (§ 26a Abs. 1, 3 UStG in Verbindung mit § 18 Abs. 1 Satz 4 UStG). Für eine verspätete Voranmeldung kann das Finanzamt einen Verspätungszuschlag festsetzen (§ 152 Abs. 1 AO). Gibst du keine Voranmeldung ab, kann das Finanzamt die Steuer schätzen (§ 162 AO); die Nichtabgabe kann als Steuerhinterziehung strafbar sein (§ 370 Abs. 1 Nr. 2 AO).' }
  # StB Busch 22.10.2026: „hoch“ – Bußgeld bis 30.000 €, Strafbarkeit, die Zahllast ist fremdes Geld
  schwere: hoch
automatisierung: formular_vorausfuellen
aenderungsnotiz:
  de: Die Folgen sind jetzt vollständig beschrieben (Schätzung, Strafbarkeit) und als „hoch“ eingestuft.
aktion: { art: uebermittlung, ziel: elster.ust_va, nachweis_erforderlich: true }
status_recht: in_kraft
