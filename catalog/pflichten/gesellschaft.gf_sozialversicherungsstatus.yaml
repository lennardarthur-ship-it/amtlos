# Katalog B.17 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.gf_sozialversicherungsstatus
version: 2
katalog_nr: B.17
titel:
  de: Sozialversicherungsstatus der Geschäftsführung klären
kurz:
  de: Kläre, ob Geschäftsführerinnen und Geschäftsführer sozialversicherungspflichtig sind – zum Beispiel mit einer Statusfeststellung.
erklaerung:
  de: 'Ob eine Geschäftsführerin oder ein Geschäftsführer sozialversicherungspflichtig beschäftigt ist, hängt vom Einzelfall ab. Für Selbstständigkeit spricht nach der Rechtsprechung des Bundessozialgerichts ein Anteil von mindestens 50 % oder eine Sperrminorität. Kläre den Status vor der ersten Entgeltabrechnung. Meldest du einen Gesellschafter-Geschäftsführer zur Sozialversicherung an, leitet die Einzugsstelle das Statusfeststellungsverfahren von Amts wegen ein (§ 7a Abs. 1 S. 2 SGB IV); Sicherheit schafft auch ein eigener Antrag bei der Deutschen Rentenversicherung.'
rechtsgrundlage:
