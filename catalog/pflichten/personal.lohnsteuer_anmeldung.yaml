# Katalog D.40 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.lohnsteuer_anmeldung
version: 6
katalog_nr: D.40
titel:
  de: Lohnsteuer anmelden
kurz:
  de: Bis zum 10. nach Ende des Anmeldezeitraums meldest du die Lohnsteuer beim Finanzamt an.
erklaerung:
  de: Der Anmeldezeitraum folgt aus der Lohnsteuer des Vorjahres (§ 41a Abs. 2 EStG) – über 5.000 € monatlich, über 1.080 € vierteljährlich,
    sonst jährlich. Im ersten Jahr zählt die aufs Jahr hochgerechnete Lohnsteuer des ersten vollen Monats. Trag den Zeitraum in deinem
    Profil ein; Amtlos berechnet daraus die Termine.
rechtsgrundlage:
- § 41a EStG
kategorie: personal
ausloeser:
  all:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - feld: profil.personal.lohnsteuer_anmeldezeitraum
    op: vorhanden
    label:
      de: Du hast deinen Anmeldezeitraum angegeben.
  # „keine“: nur Minijobs mit einheitlicher Pauschsteuer, die an die Minijob-Zentrale geht (§ 40a Abs. 2, 6 EStG)
  - feld: profil.personal.lohnsteuer_anmeldezeitraum
    op: '!='
    wert: keine
    label:
      de: Du meldest Lohnsteuer beim Finanzamt an.
frist:
  typ: wiederkehrend
  rhythmus:
    waehle:
    - wenn:
        feld: profil.personal.lohnsteuer_anmeldezeitraum
        op: ==
        wert: monatlich
      dann: monatlich
    - wenn:
        feld: profil.personal.lohnsteuer_anmeldezeitraum
        op: ==
        wert: quartalsweise
      dann: quartalsweise
    sonst: jaehrlich
  faellig:
    art: tag_nach_periodenende
    monate_nach: 1
    tag: 10
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
wiederholung:
  art: periodisch
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Gibst du die Lohnsteuer-Anmeldung nicht oder nicht fristgerecht ab, kann das Finanzamt einen Verspätungszuschlag festsetzen. Er richtet sich nach Dauer und Häufigkeit der Fristüberschreitung und der Höhe der Steuer und beträgt höchstens 25.000 € (§ 152 Abs. 1, 8, 10 AO).'
  schwere: hoch
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Einkommensteuergesetz § 41a
  url: https://www.gesetze-im-internet.de/estg/__41a.html
  abgerufen: null
- titel: 'Abgabenordnung § 152'
  url: https://www.gesetze-im-internet.de/ao_1977/__152.html
  abgerufen: '2026-10-22'
pruefung:
  status: freigegeben
  geprueft_von:
    - recht
  geprueft_am: '2026-10-23'
  geprueft_version: 6
  bestaetigt_am: '2026-10-23'
