# Katalog D.44 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.jugendarbeitsschutz
version: 2
katalog_nr: D.44
titel:
  de: Jugendarbeitsschutz beachten
kurz:
  de: Für Jugendliche gelten Erstuntersuchung, Arbeitszeitgrenzen und eine Aushangpflicht.
erklaerung:
  de: Wer Jugendliche beschäftigt, braucht vorab eine ärztliche Erstuntersuchung (§ 32 JArbSchG), muss besondere Arbeitszeitgrenzen
    einhalten und das Jugendarbeitsschutzgesetz aushängen. Gefährliche Arbeiten – etwa an Maschinen mit erhöhter Unfallgefahr oder mit
    Gefahrstoffen – sind nur eingeschränkt erlaubt (§ 22 JArbSchG); die Gefährdungsbeurteilung berücksichtigt Jugendliche eigens
    (§ 28a JArbSchG). Halbjährliche Unterweisung und Nachuntersuchung nach einem Jahr sind eigene Pflichten.
