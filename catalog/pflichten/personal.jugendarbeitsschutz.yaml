# Katalog D.44 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): weitere Ausnahmen (Gaststätten, mehrschichtige Betriebe) und Arbeitszeitgrenzen als Regelwerte
schema_version: 1
id: personal.jugendarbeitsschutz
version: 5
katalog_nr: D.44
titel:
  de: Jugendarbeitsschutz beachten
kurz:
  de: Für Jugendliche gelten Erstuntersuchung, Arbeitszeitgrenzen und eine Aushangpflicht.
erklaerung:
  de: Wer Jugendliche beschäftigt, braucht vorab eine ärztliche Erstuntersuchung (§ 32 JArbSchG), muss besondere Arbeitszeitgrenzen einhalten und das Jugendarbeitsschutzgesetz mit der Anschrift der Aufsichtsbehörde aushängen oder auslegen (§ 47 JArbSchG); ab drei Jugendlichen hängst du außerdem Beginn und Ende ihrer Arbeitszeit und Pausen aus (§ 48 JArbSchG). Jugendliche arbeiten nur zwischen 6 und 20 Uhr (§ 14 Abs. 1 JArbSchG); in Bäckereien und Konditoreien dürfen Jugendliche über 16 Jahre ab 5 Uhr arbeiten, Jugendliche über 17 Jahre in Bäckereien ab 4 Uhr (§ 14 Abs. 2 Nr. 4, Abs. 3 JArbSchG). Gefährliche Arbeiten – etwa an Maschinen mit erhöhter Unfallgefahr oder mit Gefahrstoffen – sind nur eingeschränkt erlaubt (§ 22 JArbSchG); die Gefährdungsbeurteilung berücksichtigt Jugendliche eigens (§ 28a JArbSchG). Halbjährliche Unterweisung und Nachuntersuchung nach einem Jahr sind eigene Pflichten.
