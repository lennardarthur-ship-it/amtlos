stelle:
  de: Du selbst; zugelassener Entsorger; untere Abfallbehörde
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn gefährliche Abfälle vermischt werden (§ 69 Abs. 1 Nr. 1, Abs. 3 KrWG), und bis 10.000 €, wenn Register oder Nachweise nicht richtig geführt, vorgelegt oder aufbewahrt werden (§ 69 Abs. 2 Nr. 8 bis 12, Abs. 3 KrWG).'
