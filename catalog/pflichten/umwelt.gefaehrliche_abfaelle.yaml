# R12 (Nutzertest Kfz #1): gefährliche Abfälle – Getrennthaltung, Entsorgung, Register
schema_version: 1
id: umwelt.gefaehrliche_abfaelle
version: 4
katalog_nr: U.2
titel:
  de: Gefährliche Abfälle getrennt halten, entsorgen und nachweisen
kurz:
  de: Altöl, Ölfilter, Bremsflüssigkeit, ölige Lappen und andere gefährliche Abfälle hältst du getrennt, gibst sie nur an zugelassene Entsorger und bewahrst die Nachweise auf.
erklaerung:
  de: Gefährliche Abfälle vermischst du nicht mit anderen Abfällen (§ 9a KrWG). Du übergibst sie einem dafür zugelassenen Entsorger und bewahrst die Belege auf, etwa Übernahmescheine oder Entsorgungsnachweise. Als Erzeuger gefährlicher Abfälle führst du ein Register über Art, Menge und Verbleib (§ 49 Abs. 3 KrWG); die Belege nach der Nachweisverordnung gehören dazu. Fallen bei dir im Jahr nicht mehr als 2 Tonnen gefährliche Abfälle an, entfällt das Nachweisverfahren (§ 2 Abs. 2 NachwV); du verwendest dann Übernahmescheine und bewahrst sie drei Jahre auf (§§ 12, 24 NachwV).
rechtsgrundlage:
- § 9a KrWG
- § 49 KrWG
- § 2 Abs. 2, §§ 12, 24 NachwV
kategorie: umwelt
branchen:
- handwerk
ausloeser:
  feld: profil.umwelt.taetigkeiten
  op: enthaelt
  wert: gefaehrliche_abfaelle
  label:
    de: In deinem Betrieb fallen gefährliche Abfälle an.
frist:
