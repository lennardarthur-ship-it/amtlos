# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.kleinunternehmerregelung
version: 3
katalog_nr: C.23
titel:
  de: Kleinunternehmergrenzen im Blick behalten
kurz:
  de: Als Kleinunternehmer darfst du bestimmte Umsatzgrenzen nicht überschreiten – sonst endet die Regelung.
erklaerung:
  de: 'Die Kleinunternehmerregelung gilt, wenn dein Umsatz im Vorjahr höchstens 25.000 € betrug und im laufenden Jahr 100.000
    € nicht übersteigt. Die 25.000 € beziehen sich also auf das Vorjahr: Liegt dein Umsatz in diesem Jahr über 25.000 €, aber
    höchstens bei 100.000 €, bleibst du dieses Jahr Kleinunternehmer – ab 1. Januar des nächsten Jahres gilt dann die Regelbesteuerung.
    Die 100.000 € sind die harte Grenze im laufenden Jahr: Ab dem Umsatz, mit dem du sie überschreitest, endet die Regelung sofort.
    Im Gründungsjahr gilt 25.000 € als harte Grenze für das laufende Jahr. Maßgeblich ist der Umsatz nach vereinnahmten Entgelten
    (netto, nach Zahlungseingang), nicht die Summe der Rechnungen nach Rechnungsdatum. Wer auf die Regelung verzichtet, ist fünf
    Jahre daran gebunden.'
