# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.kleinunternehmerregelung
version: 1
katalog_nr: C.23
titel:
  de: Kleinunternehmergrenzen im Blick behalten
kurz:
  de: Als Kleinunternehmer darfst du bestimmte Umsatzgrenzen nicht überschreiten – sonst endet die Regelung.
erklaerung:
  de: 'Die Kleinunternehmerregelung gilt, wenn dein Umsatz im Vorjahr höchstens 25.000 € betrug und im laufenden Jahr 100.000
    € nicht übersteigt. Im Gründungsjahr gilt 25.000 € für das laufende Jahr. Die Grenze ist hart: Ab dem Umsatz, der sie
    überschreitet, endet der Status. Wer auf die Regelung verzichtet, ist fünf Jahre daran gebunden.'
