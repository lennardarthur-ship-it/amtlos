kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 30.000 € für dich als Unternehmer, wenn du nicht dafür sorgst, dass deine Fahrer Lenkzeiten, Fahrtunterbrechungen und Ruhezeiten einhalten (§ 8a Abs. 1 Nr. 2, Abs. 4 FPersG); für Fahrer bis 5.000 € (§ 8a Abs. 2 Nr. 1, Abs. 4 FPersG). Verstöße beim Fahrtenschreiber ahndet § 8 FPersG in Verbindung mit der FPersV.'
  schwere: mittel
