# Katalog H.5 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.transport_lenkzeiten
version: 5
katalog_nr: H.5
titel:
  de: Lenk- und Ruhezeiten einhalten und mit dem Fahrtenschreiber aufzeichnen
kurz:
  de: Für Fahrzeuge über 3,5 t – grenzüberschreitend schon über 2,5 t – gelten die EU-Lenk- und Ruhezeiten; aufgezeichnet wird mit dem Fahrtenschreiber.
erklaerung:
  de: Die Lenk- und Ruhezeiten der Verordnung (EG) Nr. 561/2006 gelten für die Güterbeförderung mit Fahrzeugen über 3,5 t zulässiger Gesamtmasse (mit Anhänger). Seit dem 1.7.2026 gelten sie auch für Fahrzeuge über 2,5 t bis 3,5 t bei grenzüberschreitenden Fahrten und Kabotage; diese Fahrzeuge brauchen einen intelligenten Fahrtenschreiber der neuesten Generation. Die Daten der Fahrerkarte liest du spätestens alle 28 Tage aus, den Massenspeicher des Fahrtenschreibers spätestens alle 90 Tage, und bewahrst sie ein Jahr auf (§ 2a FPersV). Ausnahmen gibt es unter anderem für Werkverkehr bis 3,5 t (Art. 3 Buchst. ha VO (EG) Nr. 561/2006) und für Handwerker mit Fahrzeugen bis 7,5 t im Umkreis von 100 km, wenn das Fahren nicht ihre Haupttätigkeit ist (Art. 3 Buchst. aa VO (EG) Nr. 561/2006).
rechtsgrundlage:
- Verordnung (EG) Nr. 561/2006
- Verordnung (EU) Nr. 165/2014
- FPersG
- § 2a FPersV
kategorie: branche
branchen:
- transport_logistik
ausloeser:
  all:
  - feld: profil.fahrzeuge.anzahl
    op: '>='
    wert: 1
    label:
      de: Du nutzt Firmenfahrzeuge.
  - any:
    - feld: profil.fahrzeuge.gesamtmasse
      op: enthaelt
      wert: ueber_3_5t
      label:
        de: Mindestens ein Fahrzeug hat mehr als 3,5 t zulässige Gesamtmasse.
    - all:
      - feld: profil.fahrzeuge.ausland
        op: ==
        wert: true
        label:
          de: Ihr fahrt mit Waren auch ins Ausland.
      - feld: profil.fahrzeuge.gesamtmasse
        op: enthaelt_eines
        wert:
        - 2_5_bis_2_8t
        - 2_8_bis_3_5t
        label:
          de: Mindestens ein Fahrzeug hat mehr als 2,5 t zulässige Gesamtmasse.
# R12 (Nutzertest Kurier #2): nicht mehr für jede Transportfirma – nach Gesamtmasse und Auslandsfahrten (IHK München, Handzettel Kleinfahrzeuge 05/2026)
