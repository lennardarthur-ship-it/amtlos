# R12 (Rechtsprüfung Befund 6): Versicherungs-, Finanzanlagen- und Immobiliardarlehensvermittler – Vermittlerregister
schema_version: 1
id: gruendung.vermittlerregister
version: 1
katalog_nr: A.3
titel:
  de: Ins Vermittlerregister eintragen lassen
kurz:
  de: Als Versicherungs-, Finanzanlagen- oder Immobiliardarlehensvermittler lässt du dich nach der Erlaubnis ins Vermittlerregister eintragen und hältst die Angaben aktuell.
erklaerung:
  de: Wer eine Erlaubnis nach § 34d, § 34f, § 34h oder § 34i GewO hat, lässt sich unverzüglich nach Aufnahme der Tätigkeit in das Vermittlerregister eintragen, das die IHK führt (§ 11a GewO). Änderungen meldest du ebenfalls. Versicherungsvermittler bilden sich außerdem jedes Jahr weiter – das steht bei der Weiterbildungspflicht.
