# R12 (Rechtsprüfung Befund 6): Versicherungs-, Finanzanlagen- und Immobiliardarlehensvermittler – Vermittlerregister
schema_version: 1
id: gruendung.vermittlerregister
version: 4
katalog_nr: A.3
titel:
  de: Ins Vermittlerregister eintragen lassen
kurz:
  de: Als Versicherungsvermittler oder Versicherungsberater, Finanzanlagen- oder Immobiliardarlehensvermittler lässt du dich nach der Erlaubnis ins Vermittlerregister eintragen und hältst die Angaben aktuell.
erklaerung:
  de: Wer eine Erlaubnis nach § 34d, § 34f, § 34h oder § 34i GewO hat – als Versicherungsberater auch nach § 34e GewO (§ 34e Abs. 2 GewO) –, lässt sich unverzüglich nach Aufnahme der Tätigkeit in das Vermittlerregister eintragen, das die IHK führt (§ 11a GewO). Änderungen meldest du ebenfalls. Versicherungsvermittler bilden sich außerdem jedes Jahr weiter – das steht bei der Weiterbildungspflicht.
rechtsgrundlage:
- § 11a GewO
- § 34d Abs. 10 GewO
- § 34e Abs. 2 GewO
kategorie: gruendung
branchen:
- immobilien_finanzen
ausloeser:
  feld: profil.erlaubnis.gewo_paragraphen
  op: enthaelt_eines
  wert:
  - 34d
  - 34e
  - 34f
  - 34h
  - 34i
  label:
    de: Du hast eine Erlaubnis als Versicherungsvermittler oder Versicherungsberater, Finanzanlagen- oder Immobiliardarlehensvermittler.
phase: gruendung
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
