titel:
  de: Bei der Berufsgenossenschaft anmelden
kurz:
  de: Innerhalb einer Woche nach Gründung meldest du dein Unternehmen bei der zuständigen Berufsgenossenschaft an – auch ohne Mitarbeiter.
erklaerung:
  de: >-
    Die Berufsgenossenschaft ist die gesetzliche Unfallversicherung für Betriebe.
    Welche zuständig ist, hängt von deiner Branche ab. Ob du dich selbst als
    Unternehmer versichern musst, hängt ebenfalls von der Branche ab.
