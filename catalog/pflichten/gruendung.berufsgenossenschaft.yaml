# Katalog A.8
schema_version: 1
id: gruendung.berufsgenossenschaft
version: 4
katalog_nr: A.8
titel:
  de: Bei der Berufsgenossenschaft anmelden
kurz:
  de: Innerhalb einer Woche nach Beginn deiner Tätigkeit meldest du dein Unternehmen bei der zuständigen Berufsgenossenschaft an – auch ohne Mitarbeiter.
erklaerung:
  de: >-
    Die Berufsgenossenschaft ist die gesetzliche Unfallversicherung für Betriebe.
    Welche zuständig ist, hängt von deiner Branche ab. Ob du dich selbst als
    Unternehmer versichern musst, hängt ebenfalls von der Branche ab.
    Die Woche beginnt mit der Aufnahme der Tätigkeit, nicht mit der Gründung
    einer Gesellschaft (§ 192 Abs. 1 SGB VII). Anmelden muss sich jedes
    Unternehmen, unabhängig von Rechtsform und Beschäftigten – ausgenommen
    Unternehmen, für die eine Unfallkasse oder die Sozialversicherung für
    Landwirtschaft, Forsten und Gartenbau (SVLFG) zuständig ist.
begriffe:
  - begriff: { de: Berufsgenossenschaft }
    erklaerung: { de: Die Unfallversicherung für Arbeitsunfälle und Berufskrankheiten in deiner Branche. }
