    de: 'Bußgeld bis 100.000 €, wenn du Batterien bereitstellst, ohne deine Rücknahmepflichten zu erfüllen (§ 60 Abs. 1 Nr. 1 Buchst. b, Abs. 3 in Verbindung mit § 4 Abs. 2 BattDG) oder zurückgenommene Altbatterien keiner Organisation für Herstellerverantwortung überlässt (§ 60 Abs. 1 Nr. 6, Abs. 3 in Verbindung mit § 14 Abs. 3 Satz 1 BattDG); bis 10.000 €, wenn du eine Altbatterie nicht, nicht richtig oder nicht vollständig zurücknimmst (§ 60 Abs. 2 Nr. 26, Abs. 3 BattDG in Verbindung mit Art. 62 Abs. 1 VO (EU) 2023/1542).'
