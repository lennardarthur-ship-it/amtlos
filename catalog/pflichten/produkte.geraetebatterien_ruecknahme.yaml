# Prüfvermerk RA Dr. Weber 22.10.2026 (G.72): Vertreiberpflichten (Rücknahme von Gerätebatterien) als eigener Hinweis
# Wortlaut gelesen am 22.10.2026: § 14 BattDG, Art. 62 VO (EU) 2023/1542, § 4 Abs. 2 und § 60 BattDG
schema_version: 1
id: produkte.geraetebatterien_ruecknahme
version: 1
katalog_nr: G.72
titel:
  de: Altbatterien zurücknehmen, wenn du Gerätebatterien verkaufst
kurz:
  de: Verkaufst du Gerätebatterien oder Batterien für leichte Verkehrsmittel, nimmst du Altbatterien dieser Art von Endnutzern kostenlos zurück – auch ohne Neukauf.
erklaerung:
  de: 'Händler nehmen Geräte-Altbatterien und Altbatterien für leichte Verkehrsmittel (LV-Altbatterien, etwa aus E-Bikes und E-Scootern) vom Endnutzer im Geschäft oder in unmittelbarer Nähe unentgeltlich zurück – unabhängig von chemischer Zusammensetzung, Marke, Herkunft, Baugröße und Beschaffenheit und ohne dass ein Neukauf verlangt werden darf (Art. 62 Abs. 1 VO (EU) 2023/1542, § 14 Abs. 1 Satz 1 BattDG). Die Pflicht gilt für die Batteriekategorien, die du als Neubatterien führst oder geführt hast, und für die Mengen, die Endnutzer üblicherweise abgeben; Geräte mit eingebauten Altbatterien fallen nicht darunter – für sie gilt das Elektrogesetz (§ 14 Abs. 1 Satz 2 bis 4 BattDG). Verkaufst du im Fernabsatz, richtest du Rückgabemöglichkeiten in zumutbarer Entfernung zu deinen Kunden ein (§ 14 Abs. 2 BattDG, Art. 62 Abs. 4, 5 VO (EU) 2023/1542). Die zurückgenommenen Altbatterien überlässt du einer für die Batteriekategorie zugelassenen Organisation für Herstellerverantwortung (§ 14 Abs. 3 BattDG). Batterien bereitstellen darfst du nur, wenn Endnutzer Altbatterien bei dir zurückgeben können (§ 4 Abs. 2 BattDG).'
rechtsgrundlage:
- § 14 BattDG
- § 4 Abs. 2 BattDG
- Art. 62 Verordnung (EU) 2023/1542
