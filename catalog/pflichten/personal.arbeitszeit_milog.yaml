# Katalog D.42 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.arbeitszeit_milog
version: 4
katalog_nr: D.42
titel:
  de: Arbeitszeit nach § 17 MiLoG aufzeichnen
kurz:
  de: Für Minijobber und in den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz zeichnest du laufend Beginn, Ende und Dauer der Arbeitszeit auf.
erklaerung:
  de: § 17 MiLoG verlangt Aufzeichnungen für geringfügig Beschäftigte und für Beschäftigte in den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz
    (zum Beispiel Bau, Gaststätten und Hotels, Transport und Logistik, Gebäudereinigung, seit 2026 auch Friseur- und Kosmetikbetriebe).
    Aufzuzeichnen ist spätestens bis zum Ablauf
    des siebten Tages nach der Arbeitsleistung; die Aufzeichnungen bewahrst du zwei Jahre auf. Das ist eine laufende Pflicht – ein
    Arbeitszeitnachweis gilt für seinen Monat.
rechtsgrundlage:
- § 17 MiLoG
- § 2a SchwarzArbG
kategorie: personal
ausloeser:
  all:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - any:
    - feld: profil.personal.sofortmeldebranchen
      op: enthaelt_eines
      wert:
      - bau
      - gastronomie
      - personenbefoerderung
      - spedition_logistik
      - schausteller
      - gebaeudereinigung
      - messebau
      - fleischwirtschaft
      - prostitution
      - sicherheitsgewerbe
      - friseur
      - kosmetik
      - lieferdienste
      # Branchen nach § 2a SchwarzArbG (eigene Liste, auf die § 17 MiLoG verweist) – deckungsgleich mit § 28a Abs. 4 SGB IV (SchwarzArbMoDiG)
      label:
        de: Dein Betrieb gehört zu einer Branche nach § 2a Schwarzarbeitsbekämpfungsgesetz.
    - feld: profil.taetigkeit.branchen
      op: enthaelt_eines
      wert:
      - beauty_kosmetik
      - gebaeudereinigung
      label:
        de: Deine Branche (Gebäudereinigung, seit 2026 auch Friseur und Kosmetik) gehört zu den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz.
    # R11: Branche zuerst – „Warum für dich“ nennt dann die § 2a-Branche, nicht nur Minijobs (Nutzertest Gebäudereinigung)
    - feld: profil.beschaeftigte.minijob
      op: '>='
      wert: 1
      label:
        de: Du beschäftigst Minijobber.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch den Zoll
kanal: intern_dokumentieren
kosten: null
sanktion:
