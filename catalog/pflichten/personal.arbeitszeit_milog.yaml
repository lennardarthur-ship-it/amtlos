# Katalog D.42 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.arbeitszeit_milog
version: 2
katalog_nr: D.42
titel:
  de: Arbeitszeit nach § 17 MiLoG aufzeichnen
kurz:
  de: Für Minijobber und in den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz zeichnest du laufend Beginn, Ende und Dauer der Arbeitszeit auf.
erklaerung:
  de: § 17 MiLoG verlangt Aufzeichnungen für geringfügig Beschäftigte und für Beschäftigte in den Branchen nach § 2a Schwarzarbeitsbekämpfungsgesetz
    (zum Beispiel Bau, Gaststätten und Hotels, Transport und Logistik, Gebäudereinigung). Aufzuzeichnen ist spätestens bis zum Ablauf
    des siebten Tages nach der Arbeitsleistung; die Aufzeichnungen bewahrst du zwei Jahre auf. Das ist eine laufende Pflicht – ein
    Arbeitszeitnachweis gilt für seinen Monat.
rechtsgrundlage:
- § 17 MiLoG
- § 2a SchwarzArbG
kategorie: personal
ausloeser:
  all:
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
  - any:
    - feld: profil.beschaeftigte.minijob
      op: '>='
      wert: 1
      label:
        de: Du beschäftigst Minijobber.
    - feld: profil.personal.sofortmeldebranchen
      op: enthaelt_eines
      wert:
      - bau
      - gastronomie
      - personenbefoerderung
      - spedition_logistik
      - schausteller
      - forstwirtschaft
      - gebaeudereinigung
      - messebau
      - fleischwirtschaft
      - prostitution
      - sicherheitsgewerbe
      # Branchen nach § 2a SchwarzArbG (eigene Liste, auf die § 17 MiLoG verweist) – derzeit deckungsgleich mit § 28a Abs. 4 SGB IV
      label:
        de: Dein Betrieb gehört zu einer Branche nach § 2a Schwarzarbeitsbekämpfungsgesetz.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch den Zoll
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Bußgeld bis 30.000 € (§ 21 MiLoG).
  schwere: hoch
automatisierung: hinweis
erledigung:
  art: laufend
  zeitraum: monat
aenderungsnotiz:
  de: Die Aufzeichnung ist eine laufende Pflicht – ein Arbeitszeitnachweis erledigt sie nur für seinen Monat. Die Branchenliste ist vollständig.
aktion:
