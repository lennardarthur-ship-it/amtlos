katalog_nr: G.75
titel:
  de: Geldwäschegesetz bei hohen Bargeschäften
kurz:
  de: Als Güterhändler hast du bei Bargeschäften ab der Schwelle des Geldwäschegesetzes Sorgfaltspflichten.
erklaerung:
  de: Dazu gehören unter anderem die Identifizierung der Vertragspartner und ein Risikomanagement. Die Pflichten greifen bei
    Barzahlungen ab 10.000 € (§ 10 Abs. 6a GwG), beim Handel mit Edelmetallen schon ab 2.000 €. Als Verpflichteter registrierst du
    dich außerdem bei der Zentralstelle für Finanztransaktionsuntersuchungen (goAML), auch ohne Verdachtsfall (§ 45 Abs. 1 S. 2 GwG).
