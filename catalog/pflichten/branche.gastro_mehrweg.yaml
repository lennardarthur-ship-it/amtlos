# R11 (Rechtsprüfung T-114, Nutzertest Gründerin): Mehrweg-Angebotspflicht §§ 33, 34 VerpackG
schema_version: 1
id: branche.gastro_mehrweg
version: 1
katalog_nr: G.73
titel:
  de: Mehrweg zum Mitnehmen anbieten
kurz:
  de: Verkaufst du Essen oder Getränke zum Mitnehmen in Einwegverpackungen aus Kunststoff oder Einwegbechern, bietest du auch Mehrweg an.
erklaerung:
  de: Wer Speisen in Einwegkunststoffverpackungen oder Getränke in Einwegbechern erst beim Verkauf befüllt, muss sie auch in einer
    Mehrwegverpackung anbieten – nicht teurer und gut sichtbar mit einem Hinweis (§ 33 VerpackG). Ausgenommen sind kleine Betriebe
    mit höchstens fünf Beschäftigten und höchstens 80 m² Verkaufsfläche; sie müssen stattdessen auf Wunsch mitgebrachte Behälter der
    Kundschaft befüllen und darauf hinweisen (§ 34 VerpackG).
rechtsgrundlage:
- § 33 VerpackG
- § 34 VerpackG
