fachlich_zu_pruefen:
- 'Prüfvermerk RA Dr. Weber 22.10.2026: Ausnahme (höchstens fünf Beschäftigte UND höchstens 80 m²), Teilzeitzählung, Foodtruck- und Lieferflächen sowie Sanktion bestätigt und im Text'
- 'Prüfvermerk RA Dr. Weber 22.10.2026: „LUCID für Serviceverpackungen – Pflicht liegt beim Vorvertreiber, wenn er die Beteiligung übernimmt (§ 7 Abs. 2 VerpackDG)“ – nicht übernommen: § 7 Abs. 2 VerpackDG (am 22.10.2026 gelesen) lässt die Systembeteiligung und insoweit die Pflichten nach §§ 6, 9, 10 auf den Vorvertreiber übergehen, „der Hersteller nach Absatz 1 Satz 1 bleibt jedoch zusätzlich selbst zur Registrierung nach § 6 verpflichtet“ – Rückfrage an den Prüfer; Herstellereigenschaft nach EWKFondsG offen'
