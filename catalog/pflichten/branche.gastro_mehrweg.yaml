# R11 (Rechtsprüfung T-114, Nutzertest Gründerin): Mehrweg-Angebotspflicht, bis 11.8.2026 §§ 33, 34 VerpackG
# Rechtsstand 21.10.2026: seit 12.8.2026 §§ 60, 61 VerpackDG (BGBl. 2026 I Nr. 207), inhaltlich gleich
schema_version: 1
id: branche.gastro_mehrweg
version: 2
katalog_nr: G.73
titel:
  de: Mehrweg zum Mitnehmen anbieten
kurz:
  de: Verkaufst du Essen oder Getränke zum Mitnehmen in Einwegverpackungen aus Kunststoff oder Einwegbechern, bietest du auch Mehrweg an.
erklaerung:
  de: 'Wer Speisen in Einwegkunststoffverpackungen oder Getränke in Einwegbechern erst beim Verkauf befüllt, muss sie auch in einer Mehrwegverpackung anbieten – nicht teurer und gut sichtbar mit einem Hinweis (§ 60 VerpackDG). Ausgenommen sind kleine Betriebe mit höchstens fünf Beschäftigten und höchstens 80 m² Verkaufsfläche; sie müssen stattdessen auf Wunsch mitgebrachte Behälter der Kundschaft befüllen und darauf hinweisen (§ 61 VerpackDG). Seit 12.8.2026 steht die Pflicht im Verpackungsrecht-Durchführungsgesetz, das das Verpackungsgesetz abgelöst hat.'
