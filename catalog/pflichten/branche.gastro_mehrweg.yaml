fachlich_zu_pruefen:
- 'Prüfvermerk Rechtsanwalt 22.10.2026: Ausnahme (höchstens fünf Beschäftigte UND höchstens 80 m²), Teilzeitzählung, Foodtruck- und Lieferflächen sowie Sanktion bestätigt und im Text'
- 'Freigabe Rechtsanwalt Runde 2 (23.10.2026) (ändern): § 7 Abs. 2 VerpackDG – nur die Systembeteiligung geht auf den Vorvertreiber über, die Registrierung nach § 6 bleibt eigene Pflicht – bestätigt und in seiner Formulierung in die Erklärung übernommen. Verlangter eigener Hinweis „Herstellereigenschaft nach EWKFondsG: Abgabepflicht für Einwegkunststoff-Serviceverpackungen ab 1.1.2024 (§ 3 Nr. 3, § 7 EWKFondsG)“ NICHT angelegt: § 3 Nr. 3 EWKFondsG (Hersteller, ausdrücklich auch Befüller) am Wortlaut bestätigt (gesetze-im-internet.de, lxgesetze.de, 22.10.2026); § 7 EWKFondsG regelt aber die Registrierung der Hersteller beim Umweltbundesamt vor Aufnahme der Tätigkeit (gesetze.legal, 22.10.2026), die Abgabepflicht steht in § 12 („Abgabepflicht“, Inhaltsübersicht gesetze-im-internet.de), das Datum 1.1.2024 nicht in § 7 – Fundstelle mit dem Prüfer klären'
- 'Rechtsanwalt Runde 3 (23.10.2026), ändern: Fundstellen wie gelesen – § 3 Nr. 3 EWKFondsG (Hersteller, auch Befüller), § 7 (Registrierung beim Umweltbundesamt), § 12 (Abgabepflicht); 1.1.2024 ist das Inkrafttreten der Registrierungs- und Abgabepflicht, als Jahresangabe statt Paragrafenzitat. Umgesetzt: ein Satz mit diesen Fundstellen und „seit 2024“ in der Erklärung, Verweis auf den neuen Hinweis-Eintrag branche.gastro_einwegkunststofffonds'
