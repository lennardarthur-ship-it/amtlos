katalog_nr: D.43
titel:
  de: Schwangerschaft der Aufsichtsbehörde mitteilen
kurz:
  de: 'Teilt dir eine Beschäftigte ihre Schwangerschaft mit, informierst du unverzüglich die Aufsichtsbehörde.'
erklaerung:
  de: 'Die Mitteilung an die zuständige Aufsichtsbehörde ist Pflicht des Arbeitgebers und geht unverzüglich hinaus (§ 27 Abs. 1 S. 1 MuSchG). Zuständig ist die Arbeitsschutzbehörde bzw. Gewerbeaufsicht deines Landes, zum Beispiel in Baden-Württemberg das Regierungspräsidium, in Bayern das Gewerbeaufsichtsamt.'
