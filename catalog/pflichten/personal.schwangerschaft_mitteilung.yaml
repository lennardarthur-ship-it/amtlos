# Katalog D.43 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): zuständige Behörde je Land als Liste pflegen (Freigabe Rechtsanwalt 22.10.2026)
