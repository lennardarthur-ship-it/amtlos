# Prüfergebnis Sifa 22.10.2026 (C Katalog D.44 personal.jugend_nachuntersuchung): Erstuntersuchung § 32 JArbSchG als eigene Pflicht je Einstellung
# Beobachten: BR-Drs. 735/25 (NRW) will §§ 32, 33 JArbSchG ändern – nicht in Kraft
schema_version: 1
id: personal.jugend_erstuntersuchung
version: 2
katalog_nr: D.44
titel:
  de: Ärztliche Erstuntersuchung Jugendlicher vor Beginn
kurz:
  de: Stellst du Jugendliche ein, die ins Berufsleben eintreten, lässt du dir vor Beginn die Bescheinigung über die ärztliche Erstuntersuchung vorlegen.
erklaerung:
  de: 'Ein Jugendlicher, der in das Berufsleben eintritt, darf nur beschäftigt werden, wenn er innerhalb der letzten 14 Monate vor Beginn von einer Ärztin oder einem Arzt untersucht worden ist und dir die Bescheinigung darüber vorliegt (§ 32 Abs. 1 JArbSchG). Die Untersuchung ist für die Jugendlichen kostenlos; den Berechtigungsschein gibt es bei der Gemeinde. Amtlos legt die Aufgabe bei jeder Einstellung an, solange du Jugendliche beschäftigst – betrifft die Einstellung eine erwachsene Person oder war die jugendliche Person schon vorher beschäftigt, trifft sie nicht zu. Die erste Nachuntersuchung nach einem Jahr ist eine eigene Pflicht.'
