fachlich_zu_pruefen:
- 'Einzelunternehmen und Personengesellschaften nur bei Gewerbeertrag über 24.500 € (§ 25 Abs. 1 Nr. 1 GewStDV), sonst auf Aufforderung des Finanzamts oder zur Feststellung eines Verlusts – Gewinn als Näherung für den Gewerbeertrag (Hinzurechnungen nicht berücksichtigt); Nutzertests R11 Kosmetik und Gründerin, bestätigen'
- Fristen nach § 149 Abs. 2 und 3 AO ergänzt (E-129, Quelle Recherche 13.10.2026 über dejure.org und Finanzamt BW) – gegen amtliche Fassung prüfen
- Übergangsfristen Art. 97 § 36 EGAO (Veranlagungszeiträume bis 2024) sind nicht abgebildet – ab Veranlagungszeitraum 2025 gilt § 149 AO regulär
- Vorabanforderung nach § 149 Abs. 4 AO (frühere Frist im Einzelfall) und Fristverlängerung auf Antrag nicht abgebildet
- 'Verschiebung auf den nächsten Werktag nach § 108 Abs. 3 AO – Feiertagskalender des Bundeslands prüfen'
- Freibetrag (C.34) als Regelwert führen
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (Gewerbesteuererklärung als Erklärung zur Festsetzung des Steuermessbetrags nach § 152 Abs. 6 AO behandelt – bestätigen)'
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
