# Katalog C.27 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.gewst_erklaerung
version: 3
katalog_nr: C.27
titel:
  de: Gewerbesteuererklärung abgeben
kurz:
  de: Einmal im Jahr gibst du elektronisch die Gewerbesteuererklärung ab.
erklaerung:
  de: Die Gewerbesteuer hängt vom Hebesatz deiner Gemeinde ab. Einzelunternehmen und Personengesellschaften haben einen Freibetrag. Die Erklärung gibst du ohne Steuerberatung bis 31. Juli des Folgejahres ab, mit Steuerberatung bis Ende Februar des übernächsten Jahres (§ 149 AO).
begriffe:
- begriff:
    de: Hebesatz
  erklaerung:
    de: Ein Prozentsatz, den jede Gemeinde selbst festlegt und der die Höhe der Gewerbesteuer bestimmt.
rechtsgrundlage:
- GewStG
- § 149 AO
kategorie: steuern
ausloeser:
  any:
  # R11 (Nutzertest Kosmetik #6, Gründerin): Einzelunternehmen und Personengesellschaften nur über 24.500 € Gewerbeertrag
  # (§ 25 Abs. 1 Nr. 1 GewStDV) – Gewinn als Näherung; ohne Angabe „hängt ab“
  - all:
    - feld: abgeleitet.ist_gewerbe
      op: ==
      wert: true
      label:
        de: Deine Tätigkeit ist ein Gewerbe.
    - any:
      - feld: profil.gewinn.vorjahr
        op: '>'
        wert: 24500
        label:
          de: Dein Gewinn im Vorjahr lag über dem Freibetrag von 24.500 €.
      - feld: profil.gewinn.prognose_laufendes_jahr
        op: '>'
        wert: 24500
        label:
          de: Dein erwarteter Gewinn in diesem Jahr liegt über dem Freibetrag von 24.500 €.
  - feld: abgeleitet.ist_kapitalgesellschaft
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine Kapitalgesellschaft.
frist:
  typ: wiederkehrend
  rhythmus: jaehrlich
  # § 149 Abs. 2 AO: sieben Monate nach Ablauf des Kalenderjahres (31. Juli); beratene Fälle § 149 Abs. 3 AO: letzter
  # Tag im Februar des zweitfolgenden Jahres (31. Juli + 7 Monate, Monatsende-Regel); § 108 Abs. 3 AO: nächster Werktag
  faellig:
    art: tag_nach_periodenende
    monate_nach: 7
    tag: 31
  verlaengerung:
    wenn: { feld: profil.steuerberater, op: "==", wert: true }
    versatz: P7M
  verschiebung: { regel: naechster_werktag, kalender: bundesland }
  erinnerung: [P30D, P7D]
wiederholung:
  art: periodisch
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Gibst du die Erklärung zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen; wird sie nicht binnen 14 Monaten nach Ablauf des Kalenderjahres abgegeben, muss es das in der Regel. Er beträgt für jeden angefangenen Monat 25 €, höchstens 25.000 € (§ 152 Abs. 6, Abs. 10 AO). Die Abgabe kann das Finanzamt außerdem mit Zwangsgeld bis 25.000 € durchsetzen (§§ 328, 329 AO).'
  schwere: mittel
automatisierung: formular_vorausfuellen
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
