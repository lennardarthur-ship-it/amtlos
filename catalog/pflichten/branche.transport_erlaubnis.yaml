# Katalog H.5 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.transport_erlaubnis
version: 6
katalog_nr: H.5
titel:
  de: Erlaubnis oder Lizenz für den Güterkraftverkehr
kurz:
  de: Für gewerblichen Güterkraftverkehr mit Fahrzeugen über 3,5 t ist eine Erlaubnis oder Gemeinschaftslizenz vorgesehen, grenzüberschreitend schon über 2,5 t eine Gemeinschaftslizenz; Werkverkehr mit eigenen Gütern ist erlaubnisfrei. Ob sie für dich gilt, klärt die Erlaubnisbehörde.
erklaerung:
  de: Eine Erlaubnis nach dem Güterkraftverkehrsgesetz oder eine Gemeinschaftslizenz brauchst du für die gewerbliche Beförderung von Gütern mit Fahrzeugen, die einschließlich Anhänger mehr als 3,5 t zulässige Gesamtmasse haben (§§ 1, 3 GüKG). Für grenzüberschreitende Fahrten und Kabotage brauchst du eine Gemeinschaftslizenz – seit dem 21.5.2022 auch für Fahrzeuge über 2,5 t bis 3,5 t (Verordnung (EG) Nr. 1072/2009); seit 2022 wird die Gemeinschaftslizenz auch für den Inlandsverkehr erteilt. Werkverkehr, also die Beförderung eigener Güter mit eigenen Fahrzeugen für eigene Zwecke, ist erlaubnisfrei (§ 1 Abs. 2, 3 GüKG) – das betrifft etwa Handwerksbetriebe, Bäckereien und Händler. Für die Beförderung von Personen, etwa im Taxi- und Mietwagenverkehr, brauchst du unabhängig davon eine Genehmigung nach dem Personenbeförderungsgesetz – das ist eine eigene Pflicht.
rechtsgrundlage:
- §§ 1, 3 GüKG
- Verordnung (EG) Nr. 1072/2009
kategorie: branche
branchen:
- transport_logistik
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: transport_logistik
    label:
      de: Dein Betrieb gehört zu Transport und Logistik.
  # Prüfvermerk RA Dr. Weber 22.10.2026: Werkverkehr (nur eigene Güter) ist erlaubnisfrei – Angabe profil.fahrzeuge.befoerderung
  - feld: profil.fahrzeuge.befoerderung
    op: enthaelt
    wert: fremde_gueter
    label:
      de: Ihr befördert Güter für andere gegen Entgelt.
  - any:
    - feld: profil.fahrzeuge.gesamtmasse
      op: enthaelt
      wert: ueber_3_5t
      label:
        de: Mindestens ein Fahrzeug hat mehr als 3,5 t zulässige Gesamtmasse.
    - all:
      - feld: profil.fahrzeuge.ausland
        op: ==
        wert: true
        label:
          de: Ihr fahrt mit Waren auch ins Ausland.
      - feld: profil.fahrzeuge.gesamtmasse
        op: enthaelt_eines
        wert:
        - 2_5_bis_2_8t
        - 2_8_bis_3_5t
        label:
          de: Mindestens ein Fahrzeug hat mehr als 2,5 t zulässige Gesamtmasse.
# R12 (Nutzertest Kurier #3): Schwelle nach GüKG statt „in der Regel“ (IHK Berlin)
