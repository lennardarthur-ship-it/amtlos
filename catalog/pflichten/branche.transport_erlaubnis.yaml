- Personenbeförderung (Taxi, Mietwagen, PBefG) nur im Text – eigener Auslöser fehlt
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 3 Abs. 1 und § 19 Abs. 1 Nr. 1b, Abs. 2 Nr. 1, Abs. 7 GüKG gelesen; § 3 Abs. 1 GüKG verlangt inzwischen eine Gemeinschaftslizenz (keine „Erlaubnis“) – Titel, Kurztext und Erklärung prüfen; Folgen für die Personenbeförderung (PBefG) nicht ergänzt – fachlich zu bestätigen'
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
