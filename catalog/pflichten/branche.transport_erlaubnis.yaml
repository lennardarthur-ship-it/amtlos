# Katalog H.5 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.transport_erlaubnis
version: 4
katalog_nr: H.5
titel:
  de: Erlaubnis oder Lizenz für den Güterkraftverkehr
kurz:
  de: Für gewerblichen Güterkraftverkehr mit Fahrzeugen über 3,5 t ist eine Erlaubnis vorgesehen, grenzüberschreitend schon über 2,5 t eine Gemeinschaftslizenz. Ob sie für dich gilt, klärt die Erlaubnisbehörde.
erklaerung:
  de: Eine Erlaubnis nach dem Güterkraftverkehrsgesetz brauchst du für die gewerbliche Beförderung von Gütern mit Fahrzeugen, die einschließlich Anhänger mehr als 3,5 t zulässige Gesamtmasse haben (§§ 1, 3 GüKG). Für grenzüberschreitende Fahrten und Kabotage brauchst du eine Gemeinschaftslizenz – seit dem 21.5.2022 auch für Fahrzeuge über 2,5 t bis 3,5 t (Verordnung (EG) Nr. 1072/2009). Werkverkehr, also die Beförderung eigener Güter für eigene Zwecke, ist erlaubnisfrei (§ 1 Abs. 2, 3 GüKG). Für Taxi- und Mietwagenverkehr brauchst du unabhängig davon eine Genehmigung nach dem Personenbeförderungsgesetz.
rechtsgrundlage:
- §§ 1, 3 GüKG
- Verordnung (EG) Nr. 1072/2009
- PBefG
kategorie: branche
branchen:
- transport_logistik
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: transport_logistik
    label:
      de: Dein Betrieb gehört zu Transport und Logistik.
  - any:
    - feld: profil.fahrzeuge.gesamtmasse
      op: enthaelt
      wert: ueber_3_5t
      label:
        de: Mindestens ein Fahrzeug hat mehr als 3,5 t zulässige Gesamtmasse.
    - all:
      - feld: profil.fahrzeuge.ausland
        op: ==
        wert: true
        label:
          de: Ihr fahrt mit Waren auch ins Ausland.
      - feld: profil.fahrzeuge.gesamtmasse
        op: enthaelt_eines
        wert:
        - 2_5_bis_2_8t
        - 2_8_bis_3_5t
        label:
          de: Mindestens ein Fahrzeug hat mehr als 2,5 t zulässige Gesamtmasse.
