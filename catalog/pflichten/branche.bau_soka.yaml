# Katalog H.4 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.bau_soka
version: 3
katalog_nr: H.4
titel:
  de: Teilnahme an SOKA-BAU
kurz:
  de: Baubetriebe mit gewerblichen Beschäftigten nehmen an den Sozialkassenverfahren der Bauwirtschaft (SOKA-BAU) teil.
erklaerung:
  de: 'Die Sozialkassen regeln unter anderem Urlaub und Berufsbildung in der Bauwirtschaft. Erfasst ist dein Betrieb, wenn er arbeitszeitlich überwiegend bauliche Leistungen nach § 1 Abs. 2 VTV erbringt – prüfe das anhand der Arbeitszeit deiner Beschäftigten. Die Beiträge meldest du monatlich bis zum 15. des Folgemonats.'
rechtsgrundlage:
- Tarifverträge über das Sozialkassenverfahren (VTV)
- SokaSiG
kategorie: branche
branchen:
- bau
