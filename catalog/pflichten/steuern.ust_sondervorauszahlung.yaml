# Katalog C.24 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: steuern.ust_sondervorauszahlung
version: 4
katalog_nr: C.24
titel:
  de: Sondervorauszahlung zur Umsatzsteuer leisten
kurz:
  de: Wenn du die Voranmeldung monatlich abgibst und eine Dauerfristverlängerung hast, zahlst du einmal im Jahr eine Sondervorauszahlung
    von einem Elftel.
erklaerung:
  de: Bei monatlicher Abgabe mit Dauerfristverlängerung zahlst du bis zum 10. Februar eine Sondervorauszahlung von einem Elftel
    der Vorauszahlungen des Vorjahres. Sie wird in der Voranmeldung für Dezember angerechnet (Kennzahl 39).
rechtsgrundlage:
- § 18 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: false
    label:
      de: Du nutzt die Kleinunternehmerregelung nicht.
  - feld: profil.ust.dauerfristverlaengerung
    op: ==
    wert: true
    label:
      de: Du hast eine Dauerfristverlängerung.
  # R11 (Steuerprüfung 17): nur Monatszahler (§§ 46–48 UStDV) – Rhythmus „monatlich“ oder Vorjahressteuer über der Monatsgrenze
  - any:
    - feld: profil.ust.voranmeldung_rhythmus
      op: ==
      wert: monatlich
      label:
        de: Du gibst die Voranmeldung monatlich ab.
    - all:
      - not:
          all:
          - feld: profil.ust.voranmeldung_rhythmus
            op: vorhanden
          - feld: profil.ust.voranmeldung_rhythmus
            op: in
            wert:
            - quartalsweise
            - keine
      - feld: profil.ust.zahllast_vorjahr
        op: '>'
        wert:
          regelwert: steuern.ust_va.grenze_monatlich
        label:
          de: Deine Umsatzsteuer im Vorjahr lag über der Grenze für die monatliche Voranmeldung.
frist:
  typ: wiederkehrend
  rhythmus: keiner
  faellig:
    art: feste_termine
    termine:
    - 02-10
  verschiebung:
    regel: naechster_werktag
    kalender: bundesland
  erinnerung:
  - P14D
  - P3D
wiederholung:
  art: periodisch
stelle:
  de: Finanzamt
kanal: elster
kosten: null
sanktion:
  text:
    de: 'Zahlst du nicht rechtzeitig, fällt für jeden angefangenen Monat ein Säumniszuschlag von 1 % des auf 50 € abgerundeten rückständigen Betrags an; bei bis zu drei Tagen Verspätung wird er nicht erhoben (§ 240 Abs. 1, 3 AO). Hast du sie nicht oder nicht richtig berechnet, kann das Finanzamt sie festsetzen (§ 48 Abs. 3 UStDV).'
  schwere: mittel
automatisierung: formular_vorausfuellen
aenderungsnotiz:
  de: 'Termin ergänzt: jedes Jahr bis 10. Februar, ein Elftel der Vorauszahlungen des Vorjahres, angerechnet im Dezember.'
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Umsatzsteuergesetz § 18
  url: https://www.gesetze-im-internet.de/ustg_1980/__18.html
  abgerufen: null
- titel: § 240 AO (Säumniszuschläge), Wortlaut (gesetze.legal)
  url: https://gesetze.legal/bund/ao/240
  abgerufen: '2026-10-22'
- titel: § 48 UStDV, Wortlaut (lxgesetze.de)
  url: https://lxgesetze.de/ustdv/48
  abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- 'Termin 10.02. und 1/11 der Vorjahres-Vorauszahlungen ergänzt (R10, Steuerprüfung) – Verschiebung auf den nächsten Werktag bestätigen'
- 'Nur Monatszahler (§§ 46–48 UStDV, Steuerprüfung R11 Befund 17) – Auslöser über Rhythmus „monatlich“ oder Vorjahressteuer; Text zu Kz 39 in der App beim Steuer-Agenten'
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (§ 26a Abs. 1 UStG nennt die Sondervorauszahlung nicht; Widerruf der Dauerfristverlängerung in § 48 UStDV nicht geregelt)'
pruefung:
