katalog_nr: G.67
titel:
  de: Preise richtig angeben
kurz:
  de: Gegenüber Verbrauchern gibst du Gesamtpreise an, bei Waren nach Gewicht, Volumen oder Länge auch den Grundpreis.
erklaerung:
  de: 'Die Preisangabenverordnung regelt, wie Preise gegenüber Verbrauchern anzugeben sind (§§ 3, 4 PAngV). Den Grundpreis gibst du je 1 kg, 1 l, 1 m, 1 m² oder 1 m³ an (§ 5 PAngV); bei Waren bis 10 g oder 10 ml ist kein Grundpreis nötig.'
