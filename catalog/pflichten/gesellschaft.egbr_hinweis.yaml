# R12 (Rechtsprüfung Befund 18): MoPeG – Gesellschaftsregister für die GbR
schema_version: 1
id: gesellschaft.egbr_hinweis
version: 3
katalog_nr: B.16
titel:
  de: GbR ins Gesellschaftsregister eintragen? (eGbR)
kurz:
  de: Seit 2024 kann sich eine GbR ins Gesellschaftsregister eintragen lassen – nötig wird das, wenn sie etwa ein Grundstück erwerben oder sich an einer anderen Gesellschaft beteiligen will.
erklaerung:
  de: Seit dem 1.1.2024 gibt es das Gesellschaftsregister für die GbR (§ 707 BGB). Die Eintragung ist freiwillig. Faktisch nötig wird sie, wenn die GbR Rechte an Grundstücken erwerben (§ 47 Abs. 2 GBO) oder sich an einer anderen Gesellschaft beteiligen will, die in einem Register steht – etwa an einer GmbH (Gesellschafterliste, § 40 Abs. 1 S. 3 GmbHG), an einer Aktiengesellschaft (Aktienregister, § 67 AktG) oder an einer eingetragenen GbR (§ 707a Abs. 1 S. 2 BGB). Nach der Eintragung führt die Gesellschaft den Zusatz „eingetragene Gesellschaft bürgerlichen Rechts“ oder „eGbR“ (§ 707a Abs. 2 BGB) und meldet als eingetragene GbR ihre wirtschaftlich Berechtigten dem Transparenzregister (§ 20 Abs. 1 GwG).
rechtsgrundlage:
- § 707 BGB
- § 707a BGB
- § 47 Abs. 2 GBO
- § 40 Abs. 1 S. 3 GmbHG
- § 67 AktG
- § 20 Abs. 1 GwG
kategorie: gesellschaft
# Freigabe Weber 22.10.2026: eGbR über die Registerfrage (profil.gesellschaft.handelsregister, bei der GbR das Gesellschaftsregister) –
# für eine schon eingetragene GbR entfällt der Hinweis; ohne Angabe bleibt er stehen (freiwillige Eintragung)
ausloeser:
  all:
  - feld: profil.rechtsform
    op: ==
    wert: gbr
    label:
      de: Dein Unternehmen ist eine GbR.
  - any:
    - feld: profil.gesellschaft.handelsregister
      op: nicht_vorhanden
    - feld: profil.gesellschaft.handelsregister
      op: '!='
      wert: eingetragen
    label:
      de: Eure GbR steht noch nicht im Gesellschaftsregister.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Registergericht (über den Notar)
kanal: notar
kosten: null
sanktion:
  text:
    de: Keine eigene Pflicht – Hinweis.
  schwere: niedrig
automatisierung: hinweis
einordnung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Bürgerliches Gesetzbuch § 707
  url: https://www.gesetze-im-internet.de/bgb/__707.html
  abgerufen: null
fachlich_zu_pruefen:
- 'Freigabe RA Dr. Weber 22.10.2026: „Rechtsform ‚eGbR‘ im Fragebogen ergänzen“ – umgesetzt als Unterart der GbR, nicht als neue Rechtsform: die Registerfrage (profil.gesellschaft.handelsregister) wird auch der GbR gestellt (Gesellschaftsregister), „eingetragen“ = eGbR. abgeleitet.ist_eingetragene_gesellschaft gilt dann auch für die eGbR (Transparenzregister nur für die eingetragene GbR, § 20 Abs. 1 GwG); die GbR-Auslöser (Istkaufmann, Feststellungserklärung) gelten für GbR und eGbR unverändert; dieser Hinweis entfällt für die eingetragene GbR. Kein Auslöser eines freigegebenen Eintrags geändert'
- 'Freigabe RA Dr. Weber Runde 2 (23.10.2026): Umsetzung als Registerfrage für die GbR sachgerecht; Rechtsfolgen (Transparenzregister nur eGbR, keine Handelsregisteranmeldung) bestätigt'
