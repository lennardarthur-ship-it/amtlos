# Katalog E.55 · Startbestand aus Spezifikation Abschnitt 4 (E-054); Prüfergebnis Sifa 22.10.2026 (C Katalog E.55) eingearbeitet
schema_version: 1
id: arbeitsschutz.gefahrstoffe
version: 3
katalog_nr: E.55
titel:
  de: Gefahrstoffverzeichnis und Betriebsanweisungen
kurz:
  de: Wenn ihr mit Gefahrstoffen arbeitet, führst du ein Verzeichnis, schreibst Betriebsanweisungen und unterweist jährlich mündlich mit Unterschrift.
erklaerung:
  de: 'Die Gefahrstoffverordnung verlangt ein Verzeichnis der Gefahrstoffe mit Bezeichnung, Einstufung, Mengenbereich, Arbeitsbereich und Verweis auf das Sicherheitsdatenblatt (§ 6 Abs. 12 GefStoffV) und für die Beschäftigten schriftliche Betriebsanweisungen auf Grundlage der Gefährdungsbeurteilung (§ 14 Abs. 1 GefStoffV). Anhand der Betriebsanweisung unterweist du mündlich und arbeitsplatzbezogen – vor Aufnahme der Beschäftigung und danach mindestens jährlich; Inhalt und Zeitpunkt hältst du schriftlich fest, und die Unterwiesenen bestätigen die Unterweisung durch Unterschrift (§ 14 Abs. 2 GefStoffV). Ein eingetippter Name genügt dafür nicht. Ergibt die Gefährdungsbeurteilung nur Tätigkeiten mit geringer Gefährdung (§ 6 Abs. 13 GefStoffV), entfällt das Verzeichnis (§ 6 Abs. 12 Satz 3), und die weitergehenden Schutzmaßnahmen sind nicht nötig – das begründest du in der Gefährdungsbeurteilung. Bei krebserzeugenden, keimzellmutagenen oder reproduktionstoxischen Stoffen der Kategorie 1A oder 1B kommt das Expositionsverzeichnis als eigene Pflicht hinzu.'
rechtsgrundlage:
- § 6 Abs. 12, 13 GefStoffV
- § 14 GefStoffV
