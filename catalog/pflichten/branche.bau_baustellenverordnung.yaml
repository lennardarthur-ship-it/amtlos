# Katalog H.4 · Startbestand aus Spezifikation Abschnitt 4 (E-054); Prüfergebnis Sifa 22.10.2026 (C Katalog H.4): Rolle Bauherr ↔ Auftragnehmer
schema_version: 1
id: branche.bau_baustellenverordnung
version: 3
katalog_nr: H.4
titel:
  de: Baustellenverordnung beachten
kurz:
  de: Auf Baustellen beachtest du als ausführende Firma die Hinweise des Koordinators und den Sicherheits- und Gesundheitsschutzplan; Vorankündigung, Plan und Koordinator sind Sache des Bauherrn.
erklaerung:
  de: 'Die Baustellenverordnung verteilt die Pflichten nach Rollen. Der Bauherr kündigt größere Baustellen mindestens zwei Wochen vor Einrichtung der Behörde an – bei mehr als 30 Arbeitstagen mit mehr als 20 gleichzeitig Beschäftigten oder mehr als 500 Personentagen (§ 2 Abs. 2 BaustellV) –, lässt einen Sicherheits- und Gesundheitsschutzplan (SiGe-Plan) erstellen, wenn mehrere Arbeitgeber tätig sind und eine Vorankündigung nötig ist oder besonders gefährliche Arbeiten anfallen (§ 2 Abs. 3), und bestellt bei mehreren Arbeitgebern einen Koordinator (§ 3 Abs. 1). Als ausführende Firma triffst du die Schutzmaßnahmen für deine Arbeiten, berücksichtigst die Hinweise des Koordinators und den SiGe-Plan und informierst deine Beschäftigten darüber (§ 5 BaustellV). Baust du selbst als Bauherr, etwa die eigene Halle, treffen die Pflichten nach §§ 2 und 3 dich.'
