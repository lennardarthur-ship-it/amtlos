titel:
  de: Einwilligung für Cookies und Tracking einholen
kurz:
  de: Setzt deine Website Tracking oder nicht notwendige Cookies ein, holst du vorher die Einwilligung der Besucher ein.
erklaerung:
  de: Nach § 25 TDDDG ist für das Speichern und Auslesen von Informationen auf dem Endgerät grundsätzlich eine Einwilligung
    nötig, außer es ist unbedingt erforderlich. Der Consent-Check deiner Website folgt mit dem Online-Check (Abschnitt 7).
