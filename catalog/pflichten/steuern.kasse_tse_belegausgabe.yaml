kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 25.000 €, wenn die Kasse nicht oder nicht richtig verwendet oder nicht oder nicht richtig durch eine TSE geschützt wird und dadurch Steuerverkürzungen ermöglicht werden (§ 379 Abs. 1 Satz 1 Nr. 4, 5, Abs. 6 AO). Für die fehlende Belegausgabe nach § 146a Abs. 2 AO sieht § 379 AO kein Bußgeld vor. Ohne ordnungsgemäße TSE verliert die Kassenführung ihre Beweiskraft; das Finanzamt kann Umsätze hinzuschätzen (§ 158, § 162 AO). Die Kasse kann jederzeit ohne Ankündigung geprüft werden (Kassen-Nachschau, § 146b AO).'
  # StB Busch 22.10.2026: „hoch“
