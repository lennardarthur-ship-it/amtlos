# Katalog C.33 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt
schema_version: 1
id: steuern.kasse_tse_belegausgabe
version: 4
katalog_nr: C.33
titel:
  de: Kasse mit TSE betreiben und Belege ausgeben
kurz:
  de: Elektronische Kassen brauchen eine technische Sicherheitseinrichtung (TSE), und zu jedem Verkauf ist ein Beleg auszugeben.
erklaerung:
  de: Elektronische Aufzeichnungssysteme müssen durch eine zertifizierte technische Sicherheitseinrichtung geschützt sein.
    Zu jedem Geschäftsvorfall ist ein Beleg auszugeben. Von der Belegausgabepflicht befreit das Finanzamt nur auf Antrag (§ 148 AO).
begriffe:
- begriff:
    de: TSE
  erklaerung:
    de: Technische Sicherheitseinrichtung, die Kassendaten gegen Manipulation schützt.
rechtsgrundlage:
- § 146a AO
