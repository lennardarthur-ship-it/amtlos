# R11 (Rechtsprüfung Befund 10): Widerrufsrecht bei Verträgen außerhalb von Geschäftsräumen – Handwerk und mobile Dienstleister
schema_version: 1
id: branche.widerruf_ausserhalb_geschaeftsraeume
version: 3
katalog_nr: G.68
titel:
  de: Bei Aufträgen beim Kunden zu Hause über das Widerrufsrecht belehren
kurz:
  de: Schließt du Verträge mit Privatkunden bei ihnen zu Hause oder unterwegs, haben sie 14 Tage Widerrufsrecht – darüber belehrst du
    vor Vertragsschluss.
erklaerung:
  de: Verträge, die du mit Verbrauchern außerhalb deiner Geschäftsräume schließt – etwa in der Wohnung beim Aufmaß oder unterwegs –,
    können sie 14 Tage lang widerrufen (§ 312b, § 312g BGB). Darüber informierst du vor Vertragsschluss und gibst die Belehrung und
    eine Abschrift des Vertrags auf Papier oder, wenn der Kunde zustimmt, auf einem anderen dauerhaften Datenträger heraus (Art. 246a § 4
    Abs. 2 EGBGB). Kein Widerrufsrecht besteht etwa bei dringenden Reparaturen, zu denen dich der Kunde ausdrücklich gerufen hat
    (§ 312g Abs. 2 Nr. 11 BGB), und bei Leistungen bis 40 €, die sofort erbracht und bezahlt werden (§ 312 Abs. 2 Nr. 12 BGB). Fehlt die
    Belehrung, läuft die Widerrufsfrist bis zu 12 Monate und 14 Tage (§ 356 Abs. 3, 4 BGB). Widerruft der Kunde dann, schuldet er für
    bereits erbrachte Leistungen in der Regel keinen Wertersatz (§ 357a Abs. 2 BGB). Willst du vor Ablauf der Frist anfangen, lass dir
    das ausdrücklich vom Kunden verlangen und halte es fest.
rechtsgrundlage:
- § 312b BGB
- § 312g BGB
- § 312 Abs. 2 Nr. 12 BGB
- Art. 246a § 4 Abs. 2 EGBGB
- § 356 Abs. 3, 4 BGB
- § 357a Abs. 2 BGB
