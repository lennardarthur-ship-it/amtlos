# Katalog H.6 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.it_scheinselbststaendigkeit
version: 4
katalog_nr: H.6
titel:
  de: Scheinselbstständigkeit vermeiden
kurz:
  de: Arbeitest du überwiegend für einen Auftraggeber und eingebunden wie Angestellte, droht Scheinselbstständigkeit. Ein
    Statusfeststellungsverfahren schafft Klarheit.
erklaerung:
  de: Entscheidend ist das Gesamtbild der Tätigkeit. Die Deutsche Rentenversicherung prüft den Status auf Antrag.
rechtsgrundlage:
- § 7 SGB IV
- § 7a SGB IV
kategorie: branche
branchen:
- it_agentur_freelancer
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: it_agentur_freelancer
    label:
      de: Du arbeitest im IT-, Agentur- oder Freelancer-Bereich.
  # Prüfvermerk RA Dr. Weber 22.10.2026: nur die Freelancer-Seite – die Auftraggeber-Seite steht in personal.statusfeststellung_auftraggeber
  - feld: profil.rentenversicherung.pflichtgruppe
    op: enthaelt
    wert: ein_auftraggeber
    label:
      de: Du arbeitest im Wesentlichen für einen Auftraggeber.
  # UG, GmbH, GmbH & Co. KG sind keine Freelancer – die Frage nach der Rentenversicherungspflicht stellt die App dort nicht
  - not:
      feld: abgeleitet.ist_kapitalgesellschaft_oder_co_kg
      op: ==
      wert: true
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Deutsche Rentenversicherung (Clearingstelle)
kanal: portal
kosten: null
sanktion:
  text:
    de: 'Wird die Tätigkeit als Beschäftigung eingestuft, schuldet dein Auftraggeber die Beiträge bis zu vier Jahre nach (§ 28e, § 25 SGB IV); du verlierst den Unternehmerstatus, und Rechnungen mit Umsatzsteuer sind zu berichtigen.'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: hinweis
einordnung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: Sozialgesetzbuch IV § 7a
  url: https://www.gesetze-im-internet.de/sgb_4/__7a.html
  abgerufen: null
fachlich_zu_pruefen:
- 'Prüfvermerk RA Dr. Weber 22.10.2026: Folgen (Freelancer-Seite) eingetragen, Frist „keine“; Auslöser „beschäftigt mindestens eine Person“ entfernt (Auftraggeber-Seite in personal.statusfeststellung_auftraggeber, Doppelung vermeiden)'
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
pruefung:
  status: entwurf
  geprueft_von: null
  geprueft_am: null
