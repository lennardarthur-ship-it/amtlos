# Katalog C.32 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht 22.10.2026 umgesetzt
# Ablaufhemmung: in der ab 01.01.2025 geltenden Fassung § 147 Abs. 3 Satz 5 AO (Satz 3, 4: Lieferscheine) – lxgesetze.de 22.10.2026
schema_version: 1
id: steuern.aufbewahrung
version: 4
katalog_nr: C.32
titel:
  de: Unterlagen aufbewahren
kurz:
  de: Bewahre Belege und Rechnungen 8 Jahre, Jahresabschlüsse und Bücher 10 Jahre und Geschäftsbriefe 6 Jahre auf.
erklaerung:
  de: 'Buchungsbelege einschließlich Rechnungen: 8 Jahre. Jahresabschlüsse, Bücher und Organisationsunterlagen: 10 Jahre.
    Handels- und Geschäftsbriefe: 6 Jahre. Die Frist beginnt mit dem Schluss des Kalenderjahres, in dem du die letzte Eintragung
    gemacht, den Brief erhalten oder abgesandt hast oder der Beleg entstanden ist (§ 147 Abs. 4 AO). Lieferscheine, die keine
    Buchungsbelege sind, musst du seit 2025 nur bis zum Erhalt bzw. Versand der Rechnung aufbewahren (§ 147 Abs. 3 Satz 3, 4 AO).
    Die Frist läuft aber nicht ab, solange die Unterlagen für Steuern von Bedeutung sind,
    deren Festsetzungsfrist noch nicht abgelaufen ist – zum Beispiel bei einer laufenden Betriebsprüfung oder einem offenen Einspruch.
    Amtlos zeigt dir, ab wann du Unterlagen frühestens löschen darfst; ob noch etwas offen ist, klärst du vorher mit deiner Steuerberatung.'
