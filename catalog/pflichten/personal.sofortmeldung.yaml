fachlich_zu_pruefen:
- „Bei Arbeitsbeginn“ als spätestens am Tag des Beginns umgesetzt – bestätigen
- 'Branchenliste nach SchwarzArbMoDiG (R11, Rechtsprüfung; bestätigt durch TK, HWK Chemnitz, CMS): neu Friseur, Kosmetik, plattformbasierte Lieferdienste; Forstwirtschaft und Fleischerhandwerk gestrichen (laut HWK „befristet“) – Wortlaut im BGBl. gegenlesen; Inkrafttreten 30.12.2025 (HWK) bzw. 1.1.2026 (TK, CMS); Nagelstudios dem Kosmetikgewerbe zugeordnet; Zuordnung von Elektro- und Ausbaugewerken zum Baugewerbe offen'
