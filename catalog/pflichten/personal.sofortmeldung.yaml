# Katalog D.38 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.sofortmeldung
version: 4
katalog_nr: D.38
titel:
  de: Sofortmeldung bei Arbeitsbeginn
kurz:
  de: In deiner Branche meldest du neue Beschäftigte spätestens bei Arbeitsbeginn sofort an.
erklaerung:
  de: 'In den Branchen nach § 28a Abs. 4 SGB IV ist eine Sofortmeldung spätestens bei Arbeitsbeginn Pflicht: Baugewerbe, Gaststätten-
    und Beherbergungsgewerbe, Personenbeförderung, Speditions-, Transport- und damit verbundenes Logistikgewerbe, Schaustellergewerbe,
    Gebäudereinigung, Auf- und Abbau von Messen und Ausstellungen, Fleischwirtschaft (ohne Fleischerhandwerk), Prostitutionsgewerbe,
    Wach- und Sicherheitsgewerbe sowie seit 30.12.2025 Friseur- und Kosmetikgewerbe (auch Nagelstudios) und plattformbasierte Lieferdienste. Die
    Forstwirtschaft gehört seitdem nicht mehr dazu. Zum Baugewerbe zählen auch Ausbaugewerke wie die Elektroinstallation (§ 101 Abs. 2 SGB III in Verbindung mit der Baubetriebe-Verordnung). Die Anmeldung zur Sozialversicherung mit der ersten Lohnabrechnung kommt dazu.'
rechtsgrundlage:
- § 28a Abs. 4 SGB IV
kategorie: personal
branchen:
- bau
- gastronomie_lebensmittel
- transport_logistik
- beauty_kosmetik
- gebaeudereinigung
ausloeser:
  all:
  - any:
    - feld: profil.personal.sofortmeldebranchen
      op: enthaelt_eines
      wert:
      - bau
      - gastronomie
      - personenbefoerderung
      - spedition_logistik
      - schausteller
      - gebaeudereinigung
      - messebau
      - fleischwirtschaft
      - prostitution
      - sicherheitsgewerbe
      - friseur
      - kosmetik
      - lieferdienste
      label:
        de: Dein Betrieb gehört zu einer Branche mit Sofortmeldepflicht.
    # R11: Gebäudereinigung sowie (seit 1.1.2026, SchwarzArbMoDiG) Friseur und Kosmetik – die Hauptbranche reicht
    - feld: profil.taetigkeit.branchen
      op: enthaelt_eines
      wert:
      - beauty_kosmetik
      - gebaeudereinigung
      label:
        de: Deine Branche (Gebäudereinigung, seit 2026 auch Friseur und Kosmetik) gehört zu den Branchen mit Sofortmeldepflicht.
  - ereignis: einstellung
    op: eingetreten
    label:
      de: Du stellst jemanden ein.
voraussetzungen:
- personal.betriebsnummer
frist:
  typ: relativ
  bezug:
    ereignis: einstellung
  versatz: P0D
  zeitpunkt: spaetestens
  je_ereignis: true
  verschiebung:
    regel: keine
    kalender: bundeseinheitlich
wiederholung:
  art: einmalig
stelle:
  de: Deutsche Rentenversicherung (über Lohnprogramm)
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 25.000 €, wenn du die Sofortmeldung nicht, nicht richtig, nicht vollständig, nicht in der vorgeschriebenen Weise oder nicht rechtzeitig erstattest (§ 111 Abs. 1 Nr. 2 Buchst. b, Abs. 4 SGB IV).'
  schwere: hoch
automatisierung: partner
erledigung:
  art: bestaetigen
  bestaetigung:
    de: Über das Lohnprogramm gemeldet
aenderungsnotiz:
  de: Branchenliste nach dem Gesetz zur Modernisierung der Schwarzarbeitsbekämpfung – neu Friseur, Kosmetik und plattformbasierte Lieferdienste, die Forstwirtschaft entfällt.
