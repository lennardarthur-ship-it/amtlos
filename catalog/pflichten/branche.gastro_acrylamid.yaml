- 'Fundstelle für kleine Betriebe: Der Bericht nennt „Anhang II Teil B für kleine Betriebe“. Nach der Inhaltsübersicht der Verordnung (umwelt-online) gilt Teil B zusätzlich zu Teil A für Betriebe nach Art. 2 Abs. 3; das Merkblatt der Stadt Chemnitz (merkblatt_acrylamid.pdf) nennt für Betriebe nach Art. 2 Abs. 2 (Einzelhandel, direkt vor Ort) Anhang II Teil A – Teil A oder B mit dem Prüfer klären, deshalb im Text ohne Teil'
- 'Als Hinweis über die Branche – Amtlos fragt weder „Bäckerei“ noch „Fritteuse“ ab; Bäckerei nur in den Vorlagen erkennbar (Handwerk mit Lebensmitteln oder Name des Betriebs)'
