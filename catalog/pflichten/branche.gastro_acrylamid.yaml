fachlich_zu_pruefen:
- 'Rückmeldung Lebensmittel (Lebensmittelfachbeauftragter, 22.10.2026, ändern): Teil A/B bestätigt (Art. 2 Abs. 2 mit Anhang II Teil A; Teil B nach Art. 2 Abs. 3 nur zusätzlich für zentral gesteuerte Filial- und Franchisebetriebe), Satz zu Teil-A-Betrieben und Folgen bei Verstoß übernommen – § 2 LMRStV (nur Art. 4 Abs. 1, 2 mit Anhang I/II VO (EG) Nr. 852/2004), § 39 LFGB und Art. 138 VO (EU) 2017/625 am 22.10.2026 am Wortlaut gelesen (lxgesetze, gesetze.legal)'
- 'Auslöser jetzt mit der Frage „Backst du selbst oder frittierst du?“ (profil.gastro.backen_frittieren), wie von Lebensmittelfachbeauftragter vorgeschlagen'
- 'Schwere „mittel“ belassen – keine eigene Bußgeldvorschrift; Lebensmittelfachbeauftragter hat zur Schwere nichts angegeben'
- 'Frittierfett höchstens 175 °C laut Prüfbericht (L-075: DGF, BGN-Leitlinie 2018) und Rückmeldung Lebensmittelfachbeauftragter'
- 'Rechtsanwalt Runde 3 (23.10.2026), Folgen freigegeben: VO (EU) 2017/2158 in der LMRStV nicht als Bußgeldtatbestand gelistet; Anordnung nach § 39 LFGB, Art. 138 VO (EU) 2017/625 richtig. Sein Vorbehalt (aktuelle LMRStV gegenlesen) am 23.10.2026 erledigt: Die LMRStV in der Fassung gesetze-im-internet.de (zuletzt geändert durch Art. 1 V v. 19.4.2023 I Nr. 114) nennt die VO (EU) 2017/2158 nicht; § 2 nennt von der VO (EG) Nr. 852/2004 nur Art. 4 Abs. 1 und 2'
