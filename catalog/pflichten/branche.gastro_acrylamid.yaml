# Prüfbericht Lebensmittelhygiene (Tim Baum, 22.10.2026, Frage 1 zu L-032 und Frage 14 (c)): Acrylamid minimieren nach VO (EU) 2017/2158
schema_version: 1
id: branche.gastro_acrylamid
version: 2
katalog_nr: H.1
titel:
  de: Acrylamid beim Backen und Frittieren gering halten
kurz:
  de: Backst du Brot oder Backwaren oder frittierst du zum Beispiel Pommes frites, hältst du mit einfachen Maßnahmen Acrylamid gering.
erklaerung:
  de: >-
    Acrylamid entsteht, wenn stärkehaltige Lebensmittel stark gebräunt werden – etwa Brot, feine Backwaren, Pommes frites
    und andere frittierte Kartoffelerzeugnisse. Betriebe, die solche Lebensmittel herstellen, wenden die
    Minimierungsmaßnahmen der Verordnung (EU) 2017/2158 an: Gibst du nur im eigenen Laden oder an örtliche Einzelhändler
    ab, gelten die Maßnahmen nach Anhang II Teil A (Art. 2 Abs. 2); die Maßnahmen nach Anhang II Teil B kommen nur für
    zentral gesteuerte Filial- und Franchisebetriebe hinzu (Art. 2 Abs. 3). Zum Beispiel: goldgelb statt dunkelbraun backen und
    frittieren, Backzeit und -temperatur nach Rezeptur einhalten, Frittierfett höchstens 175 °C heiß. Die
    Lebensmittelüberwachung prüft das vor allem bei Bäckereien. Amtlos fragt nicht ab, ob du backst oder eine Fritteuse
    nutzt – trifft beides nicht zu, betrifft dich das nicht.
rechtsgrundlage:
- Art. 2 Abs. 2 mit Anhang II Teil A Verordnung (EU) 2017/2158
- Art. 2 Abs. 3 mit Anhang II Teil B Verordnung (EU) 2017/2158 (zusätzlich für zentral gesteuerte Filial- und Franchisebetriebe)
