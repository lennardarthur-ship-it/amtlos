# Katalog B.14 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.gesellschaftsvertrag_notar
version: 3
katalog_nr: B.14
titel:
  de: Gesellschaftsvertrag beim Notar beurkunden
kurz:
  de: Für eine UG oder GmbH lässt du den Gesellschaftsvertrag notariell beurkunden – auch online möglich.
erklaerung:
  de: Die Gründung einer GmbH oder UG beginnt mit dem Gesellschaftsvertrag, den ein Notar beurkundet. Die Beurkundung ist
    auch online möglich. Für die GmbH beträgt das Stammkapital mindestens 25.000 €, davon ist mindestens die Hälfte einzuzahlen.
    Eine UG kann ab 1 € gegründet werden.
begriffe:
- begriff:
    de: Stammkapital
  erklaerung:
    de: Das Kapital, das die Gesellschafter bei der Gründung einer GmbH oder UG mindestens aufbringen.
rechtsgrundlage:
- GmbHG
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_kapitalgesellschaft
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine UG oder GmbH.
  - feld: profil.gesellschaft.handelsregister
    op: '!='
    wert: eingetragen
    label:
      de: Deine Gesellschaft ist noch nicht im Handelsregister eingetragen.
phase: gruendung
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Notarin oder Notar
kanal: notar
kosten: null
sanktion:
  text:
    de: 'Ohne notarielle Beurkundung ist der Gesellschaftsvertrag nichtig (§ 2 Abs. 1 Satz 1 GmbHG, § 125 Satz 1 BGB). Die GmbH oder UG besteht vor der Eintragung als solche nicht; wer vorher in ihrem Namen handelt, haftet persönlich und solidarisch (§ 11 Abs. 1, 2 GmbHG).'
  schwere: hoch
automatisierung: hinweis
aktion:
  art: abhaken
  nachweis_erforderlich: true
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: GmbH-Gesetz
  url: https://www.gesetze-im-internet.de/gmbhg/
  abgerufen: null
- titel: GmbH-Gesetz § 2
  url: https://www.gesetze-im-internet.de/gmbhg/__2.html
  abgerufen: '2026-10-22'
- titel: § 125 BGB, Wortlaut (gesetze-in-app.de)
  url: https://gesetze-in-app.de/BGB/125
  abgerufen: '2026-10-22'
- titel: § 11 GmbHG, Wortlaut (lexmea.de)
  url: https://lexmea.de/de/gesetz/gmbhg/11
  abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Einzelne Vorschriften (z. B. § 2 GmbHG Form, § 5 Stammkapital, § 7 Einzahlung) zuordnen
- 'Online-Beurkundung: Voraussetzungen und Grenzen ergänzen'
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (Formnichtigkeit nach § 125 Satz 1 BGB; Heilung durch Eintragung nicht geprüft); Schwere nach Vorprüfung wieder „hoch“, dringend_ohne_termin entfernt'
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
