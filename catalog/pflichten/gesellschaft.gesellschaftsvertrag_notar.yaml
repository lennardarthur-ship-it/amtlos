fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- Einzelne Vorschriften (z. B. § 2 GmbHG Form, § 5 Stammkapital, § 7 Einzahlung) zuordnen
- 'Online-Beurkundung: Voraussetzungen und Grenzen ergänzen'
- Folgen bei Nichterfüllung nicht in der Spezifikation genannt – Sanktion fachlich ergänzen
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
