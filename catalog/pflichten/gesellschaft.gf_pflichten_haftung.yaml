# Katalog B.17 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.gf_pflichten_haftung
version: 6
katalog_nr: B.17
titel:
  de: Pflichten und Haftung der Geschäftsführung kennen
kurz:
  de: Als Geschäftsführerin oder Geschäftsführer hast du besondere Pflichten und kannst persönlich haften.
erklaerung:
  de: Die Geschäftsführung einer GmbH oder UG hat gesetzliche Pflichten. Wer sie verletzt, kann persönlich haften. Dazu gehören vor allem, die Sozialversicherungsbeiträge der Beschäftigten abzuführen (§ 266a StGB), Steuern zu erklären und zu zahlen (§§ 34, 69 AO), nach Eintritt der Insolvenzreife keine Zahlungen mehr zu leisten (§ 15b InsO), bei Verlust der Hälfte des Stammkapitals die Gesellschafterversammlung einzuberufen (§ 49 Abs. 3 GmbHG) und die Gesellschafterliste aktuell zu halten (§ 40 GmbHG). Das zur Erhaltung des Stammkapitals nötige Vermögen darf nicht an Gesellschafter ausgezahlt werden (§ 30 GmbHG) – typische Fälle sind ein überhöhtes Gehalt für Gesellschafter-Geschäftsführer und Darlehen an Gesellschafter. Verbotene Auszahlungen sind zu erstatten (§ 31 GmbHG), die Geschäftsführung haftet dafür (§ 43 Abs. 3 GmbHG). Bei der GmbH & Co. KG treffen diese Pflichten die Geschäftsführung der Komplementär-GmbH; die Kapitalerhaltung gilt nach der Rechtsprechung des BGH entsprechend für Auszahlungen an Kommanditisten, soweit das Vermögen der Komplementär-GmbH betroffen ist. Für deinen Einzelfall hilft eine Rechtsberatung.
rechtsgrundlage:
- § 43 GmbHG
- §§ 30, 31 GmbHG
- § 266a StGB
- §§ 34, 69 AO
- § 15b InsO
- § 49 Abs. 3 GmbHG
- § 40 GmbHG
