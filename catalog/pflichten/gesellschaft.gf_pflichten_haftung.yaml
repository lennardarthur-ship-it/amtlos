katalog_nr: B.17
titel:
  de: Pflichten und Haftung der Geschäftsführung kennen
kurz:
  de: Als Geschäftsführerin oder Geschäftsführer hast du besondere Pflichten und kannst persönlich haften.
erklaerung:
  de: Die Geschäftsführung einer GmbH oder UG hat gesetzliche Pflichten. Wer sie verletzt, kann persönlich haften. Dazu gehören
    vor allem, die Sozialversicherungsbeiträge der Beschäftigten abzuführen (§ 266a StGB), Steuern zu erklären und zu zahlen
    (§§ 34, 69 AO), nach Eintritt der Insolvenzreife keine Zahlungen mehr zu leisten (§ 15b InsO), bei Verlust der Hälfte des
    Stammkapitals die Gesellschafterversammlung einzuberufen (§ 49 Abs. 3 GmbHG) und die Gesellschafterliste aktuell zu halten
    (§ 40 GmbHG). Für deinen Einzelfall hilft eine Rechtsberatung.
rechtsgrundlage:
- § 43 GmbHG
- § 266a StGB
- §§ 34, 69 AO
- § 15b InsO
- § 49 Abs. 3 GmbHG
- § 40 GmbHG
