fachlich_zu_pruefen:
- 'R12 (Nutzertest Kfz #4): Hebebühnen (jährlich, DGUV Grundsatz 308-002) und Druckbehälter (§§ 15, 16 und Anhang 2 Abschnitt 4 BetrSichV) ergänzt – Schwellen (Druck × Volumen) für die zugelassene Überwachungsstelle unsicher; Prüfprotokoll mit Prüfbuch als Vorlage fehlt'
- Fahrzeuge (DGUV Vorschrift 70 § 57) als eigene Pflicht arbeitsschutz.fahrzeuge_pruefen (R12); Lärm (LärmVibrationsArbSchV) offen
- Neu nach Nutzertest R11 (Tischlerei) – Auslöser über die Branche (Handwerk, Bau, Gebäudereinigung); auch für andere Betriebe mit Leitern oder Maschinen?
- Prüffristen kommen aus der Gefährdungsbeurteilung – als „laufend je Jahr“ abgebildet; Prüfprotokoll-Vorlage fehlt
- Folgen bei Nichterfüllung (§ 22 BetrSichV) – Sanktion fachlich ergänzen
