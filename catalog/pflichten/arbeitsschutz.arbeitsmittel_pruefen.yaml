# R11 (Nutzertest Tischlerei Befund 6): Prüfung von Arbeitsmitteln nach § 14 BetrSichV – Maschinen, Leitern, Absauganlagen
schema_version: 1
id: arbeitsschutz.arbeitsmittel_pruefen
version: 2
katalog_nr: E.53
titel:
  de: Arbeitsmittel prüfen lassen
kurz:
  de: Maschinen, Leitern, Hebebühnen, Druckbehälter und andere Arbeitsmittel lässt du regelmäßig durch eine befähigte Person prüfen und hältst das fest.
erklaerung:
  de: 'Arbeitsmittel, deren Sicherheit von der Montage oder vom Zustand abhängt, lässt du vor der ersten Verwendung und danach wiederkehrend von einer zur Prüfung befähigten Person prüfen (§ 14 BetrSichV). Art, Umfang und Abstände der Prüfungen legst du in der Gefährdungsbeurteilung fest (§ 3 Abs. 6 BetrSichV). Die Ergebnisse dokumentierst du. In Kfz-Werkstätten gehören Hebebühnen dazu: Sie werden vor der ersten Inbetriebnahme und danach in der Regel jährlich von einer befähigten Person geprüft (§ 14 BetrSichV, DGUV Grundsatz 308-002). Druckbehälter wie der Druckluftbehälter eines Kompressors werden nach §§ 15, 16 und Anhang 2 Abschnitt 4 BetrSichV geprüft – ab bestimmten Größen durch eine zugelassene Überwachungsstelle. Elektrische Geräte haben eine eigene Pflicht.'
rechtsgrundlage:
- § 3 Abs. 6 BetrSichV
- § 14 BetrSichV
- §§ 15, 16 BetrSichV
- Anhang 2 Abschnitt 4 BetrSichV
- DGUV Grundsatz 308-002
