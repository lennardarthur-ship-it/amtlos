# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt bis auf den Auslöser (Zahlungseingänge)
schema_version: 1
id: steuern.kleinunternehmer_warnung_95
version: 4
katalog_nr: C.23
titel:
  de: Kleinunternehmergrenze zu 95 % erreicht
kurz:
  de: Deine Rechnungen in Amtlos summieren sich auf mindestens 95 % der Kleinunternehmergrenze; die Grenze liegt bei 100.000 €, im Gründungsjahr bei 25.000 €.
erklaerung:
  de: Die Kleinunternehmerregelung endet ab dem Umsatz, der die Grenze überschreitet. Maßgeblich ist der Umsatz nach vereinnahmten
    Entgelten – die Zahlungen, die du netto erhältst, nicht die Rechnungen nach Rechnungsdatum. Amtlos zählt bisher die Rechnungen,
    die du in Amtlos gestellt hast (netto, nach Rechnungsdatum); ob sie bezahlt sind, ist darin noch nicht berücksichtigt. Rechnungen
    außerhalb von Amtlos sind nicht enthalten.
rechtsgrundlage:
- § 19 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: true
    label:
      de: Du nutzt die Kleinunternehmerregelung.
  - any:
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - all:
        - &id001
          feld: finanzen.umsatz.laufendes_jahr
          op: vorhanden
          label:
            de: Du stellst Rechnungen mit Amtlos.
        - feld: finanzen.umsatz.laufendes_jahr
          op: '>='
          wert:
            regelwert: steuern.ustg19.grenze_gruendungsjahr
            faktor: 0.95
          label:
            de: Deine Rechnungen in Amtlos summieren sich im Gründungsjahr auf mindestens 23.750 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
        - feld: finanzen.umsatz.laufendes_jahr
          op: <=
          wert:
            regelwert: steuern.ustg19.grenze_gruendungsjahr
            faktor: 1.0
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - all:
        - *id001
        - feld: finanzen.umsatz.laufendes_jahr
          op: '>='
          wert:
            regelwert: steuern.ustg19.grenze_laufendes_jahr
            faktor: 0.95
          label:
            de: Deine Rechnungen in Amtlos summieren sich in diesem Jahr auf mindestens 95.000 €; die Grenze liegt bei 100.000 €.
        - feld: finanzen.umsatz.laufendes_jahr
          op: <=
          wert:
            regelwert: steuern.ustg19.grenze_laufendes_jahr
            faktor: 1.0
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
