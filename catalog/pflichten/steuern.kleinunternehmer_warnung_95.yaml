# Katalog C.23 · Startbestand aus Spezifikation Abschnitt 4 (E-054); StB-Durchsicht Busch 22.10.2026 umgesetzt; Auslöser seit v5 nach Zahlungseingängen (vereinnahmte Entgelte)
schema_version: 1
id: steuern.kleinunternehmer_warnung_95
version: 5
katalog_nr: C.23
titel:
  de: Kleinunternehmergrenze zu 95 % erreicht
kurz:
  de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen mindestens 95 % der Kleinunternehmergrenze; die Grenze liegt bei 100.000 €, im Gründungsjahr bei 25.000 €.
erklaerung:
  de: Die Kleinunternehmerregelung endet ab dem Umsatz, der die Grenze überschreitet. Maßgeblich ist der Umsatz nach vereinnahmten
    Entgelten – die Zahlungen, die du netto erhältst, nicht die Rechnungen nach Rechnungsdatum. Amtlos zählt dafür die
    Zahlungseingänge auf deine Rechnungen in Amtlos (netto) und deine Kasseneinnahmen laut Tagesabschlüssen; Leistungen an
    Unternehmen im Ausland zählen nicht mit. Hast du bei einer Rechnung keinen Zahlungseingang vermerkt, zählt Amtlos sie
    vorsichtshalber mit dem Rechnungsdatum – vermerke Zahlungseingänge, dann rechnet Amtlos genauer. Steuerfreie Umsätze wie
    Heilbehandlungen und Verkäufe von Anlagevermögen zählen für die Grenze nicht mit; Amtlos kann sie nicht unterscheiden und
    zählt sie mit. Einnahmen außerhalb von Amtlos sind nicht enthalten.
rechtsgrundlage:
- § 19 UStG
kategorie: steuern
ausloeser:
  all:
  - feld: profil.ust.kleinunternehmer
    op: ==
    wert: true
    label:
      de: Du nutzt die Kleinunternehmerregelung.
  - any:
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: true
        label:
          de: Du hast dein Unternehmen in diesem Jahr gegründet.
      - all:
        - &id001
          feld: finanzen.umsatz.vereinnahmt_laufendes_jahr
          op: vorhanden
          label:
            de: Du erfasst Rechnungen oder Kasseneinnahmen in Amtlos.
        - feld: finanzen.umsatz.vereinnahmt_laufendes_jahr
          op: '>='
          wert:
            regelwert: steuern.ustg19.grenze_gruendungsjahr
            faktor: 0.95
          label:
            de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen im Gründungsjahr mindestens 23.750 €; die Grenze im Gründungsjahr liegt bei 25.000 €.
        - feld: finanzen.umsatz.vereinnahmt_laufendes_jahr
          op: <=
          wert:
            regelwert: steuern.ustg19.grenze_gruendungsjahr
            faktor: 1.0
    - all:
      - feld: abgeleitet.ist_gruendungsjahr
        op: ==
        wert: false
      - all:
        - *id001
        - feld: finanzen.umsatz.vereinnahmt_laufendes_jahr
          op: '>='
          wert:
            regelwert: steuern.ustg19.grenze_laufendes_jahr
            faktor: 0.95
          label:
            de: Deine Einnahmen laut Amtlos (Zahlungseingänge und Kasse, netto) erreichen in diesem Jahr mindestens 95.000 €; die Grenze liegt bei 100.000 €.
        - feld: finanzen.umsatz.vereinnahmt_laufendes_jahr
          op: <=
          wert:
            regelwert: steuern.ustg19.grenze_laufendes_jahr
            faktor: 1.0
