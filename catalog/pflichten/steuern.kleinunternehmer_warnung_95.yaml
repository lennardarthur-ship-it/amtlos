fachlich_zu_pruefen:
- 'StB Busch 22.10.2026 (G-06): Umsatzbegriff sind die vereinnahmten Entgelte (netto) statt gestellter Rechnungen nach Rechnungsdatum – der Auslöser über finanzen.umsatz.laufendes_jahr zählt weiter die Rechnungen (keine Zahlungsdaten im Fakt); nur Hinweis im Text'
- 'Vorprüfung 21.10.2026 (Abschnitt 7, RDG): Formulierung als Information bzw. Rechenergebnis statt Vorwegnahme des Ergebnisses (Liste in rdg-katalog.md)'
