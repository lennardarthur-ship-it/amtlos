# R12 (Nutzertest Kfz #7): Händler von Fahrzeugbatterien – Rücknahme
schema_version: 1
id: produkte.starterbatterien_ruecknahme
version: 2
katalog_nr: G.72
titel:
  de: Altbatterien zurücknehmen, wenn du Fahrzeugbatterien verkaufst
kurz:
  de: Verkaufst du Starterbatterien, nimmst du alte Starterbatterien deiner Kunden kostenlos zurück.
erklaerung:
  de: Händler von Starter-, Industrie- und Elektrofahrzeugbatterien nehmen Altbatterien dieser Art vom Endnutzer im Geschäft oder in dessen Nähe unentgeltlich zurück – unabhängig von Marke, Herkunft und Zustand, soweit sie solche Batterien als Neubatterien anbieten oder angeboten haben (§ 18 BattDG). Verkaufst du online, richtest du Rückgabemöglichkeiten in zumutbarer Entfernung ein.
rechtsgrundlage:
- § 18 BattDG
kategorie: produkte
branchen:
- handwerk
ausloeser:
  feld: profil.umwelt.taetigkeiten
  op: enthaelt
  wert: starterbatterien
  label:
    de: Du verkaufst Fahrzeugbatterien (Starterbatterien).
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 100.000 €, wenn du Batterien bereitstellst, ohne deine Rücknahmepflichten zu erfüllen (§ 60 Abs. 1 Nr. 1, Abs. 3 in Verbindung mit § 4 Abs. 2 und § 18 Abs. 1 Satz 1 BattDG).'
  schwere: mittel
automatisierung: hinweis
