# Katalog F.58 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: datenschutz.vvt
version: 3
katalog_nr: F.58
titel:
  de: Verzeichnis der Verarbeitungstätigkeiten führen
kurz:
  de: Du führst ein Verzeichnis, welche Daten über Menschen du wofür verarbeitest – auch als Kleinbetrieb.
erklaerung:
  de: 'Das Verzeichnis beschreibt je Verarbeitung Zweck, betroffene Personen, Datenarten, Empfänger und Löschfristen. Die Ausnahme für Unternehmen mit weniger als 250 Beschäftigten (Art. 30 Abs. 5 DSGVO) greift nicht, wenn die Verarbeitung nicht nur gelegentlich erfolgt oder besondere Daten wie Gesundheitsdaten umfasst – nach Auffassung der Aufsichtsbehörden ist das bei Kunden- und Beschäftigtendaten praktisch immer so. Amtlos hilft beim Anlegen und erzeugt das Verzeichnis als PDF.'
begriffe:
- begriff:
    de: Verarbeitungstätigkeit
  erklaerung:
    de: Ein Vorgang, bei dem du Daten über Menschen nutzt, z. B. Kundenverwaltung oder Lohnabrechnung.
rechtsgrundlage:
- Art. 30 DSGVO
kategorie: datenschutz
ausloeser:
  any:
  - feld: profil.datenverarbeitung.arten
    op: enthaelt_eines
    wert:
    - kundendaten
    - beschaeftigtendaten
    - gesundheitsdaten
    - videoueberwachung
    - newsletter
    - tracking
    label:
      de: Du verarbeitest Daten über Menschen (z. B. Kunden oder Beschäftigte).
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
