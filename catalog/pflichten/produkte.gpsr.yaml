# Katalog G.73 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Prüfvermerk Rechtsanwalt 22.10.2026: Auslöser getrennt – hier nur die Sorgfaltspflichten der Händler (Art. 12 GPSR);
# Herstellerpflichten in produkte.gpsr_hersteller, Fernabsatzangaben in produkte.gpsr_fernabsatz
schema_version: 1
id: produkte.gpsr
version: 8
katalog_nr: G.73
titel:
  de: 'Produktsicherheit (GPSR): Angaben vor dem Verkauf prüfen'
kurz:
  de: Verkaufst du Verbraucherprodukte, prüfst du vor dem Verkauf, ob Herstellerangaben, Kennzeichnung und Sicherheitsinformationen
    vorhanden sind.
erklaerung:
  de: Die Produktsicherheitsverordnung gilt seit 13.12.2024. Als Händlerin oder Händler – auch von fremder Markenware – prüfst du
    vor dem Verkauf mit der gebotenen Sorgfalt, ob Hersteller, gegebenenfalls Einführer, die Angaben zur Identifizierung sowie
    Anweisungen und Sicherheitsinformationen auf dem Produkt, der Verpackung oder einer beigefügten Unterlage stehen (Art. 12 GPSR).
    Fehlt etwas oder hältst du das Produkt für nicht sicher, stellst du es nicht bereit. Stellst du selbst her, verkaufst du unter
    eigener Marke, führst du von außerhalb der EU ein oder verkaufst du online, gelten zusätzliche Pflichten in eigenen Einträgen.
    Für Kosmetik geht die Kosmetikverordnung vor, die GPSR gilt ergänzend (Art. 2 Abs. 1). Lebensmittel fallen nicht unter die
    Verordnung.
rechtsgrundlage:
- Art. 12 Verordnung (EU) 2023/988 (GPSR)
- Art. 2 Abs. 1, 3 VO (EU) 2023/988 (Kosmetik ergänzend, Lebensmittel ausgenommen)
