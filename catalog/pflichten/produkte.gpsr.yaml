# Katalog G.73 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: produkte.gpsr
version: 7
katalog_nr: G.73
titel:
  de: 'Produktsicherheit (GPSR): Angaben und verantwortliche Person'
kurz:
  de: Verbraucherprodukte brauchen Herstellerangaben, Sicherheitsinformationen und eine verantwortliche Person in der EU. Verkaufst
    du fremde Markenware, prüfst du vor dem Verkauf, ob diese Angaben vorhanden sind.
erklaerung:
  de: Die Produktsicherheitsverordnung gilt seit 13.12.2024. Für die verantwortliche Person in der EU, die Herstellerangaben und
    die Sicherheitsinformationen sorgen Hersteller und Importeure. Als Händlerin oder Händler fremder Ware prüfst du vor dem Verkauf,
    ob Hersteller, gegebenenfalls Importeur und die nötigen Angaben auf dem Produkt oder der Verpackung stehen. Wer Produkte im Fernabsatz
    anbietet (zum Beispiel im Onlineshop oder auf einem Marktplatz), nennt diese Angaben schon beim Angebot. Lebensmittel fallen
    nicht unter die Verordnung.
rechtsgrundlage:
- Verordnung (EU) 2023/988 (GPSR)
- Art. 2 Abs. 3 VO (EU) 2023/988 (Lebensmittel ausgenommen)
