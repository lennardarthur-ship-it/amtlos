kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 10.000 €, wenn du ein Produkt bereitstellst, obwohl du es für nicht sicher hältst oder die vorgeschriebenen Angaben fehlen (§ 28 Abs. 2 Nr. 21, Abs. 3 ProdSG in Verbindung mit Art. 12 Abs. 3 GPSR).'
  schwere: mittel
