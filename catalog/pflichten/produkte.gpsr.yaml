- 'Prüfvermerk Rechtsanwalt 22.10.2026: Auslöser getrennt – Händler (Art. 12, Schwere „mittel“) hier, Herstellerpflichten (Art. 9, 11) in produkte.gpsr_hersteller (Auslöser profil.produkte.hersteller), Fernabsatzangaben (Art. 19) in produkte.gpsr_fernabsatz (Onlineshop, Marktplatz, App); Kosmetik: Kosmetikverordnung geht vor (Art. 2 Abs. 1). „Dringend ohne Termin“ entfernt, weil Folgen erfasst und Schwere bewusst „mittel“; Online-Check-Link in den Fernabsatz-Eintrag verschoben'
- 'Freigabe Rechtsanwalt Runde 2 (23.10.2026): Händlertext nach Art. 12 Abs. 1–3 GPSR (Prüfung von Kennzeichnung, Angaben, Anweisungen; keine Bereitstellung bei Kenntnis der Nichtkonformität), Sanktion § 28 Abs. 2 Nr. 21 ProdSG (verweist auf Art. 12 Abs. 3 GPSR) und Schwere „mittel“ bestätigt'
