# R12 (Nutzertest Kurier #5, Zoll #13): Haftung als Auftraggeber von Subunternehmern
schema_version: 1
id: personal.nachunternehmerhaftung
version: 2
katalog_nr: D.39
titel:
  de: Als Auftraggeber für den Mindestlohn bei Subunternehmern haften
kurz:
  de: Beauftragst du Subunternehmer, haftest du dafür, dass deren Beschäftigte den Mindestlohn bekommen – lass dir Nachweise geben.
erklaerung:
  de: Wer einen anderen Unternehmer mit Werk- oder Dienstleistungen beauftragt, haftet wie ein Bürge dafür, dass dieser und alle weiteren Nachunternehmer ihren Beschäftigten den Mindestlohn zahlen (§ 13 MiLoG i. V. m. § 14 AEntG). Im Baugewerbe haftest du außerdem für die Sozialversicherungsbeiträge der Nachunternehmer, wenn der Gesamtwert der Bauleistungen 275.000 € erreicht (§ 28e Abs. 3a SGB IV), bei Paketdiensten für die Zustellung von Paketen bis 32 kg (§ 28e Abs. 3f, 3g SGB IV); Botenfahrten etwa einer Apotheke sind keine Paketzustellung in diesem Sinn. In der Bau-, Fleisch- und Paketbranche haftest du auch für die Beiträge zur Unfallversicherung (§ 150 Abs. 3 SGB VII). Ist der Nachunternehmer präqualifiziert, entlastet dich das (§ 28e Abs. 3b SGB IV). Lass dir deshalb vor und während der Zusammenarbeit Nachweise geben, etwa Unbedenklichkeitsbescheinigungen der Krankenkasse und der Berufsgenossenschaft, eine Erklärung zum Mindestlohn und die Gewerbeanmeldung, und vereinbare Kontrollrechte im Vertrag.
rechtsgrundlage:
- § 13 MiLoG
- § 14 AEntG
- § 28e SGB IV
- § 150 Abs. 3 SGB VII
