# R12 (Nutzertest Kurier #5, Zoll #13): Haftung als Auftraggeber von Subunternehmern
schema_version: 1
id: personal.nachunternehmerhaftung
version: 1
katalog_nr: D.39
titel:
  de: Als Auftraggeber für den Mindestlohn bei Subunternehmern haften
kurz:
  de: Beauftragst du Subunternehmer, haftest du dafür, dass deren Beschäftigte den Mindestlohn bekommen – lass dir Nachweise geben.
erklaerung:
  de: Wer einen anderen Unternehmer mit Werk- oder Dienstleistungen beauftragt, haftet wie ein Bürge dafür, dass dieser und alle weiteren Nachunternehmer ihren Beschäftigten den Mindestlohn zahlen (§ 13 MiLoG i. V. m. § 14 AEntG). Im Baugewerbe und bei Paketdiensten haftest du außerdem für die Sozialversicherungsbeiträge der Nachunternehmer (§ 28e SGB IV). Lass dir deshalb vor und während der Zusammenarbeit Nachweise geben, etwa Unbedenklichkeitsbescheinigungen der Krankenkasse und der Berufsgenossenschaft, eine Erklärung zum Mindestlohn und die Gewerbeanmeldung, und vereinbare Kontrollrechte im Vertrag.
rechtsgrundlage:
- § 13 MiLoG
- § 14 AEntG
- § 28e SGB IV
