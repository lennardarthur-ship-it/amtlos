titel:
  de: Elektrische Geräte prüfen lassen
kurz:
  de: Elektrische Geräte und Anlagen lässt du regelmäßig prüfen (DGUV Vorschrift 3).
erklaerung:
  de: Elektrische Betriebsmittel müssen in bestimmten Abständen geprüft werden. Ein Prüfprotokoll gilt bis zur nächsten Prüfung,
    die darin steht (sonst bis zum Richtwert für die gewählten Einsatzbedingungen) – dann erinnert Amtlos wieder.
