# R12 (Nutzertest Kurier #7, Zoll #5): Aufenthaltstitel für die Dauer der Beschäftigung
schema_version: 1
id: personal.aufenthaltstitel_laufend
version: 2
katalog_nr: D.38
titel:
  de: Aufenthaltstitel während der Beschäftigung im Blick behalten
kurz:
  de: Für Beschäftigte von außerhalb der EU bewahrst du die Kopie des Aufenthaltstitels für die ganze Dauer der Beschäftigung auf und achtest auf das Ablaufdatum.
erklaerung:
  de: Die Kopie des Aufenthaltstitels oder der Erlaubnis zur Beschäftigung bewahrst du für die Dauer der Beschäftigung auf, auf Papier oder elektronisch (§ 4a Abs. 5 AufenthG). Läuft der Titel ab, darf die Person nur weiterarbeiten, wenn ein neuer Titel oder eine Bescheinigung der Ausländerbehörde die Beschäftigung erlaubt – lass dir dann die neue Kopie geben. Endet die Beschäftigung vorzeitig, teilst du das der Ausländerbehörde binnen vier Wochen mit (§ 4a Abs. 5 S. 3 Nr. 3 AufenthG).
rechtsgrundlage:
- § 4a Abs. 5 AufenthG
- § 98 Abs. 2a Nr. 2 AufenthG
kategorie: personal
branchen:
- gebaeudereinigung
- bau
- gastronomie_lebensmittel
- transport_logistik
ausloeser:
  all:
  - feld: profil.personal.drittstaaten
    op: ==
    wert: true
    label:
      de: Du beschäftigst Menschen ohne EU-, EWR- oder Schweizer Staatsangehörigkeit.
  - feld: abgeleitet.hat_beschaeftigte
    op: ==
    wert: true
    label:
      de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Kontrolle durch den Zoll
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Wer jemanden ohne die erforderliche Erlaubnis beschäftigt, riskiert ein Bußgeld bis 500.000 € (§ 404 Abs. 2 Nr. 3, Abs. 3 SGB III). Endet die Beschäftigung vorzeitig und teilst du das der Ausländerbehörde nicht binnen vier Wochen mit, riskierst du bis 30.000 € (§ 98 Abs. 2a Nr. 2, Abs. 5 AufenthG); für eine fehlende Kopie sieht § 98 AufenthG kein eigenes Bußgeld vor.
  schwere: hoch
automatisierung: hinweis
