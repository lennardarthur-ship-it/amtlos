# R12 (Nutzertest Kurier #7, Zoll #5): Aufenthaltstitel für die Dauer der Beschäftigung
schema_version: 1
id: personal.aufenthaltstitel_laufend
version: 1
katalog_nr: D.38
titel:
  de: Aufenthaltstitel während der Beschäftigung im Blick behalten
kurz:
  de: Für Beschäftigte von außerhalb der EU bewahrst du die Kopie des Aufenthaltstitels für die ganze Dauer der Beschäftigung auf und achtest auf das Ablaufdatum.
erklaerung:
  de: Die Kopie des Aufenthaltstitels oder der Erlaubnis zur Beschäftigung bewahrst du für die Dauer der Beschäftigung auf, auf Papier oder elektronisch (§ 4a Abs. 5 AufenthG). Läuft der Titel ab, darf die Person nur weiterarbeiten, wenn ein neuer Titel oder eine Bescheinigung der Ausländerbehörde die Beschäftigung erlaubt – lass dir dann die neue Kopie geben. Endet die Beschäftigung vorzeitig, kann eine Mitteilung an die Ausländerbehörde nötig sein.
rechtsgrundlage:
- § 4a Abs. 5 AufenthG
kategorie: personal
branchen:
