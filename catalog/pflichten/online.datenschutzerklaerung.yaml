# Katalog G.66 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: online.datenschutzerklaerung
version: 5
katalog_nr: G.66
titel:
  de: Datenschutzerklärung auf der Website
kurz:
  de: Auf deiner Website informierst du in einer Datenschutzerklärung über die Verarbeitung von Daten.
erklaerung:
  de: Die Datenschutzerklärung muss ab der Live-Schaltung deiner Website bereitstehen und von jeder Seite erreichbar sein. Inhaltlich
    folgt sie den Informationspflichten der DSGVO. Erledigt ist sie, wenn sie auf deiner Website veröffentlicht ist.
rechtsgrundlage:
- Art. 13 DSGVO
- § 25 TDDDG
kategorie: online
branchen:
- onlinehandel
ausloeser:
  any:
  - feld: profil.online.website
    op: ==
    wert: true
    label:
      de: Du hast eine Website.
  - feld: profil.vertrieb.kanaele
    op: enthaelt_eines
    wert:
    - onlineshop
    - app
    label:
      de: Du verkaufst über einen Onlineshop oder eine App.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: Bußgeld bis 20 Mio. € oder bis 4 % des weltweiten Jahresumsatzes, je nachdem, welcher Betrag höher ist (Art. 83 Abs. 5 Buchst. b DSGVO).
  schwere: hoch
automatisierung: hinweis
aktion:
  art: link
  ziel: app.onlinecheck
erledigung:
  art: bestaetigen
  bestaetigung:
    de: Auf der Website veröffentlicht
