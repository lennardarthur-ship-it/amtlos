# Katalog D.42 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: personal.arbeitszeit_aufzeichnung
version: 6
katalog_nr: D.42
titel:
  de: Arbeitszeit aufzeichnen
kurz:
  de: Du zeichnest die Arbeitszeit deiner Beschäftigten auf.
erklaerung:
  de: Nach der Rechtsprechung des Bundesarbeitsgerichts besteht bereits eine Pflicht zur Arbeitszeiterfassung. Eine bestimmte Form schreibt das BAG nicht vor – auch Papier reicht, wenn die Erfassung objektiv, verlässlich und zugänglich ist; die Aufzeichnung darfst du den Beschäftigten übertragen. Unabhängig davon verlangt das Arbeitszeitgesetz, die über acht Stunden hinausgehende Arbeitszeit an Werktagen und die Arbeit an Sonn- und Feiertagen aufzuzeichnen und diese Nachweise mindestens zwei Jahre aufzubewahren (§ 16 Abs. 2 ArbZG). Amtlos bietet eine Zeiterfassung, die auf die geplante Neuregelung vorbereitet ist.
rechtsgrundlage:
- § 3 Abs. 2 Nr. 1 ArbSchG (BAG, 13.9.2022 – 1 ABR 22/21)
- § 16 Abs. 2 ArbZG
kategorie: personal
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 30.000 €, wenn die Aufzeichnungen nach § 16 Abs. 2 ArbZG nicht oder nicht richtig erstellt oder nicht für die vorgeschriebene Dauer aufbewahrt werden (§ 22 Abs. 1 Nr. 9, Abs. 2 ArbZG). Für die allgemeine Erfassungspflicht nach § 3 Abs. 2 Nr. 1 ArbSchG ist kein eigenes Bußgeld vorgesehen.'
