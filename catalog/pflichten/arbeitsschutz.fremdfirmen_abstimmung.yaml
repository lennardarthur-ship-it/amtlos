# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Unterweisung/Abstimmung Fremdfirmen und Arbeit beim Kunden“): § 8 ArbSchG, §§ 5, 6 DGUV V1
schema_version: 1
id: arbeitsschutz.fremdfirmen_abstimmung
version: 2
katalog_nr: E.51
titel:
  de: Arbeitsschutz mit Auftraggebern und anderen Firmen abstimmen
kurz:
  de: Arbeiten deine Beschäftigten beim Kunden oder zusammen mit anderen Firmen, stimmst du die Schutzmaßnahmen ab und unterweist sie zu den Gefahren vor Ort.
erklaerung:
  de: 'Arbeiten Beschäftigte mehrerer Arbeitgeber an einem Arbeitsplatz, arbeiten die Arbeitgeber zusammen, unterrichten sich gegenseitig über die Gefahren und stimmen die Schutzmaßnahmen ab (§ 8 Abs. 1 ArbSchG, § 6 DGUV Vorschrift 1). Ist es zur Vermeidung gegenseitiger Gefährdungen nötig, bestimmt ihr eine Person, die die Arbeiten aufeinander abstimmt. Arbeiten deine Leute in fremden Betrieben oder Wohnungen, lässt du dir die Gefahren vor Ort nennen und unterweist sie dazu (§ 8 Abs. 2 ArbSchG). Vergibst du selbst Aufträge an Fremdfirmen, gibst du ihnen die Sicherheitsanforderungen mit und hilfst bei deren Gefährdungsbeurteilung (§ 5 DGUV Vorschrift 1). Auf Baustellen kommen die Pflichten nach der Baustellenverordnung hinzu.'
rechtsgrundlage:
- § 8 ArbSchG
- §§ 5, 6 DGUV Vorschrift 1
kategorie: arbeitsschutz
branchen:
- handwerk
- bau
- gebaeudereinigung
ausloeser:
