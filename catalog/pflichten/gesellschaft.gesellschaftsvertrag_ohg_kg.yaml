titel:
  de: Gesellschaftsvertrag der OHG oder KG schließen
kurz:
  de: Den Gesellschaftsvertrag einer OHG oder KG schließt ihr ohne Notar – am besten schriftlich.
erklaerung:
  de: Der Gesellschaftsvertrag der OHG und der KG ist formfrei, du brauchst dafür keinen Notar. Er sollte aber schriftlich geschlossen werden. Ohne Vertrag gelten die gesetzlichen Regeln (§§ 105 ff., 161 ff. HGB).
rechtsgrundlage:
- §§ 105 ff. HGB
