# Neu nach RA Dr. Weber, Nachprüfung 23.10.2026 (zu B.15, Frage 2): kurzer Hinweis zum Gesellschaftsvertrag der OHG/KG – Text nach seinem Wortlaut
# („formfrei (kein Notar), sollte aber schriftlich geschlossen werden; ohne Vertrag gelten die gesetzlichen Regeln (§§ 105 ff., 161 ff. HGB)“);
# als eigener Hinweis im Gründungsablauf wie gesellschaft.gesellschaftsvertrag_notar für UG/GmbH – gesellschaft.handelsregister_anmeldung (v6, freigegeben) bleibt unverändert
schema_version: 1
id: gesellschaft.gesellschaftsvertrag_ohg_kg
version: 1
