# Prüfergebnis Sifa 22.10.2026 (C Fehlende Pflichten „Brandschutzhelfer“; C Katalog E.53/E.54): aus Erste Hilfe herausgelöst
schema_version: 1
id: arbeitsschutz.brandschutzhelfer
version: 3
katalog_nr: E.54
titel:
  de: Brandschutzhelfer benennen und ausbilden
kurz:
  de: Du benennst genug Beschäftigte als Brandschutzhelfer und lässt sie im Umgang mit Feuerlöschern ausbilden – in der Regel 5 Prozent der Beschäftigten, in kleinen Betrieben mindestens eine Person, die während der Arbeitszeit anwesend ist (ASR A2.2 Nr. 7.3).
erklaerung:
  de: 'Eine ausreichende Zahl von Beschäftigten machst du durch Unterweisung und Übung mit dem Löschen von Entstehungsbränden vertraut (§ 10 Abs. 2 ArbSchG, § 22 Abs. 2 DGUV Vorschrift 1). Nach ASR A2.2 Abschnitt 7.3 ergibt sich die Zahl aus der Gefährdungsbeurteilung; ein Anteil von 5 Prozent der Beschäftigten reicht in der Regel. Mehr brauchst du bei erhöhter Brandgefährdung, vielen Personen oder großen Flächen; Schichtbetrieb, Urlaub und Krankheit planst du ein. Die Ausbildung besteht aus Theorie und einer praktischen Löschübung; empfohlen ist eine Auffrischung alle drei bis fünf Jahre (DGUV Information 205-023). In kleinen Betrieben bist oft du selbst die erste Brandschutzhelferin oder der erste Brandschutzhelfer.'
rechtsgrundlage:
- § 10 Abs. 2 ArbSchG
- § 22 Abs. 2 DGUV Vorschrift 1
- ASR A2.2 Abschnitt 7.3
- DGUV Information 205-023
kategorie: arbeitsschutz
ausloeser:
  feld: abgeleitet.hat_beschaeftigte
  op: ==
  wert: true
  label:
    de: Du beschäftigst mindestens eine Person.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Ausbildung z. B. bei Feuerwehr oder Brandschutzdienstleister
kanal: partner
kosten: null
sanktion:
  text:
    de: 'Kein eigenes Bußgeld vorgesehen. Die Aufsichtsbehörde kann die Benennung und Ausbildung im Einzelfall anordnen; ein Verstoß gegen die vollziehbare Anordnung kostet bis 30.000 € (§ 22 Abs. 3 Satz 1 Nr. 1, § 25 Abs. 1 Nr. 2 Buchst. a, Abs. 2 ArbSchG).'
