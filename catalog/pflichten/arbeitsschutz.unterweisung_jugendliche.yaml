# R11 (Rechtsprüfung T-100/T-111, Nutzertest Tischlerei Befund 7): halbjährliche Unterweisung Jugendlicher als eigene Pflicht
schema_version: 1
id: arbeitsschutz.unterweisung_jugendliche
version: 4
katalog_nr: E.51
titel:
  de: Jugendliche halbjährlich unterweisen
kurz:
  de: Beschäftigte unter 18 unterweist du vor Beginn und danach mindestens alle sechs Monate über Unfall- und Gesundheitsgefahren.
erklaerung:
  de: Für Jugendliche gilt ein kürzerer Abstand als die jährliche Unterweisung der übrigen Beschäftigten. Vor Beginn der Beschäftigung
    und bei wesentlichen Änderungen unterweist du sie über die Gefahren und die Schutzmaßnahmen; danach wiederholst du die Unterweisung
    mindestens halbjährlich (§ 29 JArbSchG). Jede jugendliche Person muss einzeln spätestens sechs Monate nach ihrer letzten Unterweisung
    wieder unterwiesen sein. Amtlos erinnert sechs Monate nach der letzten Unterweisung, die du in Amtlos erfasst, und unterscheidet dabei
    noch nicht nach Personen – unterweist du Jugendliche einzeln, achte selbst auf die Frist jeder Person und erfasse jede Unterweisung.
rechtsgrundlage:
- § 29 JArbSchG
