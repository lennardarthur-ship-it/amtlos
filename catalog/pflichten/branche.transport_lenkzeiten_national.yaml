# R12 (Nutzertest Kurier #2): Lenk- und Ruhezeiten im Inland für Fahrzeuge über 2,8 bis 3,5 t
schema_version: 1
id: branche.transport_lenkzeiten_national
version: 2
katalog_nr: H.5
titel:
  de: Lenk- und Ruhezeiten bei Transportern über 2,8 t
kurz:
  de: Im Inland gelten die Lenk- und Ruhezeiten schon für Fahrzeuge über 2,8 t bis 3,5 t – ohne Fahrtenschreiber zeichnest du sie mit Tageskontrollblättern auf.
erklaerung:
  de: Für die Güterbeförderung mit Fahrzeugen über 2,8 t bis 3,5 t zulässiger Gesamtmasse gelten im Inland ebenfalls die Lenk- und Ruhezeiten der Verordnung (EG) Nr. 561/2006; das regelt die Fahrpersonalverordnung. Ist kein Fahrtenschreiber eingebaut, führen die Fahrerinnen und Fahrer handschriftliche Tageskontrollblätter; ist einer eingebaut, wird er benutzt. Die Nachweise für den laufenden Tag und die vorangegangenen 28 Tage führen sie mit. Für Werkverkehr gibt es unter bestimmten Bedingungen Ausnahmen.
