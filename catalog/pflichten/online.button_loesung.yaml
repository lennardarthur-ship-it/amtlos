katalog_nr: G.68
titel:
  de: Bestellbutton eindeutig beschriften (Button-Lösung)
kurz:
  de: Der Button, mit dem Verbraucher kostenpflichtig bestellen, muss eindeutig auf die Zahlungspflicht hinweisen.
erklaerung:
  de: 'Nach § 312j BGB kommt ohne eindeutige Beschriftung kein wirksamer Vertrag zustande. Zulässig sind etwa „zahlungspflichtig bestellen“, „kostenpflichtig bestellen“ oder „kaufen“, nicht dagegen „bestellen“, „weiter“ oder „anmelden“.'
