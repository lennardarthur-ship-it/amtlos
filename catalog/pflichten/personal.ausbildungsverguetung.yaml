# R11 (Nutzertest Tischlerei Befund 16): Mindestausbildungsvergütung nach § 17 BBiG
schema_version: 1
id: personal.ausbildungsverguetung
version: 3
katalog_nr: D.39
titel:
  de: Mindestvergütung für Auszubildende zahlen
kurz:
  de: Auszubildenden zahlst du mindestens die Mindestausbildungsvergütung nach dem Berufsbildungsgesetz – der Mindestlohn gilt für sie nicht.
erklaerung:
  de: 'Für Auszubildende gilt nicht der gesetzliche Mindestlohn (§ 22 Abs. 3 MiLoG), sondern eine angemessene Vergütung, mindestens
    die Mindestausbildungsvergütung nach § 17 BBiG. Sie steigt mit jedem Ausbildungsjahr und richtet sich nach dem Jahr, in dem die
    Ausbildung beginnt (§ 17 Abs. 2 BBiG): Beginnt die Ausbildung 2026, sind es monatlich mindestens 724 € im ersten, 854 € im zweiten,
    977 € im dritten und 1.014 € im vierten Ausbildungsjahr; beginnt sie 2027, 764 €, 902 €, 1.031 € und 1.070 € (Bekanntmachung im
    BGBl. 2026 I Nr. 287). Die Beträge gelten für die gesamte Ausbildung nach dem Jahr des Beginns. Gilt für dich ein Tarifvertrag,
    geht dessen Vergütung vor (§ 17 Abs. 3, 4 BBiG).'
rechtsgrundlage:
- § 17 BBiG
- § 25 BBiG
- § 22 Abs. 3 MiLoG
kategorie: personal
ausloeser:
  feld: profil.beschaeftigte.azubi
  op: '>='
  wert: 1
  label:
    de: Du bildest aus.
frist:
