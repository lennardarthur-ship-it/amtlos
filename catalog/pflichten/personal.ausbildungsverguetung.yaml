fachlich_zu_pruefen:
- 'Freigabe Rechtsanwalt Runde 2 (23.10.2026) (ändern): Beträge je Jahr des Ausbildungsbeginns (§ 17 Abs. 2 BBiG) in den Text
  übernommen – Beginn 2026: 724/854/977/1.014 €, Beginn 2027: 764/902/1.031/1.070 € (BGBl. 2026 I Nr. 287); Hinweis „gelten
