# Katalog H.1 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft · R10: aufgeteilt in Bescheinigung vor Beginn (§ 43 Abs. 1, branche.gastro_ifsg_bescheinigung), Belehrung nach Aufnahme der Tätigkeit (§ 43 Abs. 4, diese Pflicht) und Folgebelehrung alle zwei Jahre (branche.gastro_ifsg_folgebelehrung)
schema_version: 1
