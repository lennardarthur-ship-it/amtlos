titel:
  de: Belehrung nach § 43 IfSG durch den Arbeitgeber
kurz:
  de: Wer neu bei dir mit Lebensmitteln arbeitet, belehrst du nach Aufnahme der Tätigkeit selbst und dokumentierst das.
erklaerung:
  de: Neben der Bescheinigung des Gesundheitsamts vor dem ersten Arbeitstag belehrst du als Arbeitgeber neue Beschäftigte nach
    Aufnahme der Tätigkeit über die Tätigkeitsverbote und Verpflichtungen nach §§ 42 und 43 IfSG und dokumentierst die Belehrung.
    Danach wiederholst du sie alle zwei Jahre – siehe „Belehrung nach § 43 IfSG alle zwei Jahre wiederholen“.
