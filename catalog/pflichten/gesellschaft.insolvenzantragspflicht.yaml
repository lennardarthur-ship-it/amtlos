# Katalog B.17 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Fristen nach § 15a InsO als Regelwerte erfassen
schema_version: 1
id: gesellschaft.insolvenzantragspflicht
version: 4
katalog_nr: B.17
titel:
  de: Insolvenzantragspflicht kennen
kurz:
  de: Bei Zahlungsunfähigkeit oder Überschuldung muss die Geschäftsführung rechtzeitig Insolvenz beantragen.
erklaerung:
  de: Die Insolvenzantragspflicht nach § 15a InsO trifft die Geschäftsführung. Der Antrag ist ohne schuldhaftes Zögern zu stellen, spätestens drei Wochen nach Eintritt der Zahlungsunfähigkeit und sechs Wochen nach Eintritt der Überschuldung. Bei der GmbH & Co. KG gilt das ebenso, weil keine natürliche Person unbeschränkt haftet; antragspflichtig ist dann die Geschäftsführung der Komplementär-GmbH (§ 15a Abs. 1 S. 3 InsO).
rechtsgrundlage:
- § 15a InsO
- § 15b InsO
