# Katalog B.15 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.gesellschafterliste_aktualisieren
version: 3
katalog_nr: B.15
titel:
  de: Gesellschafterliste aktualisieren
kurz:
  de: 'Wenn sich im Gesellschafterkreis etwas ändert, muss unverzüglich eine neue Gesellschafterliste zum Handelsregister – über den Notar, wenn er an der Änderung mitgewirkt hat, sonst durch die Geschäftsführung.'
erklaerung:
  de: 'Nach jeder Veränderung in den Personen der Gesellschafter oder im Umfang ihrer Beteiligung reicht die Geschäftsführung unverzüglich nach Wirksamwerden der Veränderung eine aktualisierte Gesellschafterliste beim Handelsregister ein (§ 40 Abs. 1 S. 1 GmbHG). Hat ein Notar an der Veränderung mitgewirkt, reicht er die Liste ein (§ 40 Abs. 2 GmbHG).'
rechtsgrundlage:
- § 40 GmbHG
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_kapitalgesellschaft
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine UG oder GmbH.
  - ereignis: gesellschafterwechsel
    op: eingetreten
    label:
      de: Im Gesellschafterkreis hat sich etwas geändert.
frist:
  typ: dauerhaft
wiederholung:
  art: bei_aenderung
  neu_ausloesen_bei:
  - ereignis: gesellschafterwechsel
stelle:
  de: 'Notarin oder Notar bzw. Geschäftsführung; Registergericht'
kanal: notar
kosten: null
sanktion:
  text:
    de: 'Geschäftsführer, die die Liste nicht einreichen, haften denjenigen, deren Beteiligung sich geändert hat, und den Gläubigern der Gesellschaft für den daraus entstandenen Schaden als Gesamtschuldner (§ 40 Abs. 3 GmbHG).'
  schwere: mittel
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: GmbH-Gesetz § 40
  url: https://www.gesetze-im-internet.de/gmbhg/__40.html
  abgerufen: '2026-10-22'
pruefung:
  status: entwurf
  geprueft_von: null
  geprueft_am: null
