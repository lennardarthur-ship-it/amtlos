# Katalog B.15 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.gesellschafterliste_aktualisieren
version: 2
katalog_nr: B.15
titel:
  de: Gesellschafterliste aktualisieren
kurz:
  de: Wenn sich im Gesellschafterkreis etwas ändert, muss eine neue Gesellschafterliste zum Handelsregister – über den Notar.
erklaerung:
  de: Änderungen im Gesellschafterkreis werden notariell abgewickelt; die aktualisierte Gesellschafterliste wird beim Handelsregister
    eingereicht.
rechtsgrundlage:
- GmbHG
kategorie: gesellschaft
ausloeser:
  all:
  - feld: abgeleitet.ist_kapitalgesellschaft
    op: ==
    wert: true
    label:
      de: Dein Unternehmen ist eine UG oder GmbH.
  - ereignis: gesellschafterwechsel
    op: eingetreten
    label:
      de: Im Gesellschafterkreis hat sich etwas geändert.
frist:
  typ: dauerhaft
wiederholung:
  art: bei_aenderung
  neu_ausloesen_bei:
  - ereignis: gesellschafterwechsel
stelle:
  de: Notarin oder Notar; Registergericht
kanal: notar
kosten: null
sanktion:
  text:
    de: 'Geschäftsführer, die die Liste nicht einreichen, haften denjenigen, deren Beteiligung sich geändert hat, und den Gläubigern der Gesellschaft für den daraus entstandenen Schaden als Gesamtschuldner (§ 40 Abs. 3 GmbHG).'
  schwere: mittel
automatisierung: hinweis
status_recht: in_kraft
gueltig_ab: null
gueltig_bis: null
quellen:
- titel: GmbH-Gesetz § 40
  url: https://www.gesetze-im-internet.de/gmbhg/__40.html
  abgerufen: '2026-10-22'
fachlich_zu_pruefen:
- Frist für die Einreichung ergänzen
- 'Sanktion am 22.10.2026 aus dem Wortlaut ergänzt – fachlich zu bestätigen (§ 40 GmbHG enthält kein Buß- oder Zwangsgeld, nur die Haftung nach Abs. 3; bei Mitwirkung eines Notars reicht dieser die Liste ein (§ 40 Abs. 2))'
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
