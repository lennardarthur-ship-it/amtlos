fachlich_zu_pruefen:
- 'Fristen Aufstellung (3 bzw. 6 Monate, § 264 Abs. 1 HGB) und Feststellung (8 bzw. 11 Monate, § 42a Abs. 2 GmbHG) im Text (R11, Nutzertest Tischlerei) – als Termine abbilden, Größenklasse abfragen'
- Fristen für Aufstellung und Feststellung als Regeldaten ergänzen
- Jährliche Wiederholung abbilden, sobald Fristen feststehen
- Folgen bei Nichterfüllung nicht in der Spezifikation genannt – Sanktion fachlich ergänzen
- Rechtsgrundlage ergänzt, steht nicht in der Spezifikation
