# Katalog B.18 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: gesellschaft.jahresabschluss
version: 2
katalog_nr: B.18
titel:
  de: Jahresabschluss aufstellen und feststellen
kurz:
  de: Nach jedem Geschäftsjahr erstellst du Bilanz und Gewinn- und Verlustrechnung; die Gesellschafter stellen den Abschluss
    fest.
erklaerung:
  de: Zum Jahresabschluss gehören Bilanz und Gewinn- und Verlustrechnung. Die Geschäftsführung stellt ihn in den ersten drei
    Monaten nach Ende des Geschäftsjahres auf, kleine Gesellschaften spätestens nach sechs Monaten (§ 264 Abs. 1 HGB). Die
    Gesellschafter stellen ihn innerhalb von acht Monaten fest, kleine Gesellschaften innerhalb von elf Monaten (§ 42a Abs. 2 GmbHG).
    Die Bilanz geht außerdem elektronisch als E-Bilanz ans Finanzamt.
begriffe:
- begriff:
    de: E-Bilanz
  erklaerung:
    de: Die Bilanz in elektronischer Form, die ans Finanzamt übermittelt wird.
rechtsgrundlage:
- § 264 Abs. 1 HGB
- § 42a Abs. 2 GmbHG
