# Katalog B.18 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
# Offen (Produkt, kein Prüfpunkt): Aufstellung (3/6 Monate) und Feststellung (8/11 Monate) als Termine mit Größenklasse und jährlicher Wiederholung abbilden
schema_version: 1
id: gesellschaft.jahresabschluss
version: 5
katalog_nr: B.18
titel:
  de: Jahresabschluss aufstellen und feststellen
kurz:
  de: Nach jedem Geschäftsjahr erstellst du Bilanz und Gewinn- und Verlustrechnung; die Gesellschafter stellen den Abschluss
    fest.
erklaerung:
  de: Zum Jahresabschluss gehören Bilanz und Gewinn- und Verlustrechnung. Das gilt für UG und GmbH und ebenso für die GmbH & Co. KG, bei der keine natürliche Person unbeschränkt haftet (§ 264a HGB). Die Geschäftsführung stellt ihn in den ersten drei Monaten nach Ende des Geschäftsjahres auf, kleine Gesellschaften spätestens nach sechs Monaten (§ 264 Abs. 1 HGB). Bei GmbH und UG stellen die Gesellschafter ihn innerhalb von acht Monaten fest, kleine Gesellschaften innerhalb von elf Monaten (§ 42a Abs. 2 GmbHG). Die Bilanz geht außerdem elektronisch als E-Bilanz ans Finanzamt.
begriffe:
- begriff:
    de: E-Bilanz
  erklaerung:
    de: Die Bilanz in elektronischer Form, die ans Finanzamt übermittelt wird.
rechtsgrundlage:
- § 264 Abs. 1 HGB
- § 264a HGB
- § 42a Abs. 2 GmbHG
kategorie: gesellschaft
ausloeser:
  feld: abgeleitet.ist_kapitalgesellschaft_oder_co_kg
  op: ==
  wert: true
  label:
    de: Dein Unternehmen ist eine UG, GmbH oder GmbH & Co. KG.
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du und die Gesellschafter; Finanzamt (E-Bilanz)
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Ein eigenes Bußgeld für die verspätete Aufstellung nennt das Gesetz nicht. Wer die Bilanz nicht in der vorgeschriebenen Zeit aufstellt, macht sich strafbar, wenn die Gesellschaft später ihre Zahlungen einstellt oder ein Insolvenzverfahren eröffnet oder mangels Masse abgelehnt wird: Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe, bei Fahrlässigkeit bis zu einem Jahr (§ 283b Abs. 1 Nr. 3 Buchst. b, Abs. 2, 3 StGB in Verbindung mit § 283 Abs. 6 StGB).'
