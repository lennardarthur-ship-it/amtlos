# R12 (Nutzertest Kfz #10): Ausbildungsvertrag eintragen lassen (§ 36 BBiG)
schema_version: 1
id: personal.azubi_eintragung
version: 1
katalog_nr: D.45
titel:
  de: Ausbildungsvertrag ins Verzeichnis eintragen lassen
kurz:
  de: Den Ausbildungsvertrag meldest du gleich nach Abschluss bei deiner Kammer zur Eintragung ins Verzeichnis der Berufsausbildungsverhältnisse an.
erklaerung:
  de: Ausbildende beantragen unverzüglich nach Abschluss des Berufsausbildungsvertrags die Eintragung in das Verzeichnis der Berufsausbildungsverhältnisse bei der zuständigen Stelle – im Handwerk bei der Handwerkskammer (Lehrlingsrolle), sonst meist bei der IHK (§ 36 Abs. 1 BBiG). Eine Ausfertigung der Vertragsniederschrift fügst du bei. Ohne Eintragung wird der Azubi nicht zur Abschlussprüfung zugelassen.
rechtsgrundlage:
- § 36 Abs. 1 BBiG
- § 43 Abs. 1 BBiG
