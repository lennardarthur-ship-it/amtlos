# R12 (Nutzertest Kfz #10): Ausbildungsvertrag eintragen lassen (§ 36 BBiG)
schema_version: 1
id: personal.azubi_eintragung
version: 3
katalog_nr: D.45
titel:
  de: Ausbildungsvertrag ins Verzeichnis eintragen lassen
kurz:
  de: Den Ausbildungsvertrag meldest du gleich nach Abschluss bei deiner Kammer zur Eintragung ins Verzeichnis der Berufsausbildungsverhältnisse an.
erklaerung:
  de: Ausbildende beantragen unverzüglich nach Abschluss des Berufsausbildungsvertrags die Eintragung in das Verzeichnis der Berufsausbildungsverhältnisse bei der zuständigen Stelle – im Handwerk bei der Handwerkskammer (Lehrlingsrolle), sonst meist bei der IHK (§ 36 Abs. 1 BBiG) – am besten gleich nach der Unterschrift; als spätesten Termin zeigt Amtlos den Ausbildungsbeginn. Eine Ausfertigung der Vertragsniederschrift fügst du bei. Ohne Eintragung wird der Azubi nicht zur Abschlussprüfung zugelassen.
rechtsgrundlage:
- § 36 Abs. 1 BBiG
- § 43 Abs. 1 BBiG
kategorie: personal
branchen:
- handwerk
ausloeser:
  all:
  - feld: profil.beschaeftigte.azubi
    op: '>='
    wert: 1
    label:
      de: Du bildest aus.
  - ereignis: einstellung
    op: eingetreten
    label:
      de: Du stellst jemanden ein.
