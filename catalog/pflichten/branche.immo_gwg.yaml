fachlich_zu_pruefen:
- Frist nicht in der Spezifikation genannt – Frist und Verschiebung fachlich ergänzen
- 'Prüfvermerk Rechtsanwalt 22.10.2026: § 2 Abs. 1 Nr. 14, Nr. 6 ff. GwG und Sanktion § 56 bestätigt; Auslöser auf Makler und Vermittler verfeinert (Erlaubnis nach § 34c, § 34d, § 34f, § 34i GewO) – § 34c umfasst auch Wohnimmobilienverwalter, § 34d alle Versicherungsvermittler (GwG nur bei Lebensversicherungen): der Auslöser ist dort weiter als die Pflicht'
- 'Vorprüfung 21.10.2026: Schwere vorläufig von „hoch“ auf „mittel“ gesenkt, bis die Sanktion fachlich erfasst ist (Sanktion in der Vorprüfung nicht an der Primärquelle belegt) – nach Ergänzung wieder „hoch“'
