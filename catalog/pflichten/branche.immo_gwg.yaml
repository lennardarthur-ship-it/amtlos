# Katalog H.8 · Startbestand aus Spezifikation Abschnitt 4 (E-054), ungeprüft
schema_version: 1
id: branche.immo_gwg
version: 4
katalog_nr: H.8
titel:
  de: Geldwäschegesetz für Immobilien- und Finanzbranche
kurz:
  de: Immobilienmakler und viele Finanzdienstleister sind Verpflichtete nach dem Geldwäschegesetz.
erklaerung:
  de: Verpflichtet sind unter anderem Immobilienmakler (§ 2 Abs. 1 Nr. 14 GwG), Finanzanlagen- und Darlehensvermittler sowie Versicherungsvermittler, soweit sie Lebensversicherungen vermitteln (§ 2 Abs. 1 Nr. 6 ff. GwG). Dazu gehören Risikoanalyse, Identifizierung der Vertragspartner und Verdachtsmeldungen.
rechtsgrundlage:
- § 2 GwG
kategorie: branche
branchen:
- immobilien_finanzen
ausloeser:
  all:
  - feld: profil.taetigkeit.branchen
    op: enthaelt
    wert: immobilien_finanzen
    label:
      de: Dein Betrieb gehört zur Immobilien- oder Finanzbranche.
  # Prüfvermerk Rechtsanwalt 22.10.2026: Makler, Finanzanlagenvermittler, Versicherungsvermittler, Darlehensvermittler
  - feld: profil.erlaubnis.gewo_paragraphen
    op: enthaelt_eines
    wert:
    - 34c
    - 34d
    - 34f
    - 34i
    label:
      de: Du bist als Makler oder als Finanzanlagen-, Versicherungs- oder Darlehensvermittler tätig (Erlaubnis nach § 34c, § 34d, § 34f oder § 34i GewO).
frist:
  typ: dauerhaft
wiederholung:
  art: einmalig
stelle:
  de: Du selbst; Aufsicht der Länder bzw. BaFin
kanal: intern_dokumentieren
kosten: null
sanktion:
  text:
    de: 'Bußgeld bis 150.000 € bei Vorsatz, sonst bis 100.000 €, etwa wenn Risikoanalyse, interne Sicherungsmaßnahmen oder die Identifizierung fehlen; bei schwerwiegenden, wiederholten oder systematischen Verstößen bis 1 Mio. € oder bis zum Zweifachen des wirtschaftlichen Vorteils, für Verpflichtete nach § 2 Abs. 1 Nr. 1 bis 3 und 6 bis 9 GwG auch mehr (§ 56 Abs. 1 Satz 1 Nr. 1, 3, 15, Abs. 3 GwG).'
  schwere: mittel
dringend_ohne_termin: true
automatisierung: hinweis
status_recht: in_kraft
