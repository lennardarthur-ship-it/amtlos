- Welche Tätigkeiten genau (Makler, Vermittler) – Auslöser verfeinern
- 'Vorprüfung 22.10.2026: Sanktion aus dem Wortlaut ergänzt – § 56 Abs. 1 Satz 1 Nr. 1 (§ 5 Abs. 1), Nr. 3 (§ 6 Abs. 1), Nr. 15 (§ 10 Abs. 1 Nr. 1) und Abs. 3 GwG gelesen; Höchstbeträge für Verpflichtete nach § 2 Abs. 1 Nr. 1 bis 3, 6 bis 9 (5 Mio. € bzw. 10 % des Gesamtumsatzes) nicht im Text beziffert – fachlich zu bestätigen'
